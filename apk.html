<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>무등산 산악사고 구조요청</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Pretendard', sans-serif;
}

body{
    background:#e9e9e9;
    max-width:430px;
    margin:auto;
    min-height:100vh;
    overflow-x:hidden;
}

/* 상단 헤더 */

.header{
    background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1400&auto=format&fit=crop');

    background-size:cover;
    background-position:center;

    height:200px;

    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    border-bottom-left-radius:28px;
    border-bottom-right-radius:28px;
}

/* 로고 */

.logo{
    width:72px;
    height:72px;

    border-radius:50%;

    background:white;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:12px;

    animation:pulse 1.5s infinite;

    box-shadow:0 0 0 rgba(229,57,53,0.5);
}

.sos{
    color:#e53935;

    font-size:28px;
    font-weight:900;

    letter-spacing:2px;
}

@keyframes pulse{

    0%{
        transform:scale(1);
        box-shadow:0 0 0 0 rgba(229,57,53,0.6);
    }

    70%{
        transform:scale(1.05);
        box-shadow:0 0 0 16px rgba(229,57,53,0);
    }

    100%{
        transform:scale(1);
        box-shadow:0 0 0 0 rgba(229,57,53,0);
    }

}

/* 제목 */

.title{
    font-size:28px;
    font-weight:700;
    letter-spacing:-1px;
    text-align:center;
}

.subtitle{
    margin-top:8px;
    font-size:14px;
    opacity:0.92;
}

/* 메뉴 */

.menu-grid{
    padding:22px 16px 120px;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:14px;
}

.menu-card{
    background:white;

    border-radius:18px;

    padding:16px 10px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:8px;

    min-height:120px;

    box-shadow:0 3px 10px rgba(0,0,0,0.07);

    transition:0.2s;
}

.menu-card:active{
    transform:scale(0.96);
}

.menu-icon{
    font-size:32px;
}

.menu-text{
    font-size:16px;
    font-weight:700;
    color:#222;
}

/* 버튼 */

.open-btn{

    margin-top:6px;

    border:none;

    background:#1e88e5;

    color:white;

    padding:8px 14px;

    border-radius:10px;

    font-size:13px;
    font-weight:600;

    cursor:pointer;
}

.open-btn:active{
    transform:scale(0.95);
}

/* 하단 메뉴 */

.bottom-nav{

    position:fixed;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:100%;
    max-width:430px;

    background:#111;

    height:74px;

    display:flex;
    justify-content:space-around;
    align-items:center;

    border-top-left-radius:20px;
    border-top-right-radius:20px;

    z-index:999;
}

.nav-item{

    color:white;

    text-decoration:none;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:4px;

    font-size:11px;

    cursor:pointer;
}

.nav-icon{
    font-size:21px;
}

.active{
    color:#29b6ff;
}

</style>
</head>

<body>

<!-- 상단 -->

<div class="header">

    <div class="logo">
        <span class="sos">SOS</span>
    </div>

    <div class="title">
        무등산 산악사고 구조요청
    </div>

    <div class="subtitle">
        무등산특수산악구조팀
    </div>

</div>

<!-- 메뉴 -->

<div class="menu-grid">

   
    <!-- 문자전송 -->

    <div class="menu-card">

        <div class="menu-icon">📞</div>

        <div class="menu-text">
            문자전송
        </div>

        <button class="open-btn"
        onclick="window.open('https://mudeung.github.io/rescue/gpscall.html', '_blank')">
            바로가기
        </button>

    </div>

    <!-- 위치링크 -->

    <div class="menu-card">

        <div class="menu-icon">📍</div>

        <div class="menu-text">
            위치링크
        </div>

        <button class="open-btn"
        onclick="window.open('https://mudeung.github.io/rescue/gps.html', '_blank')">
            바로가기
        </button>

    </div>

    <!-- 위치목록 -->

    <div class="menu-card">

        <div class="menu-icon">🗺️</div>

        <div class="menu-text">
            위치목록
        </div>

        <button class="open-btn"
        onclick="window.open('https://mudeung.github.io/rescue/emscall.html', '_blank')">
            바로가기
        </button>

    </div>

    <!-- 좌표입력 -->

    <div class="menu-card">

        <div class="menu-icon">🧭</div>

        <div class="menu-text">
            좌표입력
        </div>

        <button class="open-btn"
        onclick="window.open('https://mudeung.github.io/rescue/xyzgps.html', '_blank')">
            바로가기
        </button>

    </div>

</div>

<!-- 하단 메뉴 -->

<div class="bottom-nav">

    <!-- 실시간 위치 -->

    <div class="nav-item active"
    onclick="window.open('https://mudeung.github.io/rescue/gpsgps.html', '_blank')">

        <div class="nav-icon">👥</div>

        <div>실시간 위치</div>

    </div>

    <!-- GPS 내위치 -->

    <div class="nav-item"
    onclick="window.open('https://mudeung.github.io/rescue/xyzgps.html', '_blank')">

        <div class="nav-icon">📡</div>

        <div>GPS 내위치</div>

    </div>

    <!-- 사진 좌표 -->

    <div class="nav-item"
    onclick="window.open('https://emtcsh.github.io/potogps.html', '_blank')">

        <div class="nav-icon">🗺️</div>

        <div>사진좌표</div>

    </div>

   <!-- 내정보 -->

    <div class="nav-item"
    onclick="window.open('https://rescuemd.imweb.me', '_blank')">

        <div class="nav-icon">👤</div>

         <div>무등산특수산악구조팀</div>

    </div>

</div>

</body>
</html>

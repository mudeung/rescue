<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>산악사고 구조요청</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Pretendard', sans-serif;
}

body{
    background:#e9e9e9;
    max-width:430px;
    margin:auto;
    min-height:100vh;
    overflow-x:hidden;
}

/* 상단 헤더 */

.header{
    background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop');

    background-size:cover;
    background-position:center;

    height:200px;

    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    border-bottom-left-radius:28px;
    border-bottom-right-radius:28px;
}

.logo{
    width:70px;
    height:70px;
    border-radius:50%;
    background:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;

    margin-bottom:12px;
}

.title{
    font-size:30px;
    font-weight:700;
    letter-spacing:-1px;
}

.subtitle{
    margin-top:8px;
    font-size:15px;
    opacity:0.92;
}

/* 메뉴 */

.menu-grid{
    padding:24px 18px 120px;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:16px;
}

.menu-card{
    background:white;

    border-radius:22px;

    padding:22px 12px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:10px;

    min-height:150px;

    box-shadow:0 4px 14px rgba(0,0,0,0.08);

    transition:0.2s;
}

.menu-card:active{
    transform:scale(0.96);
}

.menu-icon{
    font-size:40px;
}

.menu-text{
    font-size:18px;
    font-weight:700;
    color:#222;
}

/* 버튼 */

.open-btn{
    margin-top:8px;

    border:none;
    background:#1e88e5;

    color:white;

    padding:10px 18px;

    border-radius:12px;

    font-size:14px;
    font-weight:600;

    cursor:pointer;
}

.open-btn:active{
    transform:scale(0.95);
}

/* 하단 메뉴 */

.bottom-nav{
    position:fixed;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:100%;
    max-width:430px;

    background:#111;

    height:78px;

    display:flex;
    justify-content:space-around;
    align-items:center;

    border-top-left-radius:20px;
    border-top-right-radius:20px;

    z-index:999;
}

.nav-item{
    color:white;
    text-decoration:none;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:4px;

    font-size:11px;

    cursor:pointer;
}

.nav-icon{
    font-size:22px;
}

.active{
    color:#29b6ff;
}

</style>
</head>

<body>

<!-- 상단 -->

<div class="header">

    <div class="logo"></div>

    <div class="title">
        산악사고 구조요청
    </div>

    <div class="subtitle">
        무등산특수산악구조팀
    </div>

</div>

<!-- 메뉴 -->

<div class="menu-grid">

    <!-- 게시판 -->

    <div class="menu-card">

        <div class="menu-icon">📋</div>

        <div class="menu-text">
            게시판
        </div>

        <button class="open-btn"
        onclick="window.open('https://mudeung.github.io/rescue/', '_blank')">
            바로가기
        </button>

    </div>

    <!-- 채팅 -->

    <div class="menu-card">

        <div class="menu-icon">💬</div>

        <div class="menu-text">
            채팅
        </div>

        <button class="open-btn"
        onclick="window.open('https://open.kakao.com/', '_blank')">
            바로가기
        </button>

    </div>

    <!-- 문자전송 -->

    <div class="menu-card">

        <div class="menu-icon">📞</div>

        <div class="menu-text">
            문자전송
        </div>

        <button class="open-btn"
        onclick="window.open('https://mudeung.github.io/rescue/gpscall.html', '_blank')">
            바로가기
        </button>

    </div>

    <!-- 위치링크 -->

    <div class="menu-card">

        <div class="menu-icon">📍</div>

        <div class="menu-text">
            위치링크
        </div>

        <button class="open-btn"
        onclick="window.open('https://mudeung.github.io/rescue/gps.html', '_blank')">
            바로가기
        </button>

    </div>

    <!-- 위치목록 -->

    <div class="menu-card">

        <div class="menu-icon">🗺️</div>

        <div class="menu-text">
            위치목록
        </div>

        <button class="open-btn"
        onclick="window.open('https://mudeung.github.io/rescue/emscall.html', '_blank')">
            바로가기
        </button>

    </div>

    <!-- 좌표입력 -->

    <div class="menu-card">

        <div class="menu-icon">🧭</div>

        <div class="menu-text">
            좌표입력
        </div>

        <button class="open-btn"
        onclick="window.open('https://mudeung.github.io/rescue/xyzgps.html', '_blank')">
            바로가기
        </button>

    </div>

</div>

<!-- 하단 메뉴 -->

<div class="bottom-nav">

    <!-- 실시간 위치 -->

    <div class="nav-item active"
    onclick="window.open('https://mudeung.github.io/rescue/gpsgps.html', '_blank')">

        <div class="nav-icon">👥</div>

        <div>
            실시간 위치
        </div>

    </div>

    <!-- GPS 내위치 -->

    <div class="nav-item"
    onclick="window.open('https://mudeung.github.io/rescue/xyzgps.html', '_blank')">

        <div class="nav-icon">📡</div>

        <div>
            GPS 내위치
        </div>

    </div>

    <!-- 사진 좌표 -->

    <div class="nav-item"
    onclick="window.open('https://emtcsh.github.io/potogps.html', '_blank')">

        <div class="nav-icon">🗺️</div>

        <div>
            사진 좌표확인
        </div>

    </div>

    <!-- 내정보 -->

    <div class="nav-item"
    onclick="alert('내정보 준비중')">

        <div class="nav-icon">👤</div>

        <div>
            내정보
        </div>

    </div>

</div>

</body>
</html>

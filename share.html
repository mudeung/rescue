<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">

      content="width=device-width, initial-scale=1.0">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
}

body{
    background:#050b18;
    color:#00ff9d;
    font-family:monospace;
    overflow:hidden;
}

/* =====================================================
   HEADER
===================================================== */

header{
    height:50px;
    background:#071a2f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
    border-bottom:1px solid #123c55;
    position:relative;
    z-index:2000;
}

/* =====================================================
   MAP
===================================================== */

#map{
    position:absolute;
    top:50px;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    height:calc(100vh - 50px);
}

/* =====================================================
   사고 건수
===================================================== */

#accidentCount{
    position:absolute;

/* =====================================================
   좌표
===================================================== */

.mouse-coords{

    color:#00ff9d;
    border:1px solid #00ff9d;
    border-radius:5px;
    padding:6px 10px;
    font-size:12px;

}

/* =====================================================
   팝업
===================================================== */

.leaflet-popup-content-wrapper{

    color:#111 !important;
    border-radius:8px;
}

.leaflet-popup-content{

.leaflet-popup-tip{

}

.accident-popup{

}

}

.popup-title{

}

.popup-status{

    padding:4px 9px;

    margin-bottom:8px;
}

.popup-received{
    background:#d50000;
}

.popup-arrived{
    background:#ef6c00;
}

.popup-done{
    background:#666;
}

.popup-row{
    margin-top:5px;
}

.popup-label{
    font-weight:bold;

}

.popup-value{

}

.transmission-number{

.popup-buttons{

}

.popup-button{

    border-radius:5px;

    text-decoration:none;

    font-weight:bold;

}

.call-button{
    background:#700000;
}

.map-button{
    background:#1769aa;
}

.share-button{
    background:#555;
}

.arrive-button{
    background:#ef6c00;
}

.complete-button{

}

.status-message{

}

/* =====================================================
   Leaflet Layer Control
===================================================== */

.leaflet-control-layers{
    z-index:1600 !important;

}

.leaflet-control-layers-expanded{

}

/* =====================================================
   AI BUTTON
===================================================== */

#aiSearchButton{

    bottom:20px;

}

/* =====================================================

===================================================== */

#aiSearchPanel{

.ai-header-title{

.ai-header-sub{

.ai-examples{

}

        min-width:240px;
    }

<body>

<header>
🛰 SEARCH & RESCUE AI Ver1.2
</header>

<div id="accidentCount">
    🆘 사고정보 0건
</div>

<div id="map"></div>

<button

    type="button"
    onclick="openAISearch()"
>
    🧠 AI 검색
</button>

<div id="aiSearchPanel">

                접수
            </button>

            <button onclick="setAIQuestion('현장도착 사고 보여줘')">
                현장도착
            </button>

            <button onclick="setAIQuestion('완료 사고 보여줘')">

            </button>

            <button onclick="setAIQuestion('가장 오래된 사고 보여줘')">
                오래된 사고
            </button>

            <button onclick="setAIQuestion('전송번호 찾아줘')">

            <br>
            • 10분 이상 미처리 사고 찾아줘
            <br>
            • 장불재 사고 보여줘
            <br>
            • 실족 사고 찾아줘
            <br>
            • 현장도착 사고 몇 건이야?
            <br>
            • 가장 오래된 사고 보여줘
            <br>
            • 최근 사고 보여줘
            <br>
            • 전송번호 TX-001 찾아줘

        </div>

    </div>

</div>

<audio
    id="alertSound"
    preload="auto"
>
    <source
        src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
        type="audio/ogg"
    >
</audio>

<script>

/* =====================================================
   API 설정
===================================================== */

const ACCIDENT_API_URL =
"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


/* =====================================================
   ★ VWorld API KEY
===================================================== */

const VWORLD_API_KEY =
"17E55CB7-9CCF-4A99-8FAE-28329C41E5C5";


/* =====================================================
   STATE
===================================================== */

let accidentTimer = null;
let accidentLoading = false;
let firstLoad = true;

let knownIds = new Set();
let alertedOverdueIds = new Set();

let currentAccidentData = [];

const accidentMarkers = new Map();


/* =====================================================
   DOM
===================================================== */

const accidentCount =
    document.getElementById("accidentCount");

const alertSound =
    document.getElementById("alertSound");


/* =====================================================
   MAP
===================================================== */

const map =
    L.map("map",{
        zoomControl:true,
        preferCanvas:true
    })
    .setView(
        [35.1345,126.9902],
        13
    );


/* =====================================================
   Leaflet 기본지도
===================================================== */

const osm =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    );


const topo =
    L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        {
            maxZoom:17,
            attribution:
                "&copy; OpenTopoMap"
        }
    );


/* =====================================================
   VWorld 일반지도
===================================================== */

const vworldNormal =
    L.tileLayer(
        "https://api.vworld.kr/req/wmts/1.0.0/" +
        VWORLD_API_KEY +
        "/Base/{z}/{y}/{x}.png",
        {
            maxZoom:19,
            minZoom:0,
            attribution:"© VWorld"
        }
    );


/* =====================================================
   VWorld 위성지도
===================================================== */

const vworldSatellite =
    L.tileLayer(
        "https://api.vworld.kr/req/wmts/1.0.0/" +
        VWORLD_API_KEY +
        "/Satellite/{z}/{y}/{x}.jpeg",
        {
            maxZoom:19,
            minZoom:0,
            attribution:"© VWorld"
        }
    );


/* =====================================================
   VWorld 하이브리드
   위성 위에 투명한 지도/시설명 등을 표시
===================================================== */

const vworldHybrid =
    L.tileLayer(
        "https://api.vworld.kr/req/wmts/1.0.0/" +
        VWORLD_API_KEY +
        "/Hybrid/{z}/{y}/{x}.png",
        {
            maxZoom:19,
            minZoom:0,
            opacity:1,
            attribution:"© VWorld"
        }
    );


/* =====================================================
   사고정보 레이어
===================================================== */

const accidentLayer =
    L.layerGroup();


/* =====================================================
   VWorld 하이브리드 그룹
   Satellite + Hybrid
===================================================== */

const vworldHybridGroup =
    L.layerGroup([
        vworldSatellite,
        vworldHybrid
    ]);


/* =====================================================
   기본 지도
===================================================== */

/*
 * 기본으로 VWorld 일반지도를 표시
 *
 * VWorld 키가 아직 없으면 OSM으로 자동 대체
 */

if(
    VWORLD_API_KEY &&
    VWORLD_API_KEY !== "YOUR_VWORLD_API_KEY"
){

    vworldNormal.addTo(map);

}
else{

    osm.addTo(map);

}


/* =====================================================
   Leaflet Layer Control
===================================================== */

const baseMaps = {

    "🗺 Leaflet 일반지도":
        osm,

    "⛰ Leaflet 지형지도":
        topo,

    "🇰🇷 VWorld 일반지도":
        vworldNormal,

    "🛰 VWorld 위성지도":
        vworldSatellite,

    "🌐 VWorld 하이브리드":
        vworldHybridGroup

};


const overlayMaps = {

    "🆘 사고정보":
        accidentLayer

};


L.control.layers(
    baseMaps,
    overlayMaps,
    {
        position:"topright",
        collapsed:false
    }
).addTo(map);


/* =====================================================
   사고정보 기본 표시
===================================================== */

accidentLayer.addTo(map);


/* =====================================================
   좌표 표시
===================================================== */

const coordControl =
    L.control({
        position:"bottomleft"
    });


coordControl.onAdd =
function(){

    this._div =
        L.DomUtil.create(
            "div",
            "mouse-coords"
        );

    this._div.innerHTML =
        "Lat : --<br>Lng : --";

    return this._div;

};


coordControl.addTo(map);


map.on(
    "mousemove",
    function(e){

        coordControl._div.innerHTML =
            "Lat : " +
            e.latlng.lat.toFixed(6) +
            "<br>Lng : " +
            e.latlng.lng.toFixed(6);

    }
);


map.on(
    "mouseout",
    function(){

        coordControl._div.innerHTML =
            "Lat : --<br>Lng : --";

    }
);


/* =====================================================
   ALERT
===================================================== */

function playAlert(){

    try{

        alertSound.currentTime = 0;

        const promise =
            alertSound.play();

        if(
            promise &&
            typeof promise.catch === "function"
        ){

            promise.catch(
                function(){
                    console.log(
                        "브라우저 자동재생 정책으로 알림음이 차단되었습니다."
                    );
                }
            );

        }

    }
    catch(err){

        console.error(
            "알림음 오류:",
            err
        );

    }

}


/* =====================================================
   POST
===================================================== */

async function postAccident(payload){

    const response =
        await fetch(
            ACCIDENT_API_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },
                body:
                    JSON.stringify(payload)
            }
        );

    const text =
        await response.text();

    let data;

    try{

        data = JSON.parse(text);

    }
    catch(e){

        data = {
            result:
                response.ok
                ? "success"
                : "error",
            message:text
        };

    }

    if(!response.ok){

        throw new Error(
            data.message ||
            "HTTP " +
            response.status
        );

    }

    return data;

}


/* =====================================================
   GET
===================================================== */

async function getAccidents(){

    const response =
        await fetch(
            ACCIDENT_API_URL +
            "?action=list&t=" +
            Date.now(),
            {
                method:"GET",
                cache:"no-store"
            }
        );

    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }

    const data =
        await response.json();


    if(Array.isArray(data)){
        return data;
    }

    if(
        data &&
        Array.isArray(data.data)
    ){
        return data.data;
    }

    if(
        data &&
        Array.isArray(data.items)
    ){
        return data.items;
    }

    if(
        data &&
        Array.isArray(data.rows)
    ){
        return data.rows;
    }

    return [];

}


/* =====================================================
   문자열 정규화
===================================================== */

function normalizeKey(value){

    return String(value ?? "")
        .replace(/^\uFEFF/,"")
        .replace(/\u200B/g,"")
        .replace(/\u00A0/g,"")
        .replace(/\s+/g,"")
        .replace(/[_\-.:]/g,"")
        .toLowerCase()
        .trim();

}


/* =====================================================
   값 정규화
===================================================== */

function normalizeValue(value){

    if(
        value === undefined ||
        value === null
    ){
        return "";
    }

    return String(value)
        .replace(/^\uFEFF/,"")
        .replace(/\u200B/g,"")
        .replace(/\u00A0/g," ")
        .trim();

}


/* =====================================================
   FIELD
===================================================== */

function getField(item,names){

    if(
        !item ||
        typeof item !== "object"
    ){
        return "";
    }


    for(const name of names){

        if(
            Object.prototype.hasOwnProperty.call(
                item,
                name
            )
        ){

            const value =
                normalizeValue(
                    item[name]
                );

            if(value !== ""){
                return value;
            }

        }

    }


    const itemKeys =
        Object.keys(item);


    for(const name of names){

        const target =
            normalizeKey(name);

        for(const key of itemKeys){

            if(
                normalizeKey(key) === target
            ){

                const value =
                    normalizeValue(
                        item[key]
                    );

                if(value !== ""){
                    return value;
                }

            }

        }

    }


    return "";

}


/* =====================================================
   전송번호
===================================================== */

function getTransmissionNumber(item){

    if(
        !item ||
        typeof item !== "object"
    ){
        return "";
    }


    const names = [

        "전송번호",
        "전송 번호",
        "transmissionNumber",
        "transmissionNo",
        "transmissionID",
        "transmissionId",
        "transferNumber",
        "transferNo",
        "transferID",
        "transferId",
        "sendNumber",
        "sendNo",
        "sendID",
        "sendId",
        "전송ID",
        "전송 ID",
        "전송아이디",
        "전송코드",
        "전송 코드",
        "transmission",
        "transfer",
        "send"

    ];


    const direct =
        getField(
            item,
            names
        );


    if(direct !== ""){
        return direct;
    }


    for(
        const key of Object.keys(item)
    ){

        const normalized =
            normalizeKey(key);


        const possible =
            normalized.includes("전송번호") ||
            normalized.includes("전송id") ||
            normalized.includes("전송코드") ||
            normalized.includes("transmissionnumber") ||
            normalized.includes("transmissionno") ||
            normalized.includes("transmissionid") ||
            normalized.includes("transfernumber") ||
            normalized.includes("transferno") ||
            normalized.includes("transferid") ||
            normalized.includes("sendnumber") ||
            normalized.includes("sendno") ||
            normalized.includes("sendid");


        if(possible){

            const value =
                normalizeValue(
                    item[key]
                );

            if(value !== ""){
                return value;
            }

        }

    }


    return "";

}

/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(value){

    const status =
        String(value || "")
        .trim()
        .toUpperCase();


    if(
        status === "DONE" ||
        status === "완료" ||
        status === "처리완료" ||
        status === "사고처리완료"
    ){
        return "DONE";
    }


    if(
        status === "ARRIVED" ||
        status === "도착" ||
        status === "현장도착"
    ){
        return "ARRIVED";
    }


    return "RECEIVED";

}


/* =====================================================
   ELAPSED
===================================================== */

function getElapsedTime(
    startTime,
    endTime
){

    if(!startTime){
        return "-";
    }


    const start =
        new Date(startTime);


    if(
        Number.isNaN(
            start.getTime()
        )
    ){
        return "-";
    }


    const end =
        endTime
        ?
        new Date(endTime)
        :
        new Date();


    if(
        Number.isNaN(
            end.getTime()
        )
    ){
        return "-";
    }


    let diff =
        Math.floor(
            (
                end.getTime() -
                start.getTime()
            ) / 1000
        );


    if(diff < 0){
        diff = 0;
    }


    const hour =
        Math.floor(
            diff / 3600
        );


    diff %= 3600;


    const minute =
        Math.floor(
            diff / 60
        );


    const second =
        diff % 60;


    return (
        String(hour).padStart(2,"0") +
        ":" +
        String(minute).padStart(2,"0") +
        ":" +
        String(second).padStart(2,"0")
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


function escapeJS(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"')
        .replace(/\r/g,"\\r")
        .replace(/\n/g,"\\n")
        .replace(/<\/script/gi,"<\\/script");

}


/* =====================================================
   KAKAO MAP URL
===================================================== */

function getKakaoMapURL(
    lat,
    lng,
    originalURL
){

    if(originalURL){
        return String(originalURL);
    }


    if(
        Number.isFinite(lat) &&
        Number.isFinite(lng)
    ){

        return (
            "https://map.kakao.com/link/map/" +
            encodeURIComponent(
                "무등산 산악사고 위치"
            ) +
            "," +
            lat +
            "," +
            lng
        );

    }


    return "";

}

/* =====================================================

===================================================== */

async function shareAccident(
    caseId,
    transmissionNumber,
    type,
    address,
    lat,
    lng
){

    const title =
        "🆘 무등산 산악사고 위치";


    const kakaoMapURL =
        "https://map.kakao.com/link/map/" +
        encodeURIComponent(title) +
        "," +
        lat +
        "," +
        lng;


    const text =
        title +
        "\n사고번호: " +
        caseId +
        "\n전송번호: " +
        transmissionNumber +
        "\n유형: " +
        type +
        "\n주소: " +
        address +
        "\n위치: " +
        lat.toFixed(6) +
        ", " +
        lng.toFixed(6);


    try{

        if(navigator.share){

            await navigator.share({
                title:title,
                text:text,
                url:kakaoMapURL
            });

            return;

        }


        const shareText =
            text +
            "\n" +
            kakaoMapURL;


        if(navigator.clipboard){

            await navigator.clipboard.writeText(
                shareText
            );

            alert(
                "📍 사고 위치 정보가 복사되었습니다."
            );

        }
        else{

            prompt(
                "아래 내용을 복사하세요.",
                shareText
            );

        }

    }
    catch(err){

        if(
            err &&
            err.name === "AbortError"
        ){
            return;
        }

        console.error(err);

    }

}


/* =====================================================
   상태 변경
===================================================== */

async function updateAccidentStatus(
    caseId,
    newStatus
){

    const status =
        normalizeStatus(newStatus);


    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    let message = "";
    let action = "";


    if(status === "ARRIVED"){

        message =
            "🚓 현장 도착으로 변경하시겠습니까?";

        action =
            "complete";

    }
    else if(status === "DONE"){

        message =
            "✅ 구조 완료로 변경하시겠습니까?";

        action =
            "finish";

    }
    else{

        return;

    }


    if(!confirm(message)){
        return;
    }


    try{

        const result =
            await postAccident({
                action:action,
                id:String(caseId)
            });


        if(
            !result ||
            result.result !== "success"
        ){

            throw new Error(
                result &&
                result.message
                ?
                result.message
                :
                "상태 변경 실패"
            );

        }


        await loadAccidents();


        alert(
            status === "ARRIVED"
            ?
            "🚓 현장 도착 처리 완료"
            :
            "✅ 구조 완료 처리 완료"
        );

    }
    catch(err){

        console.error(err);

        alert(
            "❌ 상태 변경 실패\n\n" +
            err.message
        );

    }

}


/* =====================================================
   사고 렌더링
===================================================== */

function renderAccidents(data){

    currentAccidentData =
        Array.isArray(data)
        ? data
        : [];


    accidentMarkers.clear();


    let receivedCount = 0;
    let arrivedCount = 0;
    let doneCount = 0;


    data.forEach(
        function(item){

            const status =
                normalizeStatus(
                    getField(
                        item,
                        [
                            "status",
                            "state",
                            "상태",
                            "처리상태"
                        ]
                    )
                );


            if(status === "RECEIVED"){
                receivedCount++;
            }
            else if(status === "ARRIVED"){
                arrivedCount++;
            }
            else if(status === "DONE"){
                doneCount++;
            }

        }
    );


    accidentCount.innerHTML =
        "🆘 사고정보 " +
        data.length +
        "건" +

        "　<span style='color:#ff3333'>" +
        "🔴 " +
        receivedCount +
        "</span>" +

        "　<span style='color:#ff9800'>" +
        "🟠 " +
        arrivedCount +
        "</span>" +

        "　<span style='color:#aaa'>" +
        "⚫ " +
        doneCount +
        "</span>";


    accidentLayer.clearLayers();


    const rows =
        [...data].sort(
            function(a,b){

                const ta =
                    new Date(
                        getStartTime(a)
                    ).getTime();

                const tb =
                    new Date(
                        getStartTime(b)
                    ).getTime();


                if(Number.isNaN(ta)){
                    return 1;
                }


                if(Number.isNaN(tb)){
                    return -1;
                }


                return tb - ta;

            }
        );


    const currentIds =
        new Set();


    rows.forEach(
        function(item,index){

            const id =
                getAccidentId(
                    item,
                    index
                );


            currentIds.add(
                String(id)
            );


            const transmissionNumber =
                getTransmissionNumber(item);


            const status =
                normalizeStatus(
                    getField(
                        item,
                        [
                            "status",
                            "state",
                            "상태",
                            "처리상태"
                        ]
                    )
                );


            const startTime =
                getStartTime(item);


            const endTime =
                getField(
                    item,
                    [
                        "finishTime",
                        "endTime",
                        "completedAt",
                        "doneAt",
                        "완료시간"
                    ]
                );


            const lat =
                Number(
                    getField(
                        item,
                        [
                            "lat",
                            "latitude",
                            "위도"
                        ]
                    )
                );


            const lng =
                Number(
                    getField(
                        item,
                        [
                            "lng",
                            "longitude",
                            "경도"
                        ]
                    )
                );


            const address =
                getField(
                    item,
                    [
                        "address",
                        "주소",
                        "location",
                        "장소"
                    ]
                );


            const type =
                getField(
                    item,
                    [
                        "type",
                        "accidentType",
                        "신고유형",
                        "유형"
                    ]
                ) ||
                "기타";


            const symptom =
                getField(
                    item,
                    [
                        "symptom",
                        "condition",
                        "description",
                        "상황",
                        "내용"
                    ]
                );


            const phone =
                getField(
                    item,
                    [
                        "phone",
                        "tel",
                        "telephone",
                        "연락처"
                    ]
                );


            const kakaoOriginal =
                getField(
                    item,
                    [
                        "kakaoMapURL",
                        "kakaoUrl",
                        "mapUrl",
                        "지도URL"
                    ]
                );


            const kakaoMapURL =
                getKakaoMapURL(
                    lat,
                    lng,
                    kakaoOriginal
                );


            const elapsed =
                getElapsedTime(
                    startTime,
                    endTime || null
                );


            if(
                Number.isFinite(lat) &&
                Number.isFinite(lng)
            ){

                let markerColor =
                    "#ff0000";


                if(status === "ARRIVED"){
                    markerColor =
                        "#ff9800";
                }


                if(status === "DONE"){
                    markerColor =
                        "#777";
                }


                const marker =
                    L.circleMarker(
                        [lat,lng],
                        {
                            radius:
                                status === "DONE"
                                ? 8
                                : 11,

                            color:
                                markerColor,

                            fillColor:
                                markerColor,

                            fillOpacity:.9,

                            weight:3
                        }
                    );


                const isNew =
                    !firstLoad &&
                    !knownIds.has(
                        String(id)
                    );


                const popupHTML =
                    createAccidentPopup(
                        item,
                        id,
                        transmissionNumber,
                        status,
                        type,
                        symptom,
                        address,
                        phone,
                        startTime,
                        endTime,
                        elapsed,
                        lat,
                        lng,
                        kakaoMapURL
                    );


                marker.bindPopup(
                    popupHTML,
                    {
                        maxWidth:350,
                        minWidth:270
                    }
                );


                marker.on(
                    "click",
                    function(){

                        map.flyTo(
                            [lat,lng],
                            Math.max(
                                map.getZoom(),
                                17
                            ),
                            {
                                animate:true,
                                duration:.8
                            }
                        );

                        marker.openPopup();

                    }
                );


                marker.addTo(
                    accidentLayer
                );


                accidentMarkers.set(
                    String(id),
                    marker
                );


                if(isNew){

                    playAlert();


                    setTimeout(
                        function(){

                            map.flyTo(
                                [lat,lng],
                                17,
                                {
                                    animate:true,
                                    duration:.8
                                }
                            );


                            marker.openPopup();

                        },
                        100
                    );

                }

            }


            /* 10분 이상 미처리 */

            let overdue = false;


            if(
                status === "RECEIVED" &&
                startTime
            ){

                const start =
                    new Date(
                        startTime
                    ).getTime();


                if(Number.isFinite(start)){

                    overdue =
                        (
                            Date.now() -
                            start
                        ) / 60000 >= 10;

                }

            }


            if(
                overdue &&
                !alertedOverdueIds.has(
                    String(id)
                )
            ){

                alertedOverdueIds.add(
                    String(id)
                );


                if(!firstLoad){
                    playAlert();
                }

            }


            knownIds.add(
                String(id)
            );

        }
    );


    for(
        const oldId of knownIds
    ){

        if(
            !currentIds.has(
                String(oldId)
            )
        ){

            knownIds.delete(
                oldId
            );

        }

    }


    firstLoad = false;

}

===================================================== */

async function loadAccidents(){

    if(accidentLoading){
        return;
    }


    accidentLoading = true;


    try{

        const rows =
            await getAccidents();


        renderAccidents(rows);


        if(rows.length){

            console.log(
                "SEARCH & RESCUE API DATA:",
                rows
            );


            console.log(
                "API DATA KEYS:",
                Object.keys(
                    rows[0] || {}
                )
            );


            console.log(
                "첫 번째 전송번호:",
                getTransmissionNumber(
                    rows[0]
                )
            );

        }


        return rows;

    }
    catch(err){

        console.error(
            "사고 목록 조회 오류:",
            err
        );


        accidentCount.innerHTML =
            "⚠ 사고정보 조회 오류";


        throw err;

    }
    finally{

        accidentLoading = false;

    }

}

        "none";

}


function setAIQuestion(question){

    const input =
        document.getElementById(
            "aiQuestion"
        );


    input.value =
        question;


    input.focus();

}


document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter" &&
            document.activeElement &&
            document.activeElement.id ===
                "aiQuestion"
        ){

            e.preventDefault();

            askLocalAI();

        }

    }
);


/* =====================================================
   질문 정규화
===================================================== */

function normalizeQuestion(question){

    return String(question || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");

}


/* =====================================================
   AI 검색
===================================================== */

function askLocalAI(){

    const input =
        document.getElementById(
            "aiQuestion"
        );


    const result =
        document.getElementById(
            "aiResult"
        );


    const originalQuestion =
        input.value.trim();


    const question =
        normalizeQuestion(
            originalQuestion
        );


    if(!question){

        result.innerHTML =
            "질문을 입력해주세요.";

        return;

    }


    result.innerHTML =
        '<div class="ai-loading">' +
        "🧠 사고정보를 분석하고 있습니다..." +
        "</div>";


    setTimeout(
        function(){

            const data =
                analyzeLocalQuestion(
                    question,
                    currentAccidentData
                );


            renderLocalAIResult(
                data
            );

        },
        150
    );

}


/* =====================================================
   AI 분석
===================================================== */

function analyzeLocalQuestion(
    question,
    data
){

    let rows =
        [...data];


    let description = [];


    if(
        question.includes("몇 건") ||
        question.includes("몇건") ||
        question.includes("현황") ||
        question.includes("현재 사고")
    ){

        return {

            title:
                "현재 사고 현황",

            message:
                createSituationSummary(data),

            rows:[]

        };

    }


    if(
        question.includes("접수") ||
        question.includes("미처리")
    ){

        rows =
            rows.filter(
                item =>
                    normalizeStatus(
                        getField(
                            item,
                            [
                                "status",
                                "state",
                                "상태",
                                "처리상태"
                            ]
                        )
                    ) === "RECEIVED"
            );

        description.push("접수");

    }


    if(
        question.includes("현장도착") ||
        question.includes("현장 도착") ||
        question.includes("도착")
    ){

        rows =
            rows.filter(
                item =>
                    normalizeStatus(
                        getField(
                            item,
                            [
                                "status",
                                "state",
                                "상태",
                                "처리상태"
                            ]
                        )
                    ) === "ARRIVED"
            );

        description.push("현장도착");

    }


    if(
        question.includes("완료")
    ){

        rows =
            rows.filter(
                item =>
                    normalizeStatus(
                        getField(
                            item,
                            [
                                "status",
                                "state",
                                "상태",
                                "처리상태"
                            ]
                        )
                    ) === "DONE"
            );

        description.push("완료");

    }


    const minuteMatch =
        question.match(
            /(\d+)\s*분/
        );


    if(minuteMatch){

        const minutes =
            Number(
                minuteMatch[1]
            );


        rows =
            rows.filter(
                item => {

                    const start =
                        new Date(
                            getStartTime(item)
                        ).getTime();


                    if(!Number.isFinite(start)){
                        return false;
                    }


                    const elapsed =
                        (
                            Date.now() -
                            start
                        ) / 60000;


                    return elapsed >= minutes;

                }
            );


        description.push(
            minutes +
            "분 이상 경과"
        );

    }


    if(
        question.includes("최근") ||
        question.includes("최신")
    ){

        rows.sort(
            (a,b) =>
                new Date(
                    getStartTime(b)
                ).getTime()
                -
                new Date(
                    getStartTime(a)
                ).getTime()
        );


        rows =
            rows.slice(0,1);


        description.push(
            "최근 사고"
        );

    }


    if(
        question.includes("가장 오래된") ||
        question.includes("오래된 사고")
    ){

        rows.sort(
            (a,b) =>
                new Date(
                    getStartTime(a)
                ).getTime()
                -
                new Date(
                    getStartTime(b)
                ).getTime()
        );


        rows =
            rows.slice(0,1);


        description.push(
            "가장 오래된 사고"
        );

    }


    const keywords = [

        "실족",
        "탈진",
        "조난",
        "추락",
        "부상",
        "골절",
        "출혈",
        "의식",
        "호흡",
        "길잃음",
        "저체온",
        "열탈진",

        "장불재",
        "중머리재",
        "입석대",
        "서석대",
        "증심사",
        "새인봉",
        "원효사",
        "무등산",
        "토끼등",
        "바람재",
        "규봉암",
        "꼬막재"

    ];


    for(
        const keyword of keywords
    ){

        if(
            question.includes(keyword)
        ){

            rows =
                rows.filter(
                    item =>
                        createSearchText(
                            item
                        ).includes(
                            keyword
                        )
                );


            description.push(
                keyword
            );


            break;

        }

    }


    const transmissionMatch =
        question.match(
            /(?:전송번호|전송 번호|transmission|transfer|send)\s*[:#\-]?\s*([a-z0-9가-힣\-_]+)/i
        );


    if(transmissionMatch){

        const search =
            transmissionMatch[1]
            .toLowerCase();


        rows =
            rows.filter(
                item =>
                    getTransmissionNumber(
                        item
                    )
                    .toLowerCase()
                    .includes(search)
            );


        description.push(
            "전송번호 " +
            transmissionMatch[1]
        );

    }


    if(
        description.length === 0
    ){

        const words =
            question
            .replace(
                /찾아줘|찾아 줘|보여줘|보여 줘|검색해줘|검색해 줘|알려줘|알려 줘|해줘|줘/g,
                ""
            )
            .trim()
            .split(/\s+/)
            .filter(
                word =>
                    word.length >= 2
            );


        if(words.length){

            rows =
                rows.filter(
                    item => {

                        const text =
                            createSearchText(
                                item
                            );


                        return words.some(
                            word =>
                                text.includes(
                                    word
                                )
                        );

                    }
                );


            description.push(
                "자연어 검색"
            );

        }

    }


    return {

        title:
            description.length
            ?
            description.join(" + ")
            :
            "검색 결과",

        message:
            "검색 조건에 맞는 사고가 " +
            rows.length +
            "건입니다.",

        rows:rows

    };

}


/* =====================================================
   검색 텍스트
===================================================== */

function createSearchText(item){

    return (

        String(
            getAccidentId(
                item,
                0
            )
        ) +

        " " +

        String(
            getTransmissionNumber(
                item
            )
        ) +

        " " +

        String(
            getField(
                item,
                [
                    "type",
                    "accidentType",
                    "신고유형",
                    "유형"
                ]
            )
        ) +

        " " +

        String(
            getField(
                item,
                [
                    "symptom",
                    "condition",
                    "description",
                    "상황",
                    "내용"
                ]
            )
        ) +

        " " +

        String(
            getField(
                item,
                [
                    "address",
                    "주소",
                    "location",
                    "장소"
                ]
            )
        )

    ).toLowerCase();

}


/* =====================================================
   상황 요약
===================================================== */

function createSituationSummary(data){

    let received = 0;
    let arrived = 0;
    let done = 0;


    data.forEach(
        item => {

            const status =
                normalizeStatus(
                    getField(
                        item,
                        [
                            "status",
                            "state",
                            "상태",
                            "처리상태"
                        ]
                    )
                );


            if(status === "RECEIVED"){
                received++;
            }
            else if(status === "ARRIVED"){
                arrived++;
            }
            else if(status === "DONE"){
                done++;
            }

        }
    );


    return (

        "현재 총 " +
        data.length +
        "건입니다.\n\n" +

        "🔴 접수: " +
        received +
        "건\n" +

        "🟠 현장도착: " +
        arrived +
        "건\n" +

        "⚫ 처리완료: " +
        done +
        "건"

    );

}


/* =====================================================
   AI 결과
===================================================== */

function renderLocalAIResult(resultData){

    const result =
        document.getElementById(
            "aiResult"
        );


    let html =
        '<div class="ai-result-title">' +
        "🧠 " +
        escapeHTML(
            resultData.title
        ) +
        "</div>";


    html +=
        "<div>" +
        escapeHTML(
            resultData.message
        ).replace(
            /\n/g,
            "<br>"
        ) +
        "</div>";


    const rows =
        resultData.rows || [];


    rows.forEach(
        function(item,index){

            const id =
                getAccidentId(
                    item,
                    index
                );


            const transmissionNumber =
                getTransmissionNumber(
                    item
                );


            const type =
                getField(
                    item,
                    [
                        "type",
                        "accidentType",
                        "신고유형",
                        "유형"
                    ]
                ) ||
                "기타";


            const address =
                getField(
                    item,
                    [
                        "address",
                        "주소",
                        "location",
                        "장소"
                    ]
                );


            const symptom =
                getField(
                    item,
                    [
                        "symptom",
                        "condition",
                        "description",
                        "상황",
                        "내용"
                    ]
                );


            const status =
                normalizeStatus(
                    getField(
                        item,
                        [
                            "status",
                            "state",
                            "상태",
                            "처리상태"
                        ]
                    )
                );


            const statusText =
                status === "ARRIVED"
                ?
                "🟠 현장도착"
                :
                status === "DONE"
                ?
                "⚫ 완료"
                :
                "🔴 접수";


            const className =
                status === "ARRIVED"
                ?
                "arrived"
                :
                status === "DONE"
                ?
                "done"
                :
                "";


            html +=

                '<div class="ai-result-item ' +
                className +
                '" onclick="focusAccidentById(\'' +
                escapeJS(id) +
                '\')">' +

                "<strong>" +
                escapeHTML(id) +
                "</strong>" +

                "　" +
                statusText +

                "<br>" +

                "전송번호: " +

                "<span style='color:#5fc3ff;font-weight:bold'>" +

                escapeHTML(
                    transmissionNumber || "-"
                ) +

                "</span>" +

                "<br>" +

                "유형: " +
                escapeHTML(type) +

                "<br>" +

                "상황: " +
                escapeHTML(symptom || "-") +

                "<br>" +

                "위치: " +
                escapeHTML(address || "-") +

                "</div>";

        }
    );


    if(!rows.length){

        html +=
            '<div style="margin-top:12px;color:#888;">' +
            "📍 조건에 맞는 사고가 없습니다." +
            "</div>";

    }


    result.innerHTML =
        html;


    if(rows.length === 1){

        setTimeout(
            function(){

                focusAccidentById(
                    getAccidentId(
                        rows[0],
                        0
                    )
                );

            },
            400
        );

    }
    else if(rows.length > 1){

        setTimeout(
            function(){

                focusMultipleAccidents(
                    rows.map(
                        function(item,index){

                            return getAccidentId(
                                item,
                                index
                            );

                        }
                    )
                );

            },
            400
        );

    }

}


/* =====================================================
   사고 찾기
===================================================== */

function findAccidentById(id){

    for(
        let i = 0;
        i < currentAccidentData.length;
        i++
    ){

        const item =
            currentAccidentData[i];


        if(
            String(
                getAccidentId(
                    item,
                    i
                )
            ) ===
            String(id)
        ){

            return item;

        }

    }


    return null;

}


/* =====================================================
   지도 이동
===================================================== */

function focusAccidentById(id){

    const item =
        findAccidentById(id);


    if(!item){

        alert(
            "사고 정보를 찾을 수 없습니다."
        );

        return;

    }


    const lat =
        Number(
            getField(
                item,
                [
                    "lat",
                    "latitude",
                    "위도"
                ]
            )
        );


    const lng =
        Number(
            getField(
                item,
                [
                    "lng",
                    "longitude",
                    "경도"
                ]
            )
        );


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        alert(
            "해당 사고의 GPS 좌표가 없습니다."
        );

        return;

    }


    map.flyTo(
        [lat,lng],
        Math.max(
            map.getZoom(),
            17
        ),
        {
            animate:true,
            duration:1
        }
    );


    const marker =
        accidentMarkers.get(
            String(id)
        );


    if(marker){

        setTimeout(
            function(){

                marker.openPopup();

            },
            750
        );

    }

}


/* =====================================================
   여러 사고 이동
===================================================== */

function focusMultipleAccidents(ids){

    const points = [];


    ids.forEach(
        function(id){

            const item =
                findAccidentById(id);


            if(!item){
                return;
            }


            const lat =
                Number(
                    getField(
                        item,
                        [
                            "lat",
                            "latitude",
                            "위도"
                        ]
                    )
                );


            const lng =
                Number(
                    getField(
                        item,
                        [
                            "lng",
                            "longitude",
                            "경도"
                        ]
                    )
                );


            if(
                Number.isFinite(lat) &&
                Number.isFinite(lng)
            ){

                points.push([
                    lat,
                    lng
                ]);

            }

        }
    );


    if(!points.length){
        return;
    }


    if(points.length === 1){

        map.flyTo(
            points[0],
            17
        );

        return;

    }


    map.fitBounds(
        L.latLngBounds(points),
        {
            padding:[
                80,
                80
            ],
            maxZoom:16
        }
    );

}


/* =====================================================
   초기화
===================================================== */

window.addEventListener(
    "load",
    function(){

        startAccidentAutoRefresh();


        setTimeout(
            function(){

                map.invalidateSize();

            },
            1000
        );

    }
);

   우클릭 방지

document.addEventListener(
    "contextmenu",
    function(e){

        e.preventDefault();

    }
);

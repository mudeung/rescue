<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 산악사고 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;}
.card.done{background:#2b2b2b;opacity:0.6;}
.time{color:#ffcc00;font-size:14px;}
.status{margin-top:6px;font-weight:bold;}
.complete-btn{
  background:#2e7d32;margin-top:8px;color:#fff;border:none;
  padding:6px 10px;border-radius:4px;cursor:pointer;
}
.finish-btn{
  background:#1565c0;margin-top:8px;margin-left:6px;color:#fff;border:none;
  padding:6px 10px;border-radius:4px;cursor:pointer;
}
</style>
</head>
<body>

<header>🚨 무등산 특수구조팀 실시간 산악사고 신고공유</header>
<div class="container">
  <div id="listArea">로딩중...</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyRvv6h0Q5u0f5HHkT_mLhRlmKiOMMpBKljFzVPkTj7d1bGQmAj1S0YTvPUb9ujSSahxw/exec";
const listArea=document.getElementById("listArea");

async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();
  listArea.innerHTML="";

  if(!data.length){
    listArea.innerHTML="현재 접수된 신고가 없습니다.";
    return;
  }

  data.sort((a,b)=>new Date(b.작성시간)-new Date(a.작성시간));

  data.forEach(item=>{
    const div=document.createElement("div");
    div.className="card";

    if(item.status==="사고처리완료"){
      div.classList.add("done");
    }

    div.innerHTML=`
      <div class="time">🕒 ${new Date(item.작성시간).toLocaleString()}</div>
      👤 ${item.이름||""}<br>
      📞 ${item.연락처||""}<br>
      📍 ${item.주소||""}<br>
      📝 ${item.증상||""}<br>
      🧠 GCS : ${item.GCS||""}<br>
      <div class="status">상태 : ${item.status||""}</div>
    `;

    // 현장도착 버튼
    if(item.status==="접수완료"){
      const btn=document.createElement("button");
      btn.className="complete-btn";
      btn.innerText="현장도착";
      btn.onclick=()=>updateStatus(item.id,"complete");
      div.appendChild(btn);
    }

    // 처리완료 버튼
    if(item.status==="현장도착"){
      const btn2=document.createElement("button");
      btn2.className="finish-btn";
      btn2.innerText="사고처리완료";
      btn2.onclick=()=>updateStatus(item.id,"finish");
      div.appendChild(btn2);
    }

    listArea.appendChild(div);
  });
}

async function updateStatus(id,action){
  await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({id,action})
  });
  loadData();
}

loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

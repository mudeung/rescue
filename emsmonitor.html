<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 산악사고 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;}
.card.done{background:#2b2b2b;opacity:0.6;}
.time{color:#ffcc00;font-size:14px;}
.coord{font-size:12px;color:#aaa;}
.maplink{color:#4fc3f7;font-size:13px;text-decoration:none;}
.maplink:hover{text-decoration:underline;}
.complete-btn{
  background:#2e7d32;
  margin-top:8px;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:4px;
  cursor:pointer;
}
.complete-btn:hover{opacity:0.8;}
.record-box{
  margin-top:8px;
  background:#2a2a2a;
  padding:8px;
  border-radius:4px;
}
</style>
</head>
<body>

<header>🚨 무등산 특수구조팀 실시간 산악사고 신고공유</header>

<div class="container">
  <div id="listArea">로딩중...</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyRvv6h0Q5u0f5HHkT_mLhRlmKiOMMpBKljFzVPkTj7d1bGQmAj1S0YTvPUb9ujSSahxw/exec";
const listArea=document.getElementById("listArea");

/******** 🚑 현장도착 ********/
async function completeCase(id){
  if(!confirm("구조대원이 현장에 도착했습니까?")) return;

  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body:JSON.stringify({
      action:"complete",
      id:id
    })
  });

  loadData();
}

/******** ✅ 사고처리 완료 ********/
async function finishCase(id){
  if(!confirm("사고처리를 완료하시겠습니까?")) return;

  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body:JSON.stringify({
      action:"finish",
      id:id
    })
  });

  loadData();
}

/******** 목록 불러오기 ********/
async function loadData(){

  const res=await fetch(API_URL);
  const data=await res.json();
  listArea.innerHTML="";

  if(!data.length){
    listArea.innerHTML="현재 접수된 신고가 없습니다.";
    return;
  }

  data.sort((a,b)=>new Date(b.작성시간)-new Date(a.작성시간));

  data.forEach(item=>{

    const div=document.createElement("div");
    div.className="card"+(item.status==="사고처리완료"?" done":"");

    div.innerHTML=`
      <div class="time">🕒 접수: ${new Date(item.작성시간).toLocaleString()}</div>

      ${item.status==="현장도착" || item.status==="사고처리완료"
        ? `<div class="time">🚑 현장도착: ${item.completeTime ? new Date(item.completeTime).toLocaleString() : ""}</div>`
        : ""}

      ${item.status==="사고처리완료"
        ? `<div class="time">✅ 사고처리 완료: ${item.finishTime ? new Date(item.finishTime).toLocaleString() : ""}</div>`
        : ""}

      🏠 ${item.주소||"주소없음"}<br>
      📞 ${item.연락처||"번호없음"}<br>
      📝 ${item.증상||"내용없음"}<br>
      <div class="coord">위도: ${item.위도} / 경도: ${item.경도}</div>
      <a class="maplink" href="https://map.kakao.com/link/map/구조요청 위치,${item.위도},${item.경도}" target="_blank">📍 지도보기</a>
      
      ${item.GCS ? `<div class="record-box">🧠 GCS: ${item.GCS}</div>` : ""}
      ${item.record ? `<div class="record-box">📝 처치기록: ${item.record}</div>` : ""}

      ${
        item.status==="사고처리완료"
        ? ""
        : item.status==="현장도착"
          ? `<button class="complete-btn" onclick="finishCase('${item.id}')">✅ 사고처리 완료</button>`
          : `<button class="complete-btn" onclick="completeCase('${item.id}')">🚑 구조대원 현장도착</button>`
      }
    `;

    listArea.appendChild(div);
  });
}

loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 산악사고 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;}
.card.done{background:#2b2b2b;opacity:0.6;}
.time{color:#ffcc00;font-size:14px;}
.complete-btn{
  background:#2e7d32;margin-top:8px;color:#fff;border:none;
  padding:6px 10px;border-radius:4px;cursor:pointer;
}
</style>
</head>
<body>

<header>🚨 무등산 특수구조팀 실시간 산악사고 신고공유</header>
<div class="container">
  <div id="listArea">로딩중...</div>
</div>

<script>
const API_URL="여기에_웹앱_URL_붙여넣기";
const listArea=document.getElementById("listArea");

async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();
  listArea.innerHTML="";

  if(!data.length){
    listArea.innerHTML="현재 접수된 신고가 없습니다.";
    return;
  }

  data.sort((a,b)=>new Date(b.작성시간)-new Date(a.작성시간));

  data.forEach(item=>{
    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <div class="time">🕒 ${new Date(item.작성시간).toLocaleString()}</div>
      🏠 ${item.address||""}<br>
      📞 ${item.phone||""}<br>
      📝 ${item.symptom||""}<br>
    `;

    listArea.appendChild(div);
  });
}

loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

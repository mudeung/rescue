<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무등산 특수산악구조팀 통합 기록 시스템</title>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Arial;background:#0f172a;color:#fff;}
header{background:#1e3a8a;padding:15px;text-align:center;font-weight:bold;}

#controls{
    position:absolute;
    top:70px;
    left:10px;
    z-index:1000;
    background:#1e293b;
    padding:12px;
    border-radius:8px;
    width:230px;
}

#controls textarea{
    width:100%;
    height:70px;
    margin-bottom:8px;
    padding:6px;
    border-radius:6px;
    border:none;
    resize:none;
}

#controls button{
    display:block;
    width:100%;
    margin-bottom:6px;
    padding:8px;
    border:none;
    border-radius:6px;
    background:#1e40af;
    color:white;
    font-size:13px;
    cursor:pointer;
}

#map{
    width:100%;
    height:calc(100vh - 60px);
}
</style>
</head>

<body>

<header>무등산 특수산악구조팀 통합 기록 시스템</header>

<div id="controls">

    <textarea id="memo" placeholder="현장 기록 입력"></textarea>

    <button onclick="checkCurrentLocation()">📍 현위치 확인</button>
    <button onclick="getCurrentLocation()">💾 현위치 저장</button>
    <button onclick="startTracking()">🟢 실시간 추적 시작</button>
    <button onclick="stopTracking()">🔴 실시간 추적 종료</button>
    <button onclick="loadRecords()">📂 기록 불러오기</button>

</div>

<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424"></script>

<script>

var map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(35.131477, 126.947891),
    level: 4
});

var trackingId = null;
var currentMarker = null;
var directionOverlay = null;
var lastLat = null;
var lastLng = null;

var polyline = new kakao.maps.Polyline({
    map: map,
    path: [],
    strokeWeight: 4,
    strokeColor: '#FF0000',
    strokeOpacity: 0.8
});

/* 📍 현위치 확인 (저장 안함) */
function checkCurrentLocation(){
    navigator.geolocation.getCurrentPosition(function(position){
        updateLocation(position, false);
    });
}

/* 💾 현위치 저장 */
function getCurrentLocation(){
    navigator.geolocation.getCurrentPosition(function(position){
        updateLocation(position, true);
    });
}

/* 🟢 실시간 추적 */
function startTracking(){
    trackingId = navigator.geolocation.watchPosition(function(position){
        updateLocation(position, true);
    });
    alert("실시간 추적 시작");
}

/* 🔴 실시간 종료 */
function stopTracking(){
    if(trackingId){
        navigator.geolocation.clearWatch(trackingId);
        trackingId = null;
        alert("실시간 추적 종료");
    }
}

/* 📌 위치 업데이트 + 방향 표시 */
function updateLocation(position, saveToSheet){

    var lat = position.coords.latitude;
    var lng = position.coords.longitude;
    var memoText = document.getElementById("memo").value;

    var locPosition = new kakao.maps.LatLng(lat, lng);

    /* 현재 위치 핀 */
    if(currentMarker){
        currentMarker.setPosition(locPosition);
    }else{
        currentMarker = new kakao.maps.Marker({
            map: map,
            position: locPosition
        });
    }

    /* 이동 경로 */
    var path = polyline.getPath();
    path.push(locPosition);
    polyline.setPath(path);

    /* 🧭 이동 방향 계산 */
    if(lastLat && lastLng){
        var angle = Math.atan2(lng - lastLng, lat - lastLat) * 180 / Math.PI;

        var arrow = `<div style="
            transform: rotate(${angle}deg);
            font-size:24px;
            color:red;
        ">▲</div>`;

        if(directionOverlay){
            directionOverlay.setPosition(locPosition);
            directionOverlay.setContent(arrow);
        }else{
            directionOverlay = new kakao.maps.CustomOverlay({
                position: locPosition,
                content: arrow,
                yAnchor: 1.5
            });
            directionOverlay.setMap(map);
        }
    }

    lastLat = lat;
    lastLng = lng;

    map.panTo(locPosition);

    /* 구글 저장 */
    if(saveToSheet){
        fetch("https://script.google.com/macros/s/AKfycbzTy7OsrpW5dkIhPmdFkdIVsxfCcUUSi9lJbaeREcBsyaRWvHZkOELZISvWXjZhjXLe/exec",{
            method:"POST",
            body: JSON.stringify({
                lat:lat,
                lng:lng,
                memo:memoText
            })
        });
    }
}

/* 📂 기록 불러오기 */
function loadRecords(){

    fetch("https://script.google.com/macros/s/AKfycbzTy7OsrpW5dkIhPmdFkdIVsxfCcUUSi9lJbaeREcBsyaRWvHZkOELZISvWXjZhjXLe/exec")
    .then(res=>res.json())
    .then(data=>{

        data.forEach(item=>{

            var position = new kakao.maps.LatLng(item.lat, item.lng);

            var marker = new kakao.maps.Marker({
                map: map,
                position: position
            });

            var infowindow = new kakao.maps.InfoWindow({
                content:`<div style="padding:5px;color:black;">
                ${item.memo}<br>${item.time}
                </div>`
            });

            kakao.maps.event.addListener(marker,'click',function(){
                infowindow.open(map,marker);
            });

        });

    });
}

</script>

</body>
</html>

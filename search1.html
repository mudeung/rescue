<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>무등산 특수산악구조팀 현장조사 시스템</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:#fff;
}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:55px;
    z-index:2000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#1e3a8a;
    padding:8px 50px 8px 10px;

    text-align:center;
    font-size:16px;
    font-weight:bold;

    box-shadow:0 3px 10px rgba(0,0,0,.4);
}

/* ================= MAP ================= */

#map{
    position:absolute;
    top:55px;
    left:0;
    right:0;
    bottom:0;

    width:100%;
    height:calc(100vh - 55px);
}

/* ================= CONTROL ================= */

#controls{
    position:fixed;
    top:65px;
    left:8px;

    z-index:1500;

    width:175px;
    max-height:calc(100vh - 75px);

    overflow-y:auto;

    padding:7px;

    background:rgba(15,23,42,.94);

    border:1px solid rgba(255,255,255,.2);
    border-radius:12px;

    box-shadow:0 5px 20px rgba(0,0,0,.4);

    backdrop-filter:blur(8px);
}

/* ================= BUTTON ================= */

#controls button{
    display:block;

    width:100%;

    margin-bottom:6px;

    padding:10px 8px;

    border:0;
    border-radius:7px;

    background:#1e40af;
    color:#fff;

    font-size:12px;
    font-weight:bold;

    cursor:pointer;
}

#controls button:active{
    transform:scale(.96);
}

#controls button:last-child{
    margin-bottom:0;
}

/* ================= ZONE OFF BUTTON ================= */

#controls button.zone-off{
    background:#475569;
    color:#cbd5e1;
}

#controls button.zone-high-on{
    background:#0000cc;
}

#controls button.zone-middle-on{
    background:#ca8a04;
}

#controls button.zone-low-on{
    background:#15803d;
}

/* ================= RECORD PANEL ================= */

#recordPanel{
    position:fixed;

    left:8px;
    right:8px;
    bottom:8px;

    z-index:1800;

    max-width:500px;

    padding:10px;

    background:rgba(2,6,23,.95);

    border:1px solid #38bdf8;

    border-radius:12px;

    box-shadow:0 5px 25px rgba(0,0,0,.5);
}

/* ================= RECORD TITLE ================= */

#recordTitle{
    font-size:12px;
    font-weight:bold;

    color:#38bdf8;

    margin-bottom:6px;
}

/* ================= LOCATION INFO ================= */

#selectedLocation{
    display:none;

    margin-bottom:6px;

    padding:7px;

    background:#111827;

    border-left:3px solid #facc15;

    border-radius:5px;

    font-size:11px;

    line-height:1.5;
}

/* ================= INPUT ================= */

#recordText{
    width:100%;
    height:55px;

    resize:none;

    border:1px solid #475569;

    border-radius:7px;

    background:#020617;

    color:#fff;

    padding:9px;

    outline:none;

    font-size:13px;
}

#recordText:focus{
    border-color:#38bdf8;

    box-shadow:
        0 0 8px rgba(56,189,248,.3);
}

/* ================= RECORD BUTTON ================= */

#saveRecordBtn{
    width:100%;

    margin-top:6px;

    padding:11px;

    border:0;
    border-radius:7px;

    background:#059669;

    color:#fff;

    font-size:13px;
    font-weight:bold;
}

/* ================= RECORD LIST ================= */

#recordList{
    max-height:180px;

    overflow-y:auto;

    margin-top:7px;
}

.recordItem{
    padding:8px;

    margin-bottom:5px;

    background:#111827;

    border-left:3px solid #38bdf8;

    border-radius:5px;

    font-size:11px;

    line-height:1.5;
}

.recordItem button{
    margin-top:5px;

    margin-right:4px;

    padding:4px 7px;

    border:0;
    border-radius:4px;

    background:#dc2626;

    color:#fff;

    font-size:10px;
}

.recordItem button.moveBtn{
    background:#2563eb;
}

.recordItem button.editBtn{
    background:#059669;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    header{
        font-size:13px;
        height:48px;
    }

    #map{
        top:48px;
        height:calc(100vh - 48px);
    }

    #controls{
        top:56px;
        width:150px;
        max-height:48vh;
    }

    #controls button{
        padding:8px 5px;
        font-size:10px;
    }

    #recordPanel{
        bottom:6px;
        left:6px;
        right:6px;
    }

    #recordText{
        height:48px;
    }
}

/* ================= LOCATION LABEL ================= */

.location-label{
    background:#020617;

    color:#38bdf8;

    border:1px solid #38bdf8;

    padding:5px 8px;

    border-radius:6px;

    font-size:11px;

    font-weight:bold;

    white-space:nowrap;
}

</style>

</head>

<header>
🛰 무등산 특수산악구조팀 현장조사 시스템

<!-- ================= CONTROL ================= -->

<div id="controls">

    <button
        id="highBtn"
        class="zone-off"
        onclick="toggleZone('high')">
        🔵 고지대 OFF
    </button>

    <button
        id="middleBtn"
        class="zone-off"
        onclick="toggleZone('middle')">
        🟡 중지대 OFF
    </button>

    <button
        id="lowBtn"
        class="zone-off"
        onclick="toggleZone('low')">
        🟢 저지대 OFF
    </button>

    <button onclick="getCurrentLocation()">
        📍 현위치 가져오기
    </button>

    <button onclick="prepareRecord()">
        📝 현위치 기록
    </button>

    <button onclick="startTracking()">
        🟢 실시간 추적 시작
    </button>

    <button onclick="stopTracking()">
        🔴 실시간 추적 종료
    </button>

    <button onclick="startMeasure()">
        📏 거리 측정 시작
    </button>

    <button onclick="stopMeasure()">
        ⛔ 거리 측정 종료
    </button>

    <button onclick="resetMeasure()">
        🔄 거리 측정 리셋
    </button>

    <button onclick="showAllRecords()">
        📋 저장 기록 보기
    </button>

    <button onclick="clearAllRecords()">
        🗑 전체 기록 삭제
    </button>

</div>


<!-- ================= RECORD PANEL ================= -->

<div id="recordPanel">

    <div id="recordTitle">
        📝 기록자 / 현장기록
    </div>

    <div id="selectedLocation"></div>

    <textarea
        id="recordText"

    </textarea>

    <button
        id="saveRecordBtn"
        onclick="saveCurrentRecord()">
        💾 현재 위치 + 현장 기록 저장

    <div id="recordList"></div>

</div>

];


/* =========================================================
   ZONE VARIABLES
   ========================================================= */

var bounds =
new kakao.maps.LatLngBounds();

var infowindow =
new kakao.maps.InfoWindow({
    removable:true
});

var selectedCircle = null;

var circles = [];


/*
 * 중요:
 * 처음에는 전부 OFF
 */

var zoneVisibility = {

    high:false,
    middle:false,
    low:false

};


/* =========================================================
   ZONE DRAW
   ========================================================= */

circleData.forEach(function(data){

    var position =
        new kakao.maps.LatLng(
            data.lat,
            data.lng
        );


    var circle =
        new kakao.maps.Circle({

            center:position,

            radius:data.radius,

            strokeWeight:2,

            strokeColor:data.color,

            strokeOpacity:.9,

            fillColor:data.color,

            fillOpacity:.4,

            clickable:true,

            zIndex:1

        });


    /*
     * 처음에는 지도에 표시하지 않음
     */

    circle.setMap(null);


    var marker =
        new kakao.maps.Marker({

            position:position,

            title:data.name

        });


    /*
     * 처음에는 지도에 표시하지 않음
     */

    marker.setMap(null);


    function selectLocation(){

        /*
         * 이전 선택 복원
         */

        if(selectedCircle){

            selectedCircle.circle.setOptions({

                strokeColor:
                    selectedCircle.originalColor,

                fillColor:
                    selectedCircle.originalColor,

                fillOpacity:.4,

                strokeOpacity:.9,

                zIndex:1

            });

        }


        /*
         * 현재 선택 노란색
         */

        circle.setOptions({

            strokeColor:"#FFD700",

            fillColor:"#FFD700",

            fillOpacity:.6,

            strokeOpacity:1,

            zIndex:10

        });


        selectedCircle={

            circle:circle,

            originalColor:data.color

        };


        /*
         * 지도 이동
         */

        map.setLevel(3);

        map.panTo(position);


        /*
         * 기록창에 위치 정보 표시
         */

        showSelectedLocation(data);


        /*
         * 지도 InfoWindow
         */

        var content = `

            <div style="
                padding:10px;
                font-size:13px;
                color:#000;
                line-height:1.6;
            ">

                <strong>${escapeHTML(data.name)}</strong><br>

                위도 :
                ${data.lat}<br>

                경도 :
                ${data.lng}<br>

                반경 :
                ${data.radius}m

            </div>

        `;


        infowindow.setContent(content);

        infowindow.open(map,marker);

    }


    kakao.maps.event.addListener(
        marker,
        "click",
        selectLocation
    );

    kakao.maps.event.addListener(
        circle,
        "click",
        selectLocation
    );


    circles.push({

        circle:circle,

        marker:marker,

        zone:data.zone,

        data:data

    });


    bounds.extend(position);

});


/*
 * 처음에는 모든 구역을 OFF 상태로 유지
 */

/* =========================================================
   ZONE TOGGLE
   ========================================================= */

function toggleZone(zone){

    zoneVisibility[zone] =
        !zoneVisibility[zone];


    circles.forEach(function(item){

        if(item.zone === zone){

            item.circle.setMap(

                zoneVisibility[zone]
                ? map
                : null

            );

            item.marker.setMap(

                zoneVisibility[zone]
                ? map
                : null

            );

        }

    });


    updateZoneButton(zone);

}


/* =========================================================
   ZONE BUTTON UPDATE
   ========================================================= */

function updateZoneButton(zone){

    var button;

    var text;

    if(zone === "high"){

        button =
            document.getElementById("highBtn");

        text =
            zoneVisibility.high
            ? "🔵 고지대 ON"
            : "🔵 고지대 OFF";

    }

    else if(zone === "middle"){

        button =
            document.getElementById("middleBtn");

        text =
            zoneVisibility.middle
            ? "🟡 중지대 ON"
            : "🟡 중지대 OFF";

    }

    else{

        button =
            document.getElementById("lowBtn");

        text =
            zoneVisibility.low
            ? "🟢 저지대 ON"
            : "🟢 저지대 OFF";

    }


    button.textContent = text;


    button.classList.remove(
        "zone-off",
        "zone-high-on",
        "zone-middle-on",
        "zone-low-on"
    );


    if(!zoneVisibility[zone]){

        button.classList.add(
            "zone-off"
        );

    }
    else{

        if(zone === "high"){

            button.classList.add(
                "zone-high-on"
            );

        }

        if(zone === "middle"){

            button.classList.add(
                "zone-middle-on"
            );

        }

        if(zone === "low"){

            button.classList.add(
                "zone-low-on"
            );

        }

    }

}

var selectedZoneData = null;


/*

 * 기록자 / 현장기록 영역에 위치가 표시됨
 */

function showSelectedLocation(data){

    selectedZoneData = data;


    var box =
        document.getElementById(
            "selectedLocation"
        );


    box.style.display = "block";


    box.innerHTML = `

        📍 <strong>
        ${escapeHTML(data.name)}
        </strong>

        <br>

        위도 :
        ${data.lat}

        <br>

        경도 :
        ${data.lng}

        <br>

        반경 :
        ${data.radius}m

    /*
     * 기록내용 입력창에 포커스
     */

    document
        .getElementById("recordText")
        .focus();

}


/* =========================================================

   ========================================================= */

var userMarker = null;

var userAccuracyCircle = null;

var lastLatitude = null;

var lastLongitude = null;

var currentAccuracy = 0;


function getCurrentLocation(){

    if(!navigator.geolocation){

        alert(
            "이 기기에서 GPS를 사용할 수 없습니다."
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            currentAccuracy =
                position.coords.accuracy || 0;


            saveAndDisplay(

                position.coords.latitude,

                position.coords.longitude,

                position.coords.accuracy

            );

        },

        function(error){

            alert(
                "GPS 오류 : " +
                error.message
            );

        },

        {

            enableHighAccuracy:true,

            maximumAge:1000,

            timeout:15000

        }

    );

}


/* =========================================================
   DISPLAY LOCATION
   ========================================================= */

function saveAndDisplay(
    lat,
    lng,
    accuracy
){

    lastLatitude = lat;

    lastLongitude = lng;

    currentAccuracy =
        accuracy || 0;


    var locPosition =
        new kakao.maps.LatLng(
            lat,
            lng
        );


    if(userMarker){

        userMarker.setPosition(
            locPosition
        );

    }
    else{

        userMarker =
            new kakao.maps.Marker({

                map:map,

                position:locPosition

            });

    }


    if(userAccuracyCircle){

        userAccuracyCircle.setPosition(
            locPosition
        );

        userAccuracyCircle.setRadius(
            accuracy || 20
        );

    }
    else{

        userAccuracyCircle =
            new kakao.maps.Circle({

                map:map,

                center:locPosition,

                radius:accuracy || 20,

                strokeWeight:1,

                strokeColor:"#00FFFF",

                strokeOpacity:.7,

                fillColor:"#00FFFF",

                fillOpacity:.12

            });

    }


    map.panTo(locPosition);


    /*
     * 기록창에 현재 위치 표시
     */

    var box =
        document.getElementById(
            "selectedLocation"
        );


    box.style.display = "block";


    box.innerHTML = `

        📍 <strong>현재 GPS 위치</strong>

        <br>

        위도 :
        ${lat.toFixed(6)}

        <br>

        경도 :
        ${lng.toFixed(6)}

        <br>

        GPS 정확도 :
        ${Math.round(accuracy || 0)}m

    `;

}


/* =========================================================
   PREPARE RECORD
   ========================================================= */

function prepareRecord(){

    getCurrentLocation();

    setTimeout(function(){

        document
            .getElementById("recordText")
            .focus();

    },1000);

}


/* =========================================================
   RECORD STORAGE
   ========================================================= */

var STORAGE_KEY =
"MUDEUNG_MOUNTAIN_RECORDS";


function getRecords(){

    try{

        return JSON.parse(

            localStorage.getItem(
                STORAGE_KEY
            ) || "[]"

        );

    }
    catch(e){

        return [];

    }

}


function saveRecords(records){

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(records)

    );

}


/* =========================================================
   SAVE CURRENT RECORD
   ========================================================= */

function saveCurrentRecord(){

    if(
        lastLatitude === null ||
        lastLongitude === null
    ){

        alert(
            "먼저 📍 현위치를 가져오세요."
        );

        getCurrentLocation();

        return;

    }


    var text =
        document
        .getElementById("recordText")
        .value
        .trim();


    if(!text){

        alert(
            "현장 기록 내용을 입력하세요."
        );

        document
            .getElementById("recordText")
            .focus();

        return;

    }


    var now =
        new Date();


    var record = {

        id:
            Date.now(),

        time:
            now.toLocaleString(
                "ko-KR"
            ),

        timestamp:
            now.getTime(),

        lat:
            lastLatitude,

        lng:
            lastLongitude,

        accuracy:
            currentAccuracy || 0,

        text:
            text,

        locationName:
            selectedZoneData
            ? selectedZoneData.name
            : "현재 GPS 위치"

    };


    var records =
        getRecords();


    records.unshift(record);


    saveRecords(records);


    addRecordMarker(record);


    sendRecordToServer(record);


    document
        .getElementById("recordText")
        .value = "";


    renderRecordList();


    alert(
        "💾 현위치 기록이 저장되었습니다."
    );

}


/* =========================================================
   RECORD MARKERS
   ========================================================= */

var recordMarkers = [];


function addRecordMarker(record){

    var position =
        new kakao.maps.LatLng(
            record.lat,
            record.lng
        );


    var marker =
        new kakao.maps.Marker({

            map:map,

            position:position,

            title:"현장기록"

        });


    recordMarkers.push(marker);


    kakao.maps.event.addListener(

        marker,

        "click",

        function(){

            showRecordInPanel(record);

            var content = `

                <div style="
                    padding:10px;
                    color:#000;
                    font-size:12px;
                    line-height:1.6;
                    min-width:190px;
                ">

                    <strong>📝 현장기록</strong>

                    <br>

                    ${escapeHTML(
                        record.locationName || ""
                    )}

                    <br>

                    ${escapeHTML(record.time)}

                    <br>

                    위도 :
                    ${Number(record.lat).toFixed(6)}

                    <br>

                    경도 :
                    ${Number(record.lng).toFixed(6)}

                    <br>

                    정확도 :
                    ${Math.round(
                        record.accuracy || 0
                    )}m

                    <hr>

                    ${escapeHTML(record.text)}

                </div>

            `;


            infowindow.setContent(
                content
            );

            infowindow.open(
                map,
                marker
            );

        }

    );

}


/* =========================================================
   RECORD -> PANEL
   ========================================================= */

function showRecordInPanel(record){

    lastLatitude =
        Number(record.lat);

    lastLongitude =
        Number(record.lng);

    currentAccuracy =
        Number(record.accuracy || 0);


    var box =
        document.getElementById(
            "selectedLocation"
        );


    box.style.display = "block";


    box.innerHTML = `

        📝 <strong>저장된 현장기록</strong>

        <br>

        📍 ${escapeHTML(
            record.locationName || ""
        )}

        <br>

        위도 :
        ${Number(record.lat).toFixed(6)}

        <br>

        경도 :
        ${Number(record.lng).toFixed(6)}

        <br>

        시간 :
        ${escapeHTML(record.time)}

    `;


    /*
     * 클릭한 기록내용을 기록창에 표시
     */

    document
        .getElementById("recordText")
        .value =
            record.text || "";


    document
        .getElementById("recordText")
        .focus();

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text){

    return String(text || "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================================================
   RECORD LIST
   ========================================================= */

function renderRecordList(){

    var list =
        document.getElementById(
            "recordList"
        );


    var records =
        getRecords();


    if(records.length === 0){

        list.innerHTML =
            "";

        return;

    }


    list.innerHTML =
        records.map(function(record){

            return `

                <div class="recordItem">

                    🕒
                    ${escapeHTML(record.time)}

                    <br>

                    📍
                    ${Number(record.lat).toFixed(6)},
                    ${Number(record.lng).toFixed(6)}

                    <br>

                    📌
                    ${escapeHTML(
                        record.locationName || ""
                    )}

                    <br>

                    📝
                    ${escapeHTML(record.text)}

                    <br>

                    <button
                        class="editBtn"
                        onclick="showRecordInPanelById(${record.id})">

                        기록내용 표시

                    </button>

                    <button
                        class="moveBtn"
                        onclick="moveToRecord(
                            ${record.lat},
                            ${record.lng}
                        )">

                        지도 이동

                    </button>

                    <button
                        onclick="deleteRecord(${record.id})">

                        삭제

                    </button>

                </div>

            `;

        }).join("");

}


/* =========================================================
   SHOW RECORD BY ID
   ========================================================= */

function showRecordInPanelById(id){

    var records =
        getRecords();


    var record =
        records.find(
            r => r.id === id
        );


    if(!record)
        return;


    showRecordInPanel(record);

}


/* =========================================================
   MOVE TO RECORD
   ========================================================= */

function moveToRecord(lat,lng){

    var position =
        new kakao.maps.LatLng(
            lat,
            lng
        );


    map.setLevel(3);

    map.panTo(position);

}


/* =========================================================
   DELETE RECORD
   ========================================================= */

function deleteRecord(id){

    if(
        !confirm(
            "이 기록을 삭제하시겠습니까?"
        )
    ){

        return;

    }


    var records =
        getRecords()
        .filter(
            r => r.id !== id
        );


    saveRecords(records);


    redrawRecordMarkers();

    renderRecordList();

}


/* =========================================================
   REDRAW RECORD MARKERS
   ========================================================= */

function redrawRecordMarkers(){

    recordMarkers.forEach(
        marker => marker.setMap(null)
    );


    recordMarkers = [];


    getRecords()
        .forEach(
            record =>
                addRecordMarker(record)
        );

}


/* =========================================================
   SHOW ALL RECORDS
   ========================================================= */

function showAllRecords(){

    renderRecordList();


    var records =
        getRecords();


    if(records.length === 0){

        alert(
            "저장된 현장 기록이 없습니다."
        );

        return;

    }


    var bounds =
        new kakao.maps.LatLngBounds();


    records.forEach(function(record){

        bounds.extend(

            new kakao.maps.LatLng(
                record.lat,
                record.lng
            )

        );

    });


    map.setBounds(bounds);

}


/* =========================================================
   CLEAR ALL RECORDS
   ========================================================= */

function clearAllRecords(){

    if(
        !confirm(
            "저장된 모든 현장기록을 삭제하시겠습니까?"
        )
    ){

        return;

    }


    localStorage.removeItem(
        STORAGE_KEY
    );


    recordMarkers.forEach(
        marker => marker.setMap(null)
    );


    recordMarkers = [];


    renderRecordList();


    document
        .getElementById("recordText")
        .value = "";


    document
        .getElementById("selectedLocation")
        .style.display = "none";

}


/* =========================================================
   SEND RECORD TO GOOGLE APPS SCRIPT
   ========================================================= */

function sendRecordToServer(record){

    if(
        !GOOGLE_SCRIPT_URL
    ){

        return;

    }


    fetch(

        GOOGLE_SCRIPT_URL,

        {

            method:"POST",

            mode:"no-cors",

            headers:{
                "Content-Type":
                    "text/plain;charset=utf-8"
            },

            body:
                JSON.stringify({

                    type:
                        "FIELD_RECORD",

                    time:
                        record.time,

                    lat:
                        record.lat,

                    lng:
                        record.lng,

                    accuracy:
                        record.accuracy,

                    memo:
                        record.text,

                    locationName:
                        record.locationName,

                    name:
                        "무등산구조대"

                })

        }

    )

    .then(function(){

        console.log(
            "서버 기록 전송 완료"
        );

    })

    .catch(function(error){

        console.log(
            "서버 기록 전송 실패",
            error
        );

    });

}


/* =========================================================
   REALTIME TRACKING
   ========================================================= */

var trackingId = null;


function startTracking(){

    if(trackingId !== null){

        alert(
            "이미 실시간 추적 중입니다."
        );

        return;

    }


    if(!navigator.geolocation){

        alert(
            "GPS를 사용할 수 없습니다."
        );

        return;

    }


    requestWakeLock();


    trackingId =
        navigator.geolocation.watchPosition(

            function(position){

                currentAccuracy =
                    position.coords.accuracy;


                saveAndDisplay(

                    position.coords.latitude,

                    position.coords.longitude,

                    position.coords.accuracy

                );

            },

            function(error){

                console.log(
                    "GPS ERROR",
                    error
                );

            },

            {

                enableHighAccuracy:true,

                maximumAge:1000,

                timeout:15000

            }

        );


    alert(
        "🟢 실시간 추적 시작"
    );

}


/* =========================================================
   STOP TRACKING
   ========================================================= */

function stopTracking(){

    if(trackingId !== null){

        navigator.geolocation
            .clearWatch(
                trackingId
            );

        trackingId = null;

    }


    releaseWakeLock();


    alert(
        "🔴 실시간 추적 종료"
    );

}


/* =========================================================
   WAKE LOCK
   ========================================================= */

var wakeLock = null;


async function requestWakeLock(){

    try{

        if(
            "wakeLock" in navigator
        ){

            wakeLock =
                await navigator.wakeLock
                .request("screen");

            console.log(
                "화면 꺼짐 방지 ON"
            );

        }

    }
    catch(error){

        console.log(
            "WakeLock 오류",
            error
        );

    }

}


async function releaseWakeLock(){

    try{

        if(wakeLock){

            await wakeLock.release();

            wakeLock = null;

        }

    }
    catch(error){

        console.log(error);

    }

}


document.addEventListener(

    "visibilitychange",

    function(){

        if(
            document.visibilityState ===
            "visible" &&
            trackingId !== null
        ){

            requestWakeLock();

        }

    }

);


/* =========================================================
   DISTANCE MEASURE
   ========================================================= */

var drawingFlag = false;

var clickLine = null;

var moveLine = null;

var dots = [];


function startMeasure(){

    drawingFlag = true;

    alert(
        "📏 지도 위를 클릭하여 거리 측정을 시작하세요."
    );

}


function stopMeasure(){

    drawingFlag = false;


    if(moveLine){

        moveLine.setMap(null);

        moveLine = null;

    }

}


function resetMeasure(){

    drawingFlag = false;


    if(clickLine){

        clickLine.setMap(null);

        clickLine = null;

    }


    if(moveLine){

        moveLine.setMap(null);

        moveLine = null;

    }


    dots.forEach(function(dot){

        dot.circle.setMap(null);

        dot.overlay.setMap(null);

    });


    dots = [];

}


/* =========================================================
   MAP CLICK - DISTANCE
   ========================================================= */

kakao.maps.event.addListener(

    map,

    "click",

    function(mouseEvent){

        if(!drawingFlag)
            return;


        var clickPosition =
            mouseEvent.latLng;


        if(!clickLine){

            clickLine =
                new kakao.maps.Polyline({

                    map:map,

                    path:[
                        clickPosition
                    ],

                    strokeWeight:4,

                    strokeColor:"#FF0000",

                    strokeOpacity:.9

                });

        }
        else{

            var path =
                clickLine.getPath();

            path.push(
                clickPosition
            );

            clickLine.setPath(path);

        }


        addDot(

            clickPosition,

            clickLine.getLength()

        );

    }

);


/* =========================================================
   DISTANCE DOT
   ========================================================= */

function addDot(
    position,
    distance
){

    var circle =
        new kakao.maps.Circle({

            center:position,

            radius:3,

            strokeWeight:2,

            strokeColor:"#FF0000",

            fillColor:"#FF0000",

            fillOpacity:1

        });


    circle.setMap(map);


    var overlay =
        new kakao.maps.CustomOverlay({

            content:

                `<div style="
                    background:#FF0000;
                    color:#fff;
                    padding:4px 6px;
                    font-size:11px;
                    border-radius:4px;
                    white-space:nowrap;
                ">
                    총거리 :
                    ${distance.toFixed(0)}m
                </div>`,

            position:position,

            yAnchor:1

        });


    overlay.setMap(map);


    dots.push({

        circle:circle,

        overlay:overlay

    });

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

redrawRecordMarkers();

renderRecordList();


/*
 * 처음부터 모든 구역 OFF
 */

updateZoneButton("high");

updateZoneButton("middle");

updateZoneButton("low");


</script>

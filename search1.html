<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>무등산 특수산악구조팀 현장조사 시스템</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:#fff;
}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    left:0;
    right:0;

    height:55px;

    z-index:2000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#1e3a8a;

    padding:8px 50px 8px 10px;

    text-align:center;

    font-size:16px;
    font-weight:bold;

    box-shadow:0 3px 10px rgba(0,0,0,.4);
}

/* ================= MAP ================= */

#map{
    position:absolute;

    top:55px;
    left:0;
    right:0;
    bottom:0;

    width:100%;
    height:calc(100vh - 55px);
}

/* ================= CONTROL ================= */

#controls{

    position:fixed;

    top:65px;
    left:8px;

    z-index:1500;

    width:180px;

    max-height:calc(100vh - 75px);

    overflow-y:auto;

    padding:7px;

    background:rgba(15,23,42,.94);

    border:1px solid rgba(255,255,255,.2);

    border-radius:12px;

    box-shadow:0 5px 20px rgba(0,0,0,.4);

    backdrop-filter:blur(8px);
}

/* ================= BUTTON ================= */

#controls button{

    display:block;

    width:100%;

    margin-bottom:6px;

    padding:10px 8px;

    border:0;

    border-radius:7px;

    background:#1e40af;

    color:#fff;

    font-size:12px;

    font-weight:bold;

    cursor:pointer;
}

#controls button:active{
    transform:scale(.96);
}

#controls button:last-child{
    margin-bottom:0;
}

/* ================= RECORD PANEL ================= */

#recordPanel{

    position:fixed;

    left:8px;
    right:8px;
    bottom:8px;

    z-index:1800;

    max-width:520px;

    padding:10px;

    background:rgba(2,6,23,.95);

    border:1px solid #38bdf8;

    border-radius:12px;

    box-shadow:0 5px 25px rgba(0,0,0,.5);

}

/* ================= RECORD TITLE ================= */

.recordTitle{

    color:#38bdf8;

    font-size:13px;

    font-weight:bold;

    margin-bottom:6px;
}

/* ================= INPUT ================= */

#recordText{

    width:100%;

    height:55px;

    resize:none;

    border:1px solid #475569;

    border-radius:7px;

    background:#020617;

    color:#fff;

    padding:9px;

    outline:none;

    font-size:13px;

}

#recordText:focus{

    border-color:#38bdf8;

    box-shadow:0 0 8px rgba(56,189,248,.3);

}

/* ================= RECORD BUTTON ================= */

#saveRecordBtn{

    width:100%;

    margin-top:6px;

    padding:11px;

    border:0;

    border-radius:7px;

    background:#059669;

    color:#fff;

    font-size:13px;

    font-weight:bold;
}

/* ================= RECORD LIST ================= */

#recordList{

    max-height:180px;

    overflow-y:auto;

    margin-top:7px;

}

.recordItem{

    padding:8px;

    margin-bottom:5px;

    background:#111827;

    border-left:3px solid #38bdf8;

    border-radius:5px;

    font-size:11px;

    line-height:1.5;

    cursor:pointer;
}

.recordItem:hover{

    background:#1e293b;

}

.recordItem button{

    margin-top:5px;

    margin-right:4px;

    padding:4px 7px;

    border:0;

    border-radius:4px;

    background:#dc2626;

    color:#fff;

    font-size:10px;
}

.recordItem .moveBtn{

    background:#2563eb;
}

.recordItem .serverBtn{

    background:#7c3aed;
}

/* ================= STATUS ================= */

#serverStatus{

    margin-top:6px;

    padding:5px;

    border-radius:5px;

    background:#111827;

    color:#94a3b8;

    font-size:10px;

}

/* ================= MOBILE ================= */

@media(max-width:600px){

    header{

        font-size:13px;

        height:48px;
    }

    #map{

        top:48px;

        height:calc(100vh - 48px);
    }

    #controls{

        top:56px;

        width:150px;

        max-height:48vh;
    }

    #controls button{

        padding:8px 5px;

        font-size:10px;
    }

    #recordPanel{

        bottom:6px;

        left:6px;

        right:6px;
    }

    #recordText{

        height:48px;
    }

}

/* ================= LOCATION LABEL ================= */

.location-label{

    background:#020617;

    color:#38bdf8;

    border:1px solid #38bdf8;

    padding:5px 8px;

    border-radius:6px;

    font-size:11px;

    font-weight:bold;

    white-space:nowrap;
}

</style>

</head>

<body>

<header>
🛰 무등산 특수산악구조팀 현장조사 시스템
</header>


<!-- ================= CONTROL ================= -->

<div id="controls">

    <button onclick="toggleZone('high')">
        🔵 고지대 OFF
    </button>

    <button onclick="toggleZone('middle')">
        🟡 중지대 OFF
    </button>

    <button onclick="toggleZone('low')">
        🟢 저지대 OFF
    </button>

    <button onclick="getCurrentLocation()">
        📍 현위치 가져오기
    </button>

    <button onclick="prepareRecord()">
        📝 현위치 기록
    </button>

    <button onclick="startTracking()">
        🟢 실시간 추적 시작
    </button>

    <button onclick="stopTracking()">
        🔴 실시간 추적 종료
    </button>

    <button onclick="startMeasure()">
        📏 거리 측정 시작
    </button>

    <button onclick="stopMeasure()">
        ⛔ 거리 측정 종료
    </button>

    <button onclick="resetMeasure()">
        🔄 거리 측정 리셋
    </button>

    <button onclick="showAllRecords()">
        📋 저장 기록 보기
    </button>

    <button onclick="loadServerRecords()">
        ☁️ 서버 기록 보기
    </button>

    <button onclick="clearAllRecords()">
        🗑 전체 기록 삭제
    </button>

</div>


<!-- ================= RECORD PANEL ================= -->

<div id="recordPanel">

    <div class="recordTitle">
        📝 현장 기록
    </div>

    <textarea
        id="recordText"
        placeholder="현장 기록을 입력하세요&#10;예: 등산객 1명 탈진, 응급조치 후 하산 유도">
    </textarea>

    <button
        id="saveRecordBtn"
        onclick="saveCurrentRecord()">

        💾 현재 위치 + 현장 기록 저장

    </button>

    <div id="serverStatus">
        서버 상태: 대기
    </div>

    <div id="recordList"></div>

</div>

<div id="map"></div>

    }

];


/* =========================================================
   ZONE VARIABLES
   처음부터 OFF
   ========================================================= */

var bounds =
new kakao.maps.LatLngBounds();

var infowindow =
new kakao.maps.InfoWindow({
    removable:true
});

var selectedCircle = null;

var circles = [];


/* 처음에는 모두 OFF */
var zoneVisibility = {

    high:false,

    middle:false,

    low:false

};


/* =========================================================
   ZONE DRAW
   ========================================================= */

circleData.forEach(function(data){

    var position =
        new kakao.maps.LatLng(
            data.lat,
            data.lng
        );


    var circle =
        new kakao.maps.Circle({

            center:position,

            radius:data.radius,

            strokeWeight:2,

            strokeColor:data.color,

            strokeOpacity:.9,

            fillColor:data.color,

            fillOpacity:.4,

            clickable:true,

            zIndex:1

        });


    /* 처음에는 OFF이므로 지도에 표시하지 않음 */
    circle.setMap(null);


    var marker =
        new kakao.maps.Marker({

            position:position,

            title:data.name

        });


    /* 처음에는 OFF */
    marker.setMap(null);


    function selectLocation(){

        if(selectedCircle){

            selectedCircle.circle.setOptions({

                strokeColor:
                    selectedCircle.originalColor,

                fillColor:
                    selectedCircle.originalColor,

                fillOpacity:.4,

                strokeOpacity:.9,

                zIndex:1

            });

        }


        circle.setOptions({

            strokeColor:"#FFD700",

            fillColor:"#FFD700",

            fillOpacity:.6,

            strokeOpacity:1,

            zIndex:10

        });


        selectedCircle={

            circle:circle,

            originalColor:data.color

        };


        map.setLevel(3);

        map.panTo(position);


        var content = `

            <div style="
                padding:10px;
                font-size:13px;
                color:#000;
                line-height:1.6;
            ">

                <strong>${data.name}</strong><br>

                위도 : ${data.lat}<br>

                경도 : ${data.lng}<br>

                반경 : ${data.radius}m

            </div>

        `;


        infowindow.setContent(content);

        infowindow.open(map,marker);

    }


    kakao.maps.event.addListener(
        marker,
        "click",
        selectLocation
    );

    kakao.maps.event.addListener(
        circle,
        "click",
        selectLocation
    );


    circles.push({

        circle:circle,

        marker:marker,

        zone:data.zone

    });


    bounds.extend(position);

});


map.setBounds(bounds);


/* =========================================================
   ZONE TOGGLE
   ========================================================= */

function toggleZone(zone){

    zoneVisibility[zone] =
        !zoneVisibility[zone];


    circles.forEach(function(item){

        if(item.zone === zone){

            item.circle.setMap(

                zoneVisibility[zone]
                ? map
                : null

            );

            item.marker.setMap(

                zoneVisibility[zone]
                ? map
                : null

            );

        }

    });


    updateZoneButtonText();

}


/* =========================================================
   ZONE BUTTON TEXT
   ========================================================= */

function updateZoneButtonText(){

    var buttons =
        document.querySelectorAll(
            "#controls button"
        );


    buttons[0].innerText =
        zoneVisibility.high
        ? "🔵 고지대 ON"
        : "🔵 고지대 OFF";


    buttons[1].innerText =
        zoneVisibility.middle
        ? "🟡 중지대 ON"
        : "🟡 중지대 OFF";


    buttons[2].innerText =
        zoneVisibility.low
        ? "🟢 저지대 ON"
        : "🟢 저지대 OFF";

}


/* =========================================================
   CURRENT LOCATION
   ========================================================= */

var userMarker = null;

var userAccuracyCircle = null;

var lastLatitude = null;

var lastLongitude = null;

window.currentAccuracy = 0;


function getCurrentLocation(){

    if(!navigator.geolocation){

        alert(
            "이 기기에서 GPS를 사용할 수 없습니다."
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            window.currentAccuracy =
                position.coords.accuracy || 0;


            saveAndDisplay(

                position.coords.latitude,

                position.coords.longitude,

                position.coords.accuracy

            );

        },

        function(error){

            alert(
                "GPS 오류 : " +
                error.message
            );

        },

        {

            enableHighAccuracy:true,

            maximumAge:1000,

            timeout:15000

        }

    );

}


/* =========================================================
   DISPLAY LOCATION
   ========================================================= */

function saveAndDisplay(
    lat,
    lng,
    accuracy
){

    lastLatitude = lat;

    lastLongitude = lng;

    window.currentAccuracy =
        accuracy || 0;


    var locPosition =
        new kakao.maps.LatLng(
            lat,
            lng
        );


    if(userMarker){

        userMarker.setPosition(
            locPosition
        );

    }
    else{

        userMarker =
            new kakao.maps.Marker({

                map:map,

                position:locPosition

            });

    }


    if(userAccuracyCircle){

        userAccuracyCircle.setPosition(
            locPosition
        );

        userAccuracyCircle.setRadius(
            accuracy || 20
        );

    }
    else{

        userAccuracyCircle =
            new kakao.maps.Circle({

                map:map,

                center:locPosition,

                radius:accuracy || 20,

                strokeWeight:1,

                strokeColor:"#00FFFF",

                strokeOpacity:.7,

                fillColor:"#00FFFF",

                fillOpacity:.12

            });

    }


    map.panTo(locPosition);

}


/* =========================================================
   PREPARE RECORD
   ========================================================= */

function prepareRecord(){

    getCurrentLocation();

    setTimeout(function(){

        document
            .getElementById("recordText")
            .focus();

    },1000);

}


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

var STORAGE_KEY =
"MUDEUNG_MOUNTAIN_RECORDS";


function getRecords(){

    try{

        return JSON.parse(

            localStorage.getItem(
                STORAGE_KEY
            ) || "[]"

        );

    }
    catch(e){

        return [];

    }

}


function saveRecords(records){

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(records)

    );

}


/* =========================================================
   SAVE CURRENT RECORD
   ========================================================= */

function saveCurrentRecord(){

    if(
        lastLatitude === null ||
        lastLongitude === null
    ){

        alert(
            "먼저 📍 현위치를 가져오세요."
        );

        getCurrentLocation();

        return;

    }


    var text =
        document
        .getElementById("recordText")
        .value
        .trim();


    if(!text){

        alert(
            "현장 기록 내용을 입력하세요."
        );

        document
            .getElementById("recordText")
            .focus();

        return;

    }


    var now =
        new Date();


    var record = {

        id:
            Date.now(),

        time:
            now.toLocaleString(
                "ko-KR"
            ),

        timestamp:
            now.getTime(),

        lat:
            lastLatitude,

        lng:
            lastLongitude,

        accuracy:
            window.currentAccuracy || 0,

        text:
            text

    };


    var records =
        getRecords();


    records.unshift(record);


    saveRecords(records);


    addRecordMarker(record);


    /* 서버 전송 */
    sendRecordToServer(record);


    document
        .getElementById("recordText")
        .value = "";


    renderRecordList();


    alert(
        "💾 현장기록을 저장했습니다.\n\n" +
        "휴대폰 저장 + 서버 전송을 시도했습니다."
    );

}


/* =========================================================
   RECORD MARKERS
   ========================================================= */

var recordMarkers = [];


function addRecordMarker(record){

    var position =
        new kakao.maps.LatLng(
            record.lat,
            record.lng
        );


    var marker =
        new kakao.maps.Marker({

            map:map,

            position:position,

            title:"현장기록"

        });


    recordMarkers.push(marker);


    kakao.maps.event.addListener(

        marker,

        "click",

        function(){

            /* 클릭하면 기록내용을 입력창에 표시 */
            document
                .getElementById("recordText")
                .value =
                    record.text || "";


            var content = `

                <div style="
                    padding:10px;
                    color:#000;
                    font-size:12px;
                    line-height:1.6;
                    min-width:200px;
                    max-width:280px;
                ">

                    <strong>📝 현장기록</strong><br>

                    시간 :
                    ${escapeHTML(record.time || "")}<br>

                    위도 :
                    ${Number(record.lat).toFixed(6)}<br>

                    경도 :
                    ${Number(record.lng).toFixed(6)}<br>

                    정확도 :
                    ${Math.round(
                        record.accuracy || 0
                    )}m

                    <hr>

                    <strong>기록내용</strong><br>

                    ${escapeHTML(
                        record.text || ""
                    )}

                </div>

            `;


            infowindow.setContent(
                content
            );

            infowindow.open(
                map,
                marker
            );


            /* 기록 패널로 이동 */
            document
                .getElementById("recordPanel")
                .scrollIntoView({
                    behavior:"smooth"
                });

        }

    );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text){

    return String(text || "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================================================
   RECORD LIST
   ========================================================= */

function renderRecordList(){

    var list =
        document.getElementById(
            "recordList"
        );


    var records =
        getRecords();


    if(records.length === 0){

        list.innerHTML =
            "<div style='font-size:11px;color:#64748b;'>저장된 로컬 기록이 없습니다.</div>";

        return;

    }


    list.innerHTML =
        "<div style='color:#38bdf8;font-size:11px;margin-bottom:5px;'>📱 휴대폰 저장 기록</div>" +

        records.map(function(record){

            return `

                <div class="recordItem"
                     onclick="selectRecord(${record.id})">

                    🕒 ${escapeHTML(record.time)}<br>

                    📍
                    ${Number(record.lat).toFixed(6)},
                    ${Number(record.lng).toFixed(6)}

                    <br>

                    📝
                    ${escapeHTML(record.text)}

                    <br>

                    <button
                        onclick="event.stopPropagation();deleteRecord(${record.id})">

                        삭제

                    </button>

                    <button
                        class="moveBtn"
                        onclick="event.stopPropagation();moveToRecord(
                            ${record.lat},
                            ${record.lng}
                        )">

                        지도 이동

                    </button>

                </div>

            `;

        }).join("");

}


/* =========================================================
   SELECT RECORD
   클릭하면 기록내용 표시
   ========================================================= */

function selectRecord(id){

    var record =
        getRecords().find(
            r => r.id === id
        );


    if(!record)
        return;


    document
        .getElementById("recordText")
        .value =
            record.text || "";


    moveToRecord(
        record.lat,
        record.lng
    );

}


/* =========================================================
   MOVE TO RECORD
   ========================================================= */

function moveToRecord(lat,lng){

    var position =
        new kakao.maps.LatLng(
            lat,
            lng
        );


    map.setLevel(3);

    map.panTo(position);

}


/* =========================================================
   DELETE RECORD
   ========================================================= */

function deleteRecord(id){

    if(
        !confirm(
            "이 기록을 삭제하시겠습니까?"
        )
    ){

        return;

    }


    var records =
        getRecords()
        .filter(
            r => r.id !== id
        );


    saveRecords(records);


    redrawRecordMarkers();

    renderRecordList();

}


/* =========================================================
   REDRAW RECORD MARKERS
   ========================================================= */

function redrawRecordMarkers(){

    recordMarkers.forEach(
        marker => marker.setMap(null)
    );


    recordMarkers = [];


    getRecords()
        .forEach(
            record =>
                addRecordMarker(record)
        );

}


/* =========================================================
   SHOW ALL LOCAL RECORDS
   ========================================================= */

function showAllRecords(){

    renderRecordList();


    var records =
        getRecords();


    if(records.length === 0){

        alert(
            "저장된 현장 기록이 없습니다."
        );

        return;

    }


    var bounds =
        new kakao.maps.LatLngBounds();


    records.forEach(function(record){

        bounds.extend(

            new kakao.maps.LatLng(
                record.lat,
                record.lng
            )

        );

    });


    map.setBounds(bounds);

}


/* =========================================================
   CLEAR ALL RECORDS
   ========================================================= */

function clearAllRecords(){

    if(
        !confirm(
            "휴대폰에 저장된 모든 현장기록을 삭제하시겠습니까?"
        )
    ){

        return;

    }


    localStorage.removeItem(
        STORAGE_KEY
    );


    recordMarkers.forEach(
        marker => marker.setMap(null)
    );


    recordMarkers = [];


    renderRecordList();

}


/* =========================================================
   SEND RECORD TO GOOGLE APPS SCRIPT
   ========================================================= */

function sendRecordToServer(record){

    var status =
        document.getElementById(
            "serverStatus"
        );


    status.innerText =
        "서버 상태: 전송 중...";


    /*
     * 중요:
     * Apps Script와 동일하게 memo를 사용
     */

    var data = {

        type:"FIELD_RECORD",

        time:record.time,

        timestamp:record.timestamp,

        lat:record.lat,

        lng:record.lng,

        accuracy:record.accuracy,

        memo:record.text,

        text:record.text,

        name:"무등산구조대"

    };


    fetch(

        GOOGLE_SCRIPT_URL,

        {

            method:"POST",

            mode:"no-cors",

            headers:{

                "Content-Type":
                    "text/plain;charset=utf-8"

            },

            body:
                JSON.stringify(data)

        }

    )

    .then(function(){

        /*
         * no-cors에서는 실제 응답을 읽을 수 없지만
         * 요청 자체는 완료됨
         */

        status.innerText =
            "서버 상태: 전송 요청 완료";

    })

    .catch(function(error){

        console.error(error);

        status.innerText =
            "서버 상태: 전송 오류";

    });

}


/* =========================================================
   LOAD SERVER RECORDS
   ========================================================= */

async function loadServerRecords(){

    var status =
        document.getElementById(
            "serverStatus"
        );


    status.innerText =
        "서버 상태: 서버 기록 불러오는 중...";


    try{

        var response =
            await fetch(
                GOOGLE_SCRIPT_URL +
                "?action=getRecords&t=" +
                Date.now()
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        var data =
            await response.json();


        if(
            !Array.isArray(data)
        ){

            throw new Error(
                "서버 응답 형식 오류"
            );

        }


        renderServerRecords(data);


        status.innerText =
            "서버 상태: " +
            data.length +
            "건 불러옴";


    }
    catch(error){

        console.error(
            "서버 기록 불러오기 실패:",
            error
        );


        status.innerText =
            "서버 상태: 불러오기 실패";


        alert(
            "서버 기록을 불러오지 못했습니다.\n\n" +
            "Apps Script 배포 상태와 웹 앱 권한을 확인하세요."
        );

    }

}


/* =========================================================
   RENDER SERVER RECORDS
   ========================================================= */

function renderServerRecords(records){

    var list =
        document.getElementById(
            "recordList"
        );


    if(records.length === 0){

        list.innerHTML =
            "<div style='font-size:11px;color:#94a3b8;'>☁️ 서버에 저장된 기록이 없습니다.</div>";

        return;

    }


    list.innerHTML =

        "<div style='color:#a78bfa;font-size:11px;margin-bottom:5px;'>☁️ Google Sheets 서버 기록</div>" +

        records.map(function(record,index){

            var lat =
                Number(record.lat || 0);

            var lng =
                Number(record.lng || 0);


            return `

                <div class="recordItem"
                     style="border-left-color:#a78bfa;"
                     onclick="showServerRecord(${index})">

                    ☁️ ${escapeHTML(
                        String(record.time || "")
                    )}

                    <br>

                    📍
                    ${lat.toFixed(6)},
                    ${lng.toFixed(6)}

                    <br>

                    📝
                    ${escapeHTML(
                        record.memo ||
                        record.text ||
                        ""
                    )}

                    <br>

                    <button
                        class="moveBtn"
                        onclick="event.stopPropagation();moveToRecord(
                            ${lat},
                            ${lng}
                        )">

                        지도 이동

                    </button>

                </div>

            `;

        }).join("");


    window.serverRecords =
        records;

}


/* =========================================================
   SHOW SERVER RECORD
   클릭하면 기록내용을 입력창에 표시
   ========================================================= */

function showServerRecord(index){

    var record =
        window.serverRecords[index];


    if(!record)
        return;


    var text =
        record.memo ||
        record.text ||
        "";


    document
        .getElementById("recordText")
        .value =
            text;


    if(
        record.lat &&
        record.lng
    ){

        moveToRecord(
            Number(record.lat),
            Number(record.lng)
        );

    }


    var content = `

        <div style="
            padding:10px;
            color:#000;
            font-size:12px;
            line-height:1.6;
            min-width:200px;
            max-width:280px;
        ">

            <strong>☁️ 서버 현장기록</strong><br>

            시간 :
            ${escapeHTML(
                String(record.time || "")
            )}

            <br>

            위도 :
            ${Number(
                record.lat || 0
            ).toFixed(6)}

            <br>

            경도 :
            ${Number(
                record.lng || 0
            ).toFixed(6)}

            <hr>

            <strong>기록내용</strong><br>

            ${escapeHTML(text)}

        </div>

    `;


    infowindow.setContent(
        content
    );


    if(
        record.lat &&
        record.lng
    ){

        var markerPosition =
            new kakao.maps.LatLng(
                Number(record.lat),
                Number(record.lng)
            );


        var tempMarker =
            new kakao.maps.Marker({

                position:markerPosition,

                map:map

            });


        infowindow.open(
            map,
            tempMarker
        );


        setTimeout(function(){

            tempMarker.setMap(null);

        },5000);

    }

}


/* =========================================================
   REALTIME TRACKING
   ========================================================= */

var trackingId = null;


function startTracking(){

    if(trackingId !== null){

        alert(
            "이미 실시간 추적 중입니다."
        );

        return;

    }


    if(!navigator.geolocation){

        alert(
            "GPS를 사용할 수 없습니다."
        );

        return;

    }


    requestWakeLock();


    trackingId =
        navigator.geolocation.watchPosition(

            function(position){

                window.currentAccuracy =
                    position.coords.accuracy;


                saveAndDisplay(

                    position.coords.latitude,

                    position.coords.longitude,

                    position.coords.accuracy

                );

            },

            function(error){

                console.log(
                    "GPS ERROR",
                    error
                );

            },

            {

                enableHighAccuracy:true,

                maximumAge:1000,

                timeout:15000

            }

        );


    alert(
        "🟢 실시간 추적 시작"
    );

}


/* =========================================================
   STOP TRACKING
   ========================================================= */

function stopTracking(){

    if(trackingId !== null){

        navigator.geolocation
            .clearWatch(
                trackingId
            );

        trackingId = null;

    }


    releaseWakeLock();


    alert(
        "🔴 실시간 추적 종료"
    );

}


/* =========================================================
   WAKE LOCK
   ========================================================= */

var wakeLock = null;


async function requestWakeLock(){

    try{

        if(
            "wakeLock" in navigator
        ){

            wakeLock =
                await navigator.wakeLock
                .request("screen");

        }

    }
    catch(error){

        console.log(
            "WakeLock 오류",
            error
        );

    }

}


async function releaseWakeLock(){

    try{

        if(wakeLock){

            await wakeLock.release();

            wakeLock = null;

        }

    }
    catch(error){

        console.log(error);

    }

}


document.addEventListener(

    "visibilitychange",

    function(){

        if(
            document.visibilityState ===
            "visible" &&
            trackingId !== null
        ){

            requestWakeLock();

        }

    }

);


/* =========================================================
   DISTANCE MEASURE
   ========================================================= */

var drawingFlag = false;

var clickLine = null;

var moveLine = null;

var dots = [];


function startMeasure(){

    drawingFlag = true;

    alert(
        "📏 지도 위를 클릭하여 거리 측정을 시작하세요."
    );

}


function stopMeasure(){

    drawingFlag = false;


    if(moveLine){

        moveLine.setMap(null);

        moveLine = null;

    }

}


function resetMeasure(){

    drawingFlag = false;


    if(clickLine){

        clickLine.setMap(null);

        clickLine = null;

    }


    if(moveLine){

        moveLine.setMap(null);

        moveLine = null;

    }


    dots.forEach(function(dot){

        dot.circle.setMap(null);

        dot.overlay.setMap(null);

    });


    dots = [];

}


/* =========================================================
   MAP CLICK
   ========================================================= */

kakao.maps.event.addListener(

    map,

    "click",

    function(mouseEvent){

        if(!drawingFlag)
            return;


        var clickPosition =
            mouseEvent.latLng;


        if(!clickLine){

            clickLine =
                new kakao.maps.Polyline({

                    map:map,

                    path:[
                        clickPosition
                    ],

                    strokeWeight:4,

                    strokeColor:"#FF0000",

                    strokeOpacity:.9

                });

        }
        else{

            var path =
                clickLine.getPath();

            path.push(
                clickPosition
            );

            clickLine.setPath(path);

        }


        addDot(

            clickPosition,

            clickLine.getLength()

        );

    }

);


/* =========================================================
   DISTANCE DOT
   ========================================================= */

function addDot(
    position,
    distance
){

    var circle =
        new kakao.maps.Circle({

            center:position,

            radius:3,

            strokeWeight:2,

            strokeColor:"#FF0000",

            fillColor:"#FF0000",

            fillOpacity:1

        });


    circle.setMap(map);


    var overlay =
        new kakao.maps.CustomOverlay({

            content:

                `<div style="
                    background:#FF0000;
                    color:#fff;
                    padding:4px 6px;
                    font-size:11px;
                    border-radius:4px;
                    white-space:nowrap;
                ">
                    총거리 :
                    ${distance.toFixed(0)}m
                </div>`,

            position:position,

            yAnchor:1

        });


    overlay.setMap(map);


    dots.push({

        circle:circle,

        overlay:overlay

    });

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

redrawRecordMarkers();

renderRecordList();

updateZoneButtonText();

</script>

========================================================= */

let DEVICE_ID =
localStorage.getItem("DEVICE_ID");


if(!DEVICE_ID){

    if(
        window.crypto &&
        crypto.randomUUID
    ){

        DEVICE_ID =
            crypto.randomUUID();

    }
    else{

        DEVICE_ID =
            "DEVICE-" +
            Date.now() +
            "-" +
            Math.random()
            .toString(36)
            .substring(2);

    }

    localStorage.setItem(
        "DEVICE_ID",
        DEVICE_ID
    );

}

========================================================= */

function getNowTime(){

    const d = new Date();

    return (

        d.getFullYear()
        + "-"
        +
        String(
            d.getMonth() + 1
        ).padStart(2,"0")
        + "-"
        +
        String(
            d.getDate()
        ).padStart(2,"0")
        + " "
        +
        String(
            d.getHours()
        ).padStart(2,"0")
        + ":"
        +
        String(
            d.getMinutes()
        ).padStart(2,"0")
        + ":"
        +
        String(
            d.getSeconds()
        ).padStart(2,"0")

}


/* =========================================================
   WAKE LOCK
========================================================= */

async function requestWakeLock(){

    try{

        if(
            !("wakeLock" in navigator)
        ){

            console.log(
                "Wake Lock API 미지원"
            );

            return;

        }

        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );

        console.log(
            "🔒 화면 꺼짐 방지 ON"
        );

        wakeLock.addEventListener(
            "release",
            function(){

                console.log(
                    "🔓 Wake Lock 해제"
                );

                /*
                 * 추적 중이면 다음 화면 복귀 때
                 * 다시 요청
                 */

            }
        );

    }
    catch(error){

        console.log(
            "Wake Lock 오류",
            error
        );

    }

}


async function releaseWakeLock(){

    try{

        if(wakeLock){

            await wakeLock.release();

            wakeLock = null;

        }

    }
    catch(error){

        console.log(
            "Wake Lock 해제 오류",
            error
        );

    }

}

            map.setLevel(4);

            map.panTo(position);


            const content =

                `<div style="
                    padding:9px;
                    font-size:12px;
                    color:#000;
                    line-height:1.6;
                    min-width:180px;
                ">

                <strong>
                    🏔 ${data.name}
                </strong>

                위도:
                ${data.lat.toFixed(6)}

                <br>

                경도:
                ${data.lng.toFixed(6)}

                <br>

                반경:
                ${data.radius}m

                </div>`;


            infowindow.setContent(
                content
            );


            infowindow.open(
                map,
                marker
            );

        }


        kakao.maps.event.addListener(
            marker,
            "click",
            selectLocation
        );


        kakao.maps.event.addListener(
            circle,
            "click",
            selectLocation
        );


        bounds.extend(position);

    }
);

/* =========================================================
   START GPS
========================================================= */

async function start(){

    myName =
        nameInput.value.trim();


    if(!myName){

        alert(
            "RESCUE ID를 입력하세요."
        );

        return;

    }


    if(
        !navigator.geolocation
    ){

        alert(
            "이 기기는 GPS를 지원하지 않습니다."
        );

        return;

    }


    startTime =
        getNowTime();


    nameInput.disabled = true;

    startBtn.disabled = true;


    /*
     * 화면 꺼짐 방지
     */

    await requestWakeLock();


    /*
     * GPS 추적
     */

    watchId =
        navigator.geolocation.watchPosition(

            function(position){

                updateMyPosition(
                    position
                );

            },

            function(error){

                console.log(
                    "GPS ERROR",
                    error
                );

                alert(
                    "GPS 오류: " +
                    error.message
                );

            },

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    1000,

                timeout:
                    10000

            }

        );


    /*
     * 5초마다 서버 전송
     */

    intervalSend =
        setInterval(
            sendData,
            5000
        );


    /*
     * 3초마다 다른 구조대 위치
     */

    intervalLoad =
        setInterval(
            loadLive,
            3000
        );


    /*
     * 모바일 자동 지도 추적
     */

    startMobileCenter();


    sendData();

    loadLive();

}


/* =========================================================
   GPS UPDATE
========================================================= */

function updateMyPosition(
    position
){

    lastPos = {

        name:
            myName,

        device:
            DEVICE_ID,

        lat:
            position.coords.latitude,

        lng:
            position.coords.longitude,

        accuracy:
            position.coords.accuracy,

        speed:
            position.coords.speed,

        status:
            "normal"

    };


    /*
     * 내 위치 즉시 이동
     */

    map.setCenter(

        new kakao.maps.LatLng(

            lastPos.lat,

            lastPos.lng

        )

    );

}


/* =========================================================
   SEND LIVE DATA
========================================================= */

function sendData(){

    if(!lastPos)
        return;


    fetch(

        API_URL,

        {

            method:
                "POST",

            headers: {

                "Content-Type":
                    "text/plain"

            },

            body:

                JSON.stringify({

                    ...lastPos,

                    startTime:
                        startTime,

                    endTime:
                        endTime

                })

        }

    )
    .catch(
        function(error){

            console.log(
                "SEND ERROR",
                error
            );

        }
    );

}


/* =========================================================
   LOAD LIVE
========================================================= */

function loadLive(){

    fetch(

        API_URL +
        "?live=1&t=" +
        Date.now()

    )

    .then(
        function(response){

            return response.json();

        }
    )

    .then(
        function(data){

            renderLive(data);

        }
    )

    .catch(
        function(error){

            console.log(
                "LIVE ERROR",
                error
            );

        }
    );

}


/* =========================================================
   LIVE RENDER
========================================================= */

function renderLive(data){

    const latest = {};


    data.forEach(
        function(p){

            latest[p.name] = p;

        }
    );


    Object.values(latest)
    .forEach(
        function(p){

            const lat =
                Number(p.lat);

            const lng =
                Number(p.lng);


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            ){

                return;

            }


            const key =
                p.name;


            const position =
                new kakao.maps.LatLng(
                    lat,
                    lng
                );


            if(!liveMarkers[key]){

                liveMarkers[key] =
                    new kakao.maps.Marker({

                        map:
                            map,

                        position:
                            position

                    });


                liveLabels[key] =
                    new kakao.maps.CustomOverlay({

                        map:
                            map,

                        position:
                            position,

                        content:

                            `<div class="name-label">
                                🛰 ${p.name}
                            </div>`,

                        yAnchor:
                            1.5

                    });

            }
            else{

                liveMarkers[key]
                    .setPosition(
                        position
                    );


                liveLabels[key]
                    .setPosition(
                        position
                    );

            }


            /*
             * SOS 표시
             */

            if(
                p.status === "SOS"
            ){

                liveMarkers[key]
                .setImage(

                    new kakao.maps.MarkerImage(

                        "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png",

                        new kakao.maps.Size(
                            32,
                            45
                        )

                    )

                );

            }


            /*
             * SHARE 표시
             */

            else if(
                p.status === "SHARE"
            ){

                liveMarkers[key]
                .setImage(

                    new kakao.maps.MarkerImage(

                        "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png",

                        new kakao.maps.Size(
                            32,
                            45
                        )

                    )

                );

            }

        }
    );

}

/* =========================================================
   RECORD LOCATION
========================================================= */

function recordLocation(
    lat,
    lng,
    accuracy,
    recordType
){

    const recordTime =
        getNowTime();


    const data = {

        name:
            myName,

        device:
            DEVICE_ID,

        lat:
            Number(lat),

        lng:
            Number(lng),

        accuracy:
            accuracy === ""
                ? ""
                : Number(accuracy),

        speed:
            lastPos
                ? lastPos.speed
                : "",

        status:
            "RECORD",

        recordType:
            recordType,

        recordTime:
            recordTime,

        startTime:
            startTime,

        endTime:
            endTime

    };


    /*
     * 지도 마커
     */

    const position =
        new kakao.maps.LatLng(
            data.lat,
            data.lng
        );


    const marker =
        new kakao.maps.Marker({

            map:
                map,

            position:
                position

        });


    const label =
        new kakao.maps.CustomOverlay({

            map:
                map,

            position:
                position,

            content:

                `<div class="record-label">
                    📌 ${myName || "기록"}
                </div>`,

            yAnchor:
                1.5

        });


    const key =
        Date.now() +
        "_" +
        Math.random();


    recordMarkers[key] =
        marker;

    recordLabels[key] =
        label;


    /*
     * 마커 클릭
     */

    kakao.maps.event.addListener(

        marker,

        "click",

        function(){

            showRecordInfo(
                data,
                position
            );

        }

    );


    /*
     * 지도 이동
     */

    map.setLevel(4);

    map.panTo(
        position
    );


    /*
     * 서버 저장
     */

    fetch(

        API_URL,

        {

            method:
                "POST",

            headers: {

                "Content-Type":
                    "text/plain"

            },

            body:
                JSON.stringify(data)

        }

    )
    .then(
        function(){

            console.log(
                "📌 위치 기록 완료"
            );

        }
    )
    .catch(
        function(error){

            console.log(
                "RECORD ERROR",
                error
            );

        }
    );


    /*
     * 화면 표시
     */

    showRecordInfo(
        data,
        position
    );


    alert(
        "📌 현위치 기록 완료\n\n" +
        "위도: " +
        data.lat.toFixed(6) +
        "\n" +
        "경도: " +
        data.lng.toFixed(6)
    );

}


/* =========================================================

        <br><br>

        구조대:
        ${data.name || "-"}

        <br>

        시간:
        ${data.recordTime}

        <br>

        위도:
        ${data.lat.toFixed(6)}

        <br>

        경도:
        ${data.lng.toFixed(6)}

        <br>

        ${accuracyText}

/* =========================================================
   AUTO CENTER
========================================================= */

function startMobileCenter(){

    if(centerInterval)
        return;


    centerInterval =
        setInterval(

            function(){

                if(lastPos){

                    map.setCenter(

                        new kakao.maps.LatLng(

                            lastPos.lat,
                            lastPos.lng

                        )

                    );

                }

            },

            5000

        );

}


/* =========================================================
   STOP
========================================================= */

async function stopTracking(){

    endTime =
        getNowTime();


    if(lastPos){

        fetch(

            API_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain"

                },

                body:

                    JSON.stringify({

                        ...lastPos,

                        status:
                            "STOP",

                        startTime:
                            startTime,

                        endTime:
                            endTime

                    })

            }

        );

    }


    if(
        watchId !== null
    ){

        navigator.geolocation
            .clearWatch(
                watchId
            );

        watchId = null;

    }


    clearInterval(
        intervalSend
    );

    clearInterval(
        intervalLoad
    );

    clearInterval(
        centerInterval
    );


    intervalSend = null;

    intervalLoad = null;

    centerInterval = null;


    await releaseWakeLock();


    lastPos = null;

    myName = "";

    startTime = "";

    endTime = "";


    /*
     * 실시간 마커 제거
     */

    Object.values(
        liveMarkers
    )
    .forEach(
        function(marker){

            marker.setMap(null);

        }
    );


    Object.keys(
        liveMarkers
    )
    .forEach(
        function(key){

            delete liveMarkers[key];

        }
    );


    Object.values(
        liveLabels
    )
    .forEach(
        function(label){

            label.setMap(null);

        }
    );


    Object.keys(
        liveLabels
    )
    .forEach(
        function(key){

            delete liveLabels[key];

        }
    );


    nameInput.disabled = false;

    nameInput.value = "";

    startBtn.disabled = true;


    alert(
        "⛔ STOP 완료"
    );

}

   HISTORY LOAD

/* =========================================================
   HISTORY CLEAR
========================================================= */

function clearHistory(){

    historyMarkers
    .forEach(
        function(marker){

            marker.setMap(null);

        }
    );


    historyMarkers.length = 0;


    historyLines
    .forEach(
        function(line){

            line.setMap(null);

        }
    );


    historyLines.length = 0;


    historyLabels
    .forEach(
        function(label){

            label.setMap(null);

        }
    );


    historyLabels.length = 0;

}


/* =========================================================
   HISTORY DISPLAY
========================================================= */

function showHistory(data){

    if(
        !Array.isArray(data)
    ){

        return;

    }


    const grouped = {};

    const recordData = [];


    data.sort(
        function(a,b){

            return new Date(a.time || a.recordTime)
                -
                new Date(b.time || b.recordTime);

        }
    );


    data.forEach(
        function(d){

            const lat =
                Number(d.lat);

            const lng =
                Number(d.lng);


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            ){

                return;

            }


            /*
             * 수동 기록
             */

            if(
                d.status === "RECORD"
            ){

                recordData.push(d);

                return;

            }


            /*
             * 이동 경로
             */

            if(
                !grouped[d.name]
            ){

                grouped[d.name] = [];

            }


            grouped[d.name].push(

                new kakao.maps.LatLng(
                    lat,
                    lng
                )

            );

        }
    );


    let historyBounds =
        new kakao.maps.LatLngBounds();


    /*
     * 이동경로
     */

    for(
        const name in grouped
    ){

        const path =
            grouped[name];


        if(
            path.length === 0
        ){

            continue;

        }


        path.forEach(
            function(position){

                historyBounds.extend(
                    position
                );

            }
        );


        if(
            path.length >= 2
        ){

            const line =
                new kakao.maps.Polyline({

                    map:
                        map,

                    path:
                        path,

                    strokeWeight:
                        4,

                    strokeColor:
                        "#ffcc00",

                    strokeOpacity:
                        .8

                });


            historyLines.push(
                line
            );

        }


        const startMarker =
            new kakao.maps.Marker({

                map:
                    map,

                position:
                    path[0]

            });


        historyMarkers.push(
            startMarker
        );


        const endMarker =
            new kakao.maps.Marker({

                map:
                    map,

                position:
                    path[path.length - 1]

            });


        historyMarkers.push(
            endMarker
        );


        const startLabel =
            new kakao.maps.CustomOverlay({

                map:
                    map,

                position:
                    path[0],

                content:

                    `<div class="name-label">
                        🟢 START ${name}
                    </div>`,

                yAnchor:
                    1.5

            });


        historyLabels.push(
            startLabel
        );


        const endLabel =
            new kakao.maps.CustomOverlay({

                map:
                    map,

                position:
                    path[path.length - 1],

                content:

                    `<div class="name-label">
                        🔴 END ${name}
                    </div>`,

                yAnchor:
                    1.5

            });


        historyLabels.push(
            endLabel
        );

    }


    /*
     * 수동 기록 표시
     */

    recordData.forEach(
        function(d){

            const position =
                new kakao.maps.LatLng(
                    Number(d.lat),
                    Number(d.lng)
                );


            const marker =
                new kakao.maps.Marker({

                    map:
                        map,

                    position:
                        position

                });


            historyMarkers.push(
                marker
            );


            const label =
                new kakao.maps.CustomOverlay({

                    map:
                        map,

                    position:
                        position,

                    content:

                        `<div class="record-label">
                            📌 ${d.name || "기록"}
                        </div>`,

                    yAnchor:
                        1.5

                });


            historyLabels.push(
                label
            );


            kakao.maps.event.addListener(

                marker,

                "click",

                function(){

                    showRecordInfo(
                        d,
                        position
                    );

                }

            );


            historyBounds.extend(
                position
            );

        }
    );


    if(
        recordData.length > 0 ||
        Object.keys(grouped).length > 0
    ){

        map.setBounds(
            historyBounds
        );

    }

}

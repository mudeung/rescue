<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무등산특수산악구조팀 탐방로 조사기록</title>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Arial;background:#0f172a;color:#fff;}
header{background:#1e3a8a;padding:15px;text-align:center;font-weight:bold;}

#statusMessage{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    background:#16a34a;
    color:white;
    padding:10px 20px;
    border-radius:8px;
    font-weight:bold;
    display:none;
    z-index:2000;
}

#controls{
    position:absolute;
    top:70px;
    left:10px;
    z-index:1000;
    background:#1e293b;
    padding:12px;
    border-radius:8px;
    width:240px;
}

#controls textarea{
    width:100%;
    height:70px;
    margin-bottom:8px;
    padding:6px;
    border-radius:6px;
    border:none;
    resize:none;
}

#controls button{
    display:block;
    width:100%;
    height:40px;
    margin-bottom:8px;
    border:none;
    border-radius:6px;
    background:#1e40af;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

#controls button:disabled{
    opacity:0.4;
    cursor:not-allowed;
}

#networkStatus, #gpsStatus{
    font-size:12px;
    margin-bottom:6px;
    padding:6px;
    border-radius:6px;
    background:#334155;
}

#map{
    width:100%;
    height:calc(100vh - 60px);
}
</style>
</head>

<body>

<header>무등산특수산악구조팀 탐방로 조사기록</header>
<div id="statusMessage"></div>

<div id="controls">
    <textarea id="memo" placeholder="현장 조사기록 입력"></textarea>

    <div id="networkStatus">🌐 네트워크: 확인중...</div>
    <div id="gpsStatus">📡 GPS 정확도: - m</div>

    <button onclick="loadRecords()">📂 기록 불러오기</button>
    <button onclick="checkCurrentLocation()">📍 현위치 확인</button>
    <button id="saveBtn" onclick="saveCurrentLocation()">💾 현위치 저장</button>
</div>

<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyQSj47r-l2fSmBePIC11bAGtICM4eoQ7_WXXH3DuEkytDfyf524ROm0PLIQJSJmgikow/exec";

let map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(35.131477, 126.947891),
    level: 4
});

let currentMarker = null;
let isSaving = false;
let recordMarkers = [];
let lastSavedLocation = null;

let polyline = new kakao.maps.Polyline({
    map: map,
    path: [],
    strokeWeight: 4,
    strokeColor: '#FF0000',
    strokeOpacity: 0.8
});

/* 거리 계산 */
function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;

    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

/* 저장 버튼 활성/비활성 */
function setSaveButtonEnabled(enabled){
    const btn = document.getElementById("saveBtn");
    btn.disabled = !enabled;
}

/* 네트워크 상태 */
function updateNetworkStatus(){
    const networkDiv = document.getElementById("networkStatus");

    if(navigator.onLine){
        networkDiv.innerText = "🌐 네트워크: 온라인";
        networkDiv.style.background = "#16a34a";
        setSaveButtonEnabled(true);
    }else{
        networkDiv.innerText = "🌐 네트워크: 오프라인";
        networkDiv.style.background = "#dc2626";
        setSaveButtonEnabled(false);
    }
}

window.addEventListener("online", updateNetworkStatus);
window.addEventListener("offline", updateNetworkStatus);
updateNetworkStatus();

/* 위치 확인 */
function checkCurrentLocation(){
    navigator.geolocation.getCurrentPosition(updateMap, errorHandler, {enableHighAccuracy:true});
}

/* 위치 저장 */
function saveCurrentLocation(){
    navigator.geolocation.getCurrentPosition(pos=>{
        updateMap(pos);
        sendToSheet(pos);
    }, errorHandler, {enableHighAccuracy:true});
}

/* 지도 업데이트 + GPS 정확도 */
function updateMap(position){
    const lat = position.coords.latitude;
    const lng = position.coords.longitude;
    const accuracy = Math.round(position.coords.accuracy);

    const gpsDiv = document.getElementById("gpsStatus");
    gpsDiv.innerText = `📡 GPS 정확도: ${accuracy} m`;

    if(accuracy <= 5){
        gpsDiv.style.background = "#16a34a";
    }else if(accuracy <= 20){
        gpsDiv.style.background = "#f59e0b";
    }else{
        gpsDiv.style.background = "#dc2626";
        gpsDiv.innerText += " (정확도 낮음 - 저장 차단)";
        setSaveButtonEnabled(false);
        return;
    }

    const loc = new kakao.maps.LatLng(lat,lng);

    if(currentMarker){
        currentMarker.setPosition(loc);
    }else{
        currentMarker = new kakao.maps.Marker({map:map, position:loc});
    }

    let path = polyline.getPath();
    path.push(loc);
    polyline.setPath(path);

    map.panTo(loc);
}

/* 서버 전송 */
function sendToSheet(position){

    if(!navigator.onLine){
        alert("오프라인 상태에서는 저장할 수 없습니다.");
        return;
    }

    if(position.coords.accuracy > 20){
        alert("GPS 정확도가 낮아 저장할 수 없습니다. (20m 이하 필요)");
        return;
    }

    const lat = position.coords.latitude;
    const lng = position.coords.longitude;

    if(lastSavedLocation){
        const distance = getDistance(
            lastSavedLocation.lat,
            lastSavedLocation.lng,
            lat,
            lng
        );
        if(distance < 5){
            alert("5m 이상 이동 후 저장 가능합니다.");
            return;
        }
    }

    if(isSaving) return;
    isSaving = true;

    const saveBtn = document.getElementById("saveBtn");
    const statusMessage = document.getElementById("statusMessage");

    saveBtn.innerText = "저장 중…";
    saveBtn.style.background = "#f59e0b";

    fetch(WEB_APP_URL,{
        method:"POST",
        body: JSON.stringify({
            lat: lat,
            lng: lng,
            memo: document.getElementById("memo").value
        })
    })
    .then(res=>res.json())
    .then(()=>{
        saveBtn.innerText = "저장 완료";
        saveBtn.style.background = "#16a34a";

        statusMessage.innerText = "저장이 완료되었습니다.";
        statusMessage.style.display = "block";

        setTimeout(()=>{
            statusMessage.style.display = "none";
            saveBtn.innerText = "💾 현위치 저장";
            saveBtn.style.background = "#1e40af";
        },2000);

        document.getElementById("memo").value = "";
        lastSavedLocation = {lat: lat, lng: lng};
    })
    .catch(()=>{
        alert("저장 실패 - 네트워크 확인");
        saveBtn.innerText = "💾 현위치 저장";
        saveBtn.style.background = "#1e40af";
    })
    .finally(()=>{
        isSaving = false;
    });
}

/* 기록 불러오기 */
function loadRecords(){
    recordMarkers.forEach(m=>m.setMap(null));
    recordMarkers = [];

    fetch(WEB_APP_URL)
    .then(res=>res.json())
    .then(data=>{
        data.forEach(item=>{
            let pos = new kakao.maps.LatLng(item.lat,item.lng);
            let marker = new kakao.maps.Marker({map:map,position:pos});
            recordMarkers.push(marker);

            let infowindow = new kakao.maps.InfoWindow({
                content:`<div style="padding:5px;color:black;">
                ${item.memo}<br>${new Date(item.time).toLocaleString()}
                </div>`
            });

            kakao.maps.event.addListener(marker,'click',function(){
                infowindow.open(map,marker);
            });
        });
    });
}

function errorHandler(){
    alert("GPS 오류 또는 권한 차단");
}

</script>
</body>
</html>

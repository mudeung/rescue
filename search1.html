    color:#fff;

/* =========================================================
   HEADER
   ========================================================= */

header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:55px;
    z-index:2000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#1e3a8a;

    padding:8px 50px 8px 10px;

    text-align:center;
    font-size:16px;
    font-weight:bold;

    box-shadow:0 3px 10px rgba(0,0,0,.4);
}


/* =========================================================
   MAP
   ========================================================= */

#map{
    position:absolute;
    top:55px;
    left:0;
    right:0;
    bottom:0;

    width:100%;
    height:calc(100vh - 55px);
}


/* =========================================================
   CONTROLS
   ========================================================= */

#controls{
    position:fixed;
    top:65px;
    left:8px;

    z-index:1500;

    width:175px;
    max-height:calc(100vh - 75px);

    overflow-y:auto;

    padding:7px;

    background:rgba(15,23,42,.94);

    border:1px solid rgba(255,255,255,.2);
    border-radius:12px;

    box-shadow:0 5px 20px rgba(0,0,0,.4);

    backdrop-filter:blur(8px);
}

#controls button{
    display:block;

    width:100%;
    margin-bottom:6px;

    padding:10px 8px;

    border:0;
    border-radius:7px;

    background:#1e40af;
    color:#fff;

    font-size:12px;
    font-weight:bold;

    cursor:pointer;
}

#controls button:active{
    transform:scale(.96);
}

#controls button:last-child{
    margin-bottom:0;
}

#highBtn{
    background:#1d4ed8;
}

#middleBtn{
    background:#a16207;
}

#lowBtn{
    background:#15803d;
}

#trackStartBtn{
    background:#059669;
}

#trackStopBtn{
    background:#dc2626;
}

#measureStartBtn{
    background:#b91c1c;
}

#measureStopBtn{
    background:#475569;
}

#measureResetBtn{
    background:#7c3aed;
}


/* =========================================================
   RECORD PANEL
   ========================================================= */

#recordPanel{
    position:fixed;

    left:8px;
    right:8px;
    bottom:8px;

    z-index:1800;

    max-width:500px;

    padding:10px;

    background:rgba(2,6,23,.95);

    border:1px solid #38bdf8;
    border-radius:12px;

    box-shadow:0 5px 25px rgba(0,0,0,.5);

#recordText{
    width:100%;
    height:55px;

    resize:none;

    border:1px solid #475569;
    border-radius:7px;

    background:#020617;
    color:#fff;

    padding:9px;

    outline:none;

    font-size:13px;
}

#recordText:focus{
    border-color:#38bdf8;

    box-shadow:
        0 0 8px

#saveRecordBtn{
    width:100%;
    margin-top:6px;

    padding:11px;

    border:0;
    border-radius:7px;

    background:#059669;
    color:#fff;

    font-size:13px;
    font-weight:bold;
}


/* =========================================================
   RECORD LIST
   ========================================================= */

#recordList{
    max-height:180px;
    overflow-y:auto;
    margin-top:7px;
}

.recordItem{
    padding:8px;
    margin-bottom:5px;

    background:#111827;

    border-left:3px solid #38bdf8;
    border-radius:5px;

    font-size:11px;

.recordItem .moveBtn{

/* =========================================================
   STATUS
   ========================================================= */

    right:8px;
    top:65px;

    z-index:1600;

    max-width:190px;

    padding:7px 10px;

    background:rgba(2,6,23,.9);

    border:1px solid #475569;
    border-radius:8px;

    font-size:11px;

/* =========================================================
   LOCATION LABEL
   ========================================================= */

.location-label{
    background:#020617;
    color:#38bdf8;

    border:1px solid #38bdf8;

    padding:5px 8px;

    border-radius:6px;

    font-size:11px;
    font-weight:bold;

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    }

    }

        right:6px;
        font-size:10px;
        max-width:160px;
    }

/* =========================================================

   ========================================================= */

    var position =

            data.lat,
            data.lng
        );


    var circle =

            center:position,

            radius:data.radius,

            strokeWeight:2,

            strokeColor:data.color,

            strokeOpacity:.9,

            fillColor:data.color,

            fillOpacity:.4,

            clickable:true,

            zIndex:1

        });


    circle.setMap(null);


    var marker =
        new kakao.maps.Marker({

            position:position,

            map:null,

            title:data.name

        });


    function selectLocation(){

        if(selectedCircle){

            selectedCircle.circle.setOptions({

                strokeColor:

                fillColor:

                fillOpacity:.4,

        circle.setOptions({

            strokeOpacity:1,

            zIndex:10

        selectedCircle = {

/* =========================================================
   ZONE TOGGLE
   ========================================================= */

function toggleZone(zone){

    zoneVisibility[zone] =
        !zoneVisibility[zone];


    circles.forEach(function(item){

        if(item.zone === zone){

            item.circle.setMap(
                zoneVisibility[zone]
                ? map
                : null
            );


            item.marker.setMap(
                zoneVisibility[zone]
                ? map
                : null
            );

        }

    });


    updateZoneButtons();

}


/* =========================================================
   GPS
   ========================================================= */

var userMarker = null;

var userAccuracyCircle = null;

var lastLatitude = null;

var lastLongitude = null;

var currentAccuracy = 0;


function getCurrentLocation(callback){

    if(!navigator.geolocation){

        alert(
            "이 기기에서 GPS를 사용할 수 없습니다."
        );

        return;

    }


    setStatus(
        "📡 GPS 위치 확인 중..."
    );


    navigator.geolocation.getCurrentPosition(

        function(position){

            saveAndDisplay(

                position.coords.latitude,

                position.coords.longitude,

                position.coords.accuracy

            );


            setStatus(
                "📍 GPS 확인 완료 (" +
                Math.round(
                    Number(position.coords.accuracy || 0)
                ) +
                "m)"
            );


            if(callback){

                callback();

            }

        },

        function(error){

            setStatus(
                "❌ GPS 오류"
            );


            alert(
                "GPS 오류 : " +
                getGeolocationErrorMessage(error)
            );

        },

        {

            enableHighAccuracy:true,

            maximumAge:1000,

            timeout:15000

        }

    );

}


/* =========================================================
   GPS ERROR MESSAGE
   ========================================================= */

function getGeolocationErrorMessage(error){

    if(!error){
        return "알 수 없는 오류";
    }


    if(error.code === 1){
        return "위치 권한이 거부되었습니다.";
    }


    if(error.code === 2){
        return "현재 위치를 확인할 수 없습니다.";
    }


    if(error.code === 3){
        return "GPS 응답 시간이 초과되었습니다.";
    }


    return error.message || "알 수 없는 오류";

}


/* =========================================================
   DISPLAY LOCATION
   ========================================================= */

function saveAndDisplay(
    lat,
    lng,
    accuracy

    lat = Number(lat);

    lng = Number(lng);

    accuracy = Number(accuracy) || 0;


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        setStatus(
            "⚠️ 잘못된 GPS 좌표"
        );

        return;

    }


    lastLatitude = lat;

    lastLongitude = lng;

    currentAccuracy = accuracy;


    var locPosition =
        new kakao.maps.LatLng(
            lat,
            lng
        );


    if(userMarker){

        userMarker.setPosition(
            locPosition
        );

    }
    else{

        userMarker =
            new kakao.maps.Marker({

                map:map,

                position:locPosition,

                title:"현재 위치"

            });

    }


    if(userAccuracyCircle){

        userAccuracyCircle.setPosition(
            locPosition
        );

        userAccuracyCircle.setRadius(
            accuracy || 20
        );

    }
    else{

        userAccuracyCircle =
            new kakao.maps.Circle({

                map:map,

                center:locPosition,

                radius:
                    accuracy || 20,

                strokeWeight:1,

                strokeColor:"#00FFFF",

                strokeOpacity:.7,

                fillColor:"#00FFFF",

                fillOpacity:.12

            });

    }


    map.panTo(locPosition);

}


/* =========================================================
   PREPARE RECORD
   ========================================================= */

function prepareRecord(){

    getCurrentLocation(function(){

        document
            .getElementById("recordText")
            .focus();

    });

}


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

var STORAGE_KEY =
    "MUDEUNG_MOUNTAIN_RECORDS";


function getRecords(){

    try{

        return JSON.parse(

            localStorage.getItem(
                STORAGE_KEY
            ) || "[]"

        );

    }
    catch(e){

        console.error(e);

        return [];

    }

}


function saveRecords(records){

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(records)

    );

}


/* =========================================================
   SAVE RECORD
   ========================================================= */

function saveCurrentRecord(){

    if(
        lastLatitude === null ||
        lastLongitude === null
    ){

        alert(
            "먼저 📍 현위치를 가져오세요."
        );


        getCurrentLocation();

        return;

    }


    var text =
        document
            .getElementById("recordText")
            .value
            .trim();


    if(!text){

        alert(
            "현장 기록 내용을 입력하세요."
        );


        document
            .getElementById("recordText")
            .focus();


        return;

    }


    var now =
        new Date();


    var record = {

        id:
            Date.now(),

        time:
            now.toLocaleString("ko-KR"),

        timestamp:
            now.getTime(),

        lat:
            lastLatitude,

        lng:
            lastLongitude,

        accuracy:
            currentAccuracy,

        text:
            text,

        name:
            "무등산특수구조대"

    };


    var records =
        getRecords();


    records.unshift(record);


    saveRecords(records);


    addRecordMarker(record);


    renderRecordList();


    document
        .getElementById("recordText")
        .value = "";


    setStatus(
        "💾 기기 저장 완료 / ☁️ 서버 전송 중..."
    );


    sendRecordToServer(record)

        .then(function(){

            setStatus(
                "💾 기기 저장 완료 / ☁️ 서버 전송 요청 완료"
            );

        })

        .catch(function(error){

            console.error(error);

            setStatus(
                "💾 기기 저장 완료 / ⚠️ 서버 전송 실패"
            );

        });


    alert(
        "💾 현장기록이 기기에 저장되었습니다.\n\n☁️ 서버 전송도 요청했습니다."
    );

}


/* =========================================================
   SEND TO GOOGLE APPS SCRIPT
   ========================================================= */

function sendRecordToServer(record){

    if(!GOOGLE_SCRIPT_URL){

        return Promise.reject(
            new Error(
                "Google Apps Script URL 미설정"
            )
        );

    }


    return fetch(

        GOOGLE_SCRIPT_URL,

        {

            method:"POST",

            mode:"no-cors",

            headers:{
                "Content-Type":
                    "text/plain;charset=utf-8"
            },

            body:
                JSON.stringify({

                    type:
                        "FIELD_RECORD",

                    time:
                        record.time,

                    timestamp:
                        record.timestamp,

                    lat:
                        record.lat,

                    lng:
                        record.lng,

                    accuracy:
                        record.accuracy,

                    text:
                        record.text,

                    name:
                        record.name

                })

        }

    );

}


/* =========================================================
   RECORD MARKERS
   ========================================================= */

var recordMarkers = [];


function addRecordMarker(record){

    var lat =
        Number(record.lat);

    var lng =
        Number(record.lng);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return;

    }


    var position =
        new kakao.maps.LatLng(
            lat,
            lng
        );


    var marker =
        new kakao.maps.Marker({

            map:map,

            position:position,

            title:
                "📝 현장기록"

        });


    recordMarkers.push(marker);


    kakao.maps.event.addListener(

        marker,

        "click",

        function(){

            var content = `

                <div style="
                    padding:10px;
                    color:#000;
                    font-size:12px;
                    line-height:1.6;
                    min-width:190px;
                ">

                    <strong>📝 현장기록</strong><br>

                    ${escapeHTML(
                        String(record.time || "")
                    )}<br>

                    위도 :
                    ${lat.toFixed(6)}<br>

                    경도 :
                    ${lng.toFixed(6)}<br>

                    정확도 :
                    ${Math.round(
                        Number(record.accuracy || 0)
                    )}m

                    <hr>

                    ${escapeHTML(
                        String(record.text || "")
                    )}

                </div>

            `;


            infowindow.setContent(content);

            infowindow.open(
                map,
                marker
            );

        }

    );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================================================
   COORDINATE COPY
   ========================================================= */

function copyCoordinates(lat, lng){

    var coordinate =
        Number(lat).toFixed(6) +
        ", " +
        Number(lng).toFixed(6);


    function copySuccess(){

        setStatus(
            "📋 좌표 복사 완료"
        );

        /*
         * 좌표 복사 완료 후
         * 카카오맵 팝업 자동 닫기
         */

        infowindow.close();

    }


    /*
     * 최신 브라우저
     */

    if(
        navigator.clipboard &&
        window.isSecureContext
    ){

        navigator.clipboard
            .writeText(coordinate)

            .then(function(){

                copySuccess();

            })

            .catch(function(){

                fallbackCopyCoordinates(
                    coordinate
                );

            });

    }

    /*
     * 모바일/구형 브라우저 대응
     */

    else{

        fallbackCopyCoordinates(
            coordinate
        );

    }

}


/* =========================================================
   CLIPBOARD FALLBACK
   ========================================================= */

function fallbackCopyCoordinates(text){

    var textarea =
        document.createElement("textarea");


    textarea.value = text;


    textarea.style.position =
        "fixed";

    textarea.style.left =
        "-9999px";


    textarea.style.top =
        "0";


    document.body.appendChild(
        textarea
    );


    textarea.focus();

    textarea.select();


    try{

        var success =
            document.execCommand("copy");


        if(success){

            setStatus(
                "📋 좌표 복사 완료"
            );


            /*
             * 복사 성공 후 팝업 닫기
             */

            infowindow.close();

        }
        else{

            alert(
                "좌표 복사에 실패했습니다.\n\n" +
                text
            );

        }

    }
    catch(error){

        console.error(error);


        alert(
            "좌표 복사에 실패했습니다.\n\n" +
            text
        );

    }


    document.body.removeChild(
        textarea
    );

}


/* =========================================================
   RECORD LIST
   ========================================================= */

function renderRecordList(){

    var list =
        document.getElementById(
            "recordList"
        );


    var records =
        getRecords();


    if(records.length === 0){

        list.innerHTML = "";

        return;

    }


    list.innerHTML =

        records.map(function(record){

            return `

                <div class="recordItem">

                    🕒
                    ${escapeHTML(
                        String(record.time || "")
                    )}

                    <br>

                    📍
                    ${Number(record.lat).toFixed(6)},
                    ${Number(record.lng).toFixed(6)}

                    <br>

                    🎯
                    정확도
                    ${Math.round(
                        Number(record.accuracy || 0)
                    )}m

                    <br>

                    📝
                    ${escapeHTML(
                        String(record.text || "")
                    )}

                    <br>

                    <button
                        onclick="deleteRecord(${record.id})">
                        삭제
                    </button>

                    <button
                        class="moveBtn"
                        onclick="moveToRecord(
                            ${Number(record.lat)},
                            ${Number(record.lng)}
                        )">
                        지도 이동
                    </button>

                </div>

            `;

        }).join("");

}


/* =========================================================
   MOVE TO RECORD
   ========================================================= */

function moveToRecord(lat,lng){

    var position =
        new kakao.maps.LatLng(
            Number(lat),
            Number(lng)
        );


    map.setLevel(3);

    map.panTo(position);

}


/* =========================================================
   DELETE LOCAL RECORD
   ========================================================= */

function deleteRecord(id){

    if(
        !confirm(
            "이 기기의 저장 기록을 삭제하시겠습니까?\n\n서버 기록은 삭제되지 않습니다."
        )
    ){

        return;

    }


    var records =
        getRecords()
        .filter(function(r){

            return r.id !== id;

        });


    saveRecords(records);


    redrawRecordMarkers();

    renderRecordList();


    setStatus(
        "🗑 기기 기록 삭제 완료"
    );

}


/* =========================================================
   REDRAW LOCAL MARKERS
   ========================================================= */

function redrawRecordMarkers(){

    recordMarkers.forEach(function(marker){

        marker.setMap(null);

    });


    recordMarkers = [];


    getRecords()
        .forEach(function(record){

            addRecordMarker(record);

        });

}


/* =========================================================
   SHOW ALL LOCAL RECORDS
   ========================================================= */

function showAllRecords(){

    renderRecordList();


    var records =
        getRecords();


    if(records.length === 0){

        alert(
            "이 기기에 저장된 현장 기록이 없습니다."
        );

        return;

    }


    var recordBounds =
        new kakao.maps.LatLngBounds();


    records.forEach(function(record){

        var lat =
            Number(record.lat);

        var lng =
            Number(record.lng);


        if(
            Number.isFinite(lat) &&
            Number.isFinite(lng)
        ){

            recordBounds.extend(

                new kakao.maps.LatLng(
                    lat,
                    lng
                )

            );

        }

    });


    map.setBounds(
        recordBounds
    );

}


/* =========================================================
   CLEAR LOCAL RECORDS
   ========================================================= */

function clearAllRecords(){

    if(
        !confirm(
            "이 기기에 저장된 모든 현장기록을 삭제하시겠습니까?\n\nGoogle Sheets의 서버 기록은 삭제되지 않습니다."
        )
    ){

        return;

    }


    localStorage.removeItem(
        STORAGE_KEY
    );


    recordMarkers.forEach(function(marker){

        marker.setMap(null);

    });


    recordMarkers = [];


    renderRecordList();


    setStatus(
        "🗑 기기 기록 전체 삭제 완료"
    );

}


/* =========================================================
   SERVER RECORDS
   ========================================================= */

var serverRecords = [];

var serverRecordMarkers = [];


function loadServerRecords(){

    if(!GOOGLE_SCRIPT_URL){

        alert(
            "Google Apps Script URL이 설정되지 않았습니다."
        );

        return;

    }


    setStatus(
        "☁️ 서버 기록 불러오는 중..."
    );


    fetch(
        GOOGLE_SCRIPT_URL +
        "?action=getRecords"
    )

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "HTTP 오류 " +
                response.status
            );

        }


        return response.json();

    })

    .then(function(data){

        if(!Array.isArray(data)){

            throw new Error(
                "서버 응답 형식 오류"
            );

        }


        serverRecords = data;


        drawServerRecordMarkers();


        setStatus(
            "☁️ 서버 기록 " +
            data.length +
            "건 확인"
        );

    })

    .catch(function(error){

        console.error(error);


        setStatus(
            "⚠️ 서버 기록 불러오기 실패"
        );


        console.warn(
            "서버 기록 오류:",
            error
        );

    });

}


/* =========================================================
   SERVER MARKERS
   ========================================================= */

function drawServerRecordMarkers(){

    serverRecordMarkers.forEach(function(marker){

        marker.setMap(null);

    });


    serverRecordMarkers = [];


    serverRecords.forEach(function(record){

        var lat =
            Number(record.lat);

        var lng =
            Number(record.lng);


        if(
            !Number.isFinite(lat) ||
            !Number.isFinite(lng)
        ){

            return;

        }


        var position =
            new kakao.maps.LatLng(
                lat,
                lng
            );


        var marker =
            new kakao.maps.Marker({

                map:map,

                position:position,

                title:
                    "☁️ 서버 현장기록"

            });


        serverRecordMarkers.push(marker);


        kakao.maps.event.addListener(

            marker,

            "click",

            function(){

                var content = `

                    <div style="
                        padding:10px;
                        color:#000;
                        font-size:12px;
                        line-height:1.6;
                        min-width:200px;
                    ">

                        <strong>
                            ☁️ 서버 현장기록
                        </strong>

                        <br>

                        ${escapeHTML(
                            String(record.time || "")
                        )}

                        <br>

                        위도 :
                        ${lat.toFixed(6)}

                        <br>

                        경도 :
                        ${lng.toFixed(6)}

                        <br>

                        정확도 :
                        ${Math.round(
                            Number(
                                record.accuracy || 0
                            )
                        )}m

                        <hr>

                        ${escapeHTML(
                            String(
                                record.text || ""
                            )
                        )}

                        <br>

                        기록자 :
                        ${escapeHTML(
                            String(
                                record.name || ""
                            )
                        )}

                    </div>

                `;


                infowindow.setContent(
                    content
                );


                infowindow.open(
                    map,
                    marker
                );

            }

        );

    });

}


/* =========================================================
   DISTANCE MEASURE
   ========================================================= */

var drawingFlag = false;

var clickLine = null;

var dots = [];


function startMeasure(){

    drawingFlag = true;


    setStatus(
        "📏 거리 측정 중"
    );


    alert(
        "📏 지도 위를 클릭하여 거리 측정을 시작하세요."
    );

}


function stopMeasure(){

    drawingFlag = false;


    setStatus(
        "⛔ 거리 측정 종료"
    );

}


function resetMeasure(){

    drawingFlag = false;


    if(clickLine){

        clickLine.setMap(null);

        clickLine = null;

    }


    dots.forEach(function(dot){

        dot.circle.setMap(null);

        dot.overlay.setMap(null);

    });


    dots = [];


    setStatus(
        "🔄 거리 측정 리셋"
    );

}


/* =========================================================
   MAP CLICK FOR MEASURE
   ========================================================= */

kakao.maps.event.addListener(

    map,

    "click",

    function(mouseEvent){

        if(!drawingFlag){

            return;

        }


        var clickPosition =
            mouseEvent.latLng;


        if(!clickLine){

            clickLine =
                new kakao.maps.Polyline({

                    map:map,

                    path:[
                        clickPosition
                    ],

                    strokeWeight:4,

                    strokeColor:"#FF0000",

                    strokeOpacity:.9

                });

        }
        else{

            var path =
                clickLine.getPath();


            path.push(
                clickPosition
            );


            clickLine.setPath(
                path
            );

        }


        addDot(

            clickPosition,

            clickLine.getLength()

        );

    }

);


/* =========================================================
   DISTANCE DOT
   ========================================================= */

function addDot(
    position,
    distance
){

    var circle =
        new kakao.maps.Circle({

            center:position,

            radius:3,

            strokeWeight:2,

            strokeColor:"#FF0000",

            fillColor:"#FF0000",

            fillOpacity:1

        });


    circle.setMap(map);


    var overlay =
        new kakao.maps.CustomOverlay({

            content:

                `<div style="
                    background:#FF0000;
                    color:#fff;
                    padding:4px 6px;
                    font-size:11px;
                    border-radius:4px;
                    white-space:nowrap;
                ">
                    총거리 :
                    ${distance.toFixed(0)}m
                </div>`,

            position:position,

            yAnchor:1

        });


    overlay.setMap(map);


    dots.push({

        circle:circle,

        overlay:overlay

    });

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text){

    document
        .getElementById("status")
        .textContent = text;

}


/* =========================================================
   REALTIME TRACKING
   ========================================================= */

var trackingId = null;

var wakeLock = null;


function startTracking(){

    if(trackingId !== null){

        alert(
            "이미 실시간 추적 중입니다."
        );

        return;

    }


    if(!navigator.geolocation){

        alert(
            "GPS를 사용할 수 없습니다."
        );

        return;

    }


    requestWakeLock();


    trackingId =
        navigator.geolocation.watchPosition(

            function(position){

                saveAndDisplay(

                    position.coords.latitude,

                    position.coords.longitude,

                    position.coords.accuracy

                );


                setStatus(
                    "🟢 실시간 추적 중 / 정확도 " +
                    Math.round(
                        Number(
                            position.coords.accuracy || 0
                        )
                    ) +
                    "m"
                );

            },

            function(error){

                console.log(
                    "GPS ERROR",
                    error
                );


                setStatus(
                    "⚠️ GPS 오류"
                );

            },

            {

                enableHighAccuracy:true,

                maximumAge:1000,

                timeout:15000

            }

        );


    alert(
        "🟢 실시간 추적 시작"
    );

}


function stopTracking(){

    if(trackingId !== null){

        navigator.geolocation
            .clearWatch(
                trackingId
            );

        trackingId = null;

    }


    releaseWakeLock();


    setStatus(
        "🔴 실시간 추적 종료"
    );


    alert(
        "🔴 실시간 추적 종료"
    );

}


/* =========================================================
   WAKE LOCK
   ========================================================= */

async function requestWakeLock(){

    try{

        if(
            "wakeLock" in navigator &&
            document.visibilityState === "visible"
        ){

            wakeLock =
                await navigator.wakeLock
                    .request("screen");

        }

    }
    catch(error){

        console.log(
            "WakeLock 오류",
            error
        );

    }

}


async function releaseWakeLock(){

    try{

        if(wakeLock){

            await wakeLock.release();

            wakeLock = null;

        }

    }
    catch(error){

        console.log(error);

    }

}


document.addEventListener(

    "visibilitychange",

    function(){

        if(
            document.visibilityState ===
            "visible" &&
            trackingId !== null
        ){

            requestWakeLock();

        }

    }

);


/* =========================================================
   INITIALIZE
   ========================================================= */

updateZoneButtons();

redrawRecordMarkers();

renderRecordList();

loadServerRecords();

setStatus(
    "☁️ 서버 연결 준비 완료"
);

</script>

<script>
/* =========================
   우클릭 및 개발자도구 단축키 방지
   ========================= */

document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
});

document.addEventListener('keydown', function(e) {

    // F12
    if (e.key === 'F12') {
        e.preventDefault();
        return false;
    }

    // Ctrl + U (페이지 소스 보기)
    if (e.ctrlKey && e.key.toLowerCase() === 'u') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + I (개발자 도구)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + J (콘솔)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + C (요소 선택)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
        e.preventDefault();
        return false;
    }

    // Ctrl + S (페이지 저장)
    if (e.ctrlKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        return false;
    }
});
</script>

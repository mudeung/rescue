<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚑 응급처치 현장 기록</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f4f6f8;margin:0;padding:20px;}
.container{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
h1{text-align:center;color:#b71c1c;}
label{font-weight:bold;display:block;margin-top:10px;}
input,textarea{width:100%;padding:8px;margin-top:5px;border:1px solid #ccc;border-radius:6px;}
textarea{min-height:80px;}
button{margin-top:15px;padding:14px 18px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;background:#1976d2;color:#fff;font-size:16px;width:100%;}
.gps-btn{background:#6a1b9a;margin-top:5px;}
</style>

<script>

const SCRIPT_URL = "YOUR_SCRIPT_URL"; // ← 웹앱 URL 입력

function getFormData(){
  return {
    arrivalTime: document.getElementById("arrivalTime").value,
    patientName: document.getElementById("patientName").value,
    phone: document.getElementById("phone").value,
    coordinates: document.getElementById("coordinates").value,
    patientStatus: document.getElementById("patientStatus").value,
    treatment: document.getElementById("treatment").value,
    crew: document.getElementById("crew").value
  };
}

function sendAndShare(){

  const data = getFormData();

  const message = `
🚑 응급처치 현장 기록

도착시간: ${data.arrivalTime}
환자이름: ${data.patientName}
연락처: ${data.phone}
좌표: ${data.coordinates}

[환자상태]
${data.patientStatus}

[응급처치]
${data.treatment}

출동대원: ${data.crew}
  `;

  fetch(SCRIPT_URL,{
    method:"POST",
    body: JSON.stringify(data)
  })
  .then(res=>res.json())
  .then(response=>{

    if(response.status === "saved"){

      if(navigator.share){
        navigator.share({
          title:"응급처치 기록",
          text:message
        });
      }else{
        navigator.clipboard.writeText(message);
        alert("저장 완료. 공유 기능이 지원되지 않아 내용이 복사되었습니다.");
      }

    }else{
      alert("Google Sheet 저장 실패");
    }

  })
  .catch(error=>{
    alert("오류 발생: " + error);
  });
}

function getGPS(){
  navigator.geolocation.getCurrentPosition(function(position){
    const lat = position.coords.latitude.toFixed(6);
    const lon = position.coords.longitude.toFixed(6);
    document.getElementById("coordinates").value = lat + ", " + lon;
  }, function(){
    alert("위치 정보를 가져올 수 없습니다.");
  });
}

</script>
</head>

<body>

<div class="container">
  <h1>🚑 응급처치 현장 기록</h1>

  <label>도착시간</label>
  <input type="datetime-local" id="arrivalTime">

  <label>환자 이름</label>
  <input type="text" id="patientName">

  <label>연락처</label>
  <input type="tel" id="phone">

  <label>좌표</label>
  <input type="text" id="coordinates">
  <button type="button" class="gps-btn" onclick="getGPS()">📍 현재 위치 자동 입력</button>

  <label>환자 상태</label>
  <textarea id="patientStatus"></textarea>

  <label>응급처치 내용</label>
  <textarea id="treatment"></textarea>

  <label>출동 구조대원</label>
  <input type="text" id="crew">

  <button type="button" onclick="sendAndShare()">
   📤 자동 전송 + 기록 공유
  </button>

</div>

</body>
</html>

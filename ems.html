<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚑 무등산 특수구조팀 통합 시스템</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=여기에_KAKAO_KEY"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
input,select,button{
  width:100%;padding:12px;margin:6px 0;
  border-radius:6px;border:none;font-size:16px;
}
button{background:#2e7d32;color:#fff;}
.card{
  background:#1e1e1e;padding:12px;margin:8px 0;border-radius:6px;
}
.red{background:#7f0000;}
.green{background:#1b5e20;}
.gray{background:#424242;}
#map{width:100%;height:250px;margin:10px 0;}
</style>
</head>
<body>

<header>🚨 무등산 특수구조팀 통합 시스템</header>
<div class="container">

<h3>📍 구조 신고</h3>

<form id="rescueForm">
<input type="text" id="name" placeholder="이름" required>
<input type="tel" id="phone" placeholder="연락처" required>
<input type="text" id="address" placeholder="위치 설명">
<select id="symptom">
<option>의식저하</option>
<option>골절의심</option>
<option>호흡곤란</option>
<option>기타</option>
</select>

<button type="button" id="gpsBtn">GPS 위치 가져오기</button>
<div id="map"></div>

<button type="submit">신고 접수</button>
</form>

<hr>

<h3>📡 실시간 접수 현황</h3>
<div id="listArea">로딩중...</div>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyRvv6h0Q5u0f5HHkT_mLhRlmKiOMMpBKljFzVPkTj7d1bGQmAj1S0YTvPUb9ujSSahxw/exec";
let currentLat="",currentLng="";

/* GPS */
document.getElementById("gpsBtn").onclick=()=>{
  navigator.geolocation.getCurrentPosition(p=>{
    currentLat=p.coords.latitude;
    currentLng=p.coords.longitude;

    const loc=new kakao.maps.LatLng(currentLat,currentLng);
    const map=new kakao.maps.Map(document.getElementById("map"),{
      center:loc,level:3
    });
    new kakao.maps.Marker({position:loc,map});
  });
};

/* 신고 접수 */
document.getElementById("rescueForm").onsubmit=async e=>{
  e.preventDefault();

  const data={
    "이름":document.getElementById("name").value,
    "연락처":document.getElementById("phone").value,
    "주소":document.getElementById("address").value,
    "위도":currentLat,
    "경도":currentLng,
    "증상":document.getElementById("symptom").value
  };

  await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(data)
  });

  alert("신고 접수 완료");
  loadData();
};

/* 목록 불러오기 */
async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();

  const area=document.getElementById("listArea");
  area.innerHTML="";

  data.reverse().forEach(item=>{
    let cls="red";
    if(item.status==="현장도착") cls="green";
    if(item.status==="사고처리완료") cls="gray";

    const div=document.createElement("div");
    div.className="card "+cls;

    div.innerHTML=`
      🕒 ${new Date(item.작성시간).toLocaleString()}<br>
      👤 ${item.이름}<br>
      📞 ${item.연락처}<br>
      📍 ${item.주소}<br>
      증상: ${item.증상}<br>
      상태: ${item.status}<br>
      <button onclick="updateStatus('${item.id}','complete')">현장도착</button>
      <button onclick="updateStatus('${item.id}','finish')">처리완료</button>
    `;

    area.appendChild(div);
  });
}

async function updateStatus(id,action){
  await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({id:id,action:action})
  });
  loadData();
}

loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

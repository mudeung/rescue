<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚑 무등산 특수구조팀 통합 시스템</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
input,select,textarea,button{
  width:100%;padding:12px;margin:6px 0;
  border-radius:6px;border:none;font-size:16px;
}
button{background:#2e7d32;color:#fff;cursor:pointer;}
.card{background:#1e1e1e;padding:12px;margin:8px 0;border-radius:6px;}
.red{background:#7f0000;}
.green{background:#1b5e20;}
.gray{background:#424242;}
#map{width:100%;height:250px;margin:10px 0;}
.smallBtn{
  width:48%;
  display:inline-block;
  margin-top:6px;
}
</style>
</head>
<body>

<header>🚨 무등산 특수구조팀 통합 시스템</header>
<div class="container">

<h3>📍 구조 신고</h3>

<form id="rescueForm">
<input type="text" id="name" placeholder="이름" required>
<input type="tel" id="phone" placeholder="연락처" required>
<input type="text" id="address" placeholder="위치 설명">
<select id="symptom">
<option>의식저하</option>
<option>골절의심</option>
<option>호흡곤란</option>
<option>기타</option>
</select>

<button type="button" id="gpsBtn">GPS 위치 가져오기</button>
<div id="map"></div>

<button type="submit">신고 접수</button>
</form>

<hr>

<h3>📡 실시간 접수 현황</h3>
<div id="listArea">로딩중...</div>

</div>

<script>
const API_URL="여기에_웹앱_URL";
let currentLat="",currentLng="";

/* GPS */
document.getElementById("gpsBtn").onclick=()=>{
  navigator.geolocation.getCurrentPosition(p=>{
    currentLat=p.coords.latitude;
    currentLng=p.coords.longitude;

    const loc=new kakao.maps.LatLng(currentLat,currentLng);
    const map=new kakao.maps.Map(document.getElementById("map"),{
      center:loc,level:3
    });
    new kakao.maps.Marker({position:loc,map});
  });
};

/* 신고 접수 */
document.getElementById("rescueForm").onsubmit=async e=>{
  e.preventDefault();

  const data={
    "이름":name.value,
    "연락처":phone.value,
    "주소":address.value,
    "위도":currentLat,
    "경도":currentLng,
    "증상":symptom.value
  };

  await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(data)
  });

  alert("신고 접수 완료");
  loadData();
};

/* 목록 */
async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();
  const area=document.getElementById("listArea");
  area.innerHTML="";

  data.reverse().forEach(item=>{

    let cls="red";
    if(item.status==="현장도착") cls="green";
    if(item.status==="사고처리완료") cls="gray";

    const div=document.createElement("div");
    div.className="card "+cls;

    div.innerHTML=`
      🕒 ${new Date(item.작성시간).toLocaleString()}<br>
      👤 ${item.이름}<br>
      📞 ${item.연락처}<br>
      📍 ${item.주소}<br>
      증상: ${item.증상}<br>
      상태: ${item.status}<br>
    `;

    /* 현장도착 */
    if(item.status==="접수완료"){
      const gcsInput=document.createElement("input");
      gcsInput.placeholder="GCS 입력 (예: 14)";
      gcsInput.id="gcs_"+item.id;

      const record=document.createElement("textarea");
      record.placeholder="응급처치 기록";
      record.id="record_"+item.id;

      const btn=document.createElement("button");
      btn.innerText="현장도착";
      btn.className="smallBtn";
      btn.onclick=()=>updateComplete(item.id);

      div.appendChild(gcsInput);
      div.appendChild(record);
      div.appendChild(btn);
    }

    /* 처리완료 */
    if(item.status==="현장도착"){
      const btn2=document.createElement("button");
      btn2.innerText="처리완료";
      btn2.className="smallBtn";
      btn2.onclick=()=>updateStatus(item.id,"finish");
      div.appendChild(btn2);
    }

    area.appendChild(div);
  });
}

async function updateComplete(id){
  const gcs=document.getElementById("gcs_"+id).value;
  const record=document.getElementById("record_"+id).value;

  await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({
      id:id,
      action:"complete",
      GCS:gcs,
      기록:record
    })
  });

  loadData();
}

async function updateStatus(id,action){
  await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({id:id,action:action})
  });
  loadData();
}

loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

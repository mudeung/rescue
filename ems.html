<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚑 응급처치 현장 기록</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f4f6f8;margin:0;padding:20px;}
.container{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
h1{text-align:center;color:#b71c1c;}
label{font-weight:bold;display:block;margin-top:10px;}
input,textarea{width:100%;padding:8px;margin-top:5px;border:1px solid #ccc;border-radius:6px;}
textarea{min-height:80px;}
button{margin-top:15px;padding:14px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;background:#1976d2;color:#fff;width:100%;}
.gps-btn{background:#6a1b9a;margin-top:5px;}
</style>
</head>

<body>

<div class="container">
<h1>🚑 응급처치 현장 기록</h1>

<form id="recordForm"
action="https://script.google.com/macros/s/AKfycbyRvv6h0Q5u0f5HHkT_mLhRlmKiOMMpBKljFzVPkTj7d1bGQmAj1S0YTvPUb9ujSSahxw/exec"
method="POST"
target="hidden_iframe"
onsubmit="handleSubmit();">

<label>도착시간</label>
<input type="datetime-local" name="arrivalTime">

<label>환자 이름</label>
<input type="text" name="patientName">

<label>연락처</label>
<input type="tel" name="phone">

<label>좌표</label>
<input type="text" name="coordinates" id="coordinates">
<button type="button" class="gps-btn" onclick="getGPS()">📍 현재 위치 자동 입력</button>

<label>환자 상태</label>
<textarea name="patientStatus"></textarea>

<label>응급처치 내용</label>
<textarea name="treatment"></textarea>

<label>출동 구조대원</label>
<input type="text" name="crew">

<button type="submit">
📤 기록 공유
</button>

</form>

<iframe name="hidden_iframe" style="display:none;"></iframe>

</div>

<script>

function handleSubmit(){
  setTimeout(()=>{
    alert("✅ Google Sheet 저장 완료");
  },1000);
}

function getGPS(){
  navigator.geolocation.getCurrentPosition(pos=>{
    document.getElementById("coordinates").value =
      pos.coords.latitude.toFixed(6)+", "+
      pos.coords.longitude.toFixed(6);
  });
}

</script>

</body>
</html>

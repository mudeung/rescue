<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 통합 시스템</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
input,button,select{
  width:100%;padding:10px;margin:5px 0;
  border-radius:6px;border:none;font-size:16px;
}
button{background:#2e7d32;color:#fff;}
.card{
  background:#1e1e1e;padding:12px;margin:8px 0;border-radius:6px;
}
#map{width:100%;height:250px;margin-top:10px;}
</style>
</head>
<body>

<header>🚑 무등산 특수구조팀 통합 시스템</header>

<div class="container">

<h3>📍 구조 신고</h3>
<form id="rescueForm">
<input type="text" name="name" placeholder="이름" required>
<input type="tel" name="phone" placeholder="연락처" required>
<input type="text" name="address" placeholder="위치 설명">
<select name="symptom">
<option value="의식저하">의식저하</option>
<option value="골절의심">골절의심</option>
<option value="호흡곤란">호흡곤란</option>
<option value="기타">기타</option>
</select>

<button type="button" id="getLocation">GPS 위치 가져오기</button>
<div id="map"></div>

<button type="submit">신고 접수</button>
</form>

<hr>

<h3>📡 실시간 접수 현황</h3>
<div id="listArea">로딩중...</div>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyRvv6h0Q5u0f5HHkT_mLhRlmKiOMMpBKljFzVPkTj7d1bGQmAj1S0YTvPUb9ujSSahxw/exec";
let currentLat="",currentLng="";

/* GPS */
document.getElementById("getLocation").onclick=()=>{
  navigator.geolocation.getCurrentPosition(p=>{
    currentLat=p.coords.latitude;
    currentLng=p.coords.longitude;

    const loc=new kakao.maps.LatLng(currentLat,currentLng);
    const map=new kakao.maps.Map(document.getElementById("map"),{
      center:loc,level:3
    });
    new kakao.maps.Marker({position:loc,map});
  });
};

/* 신고 저장 */
document.getElementById("rescueForm").onsubmit=async e=>{
  e.preventDefault();
  const data=Object.fromEntries(new FormData(e.target));
  data.lat=currentLat;
  data.lng=currentLng;

  await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(data)
  });

  alert("신고 접수 완료");
  loadData();
};

/* 목록 불러오기 */
async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();
  const area=document.getElementById("listArea");
  area.innerHTML="";

  data.reverse().forEach(item=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      🕒 ${new Date(item.작성시간).toLocaleString()}<br>
      👤 ${item.이름}<br>
      📞 ${item.연락처}<br>
      📝 ${item.증상}<br>
      📍 ${item.위도}, ${item.경도}
    `;
    area.appendChild(div);
  });
}

loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산 산악사고 구조요청</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body { margin:0; font-family: Arial; background:#f5f5f5; }
header { background:#b71c1c; color:white; padding:14px; text-align:center; }
#map { width:100%; height:450px; }
section { padding:15px; }
button {
  width:90%; padding:14px;
  font-size:18px;
  background:#d32f2f;
  color:white;
  border:none;
  border-radius:6px;
}
.info { background:white; padding:12px; border-radius:6px; }
.small { font-size:14px; color:#555; padding:0 15px; }
</style>
</head>

<body>

<header>🆘 무등산 산악사고 구조요청</header>

<section class="info">
  <div id="gpsInfo">📍 현재 위치 확인 중...</div>
  <br>
  <button onclick="sendSMSAndSave()">✉️ 구조요청 문자 전송</button>
</section>

<div class="small">
※ 구조요청 시 위치정보가 자동 전송됩니다
</div>

<br>
<div id="map"></div>

<script>
let map, marker;
let currentLat=null, currentLng=null;

const RESCUE_NUMBER="01066650113";
const API="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

/* 지도 */
function initMap(lat=35.13,lng=126.99){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(lat,lng),
    level:3
  });
  marker=new kakao.maps.Marker({map});
}
initMap();

/* GPS */
if(navigator.geolocation){
  navigator.geolocation.watchPosition(pos=>{
    currentLat=pos.coords.latitude;
    currentLng=pos.coords.longitude;

    const lat=Number(currentLat.toFixed(6));
    const lng=Number(currentLng.toFixed(6));

    const loc=new kakao.maps.LatLng(lat,lng);
    map.setCenter(loc);
    marker.setPosition(loc);

    document.getElementById("gpsInfo").innerHTML=
      `📍 위도:${lat}<br>경도:${lng}`;
  });
}

/* 저장 + 문자 */
function sendSMSAndSave(){

  if(currentLat==null){
    alert("위치 확인 중입니다.");
    return;
  }

  const lat=Number(currentLat.toFixed(6));
  const lng=Number(currentLng.toFixed(6));

  const mapURL=`https://map.kakao.com/link/map/${lat},${lng}`;

  /* ✅ 저장 (핵심 수정 부분) */
  fetch(API,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      lat:lat,
      lng:lng,
      kakaoMapURL:mapURL,
      condition:"-"
    })
  })
  .then(res=>res.text())
  .then(data=>{
    console.log("저장 성공:",data);
  })
  .catch(err=>{
    console.error("저장 실패:",err);
    alert("❌ 서버 저장 실패");
  });

  /* 문자 */
  const text=
`🚨 산악구조요청
위도:${lat}
경도:${lng}
지도:${mapURL}`;

  if(/Mobi|Android|iPhone/i.test(navigator.userAgent)){
    location.href=`sms:${RESCUE_NUMBER}?body=${encodeURIComponent(text)}`;
  }else{
    alert(text);
  }
}
</script>

</body>
</html>

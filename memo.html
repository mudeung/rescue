<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#f5f6fa">

<title>Paper Note</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
}

html,
body {
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

    background:#eef0f5;
    color:#18191d;
}

button,
input {
    font:inherit;
}


/* =========================================================
   VARIABLES
========================================================= */

:root {

    --bg:#eef0f5;
    --paper:#ffffff;
    --surface:rgba(255,255,255,.94);

    --text:#18191d;
    --muted:#858993;

    --border:#e1e3e8;

    --accent:#6657e8;
    --accent-soft:#ece9ff;

    --shadow:
        0 18px 45px rgba(25,28,45,.14);
}

body.dark {

    --bg:#15161a;
    --paper:#202126;
    --surface:rgba(32,33,39,.95);

    --text:#f5f5f7;
    --muted:#9b9da6;

    --border:#383941;

    --accent:#8a7cff;
    --accent-soft:#302b50;

    --shadow:
        0 20px 50px rgba(0,0,0,.4);
}


/* =========================================================
   APP
========================================================= */

.app {
    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    height:64px;
    flex:0 0 64px;

    display:flex;
    align-items:center;

    padding:
        0 max(14px, env(safe-area-inset-left))
        0 max(14px, env(safe-area-inset-right));

    background:var(--surface);

    border-bottom:
        1px solid var(--border);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    position:relative;
    z-index:100;
}

.brand {

    display:flex;
    align-items:center;
    gap:10px;

    min-width:220px;
}

.logo {

    width:37px;
    height:37px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #8377ff,
            #5748df
        );

    box-shadow:
        0 7px 17px
        rgba(95,79,230,.28);
}

.logo svg {

    width:20px;
    height:20px;

    fill:none;
    stroke:currentColor;

    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.brand-name {
    font-size:15px;
    font-weight:750;
}

.brand-sub {

    margin-top:2px;

    font-size:10px;
    color:var(--muted);
}

.header-center {

    flex:1;

    display:flex;
    justify-content:center;
}

.page-title {

    padding:7px 15px;

    border-radius:10px;

    background:var(--bg);

    color:var(--muted);

    font-size:12px;
}

.header-actions {

    min-width:220px;

    display:flex;
    justify-content:flex-end;
    align-items:center;

    gap:7px;
}


/* =========================================================
   BUTTONS
========================================================= */

.icon-btn {

    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid transparent;
    border-radius:11px;

    background:transparent;
    color:var(--text);
}

.icon-btn:hover {

    background:var(--bg);
    border-color:var(--border);
}

.icon-btn svg {

    width:20px;
    height:20px;

    fill:none;
    stroke:currentColor;

    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.primary-btn {

    height:40px;

    padding:0 15px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:7px;

    border:0;
    border-radius:11px;

    background:var(--accent);
    color:white;

    font-size:12px;
    font-weight:700;

    box-shadow:
        0 7px 18px
        rgba(102,87,232,.28);
}

.primary-btn svg {

    width:17px;
    height:17px;

    fill:none;
    stroke:currentColor;

    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace {

    position:relative;

    flex:1;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(102,87,232,.09),
            transparent 42%
        ),
        var(--bg);
}


/* =========================================================
   PAGE AREA

   ★ iPad / Android 공통
========================================================= */

.page-area {

    position:absolute;
    inset:0;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:
        35px
        50px
        130px;

    /*
       브라우저 기본 터치 제스처를
       캔버스에서 직접 제어한다.
    */

    touch-action:none;

    overscroll-behavior:none;

    -webkit-user-select:none;
    user-select:none;
}


/* =========================================================
   PAPER
========================================================= */

.paper {

    position:relative;

    width:min(900px,92vw);

    height:max(
        1180px,
        calc(100vh - 130px)
    );

    flex:0 0 auto;

    background:var(--paper);

    border-radius:5px;

    overflow:hidden;

    box-shadow:var(--shadow);

    transform-origin:center center;

    will-change:transform;
}

.paper.lines {

    background-color:var(--paper);

    background-image:
        linear-gradient(
            to bottom,
            transparent 31px,
            rgba(100,120,155,.14) 32px,
            transparent 33px
        );

    background-size:
        100% 32px;
}

.paper.grid {

    background-color:var(--paper);

    background-image:

        linear-gradient(
            rgba(100,120,155,.12) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(100,120,155,.12) 1px,
            transparent 1px
        );

    background-size:28px 28px;
}


/* =========================================================
   CANVAS

   ★ 가장 중요한 설정
========================================================= */

#canvas {

    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;

    /*
       Safari / iPadOS
       Android Chrome
       모두 브라우저 기본 제스처를
       캔버스에서 사용하지 않도록 함
    */

    touch-action:none;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;

    /*
       선택/드래그 방지
    */

    -webkit-user-drag:none;

    cursor:crosshair;
}


/* =========================================================
   SAVE
========================================================= */

.save-indicator {

    position:absolute;

    top:15px;
    right:18px;

    padding:6px 10px;

    border:
        1px solid var(--border);

    border-radius:20px;

    background:var(--surface);

    color:var(--muted);

    font-size:10px;

    backdrop-filter:blur(12px);

    pointer-events:none;

    z-index:10;
}


/* =========================================================
   FLOATING TOOLBAR
========================================================= */

.floating-toolbar {

    position:absolute;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    min-height:62px;

    display:flex;
    align-items:center;
    gap:4px;

    padding:8px;

    max-width:
        calc(100vw - 20px);

    overflow-x:auto;

    background:var(--surface);

    border:
        1px solid
        rgba(255,255,255,.55);

    border-radius:18px;

    box-shadow:var(--shadow);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    z-index:50;
}

.tool-btn {

    width:46px;
    height:46px;

    flex:0 0 46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    border-radius:13px;

    background:transparent;

    color:var(--text);
}

.tool-btn:hover {

    background:var(--bg);
}

.tool-btn.active {

    background:var(--accent-soft);
    color:var(--accent);
}

.tool-btn:disabled {
    opacity:.25;
}

.tool-btn svg {

    width:21px;
    height:21px;

    fill:none;
    stroke:currentColor;

    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.tool-divider {

    width:1px;
    height:30px;

    background:var(--border);

    margin:0 4px;
}

.current-color {

    width:22px;
    height:22px;

    border-radius:50%;

    border:
        2px solid var(--paper);

    box-shadow:
        0 0 0 1px var(--border);
}


/* =========================================================
   POPOVER
========================================================= */

.popover {

    position:absolute;

    left:50%;
    bottom:95px;

    width:285px;

    padding:17px;

    border:
        1px solid var(--border);

    border-radius:18px;

    background:var(--surface);

    box-shadow:var(--shadow);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    transform:
        translateX(-50%)
        translateY(10px)
        scale(.97);

    opacity:0;

    pointer-events:none;

    transition:.18s ease;

    z-index:70;
}

.popover.show {

    opacity:1;

    pointer-events:auto;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1);
}

.popover-title {

    margin-bottom:12px;

    color:var(--muted);

    font-size:11px;
    font-weight:700;
}

.range-row {

    display:flex;
    align-items:center;

    gap:12px;
}

.range-row input {

    flex:1;
    accent-color:var(--accent);
}

.size-preview {

    width:38px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.size-dot {

    width:8px;
    height:8px;

    border-radius:50%;

    background:var(--text);
}


/* =========================================================
   COLORS
========================================================= */

.colors {

    display:grid;

    grid-template-columns:
        repeat(10,1fr);

    gap:10px;
}

.color-btn {

    width:23px;
    height:23px;

    padding:0;

    border:2px solid transparent;

    border-radius:50%;
}

.color-btn.active {

    box-shadow:
        0 0 0 2px var(--paper),
        0 0 0 3px var(--accent);
}


/* =========================================================
   PAPER MENU
========================================================= */

.paper-menu {

    display:flex;
    gap:7px;
}

.paper-option {

    flex:1;

    padding:9px 5px;

    border:
        1px solid var(--border);

    border-radius:9px;

    background:transparent;

    color:var(--text);

    font-size:11px;
}

.paper-option.active {

    border-color:var(--accent);

    background:var(--accent-soft);

    color:var(--accent);
}


/* =========================================================
   ZOOM
========================================================= */

.zoom-control {

    position:absolute;

    left:16px;
    bottom:20px;

    display:flex;
    align-items:center;

    gap:3px;

    padding:6px;

    background:var(--surface);

    border:
        1px solid var(--border);

    border-radius:14px;

    box-shadow:
        0 10px 25px
        rgba(20,25,45,.10);

    backdrop-filter:blur(18px);

    z-index:40;
}

.zoom-btn {

    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    border-radius:9px;

    background:transparent;

    color:var(--text);
}

.zoom-btn svg {

    width:17px;
    height:17px;

    fill:none;
    stroke:currentColor;

    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.zoom-value {

    min-width:52px;

    text-align:center;

    color:var(--muted);

    font-size:11px;
}


/* =========================================================
   TOAST
========================================================= */

.toast {

    position:absolute;

    left:50%;
    bottom:100px;

    transform:
        translate(-50%,10px);

    padding:9px 15px;

    border-radius:10px;

    background:#202126;

    color:white;

    font-size:12px;

    opacity:0;

    pointer-events:none;

    transition:.18s ease;

    z-index:100;
}

.toast.show {

    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:800px) {

    .header {

        height:58px;
        flex-basis:58px;

        padding:
            0
            max(10px,env(safe-area-inset-left))
            0
            max(10px,env(safe-area-inset-right));
    }

    .brand {
        min-width:auto;
    }

    .brand-name,
    .brand-sub {
        display:none;
    }

    .header-center {

        justify-content:flex-start;

        padding-left:10px;
    }

    .header-actions {
        min-width:auto;
    }

    .primary-btn {

        width:40px;
        padding:0;
    }

    .primary-btn .text-label {
        display:none;
    }

    .page-area {

        padding:
            12px
            max(12px,env(safe-area-inset-left))
            115px
            max(12px,env(safe-area-inset-right));
    }

    .paper {

        width:100%;
        min-width:100%;

        height:
            calc(100vh - 100px);
    }

    .floating-toolbar {

        bottom:
            max(
                9px,
                env(safe-area-inset-bottom)
            );
    }

    .zoom-control {

        bottom:
            78px;
    }
}


/* =========================================================
   IPAD / SMALL TABLET
========================================================= */

@media(max-width:500px) {

    .header-center {
        display:none;
    }

    .page-area {
        padding:7px 7px 108px;
    }

    .tool-btn {

        width:40px;
        height:40px;

        flex-basis:40px;
    }

    .floating-toolbar {
        padding:6px;
    }

    .popover {
        width:260px;
    }

    .colors {
        grid-template-columns:
            repeat(8,1fr);
    }
}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     HEADER
====================================================== -->

<header class="header">

    <div class="brand">

        <div class="logo">

            <svg viewBox="0 0 24 24">

                <path d="M12 20h9"/>

                <path d="
                    M16.5 3.5
                    a2.1 2.1 0 0 1 3 3
                    L8 18
                    l-4 1
                    1-4
                    Z
                "/>

                <path d="M15 5l3 3"/>

            </svg>

        </div>

        <div>

            <div class="brand-name">
                Paper Note
            </div>

            <div class="brand-sub">
                Stylus handwriting
            </div>

        </div>

    </div>


    <div class="header-center">

        <div class="page-title">
            내 필기 노트
        </div>

    </div>


    <div class="header-actions">

        <!-- DARK -->

        <button
            class="icon-btn"
            onclick="toggleDark()"
            title="다크 모드">

            <svg viewBox="0 0 24 24">

                <path d="
                    M21 12.8
                    A8.5 8.5 0 1 1
                    11.2 3
                    A6.7 6.7 0 0 0
                    21 12.8Z
                "/>

            </svg>

        </button>


        <!-- SHARE -->

        <button
            class="icon-btn"
            onclick="shareNote()"
            title="공유">

            <svg viewBox="0 0 24 24">

                <path d="M12 16V3"/>
                <path d="M7 8l5-5 5 5"/>

                <path d="
                    M5 12v7
                    a2 2 0 0 0 2 2
                    h10
                    a2 2 0 0 0 2-2
                    v-7
                "/>

            </svg>

        </button>


        <!-- SAVE -->

        <button
            class="primary-btn"
            onclick="saveNote()">

            <svg viewBox="0 0 24 24">

                <path d="M5 20h14"/>
                <path d="M12 4v11"/>
                <path d="M7 10l5 5 5-5"/>

            </svg>

            <span class="text-label">
                저장
            </span>

        </button>

    </div>

</header>


<!-- =====================================================
     WORKSPACE
====================================================== -->

<main class="workspace">

    <div
        id="pageArea"
        class="page-area">

        <div
            id="paper"
            class="paper lines">

            <canvas id="canvas"></canvas>

        </div>

    </div>


    <div
        id="saveIndicator"
        class="save-indicator">

        자동 저장됨

    </div>


    <!-- =================================================
         PEN SETTINGS
    ================================================== -->

    <div
        id="popover"
        class="popover">

        <div class="popover-title">
            펜 굵기
        </div>

        <div class="range-row">

            <input
                id="sizeRange"
                type="range"
                min="1"
                max="15"
                step=".5"
                value="4">

            <div class="size-preview">
                <div
                    id="sizeDot"
                    class="size-dot">
                </div>
            </div>

        </div>


        <div
            style="
                height:1px;
                background:var(--border);
                margin:18px 0;
            ">
        </div>


        <div class="popover-title">
            펜 색상
        </div>


        <div class="colors">

            <button class="color-btn active"
                    style="background:#17181c"
                    data-color="#17181c"></button>

            <button class="color-btn"
                    style="background:#ef4444"
                    data-color="#ef4444"></button>

            <button class="color-btn"
                    style="background:#f97316"
                    data-color="#f97316"></button>

            <button class="color-btn"
                    style="background:#eab308"
                    data-color="#eab308"></button>

            <button class="color-btn"
                    style="background:#22c55e"
                    data-color="#22c55e"></button>

            <button class="color-btn"
                    style="background:#3b82f6"
                    data-color="#3b82f6"></button>

            <button class="color-btn"
                    style="background:#8b5cf6"
                    data-color="#8b5cf6"></button>

            <button class="color-btn"
                    style="background:#ec4899"
                    data-color="#ec4899"></button>

            <button class="color-btn"
                    style="background:#06b6d4"
                    data-color="#06b6d4"></button>

            <button class="color-btn"
                    style="background:#795548"
                    data-color="#795548"></button>

            <button class="color-btn"
                    style="background:#64748b"
                    data-color="#64748b"></button>

            <button class="color-btn"
                    style="
                        background:#fff;
                        border-color:#d5d7dc
                    "
                    data-color="#ffffff"></button>

            <button class="color-btn"
                    style="background:#000"
                    data-color="#000000"></button>

            <button class="color-btn"
                    style="background:#14b8a6"
                    data-color="#14b8a6"></button>

            <button class="color-btn"
                    style="background:#0f766e"
                    data-color="#0f766e"></button>

            <button class="color-btn"
                    style="background:#1d4ed8"
                    data-color="#1d4ed8"></button>

            <button class="color-btn"
                    style="background:#7c3aed"
                    data-color="#7c3aed"></button>

            <button class="color-btn"
                    style="background:#be185d"
                    data-color="#be185d"></button>

            <button class="color-btn"
                    style="background:#b45309"
                    data-color="#b45309"></button>

        </div>


        <div
            style="
                height:1px;
                background:var(--border);
                margin:18px 0;
            ">
        </div>


        <div class="popover-title">
            용지
        </div>


        <div class="paper-menu">

            <button
                class="paper-option active"
                data-paper="lines"
                onclick="setPaper('lines')">
                줄
            </button>

            <button
                class="paper-option"
                data-paper="grid"
                onclick="setPaper('grid')">
                격자
            </button>

            <button
                class="paper-option"
                data-paper="plain"
                onclick="setPaper('plain')">
                무지
            </button>

        </div>

    </div>


    <!-- =================================================
         ZOOM
    ================================================== -->

    <div class="zoom-control">

        <button
            class="zoom-btn"
            onclick="zoomOut()">

            <svg viewBox="0 0 24 24">
                <path d="M5 12h14"/>
            </svg>

        </button>


        <div
            id="zoomValue"
            class="zoom-value">
            100%
        </div>


        <button
            class="zoom-btn"
            onclick="zoomIn()">

            <svg viewBox="0 0 24 24">
                <path d="M12 5v14"/>
                <path d="M5 12h14"/>
            </svg>

        </button>


        <button
            class="zoom-btn"
            onclick="resetZoom()">

            <svg viewBox="0 0 24 24">

                <path d="
                    M4 12
                    a8 8 0 1 0
                    2.3-5.6
                "/>

                <path d="M4 5v5h5"/>

            </svg>

        </button>

    </div>


    <!-- =================================================
         TOOLBAR
    ================================================== -->

    <div class="floating-toolbar">

        <!-- PEN -->

        <button
            id="penTool"
            class="tool-btn active"
            onclick="setTool('pen')"
            title="펜">

            <svg viewBox="0 0 24 24">

                <path d="M12 20h9"/>

                <path d="
                    M16.5 3.5
                    a2.1 2.1 0 0 1 3 3
                    L8 18
                    l-4 1
                    1-4
                    Z
                "/>

                <path d="M15 5l3 3"/>

            </svg>

        </button>


        <!-- PEN SETTINGS -->

        <button
            id="settingsTool"
            class="tool-btn"
            onclick="togglePopover()"
            title="펜 설정">

            <div
                id="currentColor"
                class="current-color"
                style="background:#17181c">
            </div>

        </button>


        <div class="tool-divider"></div>


        <!-- ERASER -->

        <button
            id="eraserTool"
            class="tool-btn"
            onclick="setTool('eraser')"
            title="지우개">

            <svg viewBox="0 0 24 24">

                <path d="M7 21h10"/>

                <path d="
                    M5.5 15.5
                    L15 6
                    a2.1 2.1 0 0 1 3 0

                    L10 20H6
                    a2 2 0 0 1-1.4-.6
                    l-.1-.1
                    a2 2 0 0 1 0-2.8Z
                "/>

                <path d="M13 8l4 4"/>

            </svg>

        </button>


        <!-- UNDO -->

        <button
            id="undoTool"
            class="tool-btn"
            onclick="undo()">

            <svg viewBox="0 0 24 24">

                <path d="M9 14L4 9l5-5"/>

                <path d="
                    M4 9h10
                    a6 6 0 0 1 6 6v1
                "/>

            </svg>

        </button>


        <!-- REDO -->

        <button
            id="redoTool"
            class="tool-btn"
            onclick="redo()">

            <svg viewBox="0 0 24 24">

                <path d="M15 14l5-5-5-5"/>

                <path d="
                    M20 9H10
                    a6 6 0 0 0-6 6v1
                "/>

            </svg>

        </button>


        <div class="tool-divider"></div>


        <!-- CLEAR -->

        <button
            class="tool-btn"
            onclick="clearCanvas()"
            title="전체 지우기">

            <svg viewBox="0 0 24 24">

                <path d="M4 7h16"/>
                <path d="M10 11v6"/>
                <path d="M14 11v6"/>

                <path d="
                    M6 7l1 13h10l1-13
                "/>

                <path d="M9 7V4h6v3"/>

            </svg>

        </button>

    </div>


    <div
        id="toast"
        class="toast">
    </div>

</main>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha:true,
            desynchronized:true
        }
    );

const paper =
    document.getElementById("paper");


/* =========================================================
   SETTINGS
========================================================= */

let tool = "pen";

let color = "#17181c";

let size = 4;


/*
   ★ 필기는 반드시 스타일러스만 허용
*/

const STYLUS_ONLY = true;


/* =========================================================
   DRAW STATE
========================================================= */

let drawing = false;

let activeStylusId = null;

let lastX = 0;
let lastY = 0;

let lastPressure = .5;

let lastTime = 0;


/* =========================================================
   TOUCH STATE
========================================================= */

const touches = new Map();

let pinchDistance = 0;

let pinchZoom = 1;


/* =========================================================
   ZOOM
========================================================= */

let zoom = 1;

const MIN_ZOOM = .5;
const MAX_ZOOM = 4;

let panX = 0;
let panY = 0;


/* =========================================================
   HISTORY
========================================================= */

let undoStack = [];
let redoStack = [];


/* =========================================================
   SAVE
========================================================= */

let saveTimer = null;


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

    const rect =
        paper.getBoundingClientRect();

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            3
        );


    let oldImage = null;

    if (
        canvas.width > 0 &&
        canvas.height > 0
    ) {

        oldImage =
            canvas.toDataURL("image/png");
    }


    canvas.width =
        Math.round(
            rect.width * dpr
        );

    canvas.height =
        Math.round(
            rect.height * dpr
        );


    canvas.style.width =
        rect.width + "px";

    canvas.style.height =
        rect.height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    ctx.imageSmoothingEnabled = true;


    if (oldImage) {

        const image = new Image();

        image.onload = function() {

            ctx.drawImage(
                image,
                0,
                0,
                rect.width,
                rect.height
            );
        };

        image.src = oldImage;
    }
}


window.addEventListener(
    "resize",
    resizeCanvas
);


setTimeout(
    resizeCanvas,
    100
);


/* =========================================================
   COORDINATE
========================================================= */

function getPoint(e) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (e.clientX - rect.left) / zoom,

        y:
            (e.clientY - rect.top) / zoom
    };
}


/* =========================================================
   INPUT TYPE
========================================================= */

/*
   Apple Pencil
   S Pen
   Windows pen
   일반 PointerEvent 기반 스타일러스

   모두 pointerType === "pen"
*/

function isStylus(e) {

    return (
        e.pointerType === "pen"
    );
}


function isTouch(e) {

    return (
        e.pointerType === "touch"
    );
}


/* =========================================================
   POINTER DOWN
========================================================= */

canvas.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();


        /* -----------------------------------------------
           TOUCH

           손가락 / 손바닥은
           절대로 필기하지 않는다.
        ------------------------------------------------ */

        if (
            isTouch(e)
        ) {

            touches.set(
                e.pointerId,
                {
                    x:e.clientX,
                    y:e.clientY
                }
            );


            /*
               손가락이 화면에 올라오면
               혹시 진행 중인 필기를 중단하지 않고
               그대로 펜 ID를 유지한다.

               따라서 손바닥을 올려놓아도
               S펜 필기는 계속 독립적으로 처리된다.
            */

            if (
                touches.size >= 2
            ) {

                drawing = false;

                beginPinch();
            }


            return;
        }


        /* -----------------------------------------------
           STYLUS

           Apple Pencil / S Pen / 지원되는 BT 펜
        ------------------------------------------------ */

        if (
            isStylus(e)
        ) {

            /*
               이미 다른 펜이 필기 중이면
               새로운 펜 입력 무시
            */

            if (
                activeStylusId !== null
            ) {
                return;
            }


            activeStylusId =
                e.pointerId;


            /*
               Pointer Capture

               iPadOS / Safari 및 Android Chrome에서
               펜이 캔버스 밖으로 순간 이동했을 때
               입력이 끊기는 것을 줄인다.
            */

            try {

                canvas.setPointerCapture(
                    e.pointerId
                );

            } catch (_) {}


            startStroke(e);

            return;
        }


        /*
           Mouse

           PC 테스트용.

           iPad/Android 태블릿에서는
           펜 필기로 사용하지 않는다.
        */

        return;

    },
    {
        passive:false
    }
);


/* =========================================================
   POINTER MOVE
========================================================= */

canvas.addEventListener(
    "pointermove",
    function(e) {

        e.preventDefault();


        /* -----------------------------------------------
           TOUCH
        ------------------------------------------------ */

        if (
            isTouch(e)
        ) {

            if (
                touches.has(
                    e.pointerId
                )
            ) {

                touches.set(
                    e.pointerId,
                    {
                        x:e.clientX,
                        y:e.clientY
                    }
                );
            }


            /*
               두 손가락 제스처
            */

            if (
                touches.size >= 2
            ) {

                drawing = false;

                updatePinch();
            }


            /*
               ★ 여기서 반드시 종료

               touch는 절대로 drawStroke를
               호출하지 않는다.
            */

            return;
        }


        /* -----------------------------------------------
           STYLUS
        ------------------------------------------------ */

        if (
            isStylus(e)
        ) {

            if (
                e.pointerId !==
                activeStylusId
            ) {

                return;
            }


            if (
                drawing
            ) {

                processStylusMove(e);
            }

            return;
        }

    },
    {
        passive:false
    }
);


/* =========================================================
   POINTER UP
========================================================= */

canvas.addEventListener(
    "pointerup",
    endPointer,
    {
        passive:false
    }
);


/* =========================================================
   POINTER CANCEL
========================================================= */

canvas.addEventListener(
    "pointercancel",
    endPointer,
    {
        passive:false
    }
);


/* =========================================================
   END POINTER
========================================================= */

function endPointer(e) {

    e.preventDefault();


    /* TOUCH */

    if (
        isTouch(e)
    ) {

        touches.delete(
            e.pointerId
        );

        if (
            touches.size < 2
        ) {

            pinchDistance = 0;
        }

        return;
    }


    /* STYLUS */

    if (
        isStylus(e)
    ) {

        if (
            e.pointerId ===
            activeStylusId
        ) {

            if (
                drawing
            ) {

                finishStroke();
            }

            drawing = false;

            activeStylusId = null;
        }

        return;
    }
}


/* =========================================================
   START STROKE
========================================================= */

function startStroke(e) {

    drawing = true;


    saveState();


    const p =
        getPoint(e);


    lastX = p.x;
    lastY = p.y;


    lastPressure =
        normalizePressure(
            e.pressure
        );


    lastTime =
        performance.now();


    drawDot(
        p.x,
        p.y,
        lastPressure
    );
}


/* =========================================================
   PRESSURE
========================================================= */

function normalizePressure(p) {

    /*
       Apple Pencil / S Pen:
       일반적으로 0~1 pressure 제공
    */

    if (
        !Number.isFinite(p) ||
        p <= 0
    ) {

        return .5;
    }


    return Math.max(
        .05,
        Math.min(
            1,
            p
        )
    );
}


/* =========================================================
   STYLUS MOVE
========================================================= */

function processStylusMove(e) {

    /*
       iPad Safari / 최신 브라우저에서
       coalesced events를 지원하면
       중간 좌표까지 처리한다.
    */

    let events = [e];


    if (
        typeof e.getCoalescedEvents ===
        "function"
    ) {

        const coalesced =
            e.getCoalescedEvents();


        if (
            coalesced &&
            coalesced.length
        ) {

            events =
                coalesced;
        }
    }


    for (
        const event
        of events
    ) {

        drawStylusPoint(
            event
        );
    }
}


/* =========================================================
   DRAW STYLUS POINT
========================================================= */

function drawStylusPoint(e) {

    const p =
        getPoint(e);


    const pressure =
        normalizePressure(
            e.pressure
        );


    /*
       좌표 smoothing
    */

    const smoothX =
        lastX +
        (
            p.x -
            lastX
        ) * .76;


    const smoothY =
        lastY +
        (
            p.y -
            lastY
        ) * .76;


    /*
       필압 smoothing
    */

    const smoothPressure =
        lastPressure +
        (
            pressure -
            lastPressure
        ) * .35;


    const now =
        performance.now();


    const dt =
        Math.max(
            1,
            now - lastTime
        );


    const dx =
        smoothX - lastX;

    const dy =
        smoothY - lastY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
       너무 작은 떨림 제거
    */

    if (
        distance < .08
    ) {

        return;
    }


    const velocity =
        distance / dt;


    drawSegment(
        lastX,
        lastY,
        smoothX,
        smoothY,
        smoothPressure,
        velocity
    );


    lastX =
        smoothX;

    lastY =
        smoothY;

    lastPressure =
        smoothPressure;

    lastTime =
        now;
}


/* =========================================================
   DRAW SEGMENT
========================================================= */

function drawSegment(
    x1,
    y1,
    x2,
    y2,
    pressure,
    velocity
) {

    ctx.save();


    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    /* ERASER */

    if (
        tool === "eraser"
    ) {

        ctx.globalCompositeOperation =
            "destination-out";

        ctx.lineWidth =
            Math.max(
                12,
                size *
                (
                    2.5 +
                    pressure * 1.8
                )
            );

    }


    /* PEN */

    else {

        ctx.globalCompositeOperation =
            "source-over";

        ctx.strokeStyle =
            color;


        let width =
            size *
            (
                .48 +
                pressure * .72
            );


        /*
           빠르게 쓸수록
           살짝 가늘어지는 효과
        */

        if (
            velocity > .8
        ) {

            width *= .92;
        }


        width =
            Math.max(
                .55,
                Math.min(
                    size * 1.3,
                    width
                )
            );


        ctx.lineWidth =
            width;
    }


    ctx.beginPath();


    const midX =
        (x1 + x2) / 2;

    const midY =
        (y1 + y2) / 2;


    ctx.moveTo(
        x1,
        y1
    );


    ctx.quadraticCurveTo(
        x1,
        y1,
        midX,
        midY
    );


    ctx.quadraticCurveTo(
        x2,
        y2,
        x2,
        y2
    );


    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   DOT
========================================================= */

function drawDot(
    x,
    y,
    pressure
) {

    ctx.save();


    if (
        tool === "eraser"
    ) {

        ctx.globalCompositeOperation =
            "destination-out";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            Math.max(
                7,
                size * 1.7
            ),
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    else {

        ctx.globalCompositeOperation =
            "source-over";

        ctx.fillStyle =
            color;


        const radius =
            Math.max(
                .45,
                size *
                (
                    .30 +
                    pressure * .45
                )
            );


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    ctx.restore();
}


/* =========================================================
   FINISH STROKE
========================================================= */

function finishStroke() {

    drawing = false;

    redoStack = [];

    updateHistoryButtons();

    scheduleSave();
}


/* =========================================================
   PINCH ZOOM
========================================================= */

function beginPinch() {

    const points =
        [...touches.values()];


    if (
        points.length < 2
    ) {

        return;
    }


    pinchDistance =
        getDistance(
            points[0],
            points[1]
        );


    pinchZoom =
        zoom;
}


function updatePinch() {

    const points =
        [...touches.values()];


    if (
        points.length < 2
    ) {

        return;
    }


    const distance =
        getDistance(
            points[0],
            points[1]
        );


    if (
        pinchDistance <= 0
    ) {

        return;
    }


    zoom =
        pinchZoom *
        (
            distance /
            pinchDistance
        );


    zoom =
        Math.max(
            MIN_ZOOM,
            Math.min(
                MAX_ZOOM,
                zoom
            )
        );


    applyZoom();
}


function getDistance(a,b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================================================
   ZOOM BUTTONS
========================================================= */

function zoomIn() {

    zoom =
        Math.min(
            MAX_ZOOM,
            zoom + .25
        );

    applyZoom();
}


function zoomOut() {

    zoom =
        Math.max(
            MIN_ZOOM,
            zoom - .25
        );

    applyZoom();
}


function resetZoom() {

    zoom = 1;

    panX = 0;
    panY = 0;

    applyZoom();

    showToast("100%");
}


function applyZoom() {

    paper.style.transform =
        `
        translate3d(
            ${panX}px,
            ${panY}px,
            0
        )
        scale(${zoom})
        `;


    document
        .getElementById("zoomValue")
        .textContent =
        Math.round(
            zoom * 100
        ) + "%";
}


/* =========================================================
   HISTORY
========================================================= */

function saveState() {

    const state =
        canvas.toDataURL(
            "image/png"
        );


    if (
        undoStack.length &&
        undoStack[
            undoStack.length - 1
        ] === state
    ) {

        return;
    }


    undoStack.push(
        state
    );


    if (
        undoStack.length > 40
    ) {

        undoStack.shift();
    }


    redoStack = [];

    updateHistoryButtons();
}


function undo() {

    if (
        !undoStack.length
    ) {

        return;
    }


    redoStack.push(
        canvas.toDataURL(
            "image/png"
        )
    );


    const state =
        undoStack.pop();


    restoreImage(
        state
    );


    updateHistoryButtons();

    scheduleSave();

    showToast(
        "실행 취소"
    );
}


function redo() {

    if (
        !redoStack.length
    ) {

        return;
    }


    undoStack.push(
        canvas.toDataURL(
            "image/png"
        )
    );


    const state =
        redoStack.pop();


    restoreImage(
        state
    );


    updateHistoryButtons();

    scheduleSave();

    showToast(
        "다시 실행"
    );
}


function restoreImage(src) {

    const image =
        new Image();


    image.onload =
        function() {

            const rect =
                canvas.getBoundingClientRect();


            ctx.clearRect(
                0,
                0,
                rect.width,
                rect.height
            );


            ctx.drawImage(
                image,
                0,
                0,
                rect.width,
                rect.height
            );
        };


    image.src =
        src;
}


function updateHistoryButtons() {

    document
        .getElementById("undoTool")
        .disabled =
        undoStack.length === 0;


    document
        .getElementById("redoTool")
        .disabled =
        redoStack.length === 0;
}


/* =========================================================
   CLEAR
========================================================= */

function clearCanvas() {

    if (
        !confirm(
            "필기를 모두 지울까요?"
        )
    ) {

        return;
    }


    saveState();


    const rect =
        canvas.getBoundingClientRect();


    ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );


    redoStack = [];

    updateHistoryButtons();

    scheduleSave();

    showToast(
        "페이지를 지웠습니다"
    );
}


/* =========================================================
   TOOL
========================================================= */

function setTool(value) {

    tool = value;


    document
        .getElementById("penTool")
        .classList.toggle(
            "active",
            value === "pen"
        );


    document
        .getElementById("eraserTool")
        .classList.toggle(
            "active",
            value === "eraser"
        );


    closePopover();
}


/* =========================================================
   POPOVER
========================================================= */

function togglePopover() {

    document
        .getElementById("popover")
        .classList.toggle(
            "show"
        );
}


function closePopover() {

    document
        .getElementById("popover")
        .classList.remove(
            "show"
        );
}


/* =========================================================
   SIZE
========================================================= */

const sizeRange =
    document.getElementById(
        "sizeRange"
    );


sizeRange.addEventListener(
    "input",
    function() {

        size =
            Number(
                this.value
            );


        updateSizePreview();

        setTool("pen");

        scheduleSave();
    }
);


function updateSizePreview() {

    const dot =
        document.getElementById(
            "sizeDot"
        );


    const diameter =
        Math.max(
            3,
            Math.min(
                26,
                size * 1.65
            )
        );


    dot.style.width =
        diameter + "px";

    dot.style.height =
        diameter + "px";
}


/* =========================================================
   COLORS
========================================================= */

document
    .querySelectorAll(".color-btn")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    color =
                        this.dataset.color;


                    document
                        .getElementById(
                            "currentColor"
                        )
                        .style.background =
                        color;


                    document
                        .querySelectorAll(
                            ".color-btn"
                        )
                        .forEach(
                            b =>
                            b.classList.remove(
                                "active"
                            )
                        );


                    this.classList.add(
                        "active"
                    );


                    setTool("pen");

                    scheduleSave();
                }
            );
        }
    );


/* =========================================================
   PAPER
========================================================= */

function setPaper(type) {

    paper.classList.remove(
        "lines",
        "grid"
    );


    if (
        type === "lines"
    ) {

        paper.classList.add(
            "lines"
        );
    }


    if (
        type === "grid"
    ) {

        paper.classList.add(
            "grid"
        );
    }


    document
        .querySelectorAll(
            ".paper-option"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.paper ===
                    type
                );
            }
        );
}


/* =========================================================
   AUTO SAVE
========================================================= */

function scheduleSave() {

    const indicator =
        document.getElementById(
            "saveIndicator"
        );


    indicator.textContent =
        "저장 중...";


    clearTimeout(
        saveTimer
    );


    saveTimer =
        setTimeout(
            function() {

                localStorage.setItem(
                    "paperNote",
                    canvas.toDataURL(
                        "image/png"
                    )
                );


                localStorage.setItem(
                    "paperNoteColor",
                    color
                );


                localStorage.setItem(
                    "paperNoteSize",
                    String(size)
                );


                indicator.textContent =
                    "자동 저장됨";

            },
            450
        );
}


/* =========================================================
   EXPORT
========================================================= */

function createExportCanvas() {

    const output =
        document.createElement(
            "canvas"
        );


    output.width =
        canvas.width;

    output.height =
        canvas.height;


    const outputCtx =
        output.getContext(
            "2d"
        );


    outputCtx.fillStyle =
        "#ffffff";


    outputCtx.fillRect(
        0,
        0,
        output.width,
        output.height
    );


    outputCtx.drawImage(
        canvas,
        0,
        0
    );


    return output;
}


/* =========================================================
   SAVE PNG
========================================================= */

function saveNote() {

    const output =
        createExportCanvas();


    const link =
        document.createElement(
            "a"
        );


    link.download =
        "PaperNote.png";


    link.href =
        output.toDataURL(
            "image/png"
        );


    link.click();


    showToast(
        "PNG 저장 완료"
    );
}


/* =========================================================
   SHARE
========================================================= */

async function shareNote() {

    const output =
        createExportCanvas();


    output.toBlob(
        async function(blob) {

            if (!blob) {
                return;
            }


            const file =
                new File(
                    [blob],
                    "PaperNote.png",
                    {
                        type:
                            "image/png"
                    }
                );


            if (
                navigator.share &&
                (
                    !navigator.canShare ||
                    navigator.canShare({
                        files:[file]
                    })
                )
            ) {

                try {

                    await navigator.share({

                        title:
                            "Paper Note",

                        text:
                            "S Pen / Apple Pencil 필기",

                        files:
                            [file]
                    });

                    return;

                } catch(err) {

                    if (
                        err.name ===
                        "AbortError"
                    ) {

                        return;
                    }
                }
            }


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href = url;

            link.download =
                "PaperNote.png";

            link.click();


            setTimeout(
                () => {
                    URL.revokeObjectURL(url);
                },
                1000
            );


            showToast(
                "PNG로 저장했습니다"
            );

        },
        "image/png"
    );
}


/* =========================================================
   DARK MODE
========================================================= */

function toggleDark() {

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(
        "paperNoteDark",
        document.body.classList.contains(
            "dark"
        )
    );
}


/* =========================================================
   LOAD
========================================================= */

function loadNote() {

    /* DARK */

    if (
        localStorage.getItem(
            "paperNoteDark"
        ) === "true"
    ) {

        document.body.classList.add(
            "dark"
        );
    }


    /* NOTE */

    const saved =
        localStorage.getItem(
            "paperNote"
        );


    if (saved) {

        const image =
            new Image();


        image.onload =
            function() {

                const rect =
                    canvas.getBoundingClientRect();


                ctx.clearRect(
                    0,
                    0,
                    rect.width,
                    rect.height
                );


                ctx.drawImage(
                    image,
                    0,
                    0,
                    rect.width,
                    rect.height
                );
            };


        image.src =
            saved;
    }


    /* COLOR */

    const savedColor =
        localStorage.getItem(
            "paperNoteColor"
        );


    if (savedColor) {

        color =
            savedColor;


        document
            .getElementById(
                "currentColor"
            )
            .style.background =
            color;


        document
            .querySelectorAll(
                ".color-btn"
            )
            .forEach(
                button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.color ===
                        color
                    );
                }
            );
    }


    /* SIZE */

    const savedSize =
        localStorage.getItem(
            "paperNoteSize"
        );


    if (savedSize) {

        size =
            Number(
                savedSize
            );


        sizeRange.value =
            size;


        updateSizePreview();
    }
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function() {

                toast.classList.remove(
                    "show"
                );

            },
            1500
        );
}


/* =========================================================
   CLOSE POPOVER
========================================================= */

document.addEventListener(
    "pointerdown",
    function(e) {

        const popover =
            document.getElementById(
                "popover"
            );

        const settings =
            document.getElementById(
                "settingsTool"
            );


        if (
            popover.classList.contains(
                "show"
            ) &&
            !popover.contains(
                e.target
            ) &&
            !settings.contains(
                e.target
            )
        ) {

            closePopover();
        }
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        const command =
            e.ctrlKey ||
            e.metaKey;


        if (
            command &&
            e.key.toLowerCase() === "z"
        ) {

            e.preventDefault();

            if (e.shiftKey) {
                redo();
            } else {
                undo();
            }
        }


        if (
            command &&
            e.key.toLowerCase() === "y"
        ) {

            e.preventDefault();

            redo();
        }


        if (
            command &&
            e.key.toLowerCase() === "s"
        ) {

            e.preventDefault();

            saveNote();
        }
    }
);


/* =========================================================
   START
========================================================= */

setTimeout(
    function() {

        resizeCanvas();

        loadNote();

        updateSizePreview();

        updateHistoryButtons();

        applyZoom();

    },
    150
);

</script>

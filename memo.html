<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#f4f5f8">

<title>Paper Note</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

    background: #eef0f5;
    color: #17181c;
}

button,
input {
    font: inherit;
}

button {
    user-select: none;
}


/* =========================================================
   THEME
========================================================= */

:root {

    --bg: #eef0f5;
    --paper: #ffffff;
    --surface: rgba(255,255,255,.90);

    --text: #17181c;
    --muted: #858994;

    --border: #e1e3e8;

    --accent: #6d5dfc;
    --accent-soft: #eeeaff;

    --toolbar-shadow:
        0 16px 40px rgba(25,30,50,.14),
        0 3px 10px rgba(25,30,50,.07);

    --paper-shadow:
        0 18px 45px rgba(25,30,50,.12),
        0 3px 10px rgba(25,30,50,.06);
}

body.dark {

    --bg: #15161a;
    --paper: #202126;
    --surface: rgba(34,35,41,.93);

    --text: #f3f4f6;
    --muted: #9da0aa;

    --border: #36373f;

    --accent: #8b7cff;
    --accent-soft: #312d51;

    --toolbar-shadow:
        0 18px 45px rgba(0,0,0,.35);

    --paper-shadow:
        0 20px 50px rgba(0,0,0,.35);
}


/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    height: 66px;

    flex: 0 0 66px;

    display: flex;
    align-items: center;

    padding:
        0 20px;

    background: var(--surface);

    border-bottom:
        1px solid var(--border);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    position: relative;
    z-index: 100;
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    min-width: 220px;

    display: flex;
    align-items: center;

    gap: 11px;
}

.logo {

    width: 36px;
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #8173ff,
            #5c4af3
        );

    box-shadow:
        0 6px 15px
        rgba(100,85,245,.28);
}

.logo svg {

    width: 20px;
    height: 20px;

    stroke: currentColor;
    fill: none;

    stroke-width: 1.8;

    stroke-linecap: round;
    stroke-linejoin: round;
}

.brand-name {

    font-size: 15px;
    font-weight: 700;

    line-height: 18px;
}

.brand-sub {

    margin-top: 2px;

    color: var(--muted);

    font-size: 10px;
}


/* =========================================================
   TITLE
========================================================= */

.header-center {

    flex: 1;

    display: flex;
    justify-content: center;
}

.page-title {

    padding:
        7px 15px;

    border-radius: 10px;

    background: var(--bg);

    color: var(--muted);

    font-size: 12px;

    border:
        1px solid
        transparent;
}


/* =========================================================
   HEADER ACTIONS
========================================================= */

.header-actions {

    min-width: 220px;

    display: flex;
    align-items: center;
    justify-content: flex-end;

    gap: 7px;
}


/* =========================================================
   COMMON ICON
========================================================= */

svg {

    display: block;

    stroke: currentColor;
    fill: none;

    stroke-linecap: round;
    stroke-linejoin: round;
}

.icon-btn svg,
.tool-btn svg,
.primary-btn svg,
.zoom-btn svg {

    pointer-events: none;

    transition:
        transform .16s ease,
        stroke-width .16s ease;
}

.icon-btn svg {
    width: 20px;
    height: 20px;

    stroke-width: 1.8;
}

.tool-btn svg {
    width: 21px;
    height: 21px;

    stroke-width: 1.8;
}

.zoom-btn svg {
    width: 17px;
    height: 17px;

    stroke-width: 1.8;
}

.primary-btn svg {
    width: 17px;
    height: 17px;

    stroke-width: 1.9;
}


/* =========================================================
   BUTTON
========================================================= */

.icon-btn {

    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid transparent;

    border-radius: 11px;

    background: transparent;

    color: var(--text);

    cursor: pointer;

    transition:
        background .16s ease,
        border .16s ease,
        transform .16s ease;
}

.icon-btn:hover {

    background: var(--bg);

    border-color:
        var(--border);
}

.icon-btn:active {

    transform: scale(.93);
}


.primary-btn {

    height: 40px;

    padding:
        0 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    border: 0;

    border-radius: 11px;

    color: white;

    background: var(--accent);

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 7px 18px
        rgba(109,93,252,.27);

    transition:
        transform .16s ease,
        box-shadow .16s ease;
}

.primary-btn:hover {

    box-shadow:
        0 9px 24px
        rgba(109,93,252,.35);
}

.primary-btn:active {

    transform: scale(.95);
}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace {

    position: relative;

    flex: 1;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(109,93,252,.09),
            transparent 38%
        ),
        var(--bg);
}


/* =========================================================
   PAGE VIEWPORT
========================================================= */

.page-area {

    position: absolute;

    inset: 0;

    overflow: auto;

    padding:
        35px
        60px
        145px;

    display: flex;

    justify-content: center;
    align-items: flex-start;

    overscroll-behavior:
        contain;

    /*
       캔버스 자체는 PointerEvent를 받는다.
       페이지 스크롤은 손가락 두 개 동작에 의해 처리한다.
    */

    touch-action: none;
}


/* =========================================================
   PAPER
========================================================= */

.paper {

    position: relative;

    flex: 0 0 auto;

    width:
        min(900px, 92vw);

    height:
        max(
            1180px,
            calc(100vh - 140px)
        );

    background:
        var(--paper);

    border-radius: 5px;

    box-shadow:
        var(--paper-shadow);

    overflow: hidden;

    transform-origin:
        center center;

    will-change:
        transform;
}


/* =========================================================
   PAPER LINES
========================================================= */

.paper.lines {

    background-color:
        var(--paper);

    background-image:

        linear-gradient(
            to bottom,

            transparent 31px,

            rgba(
                100,
                120,
                155,
                .14
            )
            32px,

            transparent 33px
        );

    background-size:
        100% 32px;
}


/* =========================================================
   PAPER GRID
========================================================= */

.paper.grid {

    background-color:
        var(--paper);

    background-image:

        linear-gradient(
            rgba(
                100,
                120,
                155,
                .12
            ) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(
                100,
                120,
                155,
                .12
            ) 1px,
            transparent 1px
        );

    background-size:
        28px 28px;
}


/* =========================================================
   CANVAS
========================================================= */

#canvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    touch-action: none;

    cursor: crosshair;
}


/* =========================================================
   PAGE NUMBER
========================================================= */

.page-number {

    position: absolute;

    left: 50%;
    bottom: 14px;

    transform:
        translateX(-50%);

    color: var(--muted);

    font-size: 10px;

    pointer-events: none;
}


/* =========================================================
   SAVE STATUS
========================================================= */

.save-indicator {

    position: absolute;

    top: 16px;
    right: 18px;

    padding:
        6px 10px;

    border-radius: 20px;

    background:
        var(--surface);

    border:
        1px solid
        var(--border);

    color: var(--muted);

    font-size: 10px;

    backdrop-filter:
        blur(12px);

    pointer-events: none;

    z-index: 20;
}


/* =========================================================
   FLOATING TOOLBAR
========================================================= */

.floating-toolbar {

    position: absolute;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    min-height: 63px;

    display: flex;
    align-items: center;

    gap: 4px;

    padding: 8px;

    background:
        var(--surface);

    border:
        1px solid
        rgba(255,255,255,.55);

    border-radius: 18px;

    box-shadow:
        var(--toolbar-shadow);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    z-index: 50;
}


/* =========================================================
   TOOL BUTTON
========================================================= */

.tool-btn {

    position: relative;

    width: 46px;
    height: 46px;

    flex: 0 0 46px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;

    border-radius: 13px;

    background:
        transparent;

    color: var(--text);

    cursor: pointer;

    transition:
        background .15s ease,
        color .15s ease,
        transform .15s ease;
}

.tool-btn:hover {

    background:
        var(--bg);
}

.tool-btn:active {

    transform:
        scale(.90);
}

.tool-btn.active {

    color:
        var(--accent);

    background:
        var(--accent-soft);
}

.tool-btn:disabled {

    opacity: .27;

    cursor: default;
}


/* =========================================================
   TOOL DIVIDER
========================================================= */

.tool-divider {

    width: 1px;
    height: 30px;

    flex: 0 0 1px;

    margin:
        0 4px;

    background:
        var(--border);
}


/* =========================================================
   CURRENT COLOR
========================================================= */

.current-color {

    width: 22px;
    height: 22px;

    border-radius: 50%;

    border:
        2px solid
        var(--paper);

    box-shadow:
        0 0 0 1px
        var(--border);
}


/* =========================================================
   POPOVER
========================================================= */

.popover {

    position: absolute;

    left: 50%;
    bottom: 97px;

    width: 285px;

    padding: 17px;

    border-radius: 18px;

    background:
        var(--surface);

    border:
        1px solid
        var(--border);

    box-shadow:
        0 18px 45px
        rgba(20,25,45,.18);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    transform:
        translateX(-50%)
        translateY(10px)
        scale(.97);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .18s ease,
        transform .18s ease;

    z-index: 70;
}

.popover.show {

    opacity: 1;

    pointer-events: auto;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1);
}


/* =========================================================
   POPOVER TITLE
========================================================= */

.popover-title {

    margin-bottom: 12px;

    color:
        var(--muted);

    font-size: 11px;

    font-weight: 700;
}


/* =========================================================
   SIZE
========================================================= */

.range-row {

    display: flex;
    align-items: center;

    gap: 12px;
}

.range-row input {

    flex: 1;

    accent-color:
        var(--accent);
}

.size-preview {

    width: 38px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.size-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background:
        var(--text);

    transition:
        width .1s,
        height .1s;
}


/* =========================================================
   COLORS
========================================================= */

.colors {

    display: grid;

    grid-template-columns:
        repeat(10, 1fr);

    gap: 10px;
}

.color-btn {

    width: 23px;
    height: 23px;

    padding: 0;

    border:
        2px solid
        transparent;

    border-radius: 50%;

    cursor: pointer;

    transition:
        transform .14s ease;
}

.color-btn:hover {

    transform:
        scale(1.16);
}

.color-btn.active {

    box-shadow:
        0 0 0 2px
        var(--paper),

        0 0 0 3px
        var(--accent);
}


/* =========================================================
   PAPER MENU
========================================================= */

.paper-menu {

    display: flex;

    gap: 7px;
}

.paper-option {

    flex: 1;

    padding:
        9px 5px;

    border:
        1px solid
        var(--border);

    border-radius: 9px;

    background:
        transparent;

    color:
        var(--text);

    cursor: pointer;

    font-size: 11px;
}

.paper-option.active {

    border-color:
        var(--accent);

    color:
        var(--accent);

    background:
        var(--accent-soft);
}


/* =========================================================
   ZOOM
========================================================= */

.zoom-control {

    position: absolute;

    left: 17px;
    bottom: 22px;

    display: flex;
    align-items: center;

    gap: 3px;

    padding: 6px;

    background:
        var(--surface);

    border:
        1px solid
        var(--border);

    border-radius: 14px;

    box-shadow:
        0 10px 25px
        rgba(20,25,45,.10);

    backdrop-filter:
        blur(18px);

    z-index: 40;
}

.zoom-btn {

    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;

    border-radius: 9px;

    background:
        transparent;

    color:
        var(--text);

    cursor: pointer;
}

.zoom-btn:hover {

    background:
        var(--bg);
}

.zoom-value {

    min-width: 52px;

    text-align: center;

    color:
        var(--muted);

    font-size: 11px;

    user-select: none;
}


/* =========================================================
   TOAST
========================================================= */

.toast {

    position: absolute;

    left: 50%;
    bottom: 103px;

    transform:
        translate(-50%, 10px);

    padding:
        9px 15px;

    border-radius: 10px;

    background:
        #202126;

    color:
        white;

    font-size: 12px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .18s ease,
        transform .18s ease;

    z-index: 100;
}

.toast.show {

    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 800px) {

    .header {

        height: 58px;

        flex-basis: 58px;

        padding:
            0 10px;
    }

    .brand {

        min-width:
            auto;
    }

    .brand-name,
    .brand-sub {

        display: none;
    }

    .logo {

        width: 34px;
        height: 34px;
    }

    .header-center {

        justify-content:
            flex-start;

        padding-left:
            10px;
    }

    .header-actions {

        min-width:
            auto;
    }

    .primary-btn {

        width: 40px;

        padding: 0;
    }

    .primary-btn .text-label {

        display: none;
    }

    .page-area {

        padding:
            15px
            15px
            125px;
    }

    .paper {

        width:
            100%;

        min-width:
            100%;

        height:
            calc(100vh - 110px);
    }

    .floating-toolbar {

        bottom:
            11px;

        max-width:
            calc(100vw - 18px);

        overflow-x:
            auto;

        border-radius:
            17px;
    }

    .popover {

        bottom:
            87px;
    }

    .zoom-control {

        left:
            10px;

        bottom:
            82px;
    }
}


/* =========================================================
   PHONE
========================================================= */

@media (max-width: 500px) {

    .header-center {

        display:
            none;
    }

    .page-area {

        padding:
            7px
            7px
            110px;
    }

    .paper {

        min-height:
            900px;
    }

    .floating-toolbar {

        gap:
            2px;

        padding:
            6px;
    }

    .tool-btn {

        width:
            40px;

        height:
            40px;

        flex-basis:
            40px;
    }

    .popover {

        width:
            260px;
    }

    .colors {

        grid-template-columns:
            repeat(8, 1fr);
    }
}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     HEADER
====================================================== -->

<header class="header">

    <div class="brand">

        <div class="logo">

            <svg viewBox="0 0 24 24">

                <path d="M12 20h9"/>

                <path
                    d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1
                       1-4 13.5-13.5Z"/>

                <path d="M15 5l3 3"/>

            </svg>

        </div>


        <div>

            <div class="brand-name">
                Paper Note
            </div>

            <div class="brand-sub">
                Digital handwriting
            </div>

        </div>

    </div>


    <div class="header-center">

        <div class="page-title">
            내 필기 노트
        </div>

    </div>


    <div class="header-actions">


        <!-- DARK MODE -->

        <button
            class="icon-btn"
            onclick="toggleDark()"
            title="다크 모드">

            <svg viewBox="0 0 24 24">

                <path
                    d="M21 12.8A8.5 8.5 0 1 1 11.2 3
                       6.7 6.7 0 0 0 21 12.8Z"/>

            </svg>

        </button>


        <!-- SHARE -->

        <button
            class="icon-btn"
            onclick="shareNote()"
            title="공유">

            <svg viewBox="0 0 24 24">

                <path
                    d="M12 16V3"/>

                <path
                    d="M7 8l5-5 5 5"/>

                <path
                    d="M5 12v7a2 2 0 0 0 2 2h10
                       a2 2 0 0 0 2-2v-7"/>

            </svg>

        </button>


        <!-- SAVE -->

        <button
            class="primary-btn"
            onclick="saveNote()">

            <svg viewBox="0 0 24 24">

                <path
                    d="M5 20h14"/>

                <path
                    d="M12 4v11"/>

                <path
                    d="M7 10l5 5 5-5"/>

            </svg>

            <span class="text-label">
                저장
            </span>

        </button>

    </div>

</header>


<!-- =====================================================
     WORKSPACE
====================================================== -->

<main class="workspace">


    <div class="page-area">


        <div
            id="paper"
            class="paper lines">


            <canvas id="canvas">
            </canvas>


            <div class="page-number">
                1
            </div>

        </div>

    </div>


    <!-- SAVE STATUS -->

    <div
        id="saveIndicator"
        class="save-indicator">

        자동 저장됨

    </div>


    <!-- =================================================
         PEN SETTINGS
    ================================================== -->

    <div
        id="popover"
        class="popover">


        <div class="popover-title">
            펜 굵기
        </div>


        <div class="range-row">

            <input
                id="sizeRange"
                type="range"
                min="1"
                max="15"
                step="0.5"
                value="4">


            <div class="size-preview">

                <div
                    id="sizeDot"
                    class="size-dot">
                </div>

            </div>

        </div>


        <div
            style="
                height:1px;
                background:var(--border);
                margin:18px 0;
            ">
        </div>


        <div class="popover-title">
            펜 색상
        </div>


        <!-- 기존 + 추가 5색 -->

        <div class="colors">


            <!-- 기존 -->

            <button
                class="color-btn active"
                style="background:#17181c"
                data-color="#17181c"
                title="블랙">
            </button>

            <button
                class="color-btn"
                style="background:#ef4444"
                data-color="#ef4444"
                title="레드">
            </button>

            <button
                class="color-btn"
                style="background:#f97316"
                data-color="#f97316"
                title="오렌지">
            </button>

            <button
                class="color-btn"
                style="background:#eab308"
                data-color="#eab308"
                title="옐로우">
            </button>

            <button
                class="color-btn"
                style="background:#22c55e"
                data-color="#22c55e"
                title="그린">
            </button>

            <button
                class="color-btn"
                style="background:#3b82f6"
                data-color="#3b82f6"
                title="블루">
            </button>

            <button
                class="color-btn"
                style="background:#8b5cf6"
                data-color="#8b5cf6"
                title="퍼플">
            </button>

            <button
                class="color-btn"
                style="background:#ec4899"
                data-color="#ec4899"
                title="핑크">
            </button>

            <button
                class="color-btn"
                style="background:#06b6d4"
                data-color="#06b6d4"
                title="시안">
            </button>

            <button
                class="color-btn"
                style="background:#795548"
                data-color="#795548"
                title="브라운">
            </button>

            <button
                class="color-btn"
                style="background:#64748b"
                data-color="#64748b"
                title="슬레이트">
            </button>

            <button
                class="color-btn"
                style="
                    background:#ffffff;
                    border:1px solid #d5d7dc;
                "
                data-color="#ffffff"
                title="화이트">
            </button>

            <button
                class="color-btn"
                style="background:#000000"
                data-color="#000000"
                title="딥블랙">
            </button>

            <button
                class="color-btn"
                style="background:#14b8a6"

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: true,
        desynchronized: true
    });

const paper =
    document.getElementById("paper");

const pageArea =
    document.querySelector(".page-area");


/* =========================================================
   SETTINGS
========================================================= */

let tool =
    "pen";

let color =
    "#17181c";

let size =
    4;


/*
   필기 부드러움.

   너무 높은 값:
   - 반응이 느려질 수 있음

   너무 낮은 값:
   - 선이 떨릴 수 있음
*/

const SMOOTHING = 0.28;


/* =========================================================
   DRAW STATE
========================================================= */

let drawing =
    false;

let lastX =
    0;

let lastY =
    0;

let lastTime =
    0;

let lastPressure =
    .5;


/* =========================================================
   HISTORY
========================================================= */

let undoStack =
    [];

let redoStack =
    [];


/* =========================================================
   AUTOSAVE
========================================================= */

let saveTimer =
    null;


/* =========================================================
   ZOOM
========================================================= */

let zoom =
    1;

const MIN_ZOOM =
    .5;

const MAX_ZOOM =
    4;

let panX =
    0;

let panY =
    0;


/* =========================================================
   TOUCH / PINCH
========================================================= */

const pointers =
    new Map();

let pinchStartDistance =
    0;

let pinchStartZoom =
    1;

let pinchStartPanX =
    0;

let pinchStartPanY =
    0;

let pinchCenterX =
    0;

let pinchCenterY =
    0;


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas() {

    const rect =
        paper.getBoundingClientRect();

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            3
        );


    /*
       기존 그림 보존
    */

    let oldImage =
        null;

    if (
        canvas.width > 0 &&
        canvas.height > 0
    ) {

        oldImage =
            canvas.toDataURL(
                "image/png"
            );
    }


    canvas.width =
        Math.round(
            rect.width * dpr
        );

    canvas.height =
        Math.round(
            rect.height * dpr
        );

    canvas.style.width =
        rect.width + "px";

    canvas.style.height =
        rect.height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    ctx.imageSmoothingEnabled =
        true;


    if (oldImage) {

        const img =
            new Image();

        img.onload = () => {

            ctx.drawImage(
                img,
                0,
                0,
                rect.width,
                rect.height
            );
        };

        img.src =
            oldImage;
    }
}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   DEVICE PIXEL RATIO
========================================================= */

function getCanvasCSSSize() {

    const rect =
        canvas.getBoundingClientRect();

    return {
        width:
            rect.width,

        height:
            rect.height
    };
}


/* =========================================================
   POINTER POSITION
========================================================= */

function getCanvasPoint(e) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (e.clientX - rect.left) /
            zoom,

        y:
            (e.clientY - rect.top) /
            zoom
    };
}


/* =========================================================
   POINTER DOWN
========================================================= */

canvas.addEventListener(
    "pointerdown",
    onPointerDown,
    {
        passive: false
    }
);


function onPointerDown(e) {

    e.preventDefault();


    /*
       브라우저가 펜을
       다른 제스처로 해석하지 않도록 한다.
    */

    try {

        canvas.setPointerCapture(
            e.pointerId
        );

    } catch (_) {}


    pointers.set(
        e.pointerId,
        {
            x: e.clientX,
            y: e.clientY,
            type: e.pointerType
        }
    );


    /*
       두 포인터:
       확대 / 축소
    */

    if (pointers.size >= 2) {

        drawing =
            false;

        startPinch();

        return;
    }


    /*
       손가락은 필기하지 않는다.
       한 손가락은 대기.
    */

    if (
        e.pointerType === "touch"
    ) {

        return;
    }


    /*
       stylus / pen / mouse
    */

    startDrawing(e);
}


/* =========================================================
   START PINCH
========================================================= */

function startPinch() {

    const values =
        [...pointers.values()];

    if (values.length < 2) {
        return;
    }

    const a =
        values[0];

    const b =
        values[1];


    pinchStartDistance =
        distance(
            a,
            b
        );

    pinchStartZoom =
        zoom;

    const center =
        centerPoint(
            a,
            b
        );

    pinchCenterX =
        center.x;

    pinchCenterY =
        center.y;

    pinchStartPanX =
        panX;

    pinchStartPanY =
        panY;
}


/* =========================================================
   POINTER MOVE
========================================================= */

canvas.addEventListener(
    "pointermove",
    onPointerMove,
    {
        passive: false
    }
);


function onPointerMove(e) {

    e.preventDefault();


    if (
        pointers.has(
            e.pointerId
        )
    ) {

        pointers.set(
            e.pointerId,
            {
                x: e.clientX,
                y: e.clientY,
                type: e.pointerType
            }
        );
    }


    /*
       두 손가락 제스처
    */

    if (
        pointers.size >= 2
    ) {

        drawing =
            false;

        updatePinch();

        return;
    }


    /*
       손가락은 필기하지 않는다.
    */

    if (
        e.pointerType === "touch"
    ) {

        return;
    }


    /*
       필기
    */

    if (drawing) {

        drawStroke(e);
    }
}


/* =========================================================
   UPDATE PINCH
========================================================= */

function updatePinch() {

    const values =
        [...pointers.values()];

    if (values.length < 2) {
        return;
    }

    const a =
        values[0];

    const b =
        values[1];


    const currentDistance =
        distance(
            a,
            b
        );


    if (
        pinchStartDistance <= 0
    ) {

        return;
    }


    let newZoom =
        pinchStartZoom *
        (
            currentDistance /
            pinchStartDistance
        );


    newZoom =
        Math.max(
            MIN_ZOOM,
            Math.min(
                MAX_ZOOM,
                newZoom
            )
        );


    const center =
        centerPoint(
            a,
            b
        );


    const dx =
        center.x -
        pinchCenterX;

    const dy =
        center.y -
        pinchCenterY;


    /*
       확대하면서
       손가락 중심을 유지하도록 이동
    */

    const ratio =
        newZoom /
        pinchStartZoom;


    panX =
        pinchStartPanX +
        dx;


    panY =
        pinchStartPanY +
        dy;


    /*
       확대 중심 보정
    */

    panX -=
        (
            pinchCenterX -
            window.innerWidth / 2
        ) *
        (
            ratio - 1
        );

    panY -=
        (
            pinchCenterY -
            window.innerHeight / 2
        ) *
        (
            ratio - 1
        );


    zoom =
        newZoom;


    applyZoom();
}


/* =========================================================
   POINTER UP
========================================================= */

canvas.addEventListener(
    "pointerup",
    onPointerUp,
    {
        passive: false
    }
);

canvas.addEventListener(
    "pointercancel",
    onPointerUp,
    {
        passive: false
    }
);


function onPointerUp(e) {

    e.preventDefault();


    pointers.delete(
        e.pointerId
    );


    if (
        pointers.size < 2
    ) {

        pinchStartDistance =
            0;
    }


    if (
        pointers.size === 0
    ) {

        if (drawing) {

            finishStroke();
        }

        drawing =
            false;
    }
}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================================================
   CENTER
========================================================= */

function centerPoint(a, b) {

    return {

        x:
            (a.x + b.x) / 2,

        y:
            (a.y + b.y) / 2
    };
}


/* =========================================================
   START DRAWING
========================================================= */

function startDrawing(e) {

    drawing =
        true;


    const p =
        getCanvasPoint(e);


    lastX =
        p.x;

    lastY =
        p.y;


    lastTime =
        performance.now();


    lastPressure =
        normalizePressure(
            e.pressure
        );


    /*
       시작 상태 저장
    */

    saveState();


    /*
       짧은 탭도 점으로 인식
    */

    drawDot(
        p.x,
        p.y,
        lastPressure
    );
}


/* =========================================================
   PRESSURE
========================================================= */

function normalizePressure(
    pressure
) {

    /*
       일부 브라우저 / 기기는
       pressure를 0 또는 0.5로 줄 수 있다.
    */

    if (
        !pressure ||
        pressure <= 0
    ) {

        return .5;
    }


    /*
       너무 극단적인 값 방지
    */

    return Math.max(
        .08,
        Math.min(
            1,
            pressure
        )
    );
}


/* =========================================================
   DRAW STROKE
========================================================= */

function drawStroke(e) {

    const p =
        getCanvasPoint(e);


    const pressure =
        normalizePressure(
            e.pressure
        );


    /*
       pressure smoothing
    */

    const smoothPressure =
        lastPressure +
        (
            pressure -
            lastPressure
        ) *
        SMOOTHING;


    /*
       좌표 smoothing

       S펜 미세 떨림을 줄이면서
       지연을 최소화한다.
    */

    const smoothX =
        lastX +
        (
            p.x -
            lastX
        ) *
        .82;


    const smoothY =
        lastY +
        (
            p.y -
            lastY
        ) *
        .82;


    const now =
        performance.now();


    const dt =
        Math.max(
            1,
            now -
            lastTime
        );


    const dx =
        smoothX -
        lastX;

    const dy =
        smoothY -
        lastY;


    const distanceMoved =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
       너무 작은 이동은
       무시해서 떨림 제거
    */

    if (
        distanceMoved < 0.12
    ) {

        return;
    }


    /*
       스타일러스 속도 계산
    */

    const velocity =
        distanceMoved /
        dt;


    drawSegment(
        lastX,
        lastY,
        smoothX,
        smoothY,
        smoothPressure,
        velocity
    );


    lastX =
        smoothX;

    lastY =
        smoothY;

    lastPressure =
        smoothPressure;

    lastTime =
        now;


    /*
       자동 저장
    */

    scheduleSave();
}


/* =========================================================
   DRAW SEGMENT
========================================================= */

function drawSegment(
    x1,
    y1,
    x2,
    y2,
    pressure,
    velocity
) {

    ctx.save();


    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    if (
        tool === "eraser"
    ) {

        ctx.globalCompositeOperation =
            "destination-out";


        /*
           지우개는 필압 영향을
           조금만 받게 한다.
        */

        ctx.lineWidth =
            Math.max(
                12,
                size *
                (
                    2.7 +
                    pressure * 1.8
                )
            );

    } else {

        ctx.globalCompositeOperation =
            "source-over";


        ctx.strokeStyle =
            color;


        /*
           기본 필압 반영
        */

        let width =
            size *
            (
                .48 +
                pressure *
                .72
            );


        /*
           빠르게 쓸 때
           지나치게 두꺼워지는 것 방지
        */

        if (
            velocity > .8
        ) {

            width *=
                .92;
        }


        width =
            Math.max(
                .55,
                Math.min(
                    size * 1.25,
                    width
                )
            );


        ctx.lineWidth =
            width;
    }


    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   DOT
========================================================= */

function drawDot(
    x,
    y,
    pressure
) {

    ctx.save();


    if (
        tool === "eraser"
    ) {

        ctx.globalCompositeOperation =
            "destination-out";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            Math.max(
                7,
                size * 1.7
            ),
            0,
            Math.PI * 2
        );

        ctx.fill();

    } else {

        ctx.globalCompositeOperation =
            "source-over";

        ctx.fillStyle =
            color;


        const radius =
            Math.max(
                .45,
                size *
                (
                    .32 +
                    pressure *
                    .45
                )
            );


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    ctx.restore();
}


/* =========================================================
   FINISH STROKE
========================================================= */

function finishStroke() {

    drawing =
        false;

    redoStack =
        [];

    updateHistoryButtons();

    scheduleSave();
}


/* =========================================================
   HISTORY
========================================================= */

function saveState() {

    /*
       동일한 상태가 연속으로
       쌓이는 것을 방지
    */

    const state =
        canvas.toDataURL(
            "image/png"
        );


    if (
        undoStack.length > 0 &&
        undoStack[
            undoStack.length - 1
        ] === state
    ) {

        return;
    }


    undoStack.push(
        state
    );


    if (
        undoStack.length > 35
    ) {

        undoStack.shift();
    }


    redoStack =
        [];

    updateHistoryButtons();
}


/* =========================================================
   UNDO
========================================================= */

function undo() {

    if (
        undoStack.length === 0
    ) {

        return;
    }


    redoStack.push(
        canvas.toDataURL(
            "image/png"
        )
    );


    const state =
        undoStack.pop();


    restoreImage(
        state
    );


    updateHistoryButtons();

    scheduleSave();

    showToast(
        "실행 취소"
    );
}


/* =========================================================
   REDO
========================================================= */

function redo() {

    if (
        redoStack.length === 0
    ) {

        return;
    }


    undoStack.push(
        canvas.toDataURL(
            "image/png"
        )
    );


    const state =
        redoStack.pop();


    restoreImage(
        state
    );


    updateHistoryButtons();

    scheduleSave();

    showToast(
        "다시 실행"
    );
}


/* =========================================================
   RESTORE IMAGE
========================================================= */

function restoreImage(src) {

    const img =
        new Image();


    img.onload = () => {

        const size =
            getCanvasCSSSize();


        ctx.clearRect(
            0,
            0,
            size.width,
            size.height
        );


        ctx.drawImage(
            img,
            0,
            0,
            size.width,
            size.height
        );
    };


    img.src =
        src;
}


/* =========================================================
   HISTORY BUTTONS
========================================================= */

function updateHistoryButtons() {

    document
        .getElementById("undoTool")
        .disabled =
        undoStack.length === 0;


    document
        .getElementById("redoTool")
        .disabled =
        redoStack.length === 0;
}


/* =========================================================
   CLEAR
========================================================= */

function clearCanvas() {

    if (
        !confirm(
            "이 페이지의 필기를 모두 지울까요?"
        )
    ) {

        return;
    }


    saveState();


    const size =
        getCanvasCSSSize();


    ctx.clearRect(
        0,
        0,
        size.width,
        size.height
    );


    redoStack =
        [];


    updateHistoryButtons();

    scheduleSave();

    showToast(
        "페이지를 지웠습니다"
    );
}


/* =========================================================
   TOOL
========================================================= */

function setTool(value) {

    tool =
        value;


    document
        .getElementById(
            "penTool"
        )
        .classList.toggle(
            "active",
            value === "pen"
        );


    document
        .getElementById(
            "eraserTool"
        )
        .classList.toggle(
            "active",
            value === "eraser"
        );


    canvas.style.cursor =
        value === "pen"
            ? "crosshair"
            : "cell";


    closePopover();
}


/* =========================================================
   POPOVER
========================================================= */

function togglePopover() {

    document
        .getElementById(
            "popover"
        )
        .classList.toggle(
            "show"
        );
}


function closePopover() {

    document
        .getElementById(
            "popover"
        )
        .classList.remove(
            "show"
        );
}


/* =========================================================
   PEN SIZE
========================================================= */

const sizeRange =
    document.getElementById(
        "sizeRange"
    );


sizeRange.addEventListener(
    "input",
    () => {

        size =
            Number(
                sizeRange.value
            );


        updateSizePreview();

        setTool(
            "pen"
        );

        scheduleSave();
    }
);


function updateSizePreview() {

    const dot =
        document.getElementById(
            "sizeDot"
        );


    const diameter =
        Math.min(
            26,
            Math.max(
                3,
                size * 1.65
            )
        );


    dot.style.width =
        diameter + "px";

    dot.style.height =
        diameter + "px";
}


updateSizePreview();


/* =========================================================
   COLORS
========================================================= */

document
    .querySelectorAll(
        ".color-btn"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    color =
                        button.dataset.color;


                    document
                        .getElementById(
                            "currentColor"
                        )
                        .style.background =
                        color;


                    document
                        .querySelectorAll(
                            ".color-btn"
                        )
                        .forEach(
                            b => {

                                b.classList
                                    .remove(
                                        "active"
                                    );
                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    setTool(
                        "pen"
                    );


                    scheduleSave();
                }
            );
        }
    );


/* =========================================================
   PAPER
========================================================= */

function setPaper(type) {

    paper.classList.remove(
        "lines",
        "grid"
    );


    if (
        type === "lines"
    ) {

        paper.classList.add(
            "lines"
        );
    }


    if (
        type === "grid"
    ) {

        paper.classList.add(
            "grid"
        );
    }


    document
        .querySelectorAll(
            ".paper-option"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.paper ===
                    type
                );
            }
        );
}


/* =========================================================
   ZOOM
========================================================= */

function applyZoom() {

    paper.style.transform =
        `translate3d(
            ${panX}px,
            ${panY}px,
            0
        ) scale(${zoom})`;


    updateZoomText();
}


function updateZoomText() {

    document
        .getElementById(
            "zoomValue"
        )
        .textContent =
        Math.round(
            zoom * 100
        ) + "%";
}


function setZoom(value) {

    zoom =
        Math.max(
            MIN_ZOOM,
            Math.min(
                MAX_ZOOM,
                value
            )
        );


    applyZoom();
}


function zoomIn() {

    setZoom(
        zoom + .25
    );
}


function zoomOut() {

    setZoom(
        zoom - .25
    );
}


function resetZoom() {

    zoom =
        1;

    panX =
        0;

    panY =
        0;


    applyZoom();

    showToast(
        "100%"
    );
}


/* =========================================================
   AUTOSAVE
========================================================= */

function scheduleSave() {

    const indicator =
        document.getElementById(
            "saveIndicator"
        );


    indicator.textContent =
        "저장 중...";


    clearTimeout(
        saveTimer
    );


    saveTimer =
        setTimeout(
            () => {

                localStorage.setItem(
                    "paperNote",
                    canvas.toDataURL(
                        "image/png"
                    )
                );


                localStorage.setItem(
                    "paperNoteColor",
                    color
                );


                localStorage.setItem(
                    "paperNoteSize",
                    String(size)
                );


                indicator.textContent =
                    "자동 저장됨";

            },
            500
        );
}


/* =========================================================
   EXPORT CANVAS
========================================================= */

function createExportCanvas() {

    const output =
        document.createElement(
            "canvas"
        );


    output.width =
        canvas.width;

    output.height =
        canvas.height;


    const outputCtx =
        output.getContext(
            "2d"
        );


    /*
       PNG 저장 시
       흰색 배경
    */

    outputCtx.fillStyle =
        "#ffffff";


    outputCtx.fillRect(
        0,
        0,
        output.width,
        output.height
    );


    outputCtx.drawImage(
        canvas,
        0,
        0
    );


    return output;
}


/* =========================================================
   SAVE PNG
========================================================= */

function saveNote() {

    const output =
        createExportCanvas();


    const link =
        document.createElement(
            "a"
        );


    const now =
        new Date();


    const date =
        now.getFullYear() +
        "-" +
        String(
            now.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            now.getDate()
        ).padStart(2, "0");


    link.download =
        "PaperNote_" +
        date +
        ".png";


    link.href =
        output.toDataURL(
            "image/png"
        );


    link.click();


    showToast(
        "필기를 저장했습니다"
    );
}


/* =========================================================
   SHARE
========================================================= */

async function shareNote() {

    const output =
        createExportCanvas();


    output.toBlob(
        async blob => {

            if (!blob) {

                showToast(
                    "공유할 수 없습니다"
                );

                return;
            }


            const file =
                new File(
                    [blob],
                    "PaperNote.png",
                    {
                        type:
                            "image/png"
                    }
                );


            /*
               Android / iPadOS 등
               Web Share API
            */

            if (
                navigator.share &&
                (
                    !navigator.canShare ||
                    navigator.canShare({
                        files: [file]
                    })
                )
            ) {

                try {

                    await navigator.share({

                        title:
                            "Paper Note",

                        text:
                            "필기 메모",

                        files:
                            [file]
                    });


                    showToast(
                        "공유했습니다"
                    );


                    return;

                } catch (error) {

                    if (
                        error.name ===
                        "AbortError"
                    ) {

                        return;
                    }
                }
            }


            /*
               Web Share를 지원하지 않는
               브라우저에서는 PNG 다운로드
            */

            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;

            link.download =
                "PaperNote.png";


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            setTimeout(
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );


            showToast(
                "PNG로 저장했습니다"
            );

        },
        "image/png"
    );
}


/* =========================================================
   DARK MODE
========================================================= */

function toggleDark() {

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(
        "paperNoteDark",
        document.body.classList.contains(
            "dark"
        )
    );
}


/* =========================================================
   LOAD SAVED NOTE
========================================================= */

function loadNote() {

    const saved =
        localStorage.getItem(
            "paperNote"
        );


    if (saved) {

        const img =
            new Image();


        img.onload =
            () => {

                const size =
                    getCanvasCSSSize();


                ctx.clearRect(
                    0,
                    0,
                    size.width,
                    size.height
                );


                ctx.drawImage(
                    img,
                    0,
                    0,
                    size.width,
                    size.height
                );
            };


        img.src =
            saved;
    }


    /*
       색상
    */

    const savedColor =
        localStorage.getItem(
            "paperNoteColor"
        );


    if (savedColor) {

        color =
            savedColor;


        document
            .getElementById(
                "currentColor"
            )
            .style.background =
            color;


        document
            .querySelectorAll(
                ".color-btn"
            )
            .forEach(
                button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.color ===
                        color
                    );
                }
            );
    }


    /*
       굵기
    */

    const savedSize =
        localStorage.getItem(
            "paperNoteSize"
        );


    if (savedSize) {

        size =
            Number(
                savedSize
            );


        sizeRange.value =
            size;


        updateSizePreview();
    }
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer =
    null;


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1500
        );
}


/* =========================================================
   OUTSIDE POPOVER
========================================================= */

document.addEventListener(
    "pointerdown",
    e => {

        const popover =
            document.getElementById(
                "popover"
            );


        const settings =
            document.getElementById(
                "settingsTool"
            );


        if (
            popover.classList.contains(
                "show"
            ) &&
            !popover.contains(
                e.target
            ) &&
            !settings.contains(
                e.target
            )
        ) {

            closePopover();
        }
    }
);


/* =========================================================
   KEYBOARD SHORTCUT
========================================================= */

document.addEventListener(
    "keydown",
    e => {

        const command =
            e.ctrlKey ||
            e.metaKey;


        /*
           Undo
        */

        if (
            command &&
            e.key.toLowerCase() ===
            "z"
        ) {

            e.preventDefault();


            if (e.shiftKey) {

                redo();

            } else {

                undo();
            }
        }


        /*
           Redo
        */

        if (
            command &&
            e.key.toLowerCase() ===
            "y"
        ) {

            e.preventDefault();

            redo();
        }


        /*
           Save
        */

        if (
            command &&
            e.key.toLowerCase() ===
            "s"
        ) {

            e.preventDefault();

            saveNote();
        }
    }
);


/* =========================================================
   INITIALIZE
========================================================= */

setTimeout(
    () => {

        loadNote();

        updateHistoryButtons();

        updateSizePreview();

        applyZoom();

    },
    100
);

</script>

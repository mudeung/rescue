<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover
    "
>

<meta
    name="theme-color"
    content="#f4f5f8"
>

<title>Choi.SH Paper Web Note</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;

    user-select: none;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

    background: #eef0f5;
    color: #17181c;
}

button,
input {

    font: inherit;
}


/* =========================================================
   THEME
========================================================= */

:root {

    --bg:
        #eef0f5;

    --paper:
        #ffffff;

    --surface:
        rgba(255,255,255,.92);

    --text:
        #17181c;

    --muted:
        #858994;

    --border:
        #e1e3e8;

    --accent:
        #6d5dfc;

    --accent-soft:
        #eeeaff;

    --shadow:
        0 18px 45px
        rgba(20,25,45,.14);
}

body.dark {

    --bg:
        #15161a;

    --paper:
        #202126;

    --surface:
        rgba(32,33,39,.94);

    --text:
        #f4f4f6;

    --muted:
        #9b9da7;

    --border:
        #383941;

    --accent:
        #8b7cff;

    --accent-soft:
        #302c50;

    --shadow:
        0 20px 50px
        rgba(0,0,0,.38);
}


/* =========================================================
   APP
========================================================= */

.app {

    width: 100%;
    height: 100%;

    display:
        flex;

    flex-direction:
        column;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    height: 64px;

    flex:
        0 0 64px;

    display:
        flex;

    align-items:
        center;

    padding:
        0 18px;

    background:
        var(--surface);

    border-bottom:
        1px solid var(--border);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    position:
        relative;

    z-index:
        100;
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    min-width:
        220px;
}

.logo {

    width:
        36px;

    height:
        36px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        11px;

    color:
        white;

    background:
        linear-gradient(
            135deg,
            #8173ff,
            #5948f1
        );

    box-shadow:
        0 6px 15px
        rgba(100,85,245,.28);
}

.logo svg {

    width:
        20px;

    height:
        20px;

    fill:
        none;

    stroke:
        currentColor;

    stroke-width:
        1.8;

    stroke-linecap:
        round;

    stroke-linejoin:
        round;
}

.brand-name {

    font-size:
        15px;

    font-weight:
        750;
}

.brand-sub {

    margin-top:
        2px;

    font-size:
        10px;

    color:
        var(--muted);
}


/* =========================================================
   CENTER
========================================================= */

.header-center {

    flex:
        1;

    display:
        flex;

    justify-content:
        center;
}

.page-title {

    padding:
        7px 15px;

    border-radius:
        10px;

    background:
        var(--bg);

    color:
        var(--muted);

    font-size:
        12px;
}


/* =========================================================
   HEADER ACTIONS
========================================================= */

.header-actions {

    min-width:
        220px;

    display:
        flex;

    justify-content:
        flex-end;

    align-items:
        center;

    gap:
        7px;
}


/* =========================================================
   ICON BUTTON
========================================================= */

.icon-btn {

    width:
        40px;

    height:
        40px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border:
        1px solid transparent;

    border-radius:
        11px;

    background:
        transparent;

    color:
        var(--text);

    cursor:
        pointer;
}

.icon-btn:hover {

    background:
        var(--bg);

    border-color:
        var(--border);
}

.icon-btn svg {

    width:
        20px;

    height:
        20px;

    fill:
        none;

    stroke:
        currentColor;

    stroke-width:
        1.8;

    stroke-linecap:
        round;

    stroke-linejoin:
        round;
}


/* =========================================================
   PRIMARY
========================================================= */

.primary-btn {

    height:
        40px;

    padding:
        0 15px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        7px;

    border:
        0;

    border-radius:
        11px;

    background:
        var(--accent);

    color:
        white;

    font-size:
        12px;

    font-weight:
        700;

    box-shadow:
        0 7px 18px
        rgba(109,93,252,.27);
}

.primary-btn svg {

    width:
        17px;

    height:
        17px;

    fill:
        none;

    stroke:
        currentColor;

    stroke-width:
        1.9;

    stroke-linecap:
        round;

    stroke-linejoin:
        round;
}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace {

    position:
        relative;

    flex:
        1;

    overflow:
        hidden;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(109,93,252,.09),
            transparent 40%
        ),
        var(--bg);
}


/* =========================================================
   PAGE AREA

   핵심:
   touch-action:none

   브라우저 기본 제스처를 페이지에서 직접 관리.
========================================================= */

.page-area {

    position:
        absolute;

    inset:
        0;

    overflow:
        hidden;

    display:
        flex;

    justify-content:
        center;

    align-items:
        flex-start;

    padding:
        35px 50px 130px;

    touch-action:
        none;

    overscroll-behavior:
        none;
}


/* =========================================================
   PAPER
========================================================= */

.paper {

    position:
        relative;

    width:
        min(900px, 92vw);

    height:
        max(
            1180px,
            calc(100vh - 130px)
        );

    flex:
        0 0 auto;

    background:
        var(--paper);

    border-radius:
        5px;

    box-shadow:
        var(--shadow);

    overflow:
        hidden;

    transform-origin:
        center center;

    will-change:
        transform;
}


/* =========================================================
   PAPER LINES
========================================================= */

.paper.lines {

    background-color:
        var(--paper);

    background-image:
        linear-gradient(
            to bottom,
            transparent 31px,
            rgba(100,120,155,.14) 32px,
            transparent 33px
        );

    background-size:
        100% 32px;
}


/* =========================================================
   GRID
========================================================= */

.paper.grid {

    background-color:
        var(--paper);

    background-image:

        linear-gradient(
            rgba(100,120,155,.12) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(100,120,155,.12) 1px,
            transparent 1px
        );

    background-size:
        28px 28px;
}


/* =========================================================
   CANVAS

   중요:
   필기 캔버스도 touch-action:none
========================================================= */

#canvas {

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    display:
        block;

    touch-action:
        none;

    /*
       S펜 입력 중
       브라우저 선택/드래그 방지
    */

    -webkit-user-select:
        none;

    user-select:
        none;

    cursor:
        crosshair;
}


/* =========================================================
   SAVE STATUS
========================================================= */

.save-indicator {

    position:
        absolute;

    top:
        15px;

    right:
        18px;

    padding:
        6px 10px;

    border:
        1px solid var(--border);

    border-radius:
        20px;

    background:
        var(--surface);

    color:
        var(--muted);

    font-size:
        10px;

    backdrop-filter:
        blur(12px);

    pointer-events:
        none;
}


/* =========================================================
   FLOATING TOOLBAR
========================================================= */

.floating-toolbar {

    position:
        absolute;

    left:
        50%;

    bottom:
        18px;

    transform:
        translateX(-50%);

    min-height:
        62px;

    display:
        flex;

    align-items:
        center;

    gap:
        4px;

    padding:
        8px;

    background:
        var(--surface);

    border:
        1px solid
        rgba(255,255,255,.55);

    border-radius:
        18px;

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    z-index:
        50;
}


/* =========================================================
   TOOL
========================================================= */

.tool-btn {

    width:
        46px;

    height:
        46px;

    flex:
        0 0 46px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border:
        0;

    border-radius:
        13px;

    background:
        transparent;

    color:
        var(--text);

    cursor:
        pointer;
}

.tool-btn:hover {

    background:
        var(--bg);
}

.tool-btn.active {

    background:
        var(--accent-soft);

    color:
        var(--accent);
}

.tool-btn:disabled {

    opacity:
        .25;
}

.tool-btn svg {

    width:
        21px;

    height:
        21px;

    fill:
        none;

    stroke:
        currentColor;

    stroke-width:
        1.8;

    stroke-linecap:
        round;

    stroke-linejoin:
        round;
}


/* =========================================================
   DIVIDER
========================================================= */

.tool-divider {

    width:
        1px;

    height:
        30px;

    background:
        var(--border);

    margin:
        0 4px;
}


/* =========================================================
   CURRENT COLOR
========================================================= */

.current-color {

    width:
        22px;

    height:
        22px;

    border-radius:
        50%;

    border:
        2px solid var(--paper);

    box-shadow:
        0 0 0 1px var(--border);
}


/* =========================================================
   POPOVER
========================================================= */

.popover {

    position:
        absolute;

    left:
        50%;

    bottom:
        95px;

    width:
        285px;

    padding:
        17px;

    border:
        1px solid var(--border);

    border-radius:
        18px;

    background:
        var(--surface);

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    transform:
        translateX(-50%)
        translateY(10px)
        scale(.97);

    opacity:
        0;

    pointer-events:
        none;

    transition:
        .18s ease;

    z-index:
        70;
}

.popover.show {

    opacity:
        1;

    pointer-events:
        auto;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1);
}

.popover-title {

    margin-bottom:
        12px;

    color:
        var(--muted);

    font-size:
        11px;

    font-weight:
        700;
}


/* =========================================================
   RANGE
========================================================= */

.range-row {

    display:
        flex;

    align-items:
        center;

    gap:
        12px;
}

.range-row input {

    flex:
        1;

    accent-color:
        var(--accent);
}

.size-preview {

    width:
        38px;

    height:
        34px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;
}

.size-dot {

    width:
        8px;

    height:
        8px;

    border-radius:
        50%;

    background:
        var(--text);
}


/* =========================================================
   COLORS
========================================================= */

.colors {

    display:
        grid;

    grid-template-columns:
        repeat(10, 1fr);

    gap:
        10px;
}

.color-btn {

    width:
        23px;

    height:
        23px;

    padding:
        0;

    border:
        2px solid transparent;

    border-radius:
        50%;

    cursor:
        pointer;
}

.color-btn.active {

    box-shadow:
        0 0 0 2px var(--paper),
        0 0 0 3px var(--accent);
}


/* =========================================================
   PAPER MENU
========================================================= */

.paper-menu {

    display:
        flex;

    gap:
        7px;
}

.paper-option {

    flex:
        1;

    padding:
        9px 5px;

    border:
        1px solid var(--border);

    border-radius:
        9px;

    background:
        transparent;

    color:
        var(--text);

    font-size:
        11px;
}

.paper-option.active {

    border-color:
        var(--accent);

    background:
        var(--accent-soft);

    color:
        var(--accent);
}


/* =========================================================
   ZOOM
========================================================= */

.zoom-control {

    position:
        absolute;

    left:
        16px;

    bottom:
        20px;

    display:
        flex;

    align-items:
        center;

    gap:
        3px;

    padding:
        6px;

    background:
        var(--surface);

    border:
        1px solid var(--border);

    border-radius:
        14px;

    box-shadow:
        0 10px 25px
        rgba(20,25,45,.10);

    backdrop-filter:
        blur(18px);

    z-index:
        40;
}

.zoom-btn {

    width:
        34px;

    height:
        34px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border:
        0;

    border-radius:
        9px;

    background:
        transparent;

    color:
        var(--text);
}

.zoom-btn svg {

    width:
        17px;

    height:
        17px;

    fill:
        none;

    stroke:
        currentColor;

    stroke-width:
        1.8;

    stroke-linecap:
        round;

    stroke-linejoin:
        round;
}

.zoom-value {

    min-width:
        52px;

    text-align:
        center;

    color:
        var(--muted);

    font-size:
        11px;
}


/* =========================================================
   TOAST
========================================================= */

.toast {

    position:
        absolute;

    left:
        50%;

    bottom:
        100px;

    transform:
        translate(-50%,10px);

    padding:
        9px 15px;

    border-radius:
        10px;

    background:
        #202126;

    color:
        white;

    font-size:
        12px;

    opacity:
        0;

    pointer-events:
        none;

    transition:
        .18s ease;

    z-index:
        100;
}

.toast.show {

    opacity:
        1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:800px) {

    .header {

        height:
            58px;

        flex-basis:
            58px;

        padding:
            0 10px;
    }

    .brand {

        min-width:
            auto;
    }

    .brand-name,
    .brand-sub {

        display:
            none;
    }

    .header-center {

        justify-content:
            flex-start;

        padding-left:
            10px;
    }

    .header-actions {

        min-width:
            auto;
    }

    .primary-btn {

        width:
            40px;

        padding:
            0;
    }

    .primary-btn .text-label {

        display:
            none;
    }

    .page-area {

        padding:
            12px 12px 115px;
    }

    .paper {

        width:
            100%;

        min-width:
            100%;

        height:
            calc(100vh - 100px);
    }

    .floating-toolbar {

        bottom:
            9px;

        max-width:
            calc(100vw - 16px);

        overflow-x:
            auto;
    }

    .zoom-control {

        bottom:
            78px;

        left:
            10px;
    }
}


/* =========================================================
   PHONE
========================================================= */

@media(max-width:500px) {

    .header-center {

        display:
            none;
    }

    .page-area {

        padding:
            7px 7px 108px;
    }

    .tool-btn {

        width:
            40px;

        height:
            40px;

        flex-basis:
            40px;
    }

    .floating-toolbar {

        padding:
            6px;
    }

    .popover {

        width:
            260px;
    }

    .colors {

        grid-template-columns:
            repeat(8,1fr);
    }
}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     HEADER
====================================================== -->

<header class="header">

    <div class="brand">

        <div class="logo">

            <svg viewBox="0 0 24 24">

                <path d="M12 20h9"/>

                <path
                    d="
                    M16.5 3.5
                    a2.1 2.1 0 0 1 3 3
                    L8 18
                    l-4 1
                    1-4
                    Z
                    "
                />

                <path d="M15 5l3 3"/>

            </svg>

        </div>

        <div>

            <div class="brand-name">
                Choi.SH Paper Web Note
            </div>

            <div class="brand-sub">
                S Pen handwriting
            </div>

        </div>

    </div>


    <div class="header-center">

        <div class="page-title">
            내 필기 노트
        </div>

    </div>


    <div class="header-actions">


        <!-- DARK -->

        <button
            class="icon-btn"
            onclick="toggleDark()"
            title="다크 모드">

            <svg viewBox="0 0 24 24">

                <path
                    d="
                    M21 12.8
                    A8.5 8.5 0 1 1
                    11.2 3
                    A6.7 6.7 0 0 0
                    21 12.8Z
                    "
                />

            </svg>

        </button>


        <!-- SHARE -->

        <button
            class="icon-btn"
            onclick="shareNote()"
            title="공유">

            <svg viewBox="0 0 24 24">

                <path d="M12 16V3"/>

                <path d="M7 8l5-5 5 5"/>

                <path
                    d="
                    M5 12v7
                    a2 2 0 0 0 2 2
                    h10
                    a2 2 0 0 0 2-2
                    v-7
                    "
                />

            </svg>

        </button>


        <!-- SAVE -->

        <button
            class="primary-btn"
            onclick="saveNote()">

            <svg viewBox="0 0 24 24">

                <path d="M5 20h14"/>

                <path d="M12 4v11"/>

                <path d="M7 10l5 5 5-5"/>

            </svg>

            <span class="text-label">
                저장
            </span>

        </button>

    </div>

</header>


<!-- =====================================================
     WORKSPACE
====================================================== -->

<main class="workspace">


    <div
        id="pageArea"
        class="page-area">


        <div
            id="paper"
            class="paper lines">


            <canvas
                id="canvas">
            </canvas>


        </div>

    </div>


    <div
        id="saveIndicator"
        class="save-indicator">

        자동 저장됨

    </div>


    <!-- =================================================
         PEN POPOVER
    ================================================== -->

    <div
        id="popover"
        class="popover">


        <div class="popover-title">
            펜 굵기
        </div>


        <div class="range-row">

            <input
                id="sizeRange"
                type="range"
                min="1"
                max="15"
                step=".5"
                value="4"
            >

            <div class="size-preview">

                <div
                    id="sizeDot"
                    class="size-dot">
                </div>

            </div>

        </div>


        <div
            style="
                height:1px;
                background:var(--border);
                margin:18px 0;
            ">
        </div>


        <div class="popover-title">
            펜 색상
        </div>


        <div class="colors">


            <button
                class="color-btn active"
                style="background:#17181c"
                data-color="#17181c">
            </button>

            <button
                class="color-btn"
                style="background:#ef4444"
                data-color="#ef4444">
            </button>

            <button
                class="color-btn"
                style="background:#f97316"
                data-color="#f97316">
            </button>

            <button
                class="color-btn"
                style="background:#eab308"
                data-color="#eab308">
            </button>

            <button
                class="color-btn"
                style="background:#22c55e"
                data-color="#22c55e">
            </button>

            <button
                class="color-btn"
                style="background:#3b82f6"
                data-color="#3b82f6">
            </button>

            <button
                class="color-btn"
                style="background:#8b5cf6"
                data-color="#8b5cf6">
            </button>

            <button
                class="color-btn"
                style="background:#ec4899"
                data-color="#ec4899">
            </button>

            <button
                class="color-btn"
                style="background:#06b6d4"
                data-color="#06b6d4">
            </button>

            <button
                class="color-btn"
                style="background:#795548"
                data-color="#795548">
            </button>

            <button
                class="color-btn"
                style="background:#64748b"
                data-color="#64748b">
            </button>

            <button
                class="color-btn"
                style="
                    background:#fff;
                    border-color:#d5d7dc
                "
                data-color="#ffffff">
            </button>

            <button
                class="color-btn"
                style="background:#000"
                data-color="#000000">
            </button>

            <button
                class="color-btn"
                style="background:#14b8a6"
                data-color="#14b8a6">
            </button>

            <!-- 추가 5색 -->

            <button
                class="color-btn"
                style="background:#0f766e"
                data-color="#0f766e">
            </button>

            <button
                class="color-btn"
                style="background:#1d4ed8"
                data-color="#1d4ed8">
            </button>

            <button
                class="color-btn"
                style="background:#7c3aed"

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha: true,
            desynchronized: true
        }
    );

const paper =
    document.getElementById("paper");

const pageArea =
    document.getElementById("pageArea");


/* =========================================================
   SETTINGS
========================================================= */

let tool =
    "pen";

let color =
    "#17181c";

let size =
    4;


/*
   S펜만 필기.
*/
const PEN_ONLY =
    true;


/*
   필기 smoothing
*/
const POSITION_SMOOTHING =
    0.72;

const PRESSURE_SMOOTHING =
    0.30;


/* =========================================================
   DRAW STATE
========================================================= */

let drawing =
    false;

let activePenId =
    null;

let lastX =
    0;

let lastY =
    0;

let lastPressure =
    .5;

let lastTime =
    0;


/* =========================================================
   HISTORY
========================================================= */

let undoStack =
    [];

let redoStack =
    [];


/* =========================================================
   SAVE
========================================================= */

let saveTimer =
    null;


/* =========================================================
   ZOOM
========================================================= */

let zoom =
    1;

const MIN_ZOOM =
    .5;

const MAX_ZOOM =
    4;

let panX =
    0;

let panY =
    0;


/* =========================================================
   TOUCH POINTERS

   손가락은 절대 drawing에 사용하지 않는다.
========================================================= */

const touchPointers =
    new Map();


let pinchStartDistance =
    0;

let pinchStartZoom =
    1;

let pinchStartPanX =
    0;

let pinchStartPanY =
    0;

let pinchCenterX =
    0;

let pinchCenterY =
    0;


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas() {

    const rect =
        paper.getBoundingClientRect();

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            3
        );


    /*
       기존 필기 보존
    */

    let oldImage =
        null;

    if (
        canvas.width > 0 &&
        canvas.height > 0
    ) {

        oldImage =
            canvas.toDataURL(
                "image/png"
            );
    }


    canvas.width =
        Math.round(
            rect.width * dpr
        );

    canvas.height =
        Math.round(
            rect.height * dpr
        );


    canvas.style.width =
        rect.width + "px";

    canvas.style.height =
        rect.height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    ctx.imageSmoothingEnabled =
        true;


    if (oldImage) {

        const image =
            new Image();

        image.onload =
            function() {

                ctx.drawImage(
                    image,
                    0,
                    0,
                    rect.width,
                    rect.height
                );
            };

        image.src =
            oldImage;
    }
}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   CANVAS SIZE
========================================================= */

function canvasSize() {

    const rect =
        canvas.getBoundingClientRect();

    return {

        width:
            rect.width,

        height:
            rect.height
    };
}


/* =========================================================
   EVENT TO CANVAS COORDINATE
========================================================= */

function getPoint(e) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (e.clientX - rect.left) /
            zoom,

        y:
            (e.clientY - rect.top) /
            zoom
    };
}


/* =========================================================
   IS PEN
========================================================= */

function isPen(e) {

    return (
        e.pointerType === "pen"
    );
}


/* =========================================================
   IS TOUCH
========================================================= */

function isTouch(e) {

    return (
        e.pointerType === "touch"
    );
}


/* =========================================================
   POINTER DOWN

   ★ 가장 중요한 부분
========================================================= */

canvas.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();


        /*
           TOUCH

           손가락/손바닥은
           절대로 필기 시작하지 않는다.
        */

        if (
            isTouch(e)
        ) {

            touchPointers.set(
                e.pointerId,
                {
                    x: e.clientX,
                    y: e.clientY
                }
            );


            /*
               두 손가락이면
               확대/이동 준비
            */

            if (
                touchPointers.size >= 2
            ) {

                drawing =
                    false;

                activePenId =
                    null;

                beginPinch();
            }


            return;
        }


        /*
           PEN

           S펜만 여기로 들어온다.
        */

        if (
            isPen(e)
        ) {

            /*
               이미 다른 S펜 입력 중이면
               무시
            */

            if (
                activePenId !== null
            ) {

                return;
            }


            activePenId =
                e.pointerId;


            try {

                canvas.setPointerCapture(
                    e.pointerId
                );

            } catch (_) {}


            startPenStroke(e);

            return;
        }


        /*
           Mouse

           데스크톱 테스트를 위해
           마우스도 허용.

           태블릿에서는 보통
           mouse 입력이 발생하지 않는다.
        */

        if (
            e.pointerType === "mouse" &&
            e.buttons === 1
        ) {

            startPenStroke(e);
        }

    },
    {
        passive:
            false
    }
);


/* =========================================================
   POINTER MOVE
========================================================= */

canvas.addEventListener(
    "pointermove",
    function(e) {

        e.preventDefault();


        /*
           TOUCH
        */

        if (
            isTouch(e)
        ) {

            if (
                touchPointers.has(
                    e.pointerId
                )
            ) {

                touchPointers.set(
                    e.pointerId,
                    {
                        x: e.clientX,
                        y: e.clientY
                    }
                );
            }


            if (
                touchPointers.size >= 2
            ) {

                drawing =
                    false;

                updatePinch();
            }


            /*
               ★ touch는 여기서 끝.
               drawStroke 호출 절대 금지.
            */

            return;
        }


        /*
           PEN
        */

        if (
            isPen(e)
        ) {

            if (
                e.pointerId !==
                activePenId
            ) {

                return;
            }


            if (
                drawing
            ) {

                processPenMove(e);
            }


            return;
        }


        /*
           MOUSE
        */

        if (
            e.pointerType === "mouse" &&
            drawing &&
            e.buttons === 1
        ) {

            processPenMove(e);
        }

    },
    {
        passive:
            false
    }
);


/* =========================================================
   POINTER UP
========================================================= */

canvas.addEventListener(
    "pointerup",
    endPointer,
    {
        passive:
            false
    }
);


canvas.addEventListener(
    "pointercancel",
    endPointer,
    {
        passive:
            false
    }
);


function endPointer(e) {

    e.preventDefault();


    /*
       TOUCH
    */

    if (
        isTouch(e)
    ) {

        touchPointers.delete(
            e.pointerId
        );


        if (
            touchPointers.size < 2
        ) {

            pinchStartDistance =
                0;
        }


        return;
    }


    /*
       PEN
    */

    if (
        isPen(e)
    ) {

        if (
            e.pointerId ===
            activePenId
        ) {

            if (
                drawing
            ) {

                finishStroke();
            }


            drawing =
                false;

            activePenId =
                null;
        }


        return;
    }


    /*
       MOUSE
    */

    if (
        e.pointerType === "mouse"
    ) {

        if (
            drawing
        ) {

            finishStroke();
        }

        drawing =
            false;
    }
}


/* =========================================================
   PEN STROKE START
========================================================= */

function startPenStroke(e) {

    drawing =
        true;


    /*
       Undo 상태 저장
    */

    saveState();


    const point =
        getPoint(e);


    lastX =
        point.x;

    lastY =
        point.y;


    lastPressure =
        normalizePressure(
            e.pressure
        );


    lastTime =
        performance.now();


    /*
       첫 점
    */

    drawDot(
        point.x,
        point.y,
        lastPressure
    );
}


/* =========================================================
   PEN MOVE

   getCoalescedEvents() 사용
========================================================= */

function processPenMove(e) {

    /*
       브라우저가 한 번의 이벤트에
       여러 개의 필기 좌표를 합쳐놓은 경우
       가능한 모든 좌표를 처리한다.
    */

    let events;


    if (
        typeof e.getCoalescedEvents ===
        "function"
    ) {

        events =
            e.getCoalescedEvents();

    } else {

        events =
            [e];
    }


    for (
        const pointEvent
        of events
    ) {

        processSinglePenPoint(
            pointEvent
        );
    }
}


/* =========================================================
   SINGLE PEN POINT
========================================================= */

function processSinglePenPoint(e) {

    const point =
        getPoint(e);


    const pressure =
        normalizePressure(
            e.pressure
        );


    /*
       좌표 smoothing
    */

    const x =
        lastX +
        (
            point.x -
            lastX
        ) *
        POSITION_SMOOTHING;


    const y =
        lastY +
        (
            point.y -
            lastY
        ) *
        POSITION_SMOOTHING;


    /*
       필압 smoothing
    */

    const smoothPressure =
        lastPressure +
        (
            pressure -
            lastPressure
        ) *
        PRESSURE_SMOOTHING;


    const now =
        performance.now();


    const dt =
        Math.max(
            1,
            now -
            lastTime
        );


    const dx =
        x -
        lastX;

    const dy =
        y -
        lastY;


    const distanceMoved =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
       너무 작은 떨림 제거
    */

    if (
        distanceMoved <
        .08
    ) {

        return;
    }


    const velocity =
        distanceMoved /
        dt;


    drawSegment(
        lastX,
        lastY,
        x,
        y,
        smoothPressure,
        velocity
    );


    lastX =
        x;

    lastY =
        y;

    lastPressure =
        smoothPressure;

    lastTime =
        now;
}


/* =========================================================
   PRESSURE
========================================================= */

function normalizePressure(
    pressure
) {

    /*
       일부 브라우저가
       S펜 pressure를 0으로 보내는 경우
    */

    if (
        !Number.isFinite(
            pressure
        ) ||
        pressure <= 0
    ) {

        return .5;
    }


    return Math.max(
        .05,
        Math.min(
            1,
            pressure
        )
    );
}


/* =========================================================
   DRAW SEGMENT
========================================================= */

function drawSegment(
    x1,
    y1,
    x2,
    y2,
    pressure,
    velocity
) {

    ctx.save();


    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    /*
       ERASER
    */

    if (
        tool === "eraser"
    ) {

        ctx.globalCompositeOperation =
            "destination-out";


        ctx.lineWidth =
            Math.max(
                12,
                size *
                (
                    2.5 +
                    pressure * 1.8
                )
            );

    }


    /*
       PEN
    */

    else {

        ctx.globalCompositeOperation =
            "source-over";

        ctx.strokeStyle =
            color;


        /*
           필압에 따른 자연스러운
           굵기 변화
        */

        let width =
            size *
            (
                .48 +
                pressure *
                .72
            );


        /*
           빠른 필기는
           살짝 얇게
        */

        if (
            velocity > .8
        ) {

            width *=
                .92;
        }


        width =
            Math.max(
                .55,
                Math.min(
                    size * 1.3,
                    width
                )
            );


        ctx.lineWidth =
            width;
    }


    ctx.beginPath();


    /*
       Quadratic curve로
       아주 짧은 구간도 부드럽게
    */

    const midX =
        (x1 + x2) / 2;

    const midY =
        (y1 + y2) / 2;


    ctx.moveTo(
        x1,
        y1
    );


    ctx.quadraticCurveTo(
        x1,
        y1,
        midX,
        midY
    );


    ctx.quadraticCurveTo(
        x2,
        y2,
        x2,
        y2
    );


    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   DOT
========================================================= */

function drawDot(
    x,
    y,
    pressure
) {

    ctx.save();


    if (
        tool === "eraser"
    ) {

        ctx.globalCompositeOperation =
            "destination-out";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            Math.max(
                7,
                size * 1.7
            ),
            0,
            Math.PI * 2
        );

        ctx.fill();

    } else {

        ctx.globalCompositeOperation =
            "source-over";

        ctx.fillStyle =
            color;


        const radius =
            Math.max(
                .45,
                size *
                (
                    .30 +
                    pressure * .45
                )
            );


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    ctx.restore();
}


/* =========================================================
   FINISH
========================================================= */

function finishStroke() {

    drawing =
        false;

    redoStack =
        [];

    updateHistoryButtons();

    scheduleSave();
}


/* =========================================================
   PINCH
========================================================= */

function beginPinch() {

    const values =
        [...touchPointers.values()];


    if (
        values.length < 2
    ) {

        return;
    }


    const a =
        values[0];

    const b =
        values[1];


    pinchStartDistance =
        distance(
            a,
            b
        );


    pinchStartZoom =
        zoom;


    const center =
        midpoint(
            a,
            b
        );


    pinchCenterX =
        center.x;

    pinchCenterY =
        center.y;


    pinchStartPanX =
        panX;

    pinchStartPanY =
        panY;
}


/* =========================================================
   UPDATE PINCH
========================================================= */

function updatePinch() {

    const values =
        [...touchPointers.values()];


    if (
        values.length < 2
    ) {

        return;
    }


    const a =
        values[0];

    const b =
        values[1];


    const currentDistance =
        distance(
            a,
            b
        );


    if (
        pinchStartDistance <= 0
    ) {

        return;
    }


    let newZoom =
        pinchStartZoom *
        (
            currentDistance /
            pinchStartDistance
        );


    newZoom =
        Math.max(
            MIN_ZOOM,
            Math.min(
                MAX_ZOOM,
                newZoom
            )
        );


    const center =
        midpoint(
            a,
            b
        );


    panX =
        pinchStartPanX +
        (
            center.x -
            pinchCenterX
        );


    panY =
        pinchStartPanY +
        (
            center.y -
            pinchCenterY
        );


    zoom =
        newZoom;


    applyZoom();
}


/* =========================================================
   GEOMETRY
========================================================= */

function distance(a,b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


function midpoint(a,b) {

    return {

        x:
            (a.x + b.x) / 2,

        y:
            (a.y + b.y) / 2
    };
}


/* =========================================================
   ZOOM
========================================================= */

function applyZoom() {

    paper.style.transform =
        `
        translate3d(
            ${panX}px,
            ${panY}px,
            0
        )
        scale(${zoom})
        `;


    document
        .getElementById(
            "zoomValue"
        )
        .textContent =
        Math.round(
            zoom * 100
        ) + "%";
}


function zoomIn() {

    zoom =
        Math.min(
            MAX_ZOOM,
            zoom + .25
        );

    applyZoom();
}


function zoomOut() {

    zoom =
        Math.max(
            MIN_ZOOM,
            zoom - .25
        );

    applyZoom();
}


function resetZoom() {

    zoom =
        1;

    panX =
        0;

    panY =
        0;

    applyZoom();

    showToast(
        "100%"
    );
}


/* =========================================================
   HISTORY
========================================================= */

function saveState() {

    const state =
        canvas.toDataURL(
            "image/png"
        );


    if (
        undoStack.length &&
        undoStack[
            undoStack.length - 1
        ] === state
    ) {

        return;
    }


    undoStack.push(
        state
    );


    if (
        undoStack.length > 40
    ) {

        undoStack.shift();
    }


    redoStack =
        [];

    updateHistoryButtons();
}


function undo() {

    if (
        !undoStack.length
    ) {

        return;
    }


    redoStack.push(
        canvas.toDataURL(
            "image/png"
        )
    );


    const state =
        undoStack.pop();


    restoreImage(
        state
    );


    updateHistoryButtons();

    scheduleSave();

    showToast(
        "실행 취소"
    );
}


function redo() {

    if (
        !redoStack.length
    ) {

        return;
    }


    undoStack.push(
        canvas.toDataURL(
            "image/png"
        )
    );


    const state =
        redoStack.pop();


    restoreImage(
        state
    );


    updateHistoryButtons();

    scheduleSave();

    showToast(
        "다시 실행"
    );
}


function restoreImage(src) {

    const image =
        new Image();


    image.onload =
        function() {

            const s =
                canvasSize();


            ctx.clearRect(
                0,
                0,
                s.width,
                s.height
            );


            ctx.drawImage(
                image,
                0,
                0,
                s.width,
                s.height
            );
        };


    image.src =
        src;
}


function updateHistoryButtons() {

    document
        .getElementById(
            "undoTool"
        )
        .disabled =
        undoStack.length === 0;


    document
        .getElementById(
            "redoTool"
        )
        .disabled =
        redoStack.length === 0;
}


/* =========================================================
   CLEAR
========================================================= */

function clearCanvas() {

    if (
        !confirm(
            "필기를 모두 지울까요?"
        )
    ) {

        return;
    }


    saveState();


    const s =
        canvasSize();


    ctx.clearRect(
        0,
        0,
        s.width,
        s.height
    );


    redoStack =
        [];


    updateHistoryButtons();

    scheduleSave();

    showToast(
        "페이지를 지웠습니다"
    );
}


/* =========================================================
   TOOL
========================================================= */

function setTool(value) {

    tool =
        value;


    document
        .getElementById(
            "penTool"
        )
        .classList.toggle(
            "active",
            value === "pen"
        );


    document
        .getElementById(
            "eraserTool"
        )
        .classList.toggle(
            "active",
            value === "eraser"
        );


    closePopover();
}


/* =========================================================
   POPOVER
========================================================= */

function togglePopover() {

    document
        .getElementById(
            "popover"
        )
        .classList.toggle(
            "show"
        );
}


function closePopover() {

    document
        .getElementById(
            "popover"
        )
        .classList.remove(
            "show"
        );
}


/* =========================================================
   SIZE
========================================================= */

const sizeRange =
    document.getElementById(
        "sizeRange"
    );


sizeRange.addEventListener(
    "input",
    function() {

        size =
            Number(
                this.value
            );


        updateSizePreview();

        setTool(
            "pen"
        );

        scheduleSave();
    }
);


function updateSizePreview() {

    const dot =
        document.getElementById(
            "sizeDot"
        );


    const diameter =
        Math.max(
            3,
            Math.min(
                26,
                size * 1.65
            )
        );


    dot.style.width =
        diameter + "px";

    dot.style.height =
        diameter + "px";
}


updateSizePreview();


/* =========================================================
   COLORS
========================================================= */

document
    .querySelectorAll(
        ".color-btn"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    color =
                        this.dataset.color;


                    document
                        .getElementById(
                            "currentColor"
                        )
                        .style.background =
                        color;


                    document
                        .querySelectorAll(
                            ".color-btn"
                        )
                        .forEach(
                            b =>
                            b.classList.remove(
                                "active"
                            )
                        );


                    this.classList.add(
                        "active"
                    );


                    setTool(
                        "pen"
                    );


                    scheduleSave();
                }
            );
        }
    );


/* =========================================================
   PAPER
========================================================= */

function setPaper(type) {

    paper.classList.remove(
        "lines",
        "grid"
    );


    if (
        type === "lines"
    ) {

        paper.classList.add(
            "lines"
        );
    }


    if (
        type === "grid"
    ) {

        paper.classList.add(
            "grid"
        );
    }


    document
        .querySelectorAll(
            ".paper-option"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.paper ===
                    type
                );
            }
        );
}


/* =========================================================
   AUTOSAVE
========================================================= */

function scheduleSave() {

    const indicator =
        document.getElementById(
            "saveIndicator"
        );


    indicator.textContent =
        "저장 중...";


    clearTimeout(
        saveTimer
    );


    saveTimer =
        setTimeout(
            function() {

                localStorage.setItem(
                    "paperNote",
                    canvas.toDataURL(
                        "image/png"
                    )
                );


                localStorage.setItem(
                    "paperNoteColor",
                    color
                );


                localStorage.setItem(
                    "paperNoteSize",
                    String(size)
                );


                indicator.textContent =
                    "자동 저장됨";

            },
            450
        );
}


/* =========================================================
   EXPORT
========================================================= */

function createExportCanvas() {

    const output =
        document.createElement(
            "canvas"
        );


    output.width =
        canvas.width;

    output.height =
        canvas.height;


    const outputCtx =
        output.getContext(
            "2d"
        );


    outputCtx.fillStyle =
        "#ffffff";


    outputCtx.fillRect(
        0,
        0,
        output.width,
        output.height
    );


    outputCtx.drawImage(
        canvas,
        0,
        0
    );


    return output;
}


/* =========================================================
   SAVE
========================================================= */

function saveNote() {

    const output =
        createExportCanvas();


    const link =
        document.createElement(
            "a"
        );


    link.download =
        "PaperNote.png";


    link.href =
        output.toDataURL(
            "image/png"
        );


    link.click();


    showToast(
        "PNG 저장 완료"
    );
}


/* =========================================================
   SHARE
========================================================= */

async function shareNote() {

    const output =
        createExportCanvas();


    output.toBlob(
        async function(blob) {

            if (!blob) {

                return;
            }


            const file =
                new File(
                    [blob],
                    "PaperNote.png",
                    {
                        type:
                            "image/png"
                    }
                );


            if (
                navigator.share &&
                (
                    !navigator.canShare ||
                    navigator.canShare({
                        files:
                            [file]
                    })
                )
            ) {

                try {

                    await navigator.share({

                        title:
                            "Paper Note",

                        text:
                            "S펜 필기 노트",

                        files:
                            [file]
                    });


                    return;

                } catch (err) {

                    if (
                        err.name ===
                        "AbortError"
                    ) {

                        return;
                    }
                }
            }


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;

            link.download =
                "PaperNote.png";


            link.click();


            setTimeout(
                function() {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );


            showToast(
                "PNG로 저장했습니다"
            );

        },
        "image/png"
    );
}


/* =========================================================
   DARK MODE
========================================================= */

function toggleDark() {

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(
        "paperNoteDark",
        document.body.classList.contains(
            "dark"
        )
    );
}


/* =========================================================
   LOAD
========================================================= */

function loadNote() {

    /*
       Dark
    */

    if (
        localStorage.getItem(
            "paperNoteDark"
        ) === "true"
    ) {

        document.body.classList.add(
            "dark"
        );
    }


    /*
       Note
    */

    const saved =
        localStorage.getItem(
            "paperNote"
        );


    if (saved) {

        const image =
            new Image();


        image.onload =
            function() {

                const s =
                    canvasSize();


                ctx.clearRect(
                    0,
                    0,
                    s.width,
                    s.height
                );


                ctx.drawImage(
                    image,
                    0,
                    0,
                    s.width,
                    s.height
                );
            };


        image.src =
            saved;
    }


    /*
       Color
    */

    const savedColor =
        localStorage.getItem(
            "paperNoteColor"
        );


    if (savedColor) {

        color =
            savedColor;


        document
            .getElementById(
                "currentColor"
            )
            .style.background =
            color;


        document
            .querySelectorAll(
                ".color-btn"
            )
            .forEach(
                button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.color ===
                        color
                    );
                }
            );
    }


    /*
       Size
    */

    const savedSize =
        localStorage.getItem(
            "paperNoteSize"
        );


    if (savedSize) {

        size =
            Number(
                savedSize
            );


        sizeRange.value =
            size;


        updateSizePreview();
    }
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer =
    null;


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function() {

                toast.classList.remove(
                    "show"
                );

            },
            1500
        );
}


/* =========================================================
   CLOSE POPOVER
========================================================= */

document.addEventListener(
    "pointerdown",
    function(e) {

        const popover =
            document.getElementById(
                "popover"
            );

        const settings =
            document.getElementById(
                "settingsTool"
            );


        if (
            popover.classList.contains(
                "show"
            ) &&
            !popover.contains(
                e.target
            ) &&
            !settings.contains(
                e.target
            )
        ) {

            closePopover();
        }
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        const command =
            e.ctrlKey ||
            e.metaKey;


        if (
            command &&
            e.key.toLowerCase() === "z"
        ) {

            e.preventDefault();

            if (e.shiftKey) {

                redo();

            } else {

                undo();
            }
        }


        if (
            command &&
            e.key.toLowerCase() === "y"
        ) {

            e.preventDefault();

            redo();
        }


        if (
            command &&
            e.key.toLowerCase() === "s"
        ) {

            e.preventDefault();

            saveNote();
        }
    }
);


/* =========================================================
   INITIALIZE
========================================================= */

setTimeout(
    function() {

        loadNote();

        updateHistoryButtons();

        updateSizePreview();

        applyZoom();

    },
    100
);

</script>

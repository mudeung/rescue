<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Paper Note</title>

<style>
/* =========================================================
   기본
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --app-bg: #eef0f5;
    --paper: #ffffff;
    --surface: rgba(255,255,255,.92);

    --text: #17181c;
    --muted: #858994;
    --line: #e3e5ea;

    --accent: #6d5dfc;
    --accent-light: #eeeaff;

    --shadow:
        0 12px 35px rgba(20,25,45,.10),
        0 2px 8px rgba(20,25,45,.06);
}

body.dark {
    --app-bg: #141519;
    --paper: #202126;
    --surface: rgba(35,36,42,.94);

    --text: #f4f4f5;
    --muted: #a0a2ab;
    --line: #35363d;

    --accent: #8b7cff;
    --accent-light: #302c50;

    --shadow:
        0 15px 40px rgba(0,0,0,.30);
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

    background: var(--app-bg);
    color: var(--text);
}


/* =========================================================
   앱
========================================================= */

.app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}


/* =========================================================
   상단 헤더
========================================================= */

.header {
    height: 68px;
    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding: 0 22px;

    background: var(--surface);
    border-bottom: 1px solid var(--line);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    z-index: 100;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 220px;
}

.logo {
    width: 36px;
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            #7869ff,
            #5c4af4
        );

    color: white;

    box-shadow:
        0 5px 14px
        rgba(100,85,245,.28);
}

.logo svg {
    width: 20px;
    height: 20px;
}

.brand-text strong {
    display: block;
    font-size: 15px;
    line-height: 18px;
}

.brand-text span {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
}

.header-center {
    flex: 1;
    display: flex;
    justify-content: center;
}

.page-title {
    padding: 7px 15px;

    border-radius: 9px;

    font-size: 13px;
    color: var(--muted);

    background: var(--app-bg);
}

.header-actions {
    min-width: 220px;

    display: flex;
    justify-content: flex-end;
    align-items: center;

    gap: 7px;
}


/* =========================================================
   공통 SVG
========================================================= */

.icon-btn svg,
.tool-btn svg,
.primary-btn svg,
.zoom-btn svg {
    width: 20px;
    height: 20px;

    stroke: currentColor;
    fill: none;

    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;

    pointer-events: none;

    transition:
        transform .16s ease,
        stroke-width .16s ease;
}

.tool-btn svg {
    width: 21px;
    height: 21px;
}

.primary-btn svg {
    width: 17px;
    height: 17px;
}

.zoom-btn svg {
    width: 17px;
    height: 17px;
}

.icon-btn:hover svg,
.tool-btn:hover svg {
    transform: scale(1.06);
}

.tool-btn.active svg {
    stroke-width: 2.1;
}


/* =========================================================
   버튼
========================================================= */

.icon-btn {
    width: 40px;
    height: 40px;

    border: 1px solid transparent;
    border-radius: 11px;

    background: transparent;
    color: var(--text);

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition:
        background .18s ease,
        transform .18s ease,
        border .18s ease;
}

.icon-btn:hover {
    background: var(--app-bg);
    border-color: var(--line);
}

.icon-btn:active {
    transform: scale(.94);
}

.primary-btn {
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    padding: 0 15px;

    border: 0;
    border-radius: 11px;

    background: var(--accent);
    color: white;

    font-size: 13px;
    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 6px 16px
        rgba(109,93,252,.25);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.primary-btn:hover {
    box-shadow:
        0 8px 22px
        rgba(109,93,252,.35);
}

.primary-btn:active {
    transform: scale(.96);
}


/* =========================================================
   작업 공간
========================================================= */

.workspace {
    position: relative;
    flex: 1;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(109,93,252,.08),
            transparent 35%
        ),
        var(--app-bg);
}


/* =========================================================
   페이지 영역
========================================================= */

.page-area {
    position: absolute;
    inset: 0;

    overflow: auto;

    padding:
        38px
        70px
        150px;

    display: flex;
    justify-content: center;

    overscroll-behavior: contain;

    touch-action: none;
}


/* =========================================================
   종이
========================================================= */

.paper {
    position: relative;

    flex: 0 0 auto;

    width:
        min(920px, 92vw);

    height:
        max(
            1180px,
            calc(100vh - 150px)
        );

    background: var(--paper);

    border-radius: 5px;

    box-shadow: var(--shadow);

    overflow: hidden;

    transform-origin: center center;

    will-change: transform;
}


/* =========================================================
   줄 노트
========================================================= */

.paper.lines {
    background-color: var(--paper);

    background-image:
        linear-gradient(
            to bottom,
            transparent 31px,
            rgba(115,130,160,.13) 32px,
            transparent 33px
        );

    background-size: 100% 32px;
}


/* =========================================================
   격자
========================================================= */

.paper.grid {
    background-color: var(--paper);

    background-image:
        linear-gradient(
            rgba(110,125,155,.11) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(110,125,155,.11) 1px,
            transparent 1px
        );

    background-size: 28px 28px;
}


/* =========================================================
   캔버스
========================================================= */

canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    touch-action: none;

    cursor: crosshair;
}


/* =========================================================
   페이지 번호
========================================================= */

.page-number {
    position: absolute;

    bottom: 15px;
    left: 50%;

    transform: translateX(-50%);

    color: var(--muted);

    font-size: 10px;

    pointer-events: none;
}


/* =========================================================
   저장 상태
========================================================= */

.save-indicator {
    position: absolute;

    top: 17px;
    right: 20px;

    padding: 6px 10px;

    border-radius: 20px;

    background: var(--surface);

    border: 1px solid var(--line);

    color: var(--muted);

    font-size: 10px;

    backdrop-filter: blur(12px);

    z-index: 30;
}


/* =========================================================
   플로팅 툴바
========================================================= */

.floating-toolbar {
    position: absolute;

    left: 50%;
    bottom: 22px;

    transform: translateX(-50%);

    min-height: 64px;

    padding: 9px;

    display: flex;
    align-items: center;

    gap: 5px;

    background: var(--surface);

    border:
        1px solid
        rgba(255,255,255,.55);

    border-radius: 18px;

    box-shadow:
        0 14px 38px
        rgba(20,25,45,.16),

        0 2px 8px
        rgba(20,25,45,.07);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    z-index: 50;
}


/* =========================================================
   도구 버튼
========================================================= */

.tool-btn {
    position: relative;

    width: 46px;
    height: 46px;

    border: 0;
    border-radius: 13px;

    background: transparent;
    color: var(--text);

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition:
        background .16s ease,
        color .16s ease,
        transform .16s ease;
}

.tool-btn:hover {
    background: var(--app-bg);
}

.tool-btn:active {
    transform: scale(.91);
}

.tool-btn.active {
    color: var(--accent);
    background: var(--accent-light);
}

.tool-btn:disabled {
    opacity: .28;
    cursor: default;
}


/* =========================================================
   구분선
========================================================= */

.tool-divider {
    width: 1px;
    height: 30px;

    background: var(--line);

    margin: 0 4px;
}


/* =========================================================
   현재 색상
========================================================= */

.current-color {
    width: 22px;
    height: 22px;

    border-radius: 50%;

    border:
        2px solid
        var(--paper);

    box-shadow:
        0 0 0 1px
        var(--line);

    pointer-events: none;
}


/* =========================================================
   설정 팝업
========================================================= */

.popover {
    position: absolute;

    bottom: 98px;
    left: 50%;

    transform:
        translateX(-50%)
        translateY(10px)
        scale(.96);

    width: 270px;

    padding: 17px;

    background: var(--surface);

    border: 1px solid var(--line);

    border-radius: 17px;

    box-shadow:
        0 18px 45px
        rgba(20,25,45,.16);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .18s ease,
        transform .18s ease;

    z-index: 60;
}

.popover.show {
    opacity: 1;

    pointer-events: auto;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1);
}

.popover-title {
    margin-bottom: 13px;

    font-size: 12px;

    font-weight: 700;

    color: var(--muted);
}


/* =========================================================
   굵기
========================================================= */

.range-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
}

.size-preview {
    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.size-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--text);
}


/* =========================================================
   색상
========================================================= */

.colors {
    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 9px;
}

.color-btn {
    width: 27px;
    height: 27px;

    border:
        2px solid transparent;

    border-radius: 50%;

    cursor: pointer;

    transition:
        transform .15s ease,
        border .15s ease;
}

.color-btn:hover {
    transform: scale(1.13);
}

.color-btn.active {
    border-color: var(--accent);

    box-shadow:
        0 0 0 2px var(--paper),
        0 0 0 3px var(--accent);
}


/* =========================================================
   용지 선택
========================================================= */

.paper-menu {
    display: flex;
    gap: 7px;
}

.paper-option {
    flex: 1;

    padding: 9px 5px;

    border:
        1px solid
        var(--line);

    border-radius: 9px;

    background: transparent;

    color: var(--text);

    cursor: pointer;

    font-size: 11px;
}

.paper-option.active {
    border-color: var(--accent);

    background: var(--accent-light);

    color: var(--accent);
}


/* =========================================================
   줌
========================================================= */

.zoom-control {
    position: absolute;

    left: 18px;
    bottom: 24px;

    display: flex;
    align-items: center;

    gap: 4px;

    padding: 6px;

    background: var(--surface);

    border:
        1px solid
        var(--line);

    border-radius: 14px;

    box-shadow:
        0 10px 25px
        rgba(20,25,45,.10);

    backdrop-filter: blur(18px);

    z-index: 40;
}

.zoom-btn {
    width: 34px;
    height: 34px;

    border: 0;
    border-radius: 9px;

    background: transparent;

    color: var(--text);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

.zoom-btn:hover {
    background: var(--app-bg);
}

.zoom-value {
    min-width: 50px;

    text-align: center;

    font-size: 11px;

    color: var(--muted);

    user-select: none;
}


/* =========================================================
   토스트
========================================================= */

.toast {
    position: absolute;

    left: 50%;
    bottom: 105px;

    transform:
        translate(-50%, 10px);

    padding:
        9px 15px;

    border-radius: 10px;

    background: #1e2026;

    color: white;

    font-size: 12px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .2s ease,
        transform .2s ease;

    z-index: 100;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* =========================================================
   태블릿
========================================================= */

@media (max-width: 800px) {

    .header {
        height: 58px;
        padding: 0 10px;
    }

    .brand {
        min-width: auto;
    }

    .brand-text {
        display: none;
    }

    .logo {
        width: 34px;
        height: 34px;
    }

    .header-center {
        justify-content: flex-start;
        padding-left: 10px;
    }

    .header-actions {
        min-width: auto;
    }

    .header-actions .text-label {
        display: none;
    }

    .primary-btn {
        width: 40px;
        padding: 0;
    }

    .page-area {
        padding:
            15px
            15px
            125px;
    }

    .paper {
        width: 100%;
        min-width: 100%;

        height:
            calc(100vh - 115px);

        border-radius: 4px;
    }

    .floating-toolbar {
        bottom: 12px;

        max-width:
            calc(100vw - 18px);

        overflow-x: auto;

        border-radius: 17px;
    }

    .tool-btn {
        flex: 0 0 44px;
    }

    .tool-divider {
        flex: 0 0 1px;
    }

    .popover {
        bottom: 87px;
    }

    .zoom-control {
        left: 10px;
        bottom: 82px;
    }
}


/* =========================================================
   스마트폰
========================================================= */

@media (max-width: 500px) {

    .header-center {
        display: none;
    }

    .page-area {
        padding:
            7px
            7px
            115px;
    }

    .paper {
        min-height: 900px;
    }

    .floating-toolbar {
        gap: 2px;
        padding: 6px;
    }

    .tool-btn {
        width: 40px;
        height: 40px;

        flex-basis: 40px;
    }

    .popover {
        width: 250px;
    }
}

</style>
</head>


<body>

<div class="app">

<!-- =====================================================
     HEADER
====================================================== -->

<header class="header">

    <div class="brand">

        <div class="logo">

            <svg viewBox="0 0 24 24">
                <path
                    d="M12 20h9"/>
                <path
                    d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1
                       1-4 13.5-13.5Z"/>
                <path
                    d="M15 5l3 3"/>
            </svg>

        </div>

        <div class="brand-text">

            <strong>
                Paper Note
            </strong>

            <span>
                Digital handwriting
            </span>

        </div>

    </div>


    <div class="header-center">

        <div class="page-title">
            내 필기 노트
        </div>

    </div>


    <div class="header-actions">

        <!-- 다크 모드 -->

        <button
            class="icon-btn"
            onclick="toggleDark()"
            title="다크 모드">

            <svg viewBox="0 0 24 24">

                <path
                    d="M21 12.8A8.5 8.5 0 1 1 11.2 3
                       6.7 6.7 0 0 0 21 12.8Z"/>

            </svg>

        </button>


        <!-- 공유 -->

        <button
            class="icon-btn"
            onclick="shareNote()"
            title="공유">

            <svg viewBox="0 0 24 24">

                <path
                    d="M12 16V3"/>

                <path
                    d="M7 8l5-5 5 5"/>

                <path
                    d="M5 12v7a2 2 0 0 0 2 2h10
                       a2 2 0 0 0 2-2v-7"/>

            </svg>

        </button>


        <!-- 저장 -->

        <button
            class="primary-btn"
            onclick="saveNote()">

            <svg viewBox="0 0 24 24">

                <path
                    d="M5 20h14"/>

                <path
                    d="M12 4v11"/>

                <path
                    d="M7 10l5 5 5-5"/>

            </svg>

            <span class="text-label">
                저장
            </span>

        </button>

    </div>

</header>


<!-- =====================================================
     WORKSPACE
====================================================== -->

<main class="workspace">


    <div class="page-area">


        <div
            id="paper"
            class="paper lines">


            <canvas id="canvas">
            </canvas>


            <div class="page-number">
                1
            </div>


        </div>

    </div>


    <!-- 저장 상태 -->

    <div
        id="saveIndicator"
        class="save-indicator">

        자동 저장됨

    </div>


    <!-- =================================================
         펜 설정
    ================================================== -->

    <div
        id="popover"
        class="popover">


        <div class="popover-title">
            펜 굵기
        </div>


        <div class="range-row">

            <input
                id="sizeRange"
                type="range"
                min="1"
                max="15"
                value="4">


            <div class="size-preview">

                <div
                    id="sizeDot"
                    class="size-dot">
                </div>

            </div>

        </div>


        <div
            style="
                height:1px;
                background:var(--line);
                margin:18px 0;
            ">
        </div>


        <div class="popover-title">
            펜 색상
        </div>


        <div class="colors">

            <button
                class="color-btn active"
                style="background:#17181c"
                data-color="#17181c">
            </button>

            <button
                class="color-btn"
                style="background:#ef4444"
                data-color="#ef4444">
            </button>

            <button
                class="color-btn"
                style="background:#f97316"
                data-color="#f97316">
            </button>

            <button
                class="color-btn"
                style="background:#eab308"
                data-color="#eab308">
            </button>

            <button
                class="color-btn"
                style="background:#22c55e"
                data-color="#22c55e">
            </button>

            <button
                class="color-btn"
                style="background:#3b82f6"
                data-color="#3b82f6">
            </button>

            <button
                class="color-btn"
                style="background:#8b5cf6"
                data-color="#8b5cf6">
            </button>

            <button
                class="color-btn"
                style="background:#ec4899"
                data-color="#ec4899">
            </button>

            <button
                class="color-btn"
                style="background:#06b6d4"
                data-color="#06b6d4">
            </button>

            <button
                class="color-btn"
                style="background:#795548"
                data-color="#795548">
            </button>

            <button
                class="color-btn"
                style="background:#64748b"
                data-color="#64748b">
            </button>

            <button
                class="color-btn"
                style="
                    background:#ffffff;
                    border:1px solid #ddd
                "
                data-color="#ffffff">
            </button>

            <button
                class="color-btn"
                style="background:#000000"
                data-color="#000000">
            </button>

            <button
                class="color-btn"
                style="background:#14b8a6"
                data-color="#14b8a6">
            </button>

        </div>


        <div
            style="
                height:1px;
                background:var(--line);
                margin:18px 0;
            ">
        </div>


        <div class="popover-title">
            용지 스타일
        </div>


        <div class="paper-menu">

            <button
                class="paper-option active"
                data-paper="lines"
                onclick="setPaper('lines')">

                줄

            </button>

            <button
                class="paper-option"
                data-paper="grid"
                onclick="setPaper('grid')">

                격자

            </button>

            <button
                class="paper-option"
                data-paper="plain"
                onclick="setPaper('plain')">

                무지

            </button>

        </div>

    </div>


    <!-- =================================================
         줌
    ================================================== -->

    <div class="zoom-control">

        <button
            class="zoom-btn"
            onclick="zoomOut()"
            title="축소">

            <svg viewBox="0 0 24 24">

                <path
                    d="M5 12h14"/>

            </svg>

        </button>


        <div
            id="zoomValue"
            class="zoom-value">

            100%

        </div>


        <button
            class="zoom-btn"
            onclick="zoomIn()"
            title="확대">

            <svg viewBox="0 0 24 24">

                <path
                    d="M12 5v14"/>

                <path
                    d="M5 12h14"/>

            </svg>

        </button>


        <button
            class="zoom-btn"
            onclick="resetZoom()"
            title="원래 크기">

            <svg viewBox="0 0 24 24">

                <path
                    d="M4 12a8 8 0 1 0 2.3-5.6"/>

                <path
                    d="M4 5v5h5"/>

            </svg>

        </button>

    </div>


    <!-- =================================================
         하단 툴바
    ================================================== -->

    <div class="floating-toolbar">


        <!-- 펜 -->

        <button
            id="penTool"
            class="tool-btn active"
            onclick="setTool('pen')"
            title="펜">

            <svg viewBox="0 0 24 24">

                <path
                    d="M12 20h9"/>

                <path
                    d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1
                       1-4 13.5-13.5Z"/>

                <path
                    d="M15 5l3 3"/>

            </svg>

        </button>


        <!-- 색상 / 펜 설정 -->

        <button
            id="settingsTool"
            class="tool-btn"
            onclick="togglePopover()"
            title="펜 설정">

            <div
                id="currentColor"
                class="current-color"
                style="background:#17181c">
            </div>

        </button>


        <div class="tool-divider">
        </div>


        <!-- 지우개 -->

        <button
            id="eraserTool"
            class="tool-btn"
            onclick="setTool('eraser')"
            title="지우개">

            <svg viewBox="0 0 24 24">

                <path
                    d="M7 21h10"/>

                <path
                    d="M5.5 15.5L15 6a2.1 2.1 0 0 1 3 0l1.5 1.5
                       a2.1 2.1 0 0 1 0 3L10 20H6
                       a2 2 0 0 1-1.4-.6l-.1-.1
                       a2 2 0 0 1 0-2.8Z"/>

                <path
                    d="M13 8l4 4"/>

            </svg>

        </button>


        <!-- 실행 취소 -->

        <button
            id="undoTool"
            class="tool-btn"
            onclick="undo()"
            title="실행 취소">

            <svg viewBox="0 0 24 24">

                <path
                    d="M9 14L4 9l5-5"/>

                <path
                    d="M4 9h10a6 6 0 0 1 6 6v1"/>

            </svg>

        </button>


        <!-- 다시 실행 -->

        <button
            id="redoTool"
            class="tool-btn"
            onclick="redo()"
            title="다시 실행">

            <svg viewBox="0 0 24 24">

                <path
                    d="M15 14l5-5-5-5"/>

                <path
                    d="M20 9H10a6 6 0 0 0-6 6v1"/>

            </svg>

        </button>


        <div class="tool-divider">
        </div>


        <!-- 전체 삭제 -->

        <button
            class="tool-btn"
            onclick="clearCanvas()"
            title="전체 지우기">

            <svg viewBox="0 0 24 24">

                <path
                    d="M4 7h16"/>

                <path
                    d="M10 11v6"/>

                <path
                    d="M14 11v6"/>

                <path
                    d="M6 7l1 13h10l1-13"/>

                <path
                    d="M9 7V4h6v3"/>

            </svg>

        </button>


    </div>


    <!-- 토스트 -->

    <div
        id="toast"
        class="toast">
    </div>


</main>

</div>


<script>

/* =========================================================
   기본 상태
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const paper =
    document.getElementById("paper");

let drawing = false;

let tool = "pen";

let color = "#17181c";

let size = 4;

let lastX = 0;
let lastY = 0;

let undoStack = [];
let redoStack = [];

let saveTimer;


/* =========================================================
   줌
========================================================= */

let zoom = 1;

const MIN_ZOOM = 0.5;
const MAX_ZOOM = 4;

let panX = 0;
let panY = 0;


/* =========================================================
   터치
========================================================= */

let touches = new Map();

let pinchStartDistance = 0;
let pinchStartZoom = 1;

let pinchStartPanX = 0;
let pinchStartPanY = 0;

let pinchCenterX = 0;
let pinchCenterY = 0;


/* =========================================================
   캔버스 크기
========================================================= */

function resizeCanvas() {

    const rect =
        paper.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    let oldImage = null;

    if (
        canvas.width > 0 &&
        canvas.height > 0
    ) {
        oldImage =
            canvas.toDataURL("image/png");
    }

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    canvas.style.width =
        rect.width + "px";

    canvas.style.height =
        rect.height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    if (oldImage) {

        const img =
            new Image();

        img.onload = () => {

            ctx.drawImage(
                img,
                0,
                0,
                rect.width,
                rect.height
            );

        };

        img.src = oldImage;
    }
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   줌 적용
========================================================= */

function applyZoom() {

    paper.style.transform =
        `translate(${panX}px, ${panY}px)
         scale(${zoom})`;

    updateZoomText();
}


function updateZoomText() {

    document
        .getElementById("zoomValue")
        .textContent =
        Math.round(zoom * 100) + "%";
}


function zoomIn() {

    setZoom(
        zoom + 0.25
    );
}


function zoomOut() {

    setZoom(
        zoom - 0.25
    );
}


function resetZoom() {

    zoom = 1;

    panX = 0;
    panY = 0;

    applyZoom();

    showToast("100%");
}


function setZoom(value) {

    zoom =
        Math.max(
            MIN_ZOOM,
            Math.min(
                MAX_ZOOM,
                value
            )
        );

    applyZoom();
}


/* =========================================================
   터치 계산
========================================================= */

function getDistance(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


function getCenter(a, b) {

    return {
        x: (a.x + b.x) / 2,
        y: (a.y + b.y) / 2
    };
}


function getScreenPoint(e) {

    return {
        x: e.clientX,
        y: e.clientY
    };
}


/* =========================================================
   캔버스 좌표
========================================================= */

function getPoint(e) {

    const rect =
        canvas.getBoundingClientRect();

    return {
        x:
            (e.clientX - rect.left) / zoom,

        y:
            (e.clientY - rect.top) / zoom
    };
}


/* =========================================================
   POINTER DOWN
========================================================= */

canvas.addEventListener(
    "pointerdown",
    handlePointerDown
);


function handlePointerDown(e) {

    e.preventDefault();

    touches.set(
        e.pointerId,
        getScreenPoint(e)
    );

    try {
        canvas.setPointerCapture(
            e.pointerId
        );
    } catch (error) {}


    /* 두 손가락 */

    if (touches.size === 2) {

        drawing = false;

        const points =
            [...touches.values()];

        const a = points[0];
        const b = points[1];

        pinchStartDistance =
            getDistance(a, b);

        pinchStartZoom =
            zoom;

        const center =
            getCenter(a, b);

        pinchCenterX =
            center.x;

        pinchCenterY =
            center.y;

        pinchStartPanX =
            panX;

        pinchStartPanY =
            panY;

        return;
    }


    /* 손가락은 필기하지 않음 */

    if (e.pointerType === "touch") {
        return;
    }


    /* S펜 / 마우스 */

    startDrawing(e);
}


/* =========================================================
   POINTER MOVE
========================================================= */

canvas.addEventListener(
    "pointermove",
    handlePointerMove
);


function handlePointerMove(e) {

    e.preventDefault();

    if (
        touches.has(e.pointerId)
    ) {

        touches.set(
            e.pointerId,
            getScreenPoint(e)
        );
    }


    /* 두 손가락 줌 + 이동 */

    if (touches.size >= 2) {

        drawing = false;

        const points =
            [...touches.values()];

        const a = points[0];
        const b = points[1];

        const distance =
            getDistance(a, b);

        if (pinchStartDistance <= 0) {
            return;
        }

        let newZoom =
            pinchStartZoom *
            (
                distance /
                pinchStartDistance
            );

        newZoom =
            Math.max(
                MIN_ZOOM,
                Math.min(
                    MAX_ZOOM,
                    newZoom
                )
            );

        const center =
            getCenter(a, b);

        const moveX =
            center.x -
            pinchCenterX;

        const moveY =
            center.y -
            pinchCenterY;

        const zoomRatio =
            newZoom /
            pinchStartZoom;

        panX =
            pinchStartPanX +
            moveX -
            (
                pinchCenterX -
                window.innerWidth / 2
            ) *
            (
                zoomRatio - 1
            );

        panY =
            pinchStartPanY +
            moveY -
            (
                pinchCenterY -
                window.innerHeight / 2
            ) *
            (
                zoomRatio - 1
            );

        zoom = newZoom;

        applyZoom();

        return;
    }


    /* 일반 필기 */

    if (
        drawing &&
        e.pointerType !== "touch"
    ) {

        draw(e);
    }
}


/* =========================================================
   POINTER UP
========================================================= */

canvas.addEventListener(
    "pointerup",
    handlePointerUp
);

canvas.addEventListener(
    "pointercancel",
    handlePointerUp
);


function handlePointerUp(e) {

    touches.delete(
        e.pointerId
    );

    if (touches.size === 0) {

        if (drawing) {
            stopDrawing();
        }

        drawing = false;

        pinchStartDistance = 0;
    }
}


/* =========================================================
   필기 시작
========================================================= */

function startDrawing(e) {

    if (e.pointerType === "touch") {
        return;
    }

    drawing = true;

    const p =
        getPoint(e);

    lastX = p.x;
    lastY = p.y;

    saveState();

    drawPoint(
        p.x,
        p.y,
        e.pressure
    );
}


/* =========================================================
   필기
========================================================= */

function draw(e) {

    if (!drawing) {
        return;
    }

    if (e.pointerType === "touch") {
        return;
    }

    const p =
        getPoint(e);

    const pressure =
        e.pressure > 0
            ? e.pressure
            : 0.5;

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (tool === "pen") {

        ctx.globalCompositeOperation =
            "source-over";

        ctx.strokeStyle =
            color;

        ctx.lineWidth =
            Math.max(
                0.8,
                size *
                (
                    0.55 +
                    pressure
                )
            );

    } else {

        ctx.globalCompositeOperation =
            "destination-out";

        ctx.lineWidth =
            Math.max(
                15,
                size * 4
            );
    }

    ctx.beginPath();

    ctx.moveTo(
        lastX,
        lastY
    );

    ctx.lineTo(
        p.x,
        p.y
    );

    ctx.stroke();

    lastX = p.x;
    lastY = p.y;

    ctx.globalCompositeOperation =
        "source-over";

    scheduleSave();
}


/* =========================================================
   점
========================================================= */

function drawPoint(
    x,
    y,
    pressure
) {

    ctx.beginPath();

    if (tool === "eraser") {

        ctx.globalCompositeOperation =
            "destination-out";

        ctx.arc(
            x,
            y,
            Math.max(
                8,
                size * 2
            ),
            0,
            Math.PI * 2
        );

        ctx.fill();

    } else {

        ctx.globalCompositeOperation =
            "source-over";

        ctx.fillStyle =
            color;

        const p =
            pressure > 0
                ? pressure
                : 0.5;

        const radius =
            Math.max(
                0.5,
                size *
                (
                    0.55 +
                    p
                ) / 2
            );

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalCompositeOperation =
        "source-over";
}


/* =========================================================
   필기 종료
========================================================= */

function stopDrawing() {

    drawing = false;

    redoStack = [];

    updateHistoryButtons();

    scheduleSave();
}


/* =========================================================
   Undo 상태
========================================================= */

function saveState() {

    undoStack.push(
        canvas.toDataURL("image/png")
    );

    if (undoStack.length > 40) {
        undoStack.shift();
    }

    redoStack = [];

    updateHistoryButtons();
}


/* =========================================================
   Undo
========================================================= */

function undo() {

    if (undoStack.length === 0) {
        return;
    }

    redoStack.push(
        canvas.toDataURL("image/png")
    );

    const state =
        undoStack.pop();

    restoreImage(state);

    updateHistoryButtons();

    scheduleSave();
}


/* =========================================================
   Redo
========================================================= */

function redo() {

    if (redoStack.length === 0) {
        return;
    }

    undoStack.push(
        canvas.toDataURL("image/png")
    );

    const state =
        redoStack.pop();

    restoreImage(state);

    updateHistoryButtons();

    scheduleSave();
}


/* =========================================================
   이미지 복구
========================================================= */

function restoreImage(src) {

    const img =
        new Image();

    img.onload = () => {

        const rect =
            canvas.getBoundingClientRect();

        ctx.clearRect(
            0,
            0,
            rect.width,
            rect.height
        );

        ctx.drawImage(
            img,
            0,
            0,
            rect.width,
            rect.height
        );
    };

    img.src = src;
}


/* =========================================================
   Undo 버튼
========================================================= */

function updateHistoryButtons() {

    document
        .getElementById("undoTool")
        .disabled =
        undoStack.length === 0;

    document
        .getElementById("redoTool")
        .disabled =
        redoStack.length === 0;
}


/* =========================================================
   전체 삭제
========================================================= */

function clearCanvas() {

    if (
        !confirm(
            "이 페이지의 필기를 모두 지울까요?"
        )
    ) {
        return;
    }

    saveState();

    const rect =
        canvas.getBoundingClientRect();

    ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );

    redoStack = [];

    updateHistoryButtons();

    scheduleSave();

    showToast(
        "페이지를 지웠습니다"
    );
}


/* =========================================================
   자동 저장
========================================================= */

function scheduleSave() {

    const indicator =
        document.getElementById(
            "saveIndicator"
        );

    indicator.textContent =
        "저장 중...";

    clearTimeout(saveTimer);

    saveTimer =
        setTimeout(() => {

            localStorage.setItem(
                "paperNote",
                canvas.toDataURL("image/png")
            );

            localStorage.setItem(
                "paperNoteColor",
                color
            );

            localStorage.setItem(
                "paperNoteSize",
                size
            );

            indicator.textContent =
                "자동 저장됨";

        }, 450);
}


/* =========================================================
   내보내기 캔버스
========================================================= */

function createExportCanvas() {

    const out =
        document.createElement(
            "canvas"
        );

    out.width =
        canvas.width;

    out.height =
        canvas.height;

    const outCtx =
        out.getContext("2d");

    outCtx.fillStyle =
        "#ffffff";

    outCtx.fillRect(
        0,
        0,
        out.width,
        out.height
    );

    outCtx.drawImage(
        canvas,
        0,
        0
    );

    return out;
}


/* =========================================================
   PNG 저장
========================================================= */

function saveNote() {

    const out =
        createExportCanvas();

    const link =
        document.createElement(
            "a"
        );

    const date =
        new Date();

    link.download =
        "PaperNote_" +
        date.getFullYear() +
        "-" +
        String(
            date.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            date.getDate()
        ).padStart(2, "0") +
        ".png";

    link.href =
        out.toDataURL(
            "image/png"
        );

    link.click();

    showToast(
        "필기를 저장했습니다"
    );
}


/* =========================================================
   공유
========================================================= */

async function shareNote() {

    const out =
        createExportCanvas();

    out.toBlob(
        async blob => {

            if (!blob) {
                return;
            }

            const file =
                new File(
                    [blob],
                    "PaperNote.png",
                    {
                        type:
                            "image/png"
                    }
                );

            if (
                navigator.share &&
                (
                    !navigator.canShare ||
                    navigator.canShare({
                        files: [file]
                    })
                )
            ) {

                try {

                    await navigator.share({

                        title:
                            "Paper Note",

                        text:
                            "필기 메모",

                        files:
                            [file]

                    });

                    showToast(
                        "공유했습니다"
                    );

                    return;

                } catch (error) {

                    if (
                        error.name ===
                        "AbortError"
                    ) {
                        return;
                    }
                }
            }

            const link =
                document.createElement(
                    "a"
                );

            link.download =
                "PaperNote.png";

            link.href =
                URL.createObjectURL(
                    blob
                );

            link.click();

            setTimeout(() => {
                URL.revokeObjectURL(
                    link.href
                );
            }, 1000);

            showToast(
                "PNG로 저장했습니다"
            );

        },
        "image/png"
    );
}


/* =========================================================
   도구
========================================================= */

function setTool(value) {

    tool = value;

    document
        .getElementById("penTool")
        .classList.toggle(
            "active",
            value === "pen"
        );

    document
        .getElementById("eraserTool")
        .classList.toggle(
            "active",
            value === "eraser"
        );

    canvas.style.cursor =
        value === "pen"
            ? "crosshair"
            : "cell";

    closePopover();
}


/* =========================================================
   팝업
========================================================= */

function togglePopover() {

    document
        .getElementById("popover")
        .classList.toggle(
            "show"
        );
}


function closePopover() {

    document
        .getElementById("popover")
        .classList.remove(
            "show"
        );
}


/* =========================================================
   펜 굵기
========================================================= */

document
    .getElementById("sizeRange")
    .addEventListener(
        "input",
        e => {

            size =
                Number(
                    e.target.value
                );

            const dot =
                document.getElementById(
                    "sizeDot"
                );

            const value =
                Math.min(
                    25,
                    Math.max(
                        3,
                        size * 1.6
                    )
                );

            dot.style.width =
                value + "px";

            dot.style.height =
                value + "px";

            setTool("pen");

            scheduleSave();
        }
    );


/* =========================================================
   색상
========================================================= */

document
    .querySelectorAll(".color-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                color =
                    button.dataset.color;

                document
                    .getElementById(
                        "currentColor"
                    )
                    .style.background =
                    color;

                document
                    .querySelectorAll(
                        ".color-btn"
                    )
                    .forEach(
                        b =>
                            b.classList
                                .remove(
                                    "active"
                                )
                    );

                button.classList.add(
                    "active"
                );

                setTool("pen");

                scheduleSave();
            }
        );
    });


/* =========================================================
   용지
========================================================= */

function setPaper(type) {

    paper.classList.remove(
        "lines",
        "grid"
    );

    if (type === "lines") {

        paper.classList.add(
            "lines"
        );
    }

    if (type === "grid") {

        paper.classList.add(
            "grid"
        );
    }

    document
        .querySelectorAll(
            ".paper-option"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.paper ===
                type
            );
        });
}


/* =========================================================
   다크 모드
========================================================= */

function toggleDark() {

    document.body.classList.toggle(
        "dark"
    );

    localStorage.setItem(
        "paperNoteDark",
        document.body.classList.contains(
            "dark"
        )
    );
}


if (
    localStorage.getItem(
        "paperNoteDark"
    ) === "true"
) {

    document.body.classList.add(
        "dark"
    );
}


/* =========================================================
   저장된 노트
========================================================= */

function loadNote() {

    const saved =
        localStorage.getItem(
            "paperNote"
        );

    if (saved) {

        const img =
            new Image();

        img.onload = () => {

            const rect =
                canvas.getBoundingClientRect();

            ctx.clearRect(
                0,
                0,
                rect.width,
                rect.height
            );

            ctx.drawImage(
                img,
                0,
                0,
                rect.width,
                rect.height
            );
        };

        img.src = saved;
    }


    const savedColor =
        localStorage.getItem(
            "paperNoteColor"
        );

    if (savedColor) {

        color =
            savedColor;

        document
            .getElementById(
                "currentColor"
            )
            .style.background =
            color;

        document
            .querySelectorAll(
                ".color-btn"
            )
            .forEach(button => {

                button.classList.toggle(
                    "active",
                    button.dataset.color ===
                    color
                );
            });
    }


    const savedSize =
        localStorage.getItem(
            "paperNoteSize"
        );

    if (savedSize) {

        size =
            Number(
                savedSize
            );

        document
            .getElementById(
                "sizeRange"
            )
            .value =
            size;

        const dot =
            document.getElementById(
                "sizeDot"
            );

        const value =
            Math.min(
                25,
                Math.max(
                    3,
                    size * 1.6
                )
            );

        dot.style.width =
            value + "px";

        dot.style.height =
            value + "px";
    }
}


/* =========================================================
   토스트
========================================================= */

let toastTimer;

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1500
        );
}


/* =========================================================
   팝업 외부 클릭
========================================================= */

document.addEventListener(
    "pointerdown",
    e => {

        const popover =
            document.getElementById(
                "popover"
            );

        const settings =
            document.getElementById(
                "settingsTool"
            );

        if (
            popover &&
            settings &&
            !popover.contains(
                e.target
            ) &&
            !settings.contains(
                e.target
            )
        ) {

            closePopover();
        }
    }
);


/* =========================================================
   키보드 단축키
========================================================= */

document.addEventListener(
    "keydown",
    e => {

        const command =
            e.ctrlKey ||
            e.metaKey;


        if (
            command &&
            e.key.toLowerCase() === "z"
        ) {

            e.preventDefault();

            if (e.shiftKey) {
                redo();
            } else {
                undo();
            }
        }


        if (
            command &&
            e.key.toLowerCase() === "y"
        ) {

            e.preventDefault();

            redo();
        }


        if (
            command &&
            e.key.toLowerCase() === "s"
        ) {

            e.preventDefault();

            saveNote();
        }
    }
);


/* =========================================================
   초기화
========================================================= */

setTimeout(() => {

    loadNote();

    updateHistoryButtons();

    applyZoom();

}, 100);

</script>

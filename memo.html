<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 메모장</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --border: #e5e7eb;
      --text: #202124;
      --subtext: #6b7280;
      --accent: #4f46e5;
      --hover: #f0f1f5;
      --danger: #ef4444;
    }

    body.dark {
      --bg: #18181b;
      --panel: #232326;
      --border: #3f3f46;
      --text: #f4f4f5;
      --subtext: #a1a1aa;
      --accent: #818cf8;
      --hover: #303036;
      --danger: #f87171;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* 사이드바 */
    .sidebar {
      width: 300px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 22px 18px 14px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .new-note {
      width: 100%;
      border: none;
      background: var(--accent);
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .new-note:hover {
      opacity: 0.9;
    }

    .search {
      margin: 4px 18px 12px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    .search:focus {
      border-color: var(--accent);
    }

    .note-list {
      overflow-y: auto;
      padding: 4px 10px 20px;
      flex: 1;
    }

    .note-item {
      padding: 13px 12px;
      margin-bottom: 4px;
      border-radius: 9px;
      cursor: pointer;
    }

    .note-item:hover {
      background: var(--hover);
    }

    .note-item.active {
      background: var(--accent);
      color: white;
    }

    .note-item-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 5px;
    }

    .note-item-preview {
      font-size: 12px;
      opacity: 0.7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item-date {
      font-size: 11px;
      opacity: 0.55;
      margin-top: 7px;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .count {
      color: var(--subtext);
      font-size: 12px;
    }

    .theme-btn {
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
      padding: 5px;
    }

    /* 편집 영역 */
    .editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .editor-header {
      height: 64px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
    }

    .save-status {
      font-size: 12px;
      color: var(--subtext);
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: var(--danger);
      cursor: pointer;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 7px;
    }

    .delete-btn:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .editor-content {
      flex: 1;
      overflow-y: auto;
      padding: 45px max(30px, 7vw);
    }

    .note-title {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .note-title::placeholder {
      color: var(--subtext);
      opacity: 0.5;
    }

    .note-body {
      width: 100%;
      min-height: calc(100vh - 180px);
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      line-height: 1.8;
      font-family: inherit;
    }

    .note-body::placeholder {
      color: var(--subtext);
      opacity: 0.6;
    }

    /* 빈 화면 */
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--subtext);
      background: var(--bg);
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .empty h2 {
      color: var(--text);
      margin: 0 0 8px;
    }

    .empty p {
      margin: 0;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 220px;
      }

      .editor-content {
        padding: 30px 20px;
      }

      .note-title {
        font-size: 26px;
      }
    }

    @media (max-width: 520px) {
      .sidebar {
        width: 100px;
      }

      .sidebar-header {
        padding: 15px 10px;
      }

      .title {
        font-size: 16px;
      }

      .new-note {
        padding: 10px 5px;
        font-size: 12px;
      }

      .search {
        margin: 4px 8px 10px;
        width: calc(100% - 16px);
      }

      .note-list {
        padding: 4px;
      }

      .note-item {
        padding: 10px 7px;
      }

      .note-item-preview,
      .note-item-date {
        display: none;
      }

      .sidebar-footer {
        padding: 10px;
      }

      .count {
        display: none;
      }

      .editor-header {
        padding: 0 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- 사이드바 -->
  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="title">📝 나의 메모장</div>

      <button class="new-note" onclick="createNote()">
        ＋ 새 메모
      </button>
    </div>

    <input
      type="text"
      id="search"
      class="search"
      placeholder="메모 검색..."
      oninput="renderNotes()"
    >

    <div id="noteList" class="note-list"></div>

    <div class="sidebar-footer">
      <span id="noteCount" class="count">0개의 메모</span>

      <button
        class="theme-btn"
        onclick="toggleDarkMode()"
        title="다크 모드"
      >
        🌙
      </button>
    </div>

  </aside>

  <!-- 편집 영역 -->
  <main id="main" class="empty">
    <div>
      <div class="empty-icon">🗒️</div>
      <h2>메모를 선택하세요</h2>
      <p>왼쪽에서 메모를 선택하거나 새 메모를 만들어보세요.</p>
    </div>
  </main>

</div>


<script>
  let notes = JSON.parse(localStorage.getItem("myNotes")) || [];
  let currentId = null;

  // 저장
  function saveNotes() {
    localStorage.setItem("myNotes", JSON.stringify(notes));
  }

  // ID 생성
  function generateId() {
    return Date.now() + Math.random().toString(16).slice(2);
  }

  // 새 메모
  function createNote() {
    const note = {
      id: generateId(),
      title: "새 메모",
      content: "",
      updatedAt: new Date().toISOString()
    };

    notes.unshift(note);
    currentId = note.id;

    saveNotes();
    renderNotes();
    renderEditor();

    setTimeout(() => {
      document.querySelector(".note-title")?.focus();
    }, 50);
  }

  // 메모 선택
  function selectNote(id) {
    currentId = id;
    renderNotes();
    renderEditor();
  }

  // 메모 목록 표시
  function renderNotes() {
    const list = document.getElementById("noteList");
    const keyword = document.getElementById("search").value.toLowerCase();

    const filtered = notes.filter(note =>
      note.title.toLowerCase().includes(keyword) ||
      note.content.toLowerCase().includes(keyword)
    );

    list.innerHTML = "";

    if (filtered.length === 0) {
      list.innerHTML = `
        <div style="
          padding: 25px 10px;
          text-align: center;
          color: var(--subtext);
          font-size: 12px;
        ">
          메모가 없습니다.
        </div>
      `;
    }

    filtered.forEach(note => {
      const item = document.createElement("div");

      item.className =
        "note-item" +
        (note.id === currentId ? " active" : "");

      const title =
        note.title.trim() || "제목 없음";

      const preview =
        note.content.trim() || "내용 없음";

      const date =
        formatDate(note.updatedAt);

      item.innerHTML = `
        <div class="note-item-title">
          ${escapeHTML(title)}
        </div>

        <div class="note-item-preview">
          ${escapeHTML(preview)}
        </div>

        <div class="note-item-date">
          ${date}
        </div>
      `;

      item.onclick = () => selectNote(note.id);

      list.appendChild(item);
    });

    document.getElementById("noteCount").textContent =
      `${notes.length}개의 메모`;
  }

  // 편집기 표시
  function renderEditor() {
    const main = document.getElementById("main");

    const note = notes.find(n => n.id === currentId);

    if (!note) {
      main.className = "empty";

      main.innerHTML = `
        <div>
          <div class="empty-icon">🗒️</div>
          <h2>메모를 선택하세요</h2>
          <p>왼쪽에서 메모를 선택하거나 새 메모를 만들어보세요.</p>
        </div>
      `;

      return;
    }

    main.className = "editor";

    main.innerHTML = `
      <div class="editor-header">

        <span id="saveStatus" class="save-status">
          저장됨
        </span>

        <button
          class="delete-btn"
          onclick="deleteCurrentNote()"
        >
          🗑 삭제
        </button>

      </div>

      <div class="editor-content">

        <input
          id="noteTitle"
          class="note-title"
          type="text"
          placeholder="제목"
          value="${escapeAttribute(note.title)}"
          oninput="updateTitle(this.value)"
        >

        <textarea
          id="noteBody"
          class="note-body"
          placeholder="여기에 메모를 입력하세요..."
          oninput="updateContent(this.value)"
        >${escapeHTML(note.content)}</textarea>

      </div>
    `;

    document.getElementById("noteBody").focus();
  }

  // 제목 수정
  function updateTitle(value) {
    const note = notes.find(n => n.id === currentId);

    if (!note) return;

    note.title = value;
    note.updatedAt = new Date().toISOString();

    saveNotes();
    renderNotes();
    showSaving();
  }

  // 내용 수정
  function updateContent(value) {
    const note = notes.find(n => n.id === currentId);

    if (!note) return;

    note.content = value;
    note.updatedAt = new Date().toISOString();

    saveNotes();
    renderNotes();
    showSaving();
  }

  // 저장 상태
  let saveTimer;

  function showSaving() {
    const status = document.getElementById("saveStatus");

    if (!status) return;

    status.textContent = "저장 중...";

    clearTimeout(saveTimer);

    saveTimer = setTimeout(() => {
      status.textContent = "자동 저장됨";
    }, 300);
  }

  // 현재 메모 삭제
  function deleteCurrentNote() {
    const note = notes.find(n => n.id === currentId);

    if (!note) return;

    const confirmed = confirm(
      `"${note.title || "제목 없음"}" 메모를 삭제할까요?`
    );

    if (!confirmed) return;

    notes = notes.filter(n => n.id !== currentId);

    currentId = notes.length
      ? notes[0].id
      : null;

    saveNotes();
    renderNotes();
    renderEditor();
  }

  // 날짜
  function formatDate(dateString) {
    const date = new Date(dateString);

    const now = new Date();

    const diff =
      Math.floor((now - date) / 1000);

    if (diff < 60) {
      return "방금 전";
    }

    if (diff < 3600) {
      return Math.floor(diff / 60) + "분 전";
    }

    if (diff < 86400) {
      return Math.floor(diff / 3600) + "시간 전";
    }

    return date.toLocaleDateString("ko-KR", {
      month: "short",
      day: "numeric"
    });
  }

  // HTML 보안 처리
  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function escapeAttribute(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // 다크 모드
  function toggleDarkMode() {
    document.body.classList.toggle("dark");

    localStorage.setItem(
      "darkMode",
      document.body.classList.contains("dark")
    );
  }

  // 초기화
  if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
  }

  renderNotes();

  // 저장된 메모가 있다면 첫 메모 선택
  if (notes.length > 0) {
    currentId = notes[0].id;
    renderNotes();
    renderEditor();
  }
</script>

</body>
</html>

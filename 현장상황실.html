<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🆘 무등산특수구조팀 산악사고 상황판</title>

<style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 100%;
      margin: 20px auto;
      padding: 0 15px;
      background: #f9f9f9;
      color: #333;
      box-sizing: border-box;
      text-align: center; /* 전체 가운데 정렬 */
    }

/* 암호 확인 전 본문 숨김 */
body:not(.password-verified):not(.link-expired) > :not(#passwordPanel):not(#expiredPanel) {
  visibility: hidden;
}
    
    h1 {
      color: #0078d7;
      font-size: 1.3rem;
      margin-bottom: 25px;
    }
    h2 {
      margin-top: 30px;
      color: #005a9e;
      font-size: 1.3rem;
    }
    .section {
      background: #fff;
      padding: 20px;
      margin-bottom: 25px;
      border-radius: 8px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
    button {
      display: inline-block;
      background-color: #0078d7;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease;
      margin-top: 12px;
    }
    button:hover {
      background-color: #005a9e;
    }
    /* 작은 화면 대응 */
    @media (max-width: 480px) {
      h1 {
        font-size: 1.3rem;
      }
      h2 {
        font-size: 1.1rem;
      }
      button {
        padding: 14px 25px;
        font-size: 1.1rem;
      }
    }

/* 암호 입력창 */
.password-panel {
  width: min(420px, calc(100% - 32px));
  max-width: 420px;
  padding: 26px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--surface);
  color: #20242a;
  box-shadow: 0 18px 60px #00000025;
}

.password-panel::backdrop {
  background: #111827cc;
  backdrop-filter: blur(3px);
}

.password-panel h2 {
  margin: 0 0 10px;
  color: #20242a;
  font-size: 22px;
  text-align: left;
}

.password-panel > p {
  color: var(--muted);
  line-height: 1.6;
  text-align: left;
}

/* 암호 입력과 확인 버튼 한 줄 배치 */
.password-input-row {
  display: flex;
  align-items: stretch;
  gap: 10px;
  width: 100%;
  margin-top: 20px;
}

.password-input-row input {
  flex: 1;
  width: 0;
  min-width: 0;
  height: 46px;
  padding: 0 12px;
  border: 1px solid #aeb5be;
  border-radius: 10px;
  background: #fff;
  color: #20242a;
  font: inherit;
}

.password-input-row .button {
  flex: 0 0 82px;
  width: 82px;
  height: 46px;
  padding: 0 12px;
  border: 0;
  border-radius: 10px;
  background: var(--primary);
  color: #fff;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}

#passwordStatus {
  min-height: 24px;
  margin: 8px 0 0;
  color: var(--primary);
  font-size: 14px;
  text-align: left;
}

.password-input-row input:focus-visible,
.password-input-row button:focus-visible {
  outline: 3px solid #1769aa;
  outline-offset: 3px;
}

    
  </style>
</head>
<body>

<!-- =========================================
     암호 입력창
========================================= -->
<dialog id="passwordPanel"
        class="password-panel"
        aria-labelledby="passwordHeading"
        aria-describedby="passwordDescription">

  <h2 id="passwordHeading">암호 입력</h2>

  <p id="passwordDescription">
    접속하려면 접속 암호를 입력하세요.
  </p>

  <form id="passwordForm">
    <div class="password-input-row">

      <input
        id="accessPassword"
        name="accessPassword"
        type="password"
        placeholder="접속 암호"
        autocomplete="current-password"
        maxlength="128"
        required
      >

      <button type="submit" class="button">
        확인
      </button>

    </div>

    <p id="passwordStatus"
       role="status"
       aria-live="polite"></p>
  </form>
</dialog>
  
  <h1>🆘 무등산특수구조팀 산악사고 상황판</h1>

  <div class="section">
    <h2>🚨 재난안전 스마트 플랫폼</h2>
    <button onclick="window.open('https://knps.vurix.kr/', '_blank', 'noopener')">바로가기</button>
    </div> 
  
  <div class="section">
    <h2>🖥️ 사고대응 상황판</h2>
    <button onclick="window.open('https://mudeung.github.io/rescue/callems1.html', '_blank', 'noopener')">바로가기</button>
    </div>    

  <div class="section">
    <h2>🚶 구조대원 위치</h2>
    <button onclick="window.open('https://mudeung.github.io/rescue/searchs.html', '_blank', 'noopener')">바로가기</button>
    </div> 
  
  <div class="section">
    <h2>🛰 사고위치 공유</h2>
    <button onclick="window.open('https://mudeung.github.io/rescue/share.html', '_blank', 'noopener')">바로가기</button>
    </div> 
  
  <div class="section">
    <h2>⌨️ 사고위치 접수</h2>
    <button onclick="window.open('https://mudeung.github.io/rescue/searchems.html', '_blank', 'noopener')">바로가기</button>
    </div> 

  <div class="section">
    <h2>🧭 위치좌표 변환</h2>
    <button onclick="window.open('https://mudeung.github.io/rescue/searchems.html', '_blank', 'noopener')">바로가기</button>
    </div> 

<div class="section">
    <h2>🗂️ 산악사고 현황판 등록자료</h2>
    <button onclick="window.open('https://docs.google.com/spreadsheets/d/e/2PACX-1vTzUKdkiavoahVnpB0jzL0eZFqI6MGS0NnqccMfZBp4NK1isQSEfCJv7tjKQySP6soFpqqYIsp9R86s/pubhtml', '_blank', 'noopener')">바로가기</button>
    </div>   

<div class="section">
    <h2>🗃️ 산악사고 구조·구급 등록자료</h2>
    <button onclick="window.open('https://docs.google.com/spreadsheets/d/e/2PACX-1vScqlp0V4YrLUXQVE_68JcxmE_7GiTUzk88I97BOUKPXZBt-cyeB99Qpo_pQUEGD39fPefBoim0RNLG/pubhtml', '_blank', 'noopener')">바로가기</button>
    </div> 
  
</div>

<script>
/* =========================================
   암호 확인
========================================= */
(function () {
  // 만료된 링크는 암호 확인 절차를 실행하지 않음
  if (window.MUDEUNG_LINK_EXPIRED) {
    return;
  }

  const PASSWORD = "knps";

  const panel = document.getElementById("passwordPanel");
  const form = document.getElementById("passwordForm");
  const input = document.getElementById("accessPassword");
  const status = document.getElementById("passwordStatus");

  // 암호창 표시
  panel.showModal();
  input.focus();

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    if (input.value === PASSWORD) {
      document.body.classList.add("password-verified");

      panel.close();
      input.value = "";
      status.textContent = "";
    } else {
      status.textContent = "암호가 올바르지 않습니다.";
      input.value = "";
      input.focus();
    }
  });

  // ESC로 암호창 닫기 방지
  panel.addEventListener("cancel", function (event) {
    event.preventDefault();
  });
})();

/* =========================================
   우클릭 및 단축키 방지
========================================= */
document.addEventListener("contextmenu", function (event) {
  event.preventDefault();
});

document.addEventListener("keydown", function (event) {
  const key = event.key.toLowerCase();

  if (
    event.key === "F12" ||
    (event.ctrlKey && ["u", "s"].includes(key)) ||
    (event.ctrlKey && event.shiftKey && ["i", "j", "c"].includes(key))
  ) {
    event.preventDefault();
  }
});
</script>
  
</body>
</html>

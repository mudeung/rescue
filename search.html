<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>카카오 지도 - 고급 원 예제</title>

<style>
    body { margin:0; }
    #map { width:100%; height:800px; }
</style>
</head>

<body>

<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<script>
    var container = document.getElementById('map');
    var options = {
        center: new kakao.maps.LatLng(35.123894, 127.006368),
        level: 6
    };
    var map = new kakao.maps.Map(container, options);

    // ✅ 원 데이터 (색상 + 이동할 URL 포함)
    var circleData = [
        {
            lat: 35.121375,
            lng: 126.002951,
            radius: 100,
            color: "#FF0000",
            name: "지점: 서석대",
            url: "detailA.html"
        },
        {
            lat: 35.117745,
            lng: 126.002452,
            radius: 100,
            color: "#0000FF",
            name: "지점: 입석대",
            url: "detailB.html"
        },
        {
            lat: 35.116332,
            lng: 126.998781,
            radius: 100,
            color: "#00AA00",
            name: "지점: 장불재",
            url: "detailC.html"
        },
         {
            lat: 35.123569,
            lng: 126.992515,
            radius: 100,
            color: "#00AA00",
            name: "지점: 중봉",
            url: "detailC.html"
        },
         {
            lat: 35.128551,
            lng: 126.992036,
            radius: 100,
            color: "#0000FF",
            name: "지점: 얼음바위",
            url: "detailB.html"
        },
        {
            lat: 35.136887,
            lng: 126.982181,
            radius: 100,
            color: "#0000FF",
            name: "지점: 늦재삼거리",
            url: "detailB.html"
        },
         {
            lat: 35.119332,
            lng: 126.984151,
            radius: 100,
            color: "#00AA00",
            name: "지점: 중머리재",
            url: "detailC.html"
        },
         {
            lat: 35.117793,
            lng: 126.980965,
            radius: 100,
            color: "#00AA00",
            name: "지점: 서인봉",
            url: "detailC.html"
        },
         {
            lat: 35.126629,
            lng: 126.971527,
            radius: 100,
            color: "#00AA00",
            name: "지점: 당산나무",
            url: "detailC.html"
        },
         {
            lat: 35.120852,
            lng: 126.969085,
            radius: 100,
            color: "#00AA00",
            name: "지점: 새인봉",
            url: "detailC.html"
        },
         {
            lat: 35.122018,
            lng: 126.967190,
            radius: 100,
            color: "#00AA00",
            name: "지점: 운소봉",
            url: "detailC.html"
        },
         {
            lat: 35.114734,
            lng: 126.981728,
            radius: 100,
            color: "#00AA00",
            name: "지점: 용추폭포",
            url: "detailC.html"
        },
         {
            lat: 35.131678,
            lng: 126.963844,
            radius: 100,
            color: "#00AA00",
            name: "지점: 증심교",
            url: "detailC.html"
        },
         {
            lat: 35.134329,
            lng: 126.973287,
            radius: 100,
            color: "#00AA00",
            name: "지점: 백운암터",
            url: "detailC.html"
        },
         {
            lat: 35.140141,
            lng: 126.993669,
            radius: 100,
            color: "#00AA00",
            name: "지점: 제철유적지",
            url: "detailC.html"
        },
         {
            lat: 35.144329,
            lng: 126.989264,
            radius: 100,
            color: "#00AA00",
            name: "지점: 원효광장",
            url: "detailC.html"
        },
    ];

    var bounds = new kakao.maps.LatLngBounds();

    circleData.forEach(function(data) {

        var position = new kakao.maps.LatLng(data.lat, data.lng);

        // 🔵 원 생성 (색상 다르게)
        var circle = new kakao.maps.Circle({
            center: position,
            radius: data.radius,
            strokeWeight: 2,
            strokeColor: data.color,
            strokeOpacity: 0.9,
            fillColor: data.color,
            fillOpacity: 0.4
        });

        circle.setMap(map);

        // 📍 마커 생성
        var marker = new kakao.maps.Marker({
            position: position,
            map: map,
            title: data.name
        });

        // 🖱 원 클릭 시 상세 페이지 이동
        kakao.maps.event.addListener(circle, 'click', function() {
            window.location.href = data.url;
        });

        // 🖱 마커 클릭 시 상세 페이지 이동
        kakao.maps.event.addListener(marker, 'click', function() {
            window.location.href = data.url;
        });

        bounds.extend(position);
    });

    // 📍 전체 영역 보기
    map.setBounds(bounds);

</script>

</body>
</html>

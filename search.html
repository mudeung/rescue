<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUDEUNGSAN RESCUE AI MAP v7 - KAKAO</title>

<style>
body { margin:0; background:#050b18; color:#00ff9d; font-family:monospace; }

header {
    background:#071a2f;
    padding:10px;
    text-align:center;
    font-weight:bold;
}

#map { height: calc(100vh - 120px); }

#panel {
    display:flex;
    gap:6px;
    padding:8px;
    background:#07101f;
}

input, button {
    padding:8px;
    border:1px solid #00ff9d;
    background:#001a14;
    color:#00ff9d;
}
button { cursor:pointer; }
</style>

<!-- Kakao Maps SDK -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

</head>

<body>

<header>🛰 MUDEUNGSAN TERRAIN AI SEARCH MAP (KAKAO)</header>

<div id="panel">
<input id="name" placeholder="UNIT ID">
<button onclick="start()">START</button>
<button onclick="sendSOS()">🚨 SOS</button>
<button onclick="stopTracking()">⛔ STOP</button>
<button onclick="goMyLocation()">📍 MY LOCATION</button>
</div>

<div id="map"></div>

<script>

// ================= API =================
const API_URL = "https://script.google.com/macros/s/AKfycbyiPxj65S0kt91fVwVKNPqbaIJNAzuRMKcR3X8k84OI6HgIZckqChCRqt9iDpCbppf0FA/exec";
                 
// ================= BASE =================
const BASE = new kakao.maps.LatLng(35.1239, 126.9883);

// ================= MAP =================
const mapContainer = document.getElementById('map');

const map = new kakao.maps.Map(mapContainer, {
    center: BASE,
    level: 4
});

// ================= STATE =================
let myName = "";
let lastPos = null;

let markers = {};
let overlays = {};

let watchId = null;
let intervalSend = null;
let intervalLoad = null;

let prevPos = {};
let lastSeen = {};

// ================= START =================
function start(){

    myName = document.getElementById("name").value;
    if(!myName) return alert("UNIT ID required");

    watchId = navigator.geolocation.watchPosition(pos=>{

        lastPos = {
            name: myName,
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            behavior: detectBehavior(pos),
            status: "normal"
        };

    }, err=>alert("GPS ERROR"), {
        enableHighAccuracy:true
    });

    intervalSend = setInterval(sendData, 6000);
    intervalLoad = setInterval(loadData, 5000);
}

// ================= STOP =================
function stopTracking(){

    if(watchId) navigator.geolocation.clearWatch(watchId);

    clearInterval(intervalSend);
    clearInterval(intervalLoad);

    alert("TRACKING STOPPED");
}

// ================= MY LOCATION =================
function goMyLocation(){

    if(!lastPos) return alert("No GPS data yet");

    map.setCenter(
        new kakao.maps.LatLng(lastPos.lat, lastPos.lng)
    );
}

// ================= SEND =================
function sendData(){

    if(!lastPos) return;

    fetch(API_URL,{
        method:"POST",
        body: JSON.stringify(lastPos)
    });
}

// ================= LOAD =================
function loadData(){

    fetch(API_URL)
    .then(res=>res.json())
    .then(data=>{

        const now = Date.now();

        data.forEach(p=>{

            lastSeen[p.name] = now;

            const pos = new kakao.maps.LatLng(p.lat, p.lng);

            // marker update
            if(markers[p.name]){
                markers[p.name].setPosition(pos);
            } else {

                const marker = new kakao.maps.Marker({
                    position: pos,
                    map: map
                });

                markers[p.name] = marker;
            }

            updateOverlay(p);
        });
    });
}

// ================= OVERLAY =================
function updateOverlay(p){

    const content = `
        <div style="
            color:#00ff9d;
            font-size:12px;
            text-align:center;
            font-weight:bold;
        ">
            ➡️<br>${p.name}
        </div>
    `;

    const position = new kakao.maps.LatLng(p.lat, p.lng);

    if(overlays[p.name]){
        overlays[p.name].setPosition(position);
    } else {
        overlays[p.name] = new kakao.maps.CustomOverlay({
            position,
            content,
            map
        });
    }
}

// ================= BEHAVIOR =================
function detectBehavior(pos){

    const speed = pos.coords.speed || 0;

    if(speed < 0.2) return "immobile";
    if(speed < 1) return "injured";
    if(speed < 3) return "confused";
    return "normal";
}

// ================= SOS =================
function sendSOS(){

    if(!lastPos) return;

    lastPos.status = "SOS";

    fetch(API_URL,{
        method:"POST",
        body: JSON.stringify(lastPos)
    });

    alert("🚨 SOS SENT");
}

</script>

</body>
</html>

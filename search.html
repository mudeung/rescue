<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>무등산 특수산악구조팀 고/중/저 지대별 현장조사 자료</title>

<style>
    body{
        margin:0;
        font-family:Arial, sans-serif;
        background:#0f172a;   /* 세련된 다크블루 */
        color:#f1f5f9;
    }

    header{
        background:#1e3a8a;   /* 진한 블루 */
        padding:20px;
        text-align:center;
        font-size:22px;
        font-weight:bold;
        letter-spacing:1px;
        box-shadow:0 3px 10px rgba(0,0,0,0.4);
    }

    #map{
        width:100%;
        height:900px;
    }
</style>
</head>

<body>

<header>
무등산 특수산악구조팀 저/중/고지대 구조활동 지역 조사자료
</header>

<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424"></script>

<script>
var container = document.getElementById('map');
var options = {
    center: new kakao.maps.LatLng(35.124019, 126.008190),
    level: 6
};

var map = new kakao.maps.Map(container, options);

var circleData = [
    { lat:35.121000, lng:127.002681, radius:300, color:"#0000FF", name:"고지대-원효: 서석대" },
    { lat:35.117408, lng:127.002317, radius:300, color:"#0000FF", name:"고지대-원효: 입석대" },
    { lat:35.116332, lng:126.998781, radius:300, color:"#0000FF", name:"고지대-원효: 장불재" },
    { lat:35.122537, lng:126.992581, radius:300, color:"#0000FF", name:"고지대-원효: 중봉" },
    { lat:35.126846, lng:126.993461, radius:300, color:"#0000FF", name:"고지대-원효: 얼음바위" },
    { lat:35.119166, lng:126.994473, radius:300, color:"#0000FF", name:"고지대-원효: 용추삼거리" },
    
    { lat:35.136860, lng:126.981961, radius:300, color:"#FFFF00", name:"중지대-원효: 늦재삼거리" },
    { lat:35.131065, lng:126.977755, radius:300, color:"#FFFF00", name:"중지대-원효: 토끼등" },
    { lat:35.133099, lng:126.985547, radius:300, color:"#FFFF00", name:"중지대-원효: 동화사터" },
    { lat:35.123940, lng:126.982866, radius:300, color:"#FFFF00", name:"중지대-원효: 백운암터" },
    { lat:35.125883, lng:126.978439, radius:300, color:"#FFFF00", name:"중지재-원효: 봉황대" },
    { lat:35.138809, lng:126.986800, radius:300, color:"#FFFF00", name:"중지재-원효: 물통거리" },
    { lat:35.141982, lng:126.983762, radius:300, color:"#FFFF00", name:"중지대-원효: 늦재삼거리" },
    { lat:35.144595, lng:126.988845, radius:300, color:"#00AA00", name:"중지대-원효: 원효광장" },
    { lat:35.141437, lng:126.995007, radius:300, color:"#00AA00", name:"중지대-원효: 무등산장" },    
    { lat:35.147757, lng:126.985220, radius:300, color:"#00AA00", name:"중지대-원효: 원효사입구" },
    { lat:35.121645, lng:126.967070, radius:300, color:"#FFFF00", name:"중지대-증심: 운소봉" },
    { lat:35.114570, lng:126.987328, radius:300, color:"#FFFF00", name:"중지대-증심: 용추폭포 삼거리" },
    { lat:35.138202, lng:126.977384, radius:300, color:"#FFFF00", name:"중지대-증심: 바람재" },      
    { lat:35.119082, lng:126.984469, radius:300, color:"#FFFF00", name:"중지대-증심: 중머리재" },
    { lat:35.117489, lng:126.981037, radius:300, color:"#FFFF00", name:"중지대-증심: 서인봉" },
    { lat:35.125583, lng:126.972202, radius:300, color:"#FFFF00", name:"중지대-증심: 당산나무" },
    { lat:35.120585, lng:126.969019, radius:300, color:"#FFFF00", name:"중지대-증심: 새인봉" },
    { lat:35.119564, lng:126.972893, radius:300, color:"#00AA00", name:"중지대-증심: 새인봉갈림길" },
    
    { lat:35.116201, lng:126.970673, radius:300, color:"#00AA00", name:"저지대-증심: 선주암갈림길" },
    { lat:35.122200, lng:126.971525, radius:300, color:"#FFFF00", name:"저지대-증심: 약사사" },
    { lat:35.127789, lng:126.969612, radius:300, color:"#00AA00", name:"저지대-증심: 증심사입구" },
    { lat:35.132837, lng:126.969636, radius:300, color:"#00AA00", name:"저지대-증심: 덕산골" }, 
    { lat:35.131413, lng:126.963440, radius:300, color:"#00AA00", name:"저지대-증심: 증심교" },      
    { lat:35.099325, lng:126.964050, radius:300, color:"#00AA00", name:"저지대-증심: 제2수원지입구" },
    
    { lat:35.162281, lng:126.980286, radius:300, color:"#FFFFFF", name:"원효지구 지점: 원효분소" },
    { lat:35.131429, lng:126.948076, radius:300, color:"#FFFFFF", name:"증심지구 지점: 무등산사무소" },
    { lat:35.133163, lng:126.960296, radius:300, color:"#00AA00", name:"증심지구 지점: 증심센터" }
];

var bounds = new kakao.maps.LatLngBounds();
var infowindow = new kakao.maps.InfoWindow({ removable: true });

var selectedCircle = null;

circleData.forEach(function(data) {

    var position = new kakao.maps.LatLng(data.lat, data.lng);

    var circle = new kakao.maps.Circle({
        center: position,
        radius: data.radius,
        strokeWeight: 2,
        strokeColor: data.color,
        strokeOpacity: 0.9,
        fillColor: data.color,
        fillOpacity: 0.4,
        zIndex: 1
    });

    circle.setMap(map);

    var marker = new kakao.maps.Marker({
        position: position,
        map: map,
        title: data.name
    });

    function selectLocation() {

        // 이전 선택 복구
        if (selectedCircle) {
            selectedCircle.circle.setOptions({
                strokeColor: selectedCircle.originalColor,
                fillColor: selectedCircle.originalColor,
                fillOpacity: 0.4,
                strokeOpacity: 0.9,
                zIndex: 1
            });
        }

        // 현재 원 강조
        circle.setOptions({
            strokeColor: "#FFD700",
            fillColor: "#FFD700",
            fillOpacity: 0.6,
            strokeOpacity: 1,
            zIndex: 10
        });

        selectedCircle = {
            circle: circle,
            originalColor: data.color
        };

        map.setLevel(4);
        map.panTo(position);

        var content = `
            <div style="padding:8px;font-size:13px;color:#000;">
                <strong>${data.name}</strong><br>
                위도: ${data.lat}<br>
                경도: ${data.lng}
            </div>
        `;

        infowindow.setContent(content);
        infowindow.open(map, marker);
    }

    kakao.maps.event.addListener(marker, 'click', selectLocation);
    kakao.maps.event.addListener(circle, 'click', selectLocation);

    bounds.extend(position);
});

// 지도 빈 공간 클릭 시 선택 해제
kakao.maps.event.addListener(map, 'click', function() {

    if (selectedCircle) {
        selectedCircle.circle.setOptions({
            strokeColor: selectedCircle.originalColor,
            fillColor: selectedCircle.originalColor,
            fillOpacity: 0.4,
            strokeOpacity: 0.9,
            zIndex: 1
        });

        selectedCircle = null;
        infowindow.close();
    }
});

map.setBounds(bounds);

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESCUE AI MAP v10</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
    margin:0;
    background:#050b18;
    color:#00ff9d;
    font-family:monospace;
    overflow:hidden;
}

/* HEADER */
header{
    background:#071a2f;
    padding:10px;
    text-align:center;
    font-weight:bold;
    font-size:14px;
}

/* LAYOUT */
#container{
    display:flex;
    height:calc(100vh - 50px);
}

/* PANEL */
#panel{
    width:300px;
    background:#07101f;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow-y:auto;
}

/* MAP */
#map{
    flex:1;
}

/* INPUT */
input,button,select{
    padding:10px;
    border:1px solid #00ff9d;
    background:#001a14;
    color:#00ff9d;
    font-size:13px;
}

/* MOBILE OPTIMIZATION */
@media (max-width:768px){

    body{
        overflow:auto;
    }

    #container{
        flex-direction:column;
        height:100vh;
    }

    #panel{
        width:100%;
        flex-direction:row;
        flex-wrap:wrap;
        max-height:35vh;
    }

    #map{
        height:65vh;
    }

    input,button,select{
        flex:1;
        min-width:120px;
        font-size:12px;
    }
}

/* SMALL PHONE */
@media (max-width:420px){

    #panel{
        max-height:40vh;
    }

    input,button,select{
        min-width:100px;
        font-size:11px;
    }
}
</style>
</head>

<body>

<header>🛰 RESCUE AI MAP v10 (RESPONSIVE + DIRECTION TRACKING)</header>

<div id="container">

<div id="panel">

<input id="name" placeholder="UNIT ID">
<button id="startBtn" onclick="start()" disabled>START</button>

<button onclick="goMyLocation()">📍 MY LOCATION</button>
<button onclick="stopTracking()">⛔ STOP</button>
<button onclick="sendSOS()">🚨 SOS</button>
<button onclick="loadAllRecords()">📦 전체 기록</button>

<select id="nameFilter" onchange="filterByName()">
    <option value="ALL">👥 전체 보기</option>
</select>

</div>

<div id="map"></div>

</div>

<script>

// ================= API =================
const API_URL = "https://script.google.com/macros/s/AKfycbyiPxj65S0kt91fVwVKNPqbaIJNAzuRMKcR3X8k84OI6HgIZckqChCRqt9iDpCbppf0FA/exec";

// ================= MAP =================
const map = L.map('map').setView([35.1239, 126.9883], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; OpenStreetMap'
}).addTo(map);

// ================= STATE =================
let myName="";
let lastPos=null;
let watchId=null;
let intervalSend=null;
let intervalLoad=null;

let allData=[];
let markers={};
let polyline={};
let paths={};
let lastPosByUser={};

// ================= INPUT CONTROL =================
const nameInput=document.getElementById("name");
const startBtn=document.getElementById("startBtn");

nameInput.addEventListener("input",()=>{
    startBtn.disabled = nameInput.value.trim().length===0;
});

// ================= ID CHECK =================
async function checkDuplicateID(id){

    const res=await fetch(API_URL+"?checkId="+id);
    const data=await res.json();

    return data.exists;
}

// ================= ANGLE =================
function getAngle(prev,curr){

    const dy=curr.lat-prev.lat;
    const dx=curr.lng-prev.lng;

    return Math.atan2(dy,dx)*180/Math.PI;
}

// ================= START =================
async function start(){

    myName=nameInput.value.trim();
    if(!myName) return alert("UNIT ID required");

    const exists=await checkDuplicateID(myName);
    if(exists) return alert("이미 사용 중인 ID입니다");

    nameInput.disabled=true;
    startBtn.disabled=true;

    watchId=navigator.geolocation.watchPosition(pos=>{

        lastPos={
            name:myName,
            lat:pos.coords.latitude,
            lng:pos.coords.longitude,
            behavior:detectBehavior(pos),
            status:"normal"
        };

    });

    intervalSend=setInterval(sendData,5000);
    intervalLoad=setInterval(loadData,5000);
}

// ================= STOP =================
function stopTracking(){
    if(watchId) navigator.geolocation.clearWatch(watchId);
    clearInterval(intervalSend);
    clearInterval(intervalLoad);
}

// ================= MY LOCATION =================
function goMyLocation(){
    if(!lastPos) return;
    map.setView([lastPos.lat,lastPos.lng],16);
}

// ================= SEND =================
function sendData(){
    if(!lastPos) return;

    fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(lastPos)
    });
}

// ================= LOAD =================
function loadData(){

    fetch(API_URL)
    .then(r=>r.json())
    .then(data=>{

        allData=data;
        updateNameFilter(data);
        renderMap(data);
    });
}

// ================= FILTER =================
function updateNameFilter(data){

    const sel=document.getElementById("nameFilter");
    const names=[...new Set(data.map(p=>p.name))];

    sel.innerHTML=`<option value="ALL">👥 전체 보기</option>`;

    names.forEach(n=>{
        const opt=document.createElement("option");
        opt.value=n;
        opt.textContent="📍 "+n;
        sel.appendChild(opt);
    });
}

function filterByName(){

    const v=document.getElementById("nameFilter").value;

    if(v==="ALL") renderMap(allData);
    else renderMap(allData.filter(p=>p.name===v));
}

// ================= MAP =================
function renderMap(data){

    Object.values(markers).forEach(m=>map.removeLayer(m));
    Object.values(polyline).forEach(p=>map.removeLayer(p));

    markers={};
    polyline={};
    paths={};

    data.forEach(p=>{

        const key=p.name;
        const pos=[p.lat,p.lng];

        if(!paths[key]) paths[key]=[];
        paths[key].push(pos);

        // marker
        if(!markers[key]){
            markers[key]=L.marker(pos).addTo(map);
        }else{
            markers[key].setLatLng(pos);
        }

        // direction update
        if(lastPosByUser[key]){

            const angle=getAngle(lastPosByUser[key],{lat:p.lat,lng:p.lng});

            markers[key].setIcon(
                L.divIcon({
                    className:"unit-icon",
                    html:`
                        <div style="text-align:center;color:#00ff9d;">
                            <div style="transform:rotate(${angle}deg);font-size:18px;">
                                ➤
                            </div>
                            <div style="font-size:11px;font-weight:bold;">
                                ${p.name}
                            </div>
                        </div>
                    `
                })
            );
        }

        lastPosByUser[key]={lat:p.lat,lng:p.lng};

        drawPath(key);
    });
}

// ================= PATH =================
function drawPath(key){

    if(paths[key].length<2) return;

    if(polyline[key]) map.removeLayer(polyline[key]);

    polyline[key]=L.polyline(paths[key],{
        color:"#00ff9d",
        weight:3,
        opacity:0.8
    }).addTo(map);
}

// ================= SOS =================
function sendSOS(){

    if(!lastPos) return;

    lastPos.status="SOS";

    fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(lastPos)
    });

    alert("🚨 SOS SENT");
}

// ================= BEHAVIOR =================
function detectBehavior(pos){

    const speed=pos.coords.speed||0;

    if(speed<0.2) return "immobile";
    if(speed<1) return "injured";
    if(speed<3) return "confused";
    return "normal";
}

</script>

</body>
</html>

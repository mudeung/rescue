<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>무등산특수산악구조팀 고/중/저 지대별 현장조사 자료</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color: transparent;}
body{margin:0;font-family:Arial, sans-serif;background:#0f172a;color:#f1f5f9;overflow:hidden;}
header{background:#1e3a8a;padding:15px;text-align:center;font-size:18px;font-weight:bold;letter-spacing:1px;box-shadow:0 3px 10px rgba(0,0,0,0.4);}
#controls{position:absolute;top:70px;left:10px;z-index:1000;}
#controls{
    position:absolute;
    top:70px;
    left:10px;
    z-index:1000;
    display:flex;
    flex-direction:column;
    align-items:center;
}

#controls button{
    width:190px;
    height:42px;
    margin-bottom:8px;
    border:none;
    border-radius:8px;
    background:#1e40af;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}
#map{width:100%;height:calc(100vh - 60px);}
</style>
</head>
<body>

<header>무등산특수산악구조팀 고/중/저 지대별 현장조사 자료</header>

<div id="controls">
    <button onclick="toggleZone('high')">🔵 고지대 ON/OFF</button>
    <button onclick="toggleZone('middle')">🟡 중지대 ON/OFF</button>
    <button onclick="toggleZone('low')">🟢 저지대 ON/OFF</button>
    <button onclick="startRectangleMode()">⬜ 지도 사각형 표시</button>
    <button onclick="deleteLastRectangle()">⬜ 지도 사각형 삭제</button>
    <button onclick="loadRecords()">📥 기록 불러오기</button>
</div>

<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424"></script>

<script>
// ================= 지도 생성 =================
var map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(35.124019, 126.008190),
    level: 4
});

map.setZoomable(true);
map.setDraggable(true);

// ================= 지대 원 데이터 =================
var circleData = [
    { lat:35.121000, lng:127.002681, radius:300, color:"#0000FF", name:"고지대원효:서석대", zone:"high" },
    { lat:35.117408, lng:127.002317, radius:300, color:"#0000FF", name:"고지대원효:입석대", zone:"high" },
    { lat:35.116332, lng:126.998781, radius:300, color:"#0000FF", name:"고지대원효:장불재", zone:"high" },
    { lat:35.122537, lng:126.992581, radius:300, color:"#0000FF", name:"고지대원효:중봉", zone:"high" },
    { lat:35.126846, lng:126.993461, radius:300, color:"#0000FF", name:"고지대원효:얼음바위", zone:"high" },
    { lat:35.119166, lng:126.994473, radius:300, color:"#0000FF", name:"고지대원효:용추삼거리", zone:"high" },   
    { lat:35.136860, lng:126.981961, radius:300, color:"#FFFF00", name:"중지대원효:늦재삼거리", zone:"middle" },
    { lat:35.131065, lng:126.977755, radius:300, color:"#FFFF00", name:"중지대원효:토끼등", zone:"middle" },
    { lat:35.133099, lng:126.985547, radius:300, color:"#FFFF00", name:"중지대원효:동화사터", zone:"middle" },
    { lat:35.123940, lng:126.982866, radius:300, color:"#FFFF00", name:"중지대원효:백운암터", zone:"middle" },
    { lat:35.125883, lng:126.978439, radius:300, color:"#FFFF00", name:"중지대원효:봉황대", zone:"middle" },
    { lat:35.138809, lng:126.986800, radius:300, color:"#FFFF00", name:"중지대원효:물통거리", zone:"middle" },
    { lat:35.141982, lng:126.983762, radius:300, color:"#FFFF00", name:"중지대원효:늦재삼거리", zone:"middle" },
    { lat:35.144595, lng:126.988845, radius:300, color:"#FFFF00", name:"중지대원효:원효광장", zone:"middle" },
    { lat:35.141437, lng:126.995007, radius:300, color:"#FFFF00", name:"중지대원효:무등산장", zone:"middle" },    
    { lat:35.147757, lng:126.985220, radius:300, color:"#FFFF00", name:"중지대원효:원효사후문", zone:"middle" },
    { lat:35.121645, lng:126.967070, radius:300, color:"#FFFF00", name:"중지대증심:운소봉", zone:"middle" },
    { lat:35.114570, lng:126.987328, radius:300, color:"#FFFF00", name:"중지대증심:용추폭포삼거리", zone:"middle" },
    { lat:35.138202, lng:126.977384, radius:300, color:"#FFFF00", name:"중지대증심:바람재", zone:"middle" },      
    { lat:35.119082, lng:126.984469, radius:300, color:"#FFFF00", name:"중지대증심:중머리재", zone:"middle" },
    { lat:35.117489, lng:126.981037, radius:300, color:"#FFFF00", name:"중지대증심:서인봉", zone:"middle" },
    { lat:35.120585, lng:126.969019, radius:300, color:"#FFFF00", name:"중지대증심:새인봉", zone:"middle" },
    { lat:35.119564, lng:126.972893, radius:300, color:"#FFFF00", name:"중지대증심:새인봉갈림길", zone:"middle" },
    { lat:35.111009, lng:126.967922, radius:300, color:"#FFFF00", name:"중지대증심:마집봉", zone:"middle" },
    { lat:35.107561, lng:126.963588, radius:300, color:"#FFFF00", name:"중지대증심:탑봉", zone:"middle" },
    { lat:35.136684, lng:126.967882, radius:300, color:"#FFFF00", name:"중지대증심:장군봉", zone:"middle" },
    { lat:35.113241, lng:126.975947, radius:300, color:"#FFFF00", name:"중지대증심:선주암갈림길상단", zone:"middle" },
    { lat:35.116191, lng:126.970680, radius:300, color:"#00AA00", name:"저지대증심:선주암갈림길하단", zone:"low" },
    { lat:35.125583, lng:126.972202, radius:300, color:"#00AA00", name:"저지대증심:당산나무", zone:"low" },
    { lat:35.122200, lng:126.971525, radius:300, color:"#00AA00", name:"저지대증심:약사사", zone:"low" },
    { lat:35.127789, lng:126.969612, radius:300, color:"#00AA00", name:"저지대증심:증심사", zone:"low" },
    { lat:35.133364, lng:126.971471, radius:300, color:"#00AA00", name:"저지대증심:덕산골", zone:"low" }, 
    { lat:35.131413, lng:126.963440, radius:300, color:"#00AA00", name:"저지대증심:증심교", zone:"low"},      
    { lat:35.099325, lng:126.964050, radius:300, color:"#00AA00", name:"저지대증심:제2수원지", zone:"low" },    
    { lat:35.162281, lng:126.980286, radius:300, color:"#FFFFFF", name:"원효지구:원효분소", zone:"low" },
    { lat:35.131429, lng:126.948076, radius:300, color:"#FFFFFF", name:"증심지구:무등산사무소", zone:"low" },
    { lat:35.133163, lng:126.960296, radius:300, color:"#00AA00", name:"증심지구:증심센터", zone:"low" }
];

var circles = [];
var zoneVisibility = {high:true, middle:true, low:true};
var bounds = new kakao.maps.LatLngBounds();
var infowindow = new kakao.maps.InfoWindow({ removable: true });

circleData.forEach(function(data){
    var position = new kakao.maps.LatLng(data.lat, data.lng);

    var circle = new kakao.maps.Circle({
        center: position,
        radius: data.radius,
        strokeWeight: 2,
        strokeColor: data.color,
        strokeOpacity: 0.9,
        fillColor: data.color,
        fillOpacity: 0.4
    });

    circle.setMap(map);

    var marker = new kakao.maps.Marker({
        position: position,
        map: map,
        title: data.name
    });

    kakao.maps.event.addListener(marker, 'click', function(){
        infowindow.setContent(`<div style="padding:8px;color:#000;"><strong>${data.name}</strong></div>`);
        infowindow.open(map, marker);
    });

    circles.push({circle:circle, zone:data.zone});
    bounds.extend(position);
});

map.setBounds(bounds);

// ================= 지대 토글 =================
function toggleZone(zone){
    zoneVisibility[zone] = !zoneVisibility[zone];
    circles.forEach(function(item){
        if(item.zone === zone){
            item.circle.setMap(zoneVisibility[zone] ? map : null);
        }
    });
}

// ================= 사각형 기능 =================
var drawingMode = false;
var startPoint = null;
var rectangles = [];

function startRectangleMode(){
    alert("지도에서 시작점 클릭 → 끝점 클릭");
    drawingMode = true;
}

kakao.maps.event.addListener(map, 'click', function(mouseEvent){

    if(!drawingMode) return;

    if(!startPoint){
        startPoint = mouseEvent.latLng;
    }else{

        var endPoint = mouseEvent.latLng;

        var bounds = new kakao.maps.LatLngBounds(
            new kakao.maps.LatLng(
                Math.min(startPoint.getLat(), endPoint.getLat()),
                Math.min(startPoint.getLng(), endPoint.getLng())
            ),
            new kakao.maps.LatLng(
                Math.max(startPoint.getLat(), endPoint.getLat()),
                Math.max(startPoint.getLng(), endPoint.getLng())
            )
        );

        var rectangle = new kakao.maps.Rectangle({
            bounds: bounds,
            strokeWeight: 3,
            strokeColor: '#FF0000',
            strokeOpacity: 0.9,
            fillColor: '#FF0000',
            fillOpacity: 0.3
        });

        rectangle.setMap(map);
        rectangles.push(rectangle);

        startPoint = null;
        drawingMode = false;

        alert("사각형이 생성되었습니다.");
    }
});

// ================= 사각형 삭제 =================
function deleteLastRectangle(){
    if(rectangles.length === 0){
        alert("삭제할 사각형이 없습니다.");
        return;
    }

    let last = rectangles.pop();
    last.setMap(null);
    alert("마지막 사각형 삭제 완료");
}

function deleteAllRectangles(){
    if(rectangles.length === 0){
        alert("삭제할 사각형이 없습니다.");
        return;
    }

    rectangles.forEach(function(rect){
        rect.setMap(null);
    });

    rectangles = [];
    alert("모든 사각형 삭제 완료");
}

// ================= 기록 불러오기 =================
const WEB_APP_URL = "여기에_구글스크립트_URL";

var recordMarkers = [];

function loadRecords(){
    recordMarkers.forEach(m=>m.setMap(null));
    recordMarkers = [];

    fetch(WEB_APP_URL)
    .then(res=>res.json())
    .then(data=>{
        data.forEach(item=>{
            let pos = new kakao.maps.LatLng(item.lat,item.lng);
            let marker = new kakao.maps.Marker({map:map,position:pos});
            recordMarkers.push(marker);
        });
    })
    .catch(err=>{
        alert("기록 불러오기 실패");
    });
}

</script>
</body>
</html>

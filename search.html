<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>카카오 지도 - 고급 원 예제</title>

<style>
    body { margin:0; }
    #map { width:100%; height:800px; }
</style>
</head>

<body>

<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<script>
    var container = document.getElementById('map');
    var options = {
        center: new kakao.maps.LatLng(35.121375, 126.002951),
        level: 6
    };
    var map = new kakao.maps.Map(container, options);

    // ✅ 원 데이터 (색상 + 이동할 URL 포함)
    var circleData = [
        {
            lat: 35.121375,
            lng: 126.002951,
            radius: 100,
            color: "#FF0000",
            name: "지점: 서석대",
        },
        {
            lat: 35.117745,
            lng: 126.002452,
            radius: 100,
            color: "#0000FF",
            name: "지점: 입석대",
        },
        {
            lat: 35.116332,
            lng: 126.998781,
            radius: 100,
            color: "#00AA00",
            name: "지점: 장불재",
        },
         {
            lat: 35.122537,
            lng: 126.992581,
            radius: 100,
            color: "#00AA00",
            name: "지점: 중봉",
        },
         {
            lat: 35.126846,
            lng: 126.993461,
            radius: 100,
            color: "#0000FF",
            name: "지점: 얼음바위",
        },
        {
            lat: 35.136860,
            lng: 126.981961,
            radius: 100,
            color: "#0000FF",
            name: "지점: 늦재삼거리",
        },
         {
            lat: 35.119082,
            lng: 126.984469,
            radius: 100,
            color: "#00AA00",
            name: "지점: 중머리재",
        },
         {
            lat: 35.117489,
            lng: 126.981037,
            radius: 100,
            color: "#00AA00",
            name: "지점: 서인봉",
        },
         {
            lat: 35.125583,
            lng: 126.972202,
            radius: 100,
            color: "#00AA00",
            name: "지점: 당산나무",
        },
         {
            lat: 35.120585,
            lng: 126.969019,
            radius: 100,
            color: "#00AA00",
            name: "지점: 새인봉",
        },
         {
            lat: 35.121645,
            lng: 126.967070,
            radius: 100,
            color: "#00AA00",
            name: "지점: 운소봉",
        },
         {
            lat: 35.114556,
            lng: 126.987320,
            radius: 100,
            color: "#00AA00",
            name: "지점: 용추폭포 삼거리",
        },
        {
            lat: 35.127789,
            lng: 126.969612,
            radius: 100,
            color: "#00AA00",
            name: "지점: 증심사입구",
        },
         {
            lat: 35.131413,
            lng: 126.963440,
            radius: 100,
            color: "#00AA00",
            name: "지점: 증심교",
        },
         {
            lat: 35.131065,
            lng: 126.977755,
            radius: 100,
            color: "#00AA00",
            name: "지점: 토끼등",
        },
         {
            lat: 35.125883,
            lng: 126.978439,
            radius: 100,
            color: "#00AA00",
            name: "지점: 봉황대",
        },
         {
            lat: 35.133099,
            lng: 126.985547,
            radius: 100,
            color: "#00AA00",
            name: "지점: 동화사터",
        },
         {
            lat: 35.123940,
            lng: 126.982866,
            radius: 100,
            color: "#00AA00",
            name: "지점: 백운암터",
        },
         {
            lat: 35.139789,
            lng: 126.992923,
            radius: 100,
            color: "#00AA00",
            name: "지점: 제철유적지",
        },
         {
            lat: 35.144595,
            lng: 126.988845,
            radius: 100,
            color: "#00AA00",
            name: "지점: 원효광장",
        },
         {
            lat: 35.141437,
            lng: 126.995007,
            radius: 100,
            color: "#00AA00",
            name: "지점: 무등산장",        
        }
    ];

    var bounds = new kakao.maps.LatLngBounds();

    circleData.forEach(function(data) {

        var position = new kakao.maps.LatLng(data.lat, data.lng);

        // 🔵 원 생성 (색상 다르게)
        var circle = new kakao.maps.Circle({
            center: position,
            radius: data.radius,
            strokeWeight: 2,
            strokeColor: data.color,
            strokeOpacity: 0.9,
            fillColor: data.color,
            fillOpacity: 0.4
        });

        circle.setMap(map);

        // 📍 마커 생성
        var marker = new kakao.maps.Marker({
            position: position,
            map: map,
            title: data.name
        });

        // 🖱 원 클릭 시 상세 페이지 이동
        kakao.maps.event.addListener(circle, 'click', function() {
            window.location.href = data.url;
        });

        // 🖱 마커 클릭 시 상세 페이지 이동
        kakao.maps.event.addListener(marker, 'click', function() {
            window.location.href = data.url;
        });

        bounds.extend(position);
    });

    // 📍 전체 영역 보기
    map.setBounds(bounds);

</script>

</body>
</html>

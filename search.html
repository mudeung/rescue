<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>무등산 특수산악구조팀 고/중/저 지대별 현장조사 자료</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:#f1f5f9;
    overflow:hidden;
}

header{
    background:#1e3a8a;
    padding:15px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    letter-spacing:1px;
    box-shadow:0 3px 10px rgba(0,0,0,0.4);
}

#controls{
    position:absolute;
    top:70px;
    left:10px;
    z-index:1000;
}

#controls button{
    display:block;
    margin-bottom:8px;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    background:#1e40af;
    color:white;
    font-size:13px;
}

#map{
    width:100%;
    height:calc(100vh - 60px);
}
</style>
</head>

<body>

<header>
무등산 특수산악구조팀 저/중/고지대 구조활동 지역 조사자료
</header>

<div id="controls">
    <button onclick="startMeasure()">📏 측정 시작</button>
    <button onclick="stopMeasure()">⛔ 측정 종료</button>
    <button onclick="resetMeasure()">🔄 초기화</button>
</div>

<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424"></script>

<script>
var container = document.getElementById('map');
var options = {
    center: new kakao.maps.LatLng(35.124019, 126.008190),
    level: 6
};

var map = new kakao.maps.Map(container, options);
map.setZoomable(true);
map.setDraggable(true);

/* -------------------- 원형 데이터 -------------------- */

var circleData = [
    { lat:35.121000, lng:127.002681, radius:300, color:"#0000FF", name:"고지대-원효:서석대" },
    { lat:35.117408, lng:127.002317, radius:300, color:"#0000FF", name:"고지대-원효:입석대" },
    { lat:35.116332, lng:126.998781, radius:300, color:"#0000FF", name:"고지대-원효:장불재" },
    { lat:35.122537, lng:126.992581, radius:300, color:"#0000FF", name:"고지대-원효:중봉" }
];

var bounds = new kakao.maps.LatLngBounds();
var infowindow = new kakao.maps.InfoWindow({ removable: true });
var selectedCircle = null;

circleData.forEach(function(data) {

    var position = new kakao.maps.LatLng(data.lat, data.lng);

    // 원 생성
    var circle = new kakao.maps.Circle({
        center: position,
        radius: data.radius,
        strokeWeight: 2,
        strokeColor: data.color,
        strokeOpacity: 0.9,
        fillColor: data.color,
        fillOpacity: 0.4,
        clickable: true,  // 클릭 가능
        zIndex: 1          // 지도 위 다른 이벤트와 충돌 최소화
    });
    circle.setMap(map);

    // 마커 생성
    var marker = new kakao.maps.Marker({
        position: position,
        map: map,
        title: data.name
    });

    // 원/마커 클릭 시 강조 및 인포윈도우
    function selectLocation() {
        if(selectedCircle){
            selectedCircle.circle.setOptions({
                strokeColor: selectedCircle.originalColor,
                fillColor: selectedCircle.originalColor,
                fillOpacity: 0.4
            });
        }

        circle.setOptions({
            strokeColor: "#FFD700",
            fillColor: "#FFD700",
            fillOpacity: 0.6
        });

        selectedCircle = {
            circle: circle,
            originalColor: data.color
        };

        map.setLevel(4);
        map.panTo(position);

        var content = `<div style="padding:8px;font-size:13px;color:#000;">
            <strong>${data.name}</strong><br>
            위도: ${data.lat}<br>
            경도: ${data.lng}
        </div>`;
        infowindow.setContent(content);
        infowindow.open(map, marker);
    }

    kakao.maps.event.addListener(marker, 'click', selectLocation);
    kakao.maps.event.addListener(circle, 'click', selectLocation);

    bounds.extend(position);
});

map.setBounds(bounds);

/* -------------------- 거리측정 기능 -------------------- */

var drawingFlag = false;
var moveLine = null;
var clickLine = null;
var dots = [];

function startMeasure(){
    drawingFlag = true;
}

function stopMeasure(){
    drawingFlag = false;
    if(moveLine){
        moveLine.setMap(null);
        moveLine = null;
    }
}

function resetMeasure(){

    drawingFlag = false;

    if(clickLine){
        clickLine.setMap(null);
        clickLine = null;
    }

    if(moveLine){
        moveLine.setMap(null);
        moveLine = null;
    }

    dots.forEach(dot=>{
        dot.circle.setMap(null);
        dot.overlay.setMap(null);
    });

    dots = [];
}

kakao.maps.event.addListener(map, 'click', function(mouseEvent){

    if(!drawingFlag) return;

    var clickPosition = mouseEvent.latLng;

    if(!clickLine){
        clickLine = new kakao.maps.Polyline({
            map: map,
            path: [clickPosition],
            strokeWeight: 4,
            strokeColor: '#FF0000',
            strokeOpacity: 0.9
        });
    }else{
        var path = clickLine.getPath();
        path.push(clickPosition);
        clickLine.setPath(path);
    }

    addDot(clickPosition, clickLine.getLength());
});

kakao.maps.event.addListener(map, 'mousemove', function(mouseEvent){

    if(!drawingFlag || !clickLine) return;

    var mousePosition = mouseEvent.latLng;
    var path = clickLine.getPath();
    var movePath = [path[path.length-1], mousePosition];

    if(!moveLine){
        moveLine = new kakao.maps.Polyline({
            strokeWeight: 4,
            strokeColor: '#FF0000',
            strokeOpacity: 0.5,
            strokeStyle: 'dash'
        });
    }

    moveLine.setPath(movePath);
    moveLine.setMap(map);
});

function addDot(position, distance){

    var circle = new kakao.maps.Circle({
        center: position,
        radius: 3,
        strokeWeight: 2,
        strokeColor: '#FF0000',
        fillColor: '#FF0000',
        fillOpacity: 1
    });
    circle.setMap(map);

    var overlay = new kakao.maps.CustomOverlay({
        content: '<div style="background:#fff;padding:4px;font-size:12px;border-radius:4px;">총거리 : '+distance.toFixed(0)+'m</div>',
        position: position,
        yAnchor: 1
    });
    overlay.setMap(map);

    dots.push({circle:circle, overlay:overlay});
}
</script>

</body>
</html>

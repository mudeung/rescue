<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>무등산 구조활동 지도</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color: transparent;}
body{margin:0;font-family:Arial, sans-serif;background:#0f172a;color:#f1f5f9;overflow:hidden;}
header{background:#1e3a8a;padding:15px;text-align:center;font-size:18px;font-weight:bold;letter-spacing:1px;box-shadow:0 3px 10px rgba(0,0,0,0.4);}
#controls{position:absolute;top:70px;left:10px;z-index:1000;}
#controls button{display:block;margin-bottom:8px;padding:8px 12px;border:none;border-radius:6px;background:#1e40af;color:white;font-size:13px;cursor:pointer;}
#map{width:100%;height:100vh;}
</style>
</head>
<body>

<header>무등산 구조활동 지도</header>

<div id="controls">
    <button onclick="startMeasure()">📏 측정 시작</button>
    <button onclick="stopMeasure()">⛔ 측정 종료</button>
    <button onclick="resetMeasure()">🔄 초기화</button>
    <hr style="margin:5px 0;border:1px solid #555;">
    <button onclick="toggleZone('high')">🔵 고지대 ON/OFF</button>
    <button onclick="toggleZone('middle')">🟡 중지대 ON/OFF</button>
    <button onclick="toggleZone('low')">🟢 저지대 ON/OFF</button>
</div>

<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424"></script>
<script>
// 지도 초기화
var map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(35.124019, 126.008190),
    level: 6
});
map.setZoomable(true);
map.setDraggable(true);

// 구역 데이터 (zone 포함)
var circleData = [
    { lat:35.121000, lng:127.002681, name:"고지대-원효:서석대", zone:"high" },
    { lat:35.117408, lng:127.002317, name:"고지대-원효:입석대", zone:"high" },
    { lat:35.116332, lng:126.998781, name:"고지대-원효:장불재", zone:"high" },
    { lat:35.122537, lng:126.992581, name:"고지대-원효:중봉", zone:"high" },
    { lat:35.126846, lng:126.993461, name:"고지대-원효:얼음바위", zone:"high" },
    { lat:35.119166, lng:126.994473, name:"고지대-원효:용추삼거리", zone:"high" },   

    { lat:35.136860, lng:126.981961, name:"중지대-원효:늦재삼거리", zone:"middle" },
    { lat:35.131065, lng:126.977755, name:"중지대-원효:토끼등", zone:"middle" },
    { lat:35.133099, lng:126.985547, name:"중지대-원효:동화사터", zone:"middle" },
    { lat:35.123940, lng:126.982866, name:"중지대-원효:백운암터", zone:"middle" },
    { lat:35.125883, lng:126.978439, name:"중지대-원효:봉황대", zone:"middle" },

    { lat:35.144595, lng:126.988845, name:"저지대-원효:원효광장", zone:"low" },
    { lat:35.141437, lng:126.995007, name:"저지대-원효:무등산장", zone:"low" },    
    { lat:35.147757, lng:126.985220, name:"저지대-원효:원효사입구", zone:"low" },
    { lat:35.116201, lng:126.970673, name:"저지대-증심:선주암갈림길", zone:"low" },
    { lat:35.127789, lng:126.969612, name:"저지대-증심:증심사입구", zone:"low" },
    { lat:35.132837, lng:126.969636, name:"저지대-증심:덕산골", zone:"low" },
    { lat:35.131413, lng:126.963440, name:"저지대-증심:증심교", zone:"low" },      
    { lat:35.099325, lng:126.964050, name:"저지대-증심:제2수원지입구", zone:"low" }  
];

// 구역 토글 상태
var zoneVisibility = {high:true, middle:true, low:true};
var markers = [];
var infowindow = new kakao.maps.InfoWindow({ removable:true });

// 지도 범위 설정
var bounds = new kakao.maps.LatLngBounds();

// 마커 생성
circleData.forEach(function(data){
    var position = new kakao.maps.LatLng(data.lat, data.lng);

    // 색상별 핀 이미지
    var colorUrl = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png"; // 기본
    if(data.zone==="high") colorUrl="https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_blue.png";
    if(data.zone==="middle") colorUrl="https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_yellow.png";
    if(data.zone==="low") colorUrl="https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_green.png";

    var markerImage = new kakao.maps.MarkerImage(colorUrl, new kakao.maps.Size(24,35));

    var marker = new kakao.maps.Marker({
        position: position,
        map: map,
        title: data.name,
        image: markerImage
    });

    // 클릭 이벤트
    kakao.maps.event.addListener(marker, 'click', function(){
        infowindow.setContent(`<div style="padding:8px;font-size:13px;color:#000;"><strong>${data.name}</strong><br>위도:${data.lat}<br>경도:${data.lng}</div>`);
        infowindow.open(map, marker);
        map.setLevel(4);
        map.panTo(position);
    });

    markers.push({marker:marker, zone:data.zone});
    bounds.extend(position);
});

map.setBounds(bounds);

// 구역 토글
function toggleZone(zone){
    zoneVisibility[zone] = !zoneVisibility[zone];
    markers.forEach(function(item){
        if(item.zone === zone){
            item.marker.setMap(zoneVisibility[zone] ? map : null);
        }
    });
}

/* ---------------- 거리측정 ---------------- */
var drawingFlag = false;
var clickLine=null, moveLine=null, dots=[];

function startMeasure(){ drawingFlag=true; }
function stopMeasure(){ drawingFlag=false; if(moveLine){ moveLine.setMap(null); moveLine=null; } }
function resetMeasure(){
    drawingFlag=false;
    if(clickLine){ clickLine.setMap(null); clickLine=null; }
    if(moveLine){ moveLine.setMap(null); moveLine=null; }
    dots.forEach(dot=>{ dot.circle.setMap(null); dot.overlay.setMap(null); });
    dots=[];
}

kakao.maps.event.addListener(map,'click', function(mouseEvent){
    if(!drawingFlag) return;
    var clickPosition = mouseEvent.latLng;
    if(!clickLine){
        clickLine = new kakao.maps.Polyline({ map:map, path:[clickPosition], strokeWeight:4, strokeColor:'#FF0000', strokeOpacity:0.9 });
    }else{
        var path = clickLine.getPath();
        path.push(clickPosition);
        clickLine.setPath(path);
    }
    addDot(clickPosition, clickLine.getLength());
});

kakao.maps.event.addListener(map,'mousemove', function(mouseEvent){
    if(!drawingFlag || !clickLine) return;
    var mousePosition = mouseEvent.latLng;
    var path = clickLine.getPath();
    var movePath = [path[path.length-1], mousePosition];
    if(!moveLine){
        moveLine = new kakao.maps.Polyline({ strokeWeight:4, strokeColor:'#FF0000', strokeOpacity:0.5, strokeStyle:'dash' });
    }
    moveLine.setPath(movePath);
    moveLine.setMap(map);
});

function addDot(position, distance){
    var circle = new kakao.maps.Circle({center:position, radius:3, strokeWeight:2, strokeColor:'#FF0000', fillColor:'#FF0000', fillOpacity:1});
    circle.setMap(map);
    var overlay = new kakao.maps.CustomOverlay({ content:'<div style="background:#FF0000;padding:4px;font-size:12px;border-radius:4px;color:#fff;">총거리 : '+distance.toFixed(0)+'m</div>', position:position, yAnchor:1 });
    overlay.setMap(map);
    dots.push({circle:circle, overlay:overlay});
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESCUE AI MAP PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
    margin:0;
    background:#050b18;
    color:#00ff9d;
    font-family:monospace;
    overflow:hidden;
}

header{
    background:#071a2f;
    padding:10px;
    text-align:center;
    font-weight:bold;
}

#container{
    display:flex;
    height:calc(100vh - 50px);
}

#panel{
    width:300px;
    background:#07101f;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow-y:auto;
}

#map{ flex:1; }

input,button{
    padding:10px;
    border:1px solid #00ff9d;
    background:#001a14;
    color:#00ff9d;
}

button:disabled{ opacity:0.5; }

#logBox{
    font-size:12px;
    max-height:150px;
    overflow:auto;
    background:#000;
    padding:5px;
}
</style>
</head>

<body>

<header>🛰 RESCUE AI MAP PRO</header>

<div id="container">

<div id="panel">
<input id="name" placeholder="UNIT ID">
<button id="startBtn" onclick="start()" disabled>START</button>

<button onclick="goMyLocation()">📍 MY LOCATION</button>
<button onclick="stopTracking()">⛔ STOP</button>
<button onclick="sendSOS()">🚨 SOS</button>

<!-- 🔥 추가 -->
<button onclick="loadAllHistory()">📦 전체 기록 불러오기</button>

<div id="logBox"></div>

</div>

<div id="map"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec
const map = L.map('map').setView([35.1239, 126.9883], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; OpenStreetMap'
}).addTo(map);

let myName="";
let lastPos=null;
let watchId=null;
let intervalSend=null;
let intervalLoad=null;

const markers={};

const nameInput=document.getElementById("name");
const startBtn=document.getElementById("startBtn");
const logBox=document.getElementById("logBox");

nameInput.addEventListener("input",()=>{
    startBtn.disabled = nameInput.value.trim().length===0;
});

// ================= START =================
function start(){

    myName = nameInput.value.trim();
    if(!myName) return alert("UNIT ID required");

    nameInput.disabled=true;
    startBtn.disabled=true;

    watchId = navigator.geolocation.watchPosition(pos=>{

        lastPos={
            name:myName,
            lat:pos.coords.latitude,
            lng:pos.coords.longitude,
            status:"normal"
        };

    });

    intervalSend=setInterval(sendData,5000);
    intervalLoad=setInterval(loadData,3000);
}

// ================= SEND =================
function sendData(){
    if(!lastPos) return;

    fetch(API_URL,{
        method:"POST",
        headers:{ "Content-Type":"text/plain" },
        body:JSON.stringify(lastPos)
    });
}

// ================= LOAD (CURRENT) =================
function loadData(){
    fetch(API_URL + "?t=" + Date.now())
    .then(r=>r.json())
    .then(render);
}

// ================= 🚀 전체 기록 =================
function loadAllHistory(){

    fetch(API_URL + "?history=all&t=" + Date.now())
    .then(r=>r.json())
    .then(showHistory);
}

// ================= HISTORY VIEW =================
function showHistory(data){

    logBox.innerHTML = "";

    data.forEach(d=>{
        const div=document.createElement("div");
        div.textContent =
            `${d.time} | ${d.name} | ${d.lat},${d.lng} | ${d.status}`;
        logBox.appendChild(div);
    });

    alert("📦 전체 기록 로드 완료");
}

// ================= MAP =================
function render(data){

    for(const p of data){

        const key=p.name;
        const pos=[p.lat,p.lng];

        if(!markers[key]){
            markers[key]=L.marker(pos).addTo(map);
        }else{
            markers[key].setLatLng(pos);
        }
    }
}

// ================= SOS =================
function sendSOS(){

    if(!lastPos) return;

    lastPos.status="SOS";

    fetch(API_URL,{
        method:"POST",
        headers:{ "Content-Type":"text/plain" },
        body:JSON.stringify(lastPos)
    });

    alert("🚨 SOS SENT");
}

// ================= LOCATION =================
function goMyLocation(){
    if(!lastPos) return;
    map.setView([lastPos.lat,lastPos.lng],16);
}

function stopTracking(){
    if(watchId) navigator.geolocation.clearWatch(watchId);
    clearInterval(intervalSend);
    clearInterval(intervalLoad);
}

</script>
</body>
</html>

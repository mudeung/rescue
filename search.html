<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>카카오 지도 - 고급 원 예제</title>

<style>
    body { margin:0; }
    #map { width:100%; height:800px; }
</style>
</head>

<body>

<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_APP_KEY"></script>

<script>
    var container = document.getElementById('map');
    var options = {
        center: new kakao.maps.LatLng(35.12, 126.98),
        level: 6
    };
    var map = new kakao.maps.Map(container, options);

    // ✅ 원 데이터 (색상 + 이동할 URL 포함)
    var circleData = [
        {
            lat: 35.12120437,
            lng: 126.00035380,
            radius: 100,
            color: "#FF0000",
            name: "지점: 서석대",
            url: "detailA.html"
        },
        {
            lat: 35.11753131,
            lng: 126.99931712,
            radius: 100,
            color: "#0000FF",
            name: "지점: 입석대",
            url: "detailB.html"
        },
        {
            lat: 35.11608907,
            lng: 126.99641012,
            radius: 100,
            color: "#00AA00",
            name: "지점: 장불재",
            url: "detailC.html"
        },
         {
            lat: 35.12683224,
            lng: 126.98322217,
            radius: 100,
            color: "#0000FF",
            name: "지점: 얼음바위",
            url: "detailB.html"
        },
        {
            lat: 35.13604358,
            lng: 126.97935796,
            radius: 100,
            color: "#0000FF",
            name: "지점: 늦재삼거리",
            url: "detailB.html"
        }
    ];

    var bounds = new kakao.maps.LatLngBounds();

    circleData.forEach(function(data) {

        var position = new kakao.maps.LatLng(data.lat, data.lng);

        // 🔵 원 생성 (색상 다르게)
        var circle = new kakao.maps.Circle({
            center: position,
            radius: data.radius,
            strokeWeight: 2,
            strokeColor: data.color,
            strokeOpacity: 0.9,
            fillColor: data.color,
            fillOpacity: 0.4
        });

        circle.setMap(map);

        // 📍 마커 생성
        var marker = new kakao.maps.Marker({
            position: position,
            map: map,
            title: data.name
        });

        // 🖱 원 클릭 시 상세 페이지 이동
        kakao.maps.event.addListener(circle, 'click', function() {
            window.location.href = data.url;
        });

        // 🖱 마커 클릭 시 상세 페이지 이동
        kakao.maps.event.addListener(marker, 'click', function() {
            window.location.href = data.url;
        });

        bounds.extend(position);
    });

    // 📍 전체 영역 보기
    map.setBounds(bounds);

</script>

</body>
</html>

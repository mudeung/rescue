<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUDEUNGSAN RESCUE AI MAP v8 (Leaflet)</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
    margin:0;
    background:#050b18;
    color:#00ff9d;
    font-family:monospace;
    overflow:hidden;
}

/* HEADER */
header {
    background:#071a2f;
    padding:10px;
    text-align:center;
    font-weight:bold;
    font-size:14px;
}

/* LAYOUT */
#container {
    display:flex;
    height:calc(100vh - 50px);
}

/* PANEL */
#panel {
    width:280px;
    min-width:220px;
    background:#07101f;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow-y:auto;
}

/* MAP */
#map {
    flex:1;
}

/* INPUT */
input, button, select {
    padding:10px;
    border:1px solid #00ff9d;
    background:#001a14;
    color:#00ff9d;
    font-size:13px;
    cursor:pointer;
}

/* MOBILE */
@media (max-width:768px){
    #container{flex-direction:column;}
    #panel{width:100%; flex-direction:row; flex-wrap:wrap;}
    #map{height:60vh;}
}
</style>
</head>

<body>

<header>🛰 MUDEUNGSAN RESCUE AI SEARCH MAP (Leaflet)</header>

<div id="container">

<div id="panel">
    <input id="name" placeholder="UNIT ID">

    <button onclick="start()">START</button>
    <button onclick="goMyLocation()">📍 MY LOCATION</button>
    <button onclick="stopTracking()">⛔ STOP</button>
    <button onclick="sendSOS()">🚨 SOS</button>
    <button onclick="loadAllRecords()">📦 전체 기록</button>

    <select id="nameFilter" onchange="filterByName()">
        <option value="ALL">👥 전체 보기</option>
    </select>
</div>

<div id="map"></div>

</div>

<script>

// ================= API =================
const API_URL = "https://script.google.com/macros/s/AKfycbyiPxj65S0kt91fVwVKNPqbaIJNAzuRMKcR3X8k84OI6HgIZckqChCRqt9iDpCbppf0FA/exec";

// ================= MAP INIT (LEAFLET) =================
const map = L.map('map').setView([35.1239, 126.9883], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// ================= STATE =================
let myName = "";
let lastPos = null;

let watchId = null;
let intervalSend = null;
let intervalLoad = null;

let allData = [];

let markers = {};
let polyline = {};
let paths = {};

// ================= START =================
function start(){

    myName = document.getElementById("name").value;
    if(!myName) return alert("UNIT ID required");

    watchId = navigator.geolocation.watchPosition(pos=>{

        lastPos = {
            name: myName,
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            behavior: detectBehavior(pos),
            status: "normal"
        };

    }, err=>alert("GPS ERROR"), {
        enableHighAccuracy:true
    });

    intervalSend = setInterval(sendData, 5000);
    intervalLoad = setInterval(loadData, 5000);
}

// ================= STOP =================
function stopTracking(){

    if(watchId) navigator.geolocation.clearWatch(watchId);

    clearInterval(intervalSend);
    clearInterval(intervalLoad);

    alert("TRACKING STOPPED");
}

// ================= MY LOCATION =================
function goMyLocation(){

    if(!lastPos) return alert("No GPS data");

    map.setView([lastPos.lat, lastPos.lng], 16);
}

// ================= SEND =================
function sendData(){

    if(!lastPos) return;

    fetch(API_URL,{
        method:"POST",
        body: JSON.stringify(lastPos)
    });
}

// ================= LOAD =================
function loadData(){

    fetch(API_URL)
    .then(res=>res.json())
    .then(data=>{
        allData = data;
        updateNameFilter(data);
        renderMap(data);
    });
}

// ================= FULL LOAD =================
function loadAllRecords(){
    loadData();
}

// ================= FILTER =================
function updateNameFilter(data){

    const select = document.getElementById("nameFilter");
    const names = [...new Set(data.map(p=>p.name))];

    select.innerHTML = `<option value="ALL">👥 전체 보기</option>`;

    names.forEach(n=>{
        const opt = document.createElement("option");
        opt.value = n;
        opt.textContent = "📍 " + n;
        select.appendChild(opt);
    });
}

function filterByName(){

    const value = document.getElementById("nameFilter").value;

    if(value === "ALL") renderMap(allData);
    else renderMap(allData.filter(p=>p.name === value));
}

// ================= MAP RENDER =================
function renderMap(data){

    Object.values(markers).forEach(m => map.removeLayer(m));
    markers = {};

    Object.values(polyline).forEach(p => map.removeLayer(p));
    polyline = {};

    paths = {};

    data.forEach(p=>{

        const key = p.name;
        const pos = [p.lat, p.lng];

        if(!paths[key]) paths[key] = [];
        paths[key].push(pos);

        if(!markers[key]){
            markers[key] = L.marker(pos).addTo(map);
        } else {
            markers[key].setLatLng(pos);
        }

        drawPath(key);
    });
}

// ================= PATH =================
function drawPath(key){

    if(paths[key].length < 2) return;

    if(polyline[key]){
        map.removeLayer(polyline[key]);
    }

    polyline[key] = L.polyline(paths[key], {
        color: "#00ff9d",
        weight: 3,
        opacity: 0.8
    }).addTo(map);
}

// ================= SOS =================
function sendSOS(){

    if(!lastPos) return;

    lastPos.status = "SOS";

    fetch(API_URL,{
        method:"POST",
        body: JSON.stringify(lastPos)
    });

    alert("🚨 SOS SENT");
}

// ================= BEHAVIOR =================
function detectBehavior(pos){

    const speed = pos.coords.speed || 0;

    if(speed < 0.2) return "immobile";
    if(speed < 1) return "injured";
    if(speed < 3) return "confused";
    return "normal";
}

</script>

</body>
</html>

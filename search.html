<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>카카오 지도 - 선택 복구 기능</title>

<style>
    body { margin:0; }
    #map { width:100%; height:900px; }
</style>
</head>

<body>

<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424"></script>

<script>
var container = document.getElementById('map');
var options = {
    center: new kakao.maps.LatLng(35.124019, 126.008190),
    level: 6
};

var map = new kakao.maps.Map(container, options);

var circleData = [
    { lat:35.121000, lng:127.002681, radius:300, color:"#0000FF", name:"원효지구 지점: 서석대" },
    { lat:35.117408, lng:127.002317, radius:300, color:"#0000FF", name:"원효지구 지점: 입석대" },
    { lat:35.116332, lng:126.998781, radius:300, color:"#0000FF", name:"원효지구 지점: 장불재" },
    { lat:35.122537, lng:126.992581, radius:300, color:"#0000FF", name:"원효지구 지점: 중봉" },
    { lat:35.126846, lng:126.993461, radius:300, color:"#0000FF", name:"원효지구 지점: 얼음바위" },
    { lat:35.136860, lng:126.981961, radius:300, color:"#FFFF00", name:"원효지구 지점: 늦재삼거리" },
    { lat:35.131065, lng:126.977755, radius:300, color:"#00AA00", name:"원효지구 지점: 토끼등" },
    { lat:35.133099, lng:126.985547, radius:300, color:"#FFFF00", name:"원효지구 지점: 동화사터" },
        { lat:35.138809, lng:126.986800, radius:300, color:"#FFFF00", name:"원효지구 지점: 물통거리" },
    { lat:35.144595, lng:126.988845, radius:300, color:"#00AA00", name:"원효지구 지점: 원효광장" },
    { lat:35.141437, lng:126.995007, radius:300, color:"#00AA00", name:"원효지구 지점: 무등산장" },
    { lat:35.119082, lng:126.984469, radius:300, color:"#FFFF00", name:"원효지구 지점: 중머리재" },
    { lat:35.119166, lng:126.994473, radius:300, color:"#FFFF00", name:"원효지구 지점: 용추삼거리" },
    { lat:35.117489, lng:126.981037, radius:300, color:"#FFFF00", name:"원효지구 지점: 서인봉" },
    { lat:35.125583, lng:126.972202, radius:300, color:"#FFFF00", name:"원효지구 지점: 당산나무" },
    { lat:35.120585, lng:126.969019, radius:300, color:"#FFFF00", name:"원효지구 지점: 새인봉" },
    { lat:35.119564, lng:126.972893, radius:300, color:"#00AA00", name:"원효지구 지점: 새인봉갈림길" },
    { lat:35.116201, lng:126.970673, radius:300, color:"#00AA00", name:"원효지구 지점: 선주암갈림길" },
    { lat:35.121645, lng:126.967070, radius:300, color:"#FFFF00", name:"원효지구 지점: 운소봉" },
    { lat:35.114570, lng:126.987328, radius:300, color:"#FFFF00", name:"원효지구 지점: 용추폭포 삼거리" },
    { lat:35.127789, lng:126.969612, radius:300, color:"#00AA00", name:"원효지구 지점: 증심사입구" },
    { lat:35.131413, lng:126.963440, radius:300, color:"#00AA00", name:"원효지구 지점: 증심교" },    
    { lat:35.125883, lng:126.978439, radius:300, color:"#FFFF00", name:"지점: 봉황대" },    
    { lat:35.123940, lng:126.982866, radius:300, color:"#FFFF00", name:"지점: 백운암터" },
    { lat:35.099325, lng:126.964050, radius:300, color:"#00AA00", name:"지점: 제2수원지입구" },
    { lat:35.147757, lng:126.985220, radius:300, color:"#00AA00", name:"원효분소 지점: 원효사입구" },
    { lat:35.162281, lng:126.980286, radius:300, color:"#FFFFFF", name:"원효분소 지점: 원효분소" },
    { lat:35.131429, lng:126.948076, radius:300, color:"#FFFFFF", name:"지점: 무등산사무소" },
    { lat:35.133163, lng:126.960296, radius:300, color:"#00AA00", name:"지점: 증심센터" }
];

var bounds = new kakao.maps.LatLngBounds();
var circles = [];
var infowindow = new kakao.maps.InfoWindow({ removable: true });

var selectedCircle = null; // 현재 선택된 원 저장

circleData.forEach(function(data) {

    var position = new kakao.maps.LatLng(data.lat, data.lng);

    var circle = new kakao.maps.Circle({
        center: position,
        radius: data.radius,
        strokeWeight: 2,
        strokeColor: data.color,
        strokeOpacity: 0.9,
        fillColor: data.color,
        fillOpacity: 0.4
    });

    circle.setMap(map);

    var marker = new kakao.maps.Marker({
        position: position,
        map: map,
        title: data.name
    });

    circles.push({
        circle: circle,
        originalColor: data.color
    });

    function selectLocation() {

        // 🔹 이전 선택 복구
        if (selectedCircle) {
            selectedCircle.circle.setOptions({
                strokeColor: selectedCircle.originalColor,
                fillColor: selectedCircle.originalColor,
                fillOpacity: 0.4,
                strokeOpacity: 0.9
            });
        }

        // 🔹 현재 선택 강조
        circle.setOptions({
            strokeColor: "#FFD700",
            fillColor: "#FFD700",
            fillOpacity: 0.6,
            strokeOpacity: 1
        });

        selectedCircle = {
            circle: circle,
            originalColor: data.color
        };

        // 🔹 지도 이동
        map.setLevel(4);
        map.panTo(position);

        // 🔹 정보창 표시
        var content = `
            <div style="padding:8px;font-size:13px;">
                <strong>${data.name}</strong><br>
                위도: ${data.lat}<br>
                경도: ${data.lng}
            </div>
        `;

        infowindow.setContent(content);
        infowindow.open(map, marker);
    }

    kakao.maps.event.addListener(marker, 'click', selectLocation);
    kakao.maps.event.addListener(circle, 'click', selectLocation);

    bounds.extend(position);
});

// 🔹 지도 빈 공간 클릭 시 선택 해제
kakao.maps.event.addListener(map, 'click', function() {

    if (selectedCircle) {
        selectedCircle.circle.setOptions({
            strokeColor: selectedCircle.originalColor,
            fillColor: selectedCircle.originalColor,
            fillOpacity: 0.4,
            strokeOpacity: 0.9
        });

        selectedCircle = null;
        infowindow.close();
    }
});

map.setBounds(bounds);

</script>

</body>
</html>

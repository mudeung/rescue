<script>



// ================= API =================



const API_URL =

"https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";





// EMS API



const EMS_API =

"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";








// ================= DEVICE =================



let DEVICE_ID =

localStorage.getItem("DEVICE_ID");





if(!DEVICE_ID){



DEVICE_ID=

crypto.randomUUID();



localStorage.setItem(

"DEVICE_ID",

DEVICE_ID

);



}








// ================= MAP =================



const map =

L.map("map")

.setView(

[35.1239,126.9883],

13

);








// ================= TILE =================



const osm =

L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"

);




const topo =

L.tileLayer(

"https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png"

);





const satellite =

L.tileLayer(

"https://server.arcgis.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"

);






osm.addTo(map);







L.control.layers({



"🗺 일반지도":osm,


"⛰ 지형지도":topo,


"🛰 위성지도":satellite



})

.addTo(map);









// ================= DRAW =================



const drawnItems=

new L.FeatureGroup();



map.addLayer(

drawnItems

);






const drawControl=

new L.Control.Draw({


position:"topright",



draw:{


polygon:true,

rectangle:true,

circle:true,

marker:true,

polyline:true,

circlemarker:false


},



edit:{


featureGroup:drawnItems,


remove:true


}


});




map.addControl(drawControl);






map.on(

L.Draw.Event.CREATED,

function(e){


drawnItems.addLayer(

e.layer

);


}

);









// ================= LAYER =================



// 구조대 위치

const rescueLayer =

L.layerGroup()

.addTo(map);






// EMS 신고

const emsLayer =

L.layerGroup()

.addTo(map);







// SOS

const sosLayer =

L.layerGroup()

.addTo(map);







// 🚒 차량 출동 경로

const vehicleRouteLayer =

L.layerGroup()

.addTo(map);







// 🥾 산악 구조 경로

const mountainRouteLayer =

L.layerGroup()

.addTo(map);







// 기록

const historyMarkers =

L.layerGroup()

.addTo(map);




const historyLines =

L.layerGroup()

.addTo(map);








// ================= STATE =================



let myName="";


let lastPos=null;


let watchId=null;


let intervalSend=null;


let intervalLoad=null;


let intervalEMS=null;



let startTime="";


let endTime="";





// 구조대 마커 저장

const markers={};



// EMS 저장

const emsMarkers={};


const emsPulseMarkers={};



// 경로 저장

const vehicleRoutes={};


const mountainRoutes={};


const routeInfoMarkers={};


// ================= COLOR =================


const rescueColors={};


const colors=[


"#00ff9d",

"#00aaff",

"#ffcc00",

"#ff00ff",

"#ff6600",

"#ffffff"


];




function getColor(name){



if(!rescueColors[name]){



rescueColors[name]=

colors[

Object.keys(rescueColors).length

%

colors.length

];



}



return rescueColors[name];



}









// ================= INPUT =================



const nameInput=

document.getElementById("name");



const startBtn=

document.getElementById("startBtn");







nameInput.addEventListener(

"input",

()=>{


startBtn.disabled=

nameInput.value.trim().length===0;


}

);









// ================= TIME =================



function getNowTime(){



const now=new Date();



return (

now.getFullYear()

+

"-"

+

String(now.getMonth()+1).padStart(2,"0")

+

"-"

+

String(now.getDate()).padStart(2,"0")

+

" "

+

String(now.getHours()).padStart(2,"0")

+

":"

+

String(now.getMinutes()).padStart(2,"0")

+

":"

+

String(now.getSeconds()).padStart(2,"0")



);



}











// ================= START GPS =================



function start(){



myName=

nameInput.value.trim();





if(!myName){



alert(

"UNIT ID 입력"

);



return;


}





startTime=

getNowTime();



endTime="";





nameInput.disabled=true;


startBtn.disabled=true;







watchId=

navigator.geolocation.watchPosition(



(pos)=>{



lastPos={



name:myName,



device:DEVICE_ID,



lat:pos.coords.latitude,



lng:pos.coords.longitude,



status:"normal"



};




},




(err)=>{


console.log(err);


alert(

"GPS 권한 확인"

);



},



{


enableHighAccuracy:true,


maximumAge:1000,


timeout:10000



}



);








intervalSend=

setInterval(

sendData,

5000

);






intervalLoad=

setInterval(

loadLive,

3000

);



}











// ================= SEND GPS =================



function sendData(){



if(!lastPos)

return;






fetch(

API_URL,

{


method:"POST",



headers:{


"Content-Type":

"text/plain"


},



body:JSON.stringify({


...lastPos,


startTime:startTime,


endTime:endTime



})



}

);



}












// ================= LIVE LOAD =================



function loadLive(){



fetch(

API_URL

+

"?live=1&t="

+

Date.now()

)



.then(r=>r.json())

.then(renderLive)

.catch(console.log);



}











// ================= LIVE RENDER =================



function renderLive(data){



sosLayer.clearLayers();





data.forEach(p=>{



const lat=

Number(p.lat);



const lng=

Number(p.lng);






if(

!Number.isFinite(lat)

||

!Number.isFinite(lng)

)

return;






const key=p.name;



const pos=[lat,lng];









if(!markers[key]){



markers[key]=



L.circleMarker(

pos,

{


radius:10,


color:getColor(key),


fillColor:getColor(key),


fillOpacity:1,


weight:3



}



)



.bindTooltip(

p.name,

{


permanent:true,


direction:"top",


className:"name-label"



}



)



.addTo(rescueLayer);



}



else{



markers[key]

.setLatLng(pos);



}








// SOS 상태



if(p.status==="SOS"){



markers[key]

.setStyle({


radius:15,


color:"red",


fillColor:"red"



});





L.circle(

pos,

{


radius:60,


color:"red",


fillColor:"red",


fillOpacity:0.3



}



)

.addTo(sosLayer);



}



else{



markers[key]

.setStyle({


color:getColor(key),


fillColor:getColor(key)



});



}




});



}











// ================= MY LOCATION =================



function goMyLocation(){



if(!lastPos)

return;






map.setView(



[

lastPos.lat,

lastPos.lng

],



16



);



}











// ================= SOS =================



function sendSOS(){



if(!lastPos){



alert(

"현재 위치 없음"

);



return;



}







fetch(

API_URL,

{


method:"POST",



headers:{


"Content-Type":

"text/plain"


},



body:JSON.stringify({


...lastPos,


status:"SOS",


startTime:startTime,


endTime:endTime



})



}



);






alert(

"🚨 SOS 전송 완료"

);



}


// ================= EMS ICON =================


function getEMSIcon(status){


let color="red";


if(status==="출동")
color="orange";


if(status==="완료")
color="green";


if(status==="취소")
color="gray";




return L.divIcon({


className:"",



html:

`

<div style="

font-size:34px;

filter:drop-shadow(0 0 8px ${color});

">

🚑

</div>

`,


iconSize:[40,40]



});



}









// ================= 사고 유형 분류 =================



function getRescueMode(type){



type = type || "";





if(

type.includes("산")

||

type.includes("등산")

||

type.includes("조난")

||

type.includes("실종")

||

type.includes("계곡")



){



return "mountain";



}




return "vehicle";



}









// ================= EMS LOAD =================



function loadEMS(){



fetch(

EMS_API

+

"?t="

+

Date.now()

)



.then(r=>r.json())

.then(renderEMS)

.catch(console.log);



}












// ================= EMS RENDER =================



function renderEMS(data){



const active={};





data.forEach(item=>{





const lat=

Number(item.lat);



const lng=

Number(item.lng);







if(

!Number.isFinite(lat)

||

!Number.isFinite(lng)

)

return;






const key=item.id;



active[key]=true;






const pos=[lat,lng];








// ================= 🚑 신고 아이콘 =================



if(!emsMarkers[key]){



emsMarkers[key]=



L.marker(

pos,

{


icon:getEMSIcon(item.status)



}

)



.bindPopup(



`

<div style="font-family:monospace">


<b>🚑 119 신고</b>

<br><br>


📌 사고 :

${item.type}


<br><br>


📍 위치 :

${item.address}


<br><br>


📡 상태 :

${item.status}


<br><br>


⏰ 접수 :

${item.time}


<br><br>


🚨 출동방식 :

${

getRescueMode(item.type)

==="mountain"

?

"🥾 산악 구조"

:

"🚒 차량 출동"

}



<br><br>


<a href="${item.mapURL}"

target="_blank">

지도 열기

</a>



</div>



`

)



.addTo(emsLayer);



}



else{



emsMarkers[key]

.setLatLng(pos);



emsMarkers[key]

.setIcon(

getEMSIcon(item.status)

);



}









// ================= 빨간 펄스 =================



if(

item.status!=="완료"

&&

item.status!=="취소"

){



if(!emsPulseMarkers[key]){



emsPulseMarkers[key]=



L.marker(

pos,

{


icon:L.divIcon({


className:"",



html:

`

<div class="ems-pulse"></div>

`,



iconSize:[30,30]



}),



interactive:false



}



)

.addTo(emsLayer);



}



else{



emsPulseMarkers[key]

.setLatLng(pos);



}



}



else{



if(emsPulseMarkers[key]){



emsLayer.removeLayer(

emsPulseMarkers[key]

);



delete emsPulseMarkers[key];



}



}











// ================= 경로 분기 =================



const mode=

getRescueMode(item.type);






if(mode==="mountain"){



drawMountainRoute({


id:key,


lat:lat,


lng:lng,


type:item.type



});



}



else{



drawVehicleRoute({


id:key,


lat:lat,


lng:lng,


type:item.type



});



}






});









// 삭제된 신고 제거



Object.keys(emsMarkers)

.forEach(key=>{



if(!active[key]){



emsLayer.removeLayer(

emsMarkers[key]

);



delete emsMarkers[key];



}



});





}









// ================= EMS 자동 실행 =================



loadEMS();



intervalEMS=

setInterval(

loadEMS,

3000

);


// ================= OSRM 차량 길찾기 =================


// 무료 OSRM 서버

const OSRM_DRIVING =

"https://router.project-osrm.org/route/v1/driving/";









// ================= 도로 경로 요청 =================



function getDrivingRoute(


startLat,


startLng,


endLat,


endLng


){



return fetch(


OSRM_DRIVING

+

`${startLng},${startLat};${endLng},${endLat}`

+

"?overview=full&geometries=geojson"



)



.then(r=>r.json())



.then(data=>{



if(

!data.routes

||

!data.routes.length

)

return null;






const route=

data.routes[0];





return {


distance:

route.distance,



duration:

route.duration,



geometry:

route.geometry.coordinates



};



})



.catch(err=>{


console.log(

"OSRM ERROR",

err

);


return null;


});



}











// ================= 가까운 구조대 검색 =================



function findNearestRescue(ems){



let nearest=null;


let min=Infinity;






Object.keys(markers)

.forEach(name=>{





const pos=

markers[name].getLatLng();






const distance=

Math.sqrt(


Math.pow(

pos.lat-ems.lat,

2

)

+

Math.pow(

pos.lng-ems.lng,

2

)



);







if(distance<min){



min=distance;



nearest={



name:name,


lat:pos.lat,


lng:pos.lng



};



}




});







return nearest;



}











// ================= 차량 출동 =================



function drawVehicleRoute(ems){



vehicleRouteLayer.clearLayers();






const rescue=

findNearestRescue(ems);






if(!rescue)

return;








getDrivingRoute(



ems.lat,


ems.lng,


rescue.lat,


rescue.lng



)



.then(route=>{



if(!route)

return;








const path=[];





route.geometry.forEach(p=>{



path.push([


p[1],


p[0]


]);



});










// ================= 빨간 차량 경로 =================



L.polyline(

path,

{


color:"red",


weight:7,


opacity:0.9,


dashArray:"15,10"



}



)

.addTo(vehicleRouteLayer);










// ================= 거리 =================



const km=



(

route.distance

/

1000

)



.toFixed(2);







// ================= ETA =================



const minute=



Math.ceil(


route.duration

/

60



);










// ================= 정보 표시 =================



const info=

L.marker(



[



(

ems.lat

+

rescue.lat

)

/

2,





(

ems.lng

+

rescue.lng

)

/

2





],



{


icon:L.divIcon({



className:"",



html:



`

<div style="


background:#050b18;


color:#ff3333;


border:2px solid red;


padding:8px;


border-radius:8px;


font-size:13px;


box-shadow:0 0 10px red;


white-space:nowrap;


">


🚒 ${rescue.name}

<br>


🚗 차량 출동

<br>


📏 ${km} km

<br>


⏱ ${minute}분


</div>



`



})



}



)



.addTo(vehicleRouteLayer);







});



}

// 거리 km



const km=

(

distance

/

1000

)

.toFixed(2);











const info=

L.marker(



[



(

ems.lat

+

rescue.lat

)

/

2,





(

ems.lng

+

rescue.lng

)

/

2





],



{


icon:L.divIcon({



className:"",



html:



`

<div style="


background:#050b18;


color:orange;


border:2px solid orange;


padding:8px;


border-radius:8px;


font-size:13px;


box-shadow:0 0 10px orange;

">


🥾 ${rescue.name}

<br>

`

}



)



.addTo(mountainRouteLayer);






}











// ================= 거리 계산 =================



function calculateDistance(



lat1,


lng1,


lat2,


lng2



){



const R=

6371000;



const dLat=

(lat2-lat1)

*

Math.PI

/

180;



const dLng=

(lng2-lng1)

*

Math.PI

/

180;






const a=



Math.sin(dLat/2)

*

Math.sin(dLat/2)



+

Math.cos(

lat1*Math.PI/180

)

*

Math.cos(

lat2*Math.PI/180

)

*

Math.sin(dLng/2)

*

Math.sin(dLng/2);






const c=



2

*

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);






return R*c;



}










// ================= 레이어 제어 =================



const overlays={



"🚑 EMS 신고":

emsLayer,



"🚒 차량 출동":

vehicleRouteLayer,



"🥾 산악 구조":

L.control.layers(

// ================= STOP =================



function stopTracking(){



endTime=

getNowTime();








if(lastPos){



fetch(

API_URL,

{


method:"POST",



headers:{


"Content-Type":

"text/plain"


},



body:JSON.stringify({


...lastPos,

}



);



}

// ================= 전체 기록 =================



function loadAllHistory(){



fetch(

API_URL

+

"?history=1&t="

+

Date.now()

)



.then(r=>r.json())

.then(showHistoryMap);



}









function showHistoryMap(data){



historyMarkers.clearLayers();


historyLines.clearLayers();







const grouped={};







data.sort(

(a,b)=>

new Date(a.time)

-

new Date(b.time)



);









data.forEach(d=>{



if(!grouped[d.name])

grouped[d.name]=[];






grouped[d.name].push([



Number(d.lat),



Number(d.lng)



]);



});









const all=[];








for(const name in grouped){



const path=

grouped[name];






if(!path.length)

continue;






all.push(...path);







L.polyline(

path,

{


color:getColor(name),


weight:5,


opacity:0.8



}



)

.addTo(historyLines);








L.marker(

path[0]

)



.bindPopup(

"🟢 START : "

+

name

)



.addTo(historyMarkers);







L.marker(

path[path.length-1]

)



.bindPopup(

"🔴 END : "

+

name

)



.addTo(historyMarkers);







}









if(all.length){



map.fitBounds(

all,

{


padding:[50,50]


}



);



}



}











// ================= 초기 실행 =================



loadLive();


loadEMS();


</script>

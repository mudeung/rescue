<script>

// ================= API =================


const API_URL =
"https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";



const EMS_API =
"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";




// ================= ROUTING =================


// 차량

const OSRM_DRIVING =

"https://router.project-osrm.org/route/v1/driving/";



// 산악 탐방로 서버

// 직접 구축한 OSRM foot 또는 Valhalla 추천

const OSRM_FOOT =

"https://YOUR_FOOT_ROUTER_SERVER/route/v1/foot/";




// ================= TRAIL DATA =================


let hikingTrails=[];


// 탐방로 Layer

const hikingTrailLayer =

L.layerGroup()

.addTo(map);



// 구조 경로

const vehicleRouteLayer =

L.layerGroup()

.addTo(map);


const mountainRouteLayer =

L.layerGroup()

.addTo(map);



// 자동 배정 데이터

const dispatchCandidates={};

// ================= 정규 탐방로 LOAD =================


// trails.json 예시:
//
// [
//   {
//     "name":"무등산 장불재 탐방로",
//     "difficulty":"중급",
//     "elevation":320,
//     "coordinates":[
//        [35.1351,126.9871],
//        [35.1365,126.9890]
//     ]
//   }
// ]



function loadHikingTrails(){


fetch(

"trails.json?t="+Date.now()

)


.then(r=>r.json())


.then(data=>{


hikingTrails=data;



drawHikingTrails();



})


.catch(err=>{


console.log(

"탐방로 데이터 오류",

err

);


});


}








// ================= 탐방로 표시 =================



function drawHikingTrails(){



hikingTrailLayer.clearLayers();




hikingTrails.forEach(trail=>{



const line =

L.polyline(

trail.coordinates,

{


color:"#00ff00",

weight:4,

opacity:0.8



}

)




.bindPopup(



`

<div style="font-family:monospace">


🥾 정규 탐방로


<br><br>


<b>${trail.name}</b>


<br>


난이도 :

${trail.difficulty}


<br>


상승고도 :

${trail.elevation || 0}m


</div>

`

)




.addTo(

hikingTrailLayer

);



});



}









// ================= 거리 계산 =================



function calcDistance(

lat1,

lng1,

lat2,

lng2

){



const R=6371000;



const dLat=

(lat2-lat1)

*

Math.PI/180;



const dLng=

(lng2-lng1)

*

Math.PI/180;





const a=

Math.sin(dLat/2)

*

Math.sin(dLat/2)

+

Math.cos(

lat1*Math.PI/180

)

*

Math.cos(

lat2*Math.PI/180

)

*

Math.sin(dLng/2)

*

Math.sin(dLng/2);





return R *

2 *

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);



}









// ================= 가장 가까운 탐방로 검색 =================



function findNearestTrail(

lat,

lng

){



let result=null;



let minDistance=Infinity;







hikingTrails.forEach(trail=>{



trail.coordinates.forEach(point=>{



const distance=

calcDistance(

lat,

lng,

point[0],

point[1]

);





if(distance < minDistance){



minDistance=

distance;



result={


trail:trail,


lat:point[0],


lng:point[1],


distance:distance



};



}



});



});






return result;



}









// ================= 탐방로 ETA 계산 =================



function calculateMountainETA(


distance,


elevation=0


){



// 기본 산행속도

// 1km 약 20분



let time =

(distance/1000)

*

20;







// 상승고도 보정

// 100m 상승당 +10분



time +=

(elevation/100)

*

10;






return Math.ceil(time);



}









// ================= 초기 탐방로 실행 =================



loadHikingTrails();


// ================= OSRM 차량 길찾기 =================


function getVehicleRoute(

startLat,

startLng,

endLat,

endLng

){


return fetch(


OSRM_DRIVING

+

`${startLng},${startLat};${endLng},${endLat}`

+

"?overview=full&geometries=geojson"


)


.then(r=>r.json())


.then(data=>{


if(

!data.routes ||

!data.routes.length

)

return null;



const route=

data.routes[0];



return {


distance:

route.distance,


duration:

route.duration,


geometry:

route.geometry.coordinates



};



});


}









// ================= 탐방로 기반 산악 경로 =================



function getMountainTrailRoute(ems,rescue){



const startTrail =

findNearestTrail(

ems.lat,

ems.lng

);





if(!startTrail)

return null;





const trail =

startTrail.trail;






let path=[];



trail.coordinates.forEach(p=>{


path.push([

p[0],

p[1]

]);


});





const distance=

calculateTrailDistance(

path

);





const eta=

calculateMountainETA(

distance,

trail.elevation || 0

);






return {


path:path,


distance:distance,


eta:eta,


trail:trail.name



};



}









// ================= 탐방로 총 거리 계산 =================



function calculateTrailDistance(path){



let total=0;




for(let i=1;i<path.length;i++){



total +=

calcDistance(

path[i-1][0],

path[i-1][1],

path[i][0],

path[i][1]

);



}



return total;



}









// ================= 차량 경로 표시 =================



function drawVehicleRoute(ems,rescue){



getVehicleRoute(



ems.lat,

ems.lng,

rescue.lat,

rescue.lng



)



.then(route=>{


if(!route)

return;





const path=[];



route.geometry.forEach(p=>{


path.push([

p[1],

p[0]

]);


});





const line=

L.polyline(

path,

{


color:"red",

weight:6,

opacity:0.9



}

)

.addTo(vehicleRouteLayer);






const eta=

Math.ceil(

route.duration/60

);






saveDispatchCandidate({



emsId:ems.id,


name:rescue.name,


mode:"🚒 차량",


distance:route.distance,


eta:eta,


layer:line



});






});



}









// ================= 산악 탐방로 표시 =================



function drawMountainTrailRoute(ems,rescue){



const route=

getMountainTrailRoute(

ems,

rescue

);





if(!route)

return;







const line=

L.polyline(



route.path,

{


color:"orange",

weight:6,

dashArray:"10,10"



}



)

.addTo(

mountainRouteLayer

);






saveDispatchCandidate({



emsId:ems.id,


name:rescue.name,


mode:"🥾 산악",


distance:route.distance,


eta:route.eta,


layer:line



});





}









// ================= 구조대 후보 저장 =================



function saveDispatchCandidate(data){



if(!dispatchCandidates[data.emsId]){


dispatchCandidates[data.emsId]=[];

}



dispatchCandidates[data.emsId].push(data);



console.log(

"출동 후보",

data

);



}


 
// ================= 가까운 구조대 전체 검색 =================


function findAllRescue(){


let list=[];



Object.keys(markers)

.forEach(name=>{


const pos=

markers[name].getLatLng();



list.push({


name:name,


lat:pos.lat,


lng:pos.lng


});



});



return list;


}









// ================= EMS 자동 배정 =================



function autoDispatch(ems){



dispatchCandidates[ems.id]=[];



const rescues=

findAllRescue();



if(!rescues.length)

return;







rescues.forEach(rescue=>{



// 차량 계산

drawVehicleRoute(

ems,

rescue

);




// 산악 계산

drawMountainTrailRoute(

ems,

rescue

);



});






// 계산 완료 후 비교

setTimeout(()=>{


compareDispatch(

ems.id

);



},3000);



}









// ================= ETA 비교 =================



function compareDispatch(emsId){



const list=

dispatchCandidates[emsId];



if(

!list ||

!list.length

)

return;







// ETA 순 정렬



list.sort(

(a,b)=>

a.eta-b.eta

);






const best=list[0];





console.log(

"최적 구조대",

best.name,

best.mode,

best.eta+"분"

);






highlightDispatch(best);







showDispatchResult(

best,

list

);



}









// ================= 최적 경로 강조 =================



function highlightDispatch(best){



// 모든 경로 흐리게



vehicleRouteLayer.eachLayer(layer=>{


if(layer.setStyle){


layer.setStyle({


opacity:0.25


});


}


});






mountainRouteLayer.eachLayer(layer=>{


if(layer.setStyle){


layer.setStyle({


opacity:0.25


});


}


});








// 선택 경로 강조



best.layer.setStyle({



color:"red",

weight:10,

opacity:1



});





}









// ================= 배정 결과 표시 =================



function showDispatchResult(best,list){



let html=



`

<div style="

background:#050b18;

color:#00ff9d;

border:2px solid red;

padding:10px;

border-radius:10px;

font-family:monospace;

">


<b>🚨 자동 출동 배정</b>


<br><br>


선택 :

${best.name}


<br>


방식 :

${best.mode}


<br>


ETA :

${best.eta}분


<br><br>


<hr>


`;






list.forEach((x,index)=>{


html+=


`

${index+1}.

${x.name}

${x.mode}

${x.eta}분

<br>


`;



});





html+=

`

</div>

`;







L.popup()

.setLatLng(

best.layer.getBounds()

.getCenter()

)

.setContent(html)

.openOn(map);



}









// ================= 수동 구조대 선택 =================



function selectDispatch(

emsId,

index

){



const list=

dispatchCandidates[emsId];



if(!list)

return;



const selected=

list[index];



highlightDispatch(selected);



alert(

selected.name+

" 선택\n"+

selected.mode+

"\nETA "+

selected.eta+"분"

);



}



// ================= EMS 상태 관리 =================


const emsDispatchState = {};




// ================= EMS RENDER 수정 =================



function renderEMS(data){



emsLayer.clearLayers();



data.forEach(item=>{



const lat=

Number(item.lat);



const lng=

Number(item.lng);




if(

!Number.isFinite(lat)

||

!Number.isFinite(lng)

)

return;





const pos=[lat,lng];



const id=item.id;



// 상태 저장


if(!emsDispatchState[id]){


emsDispatchState[id]={


status:item.status,


assigned:null



};


}








// ================= 🚑 EMS ICON =================



const icon =


L.divIcon({



className:"",



html:

`

<div style="

font-size:34px;

filter:

drop-shadow(0 0 8px red);

">

🚑

</div>

`,



iconSize:[40,40]



});







const marker =


L.marker(

pos,

{

icon:icon

}

)









// ================= 팝업 =================



.bindPopup(



`

<div style="

font-family:monospace;

min-width:220px;

">


<h3>

🚑 119 신고

</h3>



<hr>



📌 유형 :

${item.type}

<br><br>


📍 위치 :

${item.address}

<br><br>


⏰ 접수 :

${item.time}

<br><br>


상태 :

<span id="status_${id}">

${item.status}

</span>


<br><br>



<button onclick="dispatchNow('${id}')">

🚨 자동 출동 배정

</button>



<br><br>



<button onclick="showCandidates('${id}')">

📋 구조대 선택

</button>


</div>

`


)






.addTo(

emsLayer

);





// 저장

emsMarkers[id]=marker;







// ================= 빨간 펄스 =================



if(item.status!=="완료"){



const pulse=

L.marker(

pos,

{


icon:L.divIcon({



className:"",



html:

`

<div class="ems-pulse"></div>

`,



iconSize:[30,30]



}),


interactive:false


}

)



.addTo(

emsLayer

);



emsPulseMarkers[id]=pulse;



}







// ================= 자동 배정 실행 =================



if(

item.status==="접수"

&&

!dispatchCandidates[id]

){



autoDispatch({

id:id,

lat:lat,

lng:lng

});



}






});



}









// ================= 자동 출동 버튼 =================



function dispatchNow(id){



const marker=

emsMarkers[id];



if(!marker)

return;





const pos=

marker.getLatLng();





autoDispatch({


id:id,


lat:pos.lat,


lng:pos.lng



});




alert(

"🚨 자동 출동 분석 시작"

);



}









// ================= 후보 구조대 표시 =================



function showCandidates(id){



const list=

dispatchCandidates[id];



if(

!list ||

!list.length

){


alert(

"계산 중입니다."

);


return;


}







let html=


`

<div style="font-family:monospace">


<b>🚑 출동 후보</b>

<br><br>

`;







list.sort(

(a,b)=>

a.eta-b.eta

);







list.forEach((x,i)=>{



html+=


`

<button

onclick="selectDispatch('${id}',${i})"

style="width:100%;margin:3px">


${i+1}

${x.name}

<br>

${x.mode}

ETA :

${x.eta}분


</button>


`;



});





html+=

`

</div>

`;






L.popup()


.setLatLng(

emsMarkers[id]

.getLatLng()

)


.setContent(html)


.openOn(map);



}









// ================= 출동 상태 변경 =================



function updateEMSStatus(

id,

status

){



if(!emsDispatchState[id])

return;



emsDispatchState[id].status=status;



const el=

document.getElementById(

"status_"+id

);



if(el)

el.innerHTML=status;



}




// ================= 지도 레이어 제어 =================



L.control.layers(

null,

{


"🚑 EMS 신고":

emsLayer,


"🚒 차량 출동":

vehicleRouteLayer,


"🥾 산악 탐방로":

hikingTrailLayer,


"🥾 산악 구조":

mountainRouteLayer,


"🚨 SOS":

sosLayer,


"📍 기록":

historyMarkers,


"🧭 이동경로":

historyLines



}


)

.addTo(map);









// ================= LIVE 구조대 위치 갱신 =================



function startLiveTracking(){



loadLive();



if(intervalLoad)

clearInterval(intervalLoad);




intervalLoad=

setInterval(


loadLive,


3000


);



}









// ================= EMS 갱신 =================



function startEMSTracking(){



loadEMS();



if(intervalEMS)

clearInterval(intervalEMS);





intervalEMS=

setInterval(


loadEMS,


3000


);



}









// ================= LIVE LOAD 보완 =================



function loadLive(){



fetch(

API_URL

+

"?live=1&t="

+

Date.now()

)



.then(r=>r.json())


.then(data=>{


renderLive(data);



})



.catch(err=>{


console.log(

"LIVE 오류",

err

);


});



}









// ================= 구조대 렌더 =================



function renderLive(data){



data.forEach(p=>{



const lat=

Number(p.lat);


const lng=

Number(p.lng);



if(

!Number.isFinite(lat)

||

!Number.isFinite(lng)

)

return;





const key=p.name;



const pos=[lat,lng];







if(!markers[key]){



markers[key]=



L.circleMarker(

pos,


{


radius:11,


color:"#00ff9d",


fillColor:"#00ff9d",


fillOpacity:1,


weight:3



}


)



.bindTooltip(

key,


{


permanent:true,


direction:"top",


className:"name-label"


}



)



.addTo(

rescueLayer

);





}

else{


markers[key]

.setLatLng(pos);



}







});



}









// ================= STOP 시 정리 =================



function clearAllRoutes(){



vehicleRouteLayer.clearLayers();


mountainRouteLayer.clearLayers();


dispatchCandidates={};



}









// ================= 안전 OSRM 요청 =================



function safeRouteFetch(url){



return fetch(url)



.then(r=>{


if(!r.ok)

throw new Error(

"Routing Error"

);


return r.json();



})



.catch(err=>{


console.log(

err

);


return null;



});



}









// ================= ETA 표시 =================



function formatETA(min){



if(min<60){


return min+"분";


}



const hour=

Math.floor(

min/60

);



const minute=

min%60;



return hour+

"시간 "

+

minute

+

"분";



}









// ================= 출동 완료 처리 =================



function completeDispatch(id){



updateEMSStatus(

id,

"완료"

);



if(

emsPulseMarkers[id]

){



emsLayer.removeLayer(

emsPulseMarkers[id]

);



delete emsPulseMarkers[id];



}





vehicleRouteLayer.clearLayers();


mountainRouteLayer.clearLayers();



}









// ================= 시스템 시작 =================



function initRescueSystem(){



console.log(

"🛰 SEARCH AND RESCUE AI MAP START"

);





// 탐방로

loadHikingTrails();





// 구조대

startLiveTracking();





// EMS

startEMSTracking();





}









// ================= 페이지 실행 =================



window.onload=function(){


initRescueSystem();


};


// ================= FOOT ROUTING =================


function getFootRoute(

startLat,

startLng,

endLat,

endLng

){


return fetch(

OSRM_FOOT +

`${startLng},${startLat};${endLng},${endLat}`

+

"?overview=full&geometries=geojson"


)


.then(r=>r.json())


.then(data=>{


if(
!data.routes ||
!data.routes.length
)

return null;



const route=data.routes[0];



return {


distance:route.distance,


duration:route.duration,


geometry:
route.geometry.coordinates


};



})


.catch(err=>{


console.log(

"FOOT ROUTE ERROR",

err

);


return null;


});


}  


</script>

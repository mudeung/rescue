<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
🛰 SEARCH AND RESCUE AI MAP
</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<link rel="stylesheet"
href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css">


<script

<style>


body{

margin:0;

background:#050b18;

color:#00ff9d;

font-family:monospace;

overflow:hidden;

}



header{

height:50px;

background:#071a2f;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

font-weight:bold;

}



#container{

display:flex;

height:calc(100vh - 50px);

}



#panel{

width:300px;

background:#07101f;

padding:10px;

display:flex;

flex-direction:column;

gap:8px;

overflow-y:auto;

}



#map{
flex:1;
height:100%;
min-height:400px;
}



input,
button{

padding:10px;

border:1px solid #00ff9d;

background:#001a14;

color:#00ff9d;

font-family:monospace;

}



button:disabled{

opacity:.4;

}



.name-label{

background:#001a14;

color:#00ff9d;

border:1px solid #00ff9d;

border-radius:5px;

padding:3px 8px;

font-size:12px;

font-weight:bold;

box-shadow:
0 0 8px #00ff9d;

}



.ems-pulse{

width:24px;

height:24px;

border-radius:50%;

background:red;

border:3px solid white;

box-shadow:
0 0 15px red;

animation:pulse 1.5s infinite;

}



@keyframes pulse{


0%{

transform:scale(.5);

opacity:1;

}


70%{

opacity:.2;

}


100%{

transform:scale(.5);

opacity:1;

}


}



@media(max-width:768px){


#container{
display:flex;
height:calc(100vh - 50px);
}

width:auto;

height:35vh;

}

}


}


</style>


</head>


<body>



<header>

🛰 SEARCH AND RESCUE AI MAP

</header>




<div id="container">


<div id="panel">


<input 
id="name"
placeholder="RESCUE ID">


<button id="startBtn" disabled>

START

</button>


<button id="myLocationBtn">

📍 MY LOCATION

</button>


<button id="shareBtn">

📡 위치 공유

</button>


<button id="sosBtn">

🚨 SOS

</button>


<button id="stopBtn">

⛔ STOP

</button>


<button id="historyBtn">

📦 전체 기록

</button>


</div>


<div id="map"></div>


</div>



<script>


// ================= API =================


const API_URL =

"https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";



const EMS_API =

"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


const GRAPHHOPPER_KEY =
"6f1dbbf6-0546-4b11-a9c8-8d8134dff43c";


// ================= DEVICE =================


let DEVICE_ID =

localStorage.getItem(
"DEVICE_ID"
);



if(!DEVICE_ID){


DEVICE_ID =
crypto.randomUUID();


localStorage.setItem(
"DEVICE_ID",
DEVICE_ID
);


}



// ================= MAP =================


const map =

L.map("map")

.setView(

[35.1239,126.9883],

13

);




// ================= TILE =================



const osm =

L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19

}

);



const topo =

L.tileLayer(

"https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",

{

maxZoom:17

}

);



const satellite =

L.tileLayer(

"https://server.arcgis.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

{

maxZoom:19

}

);



// 등산로 표시용

const hiking =

L.tileLayer(

"https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png",

{

maxZoom:17

}

);



osm.addTo(map);
map.on("tileerror",function(e){
console.log("타일 오류",e);
});



L.control.layers(

{

"🗺 일반지도":osm,

"⛰ 지형지도":topo,

"🛰 위성지도":satellite,

"🥾 등산로":hiking

}

)

.addTo(map);





// ================= ICON =================



function getHikerIcon(){


return L.divIcon({


className:"",


html:

`

<div style="
font-size:32px;
filter:drop-shadow(0 0 8px lime)
">

🥾

</div>

`,

iconSize:[35,35]


});


}





function getSOSIcon(){


return L.divIcon({


className:"",


html:

`

<div style="
font-size:35px;
filter:drop-shadow(0 0 10px red)
">

🚨

</div>

`,


iconSize:[40,40]


});


}




function getEMSIcon(){


return L.divIcon({


className:"",


html:

`

<div style="
font-size:32px;
filter:drop-shadow(0 0 10px red)
">

🚑

</div>

`,


iconSize:[40,40]


});


}






// ================= DRAW =================


const drawnItems =

new L.FeatureGroup();


map.addLayer(
drawnItems
);



const drawControl =

new L.Control.Draw({

position:"topright",


draw:{

polygon:true,

rectangle:true,

circle:true,

polyline:true,

marker:true

},


edit:{

featureGroup:drawnItems

}


});


map.addControl(
drawControl
);



map.on(

L.Draw.Event.CREATED,

function(e){


drawnItems.addLayer(
e.layer
);


});






// ================= LAYERS =================



const rescueLayer =

L.layerGroup()

.addTo(map);



const emsLayer =

L.layerGroup()

.addTo(map);



const routeLayer =

L.layerGroup()

.addTo(map);



const historyLayer =

L.layerGroup()

.addTo(map);




// ================= STATE =================



let lastPos=null;

let watchId=null;

let myName="";

let startTime="";

let endTime="";

let sendTimer=null;

let liveTimer=null;

let emsTimer=null;




// ================= MARKERS =================



Object.keys(markers).forEach(k=>{
delete markers[k];
});

rescueLayer.clearLayers();

const emsMarkers={};

const rescueRoutes={};





console.log(
"RESCUE MAP PART1 READY"
);





 // ================= EMS LOAD =================


function loadEMS(){


fetch(

EMS_API+
"?t="+Date.now()

)


.then(r=>r.json())

.then(renderEMS)

.catch(console.log);


}




// ================= EMS RENDER =================


function renderEMS(data){


if(!Array.isArray(data))
return;



const active={};



data.forEach(item=>{


const lat =
Number(item.lat);


const lng =
Number(item.lng);



if(

!Number.isFinite(lat) ||
!Number.isFinite(lng)

)
return;



const id =
item.id;



active[id]=true;



const pos=[lat,lng];




// EMS MARKER


if(!emsMarkers[id]){


emsMarkers[id]=

L.marker(

pos,

{

icon:getEMSIcon()

}

)


.bindPopup(

`

<b>🚑 119 신고</b>

<br><br>

📌 유형 :
${item.type || ""}

<br><br>

📍 위치 :
${item.address || "-"}

<br><br>

📡 상태 :
${item.status || ""}

<br><br>

⏰ 시간 :
${item.time || ""}

`

)


.addTo(emsLayer);


}

else{


emsMarkers[id]
.setLatLng(pos);


}



// 경로 생성

drawEmergencyRoute({

id:id,

lat:lat,

lng:lng

});


});



}







// ================= DISTANCE =================



function distanceMeter(

lat1,

lng1,

lat2,

lng2

){


const R=6371000;


const dLat=

(lat2-lat1)
*Math.PI/180;


const dLng=

(lng2-lng1)
*Math.PI/180;



const a=

Math.sin(dLat/2)**2

+

Math.cos(lat1*Math.PI/180)

*

Math.cos(lat2*Math.PI/180)

*

Math.sin(dLng/2)**2;



return R*

2*

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);


}








// ================= FIND NEAREST RESCUE =================



function findNearestRescue(

ems

){



let result=null;


let min=999999999;



Object.keys(markers)

.forEach(name=>{


const p=

markers[name]

.getLatLng();



const d=

distanceMeter(

ems.lat,

ems.lng,

p.lat,

p.lng

);



if(d<min){


min=d;


result={


name:name,

lat:p.lat,

lng:p.lng,

distance:d


};


}



});



return result;


}








// ================= ROAD ROUTE =================



function getRoadRoute(

startLat,

startLng,

endLat,

endLng

){



const url=

"https://router.project-osrm.org/route/v1/driving/"

+

`${startLng},${startLat};${endLng},${endLat}`

+

"?overview=full&geometries=geojson";




return fetch(url)


.then(r=>r.json())


.then(data=>{


if(
!data.routes ||
!data.routes.length
)

return null;



const r=

data.routes[0];



return {


distance:r.distance,

duration:r.duration,

geometry:r.geometry.coordinates


};



})


.catch(()=>null);



}


// ================= HIKING ROUTE =================

function getHikingRoute(
startLat,
startLng,
endLat,
endLng
){


const url =

"https://graphhopper.com/api/1/route"

+

"?point="
+
`${startLat},${startLng}`

+

"&point="
+
`${endLat},${endLng}`

+

"&profile=foot"

+

"&locale=ko"

+

"&points_encoded=false"

+

"&key="
+
GRAPHHOPPER_KEY;



return fetch(url)


.then(r=>r.json())


.then(data=>{


if(
!data.paths ||
!data.paths.length
)

return null;



const path=data.paths[0];



return {


distance:path.distance,

duration:path.time,

geometry:

path.points.coordinates


};


})


.catch(err=>{

console.log(
"등산로 경로 오류",
err
);

return null;

});


}




// ================= DRAW 119 + WALK =================



function drawEmergencyRoute(

ems

){



routeLayer.clearLayers();



const rescue =

findNearestRescue(ems);



if(!rescue)

return;





// ================= 차량 =================



getRoadRoute(

ems.lat,

ems.lng,

rescue.lat,

rescue.lng

)


.then(route=>{


if(!route)

return;



const coords=[];


route.geometry.forEach(p=>{


coords.push([

p[1],

p[0]

]);


});




L.polyline(

coords,

{

color:"red",

weight:6

}

)

.addTo(routeLayer);




const km=

(route.distance/1000)

.toFixed(2);



const min=

Math.ceil(

route.duration/60

);



showRouteInfo(

ems,

rescue,

"🚒 119 차량",

km,

min,

"red"

);


});

// ================= 실제 도보 경로 =================

getHikingRoute(

rescue.lat,
rescue.lng,
ems.lat,
ems.lng

)

.then(route=>{


if(!route)
return;


const coords=[];


route.geometry.forEach(p=>{

coords.push([

p[1],

p[0]

]);

});



L.polyline(

coords,

{

color:"#00ff00",

weight:5,

dashArray:"10,10"

}

)

.addTo(routeLayer);



showRouteInfo(

ems,

rescue,

"🥾 실제 도보 구조",

(route.distance/1000).toFixed(2),

Math.ceil(route.duration/60),

"#00ffff"

);


});
 
}








// ================= ROUTE INFO =================



function showRouteInfo(

ems,

rescue,

title,

distance,

time,

color

){



L.marker(

[

(

ems.lat+rescue.lat

)/2,


(

ems.lng+rescue.lng

)/2

],

{


icon:

L.divIcon({

className:"",

html:


`

<div style="

background:#050b18;

border:2px solid ${color};

color:${color};

padding:10px 14px;

border-radius:10px;

font-size:13px;

font-weight:bold;

line-height:1.8;

min-width:150px;

text-align:center;

box-shadow:0 0 10px ${color};

white-space:nowrap;

">

<div style="
font-size:15px;
margin-bottom:5px;
">

${title}

</div>


<div>

📏 거리 : ${distance} km

</div>


<div>

⏱ 시간 : ${time}분

</div>


</div>

`

})


}

)

.addTo(routeLayer);



}








// ================= START EMS =================



loadEMS();


emsTimer =

setInterval(

loadEMS,

10000

);

// ================= INPUT =================


const nameInput =
document.getElementById("name");


const startBtn =
document.getElementById("startBtn");



nameInput.addEventListener(

"input",

()=>{


startBtn.disabled =
nameInput.value.trim()==="";


}

);




// ================= TIME =================


function getNowTime(){


const d=new Date();


return (

d.getFullYear()+"-"

+

String(d.getMonth()+1).padStart(2,"0")

+

"-"

+

String(d.getDate()).padStart(2,"0")

+

" "

+

String(d.getHours()).padStart(2,"0")

+

":"

+

String(d.getMinutes()).padStart(2,"0")

+

":"

+

String(d.getSeconds()).padStart(2,"0")

);


}






// ================= START =================


startBtn.onclick=start;



function start(){


myName=

nameInput.value.trim();



if(!myName){

alert(
"RESCUE ID 입력 필요"
);

return;

}



startTime=

getNowTime();



nameInput.disabled=true;

startBtn.disabled=true;





watchId=

navigator.geolocation.watchPosition(


pos=>{


lastPos={


name:myName,

device:DEVICE_ID,

lat:pos.coords.latitude,

lng:pos.coords.longitude,

status:"normal"


};



},



err=>{


alert(
"GPS 권한 필요"
);


},



{


enableHighAccuracy:true,

maximumAge:1000,

timeout:10000


}



);




sendTimer=

setInterval(

sendData,

5000

);



liveTimer=

setInterval(

loadLive,

3000

);



alert(
"🛰 추적 시작"
);


}








// ================= SEND =================



function sendData(){



if(!lastPos)

return;



fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain"


},


body:


JSON.stringify({

...lastPos,

startTime:startTime,

endTime:endTime

})


}


)

.catch(console.log);


}








// ================= LIVE =================



function loadLive(){


fetch(

API_URL+

"?live=1&t="+Date.now()

)



.then(r=>r.json())

.then(renderLive)

.catch(console.log);


}








function renderLive(data){

// START 안 했으면 표시 안 함
if(!myName)
{
    rescueLayer.clearLayers();
    return;
}


if(!Array.isArray(data))
return;


rescueLayer.clearLayers();


data.forEach(p=>{


// 내 ID만 표시
if(p.name !== myName)
return;



const lat = Number(p.lat);
const lng = Number(p.lng);



if(
!Number.isFinite(lat) ||
!Number.isFinite(lng)
)
return;



const marker = L.marker(

[lat,lng],

{

icon:getHikerIcon()

}

)


.bindTooltip(

p.name,

{

permanent:true,

className:"name-label"

}

)


.addTo(rescueLayer);



markers[p.name]=marker;


});


}





// ================= MY LOCATION =================



document.getElementById(
"myLocationBtn"
)

.onclick=function(){



if(!lastPos){

alert(
"현재 위치 없음"
);

return;

}



map.setView(

[

lastPos.lat,

lastPos.lng

],

17

);


};








// ================= SOS =================



document.getElementById(
"sosBtn"
)

.onclick=function(){



if(!lastPos){

alert(
"위치 없음"
);

return;

}



fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain"


},


body:

JSON.stringify({

...lastPos,

status:"SOS",

startTime:startTime,

endTime:endTime

})


}


);



alert(
"🚨 SOS 전송 완료"
);


};









// ================= SHARE =================



document.getElementById(
"shareBtn"
)

.onclick=function(){



if(!lastPos){

alert(
"현재 위치 없음"
);

return;

}



const url=

`https://www.google.com/maps?q=${lastPos.lat},${lastPos.lng}`;



const text=

`

📡 구조대 위치 공유


UNIT:
${lastPos.name}


위치:
${url}

`;



if(navigator.share){


navigator.share({

title:"구조대 위치",

text:text,

url:url

});


}

else{


location.href=

"sms:?body="+

encodeURIComponent(text);


}


};









// ================= STOP =================



document.getElementById(
"stopBtn"
)

.onclick=function(){



endTime=

getNowTime();



if(lastPos){



fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain"


},


body:


JSON.stringify({

...lastPos,

status:"STOP",

startTime:startTime,

endTime:endTime

})


}


);



}



if(watchId){


navigator.geolocation.clearWatch(
watchId
);


watchId=null;


}



clearInterval(sendTimer);

clearInterval(liveTimer);



lastPos=null;

myName="";

markers={};

rescueLayer.clearLayers();


nameInput.disabled=false;

nameInput.value="";


startBtn.disabled=true;



alert(
"⛔ STOP 완료"
);


};









// ================= HISTORY =================



document.getElementById(
"historyBtn"
)

.onclick=function(){



fetch(

API_URL+

"?history=1&t="+Date.now()

)


.then(r=>r.json())

.then(data=>{


historyLayer.clearLayers();



const group={};



data.forEach(p=>{


if(!group[p.name])

group[p.name]=[];



group[p.name].push(

[

Number(p.lat),

Number(p.lng)

]

);



});




Object.keys(group)

.forEach(name=>{


L.polyline(

group[name],

{


color:"#00ff9d",

weight:5


}

)

.addTo(historyLayer);



});



})


};








console.log(
"🛰 SEARCH RESCUE MAP COMPLETE"
);


</script>


</body>

</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산특수구조팀 상황판 관리자 모드</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;}
header{background:#b71c1c;padding:15px;text-align:center;}
.container{padding:10px;}
button{padding:6px 10px;margin:3px;border:none;border-radius:4px;cursor:pointer;}
#map{height:300px;margin-bottom:10px;}
.card{background:#1e1e1e;padding:10px;margin-bottom:8px;border-radius:6px;}
.card.done{opacity:0.6;}
.search{width:100%;padding:8px;margin-bottom:10px;border-radius:6px;border:none;}
</style>
</head>

<body>
    
<!-- 🔐 비밀번호 잠금 화면 -->
<div id="loginOverlay" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
flex-direction:column;
">
  <h2 style="margin-bottom:20px;">🔐 무등산특수구조팀 상황판 관리자 접속인증</h2>
  <input type="password" id="passwordInput" placeholder="비밀번호 입력" style="width:250px;padding:10px;border-radius:6px;border:none;margin-bottom:10px;">
  <button onclick="checkPassword()">접속하기</button>
  <p id="loginError" style="color:red;margin-top:10px;"></p>
</div>  
    
<header>
🚑 구조 상황판 관리자 모드
<button onclick="adminLogin()">로그인</button>
</header>

<div class="container">

<input id="searchInput" class="search" placeholder="📞 전화번호 / 주소 검색" oninput="loadData()">

<div id="map"></div>

<h3>🚨 진행중</h3>
<div id="listArea"></div>

<h3 onclick="toggleFinished()" style="cursor:pointer;">📂 완료 (클릭)</h3>
<div id="finishedArea" style="display:none;"></div>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

let isAdmin=false;
let map;
let markers=[];
let showFinished=false;

/* 관리자 */
function adminLogin(){
    if(prompt("비밀번호") === "rescue119"){
        isAdmin=true;
        alert("관리자 활성화");
        loadData();
    }
}

/* 지도 */
function initMap(){
    map=new kakao.maps.Map(document.getElementById("map"),{
        center:new kakao.maps.LatLng(35.1595,126.8526),
        level:6
    });
}

/* 상태 변경 */
async function update(id,action){
    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({action,id})
    });
    loadData();
}

/* 진행 데이터 */
async function loadData(){
    const res=await fetch(API_URL);
    const data=await res.json();

    const keyword=document.getElementById("searchInput").value.toLowerCase();

    const list=document.getElementById("listArea");
    list.innerHTML="";

    markers.forEach(m=>m.setMap(null));
    markers=[];

    data.forEach(item=>{

        if(item.status==="삭제") return;

        /* 검색 */
        if(keyword){
            const text=(item.address+item.phone).toLowerCase();
            if(!text.includes(keyword)) return;
        }

        if(item.status==="완료") return;

        const div=document.createElement("div");
        div.className="card";

        div.innerHTML=`
        🕒 ${new Date(item.time).toLocaleString()}<br>
        🏠 ${item.address}<br>
        📞 ${item.phone}<br>
        📝 ${item.symptom}<br>

        <button onclick="update('${item.id}','complete')">🚑 도착</button>
        <button onclick="update('${item.id}','finish')">✅ 완료</button>
        ${isAdmin?`<button onclick="update('${item.id}','delete')">🗑 삭제</button>`:""}
        `;

        list.appendChild(div);

        /* 지도 마커 */
        if(item.lat){
            const marker=new kakao.maps.Marker({
                map:map,
                position:new kakao.maps.LatLng(item.lat,item.lng)
            });
            markers.push(marker);
        }
    });

    if(showFinished) loadFinished();
}

/* 완료 영역 토글 */
async function toggleFinished(){
    showFinished=!showFinished;
    document.getElementById("finishedArea").style.display = showFinished?"block":"none";
    if(showFinished) loadFinished();
}

/* 완료 데이터 (🔥 최신순 정렬 포함) */
async function loadFinished(){
    const res=await fetch(API_URL);
    const data=await res.json();

    const keyword=document.getElementById("searchInput").value.toLowerCase();
    const area=document.getElementById("finishedArea");
    area.innerHTML="";

    const finished = data
        .filter(item => item.status === "완료")
        .sort((a,b)=> new Date(b.finishTime || b.time) - new Date(a.finishTime || a.time));

    finished.forEach(item=>{

        /* 검색 */
        if(keyword){
            const text=(item.address+item.phone).toLowerCase();
            if(!text.includes(keyword)) return;
        }

        const div=document.createElement("div");
        div.className="card done";

        /* 🔥 최근 10분 강조 */
        if(new Date() - new Date(item.finishTime) < 600000){
            div.style.border="2px solid red";
        }

        div.innerHTML=`
        🕒 ${new Date(item.finishTime || item.time).toLocaleString()}<br>
        🏠 ${item.address}<br>
        📞 ${item.phone}<br>
        📝 ${item.symptom}<br>

        ${isAdmin?`
        <button onclick="update('${item.id}','delete')">🗑 삭제</button>
        <button onclick="update('${item.id}','restore')">♻ 복구</button>
        `:""}
        `;

        area.appendChild(div);
    });
}

/* 실행 */
initMap();
loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산특수구조팀 신고현황 관리자 모드</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body { margin:0; font-family:Arial; background:#111; color:#fff; }
header { background:#b71c1c; padding:15px; text-align:center; font-size:20px; }
.container { padding:15px; }
#map { width:100%; height:400px; margin-bottom:15px; border-radius:6px; }
.card { background:#1e1e1e; padding:12px; margin-bottom:10px; border-radius:6px; }
button { padding:6px 10px; background:#e53935; color:#fff; border:none; border-radius:4px; cursor:pointer; margin-right:5px; }
</style>
</head>

<body>

<!-- 🔐 관리자 팝업 -->
<div id="adminModal" style="
position:fixed; top:0; left:0; width:100%; height:100%;
background:rgba(0,0,0,0.9); display:flex; justify-content:center; align-items:center; z-index:9999;">
  <div style="background:#222; padding:20px; border-radius:10px; text-align:center; width:260px;">
    <h3>🔐 관리자 인증</h3>
    <input type="password" id="adminPw" placeholder="비밀번호 입력">
    <button onclick="adminLogin()">접속</button>
    <button onclick="skipLogin()" style="background:#555; margin-left:5px;">일반모드</button>
    <p id="adminError" style="color:red;"></p>
  </div>
</div>

<header>🆘 무등산특수구조팀 신고현황 관리자 모드</header>

<div class="container">
  <div id="map"></div>
  <div id="listArea"></div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

/* 관리자 */
const ADMIN_PASSWORD="1199";
let isAdmin=false;

function adminLogin(){
  const pw=document.getElementById("adminPw").value;
  const error=document.getElementById("adminError");
  if(pw===ADMIN_PASSWORD){
    isAdmin=true;
    sessionStorage.setItem("admin","true");
    document.getElementById("adminModal").style.display="none";
    loadData();
  } else {
    error.innerText="❌ 비밀번호 틀림";
  }
}

function skipLogin(){
  isAdmin=false;
  sessionStorage.removeItem("admin");
  document.getElementById("adminModal").style.display="none";
  loadData();
}

/* 자동 로그인 */
window.addEventListener("load", function(){
  if(sessionStorage.getItem("admin")==="true"){
    isAdmin=true;
    document.getElementById("adminModal").style.display="none";
  }
});

/* 지도 */
let map;
let markers=[];

function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });
}

function clearMarkers(){
  markers.forEach(m=>m.setMap(null));
  markers=[];
}

/* 삭제 */
async function deleteCase(id){
  if(!isAdmin){alert("관리자만"); return;}
  if(!confirm("삭제하시겠습니까?")) return;
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"delete",id,admin:true})
  });
  loadData();
}

/* 도착 */
async function completeCase(id){
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"complete",id})
  });
  loadData();
}

/* 완료 */
async function finishCase(id){
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"finish",id})
  });
  loadData();
}

/* 상태별 마커 이미지 선택 */
function getMarkerImage(status){
  let imageUrl;
  switch(status){
    case "접수": imageUrl="https://i.ibb.co/yY8Lhwp/marker-blue.png"; break;
    case "현장도착": imageUrl="https://i.ibb.co/8BqF5kL/marker-yellow.png"; break;
    case "완료": imageUrl="https://i.ibb.co/S7VG1r9/marker-green.png"; break;
    default: imageUrl="https://i.ibb.co/yY8Lhwp/marker-blue.png";
  }
  return new kakao.maps.MarkerImage(imageUrl, new kakao.maps.Size(24,35));
}

/* 목록 불러오기 & 지도 마커 표시 */
async function loadData(){
  const res=await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"getData",admin:isAdmin})
  });
  const data=await res.json();
  const listArea=document.getElementById("listArea");
  listArea.innerHTML="";
  clearMarkers();

  data.forEach(item=>{
    if(!isAdmin && item.status==="완료") return;

    // 카드 생성
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      🏠 ${item.address || "주소없음"}<br>
      📝 ${item.symptom || "내용없음"}<br>
      상태: ${item.status}<br>
      ${item.status==="현장도착" ? `<button onclick="finishCase('${item.id}')">완료</button>` : `<button onclick="completeCase('${item.id}')">도착</button>`}
      ${isAdmin ? `<button onclick="deleteCase('${item.id}')">삭제</button>` : ""}
    `;
    listArea.appendChild(div);

    // 지도 마커
    if(item.lat && item.lng){
      const position = new kakao.maps.LatLng(item.lat,item.lng);
      const marker = new kakao.maps.Marker({
        map: map,
        position: position,
        image: getMarkerImage(item.status)
      });

      const info = new kakao.maps.InfoWindow({
        content:`<div style="padding:6px; max-width:200px;">
                  <strong>주소:</strong> ${item.address || "없음"}<br>
                  <strong>상황:</strong> ${item.symptom || "없음"}
                </div>`
      });

      kakao.maps.event.addListener(marker, 'click', function() {
        info.open(map, marker);
      });

      markers.push(marker);
    }
  });
}

/* 실행 */
initMap();
loadData();
setInterval(loadData,5000);
</script>

</body>
</html>

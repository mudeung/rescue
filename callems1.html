<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 구조출동 / 과거자료 조회</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
#map{width:100%;height:350px;margin-bottom:15px;border-radius:6px;}
.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;cursor:pointer;}
.card.done{opacity:0.5;background:#2b2b2b;}
.stats{display:flex;gap:10px;margin-bottom:15px;font-size:16px;}
.stat-box{flex:1;padding:10px;border-radius:6px;background:#222;text-align:center;}
.stat-box span{font-size:24px;font-weight:bold;display:block;}
.filter-box{display:flex;gap:10px;margin-bottom:15px;}
input[type=date]{padding:6px;border-radius:4px;border:none;}
button{padding:6px 12px;border:none;border-radius:4px;background:#e53935;color:#fff;cursor:pointer;}
.maplink{color:#4fc3f7;text-decoration:none;font-size:14px;}

/* 모달 스타일 */
.modal{display:none;position:fixed;z-index:9999;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;}
.modal-content{background:#222;padding:20px;border-radius:6px;width:90%;max-width:400px;position:relative;}
.close-btn{position:absolute;top:10px;right:10px;cursor:pointer;font-size:18px;color:#fff;}
</style>
</head>

<body>

<header>🆘 구조출동 / 응급 / 조난 / 기타 대응현황 (과거자료)</header>

<div class="container">

  <!-- 날짜 필터 -->
  <div class="filter-box">
    <label>시작일 <input type="date" id="startDate"></label>
    <label>종료일 <input type="date" id="endDate"></label>
    <button onclick="applyFilter()">조회</button>
  </div>

  <div id="map"></div>

  <div class="stats">
    <div class="stat-box">🚑 응급환자<span id="statEmergency">0</span></div>
    <div class="stat-box">🚓 구조출동<span id="statDispatch">0</span></div>
    <div class="stat-box">🆘 조난<span id="statLost">0</span></div>
    <div class="stat-box">✏ 기타<span id="statOther">0</span></div>
  </div>

  <div id="listArea"></div>
</div>

<!-- 모달 -->
<div id="detailModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";
let map, markers=[], allData=[];

function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });
}

function getMarkerImage(type){
  let urlColor="gray";
  if(type==="응급환자") urlColor="red";
  else if(type==="구조출동") urlColor="blue";
  else if(type==="조난") urlColor="yellow";
  return new kakao.maps.MarkerImage(
    `http://t1.daumcdn.net/localimg/localimages/07/2012/img/marker_${urlColor}.png`,
    new kakao.maps.Size(24,35)
  );
}

// 모달 열기
function openModal(item){
  const modal=document.getElementById("detailModal");
  const body=document.getElementById("modalBody");
  body.innerHTML=`
    🕒 ${new Date(item.time).toLocaleString()}<br>
    🚨 유형: ${item.type}<br>
    🏠 주소: ${item.address}<br>
    📞 연락처: ${item.phone}<br>
    📝 상황: ${item.symptom}<br>
    상태: ${item.status}<br>
    <a class="maplink" href="${item.kakaoMapURL}" target="_blank">📍 지도보기</a>
  `;
  modal.style.display="flex";
}

// 모달 닫기
function closeModal(){
  document.getElementById("detailModal").style.display="none";
}

// 데이터를 지도/카드에 렌더링
function renderData(data){
  document.getElementById("statEmergency").innerText=0;
  document.getElementById("statDispatch").innerText=0;
  document.getElementById("statLost").innerText=0;
  document.getElementById("statOther").innerText=0;

  document.getElementById("listArea").innerHTML="";
  markers.forEach(m=>m.setMap(null));
  markers=[];

  if(data.length===0){
    document.getElementById("listArea").innerText="📭 해당 기간 과거자료가 없습니다.";
    return;
  }

  let bounds=new kakao.maps.LatLngBounds();
  let cntEmergency=0, cntDispatch=0, cntLost=0, cntOther=0;

  data.forEach(item=>{
    const lat=parseFloat(item.lat);
    const lng=parseFloat(item.lng);

    if(!isNaN(lat)&&!isNaN(lng)){
      const marker=new kakao.maps.Marker({
        map,
        position:new kakao.maps.LatLng(lat,lng),
        image:getMarkerImage(item.type)
      });
      markers.push(marker);
      bounds.extend(marker.getPosition());

      // 🔹 마커 클릭 시 모달
      kakao.maps.event.addListener(marker, 'click', function() {
        openModal(item);
      });
    }

    if(item.type==="응급환자") cntEmergency++;
    else if(item.type==="구조출동") cntDispatch++;
    else if(item.type==="조난") cntLost++;
    else cntOther++;

    const div=document.createElement("div");
    div.className="card"+(item.status==="사고처리완료"?" done":"");
    div.innerText=`${new Date(item.time).toLocaleString()} | ${item.type} | ${item.address}`;
    div.onclick=()=>openModal(item);
    document.getElementById("listArea").appendChild(div);
  });

  map.setBounds(bounds);

  document.getElementById("statEmergency").innerText=cntEmergency;
  document.getElementById("statDispatch").innerText=cntDispatch;
  document.getElementById("statLost").innerText=cntLost;
  document.getElementById("statOther").innerText=cntOther;
}

// 기간 필터 적용
function applyFilter(){
  let start=document.getElementById("startDate").value;
  let end=document.getElementById("endDate").value;
  let filtered=allData;

  // 오늘 이전 데이터만 표시
  const today=new Date();
  today.setHours(0,0,0,0);
  filtered=filtered.filter(item=> new Date(item.time) < today);

  if(start){
    const startDate=new Date(start + "T00:00:00+09:00");
    filtered=filtered.filter(item=> new Date(item.time) >= startDate);
  }
  if(end){
    const endDate=new Date(end + "T23:59:59+09:00");
    filtered=filtered.filter(item=> new Date(item.time) <= endDate);
  }

  renderData(filtered);
}

// 데이터 로드
async function loadData(){
  try{
    const res=await fetch(API_URL+"?action=list");
    let data=await res.json();
    if(!Array.isArray(data)) data=[];

    // 최신순 정렬
    data.sort((a,b)=>new Date(b.time)-new Date(a.time));
    allData=data;

    // 기본 날짜: 지난 7일 오늘 이전
    const today=new Date();
    const weekAgo=new Date(today.getTime()-7*24*60*60*1000);
    document.getElementById("startDate").value=weekAgo.toISOString().slice(0,10);
    document.getElementById("endDate").value=today.toISOString().slice(0,10);

    applyFilter();

  }catch(err){
    console.error(err);
    document.getElementById("listArea").innerText="❌ 데이터 불러오기 오류";
  }
}

initMap();
loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 산악사고 신고/접수/대응 상황판</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
#map{width:100%;height:350px;margin-bottom:15px;border-radius:6px;}

.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;cursor:pointer;}
.card.done{opacity:0.5;background:#2b2b2b;}

.stats{display:flex;gap:10px;margin-bottom:15px;font-size:16px;}
.stat-box{flex:1;padding:10px;border-radius:6px;background:#222;text-align:center;}
.stat-box span{font-size:24px;font-weight:bold;display:block;}

#filterBox{display:flex;gap:10px;margin-bottom:10px;align-items:center;justify-content:flex-end;}
#modalOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:9999;}
#modalContent{background:#222;padding:20px;border-radius:8px;max-width:400px;width:90%;}
#modalContent h3{margin-top:0;}
#closeModal{cursor:pointer;background:#e53935;border:none;padding:6px 12px;color:#fff;border-radius:4px;margin-top:10px;}

#sheetTableContainer{margin-top:20px;}
#sheetTable th, #sheetTable td{padding:6px;text-align:center;}
#sheetTable tr:nth-child(even){background:#1a1a1a;}
</style>
</head>

<body>

<!-- 🔐 비밀번호 잠금 화면 -->  
<div id="loginOverlay" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
flex-direction:column;
">
  <h2 style="margin-bottom:20px;">🔐 무등산특수구조팀 신고접수 접속인증</h2>
  <input type="password" id="passwordInput" placeholder="비밀번호 입력"
    style="width:250px;padding:10px;border-radius:6px;border:none;margin-bottom:10px;">
  <button onclick="checkPassword()">접속하기</button>
  <p id="loginError" style="color:red;margin-top:10px;"></p>
</div>  
  
<header>🆘 산악사고 신고/접수/대응 상황판</header>

<div class="container">
  <div id="filterBox">
    <label>시작일: <input type="date" id="startDate"></label>
    <label>종료일: <input type="date" id="endDate"></label>
    <button onclick="applyFilter()">조회</button>
    <button onclick="showTodayBefore()">오늘 이전만</button>
  </div>

  <div class="stats">
    <div class="stat-box">🚑 응급환자<span id="statEmergency">0</span></div>
    <div class="stat-box">🚓 구조출동<span id="statDispatch">0</span></div>
    <div class="stat-box">🆘 조난<span id="statLost">0</span></div>
    <div class="stat-box">✏ 기타<span id="statOther">0</span></div>
  </div>

  <div id="map"></div>
  <div id="listArea"></div>

  <div id="sheetTableContainer">
    <h3>📄 신고접수 저장자료</h3>
    <table id="sheetTable" border="1" style="width:100%;border-collapse:collapse;color:#fff;">
      <thead>
        <tr>
          <th>시간</th>
          <th>유형</th>
          <th>주소</th>
          <th>전화</th>
          <th>증상</th>
          <th>상태</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="modalOverlay">
  <div id="modalContent">
    <h3>상세 정보</h3>
    <div id="modalBody"></div>
    <button id="closeModal" onclick="closeModal()">닫기</button>
  </div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

let map, markers=[], allData=[];

function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });
}

function parseKST(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  if(isNaN(d)) return null;
  return new Date(d.getTime() + 9*60*60*1000);
}

function showModal(item){
  const modal=document.getElementById("modalOverlay");
  const body=document.getElementById("modalBody");
  body.innerHTML=`
    🕒 ${parseKST(item.time).toLocaleString()}<br>
    🚨 ${item.type}<br>
    🏠 ${item.address}<br>
    📞 ${item.phone ? item.phone.toString() : ''}<br>
    📝 ${item.symptom || ''}<br>
    상태: ${item.status || ''}<br>
  `;
  modal.style.display="flex";
}
function closeModal(){document.getElementById("modalOverlay").style.display="none";}

function renderData(data){
  document.getElementById("listArea").innerHTML="";
  markers.forEach(m=>m.setMap(null));
  markers=[];

  let bounds=new kakao.maps.LatLngBounds();
  let cntEmergency=0,cntDispatch=0,cntLost=0,cntOther=0;

  data.forEach(item=>{
    // lat/lng 필드 유연하게 처리
    const lat=parseFloat(item.lat || item.latitude);
    const lng=parseFloat(item.lng || item.longitude);

    if(!isNaN(lat) && !isNaN(lng)){
      const marker = new kakao.maps.Marker({
        map: map,
        position: new kakao.maps.LatLng(lat,lng)
      });
      marker.item=item;
      kakao.maps.event.addListener(marker,'click',()=>showModal(item));
      markers.push(marker);
      bounds.extend(marker.getPosition());
    }

    if(item.type==="응급환자") cntEmergency++;
    else if(item.type==="구조출동") cntDispatch++;
    else if(item.type==="조난") cntLost++;
    else cntOther++;

    const div=document.createElement("div");
    div.className="card"+(item.status==="사고처리완료"?" done":"");
    div.innerText=`${parseKST(item.time).toLocaleString()} | ${item.type} | ${item.address}`;
    div.onclick=()=>showModal(item);
    document.getElementById("listArea").appendChild(div);
  });

  if(markers.length>0) map.setBounds(bounds);

  document.getElementById("statEmergency").innerText=cntEmergency;
  document.getElementById("statDispatch").innerText=cntDispatch;
  document.getElementById("statLost").innerText=cntLost;
  document.getElementById("statOther").innerText=cntOther;

  renderTable(data);
}

function renderTable(data){
  const tbody=document.querySelector("#sheetTable tbody");
  tbody.innerHTML="";
  data.forEach(item=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${parseKST(item.time).toLocaleString()}</td>
      <td>${item.type}</td>
      <td>${item.address}</td>
      <td>${item.phone ? item.phone.toString() : ''}</td>
      <td>${item.symptom || ''}</td>
      <td>${item.status || ''}</td>
    `;
    tbody.appendChild(tr);
  });
}

async function loadData(){
  try{
    const res=await fetch(API_URL+"?action=list");
    let data=await res.json();
    console.log(data); // 데이터 확인
    if(!Array.isArray(data)) data=[];
    allData=data;
    renderData(allData);
  }catch(err){
    console.error(err);
    document.getElementById("listArea").innerText="❌ 불러오기 오류";
  }
}

function applyFilter(){
  let start=document.getElementById("startDate").value;
  let end=document.getElementById("endDate").value;
  let filtered=allData;

  if(start){
    const startDate=new Date(start + "T00:00:00");
    filtered=filtered.filter(item=>{
      const t=parseKST(item.time);
      return t && t >= startDate;
    });
  }
  if(end){
    const endDate=new Date(end + "T23:59:59");
    filtered=filtered.filter(item=>{
      const t=parseKST(item.time);
      return t && t <= endDate;
    });
  }

  renderData(filtered);
}

function showTodayBefore(){
  const today=new Date();
  today.setHours(0,0,0,0);
  const filtered=allData.filter(item=>{
    const t=parseKST(item.time);
    return t && t < today;
  });
  renderData(filtered);
}

// 초기화
initMap();
loadData();
setInterval(loadData,10000);
</script>
</body>
</html>

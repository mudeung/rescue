<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산특수구조팀 신고접수</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.form-box{background:#222;padding:12px;margin-bottom:15px;border-radius:6px;}
input,textarea{width:100%;padding:8px;margin-bottom:8px;border-radius:6px;border:none;}
button{padding:8px 12px;background:#e53935;color:#fff;border:none;border-radius:4px;cursor:pointer;}
#map{width:100%;height:320px;margin-bottom:15px;border-radius:6px;}

.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;}
.card.emergency{border-left:6px solid #ff1744;}
.card.overdue{background:#3a0000;}
</style>
</head>

<body>

<!-- 🔐 관리자 팝업 -->
<div id="adminModal" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.9);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
">
  <div style="background:#222;padding:20px;border-radius:10px;text-align:center;width:260px;">
    <h3>🔐 관리자 인증</h3>
    <input type="password" id="adminPw" placeholder="비밀번호 입력">
    <button onclick="adminLogin()">접속</button>
    <button onclick="skipLogin()" style="background:#555;margin-left:5px;">일반모드</button>
    <p id="adminError" style="color:red;"></p>
  </div>
</div>

<header>🆘 무등산특수구조팀 신고접수</header>

<div class="container">

<div id="map"></div>

<div class="form-box">
<textarea id="condition" placeholder="상황 입력"></textarea>
<input id="phone" placeholder="연락처">
<input id="address" placeholder="주소">
<input id="lat" placeholder="위도">
<input id="lng" placeholder="경도">
<button onclick="submitData()">신고접수</button>
</div>

<div id="listArea"></div>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

/* 관리자 */
const ADMIN_PASSWORD="1199";
let isAdmin=false;

function adminLogin(){
  const pw=document.getElementById("adminPw").value;
  const error=document.getElementById("adminError");

  if(pw===ADMIN_PASSWORD){
    isAdmin=true;
    sessionStorage.setItem("admin","true");
    document.getElementById("adminModal").style.display="none";
    loadData();
  }else{
    error.innerText="❌ 비밀번호 틀림";
  }
}

/* 일반모드 */
function skipLogin(){
  isAdmin=false;
  sessionStorage.removeItem("admin");
  document.getElementById("adminModal").style.display="none";
  loadData();
}

/* 자동 로그인 */
window.addEventListener("load",function(){
  if(sessionStorage.getItem("admin")==="true"){
    isAdmin=true;
    document.getElementById("adminModal").style.display="none";
  }
});

/* 지도 */
let map;
let markers=[];

function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });
}

/* 마커 초기화 */
function clearMarkers(){
  markers.forEach(m=>m.setMap(null));
  markers=[];
}

/* 신고 */
async function submitData(){
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      lat:lat.value,
      lng:lng.value,
      address:address.value,
      symptom:condition.value,
      phone:phone.value
    })
  });
  loadData();
}

/* 삭제 */
async function deleteCase(id){
  if(!isAdmin){alert("관리자만");return;}

  if(!confirm("삭제하시겠습니까?")) return;

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"delete",id,admin:true})
  });

  loadData();
}

/* 도착 */
async function completeCase(id){
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"complete",id})
  });
  loadData();
}

/* 완료 */
async function finishCase(id){
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"finish",id})
  });
  loadData();
}

/* 목록 */
async function loadData(){
  const res=await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"getData",admin:isAdmin})
  });

  const data=await res.json();
  listArea.innerHTML="";
  clearMarkers();

  data.forEach(item=>{

    /* 일반모드 → 완료 숨김 */
    if(!isAdmin && item.status==="완료") return;

    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      🏠 ${item.address || "주소없음"}<br>
      📝 ${item.symptom || "내용없음"}<br>
      상태: ${item.status}<br>

      ${
        item.status==="현장도착"
        ? `<button onclick="finishCase('${item.id}')">완료</button>`
        : `<button onclick="completeCase('${item.id}')">도착</button>`
      }

      ${isAdmin ? `<button onclick="deleteCase('${item.id}')">삭제</button>`:""}
    `;

    listArea.appendChild(div);

    /* 지도 마커 */
    if(item.lat && item.lng){
      const marker=new kakao.maps.Marker({
        map:map,
        position:new kakao.maps.LatLng(item.lat,item.lng)
      });
      markers.push(marker);
    }
  });
}

/* 실행 */
initMap();
loadData();
setInterval(loadData,5000);
</script>

</body>
</html>

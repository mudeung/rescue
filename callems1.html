<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚑 구조 상황판</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KEY&libraries=services"></script>

<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;}
header{background:#b71c1c;padding:15px;text-align:center;}
.container{padding:10px;}
.card{background:#1e1e1e;padding:10px;margin-bottom:8px;border-radius:6px;}
.card.done{opacity:0.6;}
.time{color:#ffcc00;font-size:13px;}
.elapsed{color:#00e676;}
button{padding:6px 10px;margin:3px;border:none;border-radius:4px;cursor:pointer;}
.complete-btn{background:#00c853;}
.finish-btn{background:#2962ff;}
.delete-btn{background:#d50000;}
.restore-btn{background:#00b0ff;}
</style>
</head>

<body>

<header>🚑 구조 상황판</header>

<div class="container">
<div id="listArea">로딩중...</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

let isAdmin=false;

/******** 관리자 ********/
function adminLogin(){
  if(prompt("관리자 비밀번호") === "rescue119"){
    isAdmin=true;
    alert("관리자 활성화");
    loadData();
  }
}

/******** 상태 변경 ********/
async function update(id,action){
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action,id})
  });
  loadData();
}

/******** 경과시간 ********/
function getElapsed(start,end){
  const s=new Date(start);
  const e=end ? new Date(end) : new Date();
  const diff=Math.floor((e-s)/1000);
  const m=Math.floor(diff/60);
  return `${m}분`;
}

/******** 목록 ********/
async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();

  const list=document.getElementById("listArea");
  list.innerHTML="";

  const ongoing = data
    .filter(i => i.status !== "완료" && i.status !== "삭제")
    .sort((a,b)=> new Date(b.time) - new Date(a.time));

  const finished = data
    .filter(i => i.status === "완료")
    .sort((a,b)=> new Date(b.finishTime||b.time) - new Date(a.finishTime||a.time));

  [...ongoing, ...finished].forEach(item=>{

    const div=document.createElement("div");
    div.className="card"+(item.status==="완료"?" done":"");

    div.innerHTML=`
    🕒 ${new Date(item.time).toLocaleString()}<br>
    ⏱ ${getElapsed(item.time,item.finishTime)}<br>
    🏠 ${item.address}<br>
    📞 ${item.phone}<br>
    📝 ${item.symptom}<br>

    ${
      item.status==="완료"
      ? ""
      : item.status==="현장도착"
      ? `<button class="finish-btn" onclick="update('${item.id}','finish')">완료</button>`
      : `<button class="complete-btn" onclick="update('${item.id}','complete')">도착</button>`
    }

    ${
      isAdmin
      ? `
      <button class="delete-btn" onclick="update('${item.id}','delete')">삭제</button>
      <button class="restore-btn" onclick="update('${item.id}','restore')">복구</button>
      `
      : ""
    }
    `;

    list.appendChild(div);
  });
}

/******** 실행 ********/
loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

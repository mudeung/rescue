<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산특수구조팀 실시간 산악사고 신고접수 (OCR 주소/전화 전용)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.form-box{background:#222;padding:12px;margin-bottom:15px;border-radius:6px;}
input,textarea{width:100%;padding:8px;margin-bottom:8px;border-radius:6px;border:none;}
button{padding:8px 12px;background:#e53935;color:#fff;border:none;border-radius:4px;cursor:pointer;}
#map{width:100%;height:320px;margin-bottom:15px;border-radius:6px;}
</style>
</head>

<body>

<header>🆘 무등산특수구조팀 실시간 산악사고 신고접수 (OCR 주소/전화 전용)</header>

<div class="container">

<div id="map"></div>

<div class="form-box">
<h3>📌 산악사고 구조/구급 신고접수</h3>

<input type="file" id="imageUpload" accept="image/*">
<div id="ocrStatus" style="font-size:12px;color:#ffcc00;"></div>

<textarea id="condition" placeholder="구조요청사항 / 사고내용 입력 (자동입력 안됨)"></textarea>
<input type="text" id="phone" placeholder="연락처 입력">
<input type="text" id="address" placeholder="신고장소 입력">
<input type="number" step="any" id="lat" placeholder="위도">
<input type="number" step="any" id="lng" placeholder="경도">

<button onclick="submitData()">구조요청 등록</button>
</div>

</div>

<script>

const API_URL="YOUR_SCRIPT_URL";

let map, geocoder, previewMarker;

const conditionEl=document.getElementById("condition");
const phoneEl=document.getElementById("phone");
const addressEl=document.getElementById("address");
const latEl=document.getElementById("lat");
const lngEl=document.getElementById("lng");

/* =========================
   지도 초기화
========================= */
function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });
  geocoder=new kakao.maps.services.Geocoder();
}
initMap();

/* =========================
   📷 OCR 처리
========================= */
document.getElementById("imageUpload").addEventListener("change",async function(e){

  const file=e.target.files[0];
  if(!file) return;

  document.getElementById("ocrStatus").innerText="📷 이미지 분석중...";

  const reader=new FileReader();

  reader.onload=async function(){

    const img=new Image();
    img.onload=async function(){

      const canvas=document.createElement("canvas");
      const ctx=canvas.getContext("2d");

      canvas.width=img.width;
      canvas.height=img.height;
      ctx.drawImage(img,0,0);

      preprocess(canvas);

      try{
        const { data:{text} } = await Tesseract.recognize(
          canvas,
          'kor+eng',
          { oem:1, psm:6 }
        );

        analyzeAndFill(text);

        document.getElementById("ocrStatus").innerText="✅ 주소/전화 자동입력 완료";

      }catch(err){
        console.error(err);
        document.getElementById("ocrStatus").innerText="❌ OCR 실패";
      }

    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
});

/* =========================
   이미지 전처리 (가독성 향상)
========================= */
function preprocess(canvas){
  const ctx=canvas.getContext("2d");
  const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
  const data=imgData.data;

  for(let i=0;i<data.length;i+=4){
    let gray=0.3*data[i]+0.59*data[i+1]+0.11*data[i+2];
    gray=(gray-128)*1.6+128;
    const value=gray>145?255:0;
    data[i]=data[i+1]=data[i+2]=value;
  }
  ctx.putImageData(imgData,0,0);
}

/* =========================
   주소 + 전화번호만 분석
========================= */
function analyzeAndFill(text){

  let cleaned=text
    .replace(/[Oo]/g,'0')
    .replace(/[Il]/g,'1')
    .replace(/\r/g,'')
    .trim();

  const lines=cleaned.split("\n")
    .map(l=>l.trim())
    .filter(l=>l.length>0);

  let detectedPhone="";
  let detectedAddress="";

  /* 전화번호 */
  const phoneRegex=/01\d[-\s]?\d{3,4}[-\s]?\d{4}/;

  for(let line of lines){
    const match=line.match(phoneRegex);
    if(match){
      let raw=match[0].replace(/\D/g,"");

      if(raw.length===11){
        detectedPhone=raw.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
      }else if(raw.length===10){
        detectedPhone=raw.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3');
      }
      break;
    }
  }

  /* 주소 */
  const addressRegex=/(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주).*?(시|군|구).*?(로|길|동|읍|면|리)\s?\d*/;

  for(let line of lines){
    const match=line.match(addressRegex);
    if(match){
      detectedAddress=match[0];
      break;
    }
  }

  if(detectedPhone) phoneEl.value=detectedPhone;

  if(detectedAddress){
    addressEl.value=detectedAddress;

    geocoder.addressSearch(detectedAddress,function(result,status){
      if(status===kakao.maps.services.Status.OK){
        const lat=parseFloat(result[0].y);
        const lng=parseFloat(result[0].x);

        latEl.value=lat;
        lngEl.value=lng;

        const pos=new kakao.maps.LatLng(lat,lng);
        map.setCenter(pos);
        map.setLevel(3);

        if(previewMarker) previewMarker.setMap(null);
        previewMarker=new kakao.maps.Marker({ map, position:pos });
      }
    });
  }
}

/* =========================
   등록
========================= */
async function submitData(){

  if(!conditionEl.value.trim()){
    alert("내용 입력 필수");
    return;
  }

  let lat=parseFloat(latEl.value),
      lng=parseFloat(lngEl.value);

  if(!lat || !lng){
    navigator.geolocation.getCurrentPosition(pos=>{
      sendData(pos.coords.latitude,pos.coords.longitude);
    });
    return;
  }

  sendData(lat,lng);
}

async function sendData(lat,lng){
  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body:JSON.stringify({
      lat,lng,
      address:addressEl.value,
      symptom:conditionEl.value,
      phone:phoneEl.value,
      kakaoMapURL:`https://map.kakao.com/link/map/구조요청 위치,${lat},${lng}`
    })
  });

  alert("등록 완료");

  conditionEl.value="";
  phoneEl.value="";
  addressEl.value="";
  latEl.value="";
  lngEl.value="";
}

</script>

</body>
</html>

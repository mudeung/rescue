<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산특수구조팀 현장 구조접수</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:18px;}
.container{padding:15px;}
.form-box{background:#222;padding:12px;margin-bottom:15px;border-radius:6px;}
input,textarea{width:100%;padding:8px;margin-bottom:8px;border-radius:6px;border:none;}
button{padding:10px;background:#e53935;color:#fff;border:none;border-radius:4px;cursor:pointer;width:100%;}
#map{width:100%;height:300px;margin-bottom:15px;border-radius:6px;}
#ocrStatus{font-size:12px;color:#ffcc00;}
</style>
</head>

<body>

<header>🆘 무등산특수구조팀 현장 구조접수</header>

<div class="container">

<div id="map"></div>

<div class="form-box">

<input type="file" id="imageUpload" accept="image/*">
<div id="ocrStatus"></div>

<textarea id="condition" placeholder="사고내용 입력"></textarea>
<input type="text" id="phone" placeholder="연락처 입력">
<input type="text" id="address" placeholder="신고장소 입력">
<input type="number" step="any" id="lat" placeholder="위도">
<input type="number" step="any" id="lng" placeholder="경도">

<button onclick="submitData()">구조요청 등록</button>

</div>
</div>

<script>

/* ===== Apps Script URL ===== */
const API_URL="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

/* ===== DOM ===== */
const conditionEl=document.getElementById("condition");
const phoneEl=document.getElementById("phone");
const addressEl=document.getElementById("address");
const latEl=document.getElementById("lat");
const lngEl=document.getElementById("lng");

/* ===== 지도 ===== */
let map, geocoder, marker;

function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });
  geocoder=new kakao.maps.services.Geocoder();
}
initMap();

/* ===== OCR ===== */
document.getElementById("imageUpload").addEventListener("change",async function(e){

  const file=e.target.files[0];
  if(!file) return;

  document.getElementById("ocrStatus").innerText="📷 분석중...";

  const reader=new FileReader();
  reader.onload=async function(){

    const img=new Image();
    img.onload=async function(){

      const canvas=document.createElement("canvas");
      const ctx=canvas.getContext("2d");

      canvas.width=img.width;
      canvas.height=img.height;
      ctx.drawImage(img,0,0);

      preprocess(canvas);

      try{
        const { data:{text} } = await Tesseract.recognize(
          canvas,'kor+eng',{oem:1,psm:6}
        );

        analyzeAndFill(text);
        document.getElementById("ocrStatus").innerText="✅ 자동 입력 완료";

      }catch(err){
        console.error(err);
        document.getElementById("ocrStatus").innerText="❌ OCR 실패";
      }
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
});

/* ===== OCR 전처리 ===== */
function preprocess(canvas){
  const ctx=canvas.getContext("2d");
  const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
  const data=imgData.data;

  for(let i=0;i<data.length;i+=4){
    let gray=0.3*data[i]+0.59*data[i+1]+0.11*data[i+2];
    gray=(gray-128)*1.6+128;
    const value=gray>145?255:0;
    data[i]=data[i+1]=data[i+2]=value;
  }
  ctx.putImageData(imgData,0,0);
}

/* ===== 핵심 분석 ===== */
function analyzeAndFill(text){

  let cleaned=text.replace(/\r/g,'').trim();
  const lines=cleaned.split("\n").map(l=>l.trim()).filter(l=>l);

  let phone="", address="", content="";

  /* 전화번호 */
  const phoneRegex=/01\d[-\s]?\d{3,4}[-\s]?\d{4}/;
  const phoneMatch=cleaned.match(phoneRegex);
  if(phoneMatch){
    let raw=phoneMatch[0].replace(/\D/g,"");
    phone=raw.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3');
  }

  /* 주소 */
  const addressRegex=/(광주|동구|북구|무등산|장불재|중머리재|용연동|금곡동).*/;
  for(let line of lines){
    const m=line.match(addressRegex);
    if(m){ address=m[0]; break; }
  }

  /* 내용 */
  content=cleaned
    .replace(phone,"")
    .replace(address,"")
    .trim();

  if(phone) phoneEl.value=phone;
  if(address) addressEl.value=address;
  if(content) conditionEl.value=content;
}

/* ===== 주소 → 좌표 ===== */
addressEl.addEventListener("change",function(){
  const address=this.value.trim();
  if(!address) return;

  geocoder.addressSearch(address,function(result,status){
    if(status===kakao.maps.services.Status.OK){

      const lat=parseFloat(result[0].y);
      const lng=parseFloat(result[0].x);

      latEl.value=lat;
      lngEl.value=lng;

      const pos=new kakao.maps.LatLng(lat,lng);
      map.setCenter(pos);
      map.setLevel(3);

      if(marker) marker.setMap(null);
      marker=new kakao.maps.Marker({map,position:pos});

    } else {
      alert("주소 검색 실패");
    }
  });
});

/* ===== 등록 ===== */
async function submitData(){

  if(!conditionEl.value.trim()){
    alert("사고내용 입력 필수");
    return;
  }

  let lat=parseFloat(latEl.value),
      lng=parseFloat(lngEl.value);

  if(!lat || !lng){
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(pos=>{
        sendData(pos.coords.latitude,pos.coords.longitude);
      });
      return;
    } else {
      alert("위치정보 필요");
      return;
    }
  }

  sendData(lat,lng);
}

async function sendData(lat,lng){

  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body:JSON.stringify({
      time:new Date().toISOString(),
      lat,lng,
      address:addressEl.value,
      symptom:conditionEl.value,
      phone:phoneEl.value
    })
  });

  alert("✅ 접수 완료");

  conditionEl.value="";
  phoneEl.value="";
  addressEl.value="";
  latEl.value="";
  lngEl.value="";
  if(marker) marker.setMap(null);
}

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산특수구조팀 신고접수</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.form-box{background:#222;padding:12px;margin-bottom:15px;border-radius:6px;}
input,textarea{width:100%;padding:8px;margin-bottom:8px;border-radius:6px;border:none;}
button{padding:8px 12px;background:#e53935;color:#fff;border:none;border-radius:4px;cursor:pointer;}
#map{width:100%;height:320px;margin-bottom:15px;border-radius:6px;}

.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;}
.card.done{opacity:0.6;background:#2b2b2b;}

.time{color:#ffcc00;font-size:14px;margin-bottom:4px;}

.card.emergency{border-left:6px solid #ff1744;}
.card.overdue{background:#3a0000;}

.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.type-btn{padding:12px;border-radius:8px;font-weight:bold;color:#fff;}
.type-btn.active{outline:3px solid #fff;}
.type-btn.emergency{background:#4a1c1c;}
.type-btn.dispatch{background:#1c2f4a;}
.type-btn.lost{background:#4a461c;}
.type-btn.other{background:#3a3a3a;}

/* 🔐 로그인 화면 */
#loginOverlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:#000;display:flex;justify-content:center;align-items:center;
flex-direction:column;z-index:9999;
}
</style>
</head>

<body>

<!-- 🔐 관리자 로그인 -->
<div id="loginOverlay">
  <h2>🔐 관리자 로그인</h2>
  <input type="password" id="adminPw" placeholder="비밀번호">
  <button onclick="login()">로그인</button>
  <p id="loginMsg" style="color:red;"></p>
</div>

<header>🆘 무등산특수구조팀 신고접수</header>

<div class="container">

<div id="map"></div>

<div class="form-box">
<div class="type-grid">
<button class="type-btn emergency" data-type="응급환자">🚑 응급환자</button>
<button class="type-btn dispatch" data-type="구조출동">🚓 구조출동</button>
<button class="type-btn lost" data-type="조난">🆘 조난</button>
<button class="type-btn other" data-type="기타">✏ 기타</button>
</div>

<textarea id="condition" placeholder="상황 입력"></textarea>
<input id="phone" placeholder="연락처">
<input id="address" placeholder="주소">
<input id="lat" placeholder="위도">
<input id="lng" placeholder="경도">

<button onclick="submitData()">신고접수</button>
</div>

<div id="listArea"></div>

</div>

<audio id="alertSound">
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

/* 🔐 관리자 인증 */
const ADMIN_PASSWORD="1234";
let isAdmin=false;

function login(){
  const pw=document.getElementById("adminPw").value;

  if(pw===ADMIN_PASSWORD){
    isAdmin=true;
    sessionStorage.setItem("admin","true");
    document.getElementById("loginOverlay").style.display="none";
  }else{
    document.getElementById("loginMsg").innerText="❌ 비밀번호 오류";
  }
}

/* 자동 로그인 유지 */
window.onload=function(){
  if(sessionStorage.getItem("admin")==="true"){
    isAdmin=true;
    document.getElementById("loginOverlay").style.display="none";
  }
};

let map;
let selectedType="";
let alerted=new Set();

const conditionEl=document.getElementById("condition");
const phoneEl=document.getElementById("phone");
const addressEl=document.getElementById("address");
const latEl=document.getElementById("lat");
const lngEl=document.getElementById("lng");
const listArea=document.getElementById("listArea");

/* 지도 */
function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });
}

/* 유형 선택 */
document.querySelectorAll(".type-btn").forEach(btn=>{
  btn.onclick=function(){
    document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
    this.classList.add("active");
    selectedType=this.dataset.type;
  };
});

/* 신고 */
async function submitData(){
  if(!selectedType){alert("유형 선택");return;}
  if(!conditionEl.value){alert("내용 입력");return;}

  navigator.geolocation.getCurrentPosition(pos=>{
    sendData(pos.coords.latitude,pos.coords.longitude);
  });
}

async function sendData(lat,lng){
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      lat,lng,
      type:selectedType,
      address:addressEl.value,
      symptom:conditionEl.value,
      phone:phoneEl.value
    })
  });
  loadData();
}

/* 경과시간 */
function getElapsed(start,end){
  const s=new Date(start);
  const e=end?new Date(end):new Date();
  return Math.floor((e-s)/60000)+"분";
}

/* 삭제 */
async function deleteCase(id){
  if(!isAdmin){
    alert("관리자만 가능");
    return;
  }

  if(!confirm("삭제?")) return;

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"delete",id})
  });
  loadData();
}

/* 상태 변경 */
async function completeCase(id){
  await fetch(API_URL,{method:"POST",body:JSON.stringify({action:"complete",id})});
  loadData();
}
async function finishCase(id){
  await fetch(API_URL,{method:"POST",body:JSON.stringify({action:"finish",id})});
  loadData();
}

/* 목록 */
async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();

  listArea.innerHTML="";

  data.forEach(item=>{

    // 🔥 완료 숨김
    if(item.status==="완료") return;

    const div=document.createElement("div");

    div.className="card";

    if(item.type==="응급환자") div.classList.add("emergency");

    div.innerHTML=`
      ${item.type}<br>
      ${item.address}<br>
      ${item.symptom}<br>
      상태:${item.status}<br>
      ⏱ ${getElapsed(item.time,item.finishTime)}<br>

      ${
        item.status==="현장도착"
        ? `<button onclick="finishCase('${item.id}')">완료</button>`
        : `<button onclick="completeCase('${item.id}')">도착</button>`
      }

      ${isAdmin ? `<button onclick="deleteCase('${item.id}')">🗑 삭제</button>` : ""}
    `;

    listArea.appendChild(div);

    if(item.lat && item.lng){
      new kakao.maps.Marker({
        map:map,
        position:new kakao.maps.LatLng(item.lat,item.lng)
      });
    }
  });
}

/* 실행 */
initMap();
loadData();
setInterval(loadData,5000);

</script>

</body>
</html>

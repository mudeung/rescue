<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산특수구조팀 신고현황</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body { margin:0; font-family:Arial; background:#111; color:#fff; }
header { background:#b71c1c; padding:15px; text-align:center; font-size:20px; }
.container { padding:15px; }
#map { width:100%; height:400px; margin-bottom:15px; border-radius:6px; }
.card { background:#1e1e1e; padding:12px; margin-bottom:10px; border-radius:6px; }
button { padding:6px 10px; margin:5px 5px 10px 0; border:none; border-radius:4px; cursor:pointer; }
#btnArea { margin-bottom:10px; }
</style>
</head>

<body>

<header>🆘 무등산특수구조팀 신고현황</header>

<div class="container">
  <div id="btnArea">
    <button onclick="loadData()">📥 구글 시트에서 불러오기</button>
    <button id="toggleAutoBtn" onclick="toggleAuto()">⏱ 자동 갱신 켜기</button>
  </div>
  <div id="map"></div>
  <div id="listArea"></div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

/* 지도 초기화 */
let map;
let markers=[];
let autoRefresh=true;
let refreshInterval;

function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });
  startAutoRefresh();
}

function clearMarkers(){
  markers.forEach(m=>m.setMap(null));
  markers=[];
}

/* 상태별 마커 이미지 */
function getMarkerImage(status){
  let imageUrl;
  switch(status){
    case "접수": imageUrl="https://i.ibb.co/yY8Lhwp/marker-blue.png"; break;
    case "현장도착": imageUrl="https://i.ibb.co/8BqF5kL/marker-yellow.png"; break;
    case "완료": imageUrl="https://i.ibb.co/S7VG1r9/marker-green.png"; break;
    default: imageUrl="https://i.ibb.co/yY8Lhwp/marker-blue.png";
  }
  return new kakao.maps.MarkerImage(imageUrl, new kakao.maps.Size(24,35));
}

/* 목록 불러오기 & 지도 마커 표시 */
async function loadData(){
  try {
    const res=await fetch(API_URL,{
      method:"POST",
      body:JSON.stringify({action:"getData"})
    });
    const data=await res.json();
    const listArea=document.getElementById("listArea");
    listArea.innerHTML="";
    clearMarkers();

    if(!data.length){ listArea.innerHTML="현재 접수된 신고가 없습니다."; return; }

    data.forEach(item=>{
      // 카드 생성
      const div=document.createElement("div");
      div.className="card";
      div.innerHTML=` 
        🏠 ${item.address || "주소없음"}<br>
        📝 ${item.symptom || "내용없음"}<br>
        상태: ${item.status}<br>
        ${item.completeTime ? `🚑 현장도착: ${new Date(item.completeTime).toLocaleString()}<br>` : ""}
        ${item.finishTime ? `✅ 사고처리 완료: ${new Date(item.finishTime).toLocaleString()}` : ""}
      `;
      listArea.appendChild(div);

      // 지도 마커
      if(item.lat && item.lng){
        const position = new kakao.maps.LatLng(item.lat,item.lng);
        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          image: getMarkerImage(item.status)
        });

        const info = new kakao.maps.InfoWindow({
          content:`<div style="padding:6px; max-width:200px;">
                    <strong>주소:</strong> ${item.address || "없음"}<br>
                    <strong>상황:</strong> ${item.symptom || "없음"}<br>
                    <strong>상태:</strong> ${item.status}
                  </div>`
        });

        kakao.maps.event.addListener(marker, 'click', function() {
          info.open(map, marker);
        });

        markers.push(marker);
      }
    });
  } catch(e){
    console.error("데이터 불러오기 실패:", e);
  }
}

/* 자동 갱신 */
function startAutoRefresh(){
  if(refreshInterval) clearInterval(refreshInterval);
  refreshInterval=setInterval(()=>{
    if(autoRefresh) loadData();
  },5000);
}

function toggleAuto(){
  autoRefresh=!autoRefresh;
  document.getElementById("toggleAutoBtn").innerText=autoRefresh ? "⏱ 자동 갱신 켜기" : "⏱ 자동 갱신 끄기";
}

/* 초기 실행 */
initMap();
loadData();
</script>

</body>
</html>

<script>

/* =====================================================

===================================================== */

const ACCIDENT_API_URL =
"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

/* =====================================================

/* =====================================================

===================================================== */

const map =

/* =====================================================
   MAP TILE
===================================================== */

const osm =

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            attribution:

const topo =

===================================================== */

/* =====================================================
   COORDINATE
===================================================== */

const coordControl =

coordControl.onAdd =

/* =====================================================
   STATUS
===================================================== */

/* =====================================================
   ALERT
===================================================== */

function playAlert(){

    try{

        alertSound.currentTime =
            0;


        const promise =
            alertSound.play();


        if(

            promise &&
            typeof promise.catch ===
            "function"

/* =====================================================
   POST
===================================================== */

async function postAccident(
    payload
){

    const response =
        await fetch(

            ACCIDENT_API_URL,

            {

                method:"POST",

                headers:{

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify(
                        payload
                    )

            }

        );


    const text =
        await response.text();


    let data;


    try{

        data =
            JSON.parse(text);

    }
    catch(e){

        data = {

            result:
                response.ok
                ? "success"
                : "error",

            message:text

        };

    }


    if(!response.ok){

        throw new Error(

            data.message ||

            "HTTP " +
            response.status

        );

    }


    return data;

}


/* =====================================================
   GET
===================================================== */

async function getAccidents(){

    const response =
        await fetch(

            ACCIDENT_API_URL +
            "?action=list&t=" +
            Date.now(),

            {

                method:"GET",

                cache:"no-store"

            }

        );


    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    if(Array.isArray(data)){

        return data;

    }


    if(
        data &&
        Array.isArray(data.data)
    ){

        return data.data;

    }


    if(
        data &&
        Array.isArray(data.items)
    ){

        return data.items;

    }


    if(
        data &&
        Array.isArray(data.rows)
    ){

        return data.rows;

    }


    return [];

}


/* =====================================================
   FIELD
===================================================== */

function getField(
    item,
    names
){

    for(
        const name of names
    ){

        if(

            item &&
            item[name] !== undefined &&
            item[name] !== null &&
            String(
                item[name]
            ).trim() !== ""

        ){

            return item[name];

        }

    }


    return "";

}


/* =====================================================
   ID
===================================================== */

function getAccidentId(
    item,
    index
){

    const value =
        getField(

            item,

            [

                "id",
                "ID",
                "caseId",
                "caseID",
                "사고ID"

            ]

        );


    if(value !== ""){

        return String(value);

    }


    const createdAt =
        getField(

            item,

            [

                "createdAt",
                "timestamp",
                "접수시간"

            ]

        );


    const address =
        getField(

            item,

            [

                "address",
                "주소"

            ]

        );


    return (

        String(createdAt) +
        "|" +
        String(address) +
        "|" +
        String(index)

    );

}


/* =====================================================
   START TIME
===================================================== */

function getStartTime(
    item
){

    return getField(

        item,

        [

            "startTime",
            "createdAt",
            "timestamp",
            "time",
            "date",
            "접수시간"

        ]

    );

}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(
    value
){

    const status =
        String(
            value || ""
        )
        .trim()
        .toUpperCase();


    if(

        status === "DONE" ||
        status === "완료" ||
        status === "처리완료" ||
        status === "사고처리완료"

    ){

        return "DONE";

    }


    if(

        status === "ARRIVED" ||
        status === "도착" ||
        status === "현장도착"

    ){

        return "ARRIVED";

    }


    return "RECEIVED";

}


/* =====================================================
   ELAPSED
===================================================== */

function getElapsedTime(
    startTime,
    endTime
){

    if(!startTime){

        return "-";

    }


    const start =
        new Date(
            startTime
        );


    if(
        Number.isNaN(
            start.getTime()
        )
    ){

        return "-";

    }


    const end =
        endTime
        ? new Date(endTime)
        : new Date();


    if(
        Number.isNaN(
            end.getTime()
        )
    ){

        return "-";

    }


    let diff =
        Math.floor(

            (

                end.getTime() -
                start.getTime()

            ) / 1000

        );


    if(diff < 0){

        diff = 0;

    }


    const hour =
        Math.floor(
            diff / 3600
        );


    diff %= 3600;


    const minute =
        Math.floor(
            diff / 60
        );


    const second =
        diff % 60;


    return (

        String(hour)
        .padStart(2,"0") +

        ":" +

        String(minute)
        .padStart(2,"0") +

        ":" +

        String(second)
        .padStart(2,"0")

    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /\\/g,
        "\\\\"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    );

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJS(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /\\/g,
        "\\\\"
    )

    .replace(
        /'/g,
        "\\'"
    )

    .replace(
        /\r/g,
        "\\r"
    )

    .replace(
        /\n/g,
        "\\n"
    );

}


/* =====================================================
   FOCUS ACCIDENT
===================================================== */

function focusAccident(
    lat,
    lng
){

    lat =
        Number(lat);

    lng =
        Number(lng);


    if(

        !Number.isFinite(lat) ||
        !Number.isFinite(lng)

    ){

        return;

    }


    map.setView(
        [lat,lng],
        17
    );

}


/* =====================================================
   SHARE LOCATION
===================================================== */

async function shareAccidentLocation(

    lat,
    lng,
    address,
    type

){

    lat =
        Number(lat);

    lng =
        Number(lng);


    if(

        !Number.isFinite(lat) ||
        !Number.isFinite(lng)

    ){

        alert(
            "사고 위치 좌표가 없습니다."
        );

        return;

    }


    const kakaoMapURL =

        "https://map.kakao.com/link/map/" +

        lat +
        "," +
        lng;


    const shareText =

        "🆘 사고 위치 공유\n\n" +

        "유형: " +
        (type || "기타") +

        "\n" +

        "주소: " +
        (address || "-") +

        "\n" +

        "위도: " +
        lat.toFixed(6) +

        "\n" +

        "경도: " +
        lng.toFixed(6) +

        "\n\n" +

        "지도:\n" +

        kakaoMapURL;


    /*
     * 모바일 공유
     */

    if(
        navigator.share
    ){

        try{

            await navigator.share({

                title:
                    "🆘 사고 위치 공유",

                text:
                    shareText,

                url:
                    kakaoMapURL

            });

            return;

        }
        catch(err){

            if(
                err &&
                err.name === "AbortError"
            ){

                return;

            }

        }

    }


    /*
     * 클립보드
     */

    try{

        await navigator.clipboard.writeText(
            shareText
        );


        alert(
            "📍 사고 위치 정보가 클립보드에 복사되었습니다."
        );

    }
    catch(err){

        prompt(

            "📍 사고 위치 공유 링크를 복사하세요.",

            kakaoMapURL

        );

    }

}


/* =====================================================
   UPDATE STATUS
===================================================== */

async function updateAccidentStatus(

    caseId,
    newStatus

){

    const status =
        normalizeStatus(
            newStatus
        );


    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    let message = "";

    let action = "";


    if(
        status === "ARRIVED"
    ){

        message =
            "🚓 현장 도착으로 변경하시겠습니까?";

        action =
            "complete";

    }


    else if(
        status === "DONE"
    ){

        message =
            "✅ 구조 완료로 변경하시겠습니까?";

        action =
            "finish";

    }


    else{

        return;

    }


    if(
        !confirm(message)
    ){

        return;

    }


    try{

        const result =
            await postAccident({

                action:
                    action,

                id:
                    String(caseId)

            });


        if(

            !result ||
            result.result !== "success"

        ){

            throw new Error(

                result &&
                result.message

                ?

                result.message

                :

                "상태 변경 실패"

            );

        }


        if(
            status === "ARRIVED"
        ){

            alert(
                "🚓 현장 도착 처리 완료"
            );

        }
        else{

            alert(
                "✅ 구조 완료 처리 완료"
            );

        }


        await loadAccidents();

    }
    catch(err){

        console.error(
            "상태 변경 오류:",
            err
        );


        alert(

            "❌ 상태 변경 실패\n\n" +
            err.message

        );

    }

}

            item,

            [

                "symptom",

        );


    const phone =
        getField(

            item,

            [

                "phone",
                "tel",
                "telephone",
                "연락처"

            ]

        );


    const kakaoMapURL =
        getField(

            item,

            [

                "kakaoMapURL",
                "kakaoUrl",
                "mapUrl",
                "지도URL"

            ]

        );


    const elapsed =
        getElapsedTime(

            startTime,

            endTime || null

        );


    let statusText =
        "접수";

    let statusClass =
        "popup-received";


    if(
        status === "ARRIVED"
    ){

        statusText =
            "현장도착";

        statusClass =
            "popup-arrived";

    }


    if(
        status === "DONE"
    ){

        statusText =
            "처리완료";

        statusClass =
            "popup-done";

    }


    let typeIcon =
        "🆘";


    if(
        type === "응급환자"
    ){

        typeIcon =
            "🚑";

    }
    else if(
        type === "구조출동"
    ){

        typeIcon =
            "🚓";

    }
    else if(
        type === "조난"
    ){

        typeIcon =
            "🆘";

    }
    else if(
        type === "기타"
    ){

        typeIcon =
            "✏️";

    }


    let html = `

        <div class="accident-popup">

            <div class="accident-popup-header">

                ${typeIcon}

                산악사고 신고

            </div>


            <div class="accident-row">

                <span class="accident-label">
                    신고유형
                </span>

                <br>

                <span class="accident-value">
                    ${escapeHTML(type)}
                </span>

            </div>


            <div class="accident-row">

                <span class="accident-label">
                    상태
                </span>

                <br>

                <span
                    class="popup-status ${statusClass}"
                >

                    ${statusText}

                </span>

            </div>


            <div class="accident-row">

                <span class="accident-label">
                    사고상황
                </span>

                <br>

                <span class="accident-value">
                    ${escapeHTML(
                        symptom || "-"
                    )}
                </span>

            </div>


            <div class="accident-row">

                <span class="accident-label">
                    주소
                </span>

                <br>

                <span class="accident-value">
                    ${escapeHTML(
                        address || "-"
                    )}
                </span>

            </div>


            <div class="accident-row">

                <span class="accident-label">
                    접수시간
                </span>

                <br>

                <span class="accident-value">
                    ${escapeHTML(
                        startTime || "-"
                    )}
                </span>

            </div>


            <div class="accident-row">

                <span class="accident-label">
                    경과시간
                </span>

                <br>

                <span class="accident-value">
                    ${escapeHTML(
                        elapsed
                    )}
                </span>

            </div>


            ${
                endTime

                ?

                `

                <div class="accident-row">

                    <span class="accident-label">
                        완료시간
                    </span>

                    <br>

                    <span class="accident-value">
                        ${escapeHTML(
                            endTime
                        )}
                    </span>

                </div>

                `

                :

                ""

            }


            ${
                Number.isFinite(lat) &&
                Number.isFinite(lng)

                ?

                `

                <div class="accident-row">

                    <span class="accident-label">
                        좌표
                    </span>

                    <br>

                    <span class="accident-value">

                        ${lat.toFixed(6)}

                        ,

                        ${lng.toFixed(6)}

                    </span>

                </div>

                `

                :

                ""

            }


            ${
                phone

                ?

                `

                <a

                    href="tel:${escapeAttribute(phone)}"

                    class="
                        popup-btn
                        popup-phone
                    "

                >

                    📞 신고자 전화

                </a>

                `

                :

                ""

            }


            ${
                kakaoMapURL

                ?

                `

                <a

                    href="${escapeAttribute(
                        kakaoMapURL
                    )}"

                    target="_blank"

                    rel="noopener"

                    class="
                        popup-btn
                        popup-map
                    "

                >

                    🗺 카카오지도 열기

                </a>

                `

                :

                (

                    Number.isFinite(lat) &&
                    Number.isFinite(lng)

                    ?

                    `

                    <a

                        href="
                            https://map.kakao.com/link/map/${lat},${lng}
                        "

                        target="_blank"

                        rel="noopener"

                        class="
                            popup-btn
                            popup-map
                        "

                    >

                        🗺 카카오지도 열기

                    </a>

                    `

                    :

                    ""

                )

            }


            ${
                Number.isFinite(lat) &&
                Number.isFinite(lng)

                ?

                `

                <button

                    type="button"

                    class="
                        popup-btn
                        popup-share
                    "

                    onclick="
                        shareAccidentLocation(
                            ${lat},
                            ${lng},
                            '${escapeJS(address)}',
                            '${escapeJS(type)}'
                        )
                    "

                >

                    📍 사고 핀 위치 공유

                </button>

                `

                :

                ""

            }


            ${
                status === "RECEIVED"

                ?

                `

                <button

                    type="button"

                    class="
                        popup-btn
                        popup-arrive
                    "

                    onclick="
                        updateAccidentStatus(
                            '${escapeJS(id)}',
                            'ARRIVED'
                        )
                    "

                >

                    🚓 현장 도착

                </button>

                `

                :

                ""

            }


            ${
                status === "ARRIVED"

                ?

                `

                <button

                    type="button"

                    class="
                        popup-btn
                        popup-complete
                    "

                    onclick="
                        updateAccidentStatus(
                            '${escapeJS(id)}',
                            'DONE'
                        )
                    "

                >

                    ✅ 구조 완료

                </button>

                `

                :

                ""

            }

        </div>

    `;


    return html;

}


/* =====================================================
   RENDER MAP
===================================================== */

function renderAccidents(
    data
){

    accidentLayer.clearLayers();


    const rows =
        [...data].sort(

            function(a,b){

                const ta =
                    new Date(
                        getStartTime(a)
                    ).getTime();


                const tb =
                    new Date(
                        getStartTime(b)
                    ).getTime();


                if(
                    Number.isNaN(ta)
                ){

                    return 1;

                }


                if(
                    Number.isNaN(tb)
                ){

                    return -1;

                }


                return tb - ta;

            }

        );


    let activeCount =
        0;


    rows.forEach(

        function(item,index){

            const id =
                getAccidentId(
                    item,
                    index
                );


            const status =
                normalizeStatus(

                    getField(

                        item,

                        [

                            "status",
                            "state",
                            "상태",
                            "처리상태"

                        ]

                    )

                );


            const startTime =
                getStartTime(
                    item
                );


            const lat =
                Number(

                    getField(

                        item,

                        [

                            "lat",
                            "latitude",
                            "위도"

                        ]

                    )

                );


            const lng =
                Number(

                    getField(

                        item,

                        [

                            "lng",
                            "longitude",
                            "경도"

                        ]

                    )

                );


            if(

                !Number.isFinite(lat) ||
                !Number.isFinite(lng)

            ){

                return;

            }


            activeCount++;


            /*
             * 10분 이상 미처리
             */

            let overdue =
                false;


            if(

                status === "RECEIVED" &&
                startTime

            ){

                const start =
                    new Date(
                        startTime
                    ).getTime();


                if(
                    Number.isFinite(start)
                ){

                    overdue =

                        (

                            Date.now() -
                            start

                        ) / 60000 >= 10;

                }

            }


            /*
             * 마커 색상
             */

            let markerColor =
                "red";


            if(
                status === "ARRIVED"
            ){

                markerColor =
                    "orange";

            }


            if(
                status === "DONE"
            ){

                markerColor =
                    "#777";

            }


            /*
             * 미처리 10분 이상
             */

            if(
                overdue &&
                status === "RECEIVED"
            ){

                markerColor =
                    "#ff0000";

            }


            /*
             * Marker
             */

            const marker =
                L.circleMarker(

                    [lat,lng],

                    {

                        radius:
                            status === "DONE"
                            ? 8
                            : 12,

                        color:
                            markerColor,

                        fillColor:
                            markerColor,

                        fillOpacity:
                            .9,

                        weight:
                            3

                    }

                );


            /*
             * Popup
             */

            marker.bindPopup(

                createAccidentPopup(
                    item,
                    index
                ),

                {

                    maxWidth:
                        360,

                    closeButton:
                        true

                }

            );


            /*
             * 클릭 시 확대
             */

            marker.on(

                "click",

                function(){

                    map.setView(

                        [lat,lng],

                        Math.max(
                            map.getZoom(),
                            16
                        ),

                        {

                            animate:true

                        }

                    );

                }

            );


            marker.addTo(
                accidentLayer
            );


            /*
             * 신규 사고 알림
             */

            if(

                !firstLoad &&
                !knownIds.has(id)

            ){

                playAlert();

            }


            /*
             * 10분 이상 미처리 알림
             */

            if(

                overdue &&
                !alertedOverdueIds.has(id)

            ){

                alertedOverdueIds.add(id);


                if(!firstLoad){

                    playAlert();

                }

            }


            knownIds.add(id);

        }

    );


    const currentTime =
        new Date()
        .toLocaleTimeString(
            "ko-KR"
        );


    setTopStatus(

        "📡 사고정보 " +
        activeCount +
        "건 · 마지막 조회 " +
        currentTime

    );


    firstLoad =
        false;

}


/* =====================================================
   LOAD
===================================================== */

async function loadAccidents(){

    if(accidentLoading){

        return;

    }


    accidentLoading =
        true;


    setTopStatus(
        "🔄 사고정보 조회중..."
    );


    try{

        const rows =
            await getAccidents();


        renderAccidents(
            rows
        );

    }
    catch(err){

        console.error(
            "사고 목록 조회 오류:",
            err
        );


        setTopStatus(

            "⚠ 사고정보 조회 오류: " +
            err.message,

            true

        );

    }
    finally{

        accidentLoading =
            false;

    }

}


/* =====================================================
   AUTO REFRESH
===================================================== */

function startAccidentAutoRefresh(){

    if(accidentTimer){

        clearInterval(
            accidentTimer
        );

    }


    loadAccidents();


    accidentTimer =

        setInterval(

            function(){

                if(
                    !document.hidden
                ){

                    loadAccidents();

                }

            },

            5000

        );

}


/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(

    "visibilitychange",

    function(){

        if(
            !document.hidden
        ){

            loadAccidents();

        }

    }

);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

    "resize",

    function(){

        setTimeout(

            function(){

                map.invalidateSize();

            },

            100

        );

    }

);


/* =====================================================
   KEYBOARD REFRESH
===================================================== */

document.addEventListener(

    "keydown",

    function(e){

        /*
         * Ctrl + Shift + R
         */

        if(

            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "r"

        ){

            e.preventDefault();

            loadAccidents();

        }

    }

);


/* =====================================================
   INITIALIZE
===================================================== */

window.addEventListener(

    "load",

    function(){

        startAccidentAutoRefresh();


        setTimeout(

            function(){

                map.invalidateSize();

            },

            500

        );

    }

);

</script>

<script>


/* =====================================================
   API
===================================================== */

const ACCIDENT_API_URL =
"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


/* =====================================================
   STATE
===================================================== */

let accidentTimer = null;

let accidentLoading = false;

let firstLoad = true;

let knownIds = new Set();

let alertedOverdueIds = new Set();


/* =====================================================
   MAP
===================================================== */

const map =
    L.map("map")
    .setView(
        [35.1345,126.9902],
        13
    );


/* =====================================================
   MAP TILE
===================================================== */

const osm =
    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

            maxZoom:19,

            attribution:
                "&copy; OpenStreetMap contributors"

        }

    );


const topo =
    L.tileLayer(

        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",

        {

            maxZoom:17,

            attribution:
                "&copy; OpenTopoMap"

        }

    );


const satellite =
    L.tileLayer(

        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

        {

            maxZoom:19,

            attribution:
                "Tiles &copy; Esri"

        }

    );


osm.addTo(map);


L.control.layers({

    "🗺 일반지도":osm,

    "⛰ 지형지도":topo,

    "🛰 위성지도":satellite

}).addTo(map);


/* =====================================================
   COORDINATE CONTROL
===================================================== */

const coordControl =
    L.control({

        position:"bottomleft"

    });


coordControl.onAdd =
function(){

    this._div =
        L.DomUtil.create(
            "div",
            "mouse-coords"
        );


    this._div.innerHTML =
        "Lat : --<br>Lng : --";


    return this._div;

};


coordControl.addTo(map);


map.on(
    "mousemove",
    function(e){

        coordControl._div.innerHTML =

            "Lat : " +
            e.latlng.lat.toFixed(6) +

            "<br>Lng : " +
            e.latlng.lng.toFixed(6);

    }
);


map.on(
    "mouseout",
    function(){

        coordControl._div.innerHTML =
            "Lat : --<br>Lng : --";

    }
);


/* =====================================================
   ACCIDENT LAYER
===================================================== */

const accidentLayer =
    L.layerGroup()
    .addTo(map);


/* =====================================================
   ALERT SOUND
===================================================== */

const alertSound =
    new Audio(
        "https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
    );


function playAlert(){

    try{

        alertSound.currentTime = 0;

        const promise =
            alertSound.play();


        if(promise){

            promise.catch(
                function(){

                    console.log(
                        "브라우저 자동재생 정책으로 알림음이 차단되었습니다."
                    );

                }
            );

        }

    }
    catch(err){

        console.error(
            "알림음 오류:",
            err
        );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value){

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJS(value){

    return String(value ?? "")

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /\r/g,
            "\\r"
        )

        .replace(
            /\n/g,
            "\\n"
        );

}


/* =====================================================
   FIELD
===================================================== */

function getField(
    item,
    names
){

    for(
        const name of names
    ){

        if(

            item &&
            item[name] !== undefined &&
            item[name] !== null &&
            String(item[name]).trim() !== ""

        ){

            return item[name];

        }

    }


    return "";

}


/* =====================================================
   ACCIDENT ID
===================================================== */

function getAccidentId(
    item,
    index
){

    const value =
        getField(

            item,

            [

                "id",

                "ID",

                "caseId",

                "caseID",

                "사고ID"

            ]

        );


    if(value !== ""){

        return String(value);

    }


    return (

        String(

            getField(

                item,

                [

                    "createdAt",

                    "timestamp",

                    "접수시간"

                ]

            )

        )

        +

        "|"

        +

        String(

            getField(

                item,

                [

                    "address",

                    "주소"

                ]

            )

        )

        +

        "|"

        +

        String(index)

    );

}


/* =====================================================
   START TIME
===================================================== */

function getStartTime(item){

    return getField(

        item,

        [

            "startTime",

            "createdAt",

            "timestamp",

            "time",

            "date",

            "접수시간"

        ]

    );

}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(value){

    const status =

        String(value || "")

        .trim()

        .toUpperCase();


    if(

        status === "DONE" ||

        status === "완료" ||

        status === "처리완료" ||

        status === "사고처리완료"

    ){

        return "DONE";

    }


    if(

        status === "ARRIVED" ||

        status === "도착" ||

        status === "현장도착"

    ){

        return "ARRIVED";

    }


    return "RECEIVED";

}


/* =====================================================
   ELAPSED TIME
===================================================== */

function getElapsedTime(
    startTime,
    endTime
){

    if(!startTime){

        return "-";

    }


    const start =
        new Date(startTime);


    if(
        Number.isNaN(
            start.getTime()
        )
    ){

        return "-";

    }


    const end =
        endTime
        ? new Date(endTime)
        : new Date();


    if(
        Number.isNaN(
            end.getTime()
        )
    ){

        return "-";

    }


    let diff =

        Math.floor(

            (

                end.getTime() -

                start.getTime()

            ) / 1000

        );


    if(diff < 0){

        diff = 0;

    }


    const hour =
        Math.floor(
            diff / 3600
        );


    diff %= 3600;


    const minute =
        Math.floor(
            diff / 60
        );


    const second =
        diff % 60;


    return (

        String(hour)
        .padStart(2,"0")

        +

        ":"

        +

        String(minute)
        .padStart(2,"0")

        +

        ":"

        +

        String(second)
        .padStart(2,"0")

    );

}


/* =====================================================
   FOCUS ACCIDENT
===================================================== */

function focusAccident(
    lat,
    lng
){

    lat =
        Number(lat);

    lng =
        Number(lng);


    if(

        !Number.isFinite(lat) ||

        !Number.isFinite(lng)

    ){

        return;

    }


    map.setView(

        [lat,lng],

        17,

        {

            animate:true,

            duration:1

        }

    );

}


/* =====================================================
   SHARE LOCATION
===================================================== */

async function shareAccidentLocation(
    lat,
    lng,
    address
){

    const url =

        "https://map.kakao.com/link/map/" +

        lat +

        "," +

        lng;


    const text =

        "🆘 사고 신고 위치\n" +

        "주소: " +

        (address || "-") +

        "\n" +

        "지도: " +

        url;


    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    "🆘 사고 신고 위치",

                text:
                    text,

                url:
                    url

            });

        }

        else if(
            navigator.clipboard
        ){

            await navigator.clipboard.writeText(
                text
            );


            alert(
                "📍 사고 위치 정보가 복사되었습니다."
            );

        }

        else{

            prompt(
                "📍 사고 위치 공유",
                text
            );

        }

    }

    catch(err){

        console.log(
            "공유 취소 또는 오류",
            err
        );

    }

}


/* =====================================================
   POST API
===================================================== */

async function postAccident(payload){

    const response =

        await fetch(

            ACCIDENT_API_URL,

            {

                method:"POST",

                headers:{

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify(payload)

            }

        );


    const text =
        await response.text();


    let data;


    try{

        data =
            JSON.parse(text);

    }

    catch(e){

        data = {

            result:
                response.ok
                ? "success"
                : "error",

            message:text

        };

    }


    if(!response.ok){

        throw new Error(

            data.message ||

            "HTTP " +
            response.status

        );

    }


    return data;

}


/* =====================================================
   GET API
===================================================== */

async function getAccidents(){

    const response =

        await fetch(

            ACCIDENT_API_URL +

            "?action=list&t=" +

            Date.now(),

            {

                method:"GET",

                cache:"no-store"

            }

        );


    if(!response.ok){

        throw new Error(

            "HTTP " +
            response.status

        );

    }


    const data =
        await response.json();


    if(
        Array.isArray(data)
    ){

        return data;

    }


    if(

        data &&

        Array.isArray(data.data)

    ){

        return data.data;

    }


    if(

        data &&

        Array.isArray(data.items)

    ){

        return data.items;

    }


    if(

        data &&

        Array.isArray(data.rows)

    ){

        return data.rows;

    }


    return [];

}


/* =====================================================
   UPDATE STATUS
===================================================== */

async function updateAccidentStatus(
    caseId,
    newStatus
){

    const status =
        normalizeStatus(
            newStatus
        );


    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    let action = "";

    let message = "";


    if(
        status === "ARRIVED"
    ){

        action =
            "complete";

        message =
            "🚓 현장 도착으로 변경하시겠습니까?";

    }

    else if(
        status === "DONE"
    ){

        action =
            "finish";

        message =
            "✅ 구조 완료로 변경하시겠습니까?";

    }

    else{

        return;

    }


    if(!confirm(message)){

        return;

    }


    try{

        const result =
            await postAccident({

                action:action,

                id:String(caseId)

            });


        if(

            !result ||

            result.result !== "success"

        ){

            throw new Error(

                result &&
                result.message

                ?

                result.message

                :

                "상태 변경 실패"

            );

        }


        await loadAccidents();

    }

    catch(err){

        console.error(
            "상태 변경 오류:",
            err
        );


        alert(

            "❌ 상태 변경 실패\n\n" +

            err.message

        );

    }

}


/* =====================================================
   RENDER ACCIDENTS
===================================================== */

function renderAccidents(
    data
){

    accidentLayer.clearLayers();


    const rows =

        [...data].sort(

            function(a,b){

                const ta =

                    new Date(
                        getStartTime(a)
                    ).getTime();


                const tb =

                    new Date(
                        getStartTime(b)
                    ).getTime();


                if(
                    Number.isNaN(ta)
                ){

                    return 1;

                }


                if(
                    Number.isNaN(tb)
                ){

                    return -1;

                }


                return tb - ta;

            }

        );


    rows.forEach(

        function(item,index){

            /* -----------------------------------------
               ID
            ----------------------------------------- */

            const id =

                getAccidentId(
                    item,
                    index
                );


            /* -----------------------------------------
               STATUS
            ----------------------------------------- */

            const status =

                normalizeStatus(

                    getField(

                        item,

                        [

                            "status",

                            "state",

                            "상태",

                            "처리상태"

                        ]

                    )

                );


            /* -----------------------------------------
               TIME
            ----------------------------------------- */

            const startTime =
                getStartTime(item);


            const endTime =

                getField(

                    item,

                    [

                        "finishTime",

                        "endTime",

                        "completedAt",

                        "doneAt",

                        "완료시간"

                    ]

                );


            /* -----------------------------------------
               LOCATION
            ----------------------------------------- */

            const lat =

                Number(

                    getField(

                        item,

                        [

                            "lat",

                            "latitude",

                            "위도"

                        ]

                    )

                );


            const lng =

                Number(

                    getField(

                        item,

                        [

                            "lng",

                            "longitude",

                            "경도"

                        ]

                    )

                );


            /* -----------------------------------------
               INFORMATION
            ----------------------------------------- */

            const address =

                getField(

                    item,

                    [

                        "address",

                        "주소",

                        "location",

                        "장소"

                    ]

                );


            const type =

                getField(

                    item,

                    [

                        "type",

                        "accidentType",

                        "신고유형",

                        "유형"

                    ]

                ) ||

                "기타";


            const symptom =

                getField(

                    item,

                    [

                        "symptom",

                        "condition",

                        "description",

                        "상황",

                        "내용"

                    ]

                );


            const phone =

                getField(

                    item,

                    [

                        "phone",

                        "tel",

                        "telephone",

                        "연락처"

                    ]

                );


            const kakaoMapURL =

                getField(

                    item,

                    [

                        "kakaoMapURL",

                        "kakaoUrl",

                        "mapUrl",

                        "지도URL"

                    ]

                );


            const elapsed =

                getElapsedTime(

                    startTime,

                    endTime || null

                );


            /* -----------------------------------------
               OVERDUE
            ----------------------------------------- */

            let overdue = false;


            if(

                status === "RECEIVED" &&

                startTime

            ){

                const start =

                    new Date(
                        startTime
                    ).getTime();


                if(
                    Number.isFinite(start)
                ){

                    overdue =

                        (

                            Date.now() -

                            start

                        ) / 60000 >= 10;

                }

            }


            /* -----------------------------------------
               STATUS STYLE
            ----------------------------------------- */

            let statusText =
                "접수";


            let statusClass =
                "popup-received";


            if(
                status === "ARRIVED"
            ){

                statusText =
                    "현장도착";

                statusClass =
                    "popup-arrived";

            }


            if(
                status === "DONE"
            ){

                statusText =
                    "처리완료";

                statusClass =
                    "popup-done";

            }


            /* -----------------------------------------
               MARKER
            ----------------------------------------- */

            if(

                Number.isFinite(lat) &&

                Number.isFinite(lng)

            ){

                let markerColor =
                    "#ff0000";


                if(
                    status === "ARRIVED"
                ){

                    markerColor =
                        "#ff9800";

                }


                if(
                    status === "DONE"
                ){

                    markerColor =
                        "#777777";

                }


                const marker =

                    L.circleMarker(

                        [lat,lng],

                        {

                            radius:

                                status === "DONE"

                                ? 9

                                : 12,

                            color:
                                markerColor,

                            fillColor:
                                markerColor,

                            fillOpacity:.9,

                            weight:3

                        }

                    );


                /* -------------------------------------
                   ACTION BUTTON
                ------------------------------------- */

                let actionButton = "";


                if(
                    status === "RECEIVED"
                ){

                    actionButton =

                        `

                        <button

                            class="
                                popup-btn
                                popup-arrive
                            "

                            onclick="
                                updateAccidentStatus(
                                    '${escapeJS(id)}',
                                    'ARRIVED'
                                )
                            "

                        >

                            🚓 현장 도착

                        </button>

                        `;

                }


                if(
                    status === "ARRIVED"
                ){

                    actionButton =

                        `

                        <button

                            class="
                                popup-btn
                                popup-done
                            "

                            onclick="
                                updateAccidentStatus(
                                    '${escapeJS(id)}',
                                    'DONE'
                                )
                            "

                        >

                            ✅ 구조 완료

                        </button>

                        `;

                }


                /* -------------------------------------
                   PHONE BUTTON
                ------------------------------------- */

                const phoneButton =

                    phone

                    ?

                    `

                    <a

                        class="
                            popup-btn
                            popup-call
                        "

                        href="
                            tel:${escapeAttribute(phone)}
                        "

                    >

                        📞 전화

                    </a>

                    `

                    :

                    "";


                /* -------------------------------------
                   KAKAO MAP
                ------------------------------------- */

                const mapButton =

                    kakaoMapURL

                    ?

                    `

                    <a

                        class="
                            popup-btn
                            popup-map
                        "

                        href="
                            ${escapeAttribute(
                                kakaoMapURL
                            )}
                        "

                        target="_blank"

                        rel="noopener"

                    >

                        🗺 지도

                    </a>

                    `

                    :

                    "";


                /* -------------------------------------
                   SHARE
                ------------------------------------- */

                const shareButton =

                    `

                    <button

                        class="
                            popup-btn
                            popup-share
                        "

                        onclick="
                            shareAccidentLocation(
                                ${lat},
                                ${lng},
                                '${escapeJS(address)}'
                            )
                        "

                    >

                        📍 위치 공유

                    </button>

                    `;


                /* -------------------------------------
                   POPUP
                ------------------------------------- */

                const popupHTML =

                    `

                    <div

                        style="
                            color:#111 !important;
                            background:#fff;
                            font-family:
                                Arial,
                                'Malgun Gothic',
                                sans-serif;
                        "

                    >

                        <div

                            style="
                                font-size:17px;
                                font-weight:bold;
                                color:#111 !important;
                                margin-bottom:8px;
                            "

                        >

                            🆘 산악사고 신고

                        </div>


                        <hr>


                        <div
                            style="
                                color:#111 !important;
                            "
                        >

                            <b>유형:</b>

                            ${escapeHTML(type)}

                        </div>


                        <div
                            style="
                                color:#111 !important;
                            "
                        >

                            <b>상태:</b>

                            <span
                                class="
                                    popup-status
                                    ${statusClass}
                                "
                            >

                                ${statusText}

                            </span>

                        </div>


                        ${
                            overdue &&
                            status === "RECEIVED"

                            ?

                            `

                            <div

                                style="
                                    margin-top:6px;
                                    color:#d50000 !important;
                                    font-weight:bold;
                                "

                            >

                                ⚠ 10분 이상 미처리

                            </div>

                            `

                            :

                            ""

                        }


                        <div

                            style="
                                margin-top:6px;
                                color:#111 !important;
                            "

                        >

                            <b>주소:</b>

                            <br>

                            ${escapeHTML(
                                address || "-"
                            )}

                        </div>


                        <div

                            style="
                                margin-top:6px;
                                color:#111 !important;
                            "

                        >

                            <b>상황:</b>

                            <br>

                            ${escapeHTML(
                                symptom || "-"
                            )}

                        </div>


                        <div

                            style="
                                margin-top:6px;
                                color:#111 !important;
                            "

                        >

                            <b>연락처:</b>

                            ${
                                phone

                                ?

                                escapeHTML(phone)

                                :

                                "-"

                            }

                        </div>


                        <div

                            style="
                                margin-top:6px;
                                color:#111 !important;
                            "

                        >

                            <b>접수:</b>

                            ${escapeHTML(
                                startTime || "-"
                            )}

                        </div>


                        <div

                            style="
                                color:#111 !important;
                            "

                        >

                            <b>경과:</b>

                            ${escapeHTML(
                                elapsed
                            )}

                        </div>


                        ${
                            endTime

                            ?

                            `

                            <div

                                style="
                                    color:#111 !important;
                                "

                            >

                                <b>완료:</b>

                                ${escapeHTML(
                                    endTime
                                )}

                            </div>

                            `

                            :

                            ""

                        }


                        <div

                            style="
                                margin-top:8px;
                                font-size:11px;
                                color:#555 !important;
                            "

                        >

                            Lat:
                            ${lat.toFixed(6)}

                            <br>

                            Lng:
                            ${lng.toFixed(6)}

                        </div>


                        <div

                            style="
                                margin-top:8px;
                            "

                        >

                            ${phoneButton}

                            ${mapButton}

                            ${shareButton}

                            ${actionButton}

                        </div>

                    </div>

                    `;


                marker.bindPopup(

                    popupHTML,

                    {

                        maxWidth:350,

                        minWidth:280,

                        className:
                            "accident-popup"

                    }

                );


                /* -------------------------------------
                   MARKER CLICK
                ------------------------------------- */

                marker.on(

                    "click",

                    function(){

                        map.setView(

                            [lat,lng],

                            17,

                            {

                                animate:true,

                                duration:.5

                            }

                        );

                    }

                );


                marker.addTo(
                    accidentLayer
                );


                /* =====================================
                   ★ NEW ACCIDENT
                   ★ ONLY HERE AUTO CENTER
                ===================================== */

                if(

                    !firstLoad &&

                    !knownIds.has(id)

                ){

                    /* 알림음 */

                    playAlert();


                    /* 새 사고 위치 중앙 이동 */

                    map.setView(

                        [lat,lng],

                        17,

                        {

                            animate:true,

                            duration:1

                        }

                    );

                }


                /* -------------------------------------
                   OVERDUE ALERT
                ------------------------------------- */

                if(

                    overdue &&

                    !alertedOverdueIds.has(id)

                ){

                    alertedOverdueIds.add(id);


                    if(!firstLoad){

                        playAlert();

                    }

                }


                /* -------------------------------------
                   REMEMBER ID
                ------------------------------------- */

                knownIds.add(id);

            }

        }

    );


    /* =================================================
       SYSTEM STATUS
    ================================================= */

    document.getElementById(
        "lastRefresh"
    ).textContent =

        new Date()
        .toLocaleTimeString("ko-KR");


    document.getElementById(
        "refreshStatus"
    ).textContent =
        "정상 작동";


    firstLoad = false;

}


/* =====================================================
   LOAD ACCIDENTS
===================================================== */

async function loadAccidents(){

    if(accidentLoading){

        return;

    }


    accidentLoading = true;


    document.getElementById(
        "refreshStatus"
    ).textContent =
        "조회중...";


    try{

        const rows =
            await getAccidents();


        renderAccidents(
            rows
        );

    }

    catch(err){

        console.error(
            "사고 목록 조회 오류:",
            err
        );


        document.getElementById(
            "refreshStatus"
        ).textContent =
            "조회 오류";

    }

    finally{

        accidentLoading = false;

    }

}


/* =====================================================
   AUTO REFRESH
===================================================== */

function startAccidentAutoRefresh(){

    if(accidentTimer){

        clearInterval(
            accidentTimer
        );

    }


    /* 최초 조회 */

    loadAccidents();


    /* 5초 자동 조회 */

    accidentTimer =

        setInterval(

            function(){

                if(
                    !document.hidden
                ){

                    loadAccidents();

                }

            },

            5000

        );

}


/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(

    "visibilitychange",

    function(){

        if(
            !document.hidden
        ){

            loadAccidents();

        }

    }

);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

    "resize",

    function(){

        setTimeout(

            function(){

                map.invalidateSize();

            },

            100

        );

    }

);


/* =====================================================
   INITIALIZE
===================================================== */

window.addEventListener(

    "load",

    function(){

        startAccidentAutoRefresh();


        setTimeout(

            function(){

                map.invalidateSize();

            },

            500

        );

    }

);


/* =====================================================
   CTRL + SHIFT + R
===================================================== */

document.addEventListener(

    "keydown",

    function(e){

        if(

            e.ctrlKey &&

            e.shiftKey &&

            e.key.toLowerCase() === "r"

        ){

            e.preventDefault();

            loadAccidents();

        }

    }

);


/* =====================================================
   RIGHT CLICK BLOCK
===================================================== */

document.addEventListener(

    "contextmenu",

    function(e){

        e.preventDefault();

    }

);

</script>

</body>

</html>

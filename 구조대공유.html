<script>


/* =====================================================
   API
===================================================== */

const ACCIDENT_API_URL =
"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


/* =====================================================
   STATE
===================================================== */

let accidentTimer = null;

let accidentLoading = false;

let firstLoad = true;

let knownIds = new Set();

let alertedOverdueIds = new Set();


/* =====================================================
   DOM
===================================================== */

const alertSound =
    document.getElementById("alertSound");


const mapStatus =
    document.getElementById("mapStatus");


/* =====================================================
   MAP
===================================================== */

const map =
    L.map("map")
    .setView(
        [35.1345,126.9902],
        13
    );


/* =====================================================
   MAP TILE
===================================================== */

const osm =
    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

            maxZoom:19,

            attribution:
                "&copy; OpenStreetMap contributors"

        }

    );


const topo =
    L.tileLayer(

        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",

        {

            maxZoom:17,

            attribution:
                "&copy; OpenTopoMap"

        }

    );


const satellite =
    L.tileLayer(

        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

        {

            maxZoom:19,

            attribution:
                "Tiles &copy; Esri"

        }

    );


osm.addTo(map);


L.control.layers({

    "🗺 일반지도":osm,

    "⛰ 지형지도":topo,

    "🛰 위성지도":satellite

}).addTo(map);


/* =====================================================
   COORDINATE CONTROL
===================================================== */

const coordControl =
    L.control({

        position:"bottomleft"

    });


coordControl.onAdd =
function(){

    this._div =
        L.DomUtil.create(
            "div",
            "mouse-coords"
        );


    this._div.innerHTML =
        "Lat : --<br>Lng : --";


    return this._div;

};


coordControl.addTo(map);


map.on(
    "mousemove",
    function(e){

        coordControl._div.innerHTML =

            "Lat : " +
            e.latlng.lat.toFixed(6) +

            "<br>Lng : " +
            e.latlng.lng.toFixed(6);

    }
);


map.on(
    "mouseout",
    function(){

        coordControl._div.innerHTML =
            "Lat : --<br>Lng : --";

    }
);


/* =====================================================
   DRAW
===================================================== */

const drawnItems =
    new L.FeatureGroup();


map.addLayer(
    drawnItems
);


map.addControl(

    new L.Control.Draw({

        draw:{

            polygon:true,

            rectangle:true,

            marker:true,

            polyline:true,

            circle:true

        },

        edit:{

            featureGroup:
                drawnItems

        }

    })

);


map.on(

    L.Draw.Event.CREATED,

    function(e){

        drawnItems.addLayer(
            e.layer
        );

    }

);


/* =====================================================
   ACCIDENT LAYER
===================================================== */

const accidentLayer =
    L.layerGroup()
    .addTo(map);


/* =====================================================
   ALERT
===================================================== */

function playAlert(){

    try{

        alertSound.currentTime = 0;

        const promise =
            alertSound.play();


        if(

            promise &&

            typeof promise.catch === "function"

        ){

            promise.catch(

                function(){

                    console.log(
                        "브라우저 자동재생 정책으로 알림음이 차단되었습니다."
                    );

                }

            );

        }

    }
    catch(err){

        console.error(
            "알림음 오류:",
            err
        );

    }

}


/* =====================================================
   POST API
===================================================== */

async function postAccident(payload){

    const response =
        await fetch(

            ACCIDENT_API_URL,

            {

                method:"POST",

                headers:{

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify(payload)

            }

        );


    const text =
        await response.text();


    let data;


    try{

        data =
            JSON.parse(text);

    }
    catch(e){

        data = {

            result:
                response.ok
                ? "success"
                : "error",

            message:text

        };

    }


    if(!response.ok){

        throw new Error(

            data.message ||

            "HTTP " +
            response.status

        );

    }


    return data;

}


/* =====================================================
   GET API
===================================================== */

async function getAccidents(){

    const response =
        await fetch(

            ACCIDENT_API_URL +
            "?action=list&t=" +
            Date.now(),

            {

                method:"GET",

                cache:"no-store"

            }

        );


    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    if(Array.isArray(data)){

        return data;

    }


    if(

        data &&

        Array.isArray(data.data)

    ){

        return data.data;

    }


    if(

        data &&

        Array.isArray(data.items)

    ){

        return data.items;

    }


    if(

        data &&

        Array.isArray(data.rows)

    ){

        return data.rows;

    }


    return [];

}


/* =====================================================
   FIELD
===================================================== */

function getField(
    item,
    names
){

    for(
        const name of names
    ){

        if(

            item &&

            item[name] !== undefined &&

            item[name] !== null &&

            String(
                item[name]
            ).trim() !== ""

        ){

            return item[name];

        }

    }


    return "";

}


/* =====================================================
   ID
===================================================== */

function getAccidentId(
    item,
    index
){

    const value =
        getField(

            item,

            [

                "id",

                "ID",

                "caseId",

                "caseID",

                "사고ID"

            ]

        );


    if(value !== ""){

        return String(value);

    }


    const createdAt =
        getField(

            item,

            [

                "createdAt",

                "timestamp",

                "접수시간"

            ]

        );


    const address =
        getField(

            item,

            [

                "address",

                "주소"

            ]

        );


    return (

        String(createdAt) +

        "|" +

        String(address) +

        "|" +

        String(index)

    );

}


/* =====================================================
   START TIME
===================================================== */

function getStartTime(item){

    return getField(

        item,

        [

            "startTime",

            "createdAt",

            "timestamp",

            "time",

            "date",

            "접수시간"

        ]

    );

}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(value){

    const status =
        String(value || "")
        .trim()
        .toUpperCase();


    if(

        status === "DONE" ||

        status === "완료" ||

        status === "처리완료" ||

        status === "사고처리완료"

    ){

        return "DONE";

    }


    if(

        status === "ARRIVED" ||

        status === "도착" ||

        status === "현장도착"

    ){

        return "ARRIVED";

    }


    return "RECEIVED";

}


/* =====================================================
   STATUS INFO
===================================================== */

function getStatusInfo(status){

    if(status === "ARRIVED"){

        return {

            text:"현장도착",

            color:"orange"

        };

    }


    if(status === "DONE"){

        return {

            text:"처리완료",

            color:"#777"

        };

    }


    return {

        text:"접수",

        color:"red"

    };

}


/* =====================================================
   ELAPSED
===================================================== */

function getElapsedTime(
    startTime,
    endTime
){

    if(!startTime){

        return "-";

    }


    const start =
        new Date(startTime);


    if(
        Number.isNaN(
            start.getTime()
        )
    ){

        return "-";

    }


    const end =
        endTime

        ?

        new Date(endTime)

        :

        new Date();


    if(
        Number.isNaN(
            end.getTime()
        )
    ){

        return "-";

    }


    let diff =
        Math.floor(

            (

                end.getTime() -

                start.getTime()

            ) / 1000

        );


    if(diff < 0){

        diff = 0;

    }


    const hour =
        Math.floor(
            diff / 3600
        );


    diff %= 3600;


    const minute =
        Math.floor(
            diff / 60
        );


    const second =
        diff % 60;


    return (

        String(hour)
        .padStart(2,"0") +

        ":" +

        String(minute)
        .padStart(2,"0") +

        ":" +

        String(second)
        .padStart(2,"0")

    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value){

    return String(value ?? "")

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJS(value){

    return String(value ?? "")

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /\r/g,
            "\\r"
        )

        .replace(
            /\n/g,
            "\\n"
        );

}


/* =====================================================
   EDIT
===================================================== */

async function editAccident(caseId){

    try{

        const rows =
            await getAccidents();


        let item = null;


        for(
            let i=0;
            i<rows.length;
            i++
        ){

            const id =
                getAccidentId(
                    rows[i],
                    i
                );


            if(
                String(id) ===
                String(caseId)
            ){

                item =
                    rows[i];

                break;

            }

        }


        if(!item){

            alert(
                "수정할 신고 내용을 찾을 수 없습니다."
            );

            return;

        }


        const currentType =
            getField(

                item,

                [

                    "type",

                    "accidentType",

                    "신고유형",

                    "유형"

                ]

            );


        const currentSymptom =
            getField(

                item,

                [

                    "symptom",

                    "condition",

                    "description",

                    "상황",

                    "내용"

                ]

            );


        const currentPhone =
            getField(

                item,

                [

                    "phone",

                    "tel",

                    "telephone",

                    "연락처"

                ]

            );


        const currentAddress =
            getField(

                item,

                [

                    "address",

                    "주소",

                    "location",

                    "장소"

                ]

            );


        const currentLat =
            getField(

                item,

                [

                    "lat",

                    "latitude",

                    "위도"

                ]

            );


        const currentLng =
            getField(

                item,

                [

                    "lng",

                    "longitude",

                    "경도"

                ]

            );


        const type =
            prompt(

                "신고 유형\n\n예: 조난 / 구조출동 / 응급환자 / 기타",

                currentType

            );


        if(type === null){

            return;

        }


        const symptom =
            prompt(

                "사고 상황",

                currentSymptom

            );


        if(symptom === null){

            return;

        }


        const phone =
            prompt(

                "연락처",

                currentPhone

            );


        if(phone === null){

            return;

        }


        const address =
            prompt(

                "주소",

                currentAddress

            );


        if(address === null){

            return;

        }


        const lat =
            Number(

                prompt(

                    "위도",

                    currentLat

                )

            );


        if(!Number.isFinite(lat)){

            alert(
                "위도 값이 올바르지 않습니다."
            );

            return;

        }


        const lng =
            Number(

                prompt(

                    "경도",

                    currentLng

                )

            );


        if(!Number.isFinite(lng)){

            alert(
                "경도 값이 올바르지 않습니다."
            );

            return;

        }


        if(

            !type.trim() ||

            !symptom.trim() ||

            !phone.trim() ||

            !address.trim()

        ){

            alert(
                "필수 내용을 입력하세요."
            );

            return;

        }


        if(

            !confirm(
                "✏ 신고 내용을 수정하시겠습니까?"
            )

        ){

            return;

        }


        const result =
            await postAccident({

                action:"update",

                id:String(caseId),

                type:type.trim(),

                symptom:symptom.trim(),

                phone:phone.trim(),

                address:address.trim(),

                lat:lat,

                lng:lng,

                kakaoMapURL:

                    "https://map.kakao.com/link/map/" +

                    lat +

                    "," +

                    lng

            });


        if(

            !result ||

            result.result !== "success"

        ){

            throw new Error(

                result &&

                result.message

                ?

                result.message

                :

                "수정 실패"

            );

        }


        alert(
            "✏ 신고 내용이 수정되었습니다."
        );


        await loadAccidents();

    }
    catch(err){

        console.error(
            "수정 오류:",
            err
        );


        alert(

            "❌ 신고 수정 실패\n\n" +

            err.message

        );

    }

}


/* =====================================================
   DELETE
===================================================== */

async function deleteAccident(caseId){

    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    const password =
        prompt(
            "🔐 신고 삭제 비밀번호를 입력하세요."
        );


    if(password === null){

        return;

    }


    if(!password.trim()){

        alert(
            "삭제 비밀번호를 입력하세요."
        );

        return;

    }


    if(

        !confirm(

            "⚠ 신고 내용을 삭제하시겠습니까?\n\n" +

            "삭제하면 Google Sheets에서도 해당 신고가 삭제됩니다."

        )

    ){

        return;

    }


    try{

        const result =
            await postAccident({

                action:"delete",

                id:String(caseId),

                password:
                    password

            });


        if(

            !result ||

            result.result !== "success"

        ){

            throw new Error(

                result &&

                result.message

                ?

                result.message

                :

                "삭제 실패"

            );

        }


        alert(
            "🗑 신고가 삭제되었습니다."
        );


        await loadAccidents();

    }
    catch(err){

        console.error(
            "삭제 오류:",
            err
        );


        alert(

            "❌ 신고 삭제 실패\n\n" +

            err.message

        );


    }

}


/* =====================================================
   STATUS UPDATE
===================================================== */

async function updateAccidentStatus(
    caseId,
    newStatus
){

    const status =
        normalizeStatus(
            newStatus
        );


    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    let message = "";

    let action = "";


    if(status === "ARRIVED"){

        message =
            "🚓 현장 도착으로 변경하시겠습니까?";

        action =
            "complete";

    }

    else if(status === "DONE"){

        message =
            "✅ 구조 완료로 변경하시겠습니까?";

        action =
            "finish";

    }

    else{

        return;

    }


    if(!confirm(message)){

        return;

    }


    try{

        const result =
            await postAccident({

                action:action,

                id:String(caseId)

            });


        if(

            !result ||

            result.result !== "success"

        ){

            throw new Error(

                result &&

                result.message

                ?

                result.message

                :

                "상태 변경 실패"

            );

        }


        alert(

            status === "ARRIVED"

            ?

            "🚓 현장 도착 처리 완료"

            :

            "✅ 구조 완료 처리 완료"

        );


        await loadAccidents();

    }
    catch(err){

        console.error(
            "상태 변경 오류:",
            err
        );


        alert(

            "❌ 상태 변경 실패\n\n" +

            err.message

        );

    }

}


/* =====================================================
   RENDER ACCIDENTS
===================================================== */

function renderAccidents(data){

    accidentLayer.clearLayers();


    const rows =
        [...data].sort(

            function(a,b){

                const ta =
                    new Date(
                        getStartTime(a)
                    ).getTime();


                const tb =
                    new Date(
                        getStartTime(b)
                    ).getTime();


                if(
                    Number.isNaN(ta)
                ){

                    return 1;

                }


                if(
                    Number.isNaN(tb)
                ){

                    return -1;

                }


                return tb - ta;

            }

        );


    rows.forEach(

        function(item,index){

            const id =
                getAccidentId(
                    item,
                    index
                );


            const status =
                normalizeStatus(

                    getField(

                        item,

                        [

                            "status",

                            "state",

                            "상태",

                            "처리상태"

                        ]

                    )

                );


            const startTime =
                getStartTime(item);


            const endTime =
                getField(

                    item,

                    [

                        "finishTime",

                        "endTime",

                        "completedAt",

                        "doneAt",

                        "완료시간"

                    ]

                );


            const lat =
                Number(

                    getField(

                        item,

                        [

                            "lat",

                            "latitude",

                            "위도"

                        ]

                    )

                );


            const lng =
                Number(

                    getField(

                        item,

                        [

                            "lng",

                            "longitude",

                            "경도"

                        ]

                    )

                );


            const address =
                getField(

                    item,

                    [

                        "address",

                        "주소",

                        "location",

                        "장소"

                    ]

                );


            const type =
                getField(

                    item,

                    [

                        "type",

                        "accidentType",

                        "신고유형",

                        "유형"

                    ]

                ) ||

                "기타";


            const symptom =
                getField(

                    item,

                    [

                        "symptom",

                        "condition",

                        "description",

                        "상황",

                        "내용"

                    ]

                );


            const phone =
                getField(

                    item,

                    [

                        "phone",

                        "tel",

                        "telephone",

                        "연락처"

                    ]

                );


            const kakaoMapURL =
                getField(

                    item,

                    [

                        "kakaoMapURL",

                        "kakaoUrl",

                        "mapUrl",

                        "지도URL"

                    ]

                );


            const elapsed =
                getElapsedTime(

                    startTime,

                    endTime || null

                );


            /*
             * 좌표가 없으면 지도 표시 불가
             */

            if(

                !Number.isFinite(lat) ||

                !Number.isFinite(lng)

            ){

                return;

            }


            /*
             * 상태
             */

            const statusInfo =
                getStatusInfo(
                    status
                );


            /*
             * 10분 이상 미처리
             */

            let overdue = false;


            if(

                status === "RECEIVED" &&

                startTime

            ){

                const start =
                    new Date(
                        startTime
                    ).getTime();


                if(
                    Number.isFinite(start)
                ){

                    overdue =

                        (

                            Date.now() -

                            start

                        ) / 60000 >= 10;

                }

            }


            /*
             * 유형 아이콘
             */

            let typeIcon =
                "🆘";


            if(type === "응급환자"){

                typeIcon =
                    "🚑";

            }

            else if(type === "구조출동"){

                typeIcon =
                    "🚓";

            }

            else if(type === "조난"){

                typeIcon =
                    "🆘";

            }

            else if(type === "기타"){

                typeIcon =
                    "✏️";

            }


            /*
             * 현장도착 / 구조완료
             */

            let statusButton = "";


            if(status === "RECEIVED"){

                statusButton = `

                    <button

                        class="rescue-btn rescue-btn-arrive"

                        type="button"

                        onclick="
                            updateAccidentStatus(
                                '${escapeJS(id)}',
                                'ARRIVED'
                            )
                        "

                    >

                        🚓 현장 도착

                    </button>

                `;

            }


            else if(status === "ARRIVED"){

                statusButton = `

                    <button

                        class="rescue-btn rescue-btn-complete"

                        type="button"

                        onclick="
                            updateAccidentStatus(
                                '${escapeJS(id)}',
                                'DONE'
                            )
                        "

                    >

                        ✅ 구조 완료

                    </button>

                `;

            }


            /*
             * 전화
             */

            const phoneButton =

                phone

                ?

                `

                <a

                    class="rescue-btn rescue-btn-phone"

                    href="tel:${escapeAttribute(phone)}"

                >

                    📞 연락

                </a>

                `

                :

                "";


            /*
             * 카카오지도
             */

            const kakaoButton =

                kakaoMapURL

                ?

                `

                <a

                    class="rescue-btn rescue-btn-map"

                    href="${escapeAttribute(kakaoMapURL)}"

                    target="_blank"

                    rel="noopener"

                >

                    🗺 카카오지도

                </a>

                `

                :

                `

                <a

                    class="rescue-btn rescue-btn-map"

                    href="https://map.kakao.com/link/map/${lat},${lng}"

                    target="_blank"

                    rel="noopener"

                >

                    🗺 카카오지도

                </a>

                `;


            /*
             * 수정
             */

            const editButton = `

                <button

                    class="rescue-btn rescue-btn-edit"

                    type="button"

                    onclick="
                        editAccident(
                            '${escapeJS(id)}'
                        )
                    "

                >

                    ✏ 수정

                </button>

            `;


            /*
             * 삭제
             */

            const deleteButton = `

                <button

                    class="rescue-btn rescue-btn-delete"

                    type="button"

                    onclick="
                        deleteAccident(
                            '${escapeJS(id)}'
                        )
                    "

                >

                    🗑 삭제

                </button>

            `;


            /*
             * 10분 경고
             */

            const overdueHTML =

                overdue &&

                status === "RECEIVED"

                ?

                `

                <div class="rescue-warning">

                    ⚠ 10분 이상 미처리

                </div>

                `

                :

                "";


            /*
             * 팝업 HTML
             */

            const popupHTML = `

                <div class="rescue-popup">


                    <div class="rescue-popup-title">

                        ${typeIcon}

                        ${escapeHTML(type)}

                    </div>


                    <div

                        class="rescue-status"

                        style="
                            background:${statusInfo.color};
                        "

                    >

                        ${escapeHTML(
                            statusInfo.text
                        )}

                    </div>


                    ${overdueHTML}


                    <div class="rescue-section">

                        <span class="rescue-label">

                            📋 사고 상황

                        </span>

                        <br>

                        ${escapeHTML(
                            symptom || "-"
                        )}

                    </div>


                    <div class="rescue-section">

                        <span class="rescue-label">

                            📍 주소

                        </span>

                        <br>

                        ${escapeHTML(
                            address || "-"
                        )}

                    </div>


                    <div class="rescue-section">

                        <span class="rescue-label">

                            📞 연락처

                        </span>

                        <br>

                        ${escapeHTML(
                            phone || "-"
                        )}

                    </div>


                    <div class="rescue-section">

                        <span class="rescue-label">

                            🕐 접수시간

                        </span>

                        <br>

                        ${escapeHTML(
                            startTime || "-"
                        )}

                    </div>


                    <div class="rescue-section">

                        <span class="rescue-label">

                            ⏱ 경과시간

                        </span>

                        <br>

                        <span class="rescue-time">

                            ${escapeHTML(elapsed)}

                        </span>

                    </div>


                    ${
                        endTime

                        ?

                        `

                        <div class="rescue-section">

                            <span class="rescue-label">

                                ✅ 완료시간

                            </span>

                            <br>

                            ${escapeHTML(endTime)}

                        </div>

                        `

                        :

                        ""

                    }


                    <div class="rescue-coord">

                        Lat:
                        ${lat.toFixed(6)}

                        <br>

                        Lng:
                        ${lng.toFixed(6)}

                    </div>


                    <div class="rescue-buttons">

                        ${phoneButton}

                        ${kakaoButton}

                    </div>


                    <div class="rescue-buttons">

                        ${statusButton}

                        ${editButton}

                    </div>


                    <div class="rescue-buttons">

                        ${deleteButton}

                    </div>


                </div>

            `;


            /*
             * 마커
             */

            const marker =
                L.circleMarker(

                    [lat,lng],

                    {

                        radius:
                            status === "DONE"
                            ? 8
                            : 11,

                        color:
                            statusInfo.color,

                        fillColor:
                            statusInfo.color,

                        fillOpacity:.9,

                        weight:3

                    }

                );


            marker.bindPopup(

                popupHTML,

                {

                    maxWidth:380,

                    minWidth:300,

                    closeButton:true

                }

            );


            marker.on(

                "click",

                function(){

                    map.setView(

                        [lat,lng],

                        17

                    );

                }

            );


            marker.addTo(
                accidentLayer
            );


            /*
             * 신규 신고
             */

            if(

                !firstLoad &&

                !knownIds.has(id)

            ){

                playAlert();

            }


            /*
             * 10분 이상 미처리
             */

            if(

                overdue &&

                !alertedOverdueIds.has(id)

            ){

                alertedOverdueIds.add(id);


                if(!firstLoad){

                    playAlert();

                }

            }


            knownIds.add(id);

        }

    );


    /*
     * 상단 중앙 상태 표시
     */

    mapStatus.innerHTML =

        "📡 사고정보 정상 연결<br>" +

        "🆘 신고 " +

        rows.length +

        "건 · " +

        new Date()
        .toLocaleTimeString("ko-KR");


    firstLoad = false;

}


/* =====================================================
   LOAD ACCIDENTS
===================================================== */

async function loadAccidents(){

    if(accidentLoading){

        return;

    }


    accidentLoading = true;


    mapStatus.innerHTML =
        "📡 사고정보 조회중...";


    try{

        const rows =
            await getAccidents();


        renderAccidents(
            rows
        );

    }
    catch(err){

        console.error(
            "사고 목록 조회 오류:",
            err
        );


        mapStatus.innerHTML =

            "⚠ 사고정보 조회 오류<br>" +

            escapeHTML(
                err.message
            );

    }
    finally{

        accidentLoading = false;

    }

}


/* =====================================================
   AUTO REFRESH
===================================================== */

function startAccidentAutoRefresh(){

    if(accidentTimer){

        clearInterval(
            accidentTimer
        );

    }


    /*
     * 최초 조회
     */

    loadAccidents();


    /*
     * 5초마다 자동 조회
     */

    accidentTimer =

        setInterval(

            function(){

                if(
                    !document.hidden
                ){

                    loadAccidents();

                }

            },

            5000

        );

}


/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(

    "visibilitychange",

    function(){

        if(
            !document.hidden
        ){

            loadAccidents();

        }

    }

);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

    "resize",

    function(){

        setTimeout(

            function(){

                map.invalidateSize();

            },

            100

        );

    }

);


/* =====================================================
   MANUAL REFRESH
===================================================== */

document.addEventListener(

    "keydown",

    function(e){

        /*
         * Ctrl + Shift + R
         */

        if(

            e.ctrlKey &&

            e.shiftKey &&

            e.key.toLowerCase() === "r"

        ){

            e.preventDefault();

            loadAccidents();

        }

    }

);


/* =====================================================
   RIGHT CLICK BLOCK
===================================================== */

document.addEventListener(

    "contextmenu",

    function(e){

        e.preventDefault();

    }

);


/* =====================================================
   INITIALIZE
===================================================== */

window.addEventListener(

    "load",

    function(){

        startAccidentAutoRefresh();


        setTimeout(

            function(){

                map.invalidateSize();

            },

            500

        );

    }

);

</script>

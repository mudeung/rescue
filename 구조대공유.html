<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>🛰 SEARCHING AI SYSTEM 구조공유</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css"
/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
}

body{
    background:#050b18;
    color:#00ff9d;
    font-family:monospace;
    overflow:hidden;
}

/* ================= HEADER ================= */

header{
    height:50px;
    background:#071a2f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
    border-bottom:1px solid #123c55;
    position:relative;
    z-index:1000;
}

/* ================= LAYOUT ================= */

#container{
    display:flex;
    height:calc(100vh - 50px);
    width:100%;
}

/* ================= PANEL ================= */

#panel{
    width:380px;
    min-width:380px;
    background:#07101f;
    padding:10px;
    overflow-y:auto;
    border-right:1px solid #123c55;
    z-index:1000;
}

.logo{
    display:block;
    margin:5px auto 10px auto;
    max-width:100%;
    max-height:90px;
    object-fit:contain;
}

.section-title{
    margin-top:12px;
    padding:9px;
    background:#10253b;
    font-weight:bold;
    border-left:4px solid #00ff9d;
}

/* ================= MAP ================= */

#map{
    flex:1;
    height:100%;
    min-width:0;
}

/* ================= CASE ================= */

.case-card{
    background:#1e1e1e;
    padding:10px;
    margin-top:8px;
    border-radius:6px;
    color:white;
    font-family:Arial,sans-serif;
    font-size:14px;
    line-height:1.45;
    border:2px solid transparent;
}

.case-card.done{
    opacity:.7;
    border-color:#777;
    box-shadow:0 0 10px #777;
}

.case-card.arrived{
    border-color:orange;
    box-shadow:0 0 10px orange;
}

.case-card.blink{
    animation:blink 1s infinite;
}

@keyframes blink{

    0%{
        box-shadow:0 0 5px red;
    }

    50%{
        box-shadow:0 0 20px red;
    }

    100%{
        box-shadow:0 0 5px red;
    }

}

/* ================= STATUS ================= */

.status-received,
.status-arrived,
.status-done{

    display:inline-block;

    margin:6px 0;

    padding:4px 10px;

    border-radius:5px;

    font-weight:bold;

}

.status-received{
    background:red;
    color:white;
}

.status-arrived{
    background:orange;
    color:white;
}

.status-done{
    background:#666;
    color:white;
    border:1px solid #aaa;
    box-shadow:0 0 6px #888;
}

/* ================= BUTTON ================= */

button{

    width:100%;

    padding:9px;

    margin-top:6px;

    border:1px solid #00ff9d;

    background:#001a14;

    color:#00ff9d;

    font-family:monospace;

    cursor:pointer;

    font-weight:bold;

}

button:hover{
    background:#003322;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.arrive-btn{

    background:#ef6c00;

    color:white;

    border:1px solid #ff9800;

}

.complete-btn{

    background:#2e7d32;

    color:white;

    border:1px solid #4caf50;

}

.edit-btn{

    background:#174a70;

    color:white;

    border:1px solid #2196f3;

}

.delete-btn{

    background:#700000;

    color:white;

    border:1px solid #ff3333;

}

.map-btn{

    background:#003d5c;

    color:white;

    border:1px solid #008dcc;

}

/* ================= TIME ================= */

.time{
    color:#ffcc00;
}

.coord{
    font-size:12px;
    color:#aaa;
    margin-top:6px;
}

/* ================= COORD ================= */

.mouse-coords{

    background:rgba(0,0,0,.8);

    color:#00ff9d;

    border:1px solid #00ff9d;

    border-radius:5px;

    padding:6px 10px;

    font-size:12px;

    font-family:monospace;

    box-shadow:0 0 8px #00ff9d;

}

/* ================= INFO ================= */

.system-info{

    margin-top:8px;

    padding:8px;

    background:#061522;

    border:1px solid #123c55;

    color:#8fffd0;

    font-size:12px;

    line-height:1.5;

}

/* ================= MOBILE ================= */

@media(max-width:768px){

    body{
        overflow:auto;
    }

    #container{

        flex-direction:column;

        height:auto;

        min-height:calc(100vh - 50px);

    }

    #panel{

        width:100%;

        min-width:0;

        height:48vh;

        order:2;

        border-right:none;

        border-top:1px solid #123c55;

    }

    #map{

        width:100%;

        height:52vh;

        order:1;

    }

    header{
        font-size:15px;
    }

}

</style>

</head>

<body>

<header>
    🛰 SEARCHING AI SYSTEM 구조공유
</header>


<div id="container">


<!-- =====================================================
     LEFT PANEL
===================================================== -->

<div id="panel">


<img
    class="logo"
    src="https://mudeung.github.io/rescue/logogomir1.png"
    alt="달콩이 이미지"
>


<div class="section-title">
    🆘 사고 신고 목록
</div>


<div class="system-info">

    🔄 자동갱신:
    <span id="refreshStatus">
        준비중
    </span>

    <br>

    📡 마지막 조회:
    <span id="lastRefresh">
        -
    </span>

</div>


<div id="caseList">

    로딩중...

</div>


</div>


<!-- =====================================================
     MAP
===================================================== -->

<div id="map"></div>


</div>


<!-- =====================================================
     ALERT SOUND
===================================================== -->

<audio
    id="alertSound"
    preload="auto"
>

<source
    src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
    type="audio/ogg"
>

</audio>


<script>

/* =====================================================
   API
===================================================== */

const ACCIDENT_API_URL =
"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


/* =====================================================
   STATE
===================================================== */

let accidentTimer = null;

let accidentLoading = false;

let firstLoad = true;

let knownIds = new Set();

let alertedOverdueIds = new Set();


/* =====================================================
   DOM
===================================================== */

const caseList =
    document.getElementById("caseList");

const refreshStatus =
    document.getElementById("refreshStatus");

const lastRefresh =
    document.getElementById("lastRefresh");

const alertSound =
    document.getElementById("alertSound");


/* =====================================================
   MAP
===================================================== */

const map =
    L.map("map")
    .setView(
        [35.1345,126.9902],
        13
    );


/* =====================================================
   MAP TILE
===================================================== */

const osm =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    );


const topo =
    L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        {
            maxZoom:17,
            attribution:
                "&copy; OpenTopoMap contributors"
        }
    );


const satellite =
    L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom:19,
            attribution:
                "Tiles &copy; Esri"
        }
    );


osm.addTo(map);


L.control.layers({

    "🗺 일반지도":osm,

    "⛰ 지형지도":topo,

    "🛰 위성지도":satellite

}).addTo(map);


/* =====================================================
   COORDINATE CONTROL
===================================================== */

const coordControl =
    L.control({
        position:"bottomleft"
    });


coordControl.onAdd =
function(){

    this._div =
        L.DomUtil.create(
            "div",
            "mouse-coords"
        );

    this._div.innerHTML =
        "Lat : --<br>Lng : --";

    return this._div;

};


coordControl.addTo(map);


map.on(
    "mousemove",
    function(e){

        coordControl._div.innerHTML =

            "Lat : " +
            e.latlng.lat.toFixed(6) +

            "<br>Lng : " +
            e.latlng.lng.toFixed(6);

    }
);


map.on(
    "mouseout",
    function(){

        coordControl._div.innerHTML =
            "Lat : --<br>Lng : --";

    }
);


/* =====================================================
   DRAW
===================================================== */

const drawnItems =
    new L.FeatureGroup();


map.addLayer(
    drawnItems
);


map.addControl(

    new L.Control.Draw({

        draw:{

            polygon:true,

            rectangle:true,

            marker:true,

            polyline:true,

            circle:true

        },

        edit:{
            featureGroup:drawnItems
        }

    })

);


map.on(
    L.Draw.Event.CREATED,
    function(e){

        drawnItems.addLayer(
            e.layer
        );

    }
);


/* =====================================================
   ACCIDENT LAYER
===================================================== */

const accidentLayer =
    L.layerGroup()
    .addTo(map);


/* =====================================================
   ALERT
===================================================== */

function playAlert(){

    try{

        alertSound.currentTime = 0;

        const promise =
            alertSound.play();

        if(
            promise &&
            typeof promise.catch === "function"
        ){

            promise.catch(
                function(){
                    console.log(
                        "브라우저 자동재생 정책으로 알림음 재생이 차단되었습니다."
                    );
                }
            );

        }

    }
    catch(err){

        console.error(
            "알림음 오류:",
            err
        );

    }

}


/* =====================================================
   API POST
===================================================== */

async function postAccident(payload){

    const response =
        await fetch(
            ACCIDENT_API_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(payload)

            }
        );


    const text =
        await response.text();


    let data;


    try{

        data =
            JSON.parse(text);

    }
    catch(e){

        data = {

            result:
                response.ok
                ? "success"
                : "error",

            message:text

        };

    }


    if(!response.ok){

        throw new Error(

            data.message ||
            "HTTP " +
            response.status

        );

    }


    return data;

}


/* =====================================================
   API GET
===================================================== */

async function getAccidents(){

    const response =
        await fetch(

            ACCIDENT_API_URL +
            "?action=list&t=" +
            Date.now(),

            {
                method:"GET",

                cache:"no-store"
            }

        );


    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    if(Array.isArray(data)){
        return data;
    }


    if(
        data &&
        Array.isArray(data.data)
    ){
        return data.data;
    }


    if(
        data &&
        Array.isArray(data.items)
    ){
        return data.items;
    }


    if(
        data &&
        Array.isArray(data.rows)
    ){
        return data.rows;
    }


    return [];

}


/* =====================================================
   FIELD
===================================================== */

function getField(
    item,
    names
){

    for(
        const name of names
    ){

        if(

            item &&
            item[name] !== undefined &&
            item[name] !== null &&
            String(item[name]).trim() !== ""

        ){

            return item[name];

        }

    }


    return "";

}


/* =====================================================
   ID
===================================================== */

function getAccidentId(
    item,
    index
){

    const value =
        getField(
            item,
            [
                "id",
                "ID",
                "caseId",
                "caseID",
                "사고ID"
            ]
        );


    if(value !== ""){

        return String(value);

    }


    /*
     * Apps Script에서 ID를 반환하지 않는
     * 경우를 위한 fallback
     */

    const createdAt =
        getField(
            item,
            [
                "createdAt",
                "timestamp",
                "접수시간"
            ]
        );


    const address =
        getField(
            item,
            [
                "address",
                "주소"
            ]
        );


    return (

        String(createdAt) +
        "|" +
        String(address) +
        "|" +
        String(index)

    );

}


/* =====================================================
   START TIME
===================================================== */

function getStartTime(item){

    return getField(

        item,

        [
            "startTime",
            "createdAt",
            "timestamp",
            "time",
            "date",
            "접수시간"
        ]

    );

}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(value){

    const status =
        String(value || "")
        .trim()
        .toUpperCase();


    if(

        status === "DONE" ||
        status === "완료" ||
        status === "처리완료" ||
        status === "사고처리완료"

    ){

        return "DONE";

    }


    if(

        status === "ARRIVED" ||
        status === "도착" ||
        status === "현장도착"

    ){

        return "ARRIVED";

    }


    return "RECEIVED";

}


/* =====================================================
   ELAPSED
===================================================== */

function getElapsedTime(
    startTime,
    endTime
){

    if(!startTime){

        return "-";

    }


    const start =
        new Date(startTime);


    if(
        Number.isNaN(
            start.getTime()
        )
    ){

        return "-";

    }


    const end =
        endTime
        ? new Date(endTime)
        : new Date();


    if(
        Number.isNaN(
            end.getTime()
        )
    ){

        return "-";

    }


    let diff =
        Math.floor(
            (
                end.getTime() -
                start.getTime()
            ) / 1000
        );


    if(diff < 0){
        diff = 0;
    }


    const hour =
        Math.floor(
            diff / 3600
        );


    diff %= 3600;


    const minute =
        Math.floor(
            diff / 60
        );


    const second =
        diff % 60;


    return (

        String(hour)
        .padStart(2,"0") +

        ":" +

        String(minute)
        .padStart(2,"0") +

        ":" +

        String(second)
        .padStart(2,"0")

    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return String(value ?? "")

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


function escapeJS(value){

    return String(value ?? "")

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /\r/g,
            "\\r"
        )

        .replace(
            /\n/g,
            "\\n"
        );

}


/* =====================================================
   FOCUS
===================================================== */

function focusAccident(
    lat,
    lng
){

    lat =
        Number(lat);

    lng =
        Number(lng);


    if(

        !Number.isFinite(lat) ||
        !Number.isFinite(lng)

    ){

        return;

    }


    map.setView(
        [lat,lng],
        17
    );


    L.popup()

        .setLatLng(
            [lat,lng]
        )

        .setContent(
            "🆘 사고 신고 위치"
        )

        .openOn(map);

}


/* =====================================================
   RENDER
===================================================== */

function renderAccidents(
    data
){

    accidentLayer.clearLayers();


    const rows =
        [...data].sort(

            function(a,b){

                const ta =
                    new Date(
                        getStartTime(a)
                    ).getTime();


                const tb =
                    new Date(
                        getStartTime(b)
                    ).getTime();


                if(
                    Number.isNaN(ta)
                ){
                    return 1;
                }


                if(
                    Number.isNaN(tb)
                ){
                    return -1;
                }


                return tb - ta;

            }

        );


    let html = "";


    rows.forEach(

        function(item,index){

            const id =
                getAccidentId(
                    item,
                    index
                );


            const status =
                normalizeStatus(

                    getField(
                        item,
                        [
                            "status",
                            "state",
                            "상태",
                            "처리상태"
                        ]
                    )

                );


            const startTime =
                getStartTime(item);


            const endTime =
                getField(
                    item,
                    [
                        "finishTime",
                        "endTime",
                        "completedAt",
                        "doneAt",
                        "완료시간"
                    ]
                );


            const lat =
                Number(

                    getField(
                        item,
                        [
                            "lat",
                            "latitude",
                            "위도"
                        ]
                    )

                );


            const lng =
                Number(

                    getField(
                        item,
                        [
                            "lng",
                            "longitude",
                            "경도"
                        ]
                    )

                );


            const address =
                getField(
                    item,
                    [
                        "address",
                        "주소",
                        "location",
                        "장소"
                    ]
                );


            const type =
                getField(
                    item,
                    [
                        "type",
                        "accidentType",
                        "신고유형",
                        "유형"
                    ]
                ) ||
                "기타";


            const symptom =
                getField(
                    item,
                    [
                        "symptom",
                        "condition",
                        "description",
                        "상황",
                        "내용"
                    ]
                );


            const phone =
                getField(
                    item,
                    [
                        "phone",
                        "tel",
                        "telephone",
                        "연락처"
                    ]
                );


            const kakaoMapURL =
                getField(
                    item,
                    [
                        "kakaoMapURL",
                        "kakaoUrl",
                        "mapUrl",
                        "지도URL"
                    ]
                );


            const elapsed =
                getElapsedTime(
                    startTime,
                    endTime || null
                );


            /*
             * 10분 이상 미처리
             */

            let overdue = false;


            if(

                status === "RECEIVED" &&
                startTime

            ){

                const start =
                    new Date(
                        startTime
                    ).getTime();


                if(
                    Number.isFinite(start)
                ){

                    overdue =

                        (
                            Date.now() -
                            start
                        ) / 60000 >= 10;

                }

            }


            /*
             * 상태 표시
             */

            let statusText =
                "접수";

            let statusClass =
                "status-received";


            if(
                status === "ARRIVED"
            ){

                statusText =
                    "현장도착";

                statusClass =
                    "status-arrived";

            }


            if(
                status === "DONE"
            ){

                statusText =
                    "처리완료";

                statusClass =
                    "status-done";

            }


            /*
             * 지도 마커
             */

            if(

                Number.isFinite(lat) &&
                Number.isFinite(lng)

            ){

                let markerColor =
                    "red";


                if(
                    status === "ARRIVED"
                ){

                    markerColor =
                        "orange";

                }


                if(
                    status === "DONE"
                ){

                    markerColor =
                        "#777";

                }


                const marker =
                    L.circleMarker(

                        [lat,lng],

                        {

                            radius:
                                status === "DONE"
                                ? 8
                                : 11,

                            color:
                                markerColor,

                            fillColor:
                                markerColor,

                            fillOpacity:.85,

                            weight:3

                        }

                    );


                marker.bindPopup(

                    `

                    <div style="
                        font-family:Arial,sans-serif;
                        min-width:230px;
                        color:#111;
                    ">

                        <b>
                            🆘 산악사고 신고
                        </b>

                        <hr>

                        <b>유형:</b>
                        ${escapeHTML(type)}

                        <br>

                        <b>상태:</b>
                        ${escapeHTML(statusText)}

                        <br>

                        <b>주소:</b>
                        ${escapeHTML(address || "-")}

                        <br>

                        <b>상황:</b>
                        ${escapeHTML(symptom || "-")}

                        <br>

                        <b>접수:</b>
                        ${escapeHTML(startTime || "-")}

                        <br>

                        <b>경과:</b>
                        ${escapeHTML(elapsed)}

                        <br><br>

                        ${
                            phone

                            ?

                            `

                            <a

                                href="tel:${escapeAttribute(phone)}"

                                style="
                                    display:inline-block;
                                    padding:6px 10px;
                                    background:#700000;
                                    color:white;
                                    text-decoration:none;
                                    border-radius:4px;
                                "

                            >

                                📞 연락

                            </a>

                            `

                            :

                            ""

                        }


                        ${
                            kakaoMapURL

                            ?

                            `

                            <a

                                href="${escapeAttribute(kakaoMapURL)}"

                                target="_blank"

                                rel="noopener"

                                style="
                                    display:inline-block;
                                    padding:6px 10px;
                                    background:#1769aa;
                                    color:white;
                                    text-decoration:none;
                                    border-radius:4px;
                                    margin-left:4px;
                                "

                            >

                                🗺 지도

                            </a>

                            `

                            :

                            ""

                        }

                    </div>

                    `

                );


                marker.on(
                    "click",
                    function(){

                        map.setView(
                            [lat,lng],
                            17
                        );

                    }
                );


                marker.addTo(
                    accidentLayer
                );

            }


            /*
             * 카드 스타일
             */

            let cardClass =
                "case-card";


            if(
                status === "DONE"
            ){

                cardClass +=
                    " done";

            }
            else if(
                status === "ARRIVED"
            ){

                cardClass +=
                    " arrived";

            }


            if(

                overdue &&
                status === "RECEIVED"

            ){

                cardClass +=
                    " blink";

            }


            /*
             * 아이콘
             */

            let typeIcon =
                "🆘";


            if(
                type === "응급환자"
            ){

                typeIcon =
                    "🚑";

            }
            else if(
                type === "구조출동"
            ){

                typeIcon =
                    "🚓";

            }
            else if(
                type === "조난"
            ){

                typeIcon =
                    "🆘";

            }
            else if(
                type === "기타"
            ){

                typeIcon =
                    "✏️";

            }


            /*
             * 상태 버튼
             */

            let actionButtons =
                "";


            if(
                status === "RECEIVED"
            ){

                actionButtons =

                    `

                    <button

                        class="arrive-btn"

                        type="button"

                        onclick="
                            updateAccidentStatus(
                                '${escapeJS(id)}',
                                'ARRIVED'
                            )
                        "

                    >

                        🚓 현장 도착

                    </button>

                    `;

            }


            if(
                status === "ARRIVED"
            ){

                actionButtons =

                    `

                    <button

                        class="complete-btn"

                        type="button"

                        onclick="
                            updateAccidentStatus(
                                '${escapeJS(id)}',
                                'DONE'
                            )
                        "

                    >

                        ✅ 구조 완료

                    </button>

                    `;

            }


            /*
             * 위치 버튼
             */

            const mapButton =

                Number.isFinite(lat) &&
                Number.isFinite(lng)

                ?

                `

                <button

                    class="map-btn"

                    type="button"

                    onclick="
                        focusAccident(
                            ${lat},
                            ${lng}
                        )
                    "

                >

                    📍 사고 위치 보기

                </button>

                `

                :

                "";


            /*
             * 관리 버튼
             */

            const manageButtons =

                `

                <div style="
                    display:grid;
                    grid-template-columns:1fr 1fr;
                    gap:5px;
                    margin-top:6px;
                ">

                    <button

                        class="edit-btn"

                        type="button"

                        onclick="
                            editAccident(
                                '${escapeJS(id)}'
                            )
                        "

                    >

                        ✏ 신고 수정

                    </button>


                    <button

                        class="delete-btn"

                        type="button"

                        onclick="
                            deleteAccident(
                                '${escapeJS(id)}'
                            )
                        "

                    >

                        🗑 신고 삭제

                    </button>

                </div>

                `;


            /*
             * 카드
             */

            html +=

                `

                <div

                    class="${cardClass}"

                    data-case-id="${escapeHTML(id)}"

                >

                    <div style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        gap:8px;
                    ">

                        <strong>

                            ${typeIcon}

                            ${escapeHTML(type)}

                        </strong>


                        <span
                            class="${statusClass}"
                        >

                            ${statusText}

                        </span>

                    </div>


                    ${
                        overdue &&
                        status === "RECEIVED"

                        ?

                        `

                        <div style="
                            color:#ff3333;
                            font-weight:bold;
                            margin-top:6px;
                        ">

                            ⚠ 10분 이상 미처리

                        </div>

                        `

                        :

                        ""

                    }


                    <div style="
                        margin-top:8px;
                    ">

                        <b>상황</b>

                        <br>

                        ${escapeHTML(
                            symptom || "-"
                        )}

                    </div>


                    <div style="
                        margin-top:6px;
                    ">

                        <b>주소</b>

                        <br>

                        ${escapeHTML(
                            address || "-"
                        )}

                    </div>


                    <div style="
                        margin-top:6px;
                    ">

                        <b>연락처</b>

                        <br>

                        ${
                            phone

                            ?

                            `

                            <a

                                href="tel:${escapeAttribute(phone)}"

                                style="
                                    color:#00ff9d;
                                "

                            >

                                ${escapeHTML(phone)}

                            </a>

                            `

                            :

                            "-"

                        }

                    </div>


                    <div
                        class="time"
                        style="margin-top:6px"
                    >

                        접수:
                        ${escapeHTML(
                            startTime || "-"
                        )}

                    </div>


                    <div class="time">

                        경과:
                        ${escapeHTML(elapsed)}

                    </div>


                    ${
                        endTime

                        ?

                        `

                        <div class="time">

                            완료:
                            ${escapeHTML(endTime)}

                        </div>

                        `

                        :

                        ""

                    }


                    ${
                        Number.isFinite(lat) &&
                        Number.isFinite(lng)

                        ?

                        `

                        <div class="coord">

                            Lat:
                            ${lat.toFixed(6)}

                            <br>

                            Lng:
                            ${lng.toFixed(6)}

                        </div>

                        `

                        :

                        ""

                    }


                    ${mapButton}


                    ${actionButtons}


                    ${manageButtons}


                </div>

                `;


            /*
             * 신규 신고 알림
             */

            if(

                !firstLoad &&
                !knownIds.has(id)

            ){

                playAlert();

            }


            /*
             * 10분 이상 미처리 알림
             */

            if(

                overdue &&
                !alertedOverdueIds.has(id)

            ){

                alertedOverdueIds.add(id);


                if(!firstLoad){

                    playAlert();

                }

            }


            knownIds.add(id);

        }

    );


    caseList.innerHTML =

        html ||

        `

        <div class="case-card">

            현재 접수된 사고가 없습니다.

        </div>

        `;


    lastRefresh.textContent =
        new Date()
        .toLocaleTimeString("ko-KR");


    refreshStatus.textContent =
        "정상 작동";


    firstLoad = false;

}


/* =====================================================
   LOAD ACCIDENTS
===================================================== */

async function loadAccidents(){

    if(accidentLoading){

        return;

    }


    accidentLoading = true;


    refreshStatus.textContent =
        "조회중...";


    try{

        const rows =
            await getAccidents();


        renderAccidents(
            rows
        );

    }
    catch(err){

        console.error(
            "사고 목록 조회 오류:",
            err
        );


        refreshStatus.textContent =
            "조회 오류";


        if(firstLoad){

            caseList.innerHTML =

                `

                <div class="case-card">

                    ⚠ 사고 목록을 불러오지 못했습니다.

                    <br><br>

                    ${escapeHTML(
                        err.message
                    )}

                </div>

                `;

        }

    }
    finally{

        accidentLoading = false;

    }

}


/* =====================================================
   FIND ACCIDENT
===================================================== */

async function findAccidentById(
    caseId
){

    const rows =
        await getAccidents();


    for(
        let i=0;
        i<rows.length;
        i++
    ){

        const id =
            getAccidentId(
                rows[i],
                i
            );


        if(
            String(id) ===
            String(caseId)
        ){

            return rows[i];

        }

    }


    return null;

}


/* =====================================================
   EDIT
===================================================== */

async function editAccident(
    caseId
){

    try{

        const item =
            await findAccidentById(
                caseId
            );


        if(!item){

            alert(
                "수정할 신고 내용을 찾을 수 없습니다."
            );

            return;

        }


        /*
         * 현재 구조에서는
         * 별도의 입력 폼을 만들지 않고
         * prompt로 수정합니다.
         */

        const currentType =
            getField(
                item,
                [
                    "type",
                    "accidentType",
                    "신고유형",
                    "유형"
                ]
            );


        const currentSymptom =
            getField(
                item,
                [
                    "symptom",
                    "condition",
                    "description",
                    "상황",
                    "내용"
                ]
            );


        const currentPhone =
            getField(
                item,
                [
                    "phone",
                    "tel",
                    "telephone",
                    "연락처"
                ]
            );


        const currentAddress =
            getField(
                item,
                [
                    "address",
                    "주소",
                    "location",
                    "장소"
                ]
            );


        const currentLat =
            getField(
                item,
                [
                    "lat",
                    "latitude",
                    "위도"
                ]
            );


        const currentLng =
            getField(
                item,
                [
                    "lng",
                    "longitude",
                    "경도"
                ]
            );


        const type =
            prompt(
                "신고 유형\n\n예: 조난 / 구조출동 / 응급환자 / 기타",
                currentType
            );


        if(type === null){
            return;
        }


        const symptom =
            prompt(
                "사고 상황",
                currentSymptom
            );


        if(symptom === null){
            return;
        }


        const phone =
            prompt(
                "연락처",
                currentPhone
            );


        if(phone === null){
            return;
        }


        const address =
            prompt(
                "주소",
                currentAddress
            );


        if(address === null){
            return;
        }


        const lat =
            Number(
                prompt(
                    "위도",
                    currentLat
                )
            );


        if(!Number.isFinite(lat)){

            alert(
                "위도 값이 올바르지 않습니다."
            );

            return;

        }


        const lng =
            Number(
                prompt(
                    "경도",
                    currentLng
                )
            );


        if(!Number.isFinite(lng)){

            alert(
                "경도 값이 올바르지 않습니다."
            );

            return;

        }


        if(

            !type.trim() ||
            !symptom.trim() ||
            !phone.trim() ||
            !address.trim()

        ){

            alert(
                "필수 내용을 입력하세요."
            );

            return;

        }


        if(

            !confirm(
                "✏ 신고 내용을 수정하시겠습니까?"
            )

        ){

            return;

        }


        const result =
            await postAccident({

                action:"update",

                id:String(caseId),

                type:type.trim(),

                symptom:symptom.trim(),

                phone:phone.trim(),

                address:address.trim(),

                lat:lat,

                lng:lng,

                kakaoMapURL:

                    "https://map.kakao.com/link/map/" +
                    lat +
                    "," +
                    lng

            });


        if(

            !result ||
            result.result !== "success"

        ){

            throw new Error(

                result &&
                result.message

                ?

                result.message

                :

                "수정 실패"

            );

        }


        alert(
            "✏ 신고 내용이 수정되었습니다."
        );


        await loadAccidents();

    }
    catch(err){

        console.error(
            "수정 오류:",
            err
        );


        alert(

            "❌ 신고 수정 실패\n\n" +
            err.message

        );

    }

}


/* =====================================================
   DELETE
===================================================== */

async function deleteAccident(
    caseId
){

    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    const password =
        prompt(
            "🔐 신고 삭제 비밀번호를 입력하세요."
        );


    if(password === null){

        return;

    }


    if(!password.trim()){

        alert(
            "삭제 비밀번호를 입력하세요."
        );

        return;

    }


    if(

        !confirm(

            "⚠ 신고 내용을 삭제하시겠습니까?\n\n" +
            "삭제하면 Google Sheets에서도 해당 신고가 삭제됩니다."

        )

    ){

        return;

    }


    const cards =
        document.querySelectorAll(
            `[data-case-id="${CSS.escape(
                String(caseId)
            )}"]`
        );


    cards.forEach(
        function(card){

            card.style.opacity =
                ".5";

            card.style.pointerEvents =
                "none";

        }
    );


    try{

        const result =
            await postAccident({

                action:"delete",

                id:String(caseId),

                password:
                    password

            });


        if(

            !result ||
            result.result !== "success"

        ){

            throw new Error(

                result &&
                result.message

                ?

                result.message

                :

                "삭제 실패"

            );

        }


        alert(
            "🗑 신고가 삭제되었습니다."
        );


        await loadAccidents();

    }
    catch(err){

        console.error(
            "삭제 오류:",
            err
        );


        alert(

            "❌ 신고 삭제 실패\n\n" +
            err.message

        );


        await loadAccidents();

    }

}


/* =====================================================
   STATUS UPDATE
===================================================== */

async function updateAccidentStatus(
    caseId,
    newStatus
){

    const status =
        normalizeStatus(
            newStatus
        );


    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    let message = "";


    let action = "";


    if(
        status === "ARRIVED"
    ){

        message =
            "🚓 현장 도착으로 변경하시겠습니까?";

        action =
            "complete";

    }


    else if(
        status === "DONE"
    ){

        message =
            "✅ 구조 완료로 변경하시겠습니까?";

        action =
            "finish";

    }


    else{

        return;

    }


    if(!confirm(message)){

        return;

    }


    try{

        const result =
            await postAccident({

                action:action,

                id:String(caseId)

            });


        if(

            !result ||
            result.result !== "success"

        ){

            throw new Error(

                result &&
                result.message

                ?

                result.message

                :

                "상태 변경 실패"

            );

        }


        alert(

            status === "ARRIVED"

            ?

            "🚓 현장 도착 처리 완료"

            :

            "✅ 구조 완료 처리 완료"

        );


        await loadAccidents();

    }
    catch(err){

        console.error(
            "상태 변경 오류:",
            err
        );


        alert(

            "❌ 상태 변경 실패\n\n" +
            err.message

        );

    }

}


/* =====================================================
   AUTO REFRESH
===================================================== */

function startAccidentAutoRefresh(){

    if(accidentTimer){

        clearInterval(
            accidentTimer
        );

    }


    /*
     * 최초 조회
     */

    loadAccidents();


    /*
     * 5초마다 조회
     */

    accidentTimer =

        setInterval(

            function(){

                if(
                    !document.hidden
                ){

                    loadAccidents();

                }

            },

            5000

        );

}


/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(

    "visibilitychange",

    function(){

        if(
            !document.hidden
        ){

            loadAccidents();

        }

    }

);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

    "resize",

    function(){

        setTimeout(

            function(){

                map.invalidateSize();

            },

            100

        );

    }

);


/* =====================================================
   INITIALIZE
===================================================== */

window.addEventListener(

    "load",

    function(){

        /*
         * 사고 목록 시작
         */

        startAccidentAutoRefresh();


        /*
         * 지도 크기 재계산
         */

        setTimeout(

            function(){

                map.invalidateSize();

            },

            500

        );

    }

);


/* =====================================================
   MANUAL REFRESH
===================================================== */

document.addEventListener(

    "keydown",

    function(e){

        /*
         * Ctrl + Shift + R
         */

        if(

            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "r"

        ){

            e.preventDefault();

            loadAccidents();

        }

    }

);


/* =====================================================
   RIGHT CLICK BLOCK
===================================================== */

document.addEventListener(

    "contextmenu",

    function(e){

        e.preventDefault();

    }

);

</script>

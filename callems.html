<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<title>🆘 무등산특수구조팀 신고접수</title>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
}

header{
    background:#b71c1c;
    padding:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.container{
    padding:15px;
    max-width:1200px;
    margin:auto;
}

.form-box{
    background:#222;
    padding:12px;
    margin-bottom:15px;
    border-radius:6px;
}

input,
textarea{
    width:100%;
    padding:10px;
    margin-bottom:8px;
    border-radius:6px;
    border:none;
    outline:none;
}

textarea{
    min-height:80px;
    resize:vertical;
}

button{
    padding:9px 12px;
    background:#e53935;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.85;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}


/* 지도 */

#map{
    width:100%;
    height:65vh;
    min-height:450px;
    max-height:750px;
    margin-bottom:15px;
    border-radius:6px;
    overflow:hidden;
}


/* 신고 유형 */

.type-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:10px;
}

.type-btn{
    padding:12px;
    border-radius:8px;
    font-weight:bold;
}

.type-btn.active{
    outline:3px solid #fff;
}

.type-btn.emergency{
    background:#e53935;
}

.type-btn.dispatch{
    background:#1e88e5;
}

.type-btn.lost{
    background:#fbc02d;
    color:#111;
}

.type-btn.other{
    background:#9e9e9e;
}


/* 신고 카드 */

.card{
    background:#1e1e1e;
    padding:12px;
    margin-bottom:10px;
    border-radius:6px;
}

.card.done{
    opacity:.6;
    background:#2b2b2b;
}


/* 상태 */

.status{
    display:inline-block;
    padding:5px 9px;
    margin:5px 0 8px 0;
    border-radius:5px;
    font-size:13px;
    font-weight:bold;
}

.status.received{
    background:#d50000;
}

.status.arrived{
    background:#ef6c00;
}

.status.done{
    background:#777;
}


/* 버튼 */

.case-btn{
    margin-top:8px;
    background:#2e7d32;
}

.finish-btn{
    margin-top:8px;
    background:#616161;
}

.delete-btn{
    margin-top:8px;
    background:#b71c1c;
}


/* 링크 */

.maplink{
    color:#4fc3f7;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

.maplink:hover{
    text-decoration:underline;
}


/* 좌표 */

.coord{
    color:#aaa;
    font-size:12px;
    margin-top:5px;
    margin-bottom:5px;
}


/* 로딩 */

#loading{
    display:none;
    text-align:center;
    padding:15px;
    color:#ffcc00;
    font-weight:bold;
}


/* 모바일 */

@media(max-width:600px){

    header{
        font-size:18px;
        padding:13px;
    }

    .container{
        padding:10px;
    }

    #map{
        height:65vh;
        min-height:400px;
    }

}

</style>

</head>


<body>


<header>
    🆘 무등산특수구조팀 신고접수
</header>


<div class="container">


    <!-- ==============================
         지도
    =============================== -->

    <div id="map"></div>


    <!-- ==============================
         입력
    =============================== -->

    <div class="form-box">

        <div class="type-grid">

            <button
                class="type-btn emergency"
                data-type="응급환자"
            >
                🚑 응급환자
            </button>

            <button
                class="type-btn dispatch"
                data-type="구조출동"
            >
                🚓 구조출동
            </button>

            <button
                class="type-btn lost"
                data-type="조난"
            >
                🆘 조난
            </button>

            <button
                class="type-btn other"
                data-type="기타"
            >
                ✏ 기타
            </button>

        </div>


        <textarea
            id="condition"
            placeholder="상황 입력"
        ></textarea>


        <input
            id="phone"
            placeholder="연락처 (010-0000-0000)"
        >


        <input
            id="address"
            placeholder="주소"
        >


        <input
            id="lat"
            placeholder="위도"
        >


        <input
            id="lng"
            placeholder="경도"
        >


        <button
            id="submitBtn"
            onclick="submitData()"
        >
            🆘 신고접수
        </button>

    </div>


    <div id="loading">
        ⏳ 데이터를 불러오는 중입니다...
    </div>


    <!-- 로고 -->

    <img
        src="https://mudeung.github.io/rescue/logogomir1.png"
        alt="달콩이 이미지"
        style="
            display:block;
            margin:0 auto 15px auto;
            max-width:100%;
        "
    >


    <!-- 신고 목록 -->

    <div id="listArea"></div>

</div>


<audio id="alertSound">

    <source
        src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
        type="audio/ogg"
    >

</audio>


<script>


/* =====================================================
   설정
===================================================== */


/*
 * Google Apps Script 웹앱 주소
 *
 * 현재 사용 중인 배포 URL
 */

const API_URL =
    "https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";



/* =====================================================
   변수
===================================================== */

let map = null;

let geocoder = null;

let previewMarker = null;

let markers = [];

let selectedType = "";


/*
 * 새 신고 알림용
 */

let knownIds = new Set();

let firstLoad = true;


/* =====================================================
   DOM
===================================================== */

const conditionEl =
    document.getElementById("condition");

const phoneEl =
    document.getElementById("phone");

const addressEl =
    document.getElementById("address");

const latEl =
    document.getElementById("lat");

const lngEl =
    document.getElementById("lng");

const listArea =
    document.getElementById("listArea");

const loadingEl =
    document.getElementById("loading");

const submitBtn =
    document.getElementById("submitBtn");



/* =====================================================
   지도 초기화
===================================================== */

function initMap(){

    map =
        new kakao.maps.Map(

            document.getElementById("map"),

            {

                center:
                    new kakao.maps.LatLng(
                        35.1345,
                        126.9902
                    ),

                level:6

            }

        );


    geocoder =
        new kakao.maps.services.Geocoder();

}


/* =====================================================
   신고 유형
===================================================== */

document
.querySelectorAll(".type-btn")
.forEach(
    function(btn){

        btn.addEventListener(
            "click",
            function(){

                document
                .querySelectorAll(".type-btn")
                .forEach(
                    function(b){

                        b.classList.remove(
                            "active"
                        );

                    }
                );


                btn.classList.add(
                    "active"
                );


                selectedType =
                    btn.dataset.type;

            }
        );

    }
);


/* =====================================================
   주소 → 좌표
===================================================== */

addressEl.addEventListener(
    "change",
    function(){

        const address =
            this.value.trim();


        if(!address){
            return;
        }


        if(!geocoder){
            alert("지도 초기화 중입니다.");
            return;
        }


        geocoder.addressSearch(

            address,

            function(result,status){

                if(
                    status ===
                    kakao.maps.services.Status.OK
                ){

                    const lat =
                        Number(
                            result[0].y
                        );

                    const lng =
                        Number(
                            result[0].x
                        );


                    latEl.value =
                        lat.toFixed(6);

                    lngEl.value =
                        lng.toFixed(6);


                    const pos =
                        new kakao.maps.LatLng(
                            lat,
                            lng
                        );


                    map.setCenter(
                        pos
                    );

                    map.setLevel(
                        3
                    );


                    if(previewMarker){

                        previewMarker.setMap(
                            null
                        );

                    }


                    previewMarker =
                        new kakao.maps.Marker({

                            map:map,

                            position:pos

                        });

                }
                else{

                    alert(
                        "주소를 찾을 수 없습니다."
                    );

                }

            }

        );

    }
);


/* =====================================================
   신고 접수
===================================================== */

async function submitData(){

    const condition =
        conditionEl.value.trim();

    const phone =
        phoneEl.value.trim();

    const address =
        addressEl.value.trim();

    const lat =
        Number(
            latEl.value
        );

    const lng =
        Number(
            lngEl.value
        );


    if(!selectedType){

        alert(
            "🚨 신고 유형을 선택해주세요."
        );

        return;

    }


    if(!condition){

        alert(
            "📝 상황을 입력해주세요."
        );

        conditionEl.focus();

        return;

    }


    if(!phone){

        alert(
            "📞 연락처를 입력해주세요."
        );

        phoneEl.focus();

        return;

    }


    if(!address){

        alert(
            "🏠 주소를 입력해주세요."
        );

        addressEl.focus();

        return;

    }


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        alert(
            "📍 주소 검색으로 위치를 확인해주세요."
        );

        return;

    }


    if(
        lat < -90 ||
        lat > 90 ||
        lng < -180 ||
        lng > 180
    ){

        alert(
            "📍 GPS 좌표가 올바르지 않습니다."
        );

        return;

    }


    const phonePattern =
        /^[0-9\-]{9,13}$/;


    if(
        !phonePattern.test(phone)
    ){

        alert(
            "📞 연락처 형식이 올바르지 않습니다."
        );

        return;

    }


    submitBtn.disabled =
        true;

    submitBtn.innerText =
        "⏳ 접수 중...";


    try{

        const result =
            await postData({

                lat:lat,

                lng:lng,

                address:address,

                symptom:condition,

                phone:phone,

                type:selectedType,

                kakaoMapURL:
                    `https://map.kakao.com/link/map/구조요청 위치,${lat},${lng}`

            });


        if(
            result.result === "success"
        ){

            alert(
                "🆘 신고가 정상적으로 접수되었습니다."
            );


            clearForm();

            await loadData();

        }
        else if(
            result.result === "blocked"
        ){

            alert(
                "⚠️ " +
                (
                    result.message ||
                    "동일 위치의 중복 신고입니다."
                )
            );

        }
        else{

            alert(
                "❌ 신고 접수 실패\n" +
                (
                    result.message ||
                    "알 수 없는 오류"
                )
            );

        }

    }
    catch(err){

        console.error(err);

        alert(
            "❌ 신고 접수 중 오류가 발생했습니다.\n" +
            err.message
        );

    }
    finally{

        submitBtn.disabled =
            false;

        submitBtn.innerText =
            "🆘 신고접수";

    }

}


/* =====================================================
   POST 공통 함수
===================================================== */

async function postData(data){

    const response =
        await fetch(

            API_URL,

            {

                method:"POST",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(data)

            }

        );


    if(!response.ok){

        throw new Error(
            "서버 응답 오류: " +
            response.status
        );

    }


    return await response.json();

}


/* =====================================================
   입력 초기화
===================================================== */

function clearForm(){

    conditionEl.value = "";

    phoneEl.value = "";

    addressEl.value = "";

    latEl.value = "";

    lngEl.value = "";

    selectedType = "";


    document
    .querySelectorAll(".type-btn")
    .forEach(
        function(btn){

            btn.classList.remove(
                "active"
            );

        }
    );


    if(previewMarker){

        previewMarker.setMap(
            null
        );

        previewMarker = null;

    }

}


/* =====================================================
   현장도착
===================================================== */

async function completeCase(id){

    if(
        !confirm(
            "🚑 구조대원이 현장에 도착했습니까?"
        )
    ){

        return;

    }


    try{

        const result =
            await postData({

                action:"complete",

                id:id

            });


        if(
            result.result === "success"
        ){

            alert(
                "🚑 현장도착 처리되었습니다."
            );

            await loadData();

        }
        else{

            alert(
                "❌ 현장도착 처리 실패\n" +
                (
                    result.message ||
                    ""
                )
            );

        }

    }
    catch(err){

        console.error(err);

        alert(
            "❌ 현장도착 처리 중 오류가 발생했습니다."
        );

    }

}


/* =====================================================
   사고처리 완료
===================================================== */

async function finishCase(id){

    if(
        !confirm(
            "⚪ 사고처리를 완료하시겠습니까?"
        )
    ){

        return;

    }


    try{

        const result =
            await postData({

                action:"finish",

                id:id

            });


        if(
            result.result === "success"
        ){

            alert(
                "⚪ 사고처리가 완료되었습니다."
            );

            await loadData();

        }
        else{

            alert(
                "❌ 사고처리 완료 실패\n" +
                (
                    result.message ||
                    ""
                )
            );

        }

    }
    catch(err){

        console.error(err);

        alert(
            "❌ 사고처리 완료 중 오류가 발생했습니다."
        );

    }

}


/* =====================================================
   상태 색상
===================================================== */

function getMarkerColor(status){

    if(status === "DONE"){

        return "#777";

    }


    if(status === "ARRIVED"){

        return "#fb8c00";

    }


    return "#e53935";

}


/* =====================================================
   마커 이미지
===================================================== */

function createMarkerImage(status){

    const color =
        getMarkerColor(status);


    const svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="40"
            height="40"
            viewBox="0 0 40 40"
        >

            <circle
                cx="20"
                cy="20"
                r="18"
                fill="${color}"
                stroke="#fff"
                stroke-width="3"
            />

            <circle
                cx="20"
                cy="20"
                r="7"
                fill="#fff"
            />

        </svg>

    `;


    return new kakao.maps.MarkerImage(

        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg),

        new kakao.maps.Size(
            40,
            40
        ),

        {

            offset:
                new kakao.maps.Point(
                    20,
                    20
                )

        }

    );

}


/* =====================================================
   상태 표시
===================================================== */

function getStatusHTML(status){

    if(status === "DONE"){

        return `
            <div class="status done">
                ⚪ 사고처리완료
            </div>
        `;

    }


    if(status === "ARRIVED"){

        return `
            <div class="status arrived">
                🟠 현장도착
            </div>
        `;

    }


    return `
        <div class="status received">
            🔴 사고 접수
        </div>
    `;

}


/* =====================================================
   날짜 표시
===================================================== */

function formatDate(value){

    if(!value){
        return "";
    }


    /*
     * Apps Script에서
     * yyyy-MM-dd HH:mm:ss 형태로 반환하므로
     * 그대로 표시하는 것이 안전함
     */

    return String(value);

}


/* =====================================================
   지도 팝업
===================================================== */

function createInfoWindow(
    item,
    lat,
    lng
){

    let statusText =
        "🔴 사고 접수";

    let statusColor =
        "#e53935";


    if(item.status === "ARRIVED"){

        statusText =
            "🟠 현장도착";

        statusColor =
            "#fb8c00";

    }


    if(item.status === "DONE"){

        statusText =
            "⚪ 사고처리완료";

        statusColor =
            "#777";

    }


    const content = `

        <div style="
            padding:12px;
            color:#222;
            font-family:Arial,sans-serif;
            font-size:13px;
            min-width:240px;
            line-height:1.5;
        ">

            <div style="
                font-size:16px;
                font-weight:bold;
                margin-bottom:8px;
            ">
                🆘 산악사고 신고
            </div>


            <div style="
                display:inline-block;
                padding:5px 10px;
                background:${statusColor};
                color:#fff;
                border-radius:5px;
                font-weight:bold;
                margin-bottom:8px;
            ">
                ${statusText}
            </div>


            <br>


            🚨 <b>신고유형</b><br>
            ${escapeHTML(item.type || "미입력")}


            <br><br>


            🕒 <b>접수시간</b><br>
            ${escapeHTML(formatDate(item.time))}


            <br><br>


            📝 <b>상황</b><br>
            ${escapeHTML(item.symptom || "내용없음")}


            <br><br>


            🏠 <b>주소</b><br>
            ${escapeHTML(item.address || "주소없음")}


            <br><br>


            📞 <b>연락처</b><br>
            ${escapeHTML(item.phone || "번호없음")}


            <br><br>


            📍 <b>좌표</b><br>
            ${lat.toFixed(6)},
            ${lng.toFixed(6)}


            ${
                item.completeTime
                ?
                `
                    <br><br>

                    🚑 <b>현장도착</b><br>
                    ${escapeHTML(
                        formatDate(
                            item.completeTime
                        )
                    )}
                `
                :
                ""
            }


            ${
                item.finishTime
                ?
                `
                    <br><br>

                    ⚪ <b>사고처리 완료</b><br>
                    ${escapeHTML(
                        formatDate(
                            item.finishTime
                        )
                    )}
                `
                :
                ""
            }


            <div style="
                margin-top:10px;
            ">

                <a
                    href="https://map.kakao.com/link/map/구조요청 위치,${lat},${lng}"
                    target="_blank"
                    style="
                        color:#1976d2;
                        text-decoration:none;
                        font-weight:bold;
                    "
                >
                    📍 카카오맵에서 보기
                </a>

            </div>

        </div>

    `;


    return new kakao.maps.InfoWindow({

        content:content,

        removable:true

    });

}


/* =====================================================
   HTML 문자 이스케이프
===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   데이터 로딩
===================================================== */

async function loadData(){

    try{

        loadingEl.style.display =
            "block";


        const response =
            await fetch(
                API_URL +
                "?action=list&t=" +
                Date.now()
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "서버 데이터 형식이 올바르지 않습니다."
            );

        }


        /*
         * 최신순
         */

        data.sort(
            function(a,b){

                return String(b.time || "")
                    .localeCompare(
                        String(a.time || "")
                    );

            }
        );


        /*
         * 새 신고 감지
         */

        const currentIds =
            new Set(
                data
                .map(
                    function(item){
                        return String(item.id);
                    }
                )
            );


        if(!firstLoad){

            let newReport = false;


            data.forEach(
                function(item){

                    if(
                        !knownIds.has(
                            String(item.id)
                        )
                    ){

                        newReport = true;

                    }

                }
            );


            if(newReport){

                playAlert();

            }

        }


        knownIds =
            currentIds;

        firstLoad = false;


        /*
         * 목록 초기화
         */

        listArea.innerHTML =
            "";


        /*
         * 기존 마커 제거
         */

        markers.forEach(
            function(marker){

                marker.setMap(null);

            }
        );


        markers = [];


        /*
         * 신고 없음
         */

        if(data.length === 0){

            listArea.innerHTML = `
                <div class="card">
                    현재 접수된 신고가 없습니다.
                </div>
            `;

            return;

        }


        /*
         * 신고 생성
         */

        data.forEach(
            function(item){

                createMapMarker(item);

                createCard(item);

            }
        );


        /*
         * 모든 마커 표시
         */

        fitMapToMarkers();

    }
    catch(err){

        console.error(err);

        listArea.innerHTML = `

            <div class="card">

                ❌ Google Apps Script 데이터를
                불러오지 못했습니다.

                <br><br>

                ${escapeHTML(err.message)}

            </div>

        `;

    }
    finally{

        loadingEl.style.display =
            "none";

    }

}


/* =====================================================
   지도 마커 생성
===================================================== */

function createMapMarker(item){

    const lat =
        Number(item.lat);

    const lng =
        Number(item.lng);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return;

    }


    const position =
        new kakao.maps.LatLng(
            lat,
            lng
        );


    const marker =
        new kakao.maps.Marker({

            map:map,

            position:position,

            title:
                item.type ||
                "사고 신고",

            image:
                createMarkerImage(
                    item.status
                )

        });


    markers.push(
        marker
    );


    const infoWindow =
        createInfoWindow(
            item,
            lat,
            lng
        );


    kakao.maps.event.addListener(

        marker,

        "click",

        function(){

            infoWindow.open(
                map,
                marker
            );

        }

    );

}


/* =====================================================
   신고 카드 생성
===================================================== */

function createCard(item){

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "card" +
        (
            item.status === "DONE"
            ?
            " done"
            :
            ""
        );


    const status =
        item.status;


    let actionHTML = "";


    /*
     * 접수
     */

    if(
        status === "RECEIVED"
    ){

        actionHTML = `

            <button
                class="case-btn"
                onclick="
                    completeCase('${safeJS(item.id)}')
                "
            >
                🚑 현장도착
            </button>

        `;

    }


    /*
     * 현장도착
     */

    else if(
        status === "ARRIVED"
    ){

        actionHTML = `

            <button
                class="finish-btn"
                onclick="
                    finishCase('${safeJS(item.id)}')
                "
            >
                ⚪ 사고처리 완료
            </button>

        `;

    }


    /*
     * 완료
     */

    else{

        actionHTML = `

            <span style="
                display:inline-block;
                margin-top:8px;
                color:#aaa;
                font-weight:bold;
            ">
                ✔ 처리완료
            </span>

        `;

    }


    div.innerHTML = `

        <div style="
            color:#ffcc00;
            font-size:14px;
            margin-bottom:5px;
        ">

            🕒
            ${escapeHTML(
                formatDate(item.time)
            )}

        </div>


        ${getStatusHTML(status)}


        ${
            item.completeTime
            ?
            `
                <div style="
                    color:#ffcc00;
                    font-size:13px;
                    margin-bottom:5px;
                ">

                    🚑 현장도착:
                    ${escapeHTML(
                        formatDate(
                            item.completeTime
                        )
                    )}

                </div>
            `
            :
            ""
        }


        ${
            item.finishTime
            ?
            `
                <div style="
                    color:#ffcc00;
                    font-size:13px;
                    margin-bottom:5px;
                ">

                    ⚪ 사고처리 완료:
                    ${escapeHTML(
                        formatDate(
                            item.finishTime
                        )
                    )}

                </div>
            `
            :
            ""
        }


        🚨 <b>유형:</b>
        ${escapeHTML(
            item.type || "미입력"
        )}

        <br><br>


        🏠 <b>주소:</b>
        ${escapeHTML(
            item.address || "주소없음"
        )}

        <br><br>


        📞 <b>연락처:</b>
        ${escapeHTML(
            item.phone || "번호없음"
        )}

        <br><br>


        📝 <b>상황:</b>
        ${escapeHTML(
            item.symptom || "내용없음"
        )}


        <div class="coord">

            위도:
            ${escapeHTML(item.lat)}

            /

            경도:
            ${escapeHTML(item.lng)}

        </div>


        <a
            class="maplink"
            href="https://map.kakao.com/link/map/구조요청 위치,${encodeURIComponent(item.lat)},${encodeURIComponent(item.lng)}"
            target="_blank"
        >
            📍 지도보기
        </a>


        <br>


        ${actionHTML}

    `;


    listArea.appendChild(
        div
    );

}


/* =====================================================
   JS 문자열 안전처리
===================================================== */

function safeJS(value){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"')
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");

}


/* =====================================================
   지도 범위
===================================================== */

function fitMapToMarkers(){

    if(
        markers.length === 0
    ){

        return;

    }


    const bounds =
        new kakao.maps.LatLngBounds();


    markers.forEach(
        function(marker){

            bounds.extend(
                marker.getPosition()
            );

        }
    );


    map.setBounds(
        bounds
    );

}


/* =====================================================
   알림음
===================================================== */

function playAlert(){

    const audio =
        document.getElementById(
            "alertSound"
        );


    if(!audio){
        return;
    }


    audio.currentTime = 0;


    audio.play()
    .catch(
        function(err){

            /*
             * 브라우저 자동재생 정책으로
             * 재생이 차단될 수 있음
             */

            console.log(
                "알림음 재생 차단:",
                err
            );

        }
    );

}

/* =====================================================
   개발자도구 단축키 방지
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "F12"
        ){

            e.preventDefault();

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "u"
        ){

            e.preventDefault();

        }


        if(
            e.ctrlKey &&
            e.shiftKey &&
            ["i","j","c"]
                .includes(
                    e.key.toLowerCase()
                )
        ){

            e.preventDefault();

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "s"
        ){

            e.preventDefault();

        }

    }
);

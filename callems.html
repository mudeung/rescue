<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b71c1c">
<title>무등산특수구조팀 신고접수</title>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
}

header {
  background: #b71c1c;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.container {
  padding: 15px;
  max-width: 1200px;
  margin: auto;
}

.form-box, .card {
  background: #222;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 6px;
}

input, textarea, select {
  display: block;
  width: 100%;
  padding: 10px;
  margin-bottom: 8px;
  border: 0;
  border-radius: 6px;
  font: inherit;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

label {
  display: block;
  margin: 8px 0;
  font-weight: bold;
}

button {
  padding: 10px 12px;
  background: #e53935;
  color: #fff;
  border: 0;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.type-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
}

.type-btn { width: 100%; }
.type-btn.active { outline: 3px solid white; }
.dispatch { background: #1e88e5; }
.lost { background: #fbc02d; color: #111; }
.other { background: #757575; }

#map {
  width: 100%;
  height: 55vh;
  min-height: 320px;
  margin-bottom: 15px;
  border-radius: 6px;
}

.accident-number {
  background: #000;
  color: #ffcc00;
  padding: 8px;
  margin-bottom: 8px;
  overflow-wrap: anywhere;
}

.status {
  margin: 8px 0;
  font-weight: bold;
}

.done { opacity: .8; }
.maplink { color: #4fc3f7; }
.coord { color: #aaa; font-size: 12px; margin: 8px 0; }
.action-button { margin: 5px 3px 0 0; }

#loading {
  display: none;
  color: #ffcc00;
  padding: 12px;
}

#message {
  overflow-wrap: anywhere;
}

@media (max-width: 600px) {
  header { font-size: 17px; }
  .container { padding: 10px; }
  #map { min-height: 300px; }
}
</style>
</head>

<body>
<header>🆘 무등산특수구조팀 신고접수</header>

<main class="container">
  <div id="map" aria-label="신고 위치 지도"></div>

  <section class="form-box">
    <div class="type-grid">
      <button type="button" class="type-btn" data-type="응급환자">🚑 응급환자</button>
      <button type="button" class="type-btn dispatch" data-type="구조신고">🚓 구조신고</button>
      <button type="button" class="type-btn lost" data-type="조난">🆘 조난</button>
      <button type="button" class="type-btn other" data-type="기타">✏ 기타</button>
    </div>

    <label for="accidentType">사고유형</label>
    <select id="accidentType">
      <option value="">사고유형 선택</option>

      <optgroup label="질환">
        <option>흉통</option>
        <option>호흡곤란</option>
        <option>심정지</option>
        <option>뇌졸중 의심</option>
        <option>경련</option>
        <option>의식저하</option>
        <option>실신</option>
        <option>저혈당</option>
        <option>고혈당</option>
        <option>복통</option>
        <option>발열</option>
      </optgroup>

      <optgroup label="외상">
        <option>실족·추락</option>
        <option>낙상</option>
        <option>교통사고</option>
        <option>충돌</option>
        <option>절단</option>
        <option>열상</option>
        <option>골절 의심</option>
        <option>심한 출혈</option>
      </optgroup>

      <optgroup label="환경">
        <option>저체온증</option>
        <option>열탈진</option>
        <option>열사병</option>
        <option>탈수</option>
        <option>동상</option>
        <option>번개 손상</option>
      </optgroup>

      <optgroup label="중독·동물">
        <option>중독</option>
        <option>벌 쏘임</option>
        <option>뱀 물림</option>
        <option>야생동물 공격</option>
      </optgroup>

      <optgroup label="조난">
        <option>길 잃음</option>
        <option>고립</option>
        <option>체력고갈</option>
        <option>장비부족</option>
      </optgroup>

      <option>기타</option>
    </select>

    <label for="condition">상황 입력</label>
    <textarea
      id="condition"
      placeholder="사고유형을 선택하면 자동 입력됩니다."
      required
    ></textarea>

    <label for="phone">연락처</label>
    <input
      id="phone"
      type="tel"
      placeholder="010-0000-0000"
      autocomplete="tel"
      required
    >

    <label for="address">신고 위치 주소</label>
    <input
      id="address"
      placeholder="주소 입력 후 주소 검색"
      autocomplete="street-address"
      required
    >

    <input id="lat" placeholder="위도" inputmode="decimal" readonly>
    <input id="lng" placeholder="경도" inputmode="decimal" readonly>

    <button type="button" id="submitBtn">🆘 신고접수</button>
    <p id="message" role="status" aria-live="polite"></p>
  </section>

  <div id="loading">⏳ 신고 데이터를 불러오는 중입니다...</div>

  <img
    src="https://mudeung.github.io/rescue/logogomir1.png"
    alt="구조팀 로고"
    style="display:block;max-width:100%;margin:0 auto 15px"
  >

  <section id="listArea" aria-live="polite"></section>
</main>
<script>
"use strict";

const API_URL =
  "https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

let map = null;
let geocoder = null;
let previewMarker = null;
let selectedType = "";
let knownIds = new Set();
let firstLoad = true;
let loadingList = false;
let incidentMarkers = [];

const $ = id => document.getElementById(id);

const conditionEl = $("condition");
const accidentTypeEl = $("accidentType");
const phoneEl = $("phone");
const addressEl = $("address");
const latEl = $("lat");
const lngEl = $("lng");
const submitBtn = $("submitBtn");
const listArea = $("listArea");
const loadingEl = $("loading");
const messageEl = $("message");

/* 사고유형 선택 시 상황 입력란에 자동 입력 */
accidentTypeEl.addEventListener("change", () => {
  const type = accidentTypeEl.value;
  if (!type) return;

  const oldText = conditionEl.value;
  const oldType = accidentTypeEl.dataset.previousType || "";

  if (
    oldText.trim() &&
    oldType &&
    oldText !== oldType + ": " &&
    !oldText.startsWith(oldType + ":")
  ) {
    const proceed = confirm(
      "상황 입력 내용이 있습니다.\n사고유형 문구를 변경하시겠습니까?"
    );

    if (!proceed) {
      accidentTypeEl.value = oldType;
      return;
    }
  }

  conditionEl.value = type + ": ";
  accidentTypeEl.dataset.previousType = type;

  conditionEl.focus();
  conditionEl.setSelectionRange(
    conditionEl.value.length,
    conditionEl.value.length
  );
});

/* 신고 유형 버튼 */
document.querySelectorAll(".type-btn").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".type-btn").forEach(btn =>
      btn.classList.remove("active")
    );

    button.classList.add("active");
    selectedType = button.dataset.type;

    if (selectedType === "조난") {
      accidentTypeEl.value = "길 잃음";
    } else if (selectedType === "기타") {
      accidentTypeEl.value = "기타";
    } else {
      accidentTypeEl.value = "";
    }

    if (accidentTypeEl.value) {
      accidentTypeEl.dispatchEvent(new Event("change"));
    }
  });
});

function showMessage(message, isError = false) {
  messageEl.textContent = message;
  messageEl.style.color = isError ? "#ff8a80" : "#ffcc80";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

async function postData(data) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=UTF-8"
    },
    body: JSON.stringify(data),
    cache: "no-store",
    redirect: "follow"
  });

  const text = await response.text();

  if (!response.ok) {
    throw new Error(
      `HTTP 오류 ${response.status}: ${text.slice(0, 200)}`
    );
  }

  let result;

  try {
    result = JSON.parse(text);
  } catch {
    throw new Error(
      "서버가 JSON이 아닌 응답을 반환했습니다. Apps Script 배포를 확인하세요."
    );
  }

  if (
    !result ||
    typeof result !== "object" ||
    typeof result.result !== "string"
  ) {
    throw new Error("서버 응답 형식이 올바르지 않습니다.");
  }

  return result;
}

function initMap() {
  if (!window.kakao || !kakao.maps) {
    throw new Error(
      "카카오맵을 불러오지 못했습니다. JavaScript 키와 등록 도메인을 확인하세요."
    );
  }

  map = new kakao.maps.Map($("map"), {
    center: new kakao.maps.LatLng(35.1345, 126.9902),
    level: 6
  });

  geocoder = new kakao.maps.services.Geocoder();

  kakao.maps.event.addListener(map, "click", event => {
    const position = event.latLng;

    latEl.value = position.getLat().toFixed(6);
    lngEl.value = position.getLng().toFixed(6);

    setPreviewMarker(position);
    showMessage("지도에서 신고 위치를 선택했습니다.");
  });
}

function setPreviewMarker(position) {
  if (previewMarker) {
    previewMarker.setMap(null);
  }

  previewMarker = new kakao.maps.Marker({
    map,
    position
  });
}

addressEl.addEventListener("change", () => {
  const address = addressEl.value.trim();
  if (!address) return;

  if (!geocoder) {
    showMessage("지도가 아직 초기화되지 않았습니다.", true);
    return;
  }

  geocoder.addressSearch(address, (results, status) => {
    if (
      status !== kakao.maps.services.Status.OK ||
      !results.length
    ) {
      showMessage(
        "주소를 찾을 수 없습니다. 주소를 확인해주세요.",
        true
      );
      return;
    }

    const lat = Number(results[0].y);
    const lng = Number(results[0].x);
    const position = new kakao.maps.LatLng(lat, lng);

    latEl.value = lat.toFixed(6);
    lngEl.value = lng.toFixed(6);

    map.setCenter(position);
    map.setLevel(3);
    setPreviewMarker(position);

    showMessage("주소와 좌표를 확인했습니다.");
  });
});
function clearForm() {
  conditionEl.value = "";
  accidentTypeEl.value = "";
  delete accidentTypeEl.dataset.previousType;

  phoneEl.value = "";
  addressEl.value = "";
  latEl.value = "";
  lngEl.value = "";
  selectedType = "";

  document.querySelectorAll(".type-btn").forEach(btn =>
    btn.classList.remove("active")
  );

  if (previewMarker) {
    previewMarker.setMap(null);
    previewMarker = null;
  }
}

async function submitData() {
  if (!selectedType) {
    alert("신고 유형을 선택해주세요.");
    return;
  }

  const condition = conditionEl.value.trim();
  const phone = phoneEl.value.trim();
  const address = addressEl.value.trim();
  const lat = Number(latEl.value);
  const lng = Number(lngEl.value);

  if (!condition || !phone || !address) {
    alert("상황, 연락처, 주소를 모두 입력해주세요.");
    return;
  }

  if (!/^[0-9+\-()\s]{9,20}$/.test(phone)) {
    alert("연락처 형식을 확인해주세요.");
    return;
  }

  if (
    !latEl.value ||
    !lngEl.value ||
    !Number.isFinite(lat) ||
    !Number.isFinite(lng) ||
    lat < -90 ||
    lat > 90 ||
    lng < -180 ||
    lng > 180
  ) {
    alert("주소 검색 또는 지도 클릭으로 좌표를 확인해주세요.");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "⏳ 접수 중...";

  try {
    const result = await postData({
      lat,
      lng,
      address,
      symptom: condition,
      phone,
      type: selectedType,
      kakaoMapURL:
        `https://map.kakao.com/link/map/구조요청 위치,${lat},${lng}`
    });

    if (result.result === "success") {
      alert(
        "신고가 접수되었습니다.\n사고번호: " +
        (result.accidentNumber || "미발급")
      );

      clearForm();
      await loadData();
    } else {
      alert(result.message || "신고 접수에 실패했습니다.");
    }
  } catch (error) {
    console.error("신고 접수 오류:", error);

    showMessage(
      "신고 접수 여부를 목록에서 확인해주세요. " +
      (error.message || ""),
      true
    );
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "🆘 신고접수";
  }
}

submitBtn.addEventListener("click", submitData);

function statusLabel(status) {
  if (status === "ARRIVED") return "🟠 현장도착";
  if (status === "DONE") return "⚪ 사고처리완료";
  return "🔴 사고 접수";
}

async function loadData() {
  if (loadingList || !map) return;

  loadingList = true;
  loadingEl.style.display = "block";

  try {
    const response = await fetch(
      API_URL + "?action=list&t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("HTTP 오류 " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("서버 데이터가 배열 형식이 아닙니다.");
    }

    const sorted = data.slice().sort((a, b) =>
      String(b.time || "").localeCompare(String(a.time || ""))
    );

    const ids = new Set(
      sorted.map(item => String(item.id))
    );

    if (
      !firstLoad &&
      sorted.some(item => !knownIds.has(String(item.id)))
    ) {
      try {
        const audio = new Audio(
          "https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
        );
        await audio.play();
      } catch {
        /* 브라우저 자동 재생 제한 */
      }
    }

    knownIds = ids;
    firstLoad = false;

    listArea.replaceChildren();

    incidentMarkers.forEach(marker => marker.setMap(null));
    incidentMarkers = [];

    const bounds = new kakao.maps.LatLngBounds();
    let markerCount = 0;
        sorted.forEach(item => {
      const lat = Number(item.lat);
      const lng = Number(item.lng);

      const card = document.createElement("article");
      card.className = "card";

      if (item.status === "DONE") {
        card.classList.add("done");
      }

      card.innerHTML = `
        <div class="accident-number">
          🆘 사고번호: ${escapeHTML(item.accidentNumber || "미발급")}
        </div>
        <div>🕒 접수시간: ${escapeHTML(item.time || "")}</div>
        <div class="status">${escapeHTML(statusLabel(item.status))}</div>
        <div>🚨 유형: ${escapeHTML(item.type || "미입력")}</div>
        <div>🏠 주소: ${escapeHTML(item.address || "주소없음")}</div>
        <div>📞 연락처: ${escapeHTML(item.phone || "번호없음")}</div>
        <div>📝 상황: ${escapeHTML(item.symptom || "내용없음")}</div>
        <div class="coord">
          위도: ${escapeHTML(item.lat)} /
          경도: ${escapeHTML(item.lng)}
        </div>
        <a class="maplink"
           target="_blank"
           rel="noopener noreferrer"
           href="https://map.kakao.com/link/map/구조요청 위치,${encodeURIComponent(lat)},${encodeURIComponent(lng)}">
          📍 지도보기
        </a>
        <div class="actions"></div>
      `;

      const actions = card.querySelector(".actions");

      if (item.status === "RECEIVED") {
        addActionButton(actions, "🚑 현장도착", () =>
          updateStatus(item.id, "complete")
        );
      } else if (item.status === "ARRIVED") {
        addActionButton(actions, "⚪ 사고처리 완료", () =>
          updateStatus(item.id, "finish")
        );
      }

      addActionButton(actions, "📋 사고번호 복사", async () => {
        try {
          await navigator.clipboard.writeText(
            String(item.accidentNumber || "")
          );
          alert("사고번호를 복사했습니다.");
        } catch {
          alert("복사할 수 없습니다. 사고번호를 직접 선택해주세요.");
        }
      });

      addActionButton(actions, "✏ 신고 수정", () =>
        editCase(item)
      );

      addActionButton(actions, "🗑 신고 삭제", () =>
        deleteCase(item)
      );

      listArea.appendChild(card);

      if (
        Number.isFinite(lat) &&
        Number.isFinite(lng) &&
        lat >= -90 &&
        lat <= 90 &&
        lng >= -180 &&
        lng <= 180
      ) {
        const position = new kakao.maps.LatLng(lat, lng);
        const marker = new kakao.maps.Marker({
          map,
          position
        });

        incidentMarkers.push(marker);

        const info = new kakao.maps.InfoWindow({
          content:
            `<div style="padding:10px;color:#222">` +
            `${escapeHTML(item.accidentNumber || item.type || "신고")}` +
            `<br>${escapeHTML(item.address || "")}</div>`
        });

        kakao.maps.event.addListener(marker, "click", () =>
          info.open(map, marker)
        );

        bounds.extend(position);
        markerCount++;
      }
    });

    if (sorted.length === 0) {
      listArea.textContent = "현재 접수된 신고가 없습니다.";
    }

    if (markerCount > 0) {
      map.setBounds(bounds);
    }

  } catch (error) {
    console.error("목록 조회 오류:", error);

    listArea.textContent =
      "신고 목록을 불러오지 못했습니다. 인터넷 연결과 Apps Script 배포를 확인해주세요.";

  } finally {
    loadingEl.style.display = "none";
    loadingList = false;
  }
}

function addActionButton(parent, text, callback) {
  const button = document.createElement("button");

  button.type = "button";
  button.className = "action-button";
  button.textContent = text;
  button.addEventListener("click", callback);

  parent.appendChild(button);
}

async function updateStatus(id, action) {
  const question = action === "complete"
    ? "구조대원이 현장에 도착했습니까?"
    : "사고처리를 완료하시겠습니까?";

  if (!confirm(question)) return;

  try {
    const result = await postData({ action, id });

    if (result.result !== "success") {
      throw new Error(result.message || "상태 변경 실패");
    }

    alert(
      result.time
        ? "처리되었습니다.\n" + result.time
        : "처리되었습니다."
    );

    await loadData();

  } catch (error) {
    alert("상태 변경 오류: " + error.message);
  }
}
async function editCase(item) {
  const type = prompt("신고 유형", item.type || "기타");
  if (type === null) return;

  const symptom = prompt("상황", item.symptom || "");
  if (symptom === null) return;

  const phone = prompt("연락처", item.phone || "");
  if (phone === null) return;

  const address = prompt("주소", item.address || "");
  if (address === null) return;

  if (!confirm("신고 내용을 수정하시겠습니까?")) return;

  try {
    let lat = Number(item.lat);
    let lng = Number(item.lng);
    const mapAddress = address.trim();

    if (mapAddress && geocoder) {
      const coords = await new Promise(resolve => {
        geocoder.addressSearch(mapAddress, (results, status) => {
          if (
            status === kakao.maps.services.Status.OK &&
            results.length
          ) {
            resolve({
              lat: Number(results[0].y),
              lng: Number(results[0].x)
            });
          } else {
            resolve(null);
          }
        });
      });

      if (coords) {
        lat = coords.lat;
        lng = coords.lng;
      }
    }

    const result = await postData({
      action: "update",
      id: item.id,
      type: type.trim() || "기타",
      symptom: symptom.trim() || "-",
      phone: phone.trim() || "-",
      address: mapAddress || "-",
      lat,
      lng,
      kakaoMapURL:
        `https://map.kakao.com/link/map/구조요청 위치,${lat},${lng}`
    });

    if (result.result !== "success") {
      throw new Error(result.message || "수정 실패");
    }

    alert("신고 내용을 수정했습니다.");
    await loadData();

  } catch (error) {
    alert("수정 오류: " + error.message);
  }
}

async function deleteCase(item) {
  if (!confirm(
    "신고를 삭제하시겠습니까?\n사고번호: " +
    (item.accidentNumber || "미발급")
  )) return;

  const password = prompt("관리자 삭제 비밀번호를 입력하세요.");

  if (password === null || !password) return;

  try {
    const result = await postData({
      action: "delete",
      id: item.id,
      password
    });

    if (result.result !== "success") {
      throw new Error(result.message || "삭제 실패");
    }

    alert("신고가 삭제되었습니다.");
    await loadData();

  } catch (error) {
    alert("삭제 오류: " + error.message);
  }
}

/* 페이지 초기화 */
window.addEventListener("load", async () => {
  try {
    initMap();
    await loadData();

    /* 10초마다 신고 목록 갱신 */
    setInterval(loadData, 10000);

  } catch (error) {
    console.error(error);
    showMessage(error.message, true);
  }
});

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산 특수구조팀 실시간 산악사고 신고접수</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.form-box{background:#222;padding:12px;margin-bottom:15px;border-radius:6px;}
input,textarea{width:100%;padding:8px;margin-bottom:8px;border-radius:4px;border:none;}
button{padding:8px 12px;background:#e53935;color:#fff;border:none;border-radius:4px;cursor:pointer;}
#map{width:100%;height:320px;margin-bottom:15px;border-radius:6px;}
.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;transition:0.2s;cursor:pointer;}
.card.done{opacity:0.6;background:#2b2b2b;}
.time{color:#ffcc00;font-size:14px;}
.coord{font-size:12px;color:#aaa;}
.maplink{color:#4fc3f7;font-size:12px;text-decoration:none;}
.maplink:hover{text-decoration:underline;}
.complete-btn{background:#2e7d32;margin-top:6px;color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;}
.complete-btn:hover{opacity:0.8;}
.refresh-btn{background:#1976d2;margin-top:6px;color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;}
.refresh-btn:hover{opacity:0.8;}
</style>
</head>

<body>
<!-- 🔐 비밀번호 잠금 화면 -->  
<div id="loginOverlay" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
flex-direction:column;
">
  <h2 style="margin-bottom:20px;">🔐 무등산특수구조팀 신고공유 접속인증</h2>
  <input type="password" id="passwordInput" placeholder="비밀번호 입력"
    style="width:250px;padding:10px;border-radius:6px;border:none;margin-bottom:10px;">
  <button onclick="checkPassword()">접속하기</button>
  <p id="loginError" style="color:red;margin-top:10px;"></p>
</div>
      
<header>🆘 무등산 특수구조팀 실시간 산악사고 신고접수</header>

<div class="container">

<div id="map"></div>

<div class="form-box">
  <h3>📌 위치구조 신고요청 등록</h3>
  <textarea id="condition" placeholder="증상 입력"></textarea>
  <input type="text" id="phone" placeholder="연락처 입력">
  <input type="text" id="address" placeholder="신고 주소 입력 (주소 입력 시 좌표 자동 입력)">
  <input type="number" step="any" id="lat" placeholder="위도">
  <input type="number" step="any" id="lng" placeholder="경도">
  <button id="submitBtn">구조 요청 등록</button>
</div>

<div id="listArea">로딩중...</div>
<button class="refresh-btn" onclick="loadData()">🔄 목록 새로고침</button>

</div>

<script>
/* ===== 🔐 비밀번호 설정 ===== */  
const ACCESS_PASSWORD = "knps";

function checkPassword(){
  const input = document.getElementById("passwordInput").value;
  const error = document.getElementById("loginError");

  if(input === ACCESS_PASSWORD){
    document.getElementById("loginOverlay").style.display="none";
    sessionStorage.setItem("authorized","true");
  } else {
    error.innerText = "❌ 비밀번호가 올바르지 않습니다.";
  }
}

/* 세션 유지 */  
window.addEventListener("load",function(){
  if(sessionStorage.getItem("authorized")==="true"){
    document.getElementById("loginOverlay").style.display="none";
  }
});  
      
const API_URL="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

let map, geocoder, previewMarker=null;

const conditionEl=document.getElementById("condition");
const phoneEl=document.getElementById("phone");
const addressEl=document.getElementById("address");
const latEl=document.getElementById("lat");
const lngEl=document.getElementById("lng");
const listArea=document.getElementById("listArea");

/******** 지도 초기화 ********/
function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });
  geocoder=new kakao.maps.services.Geocoder();
}

/******** 주소 → 좌표 자동 입력 ********/
addressEl.addEventListener("change",function(){
  const address=this.value.trim();
  if(!address) return;
  geocoder.addressSearch(address,function(result,status){
    if(status===kakao.maps.services.Status.OK){
      const lat=parseFloat(result[0].y);
      const lng=parseFloat(result[0].x);
      latEl.value=lat;
      lngEl.value=lng;

      const pos=new kakao.maps.LatLng(lat,lng);
      map.setCenter(pos);
      map.setLevel(3);

      if(previewMarker) previewMarker.setMap(null);
      previewMarker=new kakao.maps.Marker({ map, position:pos });
    } else alert("주소를 찾을 수 없습니다.");
  });
});

/******** 등록 (자동 위치 제거) ********/
document.getElementById("submitBtn").addEventListener("click", async function(){
  const lat = latEl.value.trim();
  const lng = lngEl.value.trim();
  if(!conditionEl.value.trim()){ 
    alert("증상 입력 필수"); 
    return; 
  }
  if(!lat || !lng){
    alert("위도와 경도를 반드시 입력해주세요."); 
    return;
  }
  sendData(parseFloat(lat), parseFloat(lng));
});

async function sendData(lat,lng){
  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body:JSON.stringify({
      lat,lng,
      address:addressEl.value,
      symptom:conditionEl.value,
      phone:phoneEl.value,
      kakaoMapURL:`https://map.kakao.com/link/map/구조요청 위치,${lat},${lng}`
    })
  });
  conditionEl.value=phoneEl.value=addressEl.value=latEl.value=lngEl.value="";
  if(previewMarker) previewMarker.setMap(null);
  loadData();
}

/******** 🚑 현장도착 / ✅ 사고처리 완료 ********/
async function updateStatus(id, action){
  if(!confirm(action==="complete"?"구조대원이 현장에 도착했습니까?":"사고처리를 완료하시겠습니까?")) return;
  try{
    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify({
        action: action==="complete"?"complete":"finish",
        id:id,
        [action==="complete"?"completeTime":"finishTime"]: new Date().toISOString()
      })
    });
    loadData();
  }catch(err){
    alert("처리 실패");
    console.error(err);
  }
}

/******** 목록 불러오기 ********/
async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();
  listArea.innerHTML="";
  if(!data.length){
    listArea.innerHTML="현재 접수된 신고가 없습니다.";
    return;
  }

  data.sort((a,b)=>new Date(b.time)-new Date(a.time));

  data.forEach(item=>{
    const div=document.createElement("div");
    div.className="card"+(item.status==="사고처리완료"?" done":"");
    div.innerHTML=`
      <div class="time">🕒 접수: ${new Date(item.time).toLocaleString()}</div>
      ${item.status==="현장도착"? `<div class="time">🚑 현장도착: ${item.completeTime ? new Date(item.completeTime).toLocaleString() : ""}</div>` : ""}
      ${item.status==="사고처리완료"? `<div class="time">🚑 현장도착: ${item.completeTime ? new Date(item.completeTime).toLocaleString() : ""}</div>
      <div class="time">✅ 사고처리 완료: ${item.finishTime ? new Date(item.finishTime).toLocaleString() : ""}</div>` : ""}
      🏠 ${item.address||"주소없음"}<br>
      📞 ${item.phone||"번호없음"}<br>
      📝 ${item.symptom||"내용없음"}<br>
      <div class="coord">위도: ${item.lat} / 경도: ${item.lng}</div>
      <a class="maplink" href="https://map.kakao.com/link/map/구조요청 위치,${item.lat},${item.lng}" target="_blank">📍 지도보기</a><br>
      ${item.status==="사고처리완료"?"":`<button class="complete-btn" data-id="${item.id}" data-action="${item.status==="현장도착"?"finish":"complete"}">${item.status==="현장도착"?"✅ 사고처리 완료":"🚑 구조대원 현장도착"}</button>`}
    `;
    listArea.appendChild(div);
  });

  // 버튼 이벤트 연결
  document.querySelectorAll(".complete-btn").forEach(btn=>{
    btn.addEventListener("click",()=>updateStatus(btn.dataset.id, btn.dataset.action));
  });
}

// 초기 지도/목록 로드
initMap();
loadData();
</script>

</body>
</html>

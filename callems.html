<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산특수구조팀 신고접수</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.form-box{background:#222;padding:12px;margin-bottom:15px;border-radius:6px;}
input,textarea{width:100%;padding:8px;margin-bottom:8px;border-radius:6px;border:none;}
button{padding:8px 12px;background:#e53935;color:#fff;border:none;border-radius:4px;cursor:pointer;}
#map{width:100%;height:320px;margin-bottom:15px;border-radius:6px;}

.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;}
.card.done{opacity:0.6;background:#2b2b2b;}

.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.type-btn{padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;color:#fff;}
.type-btn.active{outline:3px solid #fff;}
.type-btn.emergency{background:#4a1c1c;}
.type-btn.dispatch{background:#1c2f4a;}
.type-btn.lost{background:#4a461c;}
.type-btn.other{background:#3a3a3a;}
</style>
</head>

<body>

<header>🆘 무등산특수구조팀 신고접수</header>

<div class="container">

<div id="map"></div>

<div class="form-box">
<div class="type-grid">
<button class="type-btn emergency" data-type="응급환자">🚑 응급환자</button>
<button class="type-btn dispatch" data-type="구조출동">🚓 구조출동</button>
<button class="type-btn lost" data-type="조난">🆘 조난</button>
<button class="type-btn other" data-type="기타">✏ 기타</button>
</div>

<textarea id="condition" placeholder="상황 입력"></textarea>
<input id="phone" placeholder="연락처 (010-0000-0000)">
<input id="address" placeholder="주소">
<input id="lat" placeholder="위도">
<input id="lng" placeholder="경도">

<button onclick="submitData()">신고접수</button>
</div>

<div id="listArea"></div>

</div>

<audio id="alertSound">
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script>

const API_URL="여기에_웹앱_URL";

let map, geocoder, previewMarker;
let selectedType="";
let alerted=new Set();

const conditionEl=document.getElementById("condition");
const phoneEl=document.getElementById("phone");
const addressEl=document.getElementById("address");
const latEl=document.getElementById("lat");
const lngEl=document.getElementById("lng");
const listArea=document.getElementById("listArea");

/******** 지도 ********/
function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });
  geocoder=new kakao.maps.services.Geocoder();
}

/******** 타입 선택 ********/
document.querySelectorAll(".type-btn").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    selectedType=btn.dataset.type;
  };
});

/******** 주소 → 좌표 ********/
addressEl.addEventListener("change",function(){
  const address=this.value.trim();
  if(!address) return;

  geocoder.addressSearch(address,function(result,status){
    if(status===kakao.maps.services.Status.OK){
      const lat=parseFloat(result[0].y);
      const lng=parseFloat(result[0].x);

      latEl.value=lat;
      lngEl.value=lng;

      const pos=new kakao.maps.LatLng(lat,lng);
      map.setCenter(pos);
      map.setLevel(3);

      if(previewMarker) previewMarker.setMap(null);
      previewMarker=new kakao.maps.Marker({ map, position:pos });
    } else {
      alert("주소 검색 실패");
    }
  });
});

/******** 신고 접수 (전체 필수 검증) ********/
function submitData(){

  const condition = conditionEl.value.trim();
  const phone = phoneEl.value.trim();
  const address = addressEl.value.trim();
  const lat = latEl.value.trim();
  const lng = lngEl.value.trim();

  if(!selectedType){
    alert("신고 유형 선택 필수");
    return;
  }

  if(!condition){
    alert("상황 입력 필수");
    return;
  }

  if(!phone){
    alert("연락처 입력 필수");
    return;
  }

  if(!address){
    alert("주소 입력 필수");
    return;
  }

  if(!lat || !lng){
    alert("주소 검색 또는 위치 입력 필요");
    return;
  }

  const phonePattern = /^[0-9\-]{9,13}$/;
  if(!phonePattern.test(phone)){
    alert("연락처 형식 오류");
    return;
  }

  sendData(parseFloat(lat), parseFloat(lng));
}

/******** 데이터 전송 ********/
async function sendData(lat,lng){
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      lat,lng,
      address:addressEl.value,
      symptom:conditionEl.value,
      phone:phoneEl.value,
      type:selectedType
    })
  });

  conditionEl.value=phoneEl.value=addressEl.value=latEl.value=lngEl.value="";
  selectedType="";
  document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));

  if(previewMarker) previewMarker.setMap(null);

  loadData();
}

/******** 상태 변경 ********/
async function completeCase(id){
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({ action:"complete", id:id })
  });
  loadData();
}

async function finishCase(id){
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({ action:"finish", id:id })
  });
  loadData();
}

/******** 목록 ********/
async function loadData(){
  const res=await fetch(API_URL + "?action=list");
  const data=await res.json();

  listArea.innerHTML="";

  if(!data.length){
    listArea.innerHTML="현재 접수된 신고 없음";
    return;
  }

  data.forEach(item=>{

    if(item.status==="접수" && !alerted.has(item.id)){
      document.getElementById("alertSound").play();
      alerted.add(item.id);
    }

    const div=document.createElement("div");
    div.className="card"+(item.status==="사고처리완료"?" done":"");

    div.innerHTML=`
      🕒 ${new Date(item.time).toLocaleString()}<br>
      🏠 ${item.address}<br>
      📞 ${item.phone}<br>
      📝 ${item.symptom}<br>

      ${
        item.status==="접수"
        ? `<button onclick="completeCase('${item.id}')">🚑 현장도착</button>`
        : item.status==="현장도착"
        ? `<button onclick="finishCase('${item.id}')">✅ 처리완료</button>`
        : "✔ 완료"
      }
    `;

    listArea.appendChild(div);
  });
}

initMap();
loadData();
setInterval(loadData,5000);

</script>
</body>
</html>

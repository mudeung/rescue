<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산특수구조팀 실시간 산악사고 신고접수</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b711c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.form-box{background:#222;padding:12px;margin-bottom:15px;border-radius:6px;}
input,textarea{width:100%;padding:8px;margin-bottom:8px;border-radius:6px;border:none;}
button{padding:8px 12px;background:#e53935;color:#fff;border:none;border-radius:4px;cursor:pointer;}
#map{width:100%;height:320px;margin-bottom:15px;border-radius:6px;}

.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;}
.card.done{opacity:0.6;background:#2b2b2b;}

.time{color:#ffcc00;font-size:14px;margin-bottom:4px;display:block;}

.card.emergency{border-left:6px solid #ff1744;}
.card.overdue{background:#3a0000;}

.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.type-btn{padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;color:#fff;}
.type-btn.active{outline:3px solid #fff;}
.type-btn.emergency{background:#4a1c1c;}
.type-btn.dispatch{background:#1c2f4a;}
.type-btn.lost{background:#4a461c;}
.type-btn.other{background:#3a3a3a;}
</style>
</head>

<body>

<header>🆘 무등산특수구조팀 신고접수</header>

<div class="container">

<!-- 🔐 관리자 버튼 -->
<button onclick="adminLogin()">🔐 관리자 모드</button>

<div id="map"></div>

<div class="form-box">
<div class="type-grid">
<button class="type-btn emergency" data-type="응급환자">🚑 응급환자</button>
<button class="type-btn dispatch" data-type="구조출동">🚓 구조출동</button>
<button class="type-btn lost" data-type="조난">🆘 조난</button>
<button class="type-btn other" data-type="기타">✏ 기타</button>
</div>

<textarea id="condition" placeholder="상황 입력"></textarea>
<input id="phone" placeholder="연락처">
<input id="address" placeholder="주소">
<input id="lat" placeholder="위도">
<input id="lng" placeholder="경도">

<button onclick="submitData()">신고접수</button>
</div>

<div id="listArea"></div>

</div>

<audio id="alertSound">
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

/* 🔐 관리자 */
let isAdmin=false;
const ADMIN_PASSWORD="1234";

function adminLogin(){
  const pw=prompt("관리자 비밀번호");
  if(pw===ADMIN_PASSWORD){
    isAdmin=true;
    alert("관리자 모드 ON");
    loadData();
  }else{
    alert("비밀번호 틀림");
  }
}

let map, geocoder;
let selectedType="";
let alerted=new Set();

const conditionEl=document.getElementById("condition");
const phoneEl=document.getElementById("phone");
const addressEl=document.getElementById("address");
const latEl=document.getElementById("lat");
const lngEl=document.getElementById("lng");
const listArea=document.getElementById("listArea");

/* 지도 */
function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });
  geocoder=new kakao.maps.services.Geocoder();
}

/* 유형 선택 */
document.querySelectorAll(".type-btn").forEach(btn=>{
  btn.onclick=function(){
    document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
    this.classList.add("active");
    selectedType=this.dataset.type;
  };
});

/* 신고 */
async function submitData(){
  if(!selectedType){alert("유형 선택");return;}
  if(!conditionEl.value){alert("내용 입력");return;}

  let lat=latEl.value,lng=lngEl.value;

  if(!lat||!lng){
    navigator.geolocation.getCurrentPosition(pos=>{
      sendData(pos.coords.latitude,pos.coords.longitude);
    });
  }else{
    sendData(lat,lng);
  }
}

async function sendData(lat,lng){
  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain" },
    body:JSON.stringify({
      lat,lng,
      type:selectedType,
      address:addressEl.value,
      symptom:conditionEl.value,
      phone:phoneEl.value
    })
  });
  loadData();
}

/* 경과시간 */
function getElapsed(start,end){
  const s=new Date(start);
  const e=end?new Date(end):new Date();
  const d=Math.floor((e-s)/1000);
  return Math.floor(d/60)+"분";
}

/* 3분 초과 */
function checkOverdue(item,div){
  if(item.type!=="응급환자") return;
  if(item.status==="완료") return;

  const diff=(new Date()-new Date(item.time))/1000;

  if(diff>180){
    div.classList.add("overdue");

    if(!alerted.has(item.id)){
      alerted.add(item.id);

      document.getElementById("alertSound").play();

      if(navigator.vibrate) navigator.vibrate([500,300,500]);

      if(Notification.permission==="granted"){
        new Notification("🚨 응급환자 3분 초과");
      }
    }
  }
}

/* 삭제 */
async function deleteCase(id){
  if(!isAdmin){
    alert("관리자만 삭제 가능");
    return;
  }

  if(!confirm("삭제하시겠습니까?")) return;

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"delete",id})
  });
  loadData();
}

/* 도착 */
async function completeCase(id){
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"complete",id})
  });
  loadData();
}

/* 완료 */
async function finishCase(id){
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"finish",id})
  });
  loadData();
}

/* 목록 */
async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();

  listArea.innerHTML="";

  data.sort((a,b)=>{
    if(a.type==="응급환자") return -1;
    if(b.type==="응급환자") return 1;
    return new Date(b.time)-new Date(a.time);
  });

  data.forEach(item=>{
    const div=document.createElement("div");

    div.className="card"+(item.status==="완료"?" done":"");

    if(item.type==="응급환자" && item.status!=="완료"){
      div.classList.add("emergency");
    }

    div.innerHTML=`
      ${item.type}<br>
      ${item.address}<br>
      ${item.symptom}<br>
      상태:${item.status}<br>
      ⏱ ${getElapsed(item.time,item.finishTime)}<br>

      ${
        item.status==="완료" ? ""
        : item.status==="현장도착"
        ? `<button onclick="finishCase('${item.id}')">완료</button>`
        : `<button onclick="completeCase('${item.id}')">도착</button>`
      }

      ${isAdmin ? `<button onclick="deleteCase('${item.id}')">🗑 삭제</button>` : ""}
    `;

    listArea.appendChild(div);

    checkOverdue(item,div);

    if(item.lat && item.lng){
      new kakao.maps.Marker({
        map:map,
        position:new kakao.maps.LatLng(item.lat,item.lng)
      });
    }
  });
}

/* 초기 */
initMap();
loadData();
setInterval(loadData,5000);

if(Notification.permission!=="granted"){
  Notification.requestPermission();
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>저장자료 시트 전체보기</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;background:#1e1e1e;font-size:13px;}
th,td{border:1px solid #444;padding:8px;text-align:center;}
th{background:#b71c1c;}
tr:nth-child(even){background:#2b2b2b;}
</style>
</head>

<body>

<header>📋 저장자료 시트 전체표출</header>

<div class="container">
  <div id="listArea">로딩중...</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";
const listArea=document.getElementById("listArea");

async function loadData(){
  try{
    const res=await fetch(API_URL);
    const data=await res.json(); // 2차원 배열

    if(!data.length || data.length < 2){
      listArea.innerHTML="저장된 데이터가 없습니다.";
      return;
    }

    const headers = data[1];  // ✅ 2행을 헤더로 사용
    const rows = data.slice(2); // ✅ 3행부터 데이터

    let html="<table><tr>";

    headers.forEach(h=>{
      html+=`<th>${h}</th>`;
    });
    html+="</tr>";

    rows.forEach(row=>{
      html+="<tr>";
      headers.forEach((_,i)=>{
        html+=`<td>${row[i] ?? ""}</td>`;
      });
      html+="</tr>";
    });

    html+="</table>";
    listArea.innerHTML=html;

  }catch(err){
    listArea.innerHTML="데이터 불러오기 실패";
    console.error(err);
  }
}

loadData();
</script>

</body>
</html>

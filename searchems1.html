<script>

/* =====================================================
   PASSWORD / LOGIN
====================================================== */

const ACCESS_PASSWORD = "knps";


function checkPassword(){

    const input =
        document
        .getElementById(
            "passwordInput"
        )
        .value
        .trim();


    const error =
        document
        .getElementById(
            "loginError"
        );


    if(
        input === ACCESS_PASSWORD
    ){

        sessionStorage.setItem(
            "authorized",
            "true"
        );


        document
        .getElementById(
            "loginOverlay"
        )
        .style.display =
            "none";


        error.innerText =
            "";

    }

    else{

        error.innerText =
            "❌ 비밀번호가 올바르지 않습니다.";

    }

}


function initLogin(){

    const input =
        document.getElementById(
            "passwordInput"
        );


    const button =
        document.getElementById(
            "loginButton"
        );


    const authorized =
        sessionStorage.getItem(
            "authorized"
        );


    if(
        authorized === "true"
    ){

        document
        .getElementById(
            "loginOverlay"
        )
        .style.display =
            "none";

    }

    else{

        document
        .getElementById(
            "loginOverlay"
        )
        .style.display =
            "flex";

        setTimeout(
            function(){

                input.focus();

            },
            100
        );

    }


    button.addEventListener(
        "click",
        checkPassword
    );


    input.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                event.preventDefault();

                checkPassword();

            }

        }
    );

}


/* =====================================================
   API
====================================================== */

const GPS_API_URL =
"https://script.google.com/macros/s/AKfcybyem5fAs2XGxNy6wrHO3s68CmJy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";


const ACCIDENT_API_URL =
"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


/* =====================================================
   MAP
====================================================== */

const map =
    L.map("map")
    .setView(
        [35.1345,126.9902],
        13
    );


const osm =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    );


const topo =
    L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "OpenTopoMap"
        }
    );


const satellite =
    L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            attribution:
                "Esri"
        }
    );


osm.addTo(map);


L.control.layers({

    "🗺 일반":osm,

    "⛰ 지형":topo,

    "🛰 위성":satellite

}).addTo(map);


/* =====================================================
   COORDINATE
====================================================== */

const coordControl =
    L.control({
        position:"bottomleft"
    });


coordControl.onAdd =
    function(){

        this._div =
            L.DomUtil.create(
                "div",
                "mouse-coords"
            );

        this._div.innerHTML =
            "Lat : --<br>Lng : --";

        return this._div;

    };


coordControl.addTo(map);


map.on(
    "mousemove",
    function(e){

        coordControl._div.innerHTML =

            "Lat : "
            +
            e.latlng.lat.toFixed(6)
            +
            "<br>Lng : "
            +
            e.latlng.lng.toFixed(6);

    }
);


map.on(
    "mouseout",
    function(){

        coordControl._div.innerHTML =
            "Lat : --<br>Lng : --";

    }
);


/* =====================================================
   DRAW
====================================================== */

const drawnItems =
    new L.FeatureGroup();


map.addLayer(
    drawnItems
);


const drawControl =
    new L.Control.Draw({

        draw:{

            polygon:true,

            rectangle:true,

            marker:true,

            polyline:true,

            circle:true

        },

        edit:{

            featureGroup:
                drawnItems

        }

    });


map.addControl(
    drawControl
);


map.on(
    L.Draw.Event.CREATED,
    function(e){

        drawnItems.addLayer(
            e.layer
        );

    }
);


/* =====================================================
   LAYERS
====================================================== */

const rescueLayer =
    L.layerGroup()
    .addTo(map);


const sosLayer =
    L.layerGroup()
    .addTo(map);


const accidentLayer =
    L.layerGroup()
    .addTo(map);


/* =====================================================
   GLOBAL STATE
====================================================== */

let myName = "";

let lastPos = null;

let watchId = null;

let sendTimer = null;

let liveTimer = null;

let accidentTimer = null;

let reportPreviewMarker = null;

let selectedType = "";

let startTime = "";

let endTime = "";


/* =====================================================
   RESCUE MARKERS
====================================================== */

let rescueMarkers = {};

let rescueSOSCircles = {};

let rescueColors = {};


const colors = [

    "#00ff9d",
    "#00aaff",
    "#ffcc00",
    "#ff00ff",
    "#ff6600",
    "#00ffff",
    "#ffffff"

];


function getColor(name){

    if(
        !rescueColors[name]
    ){

        rescueColors[name] =
            colors[
                Object.keys(
                    rescueColors
                ).length
                %
                colors.length
            ];

    }

    return rescueColors[name];

}


/* =====================================================
   DOM
====================================================== */

const nameInput =
    document.getElementById(
        "name"
    );


const startBtn =
    document.getElementById(
        "startBtn"
    );


const conditionEl =
    document.getElementById(
        "condition"
    );


const phoneEl =
    document.getElementById(
        "phone"
    );


const addressEl =
    document.getElementById(
        "address"
    );


const latEl =
    document.getElementById(
        "lat"
    );


const lngEl =
    document.getElementById(
        "lng"
    );


const caseList =
    document.getElementById(
        "caseList"
    );


/* =====================================================
   DEVICE ID
====================================================== */

let DEVICE_ID =
    localStorage.getItem(
        "DEVICE_ID"
    );


if(!DEVICE_ID){

    if(
        window.crypto
        &&
        typeof crypto.randomUUID ===
            "function"
    ){

        DEVICE_ID =
            crypto.randomUUID();

    }

    else{

        DEVICE_ID =
            "DEVICE-"
            +
            Date.now()
            +
            "-"
            +
            Math.random()
            .toString(36)
            .slice(2);

    }

    localStorage.setItem(
        "DEVICE_ID",
        DEVICE_ID
    );

}


/* =====================================================
   NAME INPUT
====================================================== */

nameInput.addEventListener(
    "input",
    function(){

        startBtn.disabled =
            nameInput.value.trim() === "";

    }
);


/* =====================================================
   TIME
====================================================== */

function getNowTime(){

    const d =
        new Date();


    return (

        d.getFullYear()
        +
        "-"
        +
        String(
            d.getMonth()+1
        ).padStart(2,"0")
        +
        "-"
        +
        String(
            d.getDate()
        ).padStart(2,"0")
        +
        " "
        +
        String(
            d.getHours()
        ).padStart(2,"0")
        +
        ":"
        +
        String(
            d.getMinutes()
        ).padStart(2,"0")
        +
        ":"
        +
        String(
            d.getSeconds()
        ).padStart(2,"0")

    );

}


/* =====================================================
   START GPS
====================================================== */

function start(){

    myName =
        nameInput.value.trim();


    if(!myName){

        alert(
            "RESCUE UNIT ID 입력"
        );

        return;

    }


    if(
        !navigator.geolocation
    ){

        alert(
            "이 브라우저는 GPS를 지원하지 않습니다."
        );

        return;

    }


    startTime =
        getNowTime();

    endTime = "";


    nameInput.disabled =
        true;

    startBtn.disabled =
        true;


    watchId =
        navigator.geolocation.watchPosition(

            function(pos){

                lastPos = {

                    name:
                        myName,

                    device:
                        DEVICE_ID,

                    lat:
                        pos.coords.latitude,

                    lng:
                        pos.coords.longitude,

                    status:
                        "normal"

                };

            },

            function(err){

                console.error(
                    "GPS 오류:",
                    err
                );

                alert(
                    "GPS 권한을 확인하세요."
                );

            },

            {

                enableHighAccuracy:true,

                maximumAge:1000,

                timeout:10000

            }

        );


    sendTimer =
        setInterval(
            sendGPS,
            5000
        );


    liveTimer =
        setInterval(
            loadLive,
            3000
        );


    loadLive();


    alert(
        "🛰 GPS 시작"
    );

}


/* =====================================================
   SEND GPS
====================================================== */

function sendGPS(){

    if(!lastPos)
        return;


    fetch(

        GPS_API_URL,

        {

            method:"POST",

            headers:{

                "Content-Type":
                    "text/plain"

            },

            body:
                JSON.stringify({

                    ...lastPos,

                    startTime:
                        startTime,

                    endTime:

/* =====================================================
   RENDER LIVE
====================================================== */

function renderLive(data){

    if(
        !Array.isArray(data)
    ){

        if(
            data
            &&
            Array.isArray(
                data.data
            )
        ){

            data =
                data.data;

        }

        else{

            data = [];

        }

    }


    rescueLayer.clearLayers();

    sosLayer.clearLayers();


    data.forEach(
        function(p){

            const lat =
                Number(
                    p.lat
                );

            const lng =
                Number(
                    p.lng
                );


            if(
                !Number.isFinite(lat)
                ||
                !Number.isFinite(lng)
            ){

                return;

            }


            const pos =
                [lat,lng];


            const name =
                p.name || "UNKNOWN";


            const color =
                getColor(name);


            let marker =
                rescueMarkers[name];


            if(!marker){

                marker =
                    L.circleMarker(

                        pos,

                        {

                            radius:10,

                            color:color,

                            fillColor:color,

                            fillOpacity:1,

                            weight:3

                        }

                    )
                    .bindTooltip(

                        name,

                        {

                            permanent:true,

                            direction:"top",

                            className:
                                "name-label"

                        }

                    );


                rescueMarkers[name] =
                    marker;

            }


            marker.setLatLng(
                pos
            );


            marker.setStyle({

                radius:
                    p.status === "SOS"
                    ? 15
                    : 10,

                color:
                    p.status === "SOS"
                    ? "red"
                    : color,

                fillColor:
                    p.status === "SOS"
                    ? "red"
                    : color

            });


            marker.addTo(
                rescueLayer
            );


            if(
                p.status === "SOS"
            ){

                const circle =
                    L.circle(

                        pos,

                        {

                            radius:70,

                            color:"red",

                            fillColor:"red",

                            fillOpacity:.25

                        }

                    );


                circle.addTo(
                    sosLayer
                );

            }

        }
    );

}

function searchAddress(){

    const address =
        addressEl.value.trim();


    if(!address){

        alert(
            "주소를 입력하세요."
        );

        return;

    }


    if(
        typeof kakao === "undefined"
        ||
        !kakao.maps
        ||
        !kakao.maps.services
    ){

        alert(
            "Kakao 주소검색 SDK가 설정되지 않았습니다."
        );

        return;

    }


    const geocoder =
        new kakao.maps.services.Geocoder();


    geocoder.addressSearch(

        address,

        function(result,status){

            if(
                status ===
                kakao.maps.services.Status.OK
            ){

                const lat =
                    parseFloat(
                        result[0].y
                    );

                const lng =
                    parseFloat(
                        result[0].x
                    );


                latEl.value =
                    lat;

                lngEl.value =
                    lng;


                map.setView(
                    [
                        lat,
                        lng
                    ],
                    17
                );


                setReportPreview(
                    lat,
                    lng
                );

            }

            else{

                alert(
                    "주소 검색 실패"
                );

            }

        }

    );

}

/* =====================================================
   ELAPSED TIME
====================================================== */

function getElapsedTime(
    startTime,
    endTime=null
){

    if(!startTime)
        return "-";


    const start =
        new Date(
            startTime
        );


    if(
        Number.isNaN(
            start.getTime()
        )
    ){

        return "-";

    }


    const end =
        endTime
        ?
        new Date(endTime)
        :
        new Date();


    if(
        Number.isNaN(
            end.getTime()
        )
    ){

        return "-";

    }


    let diff =
        Math.floor(
            (end - start)
            /
            1000
        );


    if(
        diff < 0
    ){

        diff = 0;

    }


    const hour =
        Math.floor(
            diff / 3600
        );


    diff %= 3600;


    const minute =
        Math.floor(
            diff / 60
        );


    const second =
        diff % 60;


    return (

        String(hour)
        .padStart(2,"0")
        +
        ":"
        +
        String(minute)
        .padStart(2,"0")
        +
        ":"
        +
        String(second)
        .padStart(2,"0")

    );

}


/* =====================================================
   NORMALIZE STATUS
====================================================== */

function normalizeStatus(
    value
){

    const status =
        String(
            value || ""
        )
        .trim()
        .toUpperCase();


    if(
        status === "DONE"
        ||
        status === "완료"
        ||
        status === "처리완료"
    ){

        return "DONE";

    }


    if(
        status === "ARRIVED"
        ||
        status === "도착"
        ||
        status === "현장도착"
    ){

        return "ARRIVED";

    }


    return "RECEIVED";

}

            statusClass =
                "status-done";

        }


        /* 경과시간 */

        const elapsed =
            getElapsedTime(
                startTime,
                endTime || null
            );


        /* 10분 이상 미처리 */

        let overdue =
            false;


        if(
            status === "RECEIVED"
            &&
            startTime
        ){

            const start =
                new Date(
                    startTime
                ).getTime();


            if(Number.isFinite(start)){

                const elapsedMinutes =
                    (
                        Date.now() - start
                    ) / 60000;


                if(
                    elapsedMinutes >= 10
                ){

                    overdue = true;

                }

            }

        }


        /* 사고 지도 마커 */

        if(
            Number.isFinite(lat)
            &&
            Number.isFinite(lng)
        ){

            let markerColor =
                "red";


            if(status === "ARRIVED"){
                markerColor = "orange";
            }


            if(status === "DONE"){
                markerColor = "#777";
            }


            const marker =
                L.circleMarker(
                    [
                        lat,
                        lng
                    ],
                    {
                        radius:
                            status === "DONE"
                            ? 8
                            : 11,

                        color:
                            markerColor,

                        fillColor:
                            markerColor,

                        fillOpacity:.85,

                        weight:3
                    }
                );


            const popupHTML = `

                <div style="
                    font-family:Arial,sans-serif;
                    min-width:220px;
                    color:#111;
                ">

                    <b>
                        🆘 산악사고 신고
                    </b>

                    <hr>

                    <b>유형:</b>
                    ${escapeHTML(type)}
                    <br>

                    <b>상태:</b>
                    ${escapeHTML(statusText)}
                    <br>

                    <b>주소:</b>
                    ${escapeHTML(address || "-")}
                    <br>

                    <b>상황:</b>
                    ${escapeHTML(symptom || "-")}
                    <br>

                    <b>접수:</b>
                    ${escapeHTML(startTime || "-")}
                    <br>

                    <b>경과:</b>
                    ${escapeHTML(elapsed)}

                    <br><br>

                    ${
                        phone
                        ?
                        `
                        <a
                            href="tel:${escapeAttribute(phone)}"
                            style="
                                display:inline-block;
                                padding:6px 10px;
                                background:#700000;
                                color:white;
                                text-decoration:none;
                                border-radius:4px;
                            "
                        >
                            📞 연락
                        </a>
                        `
                        :
                        ""
                    }

                    ${
                        kakaoMapURL
                        ?
                        `
                        <a
                            href="${escapeAttribute(kakaoMapURL)}"
                            target="_blank"
                            rel="noopener"
                            style="
                                display:inline-block;
                                padding:6px 10px;
                                background:#1769aa;
                                color:white;
                                text-decoration:none;
                                border-radius:4px;
                                margin-left:4px;
                            "
                        >
                            🗺 지도
                        </a>
                        `
                        :
                        ""
                    }

                </div>
            `;


            marker.bindPopup(
                popupHTML
            );


            marker.on(
                "click",
                function(){

                    map.setView(
                        [
                            lat,
                            lng
                        ],
                        17
                    );

                }
            );


            marker.addTo(
                accidentLayer
            );

        }


        /* 카드 클래스 */

        let cardClass =
            "case-card";


        if(status === "DONE"){

            cardClass +=
                " done";

        }
        else if(status === "ARRIVED"){

            cardClass +=
                " arrived";

        }


        if(
            overdue
            &&
            status === "RECEIVED"
        ){

            cardClass +=
                " blink";

        }


        /* 신고 유형 아이콘 */

        let typeIcon =
            "🆘";


        if(type === "응급환자"){
            typeIcon = "🚑";
        }
        else if(type === "구조출동"){
            typeIcon = "🚓";
        }
        else if(type === "조난"){
            typeIcon = "🆘";
        }
        else if(type === "기타"){
            typeIcon = "✏️";
        }


        /* 상태 변경 버튼 */

        let actionButtons = "";


        if(status === "RECEIVED"){

            actionButtons = `

                <button
                    class="arrive-btn"
                    onclick="
                        updateAccidentStatus(
                            '${escapeAttribute(id)}',
                            'ARRIVED'
                        )
                    "
                >
                    🚓 현장 도착
                </button>

            `;

        }


        if(status === "ARRIVED"){

            actionButtons = `

                <button
                    class="complete-btn"
                    onclick="
                        updateAccidentStatus(
                            '${escapeAttribute(id)}',
                            'DONE'
                        )
                    "
                >
                    ✅ 구조 완료
                </button>

            `;

        }


        /* 사고 위치 버튼 */

        const mapButton =

            Number.isFinite(lat)
            &&
            Number.isFinite(lng)

            ?

            `
            <button
                onclick="
                    focusAccident(
                        ${lat},
                        ${lng}
                    )
                "
                style="
                    background:#003d5c;
                    color:white;
                    border:1px solid #008dcc;
                    margin-top:6px;
                "
            >
                📍 사고 위치 보기
            </button>
            `

            :

            "";


        /* 사고 카드 */

        html += `

            <div
                class="${cardClass}"
                data-case-id="${escapeAttribute(id)}"
            >

                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:8px;
                ">

                    <strong>
                        ${typeIcon}
                        ${escapeHTML(type)}
                    </strong>

                    <span
                        class="${statusClass}"
                    >
                        ${statusText}
                    </span>

                </div>


                ${
                    overdue
                    &&
                    status === "RECEIVED"

                    ?

                    `
                    <div style="
                        color:#ff3333;
                        font-weight:bold;
                        margin-top:6px;
                    ">
                        ⚠ 10분 이상 미처리
                    </div>
                    `

                    :

                    ""
                }


                <div style="
                    margin-top:8px;
                ">

                    <b>상황</b>

                    <br>

                    ${escapeHTML(
                        symptom || "-"
                    )}

                </div>


                <div style="
                    margin-top:6px;
                ">

                    <b>주소</b>

                    <br>

                    ${escapeHTML(
                        address || "-"
                    )}

                </div>


                <div style="
                    margin-top:6px;
                ">

                    <b>연락처</b>

                    <br>

                    ${
                        phone
                        ?
                        `
                        <a
                            href="tel:${escapeAttribute(phone)}"
                            style="
                                color:#00ff9d;
                            "
                        >
                            ${escapeHTML(phone)}
                        </a>
                        `
                        :
                        "-"
                    }

                </div>


                <div
                    class="time"
                    style="
                        margin-top:6px;
                    "
                >

                    접수:
                    ${escapeHTML(
                        startTime || "-"
                    )}

                </div>


                <div class="time">

                    경과:
                    ${escapeHTML(elapsed)}

                </div>


                ${
                    endTime
                    ?
                    `
                    <div class="time">

                        완료:
                        ${escapeHTML(endTime)}

                    </div>
                    `
                    :
                    ""
                }


                ${
                    Number.isFinite(lat)
                    &&
                    Number.isFinite(lng)

                    ?

                    `
                    <div class="coord">

                        Lat:
                        ${lat.toFixed(6)}

                        <br>

                        Lng:
                        ${lng.toFixed(6)}

                    </div>
                    `

                    :

                    ""
                }


                ${mapButton}

                ${actionButtons}

            </div>

        `;


        /* 신규 사고 알림 */

        if(
            !firstLoad
            &&
            !knownIds.has(id)
        ){

            playAlert();

        }


        /* 장시간 미처리 알림 */

        if(
            overdue
            &&
            !alertedOverdueIds.has(id)
        ){

            alertedOverdueIds.add(
                id
            );


            if(!firstLoad){

                playAlert();

            }

        }


        knownIds.add(
            id
        );

    });


    caseList.innerHTML =
        html;


    firstLoad =
        false;

}


/* =====================================================
   HTML ESCAPE
====================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   ATTRIBUTE ESCAPE
====================================================== */

function escapeAttribute(value){

    return String(
        value ?? ""
    )
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* =====================================================
   ACCIDENT MAP FOCUS
====================================================== */

function focusAccident(
    lat,
    lng
){

    lat =
        Number(lat);

    lng =
        Number(lng);


    if(
        !Number.isFinite(lat)
        ||
        !Number.isFinite(lng)
    ){

        return;

    }


    const position = [
        lat,
        lng
    ];


    map.setView(
        position,
        17
    );


    L.popup()
    .setLatLng(
        position
    )
    .setContent(
        "🆘 사고 신고 위치"
    )
    .openOn(map);

}


/* =====================================================
   ALERT SOUND
====================================================== */

function playAlert(){

    const audio =
        document.getElementById(
            "alertSound"
        );


    if(!audio)
        return;


    try{

        audio.currentTime =
            0;


        const promise =
            audio.play();


        if(
            promise
            &&
            typeof promise.catch ===
                "function"
        ){

            promise.catch(
                function(err){

                    console.log(
                        "알림음 재생 차단:",
                        err
                    );

                }
            );

        }

    }

    catch(err){

        console.error(
            "알림음 오류:",
            err
        );

    }

}


/* =====================================================
   UPDATE ACCIDENT STATUS
====================================================== */

async function updateAccidentStatus(
    caseId,
    newStatus
){

    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    const status =
        normalizeStatus(
            newStatus
        );


    let message =
        "처리하시겠습니까?";


    if(
        status === "ARRIVED"
    ){

        message =
            "🚓 현장 도착으로 변경하시겠습니까?";

    }


    if(
        status === "DONE"
    ){

        message =
            "✅ 구조 완료로 변경하시겠습니까?";

    }


    if(
        !confirm(message)
    ){

        return;

    }


    try{

        const now =
            getNowTime();


        const payload = {

            action:
                "update",

            id:
                caseId,

            caseId:
                caseId,

            status:
                status,

            updatedAt:
                now

        };


        if(
            status === "ARRIVED"
        ){

            payload.arrivedAt =
                now;

        }


        if(
            status === "DONE"
        ){

            payload.endTime =
                now;

            payload.completedAt =
                now;

        }


        const response =
            await fetch(

                ACCIDENT_API_URL,

                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }

            );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP "
                +
                response.status
            );

        }


        alert(

            status === "ARRIVED"

            ?

            "🚓 현장 도착 처리되었습니다."

            :

            "✅ 구조 완료 처리되었습니다."

        );


        loadAccidents();

    }

    catch(err){

        console.error(
            "사고 상태 변경 오류:",
            err
        );


        alert(
            "사고 상태 변경 중 오류가 발생했습니다."
        );

    }

}


/* =====================================================
   ACCIDENT AUTO REFRESH
====================================================== */

function startAccidentAutoRefresh(){

    if(
        accidentTimer
    ){

        clearInterval(
            accidentTimer
        );

    }


    loadAccidents();


    accidentTimer =
        setInterval(
            function(){

                loadAccidents();

            },
            5000
        );

}


/* =====================================================
   INITIAL LOAD
====================================================== */

window.addEventListener(
    "load",
    function(){

        loadAccidents();

        startAccidentAutoRefresh();

    }
);


/* =====================================================
   PAGE VISIBILITY
====================================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            !document.hidden
        ){

            loadAccidents();

            loadLive();

        }

    }
);


/* =====================================================
   BEFORE UNLOAD
====================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        if(
            lastPos
        ){

            try{

                const payload = {

                    ...lastPos,

                    status:
                        "STOP",

                    startTime:
                        startTime,

                    endTime:
                        getNowTime()

                };


                if(
                    navigator.sendBeacon
                ){

                    navigator.sendBeacon(

                        GPS_API_URL,

                        new Blob(
                            [
                                JSON.stringify(
                                    payload
                                )
                            ],
                            {
                                type:
                                    "text/plain"
                            }
                        )

                    );

                }

            }

            catch(err){

                console.error(
                    "종료 위치 전송 오류:",
                    err
                );

            }

        }

    }
);


/* =====================================================
   MAP RESIZE
====================================================== */

setTimeout(
    function(){

        map.invalidateSize();

    },
    500
);


window.addEventListener(
    "resize",
    function(){

        setTimeout(
            function(){

                map.invalidateSize();

            },
            100
        );

    }
);


/* =====================================================
   KEYBOARD SHORTCUT
====================================================== */

document.addEventListener(
    "keydown",
    function(e){

        /*
         * Ctrl + Shift + L
         * 내 위치
         */

        if(
            e.ctrlKey
            &&
            e.shiftKey
            &&
            e.key.toLowerCase() === "l"
        ){

            e.preventDefault();

            goMyLocation();

        }


        /*
         * Ctrl + Shift + R
         * 사고 목록 새로고침
         */

        if(
            e.ctrlKey
            &&
            e.shiftKey
            &&
            e.key.toLowerCase() === "r"
        ){

            e.preventDefault();

            loadAccidents();

        }

    }
);


/* =====================================================
   END
====================================================== */

</script>

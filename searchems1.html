<script>

/* =====================================================
   API
====================================================== */

const GPS_API_URL =
"https://script.google.com/macros/s/AKfcybyem5fAs2XGxNy6wrHO3s68CmJy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";

const ACCIDENT_API_URL =
"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


/* =====================================================
   MAP
====================================================== */

const map =
    L.map("map")
    .setView(
        [35.1345,126.9902],
        13
    );

const osm =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    );

osm.addTo(map);


/* =====================================================
   COORDINATE CONTROL
====================================================== */

const coordControl =
    L.control({
        position:"bottomleft"
    });

coordControl.onAdd = function(){

    this._div =
        L.DomUtil.create(
            "div",
            "mouse-coords"
        );

    this._div.innerHTML =
        "Lat : --<br>Lng : --";

    return this._div;
};

coordControl.addTo(map);

map.on(
    "mousemove",
    function(e){

        coordControl._div.innerHTML =
            "Lat : " +
            e.latlng.lat.toFixed(6) +
            "<br>Lng : " +
            e.latlng.lng.toFixed(6);

    }
);

map.on(
    "mouseout",
    function(){

        coordControl._div.innerHTML =
            "Lat : --<br>Lng : --";

    }
);


/* =====================================================
   DRAW
====================================================== */

const drawnItems =
    new L.FeatureGroup();

map.addLayer(
    drawnItems
);

const drawControl =
    new L.Control.Draw({

        draw:{
            polygon:true,
            rectangle:true,
            marker:true,
            polyline:true,
            circle:true
        },

        edit:{
            featureGroup:
                drawnItems
        }

    });

map.addControl(
    drawControl
);

map.on(
    L.Draw.Event.CREATED,
    function(e){

        drawnItems.addLayer(
            e.layer
        );

    }
);


/* =====================================================
   LAYERS
====================================================== */

const sosLayer =
    L.layerGroup()
    .addTo(map);

const accidentLayer =
    L.layerGroup()
    .addTo(map);


/* =====================================================
   GLOBAL STATE
====================================================== */

let lastPos = null;

let reportPreviewMarker = null;

let selectedType = "";

let accidentTimer = null;

let knownIds =
    new Set();

let alertedOverdueIds =
    new Set();

let firstLoad = true;

let accidentLoading = false;


/* =====================================================
   DOM
====================================================== */

const conditionEl =
    document.getElementById(
        "condition"
    );

const phoneEl =
    document.getElementById(
        "phone"
    );

const addressEl =
    document.getElementById(
        "address"
    );

const latEl =
    document.getElementById(
        "lat"
    );

const lngEl =
    document.getElementById(
        "lng"
    );

const caseList =
    document.getElementById(
        "caseList"
    );


/* =====================================================
   TIME
====================================================== */

function getNowTime(){

    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        String(
            d.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            d.getDate()
        ).padStart(2,"0") +
        " " +
        String(
            d.getHours()
        ).padStart(2,"0") +
        ":" +
        String(
            d.getMinutes()
        ).padStart(2,"0") +
        ":" +
        String(
            d.getSeconds()
        ).padStart(2,"0")
    );

}


/* =====================================================
   DEVICE ID
====================================================== */

let DEVICE_ID =
    localStorage.getItem(
        "DEVICE_ID"
    );

if(!DEVICE_ID){

    if(
        window.crypto &&
        typeof crypto.randomUUID ===
        "function"
    ){

        DEVICE_ID =
            crypto.randomUUID();

    }
    else{

        DEVICE_ID =
            "DEVICE-" +
            Date.now() +
            "-" +
            Math.random()
            .toString(36)
            .slice(2);

    }

    localStorage.setItem(
        "DEVICE_ID",
        DEVICE_ID
    );

}


/* =====================================================
   GPS
====================================================== */

function getCurrentGPS(){

    return new Promise(
        function(resolve,reject){

            if(!navigator.geolocation){

                reject(
                    new Error(
                        "GPS_NOT_SUPPORTED"
                    )
                );

                return;
            }

            navigator.geolocation.getCurrentPosition(

                function(position){

                    resolve({

                        lat:
                            position.coords.latitude,

                        lng:
                            position.coords.longitude,

                        accuracy:
                            position.coords.accuracy

                    });

                },

                function(error){

                    reject(error);

                },

                {

                    enableHighAccuracy:true,

                    timeout:15000,

                    maximumAge:5000

                }

            );

        }
    );

}


/* =====================================================
   SOS
====================================================== */

async function sendSOS(){

    const button =
        document.getElementById(
            "sosBtn"
        );

    button.disabled = true;

    try{

        alert(
            "📍 현재 위치를 확인하는 중입니다."
        );

        const position =
            await getCurrentGPS();

        const lat =
            Number(position.lat);

        const lng =
            Number(position.lng);

        lastPos = {

            device:
                DEVICE_ID,

            lat:
                lat,

            lng:
                lng,

            status:
                "SOS"

        };


        sosLayer.clearLayers();


        const sosMarker =
            L.circleMarker(

                [lat,lng],

                {

                    radius:16,

                    color:"#ff0000",

                    fillColor:"#ff0000",

                    fillOpacity:1,

                    weight:4

                }

            );


        sosMarker.bindPopup(

            `
            <div style="
                font-family:Arial,sans-serif;
                color:#111;
                text-align:center;
            ">

                <b style="
                    color:red;
                    font-size:17px;
                ">
                    🚨 SOS 긴급 위치
                </b>

                <hr>

                <b>위도</b><br>
                ${lat.toFixed(6)}

                <br><br>

                <b>경도</b><br>
                ${lng.toFixed(6)}

                <br><br>

                <b>GPS 정확도</b><br>
                약 ${Math.round(position.accuracy)}m

            </div>
            `
        );


        sosMarker.addTo(
            sosLayer
        );


        const sosCircle =
            L.circle(

                [lat,lng],

                {

                    radius:100,

                    color:"red",

                    fillColor:"red",

                    fillOpacity:.25,

                    weight:3

                }

            );


        sosCircle.addTo(
            sosLayer
        );


        map.setView(
            [lat,lng],
            17
        );

        sosMarker.openPopup();


        const sosData = {

            device:
                DEVICE_ID,

            lat:
                lat,

            lng:
                lng,

            status:
                "SOS",

            sosTime:
                getNowTime(),

            accuracy:
                position.accuracy

        };


        const response =
            await fetch(

                GPS_API_URL,

                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "text/plain"
                    },

                    body:
                        JSON.stringify(
                            sosData
                        )

                }

            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        alert(
            "🚨 SOS 긴급전송 완료\n현재 위치가 지도에 표시되었습니다."
        );

        loadAccidents();

    }

    catch(err){

        console.error(
            "SOS 오류:",
            err
        );

        alert(
            "🚨 SOS 전송 실패\n\n현재 위치 권한을 확인하세요."
        );

    }

    finally{

        button.disabled = false;

    }

}


document
.getElementById("sosBtn")
.addEventListener(
    "click",
    sendSOS
);


/* =====================================================
   CURRENT LOCATION
====================================================== */

async function useCurrentLocationForReport(){

    const button =
        document.getElementById(
            "currentReportLocationBtn"
        );

    button.disabled = true;

    try{

        const position =
            await getCurrentGPS();

        const lat =
            Number(position.lat);

        const lng =
            Number(position.lng);

        latEl.value =
            lat.toFixed(6);

        lngEl.value =
            lng.toFixed(6);

        map.setView(
            [lat,lng],
            17
        );

        setReportPreview(
            lat,
            lng
        );

    }

    catch(err){

        console.error(err);

        alert(
            "현재 위치를 가져오지 못했습니다.\nGPS 권한을 확인하세요."
        );

    }

    finally{

        button.disabled = false;

    }

}


document
.getElementById(
    "currentReportLocationBtn"
)
.addEventListener(
    "click",
    useCurrentLocationForReport
);


/* =====================================================
   REPORT PREVIEW
====================================================== */

function setReportPreview(
    lat,
    lng
){

    if(reportPreviewMarker){

        map.removeLayer(
            reportPreviewMarker
        );

    }

    reportPreviewMarker =
        L.marker(
            [lat,lng]
        )
        .addTo(map)
        .bindPopup(
            "📍 신고 위치"
        )
        .openPopup();

}


/* =====================================================
   KAKAO ADDRESS SEARCH
====================================================== */

let addressSearchTimer = null;

function searchAddress(){

    const address =
        addressEl.value.trim();

    if(!address){

        latEl.value = "";
        lngEl.value = "";

        return;
    }

    if(
        typeof kakao === "undefined" ||
        !kakao.maps ||
        !kakao.maps.services
    ){

        console.error(
            "Kakao 주소검색 SDK가 설정되지 않았습니다."
        );

        return;
    }

    const geocoder =
        new kakao.maps.services.Geocoder();

    geocoder.addressSearch(

        address,

        function(result,status){

            if(
                status ===
                kakao.maps.services.Status.OK
            ){

                const lat =
                    parseFloat(
                        result[0].y
                    );

                const lng =
                    parseFloat(
                        result[0].x
                    );

                latEl.value =
                    lat.toFixed(6);

                lngEl.value =
                    lng.toFixed(6);

                map.setView(
                    [lat,lng],
                    17
                );

                setReportPreview(
                    lat,
                    lng
                );

            }
            else{

                latEl.value = "";
                lngEl.value = "";

            }

        }

    );

}


addressEl.addEventListener(
    "input",
    function(){

        clearTimeout(
            addressSearchTimer
        );

        latEl.value = "";
        lngEl.value = "";

        const address =
            addressEl.value.trim();

        if(address.length < 2){
            return;
        }

        addressSearchTimer =
            setTimeout(
                searchAddress,
                500
            );

    }
);


/* =====================================================
   REPORT TYPE
====================================================== */

document
.querySelectorAll(
    ".type-btn"
)
.forEach(
    function(btn){

        btn.addEventListener(
            "click",
            function(){

                document
                .querySelectorAll(
                    ".type-btn"
                )
                .forEach(
                    function(b){

                        b.classList.remove(
                            "active"
                        );

                    }
                );

                btn.classList.add(
                    "active"
                );

                selectedType =
                    btn.dataset.type;

            }
        );

    }
);


/* =====================================================
   SUBMIT REPORT
====================================================== */

function submitData(){

    const condition =
        conditionEl.value.trim();

    const phone =
        phoneEl.value.trim();

    const address =
        addressEl.value.trim();

    const lat =
        latEl.value.trim();

    const lng =
        lngEl.value.trim();


    if(!selectedType){

        alert(
            "신고 유형을 선택하세요."
        );

        return;
    }

    if(!condition){

        alert(
            "상황 입력 필수"
        );

        return;
    }

    if(!phone){

        alert(
            "연락처 입력 필수"
        );

        return;
    }

    if(!address){

        alert(
            "주소 입력 필수"
        );

        return;
    }

    if(!lat || !lng){

        alert(
            "주소를 입력하여 좌표를 자동 검색하거나 현재 위치를 사용하세요."
        );

        return;
    }


    const phonePattern =
        /^[0-9\-]{9,13}$/;

    if(
        !phonePattern.test(phone)
    ){

        alert(
            "연락처 형식 오류"
        );

        return;
    }


    const latNumber =
        Number(lat);

    const lngNumber =
        Number(lng);

    if(
        !Number.isFinite(latNumber) ||
        !Number.isFinite(lngNumber)
    ){

        alert(
            "위도 또는 경도가 올바르지 않습니다."
        );

        return;
    }


    sendData(
        latNumber,
        lngNumber
    );

}

/* =====================================================
   SEND REPORT
====================================================== */

async function sendData(
    lat,
    lng
){

    const button =
        document.getElementById(
            "submitReportBtn"
        );

    button.disabled = true;

    try{

        const kakaoMapURL =
            "https://map.kakao.com/link/map/" +
            lat +
            "," +
            lng;


        const payload = {

            action:
                "create",

            lat:
                lat,

            lng:
                lng,

            address:
                addressEl.value.trim(),

            symptom:
                conditionEl.value.trim(),

            phone:
                phoneEl.value.trim(),

            type:
                selectedType,

            kakaoMapURL:
                kakaoMapURL,

            createdAt:
                getNowTime(),

            status:
                "RECEIVED"

        };


        await fetch(

            ACCIDENT_API_URL,

            {

                method:"POST",

                mode:"no-cors",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(payload)

            }

        );


        alert(
            "🆘 신고가 접수되었습니다."
        );


        resetReportForm();

        setTimeout(
            loadAccidents,
            500
        );

    }

    catch(err){

        console.error(
            "신고 접수 오류:",
            err
        );

        alert(
            "신고 접수 중 오류가 발생했습니다."
        );

    }

    finally{

        button.disabled = false;

    }

}

/* =====================================================
   FIELD HELPER
====================================================== */

function getAccidentField(
    item,
    names
){

    for(
        const name of names
    ){

        if(
            item[name] !== undefined &&
            item[name] !== null &&
            String(
                item[name]
            ).trim() !== ""
        ){

            return item[name];

        }

    }

    return "";

}


/* =====================================================
   ACCIDENT ID
====================================================== */

function getAccidentId(
    item,
    index
){

    return String(

        getAccidentField(

            item,

            [
                "id",
                "ID",
                "caseId",
                "caseID",
                "사고ID",
                "timestamp",
                "createdAt"
            ]

        )

        ||

        (
            getAccidentField(
                item,
                [
                    "lat",
                    "latitude",
                    "위도"
                ]
            )
            +
            "_" +
            getAccidentField(
                item,
                [
                    "lng",
                    "longitude",
                    "경도"
                ]
            )
            +
            "_" +
            index
        )

    );

}


/* =====================================================
   START TIME
====================================================== */

function getAccidentStartTime(
    item
){

    return (

        getAccidentField(

            item,

            [
                "startTime",
                "createdAt",
                "timestamp",
                "time",
                "date",
                "접수시간"
            ]

        )

        ||

        ""

    );

}


/* =====================================================
   STATUS
====================================================== */

function normalizeStatus(
    value
){

    const status =
        String(
            value || ""
        )
        .trim()
        .toUpperCase();


    if(
        status === "DONE" ||
        status === "완료" ||
        status === "처리완료"
    ){

        return "DONE";

    }


    if(
        status === "ARRIVED" ||
        status === "도착" ||
        status === "현장도착"
    ){

        return "ARRIVED";

    }


    return "RECEIVED";

}


/* =====================================================
   ELAPSED
====================================================== */

function getElapsedTime(
    startTime,
    endTime=null
){

    if(!startTime){
        return "-";
    }


    const start =
        new Date(startTime);

    if(
        Number.isNaN(
            start.getTime()
        )
    ){

        return "-";

    }


    const end =
        endTime
        ?
        new Date(endTime)
        :
        new Date();


    if(
        Number.isNaN(
            end.getTime()
        )
    ){

        return "-";

    }


    let diff =
        Math.floor(
            (
                end - start
            ) / 1000
        );


    if(diff < 0){
        diff = 0;
    }


    const hour =
        Math.floor(
            diff / 3600
        );

    diff %= 3600;

    const minute =
        Math.floor(
            diff / 60
        );

    const second =
        diff % 60;


    return (

        String(hour).padStart(2,"0") +
        ":" +
        String(minute).padStart(2,"0") +
        ":" +
        String(second).padStart(2,"0")

    );

}


/* =====================================================
   LOAD ACCIDENTS
====================================================== */

async function loadAccidents(){

    if(accidentLoading){
        return;
    }

    accidentLoading = true;

    try{

        const response =
            await fetch(

                ACCIDENT_API_URL +
                "?action=list&t=" +
                Date.now(),

                {
                    cache:"no-store"
                }

            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        let rows = data;


        if(
            data &&
            Array.isArray(data.data)
        ){

            rows =
                data.data;

        }
        else if(
            data &&
            Array.isArray(data.items)
        ){

            rows =
                data.items;

        }
        else if(
            data &&
            Array.isArray(data.rows)
        ){

            rows =
                data.rows;

        }


        if(!Array.isArray(rows)){

            rows = [];

        }


        renderAccidents(rows);

    }

    catch(err){

        console.error(
            "사고 목록 조회 오류:",
            err
        );


        if(firstLoad){

            caseList.innerHTML =

                `
                <div class="case-card">

                    ⚠ 사고 목록을 불러오지 못했습니다.

                    <br><br>

                    서버 연결 상태를 확인하세요.

                </div>
                `;

        }

    }

    finally{

        accidentLoading = false;

    }

}


/* =====================================================
   RENDER ACCIDENTS
====================================================== */

function renderAccidents(
    data
){

    accidentLayer.clearLayers();


    const rows =
        [...data].sort(

            function(a,b){

                const ta =
                    new Date(
                        getAccidentStartTime(a)
                    ).getTime();

                const tb =
                    new Date(
                        getAccidentStartTime(b)
                    ).getTime();


                if(
                    Number.isNaN(ta) &&
                    Number.isNaN(tb)
                ){

                    return 0;

                }


                if(Number.isNaN(ta)){
                    return 1;
                }


                if(Number.isNaN(tb)){
                    return -1;
                }


                return tb - ta;

            }

        );


    let html = "";


    rows.forEach(

        function(item,index){

            const id =
                getAccidentId(
                    item,
                    index
                );


            const status =
                normalizeStatus(

                    getAccidentField(

                        item,

                        [
                            "status",
                            "state",
                            "상태",
                            "처리상태"
                        ]

                    )

                );


            const startTime =
                getAccidentStartTime(
                    item
                );


            const endTime =
                getAccidentField(

                    item,

                    [
                        "endTime",
                        "completedAt",
                        "doneAt",
                        "완료시간"
                    ]

                );


            const lat =
                Number(

                    getAccidentField(

                        item,

                        [
                            "lat",
                            "latitude",
                            "위도"
                        ]

                    )

                );


            const lng =
                Number(

                    getAccidentField(

                        item,

                        [
                            "lng",
                            "longitude",
                            "경도"
                        ]

                    )

                );


            const address =
                getAccidentField(

                    item,

                    [
                        "address",
                        "주소",
                        "location",
                        "장소"
                    ]

                );


            const type =
                getAccidentField(

                    item,

                    [
                        "type",
                        "accidentType",
                        "신고유형",
                        "유형"
                    ]

                ) || "기타";


            const symptom =
                getAccidentField(

                    item,

                    [
                        "symptom",
                        "condition",
                        "description",
                        "상황",
                        "내용"
                    ]

                );


            const phone =
                getAccidentField(

                    item,

                    [
                        "phone",
                        "tel",
                        "telephone",
                        "연락처"
                    ]

                );


            const kakaoMapURL =
                getAccidentField(

                    item,

                    [
                        "kakaoMapURL",
                        "kakaoUrl",
                        "mapUrl",
                        "지도URL"
                    ]

                );


            /* STATUS */

            let statusText =
                "접수";

            let statusClass =
                "status-received";


            if(status === "ARRIVED"){

                statusText =
                    "현장도착";

                statusClass =
                    "status-arrived";

            }


            if(status === "DONE"){

                statusText =
                    "처리완료";

                statusClass =
                    "status-done";

            }


            /* ELAPSED */

            const elapsed =
                getElapsedTime(
                    startTime,
                    endTime || null
                );


            /* OVERDUE */

            let overdue = false;


            if(
                status === "RECEIVED" &&
                startTime
            ){

                const start =
                    new Date(
                        startTime
                    ).getTime();


                if(
                    Number.isFinite(start)
                ){

                    const elapsedMinutes =
                        (
                            Date.now() -
                            start
                        ) / 60000;


                    if(
                        elapsedMinutes >= 10
                    ){

                        overdue = true;

                    }

                }

            }


            /* MAP MARKER */

            if(
                Number.isFinite(lat) &&
                Number.isFinite(lng)
            ){

                let markerColor =
                    "red";


                if(status === "ARRIVED"){
                    markerColor =
                        "orange";
                }


                if(status === "DONE"){
                    markerColor =
                        "#777";
                }


                const marker =
                    L.circleMarker(

                        [lat,lng],

                        {

                            radius:
                                status === "DONE"
                                ? 8
                                : 11,

                            color:
                                markerColor,

                            fillColor:
                                markerColor,

                            fillOpacity:
                                .85,

                            weight:3

                        }

                    );


                const popupHTML =

                    `
                    <div style="
                        font-family:Arial,sans-serif;
                        min-width:220px;
                        color:#111;
                    ">

                        <b>🆘 산악사고 신고</b>

                        <hr>

                        <b>유형:</b>
                        ${escapeHTML(type)}

                        <br>

                        <b>상태:</b>
                        ${escapeHTML(statusText)}

                        <br>

                        <b>주소:</b>
                        ${escapeHTML(address || "-")}

                        <br>

                        <b>상황:</b>
                        ${escapeHTML(symptom || "-")}

                        <br>

                        <b>접수:</b>
                        ${escapeHTML(startTime || "-")}

                        <br>

                        <b>경과:</b>
                        ${escapeHTML(elapsed)}

                        <br><br>

                        ${
                            phone
                            ?
                            `
                            <a
                                href="tel:${escapeAttribute(phone)}"
                                style="
                                    display:inline-block;
                                    padding:6px 10px;
                                    background:#700000;
                                    color:white;
                                    text-decoration:none;
                                    border-radius:4px;
                                "
                            >
                                📞 연락
                            </a>
                            `
                            :
                            ""
                        }


                        ${
                            kakaoMapURL
                            ?
                            `
                            <a
                                href="${escapeAttribute(kakaoMapURL)}"
                                target="_blank"
                                rel="noopener"
                                style="
                                    display:inline-block;
                                    padding:6px 10px;
                                    background:#1769aa;
                                    color:white;
                                    text-decoration:none;
                                    border-radius:4px;
                                    margin-left:4px;
                                "
                            >
                                🗺 지도
                            </a>
                            `
                            :
                            ""
                        }

                    </div>
                    `;


                marker.bindPopup(
                    popupHTML
                );


                marker.on(
                    "click",
                    function(){

                        map.setView(
                            [lat,lng],
                            17
                        );

                    }
                );


                marker.addTo(
                    accidentLayer
                );

            }


            /* CARD */

            let cardClass =
                "case-card";


            if(status === "DONE"){

                cardClass +=
                    " done";

            }
            else if(status === "ARRIVED"){

                cardClass +=
                    " arrived";

            }


            if(
                overdue &&
                status === "RECEIVED"
            ){

                cardClass +=
                    " blink";

            }


            /* TYPE ICON */

            let typeIcon =
                "🆘";


            if(type === "응급환자"){
                typeIcon = "🚑";
            }
            else if(type === "구조출동"){
                typeIcon = "🚓";
            }
            else if(type === "조난"){
                typeIcon = "🆘";
            }
            else if(type === "기타"){
                typeIcon = "✏️";
            }


            /* ACTION BUTTON */

            let actionButtons = "";


            if(status === "RECEIVED"){

                actionButtons =

                    `
                    <button
                        class="arrive-btn"
                        onclick="
                            updateAccidentStatus(
                                '${escapeAttribute(id)}',
                                'ARRIVED'
                            )
                        "
                    >
                        🚓 현장 도착
                    </button>
                    `;

            }


            if(status === "ARRIVED"){

                actionButtons =

                    `
                    <button
                        class="complete-btn"
                        onclick="
                            updateAccidentStatus(
                                '${escapeAttribute(id)}',
                                'DONE'
                            )
                        "
                    >
                        ✅ 구조 완료
                    </button>
                    `;

            }


            /* MAP BUTTON */

            const mapButton =

                Number.isFinite(lat) &&
                Number.isFinite(lng)

                ?

                `
                <button
                    onclick="
                        focusAccident(
                            ${lat},
                            ${lng}
                        )
                    "
                    style="
                        background:#003d5c;
                        color:white;
                        border:1px solid #008dcc;
                        margin-top:6px;
                    "
                >
                    📍 사고 위치 보기
                </button>
                `

                :

                "";


            /* CARD HTML */

            html +=

                `
                <div
                    class="${cardClass}"
                    data-case-id="${escapeAttribute(id)}"
                >

                    <div style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        gap:8px;
                    ">

                        <strong>

                            ${typeIcon}
                            ${escapeHTML(type)}

                        </strong>

                        <span
                            class="${statusClass}"
                        >
                            ${statusText}
                        </span>

                    </div>


                    ${
                        overdue &&
                        status === "RECEIVED"

                        ?

                        `
                        <div style="
                            color:#ff3333;
                            font-weight:bold;
                            margin-top:6px;
                        ">
                            ⚠ 10분 이상 미처리
                        </div>
                        `

                        :

                        ""
                    }


                    <div style="
                        margin-top:8px;
                    ">

                        <b>상황</b>

                        <br>

                        ${escapeHTML(
                            symptom || "-"
                        )}

                    </div>


                    <div style="
                        margin-top:6px;
                    ">

                        <b>주소</b>

                        <br>

                        ${escapeHTML(
                            address || "-"
                        )}

                    </div>


                    <div style="
                        margin-top:6px;
                    ">

                        <b>연락처</b>

                        <br>

                        ${
                            phone

                            ?

                            `
                            <a
                                href="tel:${escapeAttribute(phone)}"
                                style="
                                    color:#00ff9d;
                                "
                            >
                                ${escapeHTML(phone)}
                            </a>
                            `

                            :

                            "-"
                        }

                    </div>


                    <div
                        class="time"
                        style="
                            margin-top:6px;
                        "
                    >

                        접수:
                        ${escapeHTML(
                            startTime || "-"
                        )}

                    </div>


                    <div class="time">

                        경과:
                        ${escapeHTML(elapsed)}

                    </div>


                    ${
                        endTime

                        ?

                        `
                        <div class="time">

                            완료:
                            ${escapeHTML(endTime)}

                        </div>
                        `

                        :

                        ""
                    }


                    ${
                        Number.isFinite(lat) &&
                        Number.isFinite(lng)

                        ?

                        `
                        <div class="coord">

                            Lat:
                            ${lat.toFixed(6)}

                            <br>

                            Lng:
                            ${lng.toFixed(6)}

                        </div>
                        `

                        :

                        ""
                    }


                    ${mapButton}

                    ${actionButtons}

                </div>
                `;


            /* NEW CASE ALERT */

            if(
                !firstLoad &&
                !knownIds.has(id)
            ){

                playAlert();

            }


            /* OVERDUE ALERT */

            if(
                overdue &&
                !alertedOverdueIds.has(id)
            ){

                alertedOverdueIds.add(id);

                if(!firstLoad){

                    playAlert();

                }

            }


            knownIds.add(id);

        }

    );


    caseList.innerHTML =
        html ||
        `
        <div class="case-card">
            현재 접수된 사고가 없습니다.
        </div>
        `;


    firstLoad = false;

}


/* =====================================================
   HTML ESCAPE
====================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ATTRIBUTE ESCAPE
====================================================== */

function escapeAttribute(value){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    );

}


/* =====================================================
   FOCUS ACCIDENT
====================================================== */

function focusAccident(
    lat,
    lng
){

    lat = Number(lat);
    lng = Number(lng);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return;

    }


    const position =
        [lat,lng];


    map.setView(
        position,
        17
    );


    L.popup()
    .setLatLng(position)
    .setContent(
        "🆘 사고 신고 위치"
    )
    .openOn(map);

}


/* =====================================================
   ALERT SOUND
====================================================== */

function playAlert(){

    const audio =
        document.getElementById(
            "alertSound"
        );


    if(!audio){
        return;
    }


    try{

        audio.currentTime = 0;

        const promise =
            audio.play();


        if(
            promise &&
            typeof promise.catch ===
            "function"
        ){

            promise.catch(
                function(err){

                    console.log(
                        "알림음 재생 차단:",
                        err
                    );

                }
            );

        }

    }

    catch(err){

        console.error(
            "알림음 오류:",
            err
        );

    }

}


/* =====================================================
   UPDATE ACCIDENT STATUS
====================================================== */

async function updateAccidentStatus(
    caseId,
    newStatus
){

    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;
    }


    const status =
        normalizeStatus(
            newStatus
        );


    let message =
        "처리하시겠습니까?";


    if(status === "ARRIVED"){

        message =
            "🚓 현장 도착으로 변경하시겠습니까?";

    }


    if(status === "DONE"){

        message =
            "✅ 구조 완료로 변경하시겠습니까?";

    }


    if(!confirm(message)){
        return;
    }


    try{

        const now =
            getNowTime();


        const payload = {

            action:
                "update",

            id:
                caseId,

            caseId:
                caseId,

            status:
                status,

            updatedAt:
                now

        };


        if(status === "ARRIVED"){

            payload.arrivedAt =
                now;

        }


        if(status === "DONE"){

            payload.endTime =
                now;

            payload.completedAt =
                now;

        }


        await fetch(

            ACCIDENT_API_URL,

            {

                method:"POST",

                mode:"no-cors",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(
                        payload
                    )

            }

        );


        alert(

            status === "ARRIVED"

            ?

            "🚓 현장 도착 처리되었습니다."

            :

            "✅ 구조 완료 처리되었습니다."

        );


        setTimeout(
            loadAccidents,
            500
        );

    }

    catch(err){

        console.error(
            "사고 상태 변경 오류:",
            err
        );

        alert(
            "사고 상태 변경 중 오류가 발생했습니다."
        );

    }

}


/* =====================================================
   AUTO REFRESH
====================================================== */

function startAccidentAutoRefresh(){

    if(accidentTimer){

        clearInterval(
            accidentTimer
        );

    }


    loadAccidents();


    accidentTimer =
        setInterval(

            function(){

                loadAccidents();

            },

            5000

        );

}


/* =====================================================
   INITIAL LOAD
====================================================== */

window.addEventListener(
    "load",
    function(){

        loadAccidents();

        startAccidentAutoRefresh();


        setTimeout(
            function(){

                map.invalidateSize();

            },
            500
        );

    }
);


/* =====================================================
   PAGE VISIBILITY
====================================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(!document.hidden){

            loadAccidents();

        }

    }
);


/* =====================================================
   MAP RESIZE
====================================================== */

window.addEventListener(
    "resize",
    function(){

        setTimeout(
            function(){

                map.invalidateSize();

            },
            100
        );

    }
);


/* =====================================================
   KEYBOARD SHORTCUT
====================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "r"
        ){

            e.preventDefault();

            loadAccidents();

        }

    }
);


/* =====================================================
   END
====================================================== */

</script>

</html>

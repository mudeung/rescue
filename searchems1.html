<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📍 신고 시스템 - 좌표변환 통합본</title>

<!-- Kakao Map -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424"></script>

<!-- proj4 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding-bottom: 120px;
    font-family: system-ui, Arial, sans-serif;
    background: #0f172a;
    color: #fff;
}

.header {
    padding: 14px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    background: #020617;
}

.card {
    background: #020617;
    border-radius: 16px;
    padding: 14px;
    margin: 12px;
}

.card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
}

select,
input,
textarea {
    width: 100%;
    min-height: 52px;
    padding: 14px;
    margin-top: 10px;
    font-size: 17px;
    border-radius: 12px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #fff;
    outline: none;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #22c55e;
}

button {
    cursor: pointer;
}

.convert-btn {
    width: 100%;
    margin-top: 12px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #020617;
    font-size: 17px;
    font-weight: 800;
}

.copy-btn {
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: #facc15;
    color: #020617;
    font-weight: 700;
}

.share-btn {
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: #0ea5e9;
    color: #020617;
    font-weight: 700;
}

pre {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
    font-size: 15px;
    background: #020617;
    border: 1px solid #1e293b;
    border-radius: 14px;
    padding: 14px;
    margin: 0;
}

#map {
    height: 260px;
    margin: 12px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
}

#coordOverlay {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(2, 6, 23, .88);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    border: 1px solid #1e293b;
    z-index: 10;
    text-align: center;
    white-space: nowrap;
}

.link-status {
    margin-top: 10px;
    padding: 12px;
    border-radius: 12px;
    background: #172554;
    color: #bfdbfe;
    font-size: 14px;
    line-height: 1.5;
}

.success {
    background: #052e16;
    color: #86efac;
}

.warning {
    background: #451a03;
    color: #fed7aa;
}

.action-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #020617;
    display: flex;
    gap: 8px;
    padding: 10px;
    z-index: 100;
}

.action-bar button {
    flex: 1;
    padding: 17px 8px;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 14px;
}

.primary {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #020617;
}

.share {
    background: #0ea5e9;
    color: #020617;
}

.copy {
    background: #facc15;
    color: #020617;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div class="header">
    📍 신고 시스템 + 좌표변환
</div>


<!-- =========================================================
     신고 내용
========================================================= -->

<div class="card">

    <div class="card-title">
        🚨 신고 내용
    </div>

    <textarea
        id="reportContent"
        placeholder="신고 내용을 입력하세요."></textarea>

</div>


<!-- =========================================================
     신고 좌표
========================================================= -->

<div class="card">

    <div class="card-title">
        📍 신고 위치
    </div>

    <!--
        실제 기존 신고 시스템에서 사용하는 좌표 입력창입니다.

        기존 시스템의 좌표 입력창 ID가 있다면
        아래 id="reportCoordinate" 부분을
        기존 ID로 변경하면 됩니다.
    -->

    <input
        id="reportCoordinate"
        type="text"
        placeholder="신고 좌표"
        autocomplete="off">

    <div
        id="coordinateLinkStatus"
        class="link-status">
        좌표변환 결과가 이 입력창에 자동으로 연결됩니다.
    </div>

</div>


<!-- =========================================================
     좌표 변환
========================================================= -->

<div class="card">

    <div class="card-title">
        🔄 좌표변환
    </div>

    <select id="mode">

        <option value="dd">
            도좌표 (DD)
        </option>

        <option value="dms">
            도분초 (DMS)
        </option>

    </select>


    <input
        id="lat"
        type="text"
        placeholder="위도 예: 35.131486 또는 35 7 53.35">

    <input
        id="lon"
        type="text"
        placeholder="경도 예: 126.947881 또는 126 56 52.37">


    <input
        id="np"
        type="text"
        placeholder="국가지점번호 예: 960 1940">


    <button
        class="convert-btn"
        onclick="convert()">

        📍 변환 및 신고좌표 자동입력

    </button>

</div>


<!-- =========================================================
     변환 결과
========================================================= -->

<div class="card">

    <div class="card-title">
        📋 변환 결과
    </div>

    <pre id="result">좌표 입력 후 [변환 및 신고좌표 자동입력]을 누르세요.</pre>

    <button
        class="copy-btn"
        onclick="copyCoords()">

        📋 결과 복사

    </button>

    <button
        class="share-btn"
        onclick="shareAll()">

        📤 위치 공유

    </button>

</div>


<!-- =========================================================
     지도
========================================================= -->

<div id="map">

    <div id="coordOverlay">
        📍 위치 대기중
    </div>

</div>


<!-- =========================================================
     하단 버튼
========================================================= -->

<div class="action-bar">

    <button
        class="primary"
        onclick="convert()">

        📍 변환

    </button>

    <button
        class="copy"
        onclick="copyCoords()">

        📋 복사

    </button>

    <button
        class="share"
        onclick="shareAll()">

        📤 공유

    </button>

</div>


<script>

/* =========================================================
   EPSG 정의
========================================================= */

proj4.defs(
    "EPSG:5179",
    "+proj=tmerc " +
    "+lat_0=38 " +
    "+lon_0=127.5 " +
    "+k=0.9996 " +
    "+x_0=1000000 " +
    "+y_0=2000000 " +
    "+ellps=GRS80 " +
    "+units=m " +
    "+no_defs"
);


/* =========================================================
   DOM
========================================================= */

const latInput =
    document.getElementById("lat");

const lonInput =
    document.getElementById("lon");

const npInput =
    document.getElementById("np");

const mode =
    document.getElementById("mode");

const result =
    document.getElementById("result");

const reportCoordinate =
    document.getElementById("reportCoordinate");

const coordinateLinkStatus =
    document.getElementById("coordinateLinkStatus");

const coordOverlay =
    document.getElementById("coordOverlay");


/* =========================================================
   전역 변수
========================================================= */

let map = null;

let marker = null;

let myMarker = null;

let myLat = null;

let myLon = null;

let convertedLat = null;

let convertedLon = null;


/* =========================================================
   DMS → DD
========================================================= */

function dmsToDD(value) {

    const parts =
        value
            .trim()
            .split(/\s+/)
            .map(Number);

    if (
        parts.length < 3 ||
        parts.some(Number.isNaN)
    ) {
        return NaN;
    }

    const degree = parts[0];

    const minute = parts[1];

    const second = parts[2];

    const sign =
        degree < 0 ? -1 : 1;

    return sign * (
        Math.abs(degree) +
        minute / 60 +
        second / 3600
    );
}


/* =========================================================
   DD → DMS
========================================================= */

function toDMS(value) {

    const sign =
        value < 0 ? "-" : "";

    const absolute =
        Math.abs(value);

    const degree =
        Math.floor(absolute);

    const minuteFloat =
        (absolute - degree) * 60;

    const minute =
        Math.floor(minuteFloat);

    const second =
        ((minuteFloat - minute) * 60)
        .toFixed(2);

    return (
        sign +
        degree +
        "° " +
        minute +
        "′ " +
        second +
        "″"
    );
}


/* =========================================================
   국가지점번호
========================================================= */

function nationalPointNumber(x, y) {

    return (
        Math.floor(x / 100) +
        " " +
        Math.floor(y / 100)
    );
}


/* =========================================================
   거리 계산
========================================================= */

function calcDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const rad =
        degree =>
            degree * Math.PI / 180;

    const dLat =
        rad(lat2 - lat1);

    const dLon =
        rad(lon2 - lon1);

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(rad(lat1)) *
        Math.cos(rad(lat2)) *
        Math.sin(dLon / 2) ** 2;

    return Math.round(
        R *
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        )
    );
}


/* =========================================================
   좌표 입력값 검증
========================================================= */

function validateCoordinate(
    lat,
    lon
) {

    if (
        Number.isNaN(lat) ||
        Number.isNaN(lon)
    ) {
        alert("좌표 오류입니다.");
        return false;
    }

    if (
        lat < -90 ||
        lat > 90
    ) {
        alert("위도는 -90 ~ 90 범위여야 합니다.");
        return false;
    }

    if (
        lon < -180 ||
        lon > 180
    ) {
        alert("경도는 -180 ~ 180 범위여야 합니다.");
        return false;
    }

    return true;
}


/* =========================================================
   신고 좌표 입력창 자동 연결
========================================================= */

function setReportCoordinate(
    lat,
    lon
) {

    /*
        기본 입력값:

        35.131486, 126.947881

        기존 신고 시스템에서 원하는 형식이
        다르면 이 부분만 변경하면 됩니다.
    */

    const coordinate =
        `${lat.toFixed(6)}, ${lon.toFixed(6)}`;

    reportCoordinate.value =
        coordinate;


    /*
        입력 이벤트를 발생시켜
        기존 신고 시스템의
        change/input 이벤트와 연결합니다.
    */

    reportCoordinate.dispatchEvent(
        new Event("input", {
            bubbles: true
        })
    );

    reportCoordinate.dispatchEvent(
        new Event("change", {
            bubbles: true
        })
    );


    coordinateLinkStatus.textContent =
        `✅ 신고 좌표에 자동 입력됨\n${coordinate}`;

    coordinateLinkStatus.classList.add(
        "success"
    );
}


/* =========================================================
   지도 초기화
========================================================= */

function initMap() {

    const mapDiv =
        document.getElementById("map");

    const defaultPosition =
        new kakao.maps.LatLng(
            35.131486,
            126.947881
        );

    map =
        new kakao.maps.Map(
            mapDiv,
            {
                center: defaultPosition,
                level: 4
            }
        );


    marker =
        new kakao.maps.Marker({
            position: defaultPosition
        });

    marker.setMap(map);


    /*
        현재 위치
    */

    if (
        navigator.geolocation
    ) {

        navigator.geolocation
            .getCurrentPosition(
                function(position) {

                    myLat =
                        position.coords.latitude;

                    myLon =
                        position.coords.longitude;


                    const myPosition =
                        new kakao.maps.LatLng(
                            myLat,
                            myLon
                        );


                    myMarker =
                        new kakao.maps.Marker({
                            position: myPosition
                        });

                    myMarker.setMap(map);

                },
                function() {

                    console.log(
                        "현재 위치를 가져올 수 없습니다."
                    );

                }
            );
    }
}


/* =========================================================
   지도 좌표 표시
========================================================= */

function updateMap(
    lat,
    lon
) {

    if (!map) {
        return;
    }


    const position =
        new kakao.maps.LatLng(
            lat,
            lon
        );


    marker.setPosition(
        position
    );


    map.setCenter(
        position
    );


    coordOverlay.innerHTML =
        `📍 변환 위치<br>
         위도 ${lat.toFixed(6)}<br>
         경도 ${lon.toFixed(6)}`;
}


/* =========================================================
   좌표 변환
========================================================= */

function convert() {

    let lat;

    let lon;


    /*
        국가지점번호가 입력되어 있으면
        국가지점번호를 우선 처리
    */

    if (
        npInput.value.trim()
    ) {

        const parts =
            npInput.value
                .trim()
                .split(/\s+/)
                .map(Number);


        if (
            parts.length !== 2 ||
            parts.some(Number.isNaN)
        ) {

            alert(
                "국가지점번호 형식이 올바르지 않습니다.\n예: 960 1940"
            );

            return;
        }


        const x =
            parts[0] * 100;

        const y =
            parts[1] * 100;


        const wgs84 =
            proj4(
                "EPSG:5179",
                "WGS84",
                [x, y]
            );


        lon =
            wgs84[0];

        lat =
            wgs84[1];

    } else {

        /*
            일반 좌표
        */

        if (
            mode.value === "dd"
        ) {

            lat =
                parseFloat(
                    latInput.value
                );

            lon =
                parseFloat(
                    lonInput.value
                );

        } else {

            lat =
                dmsToDD(
                    latInput.value
                );

            lon =
                dmsToDD(
                    lonInput.value
                );
        }
    }


    /*
        좌표 검증
    */

    if (
        !validateCoordinate(
            lat,
            lon
        )
    ) {

        return;
    }


    /*
        전역 저장
    */

    convertedLat =
        lat;

    convertedLon =
        lon;


    /*
        UTM-K
    */

    const utm =
        proj4(
            "WGS84",
            "EPSG:5179",
            [lon, lat]
        );


    const x =
        Math.floor(utm[0]);

    const y =
        Math.floor(utm[1]);


    /*
        국가지점번호
    */

    const national =
        nationalPointNumber(
            x,
            y
        );


    /*
        거리
    */

    let distanceText = "";


    if (
        myLat !== null &&
        myLon !== null
    ) {

        const distance =
            calcDistance(
                myLat,
                myLon,
                lat,
                lon
            );


        distanceText =
            `\n📏 내 위치까지 거리: ${distance} m`;
    }


    /*
        결과 출력
    */

    result.textContent =
`🆘 신고 좌표

WGS84
위도: ${lat.toFixed(6)}
경도: ${lon.toFixed(6)}

도분초
위도: ${toDMS(lat)}
경도: ${toDMS(lon)}

UTM-K
E ${x}
N ${y}

국가지점번호
${national}
${distanceText}`;


    /*
        신고 시스템 좌표 입력창 자동 입력
    */

    setReportCoordinate(
        lat,
        lon
    );


    /*
        지도 이동
    */

    updateMap(
        lat,
        lon
    );
}


/* =========================================================
   결과 복사
========================================================= */

function copyCoords() {

    if (
        convertedLat === null ||
        convertedLon === null
    ) {

        alert(
            "먼저 좌표를 변환하세요."
        );

        return;
    }


    navigator.clipboard
        .writeText(
            result.textContent
        )
        .then(
            function() {

                alert(
                    "📋 좌표 정보가 복사되었습니다."
                );

            }
        )
        .catch(
            function() {

                alert(
                    "복사에 실패했습니다."
                );

            }
        );
}


/* =========================================================
   공유
========================================================= */

function shareAll() {

    if (
        convertedLat === null ||
        convertedLon === null
    ) {

        alert(
            "먼저 좌표를 변환하세요."
        );

        return;
    }


    const lat =
        convertedLat.toFixed(6);

    const lon =
        convertedLon.toFixed(6);


    const message =
`🆘 위치 공유

${result.textContent}

📍 카카오맵
https://map.kakao.com/link/map/${lat},${lon}`;


    if (
        navigator.share
    ) {

        navigator.share({
            title: "신고 위치",
            text: message
        });

    } else {

        alert(message);
    }
}


/* =========================================================
   신고 좌표 직접 수정 감지
========================================================= */

reportCoordinate.addEventListener(
    "input",
    function() {

        if (
            this.value.trim()
        ) {

            coordinateLinkStatus.textContent =
                "📍 신고 좌표 입력값이 변경되었습니다.";
        }
    }
);


/* =========================================================
   초기화
========================================================= */

initMap();


/* =========================================================
   우클릭 및 일부 단축키 방지
========================================================= */

document.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        /*
            F12
        */

        if (
            event.key === "F12"
        ) {

            event.preventDefault();
            return false;
        }


        /*
            Ctrl + U
        */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "u"
        ) {

            event.preventDefault();
            return false;
        }


        /*
            Ctrl + Shift + I
        */

        if (
            event.ctrlKey &&
            event.shiftKey &&
            event.key.toLowerCase() === "i"
        ) {

            event.preventDefault();
            return false;
        }


        /*
            Ctrl + Shift + J
        */

        if (
            event.ctrlKey &&
            event.shiftKey &&
            event.key.toLowerCase() === "j"
        ) {

            event.preventDefault();
            return false;
        }


        /*
            Ctrl + Shift + C
        */

        if (
            event.ctrlKey &&
            event.shiftKey &&
            event.key.toLowerCase() === "c"
        ) {

            event.preventDefault();
            return false;
        }


        /*
            Ctrl + S
        */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();
            return false;
        }

    }
);

</script>

</body>
</html>

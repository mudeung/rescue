<script>

/* =====================================================
   PASSWORD
====================================================== */

const ACCESS_PASSWORD = "knps";


function checkPassword(){

    const input =
        document.getElementById(
            "passwordInput"
        ).value;

    const error =
        document.getElementById(
            "loginError"
        );


    if(
        input === ACCESS_PASSWORD
    ){

        document.getElementById(
            "loginOverlay"
        ).style.display =
            "none";

        sessionStorage.setItem(
            "authorized",
            "true"
        );

    }

    else{

        error.innerText =
            "❌ 비밀번호가 올바르지 않습니다.";

    }

}


window.addEventListener(
    "load",
    function(){

        if(
            sessionStorage.getItem(
                "authorized"
            ) === "true"
        ){

            document.getElementById(
                "loginOverlay"
            ).style.display =
                "none";

        }

    }
);


/* =====================================================
   API
====================================================== */

const GPS_API_URL =
"https://script.google.com/macros/s/AKfcybyem5fAs2XGxNy6wrHO3s68CmJy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";


const ACCIDENT_API_URL =
"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


/* =====================================================
   MAP
====================================================== */

const map =
    L.map("map")
    .setView(
        [35.1345,126.9902],
        13
    );


/* =====================================================
   MAP LAYERS
====================================================== */

const osm =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    );


const topo =
    L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "OpenTopoMap"
        }
    );


const satellite =
    L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            attribution:
                "Esri"
        }
    );


osm.addTo(map);


L.control.layers({

    "🗺 일반":osm,

    "⛰ 지형":topo,

    "🛰 위성":satellite

}).addTo(map);


/* =====================================================
   COORDINATE
====================================================== */

const coordControl =
    L.control({
        position:"bottomleft"
    });


coordControl.onAdd =
    function(){

        this._div =
            L.DomUtil.create(
                "div",
                "mouse-coords"
            );

        this._div.innerHTML =
            "Lat : --<br>Lng : --";

        return this._div;

    };


coordControl.addTo(map);


map.on(
    "mousemove",
    function(e){

        coordControl._div.innerHTML =

            "Lat : "
            +
            e.latlng.lat.toFixed(6)
            +
            "<br>Lng : "
            +
            e.latlng.lng.toFixed(6);

    }
);


map.on(
    "mouseout",
    function(){

        coordControl._div.innerHTML =
            "Lat : --<br>Lng : --";

    }
);


/* =====================================================
   DRAW
====================================================== */

const drawnItems =
    new L.FeatureGroup();


map.addLayer(
    drawnItems
);


const drawControl =
    new L.Control.Draw({

        draw:{

            polygon:true,

            rectangle:true,

            marker:true,

            polyline:true,

            circle:true

        },

        edit:{

            featureGroup:
                drawnItems

        }

    });


map.addControl(
    drawControl
);


map.on(
    L.Draw.Event.CREATED,
    function(e){

        drawnItems.addLayer(
            e.layer
        );

    }
);


/* =====================================================
   LAYERS
====================================================== */

const rescueLayer =
    L.layerGroup()
    .addTo(map);


const sosLayer =
    L.layerGroup()
    .addTo(map);


const accidentLayer =
    L.layerGroup()
    .addTo(map);


const historyLayer =
    L.layerGroup()
    .addTo(map);


/* =====================================================
   GLOBAL STATE
====================================================== */

let myName = "";

let lastPos = null;

let watchId = null;

let sendTimer = null;

let liveTimer = null;

let accidentTimer = null;

let reportPreviewMarker = null;

let selectedType = "";

let startTime = "";

let endTime = "";


/* =====================================================
   RESCUE MARKERS
====================================================== */

let rescueMarkers = {};

let rescueSOSCircles = {};

let rescueColors = {};


const colors = [

    "#00ff9d",

    "#00aaff",

    "#ffcc00",

    "#ff00ff",

    "#ff6600",

    "#00ffff",

    "#ffffff"

];


function getColor(name){

    if(
        !rescueColors[name]
    ){

        rescueColors[name] =
            colors[
                Object.keys(
                    rescueColors
                ).length
                %
                colors.length
            ];

    }

    return rescueColors[name];

}


/* =====================================================
   DOM
====================================================== */

const nameInput =
    document.getElementById(
        "name"
    );


const startBtn =
    document.getElementById(
        "startBtn"
    );


const conditionEl =
    document.getElementById(
        "condition"
    );


const phoneEl =
    document.getElementById(
        "phone"
    );


const addressEl =
    document.getElementById(
        "address"
    );


const latEl =
    document.getElementById(
        "lat"
    );


const lngEl =
    document.getElementById(
        "lng"
    );


const caseList =
    document.getElementById(
        "caseList"
    );


/* =====================================================
   DEVICE ID
====================================================== */

let DEVICE_ID =
    localStorage.getItem(
        "DEVICE_ID"
    );


if(!DEVICE_ID){

    DEVICE_ID =
        (
            crypto.randomUUID
            ?
            crypto.randomUUID()
            :
            "DEVICE-" +
            Date.now() +
            "-" +
            Math.random()
            .toString(36)
            .slice(2)
        );

    localStorage.setItem(
        "DEVICE_ID",
        DEVICE_ID
    );

}


/* =====================================================
   NAME INPUT
====================================================== */

nameInput.addEventListener(
    "input",
    function(){

        startBtn.disabled =
            nameInput.value.trim() === "";

    }
);


/* =====================================================
   TIME
====================================================== */

function getNowTime(){

    const d =
        new Date();


    return (

        d.getFullYear()
        +
        "-"
        +
        String(
            d.getMonth()+1
        ).padStart(2,"0")
        +
        "-"
        +
        String(
            d.getDate()
        ).padStart(2,"0")
        +
        " "
        +
        String(
            d.getHours()
        ).padStart(2,"0")
        +
        ":"
        +
        String(
            d.getMinutes()
        ).padStart(2,"0")
        +
        ":"
        +
        String(
            d.getSeconds()
        ).padStart(2,"0")

    );

}


/* =====================================================
   START GPS
====================================================== */

function start(){

    myName =
        nameInput.value.trim();


    if(!myName){

        alert(
            "RESCUE UNIT ID 입력"
        );

        return;

    }


    if(
        !navigator.geolocation
    ){

        alert(
            "이 브라우저는 GPS를 지원하지 않습니다."
        );

        return;

    }


    startTime =
        getNowTime();

    endTime = "";


    nameInput.disabled =
        true;

    startBtn.disabled =
        true;


    watchId =
        navigator.geolocation.watchPosition(

            function(pos){

                lastPos = {

                    name:
                        myName,

                    device:
                        DEVICE_ID,

                    lat:
                        pos.coords.latitude,

                    lng:
                        pos.coords.longitude,

                    status:
                        "normal"

                };

            },

            function(err){

                console.error(
                    err
                );

                alert(
                    "GPS 권한을 확인하세요."
                );

            },

            {

                enableHighAccuracy:true,

                maximumAge:1000,

                timeout:10000

            }

        );


    sendTimer =
        setInterval(
            sendGPS,
            5000
        );


    liveTimer =
        setInterval(
            loadLive,
            3000
        );


    loadLive();


    alert(
        "🛰 GPS 시작"
    );

}


/* =====================================================
   SEND GPS
====================================================== */

function sendGPS(){

    if(!lastPos)
        return;


    fetch(

        GPS_API_URL,

        {

            method:"POST",

            headers:{

                "Content-Type":
                    "text/plain"

            },

            body:
                JSON.stringify({

                    ...lastPos,

                    startTime:
                        startTime,

                    endTime:
                        endTime

                })

        }

    )
    .catch(
        console.error
    );

}


/* =====================================================
   LOAD LIVE
====================================================== */

function loadLive(){

    fetch(

        GPS_API_URL
        +
        "?live=1&t="
        +
        Date.now()

    )

    .then(
        r => r.json()
    )

    .then(
        renderLive
    )

    .catch(
        console.error
    );

}


/* =====================================================
   RENDER LIVE
====================================================== */

function renderLive(data){

    if(
        !Array.isArray(data)
    ){

        if(
            data
            &&
            Array.isArray(
                data.data
            )
        ){

            data =
                data.data;

        }

        else{

            data = [];

        }

    }


    rescueLayer.clearLayers();

    sosLayer.clearLayers();


    const activeNames =
        new Set();


    data.forEach(
        function(p){

            const lat =
                Number(
                    p.lat
                );

            const lng =
                Number(
                    p.lng
                );


            if(
                !Number.isFinite(lat)
                ||
                !Number.isFinite(lng)
            ){

                return;

            }


            const pos =
                [lat,lng];


            const name =
                p.name || "UNKNOWN";


            activeNames.add(
                name
            );


            const color =
                getColor(name);


            let marker =
                rescueMarkers[name];


            if(!marker){

                marker =
                    L.circleMarker(

                        pos,

                        {

                            radius:10,

                            color:color,

                            fillColor:color,

                            fillOpacity:1,

                            weight:3

                        }

                    )
                    .bindTooltip(

                        name,

                        {

                            permanent:true,

                            direction:"top",

                            className:
                                "name-label"

                        }

                    );


                rescueMarkers[name] =
                    marker;

            }


            marker.setLatLng(
                pos
            );


            marker.setStyle({

                radius:
                    p.status === "SOS"
                    ? 15
                    : 10,

                color:
                    p.status === "SOS"
                    ? "red"
                    : color,

                fillColor:
                    p.status === "SOS"
                    ? "red"
                    : color

            });


            marker.addTo(
                rescueLayer
            );


            if(
                p.status === "SOS"
            ){

                const circle =
                    L.circle(

                        pos,

                        {

                            radius:70,

                            color:"red",

                            fillColor:"red",

                            fillOpacity:.25

                        }

                    );


                circle.addTo(
                    sosLayer
                );


                rescueSOSCircles[name] =
                    circle;

            }

        }
    );

}

/* =====================================================
   ADDRESS SEARCH
====================================================== */

function searchAddress(){

    const address =
        addressEl.value.trim();


    if(!address){

        alert(
            "주소를 입력하세요."
        );

        return;

    }


    if(
        typeof kakao === "undefined"
        ||
        !kakao.maps
        ||
        !kakao.maps.services
    ){

        alert(
            "Kakao 주소검색 SDK가 설정되지 않았습니다.\n\n"
            +
            "YOUR_KAKAO_APP_KEY를 실제 Kakao JavaScript 키로 변경하세요."
        );

        return;

    }


    const geocoder =
        new kakao.maps.services.Geocoder();


    geocoder.addressSearch(

        address,

        function(result,status){

            if(
                status ===
                kakao.maps.services.Status.OK
            ){

                const lat =
                    parseFloat(
                        result[0].y
                    );

                const lng =
                    parseFloat(
                        result[0].x
                    );


                latEl.value =
                    lat;

                lngEl.value =
                    lng;


                map.setView(

                    [
                        lat,
                        lng
                    ],

                    17

                );


                setReportPreview(
                    lat,
                    lng
                );

            }

            else{

                alert(
                    "주소 검색 실패"
                );

            }

        }

    );

}

function submitData(){

    const condition =
        conditionEl.value.trim();

    const phone =
        phoneEl.value.trim();

    const address =
        addressEl.value.trim();

    const lat =
        latEl.value.trim();

    const lng =
        lngEl.value.trim();


    if(!selectedType){

        alert(
            "신고 유형 선택 필수"
        );

        return;

    }


    if(!condition){

        alert(
            "상황 입력 필수"
        );

        return;

    }


    if(!phone){

        alert(
            "연락처 입력 필수"
        );

        return;

    }


    if(!address){

        alert(
            "주소 입력 필수"
        );

        return;

    }


    if(
        !lat ||
        !lng
    ){

        alert(
            "주소 검색 또는 현재 위치 사용이 필요합니다."
        );

        return;

    }


    const phonePattern =
        /^[0-9\-]{9,13}$/;


    if(
        !phonePattern.test(
            phone
        )
    ){

        alert(
            "연락처 형식 오류"
        );

        return;

    }


    const latNumber =
        Number(lat);

    const lngNumber =
        Number(lng);


    if(
        !Number.isFinite(latNumber)
        ||
        !Number.isFinite(lngNumber)
    ){

        alert(
            "위도 또는 경도가 올바르지 않습니다."
        );

        return;

    }


    sendData(
        latNumber,
        lngNumber
    );

}

/* =====================================================
   ACCIDENT STATE
====================================================== */

let knownIds =
    new Set();


let alertedOverdueIds =
    new Set();


let firstLoad =
    true;


/* =====================================================
   ELAPSED TIME
====================================================== */

function getElapsedTime(
    startTime,
    endTime=null
){

    if(!startTime)
        return "-";


    const start =
        new Date(
            startTime
        );


    if(
        Number.isNaN(
            start.getTime()
        )
    ){

        return "-";

    }


    const end =
        endTime
        ? new Date(endTime)
        : new Date();


    if(
        Number.isNaN(
            end.getTime()
        )
    ){

        return "-";

    }


    let diff =
        Math.floor(
            (end - start) / 1000
        );


    if(diff < 0)
        diff = 0;


    const hour =
        Math.floor(
            diff / 3600
        );


    diff %= 3600;


    const minute =
        Math.floor(
            diff / 60
        );


    const second =
        diff % 60;


    return (

        String(hour).padStart(2,"0")
        +
        ":"
        +
        String(minute).padStart(2,"0")
        +
        ":"
        +
        String(second).padStart(2,"0")

    );

}


/* =====================================================
   NORMALIZE STATUS
====================================================== */

function normalizeStatus(
    value
){

    const status =
        String(
            value || ""
        )
        .trim()
        .toUpperCase();


    if(
        status === "DONE"
        ||
        status === "완료"
        ||
        status === "처리완료"
    ){

        return "DONE";

    }


    if(
        status === "ARRIVED"
        ||
        status === "도착"
        ||
        status === "현장도착"
    ){

        return "ARRIVED";

    }


    return "RECEIVED";

}


/* =====================================================
   FIELD HELPER
====================================================== */

function getAccidentField(
    item,
    names
){

    for(
        const name of names
    ){

        if(
            item[name] !== undefined
            &&
            item[name] !== null
            &&
            String(
                item[name]
            ).trim() !== ""
        ){

            return item[name];

        }

    }


    return "";

}


/* =====================================================
   ACCIDENT ID
====================================================== */

function getAccidentId(
    item,
    index
){

    return String(

        getAccidentField(
            item,
            [
                "id",
                "ID",
                "caseId",
                "caseID",
                "사고ID",
                "timestamp",
                "createdAt"
            ]
        )
        ||
        (
            getAccidentField(
                item,
                [
                    "lat",
                    "latitude",
                    "위도"
                ]
            )
            +
            "_"
            +
            getAccidentField(
                item,
                [
                    "lng",
                    "longitude",
                    "경도"
                ]
            )
            +
            "_"
            +
            index
        )

    );

}


/* =====================================================
   ACCIDENT START TIME
====================================================== */

function getAccidentStartTime(
    item
){

    return (

        getAccidentField(
            item,
            [
                "startTime",
                "createdAt",
                "timestamp",
                "time",
                "date",
                "접수시간"
            ]
        )
        ||
        ""

    );

}


/* =====================================================
   LOAD ACCIDENTS
====================================================== */

function loadAccidents(){

    fetch(

        ACCIDENT_API_URL
        +
        "?list=1&t="
        +
        Date.now()

    )

    .then(
        response => {

            if(
                !response.ok
            ){

                throw new Error(
                    "HTTP "
                    +
                    response.status
                );

            }

            return response.json();

        }
    )

    .then(
        data => {

            let rows =
                data;


            if(
                data
                &&
                Array.isArray(
                    data.data
                )
            ){

                rows =
                    data.data;

            }


            if(
                data
                &&
                Array.isArray(
                    data.items
                )
            ){

                rows =
                    data.items;

            }


            if(
                data
                &&
                Array.isArray(
                    data.rows
                )
            ){

                rows =
                    data.rows;

            }


            if(
                !Array.isArray(rows)
            ){

                rows = [];

            }


            renderAccidents(
                rows
            );

        }
    )

    .catch(
        err => {

            console.error(
                "사고 목록 조회 오류:",
                err
            );


            if(
                firstLoad
            ){

                caseList.innerHTML =

                    `
                    <div class="case-card">

                        ⚠ 사고 목록을
                        불러오지 못했습니다.

                        <br><br>

                        서버 연결 상태를
                        확인하세요.

                    </div>
                    `;

            }

        }
    );

}


/* =====================================================
   RENDER ACCIDENTS
====================================================== */

function renderAccidents(
    data
){

    accidentLayer.clearLayers();


    if(
        !data
        ||
        data.length === 0
    ){

        caseList.innerHTML =

            `
            <div class="case-card">

                현재 접수된
                산악사고가 없습니다.

            </div>
            `;


        firstLoad = false;

        return;

    }


    const rows =
        [...data].sort(
            function(a,b){

                const ta =
                    new Date(
                        getAccidentStartTime(a)
                    ).getTime();


                const tb =
                    new Date(
                        getAccidentStartTime(b)
                    ).getTime();


                /*
                 * 최신 신고가 위로
                 */

                if(
                    Number.isNaN(ta)
                    &&
                    Number.isNaN(tb)
                ){

                    return 0;

                }


                if(
                    Number.isNaN(ta)
                ){

                    return 1;

                }


                if(
                    Number.isNaN(tb)
                ){

                    return -1;

                }


                return tb - ta;

            }
        );


    let html = "";


    rows.forEach(
        function(item,index){

            /* =================================================
               사고 ID
            ================================================== */

            const id =
                getAccidentId(
                    item,
                    index
                );


            /* =================================================
               좌표
            ================================================== */

            const lat =
                Number(
                    getAccidentField(
                        item,
                        [
                            "lat",
                            "latitude",
                            "위도"
                        ]
                    )
                );


            const lng =
                Number(
                    getAccidentField(
                        item,
                        [
                            "lng",
                            "longitude",
                            "경도"
                        ]
                    )
                );


            /* =================================================
               기본 정보
            ================================================== */

            const type =
                getAccidentField(
                    item,
                    [
                        "type",
                        "reportType",
                        "신고유형"
                    ]
                )
                ||
                "기타";


            const condition =
                getAccidentField(
                    item,
                    [
                        "symptom",
                        "condition",
                        "상황",
                        "내용"
                    ]
                )
                ||
                "-";


            const phone =
                getAccidentField(
                    item,
                    [
                        "phone",
                        "연락처"
                    ]
                )
                ||
                "-";


            const address =
                getAccidentField(
                    item,
                    [
                        "address",
                        "주소"
                    ]
                )
                ||
                "-";


            /* =================================================
               시간
            ================================================== */

            const startTime =
                getAccidentStartTime(
                    item
                );


            const endTime =
                getAccidentField(
                    item,
                    [
                        "endTime",
                        "completedAt",
                        "완료시간"
                    ]
                );


            /* =================================================
               상태
            ================================================== */

            const rawStatus =
                getAccidentField(
                    item,
                    [
                        "status",
                        "상태"
                    ]
                );


            const status =
                normalizeStatus(
                    rawStatus
                );


            let statusText =
                "접수";


            if(
                status === "ARRIVED"
            ){

                statusText =
                    "현장도착";

            }


            if(
                status === "DONE"
            ){

                statusText =
                    "처리완료";

            }


            /* =================================================
               경과시간
            ================================================== */

            const elapsed =
                getElapsedTime(
                    startTime,
                    status === "DONE"
                    ? endTime
                    : null
                );


            /* =================================================
               지도 사고 마커
            ================================================== */

            if(
                Number.isFinite(lat)
                &&
                Number.isFinite(lng)
            ){

                const marker =
                    L.marker(

                        [
                            lat,
                            lng
                        ],

                        {

                            icon:
                                createAccidentIcon(
                                    status
                                )

                        }

                    );


                const popup =

                    `
                    <div style="
                        min-width:230px;
                        color:#222;
                        font-family:Arial,sans-serif;
                        line-height:1.5;
                    ">

                        <div style="
                            font-size:16px;
                            font-weight:bold;
                            color:${
                                status === "DONE"
                                ? "#666"
                                :
                                status === "ARRIVED"
                                ? "#ef6c00"
                                : "#d00000"
                            };
                            margin-bottom:8px;
                        ">

                            🆘 ${escapeHTML(type)}

                        </div>


                        <div>

                            <b>상황</b><br>

                            ${escapeHTML(condition)}

                        </div>


                        <div style="
                            margin-top:6px;
                        ">

                            <b>주소</b><br>

                            ${escapeHTML(address)}

                        </div>


                        <div style="
                            margin-top:6px;
                        ">

                            <b>연락처:</b>
                            ${escapeHTML(phone)}

                        </div>


                        <div style="
                            margin-top:6px;
                            color:#555;
                        ">

                            접수:
                            ${escapeHTML(
                                startTime || "-"
                            )}

                            <br>

                            경과:
                            ${escapeHTML(
                                elapsed
                            )}

                        </div>


                        <div style="
                            margin-top:6px;
                            font-weight:bold;
                        ">

                            상태:
                            ${escapeHTML(
                                statusText
                            )}

                        </div>

                    </div>
                    `;


                marker
                .bindPopup(
                    popup
                );


                marker
                .bindTooltip(

                    "🆘 "
                    +
                    type,

                    {

                        direction:
                            "top",

                        offset:
                            [0,-25]

                    }

                );


                marker.addTo(
                    accidentLayer
                );

            }


            /* =================================================
               신규 사고 알림
            ================================================== */

            if(
                !firstLoad
                &&
                !knownIds.has(id)
            ){

                playAlertSound();

            }


            knownIds.add(
                id
            );


            /* =================================================
               30분 이상 미처리 사고
            ================================================== */

            let overdue =
                false;


            if(
                status !== "DONE"
                &&
                startTime
            ){

                const start =
                    new Date(
                        startTime
                    );


                if(
                    !Number.isNaN(
                        start.getTime()
                    )
                ){

                    const minutes =
                        (
                            Date.now()
                            -
                            start.getTime()
                        )
                        /
                        60000;


                    if(
                        minutes >= 30
                    ){

                        overdue =
                            true;


                        if(
                            !alertedOverdueIds.has(id)
                        ){

                            alertedOverdueIds.add(
                                id
                            );


                            /*
                             * 30분 경과 경고음
                             */

                            playAlertSound();

                        }

                    }

                }

            }


            /* =================================================
               카드 클래스
            ================================================== */

            let cardClass =
                "case-card";


            if(
                status === "DONE"
            ){

                cardClass +=
                    " done";

            }

            else if(
                status === "ARRIVED"
            ){

                cardClass +=
                    " arrived";

            }

            else if(
                overdue
            ){

                cardClass +=
                    " blink";

            }


            /* =================================================
               상태 표시
            ================================================== */

            let statusHTML = "";


            if(
                status === "DONE"
            ){

                statusHTML =

                    `
                    <span class="status-done">

                        처리완료

                    </span>
                    `;

            }

            else if(
                status === "ARRIVED"
            ){

                statusHTML =

                    `
                    <span class="status-arrived">

                        현장도착

                    </span>
                    `;

            }

            else{

                statusHTML =

                    `
                    <span class="status-received">

                        접수

                    </span>
                    `;

            }


            /* =================================================
               사고 카드
            ================================================== */

            html +=

                `
                <div
                    class="${cardClass}"
                    data-case-id="${escapeHTML(id)}"
                >

                    <div style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        gap:5px;
                    ">

                        <strong>

                            🆘
                            ${escapeHTML(type)}

                        </strong>

                        ${statusHTML}

                    </div>


                    <div style="
                        margin-top:8px;
                    ">

                        <b>상황:</b>

                        ${escapeHTML(condition)}

                    </div>


                    <div style="
                        margin-top:5px;
                    ">

                        <b>주소:</b>

                        ${escapeHTML(address)}

                    </div>


                    <div style="
                        margin-top:5px;
                    ">

                        <b>연락처:</b>

                        ${escapeHTML(phone)}

                    </div>


                    <div class="time">

                        ⏱ 접수:

                        ${escapeHTML(
                            startTime || "-"
                        )}

                        <br>

                        ⏱ 경과:

                        ${escapeHTML(
                            elapsed
                        )}

                    </div>


                    ${
                        Number.isFinite(lat)
                        &&
                        Number.isFinite(lng)

                        ?

                        `

                        <div class="coord">

                            LAT :
                            ${lat.toFixed(6)}

                            <br>

                            LNG :
                            ${lng.toFixed(6)}

                        </div>

                        `

                        :

                        ""

                    }


                    ${
                        overdue
                        &&
                        status !== "DONE"

                        ?

                        `
                        <div style="
                            color:#ff3333;
                            font-weight:bold;
                            margin-top:7px;
                        ">

                            ⚠ 30분 이상
                            미처리 사고

                        </div>
                        `

                        :

                        ""

                    }


                    ${
                        status === "RECEIVED"

                        ?

                        `
                        <button
                            class="arrive-btn"
                            onclick="
                                arriveAccident(
                                    '${escapeJS(id)}'
                                )
                            "
                        >

                            🚑 현장 도착

                        </button>
                        `

                        :

                        ""

                    }


                    ${
                        status === "ARRIVED"

                        ?

                        `
                        <button
                            class="complete-btn"
                            onclick="
                                completeAccident(
                                    '${escapeJS(id)}'
                                )
                            "
                        >

                            ✅ 구조 완료

                        </button>
                        `

                        :

                        ""

                    }


                    ${
                        Number.isFinite(lat)
                        &&
                        Number.isFinite(lng)

                        ?

                        `
                        <button
                            onclick="
                                focusAccident(
                                    ${lat},
                                    ${lng}
                                )
                            "
                        >

                            📍 지도에서 보기

                        </button>
                        `

                        :

                        ""

                    }


                    ${
                        Number.isFinite(lat)
                        &&
                        Number.isFinite(lng)

                        ?

                        `
                        <button
                            onclick="
                                openNavigation(
                                    ${lat},
                                    ${lng}
                                )
                            "
                        >

                            🧭 길찾기

                        </button>
                        `

                        :

                        ""

                    }

                </div>
                `;

        }
    );


    /* =====================================================
       카드 출력
    ====================================================== */

    caseList.innerHTML =
        html;


    /* =====================================================
       최초 로딩 종료
    ====================================================== */

    firstLoad =
        false;

}

/* =====================================================
   HTML ESCAPE
====================================================== */

function escapeHTML(value){

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   JAVASCRIPT STRING ESCAPE
====================================================== */

function escapeJS(value){

    return String(value ?? "")

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\r/g,
            "\\r"
        )

        .replace(
            /\n/g,
            "\\n"
        );

}


/* =====================================================
   ALERT SOUND
====================================================== */

let lastAlertTime = 0;


/*
 * 브라우저의 자동재생 정책 때문에
 * 최초 사용자 동작 이후 정상적으로 재생됩니다.
 */

function playAlertSound(){

    const now =
        Date.now();


    /*
     * 너무 짧은 시간에 반복 재생 방지
     */

    if(
        now - lastAlertTime < 3000
    ){

        return;

    }


    lastAlertTime =
        now;


    const audio =
        document.getElementById(
            "alertSound"
        );


    if(!audio){

        return;

    }


    try{

        audio.pause();

        audio.currentTime = 0;

        const promise =
            audio.play();


        if(
            promise
            &&
            typeof promise.catch === "function"
        ){

            promise.catch(
                function(err){

                    console.warn(
                        "알림음 재생 차단:",
                        err
                    );

                }
            );

        }

    }

    catch(err){

        console.error(
            "알림음 오류:",
            err
        );

    }

}


/* =====================================================
   ACCIDENT API UPDATE
====================================================== */

async function updateAccidentStatus(
    id,
    status
){

    if(!id){

        alert(
            "사고 ID를 확인할 수 없습니다."
        );

        return false;

    }


    try{

        const response =
            await fetch(

                ACCIDENT_API_URL,

                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "update",

                            id:
                                id,

                            status:
                                status,

                            updatedAt:
                                getNowTime(),

                            responder:
                                myName || ""

                        })

                    }

            );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP "
                +
                response.status
            );

        }


        /*
         * 서버 응답이 JSON인 경우 확인
         */

        let result =
            null;


        try{

            result =
                await response.json();

        }

        catch(e){

            /*
             * Google Apps Script가
             * JSON 이외의 응답을 반환해도
             * HTTP 200이면 성공으로 처리
             */

        }


        console.log(
            "사고 상태 변경:",
            result
        );


        return true;

    }

    catch(err){

        console.error(
            "사고 상태 변경 오류:",
            err
        );


        alert(
            "사고 상태 변경 중 오류가 발생했습니다."
        );


        return false;

    }

}

/* =====================================================
   LIVE ELAPSED TIME
====================================================== */

function refreshElapsedTimes(){

    const cards =
        document.querySelectorAll(
            ".case-card"
        );


    cards.forEach(
        function(card){

            /*
             * 사고 목록 전체를 다시 요청하지 않고
             * 현재 카드의 접수시간을 기준으로
             * 경과시간만 갱신합니다.
             */

            const timeElements =
                card.querySelectorAll(
                    ".time"
                );


            if(
                !timeElements.length
            ){

                return;

            }


            const timeElement =
                timeElements[0];


            const text =
                timeElement.innerText;


            const match =
                text.match(
                    /접수:\s*([^\n]+)/
                );


            if(!match){

                return;

            }


            const startTime =
                match[1].trim();


            if(
                !startTime
                ||
                startTime === "-"
            ){

                return;

            }


            const endTime =
                card.classList.contains(
                    "done"
                )
                ?
                null
                :
                null;


            const elapsed =
                getElapsedTime(
                    startTime,
                    endTime
                );


            /*
             * 접수시간은 유지하고
             * 경과시간 부분만 갱신
             */

            const lines =
                timeElement.innerHTML
                .split("<br>");


            if(
                lines.length >= 2
            ){

                lines[1] =
                    "⏱ 경과: "
                    +
                    escapeHTML(
                        elapsed
                    );


                timeElement.innerHTML =
                    lines.join("<br>");

            }

        }
    );

}

====================================================== */

function startAccidentPolling(){

    /*
     * 기존 타이머가 있으면 제거
     */

    if(accidentTimer){

        clearInterval(
            accidentTimer
        );

    }


    /*
     * 최초 즉시 조회
     */

    loadAccidents();


    /*
     * 5초마다 사고 목록 갱신
     */

    accidentTimer =
        setInterval(

            function(){

                loadAccidents();

            },

            5000

        );

}

        if(watchId !== null){

            );

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게시판 + 파일 공유</title>

<style>
body{
    font-family:"맑은 고딕", sans-serif;
    text-align:center;
    padding:30px;
}

input{
    padding:10px;
    margin:5px;
    width:250px;
}

button{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#postBtn{
    background:#4285F4;
    color:white;
}

#fileBtn{
    background:#34A853;
    color:white;
}

ul{
    list-style:none;
    padding:0;
}

li{
    border:1px solid #ddd;
    margin:10px auto;
    padding:10px;
    width:60%;
    border-radius:8px;
}
</style>
</head>
<body>

<h1>📢 게시판 + 파일 공유</h1>

<!-- 게시판 -->
<input id="title" placeholder="제목">
<br>
<input id="content" placeholder="내용">
<br>
<button id="postBtn" onclick="addPost()">글쓰기</button>

<hr>

<!-- 파일 업로드 -->
<input type="file" id="fileInput">
<br>
<button id="fileBtn" onclick="uploadFile()">파일 업로드</button>

<hr>

<h3>📌 게시글</h3>
<ul id="postList"></ul>

<h3>📁 파일 목록</h3>
<ul id="fileList"></ul>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL,
    listAll
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js";

import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-analytics.js";

// 🔥 Firebase 설정 (너 프로젝트 그대로)
const firebaseConfig = {
    apiKey: "AIzaSyB5eWq7xb9QJTbY9XftYEt5L6wov27R8UI",
    authDomain: "mudeungrescue-d4ef9.firebaseapp.com",
    projectId: "mudeungrescue-d4ef9",
    storageBucket: "mudeungrescue-d4ef9.firebasestorage.app",
    messagingSenderId: "845241211078",
    appId: "1:845241211078:web:50b5f30b216ddffddcdfc7",
    measurementId: "G-SJ74PPBGG5"
};

// 초기화
const app = initializeApp(firebaseConfig);
getAnalytics(app);

const db = getFirestore(app);
const storage = getStorage(app);

const postRef = collection(db, "posts");

// ======================
// 📌 게시판 글쓰기
// ======================
window.addPost = async function(){
    const title = document.getElementById("title").value;
    const content = document.getElementById("content").value;

    if(!title || !content) return;

    await addDoc(postRef, {
        title,
        content,
        createdAt: Date.now()
    });

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
};

// ======================
// 📌 게시글 실시간 출력
// ======================
const q = query(postRef, orderBy("createdAt","desc"));

onSnapshot(q,(snap)=>{
    const list = document.getElementById("postList");
    list.innerHTML = "";

    snap.forEach(doc=>{
        const d = doc.data();
        const li = document.createElement("li");
        li.innerHTML = `<b>${d.title}</b><br>${d.content}`;
        list.appendChild(li);
    });
});

// ======================
// 📌 파일 업로드
// ======================
window.uploadFile = async function(){
    const file = document.getElementById("fileInput").files[0];
    if(!file) return;

    const fileRef = ref(storage, "files/" + file.name);

    await uploadBytes(fileRef, file);

    const url = await getDownloadURL(fileRef);

    await addDoc(collection(db,"files"),{
        name:file.name,
        url:url,
        createdAt:Date.now()
    });

    loadFiles();
};

// ======================
// 📌 파일 목록 출력
// ======================
async function loadFiles(){
    const list = document.getElementById("fileList");
    list.innerHTML = "";

    const snap = await listAll(ref(storage,"files"));

    for(const item of snap.items){
        const url = await getDownloadURL(item);

        const li = document.createElement("li");
        li.innerHTML = `<a href="${url}" target="_blank">📎 ${item.name}</a>`;
        list.appendChild(li);
    }
}

// 처음 로드
loadFiles();

</script>

</body>
</html>

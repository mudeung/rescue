<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산특수구조팀 실시간 산악사고 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
button{padding:8px 12px;background:#e53935;color:#fff;border:none;border-radius:4px;cursor:pointer;}  
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;}
.card.done{background:#2b2b2b;opacity:0.6;}
.time{color:#ffcc00;font-size:14px;}
.coord{font-size:12px;color:#aaa;}
.maplink{color:#4fc3f7;font-size:13px;text-decoration:none;}
.maplink:hover{text-decoration:underline;}
.complete-btn{
  background:#2e7d32;
  margin-top:8px;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:4px;
  cursor:pointer;
}
.complete-btn:hover{opacity:0.8;}

/* 깜빡임 애니메이션 */
@keyframes blinkEmergency{
0%{box-shadow:0 0 5px #ff1744;}
50%{box-shadow:0 0 20px #ff1744;}
100%{box-shadow:0 0 5px #ff1744;}
}
.card.blink{animation:blinkEmergency 1s infinite;}
</style>
</head>

<body>
  
<!-- 🔐 비밀번호 잠금 화면 -->
<div id="loginOverlay" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
flex-direction:column;
">
  <h2 style="margin-bottom:20px;">🔐 무등산특수구조팀 산악사고 공유 접속 인증</h2>
  <input type="password" id="passwordInput" placeholder="비밀번호 입력"
    style="width:250px;padding:10px;border-radius:6px;border:none;margin-bottom:10px;">
  <button onclick="checkPassword()">접속하기</button>
  <p id="loginError" style="color:red;margin-top:10px;"></p>
</div>

<header>🆘 무등산특수구조팀 실시간 산악사고 신고공유</header>

<audio id="alertSound">
  <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<div class="container" style="display: flex; justify-content: flex-end;">
  <div>
    <button onclick="window.open('https://mudeung.github.io/rescue/ems.html', '_blank', 'noopener')">
      무등산 산악사고 기록지 바로가기
    </button>
  </div>
</div>  
  
<div class="container">
<div id="listArea">로딩중...</div>
</div>

<script>
  
/* ===== 🔐 비밀번호 설정 ===== */
const ACCESS_PASSWORD = "knps";  // ← 원하는 비밀번호로 변경하세요

function checkPassword(){
  const input = document.getElementById("passwordInput").value;
  const error = document.getElementById("loginError");

  if(input === ACCESS_PASSWORD){
    document.getElementById("loginOverlay").style.display="none";
    sessionStorage.setItem("authorized","true");
  } else {
    error.innerText = "❌ 비밀번호가 올바르지 않습니다.";
  }
}

/* 세션 유지 */
window.addEventListener("load",function(){
  if(sessionStorage.getItem("authorized")==="true"){
    document.getElementById("loginOverlay").style.display="none";
  }
});
  
/* 이미 로그인했으면 다시 안 물어봄 */
window.addEventListener("load",function(){
  if(sessionStorage.getItem("authorized")==="true"){
    document.getElementById("loginOverlay").style.display="none";
  }
});
  
const API_URL="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";
const listArea=document.getElementById("listArea");
let alertedOverdueIds=new Set();

/* ===== 경과시간 계산 (완료 시점까지 멈춤) ===== */
function getElapsedTime(startTime, endTime=null){
  const start = new Date(startTime);
  const end = endTime ? new Date(endTime) : new Date();
  const diff = Math.floor((end - start)/1000);
  const m = Math.floor(diff/60);
  const s = diff%60;
  return `${m}분 ${s}초 경과`;
}

/* ===== 3분 초과 체크 및 알림 ===== */
function checkOverdue(item, div) {
  if(item.type !== "응급환자") return;
  if(!item.status || item.status === "사고처리완료") return;

  const diffSeconds = Math.floor((new Date() - new Date(item.time)) / 1000);
  if(diffSeconds >= 180) { // 3분 경과
    div.classList.add("blink");

    // 한 번만 알림 등록
    if(!alertedOverdueIds.has(item.id)){
      alertedOverdueIds.add(item.id);

      // 30초 간격 반복 재생
      const interval = setInterval(()=>{
        if(div.classList.contains("done")) {
          clearInterval(interval);
          alertedOverdueIds.delete(item.id);
          return;
        }
        const alertSound = document.getElementById("alertSound");
        alertSound.currentTime = 0;
        alertSound.play();
      }, 30000);

      // 즉시 한번 재생
      const alertSound = document.getElementById("alertSound");
      alertSound.currentTime = 0;
      alertSound.play();
    }
  }
}

/* ===== 🚑 현장도착 처리 ===== */
async function completeCase(id){
  if(!confirm("구조대원이 현장에 도착했습니까?")) return;
  try{
    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify({action:"complete",id:id,completeTime:new Date().toISOString()})
    });
    loadData();
  }catch(err){alert("처리 실패"); console.error(err);}
}

/* ===== ✅ 사고처리 완료 ===== */
async function finishCase(id){
  if(!confirm("사고처리를 완료하시겠습니까?")) return;
  try{
    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify({action:"finish",id:id,finishTime:new Date().toISOString()})
    });
    loadData();
  }catch(err){alert("처리 실패"); console.error(err);}
}

/******** 목록 불러오기 ********/
async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();
  listArea.innerHTML="";
  if(!data.length){
    listArea.innerHTML="현재 접수된 신고가 없습니다.";
    return;
  }

  data.sort((a,b)=>new Date(b.time)-new Date(a.time));

  data.forEach(item=>{
    const div=document.createElement("div");
    div.className="card"+(item.status==="사고처리완료"?" done":"");
    div.setAttribute("data-time", item.time);
    if(item.finishTime) div.setAttribute("data-finish-time", item.finishTime);

    div.innerHTML=`
      <div class="time">🕒 접수: ${new Date(item.time).toLocaleString()}</div>
      <div class="time elapsed">⏱ ${getElapsedTime(item.time, item.finishTime)}</div>
      ${item.status==="현장도착"? `<div class="time">🚑 현장도착: ${item.completeTime ? new Date(item.completeTime).toLocaleString() : ""}</div>` : ""}
      ${item.status==="사고처리완료"? `<div class="time">🚑 현장도착: ${item.completeTime ? new Date(item.completeTime).toLocaleString() : ""}</div><div class="time">✅ 사고처리 완료: ${item.finishTime ? new Date(item.finishTime).toLocaleString() : ""}</div>` : ""}
      🏠 ${item.address||"주소없음"}<br>
      📞 ${item.phone||"번호없음"}<br>
      📝 ${item.symptom||"내용없음"}<br>
      <div class="coord">위도: ${item.lat} / 경도: ${item.lng}</div>
      <a class="maplink" href="https://map.kakao.com/link/map/구조요청 위치,${item.lat},${item.lng}" target="_blank">📍 지도보기</a><br>
      ${item.status==="사고처리완료" ? "" : item.status==="현장도착" ? `<button class="complete-btn" onclick="finishCase('${item.id}')">✅ 사고처리 완료</button>` : `<button class="complete-btn" onclick="completeCase('${item.id}')">🚑 구조대원 현장도착</button>`}
    `;
    listArea.appendChild(div);

    checkOverdue(item, div);
  });
}

/* ===== 경과시간 갱신 ===== */
setInterval(()=>{
  document.querySelectorAll(".card").forEach(card=>{
    const elapsedEl = card.querySelector(".time.elapsed");
    const timeAttr = card.getAttribute("data-time");
    const finishTimeAttr = card.getAttribute("data-finish-time");
    if(!elapsedEl || !timeAttr) return;
    elapsedEl.innerText = "⏱ " + getElapsedTime(timeAttr, finishTimeAttr);
  });
},1000);

/* ===== 초기 실행 ===== */
loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

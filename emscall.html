<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>🆘 무등산특수구조팀 산악사고 공유</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- =====================================================
         카카오맵 SDK
    ====================================================== -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services">
    </script>


    <!-- =====================================================
         CSS
    ====================================================== -->
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        /* =====================================================
           헤더
        ====================================================== */

        header {
            background: #b71c1c;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }


        /* =====================================================
           컨테이너
        ====================================================== */

        .container {
            padding: 15px;
        }


        /* =====================================================
           사고 카드
        ====================================================== */

        .card {
            background: #1e1e1e;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 2px solid transparent;
        }


        /* 접수 */

        .card.received {
            border-color: #ff1744;
        }


        /* 현장도착 */

        .card.arrived {
            background: #292315;
            border-color: #ff9800;
            box-shadow:
                0 0 10px rgba(255, 152, 0, 0.5);
        }


        /* =====================================================
           사고처리완료 - 회색
        ====================================================== */

        .card.done {
            background: #2b2b2b;
            border-color: #777777;
            box-shadow:
                0 0 10px rgba(117, 117, 117, 0.4);
            opacity: 0.8;
        }


        /* =====================================================
           시간
        ====================================================== */

        .time {
            color: #ffcc00;
            font-size: 14px;
            margin-bottom: 4px;
        }


        /* =====================================================
           좌표
        ====================================================== */

        .coord {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }


        /* =====================================================
           카카오맵 링크
        ====================================================== */

        .maplink {
            color: #4fc3f7;
            font-size: 13px;
            text-decoration: none;
        }

        .maplink:hover {
            text-decoration: underline;
        }


        /* =====================================================
           상태 표시
        ====================================================== */

        .status {
            display: inline-block;
            padding: 5px 10px;
            margin: 6px 0 8px 0;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
        }


        /* 접수 */

        .status.received {
            background: #d50000;
            color: #fff;
        }


        /* 현장도착 */

        .status.arrived {
            background: #ef6c00;
            color: #fff;
        }


        /* =====================================================
           사고처리완료 - 회색
        ====================================================== */

        .status.done {
            background: #777777;
            color: #fff;
        }


        /* =====================================================
           처리 버튼
        ====================================================== */

        .complete-btn {
            background: #2e7d32;
            margin-top: 8px;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .complete-btn:hover {
            opacity: 0.8;
        }


        /* =====================================================
           지도
        ====================================================== */

        #map {
            width: 100%;
            height: 320px;
            margin-bottom: 15px;
            border-radius: 6px;
        }


        /* =====================================================
           3분 경과 깜빡임
        ====================================================== */

        @keyframes blinkEmergency {

            0% {
                box-shadow: 0 0 5px #ff1744;
            }

            50% {
                box-shadow: 0 0 20px #ff1744;
            }

            100% {
                box-shadow: 0 0 5px #ff1744;
            }

        }


        .card.blink {
            animation: blinkEmergency 1s infinite;
        }


        /* =====================================================
           모바일
        ====================================================== */

        @media (max-width: 768px) {

            header {
                font-size: 17px;
            }

            #map {
                height: 300px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>
        🆘 무등산특수구조팀 산악사고 공유
    </header>


    <!-- =====================================================
         알림음
    ====================================================== -->

    <audio id="alertSound">

        <source
            src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
            type="audio/ogg"
        >

    </audio>


    <!-- =====================================================
         지도
    ====================================================== -->

    <div class="container">

        <div id="map"></div>

    </div>


    <!-- =====================================================
         로고
    ====================================================== -->

    <img
        src="https://mudeung.github.io/rescue/logo19_192.png"
        alt="달콩이 이미지"
        style="
            display:block;
            margin:0 auto;
        "
    >


    <!-- =====================================================
         사고 신고 목록
    ====================================================== -->

    <div class="container">

        <div id="listArea">
            로딩중...
        </div>

    </div>


    <br>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           지도 초기화
        ====================================================== */

        let map;

        let markers = [];


        function initMap() {

            map = new kakao.maps.Map(

                document.getElementById("map"),

                {

                    center:
                        new kakao.maps.LatLng(
                            35.1345,
                            126.9902
                        ),

                    level: 6

                }

            );

        }


        initMap();


        /* =====================================================
           구글 시트 API
        ====================================================== */

        const API_URL =
            "https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


        const listArea =
            document.getElementById("listArea");


        /* =====================================================
           상태 변수
        ====================================================== */

        let knownIds = new Set();

        let alertedOverdueIds = new Set();

        let firstLoad = true;


        /* =====================================================
           경과시간 계산
        ====================================================== */

        function getElapsedTime(
            startTime,
            endTime = null
        ) {

            const start =
                new Date(startTime);

            const end =
                endTime
                    ? new Date(endTime)
                    : new Date();

            const diff =
                Math.floor(
                    (end - start) / 1000
                );

            const m =
                Math.floor(diff / 60);

            const s =
                diff % 60;

            return `${m}분 ${s}초 경과`;

        }


        /* =====================================================
           상태별 카드 클래스
        ====================================================== */

        function getCardClass(status) {

            if (status === "사고처리완료") {
                return "card done";
            }

            if (status === "현장도착") {
                return "card arrived";
            }

            return "card received";

        }


        /* =====================================================
           상태 표시
        ====================================================== */

        function getStatusHTML(status) {

            if (status === "사고처리완료") {

                return `
                    <div class="status done">
                        ⚪ 사고처리완료
                    </div>
                `;

            }


            if (status === "현장도착") {

                return `
                    <div class="status arrived">
                        🚑 현장도착
                    </div>
                `;

            }


            return `
                <div class="status received">
                    🔴 사고 접수
                </div>
            `;

        }


        /* =====================================================
           상태별 마커 색상
        ====================================================== */

        function getMarkerColor(status) {

            /* 사고처리완료 = 회색 */

            if (status === "사고처리완료") {
                return "#777777";
            }


            /* 현장도착 = 주황색 */

            if (status === "현장도착") {
                return "#fb8c00";
            }


            /* 접수 = 빨간색 */

            return "#e53935";

        }


        /* =====================================================
           카카오맵 커스텀 마커
        ====================================================== */

        function createMarkerImage(status) {

            const color =
                getMarkerColor(status);


            const svg = `

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="40"
                    height="40"
                    viewBox="0 0 40 40"
                >

                    <g
                        transform="translate(20 20) rotate(-45)"
                    >

                        <circle
                            cx="0"
                            cy="0"
                            r="17"
                            fill="${color}"
                            stroke="white"
                            stroke-width="3"
                        />

                        <circle
                            cx="0"
                            cy="0"
                            r="6"
                            fill="white"
                        />

                    </g>

                </svg>

            `;


            return new kakao.maps.MarkerImage(

                "data:image/svg+xml;charset=utf-8," +
                encodeURIComponent(svg),

                new kakao.maps.Size(
                    40,
                    40
                ),

                {

                    offset:
                        new kakao.maps.Point(
                            20,
                            40
                        )

                }

            );

        }


        /* =====================================================
           3분 초과 체크
        ====================================================== */

        function checkOverdue(
            item,
            div
        ) {

            /* 응급환자만 */

            if (
                item.type !== "응급환자"
            ) {
                return;
            }


            /* 처리 완료는 제외 */

            if (
                item.status === "사고처리완료"
            ) {
                return;
            }


            const diffSeconds =
                Math.floor(

                    (
                        new Date()
                        -
                        new Date(item.time)
                    ) / 1000

                );


            if (
                diffSeconds >= 180
            ) {

                div.classList.add(
                    "blink"
                );


                if (
                    !alertedOverdueIds.has(item.id)
                ) {

                    alertedOverdueIds.add(
                        item.id
                    );


                    /*
                       30초마다 알림
                    */

                    const interval =
                        setInterval(

                            () => {

                                if (
                                    div.classList.contains("done")
                                    ||
                                    item.status === "사고처리완료"
                                ) {

                                    clearInterval(
                                        interval
                                    );

                                    alertedOverdueIds.delete(
                                        item.id
                                    );

                                    return;

                                }


                                const alertSound =
                                    document.getElementById(
                                        "alertSound"
                                    );


                                alertSound.currentTime = 0;

                                alertSound.play()
                                    .catch(
                                        () => {}
                                    );

                            },

                            30000

                        );


                    /*
                       최초 알림
                    */

                    const alertSound =
                        document.getElementById(
                            "alertSound"
                        );


                    alertSound.currentTime = 0;

                    alertSound.play()
                        .catch(
                            () => {}
                        );

                }

            }

        }


        /* =====================================================
           현장도착 처리
        ====================================================== */

        async function completeCase(id) {

            if (
                !confirm(
                    "구조대원이 현장에 도착했습니까?"
                )
            ) {

                return;

            }


            try {

                await fetch(

                    API_URL,

                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "text/plain;charset=utf-8"
                        },

                        body:
                            JSON.stringify({

                                action: "complete",

                                id: id,

                                completeTime:
                                    new Date().toISOString()

                            })

                    }

                );


                loadData();

            }

            catch (err) {

                console.error(err);

                alert(
                    "현장도착 처리 중 오류가 발생했습니다."
                );

            }

        }


        /* =====================================================
           사고처리 완료
        ====================================================== */

        async function finishCase(id) {

            if (
                !confirm(
                    "사고처리를 완료하시겠습니까?"
                )
            ) {

                return;

            }


            try {

                await fetch(

                    API_URL,

                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "text/plain;charset=utf-8"
                        },

                        body:
                            JSON.stringify({

                                action: "finish",

                                id: id,

                                finishTime:
                                    new Date().toISOString()

                            })

                    }

                );


                loadData();

            }

            catch (err) {

                console.error(err);

                alert(
                    "사고처리 완료 중 오류가 발생했습니다."
                );

            }

        }


        /* =====================================================
           사고 목록 불러오기
        ====================================================== */

        async function loadData() {

            try {

                const res =
                    await fetch(
                        API_URL +
                        "?action=list"
                    );


                const data =
                    await res.json();


                listArea.innerHTML = "";


                /* -------------------------------------------------
                   기존 마커 제거
                ------------------------------------------------- */

                markers.forEach(
                    marker =>
                        marker.setMap(null)
                );


                markers = [];


                /* -------------------------------------------------
                   사고가 없을 때
                ------------------------------------------------- */

                if (
                    !data.length
                ) {

                    listArea.innerHTML =
                        "현재 접수된 신고가 없습니다.";

                    return;

                }


                /* =================================================
                   신규 신고 알림
                ================================================= */

                if (
                    firstLoad
                ) {

                    data.forEach(
                        item =>
                            knownIds.add(
                                item.id
                            )
                    );


                    firstLoad = false;

                }

                else {

                    data.forEach(
                        item => {

                            if (
                                !knownIds.has(
                                    item.id
                                )
                            ) {

                                knownIds.add(
                                    item.id
                                );


                                alert(
                                    "🚨 새로운 신고 접수!"
                                );


                                const alertSound =
                                    document.getElementById(
                                        "alertSound"
                                    );


                                alertSound.currentTime = 0;

                                alertSound.play()
                                    .catch(
                                        () => {}
                                    );

                            }

                        }
                    );

                }


                /* =================================================
                   최신 신고가 위로
                ================================================= */

                data.sort(

                    (a, b) =>
                        new Date(b.time)
                        -
                        new Date(a.time)

                );


                /* =================================================
                   사고 데이터 처리
                ================================================= */

                data.forEach(
                    item => {


                        /* -----------------------------------------
                           카드 생성
                        ----------------------------------------- */

                        const div =
                            document.createElement(
                                "div"
                            );


                        div.className =
                            getCardClass(
                                item.status
                            );


                        div.setAttribute(
                            "data-time",
                            item.time
                        );


                        if (
                            item.finishTime
                        ) {

                            div.setAttribute(
                                "data-finish-time",
                                item.finishTime
                            );

                        }


                        /* -----------------------------------------
                           사고 카드 내용
                        ----------------------------------------- */

                        div.innerHTML = `

                            <!-- 접수시간 -->

                            <div class="time">

                                🕒 접수:
                                ${
                                    new Date(
                                        item.time
                                    ).toLocaleString()
                                }

                            </div>


                            <!-- 경과시간 -->

                            <div
                                class="time elapsed"
                            >

                                ⏱
                                ${
                                    getElapsedTime(
                                        item.time,
                                        item.finishTime
                                    )
                                }

                            </div>


                            <!-- 현재 상태 -->

                            ${getStatusHTML(
                                item.status
                            )}


                            <!-- 현장도착 시간 -->

                            ${
                                item.status === "현장도착"

                                ?

                                `

                                <div class="time">

                                    🚑 현장도착:

                                    ${
                                        item.completeTime
                                        ?
                                        new Date(
                                            item.completeTime
                                        ).toLocaleString()
                                        :
                                        ""
                                    }

                                </div>

                                `

                                :

                                ""
                            }


                            <!-- 사고처리 완료 시간 -->

                            ${
                                item.status === "사고처리완료"

                                ?

                                `

                                <div class="time">

                                    ⚪ 사고처리 완료:

                                    ${
                                        item.finishTime
                                        ?
                                        new Date(
                                            item.finishTime
                                        ).toLocaleString()
                                        :
                                        ""
                                    }

                                </div>

                                `

                                :

                                ""
                            }


                            <!-- 사고 정보 -->

                            🏠
                            ${item.address || "주소없음"}

                            <br>


                            📞
                            ${item.phone || "번호없음"}

                            <br>


                            📝
                            ${item.symptom || "내용없음"}

                            <br>


                            <!-- 좌표 -->

                            <div class="coord">

                                위도:
                                ${item.lat}

                                /

                                경도:
                                ${item.lng}

                            </div>


                            <!-- 지도 링크 -->

                            <a

                                class="maplink"

                                href="
                                https://map.kakao.com/link/map/구조요청 위치,${item.lat},${item.lng}
                                "

                                target="_blank"

                            >

                                📍 지도보기

                            </a>

                            <br>


                            <!-- 상태별 버튼 -->

                            ${
                                item.status === "사고처리완료"

                                ?

                                ""

                                :

                                item.status === "현장도착"

                                ?

                                `

                                <button

                                    class="complete-btn"

                                    onclick="
                                        finishCase('${item.id}')
                                    "

                                >

                                    ✅ 사고처리 완료

                                </button>

                                `

                                :

                                `

                                <button

                                    class="complete-btn"

                                    onclick="
                                        completeCase('${item.id}')
                                    "

                                >

                                    🚑 구조대원 현장도착

                                </button>

                                `

                            }

                        `;


                        listArea.appendChild(
                            div
                        );


                        /* -----------------------------------------
                           3분 초과 체크
                        ----------------------------------------- */

                        checkOverdue(
                            item,
                            div
                        );


                        /* =================================================
                           지도 마커
                        ================================================= */

                        if (
                            item.lat &&
                            item.lng
                        ) {

                            const lat =
                                Number(
                                    item.lat
                                );


                            const lng =
                                Number(
                                    item.lng
                                );


                            if (
                                !Number.isFinite(lat)
                                ||
                                !Number.isFinite(lng)
                            ) {

                                return;

                            }


                            const position =
                                new kakao.maps.LatLng(
                                    lat,
                                    lng
                                );


                            /* -----------------------------------------
                               상태별 마커 이미지
                            ----------------------------------------- */

                            const markerImage =
                                createMarkerImage(
                                    item.status
                                );


                            /* -----------------------------------------
                               마커 생성
                            ----------------------------------------- */

                            const marker =
                                new kakao.maps.Marker({

                                    map: map,

                                    position: position,

                                    title:
                                        item.symptom ||
                                        "사고 신고",

                                    image:
                                        markerImage

                                });


                            markers.push(
                                marker
                            );


                            /* =================================================
                               지도 팝업 상태
                            ================================================= */

                            let statusClass =
                                "map-status-red";

                            let statusText =
                                "🔴 사고 접수";


                            if (
                                item.status === "현장도착"
                            ) {

                                statusClass =
                                    "map-status-orange";

                                statusText =
                                    "🚑 현장도착";

                            }


                            if (
                                item.status === "사고처리완료"
                            ) {

                                statusClass =
                                    "map-status-gray";

                                statusText =
                                    "⚪ 사고처리완료";

                            }


                            /* -----------------------------------------
                               지도 팝업
                            ----------------------------------------- */

                            const infoContent = `

                                <div style="
                                    padding:12px;
                                    color:#222;
                                    font-family:Arial;
                                    font-size:13px;
                                    min-width:230px;
                                ">


                                    <div style="
                                        font-weight:bold;
                                        font-size:15px;
                                        margin-bottom:5px;
                                    ">

                                        🆘 산악사고 신고

                                    </div>


                                    <div style="
                                        display:inline-block;
                                        padding:5px 10px;

                                        background:${
                                            item.status === "사고처리완료"
                                                ? "#777777"
                                                : item.status === "현장도착"
                                                    ? "#ef6c00"
                                                    : "#d50000"
                                        };

                                        color:white;
                                        border-radius:5px;
                                        font-weight:bold;
                                        margin:5px 0 8px 0;
                                    ">

                                        ${statusText}

                                    </div>


                                    <div style="
                                        line-height:1.7;
                                    ">


                                        🕒 접수:

                                        ${
                                            new Date(
                                                item.time
                                            ).toLocaleString()
                                        }

                                        <br>


                                        ${
                                            item.status === "현장도착"

                                            ?

                                            `

                                            🚑 현장도착:

                                            ${
                                                item.completeTime
                                                ?
                                                new Date(
                                                    item.completeTime
                                                ).toLocaleString()
                                                :
                                                ""
                                            }

                                            <br>

                                            `

                                            :

                                            ""
                                        }


                                        ${
                                            item.status === "사고처리완료"

                                            ?

                                            `

                                            ⚪ 사고처리 완료:

                                            ${
                                                item.finishTime
                                                ?
                                                new Date(
                                                    item.finishTime
                                                ).toLocaleString()
                                                :
                                                ""
                                            }

                                            <br>

                                            `

                                            :

                                            ""
                                        }


                                        🚨 종류:

                                        ${
                                            item.type ||
                                            "응급환자"
                                        }

                                        <br>


                                        🏠 위치:

                                        ${
                                            item.address ||
                                            "주소없음"
                                        }

                                        <br>


                                        📞 전화:

                                        ${
                                            item.phone ||
                                            "번호없음"
                                        }

                                        <br>


                                        📝 내용:

                                        ${
                                            item.symptom ||
                                            "내용없음"
                                        }

                                        <br>


                                        📍 좌표:

                                        ${lat.toFixed(6)},
                                        ${lng.toFixed(6)}

                                    </div>


                                    <div style="
                                        margin-top:8px;
                                    ">

                                        <a

                                            href="
                                            https://map.kakao.com/link/map/구조요청 위치,${lat},${lng}
                                            "

                                            target="_blank"

                                            style="
                                                color:#1976d2;
                                                text-decoration:none;
                                                font-weight:bold;
                                            "

                                        >

                                            📍 카카오맵에서 보기

                                        </a>

                                    </div>


                                </div>

                            `;


                            const infowindow =
                                new kakao.maps.InfoWindow({

                                    content:
                                        infoContent,

                                    removable:
                                        true

                                });


                            /* -----------------------------------------
                               핀 클릭
                            ----------------------------------------- */

                            kakao.maps.event.addListener(

                                marker,

                                "click",

                                function() {

                                    infowindow.open(
                                        map,
                                        marker
                                    );

                                }

                            );

                        }

                    }
                );

            }

            catch (err) {

                console.error(err);

                listArea.innerHTML =
                    "구글시트 로딩 실패. 콘솔 확인";

            }

        }


        /* =====================================================
           최초 실행
        ====================================================== */

        loadData();


        /* =====================================================
           10초마다 사고 목록 갱신
        ====================================================== */

        setInterval(
            loadData,
            10000
        );


        /* =====================================================
           경과시간 1초마다 갱신
        ====================================================== */

        setInterval(

            () => {

                document
                    .querySelectorAll(".card")
                    .forEach(

                        card => {

                            const elapsedEl =
                                card.querySelector(
                                    ".time.elapsed"
                                );


                            const timeAttr =
                                card.getAttribute(
                                    "data-time"
                                );


                            const finishTimeAttr =
                                card.getAttribute(
                                    "data-finish-time"
                                );


                            if (
                                !elapsedEl ||
                                !timeAttr
                            ) {

                                return;

                            }


                            elapsedEl.innerText =
                                "⏱ " +
                                getElapsedTime(
                                    timeAttr,
                                    finishTimeAttr
                                );

                        }

                    );

            },

            1000

        );

    </script>


    <!-- =====================================================
         우클릭 및 개발자도구 단축키 방지
    ====================================================== -->

    <script>

        document.addEventListener(
            "contextmenu",
            function(e) {

                e.preventDefault();

                return false;

            }
        );


        document.addEventListener(
            "keydown",
            function(e) {


                /* F12 */

                if (
                    e.key === "F12"
                ) {

                    e.preventDefault();

                    return false;

                }


                /* Ctrl + U */

                if (
                    e.ctrlKey &&
                    e.key.toLowerCase() === "u"
                ) {

                    e.preventDefault();

                    return false;

                }


                /* Ctrl + Shift + I */

                if (
                    e.ctrlKey &&
                    e.shiftKey &&
                    e.key.toLowerCase() === "i"
                ) {

                    e.preventDefault();

                    return false;

                }


                /* Ctrl + Shift + J */

                if (
                    e.ctrlKey &&
                    e.shiftKey &&
                    e.key.toLowerCase() === "j"
                ) {

                    e.preventDefault();

                    return false;

                }


                /* Ctrl + Shift + C */

                if (
                    e.ctrlKey &&
                    e.shiftKey &&
                    e.key.toLowerCase() === "c"
                ) {

                    e.preventDefault();

                    return false;

                }


                /* Ctrl + S */

                if (
                    e.ctrlKey &&
                    e.key.toLowerCase() === "s"
                ) {

                    e.preventDefault();

                    return false;

                }

            }
        );

    </script>


</body>

</html>

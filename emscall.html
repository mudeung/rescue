<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산 특수구조팀 실시간 산악사고 신고접수</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;transition:0.2s;cursor:pointer;}
.card.done{opacity:0.6;background:#2b2b2b;}
.time{color:#ffcc00;font-size:14px;}
.coord{font-size:12px;color:#aaa;}
.maplink{color:#4fc3f7;font-size:12px;text-decoration:none;}
.maplink:hover{text-decoration:underline;}
.complete-btn{background:#2e7d32;margin-top:6px;color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;}
.complete-btn:hover{opacity:0.8;}

/* 깜빡임 애니메이션 */
@keyframes blinkEmergency{
0%{box-shadow:0 0 5px #ff1744;}
50%{box-shadow:0 0 20px #ff1744;}
100%{box-shadow:0 0 5px #ff1744;}
}
.card.blink{animation:blinkEmergency 1s infinite;}
</style>
</head>

<body>

<header>🆘 무등산 특수구조팀 실시간 산악사고 신고접수</header>

<audio id="alertSound">
  <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<div class="container">
<div id="listArea">로딩중...</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbybwt7-vC5W8NUmve94LLsdlIRFHoiw3wcIrWk9GZFRHnmZJ_0TEsihhz7oX8al_BYR_A/exec";
const alertedOverdueIds = new Set(); // 10분 경과 알림 트래킹

/******** 🚑 현장도착 ********/
async function completeCase(id){
  if(!confirm("구조대원이 현장에 도착했습니까?")) return;
  try{
    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify({action:"complete",id:id,completeTime:new Date().toISOString()})
    });
    loadData();
  }catch(err){ alert("처리 실패"); console.error(err); }
}

/******** ✅ 사고처리 완료 ********/
async function finishCase(id){
  if(!confirm("사고처리를 완료하시겠습니까?")) return;
  try{
    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify({action:"finish",id:id,finishTime:new Date().toISOString()})
    });
    loadData();
  }catch(err){ alert("처리 실패"); console.error(err); }
}

/******** 경과시간 계산 (완료 시점까지 멈춤) ********/
function getElapsedTime(startTime, endTime=null){
  const start = new Date(startTime);
  const end = endTime ? new Date(endTime) : new Date();
  const diff = Math.floor((end - start)/1000);
  const m = Math.floor(diff/60);
  const s = diff%60;
  return `${m}분 ${s}초 경과`;
}

/******** 목록 불러오기 ********/
async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();
  const listArea=document.getElementById("listArea");
  listArea.innerHTML="";
  if(!data.length){ listArea.innerHTML="현재 접수된 신고가 없습니다."; return; }

  data.sort((a,b)=>new Date(b.time)-new Date(a.time));

  data.forEach(item=>{
    const div=document.createElement("div");
    div.className="card"+(item.status==="사고처리완료"?" done":"");
    div.setAttribute("data-time", item.time);
    if(item.finishTime) div.setAttribute("data-finish-time", item.finishTime);
    if(item.type === "응급환자") div.setAttribute("data-type", "응급환자");

    div.innerHTML=`
      <div class="time">🕒 접수: ${new Date(item.time).toLocaleString()}</div>
      ${item.status==="현장도착"? `<div class="time">🚑 현장도착: ${item.completeTime ? new Date(item.completeTime).toLocaleString() : ""}</div>` : ""}
      ${item.status==="사고처리완료"? `<div class="time">🚑 현장도착: ${item.completeTime ? new Date(item.completeTime).toLocaleString() : ""}</div>
         <div class="time">✅ 사고처리 완료: ${item.finishTime ? new Date(item.finishTime).toLocaleString() : ""}</div>` : ""}
      <div class="time elapsed">⏱ ${getElapsedTime(item.time, item.finishTime)}</div>
      🏠 ${item.address||"주소없음"}<br>
      📞 ${item.phone||"번호없음"}<br>
      📝 ${item.symptom||"내용없음"}<br>
      ${
        item.status==="사고처리완료"
        ? ""
        : item.status==="현장도착"
          ? `<button class="complete-btn" onclick="finishCase('${item.id}')">✅ 사고처리 완료</button>`
          : `<button class="complete-btn" onclick="completeCase('${item.id}')">🚑 구조대원 현장도착</button>`
      }
    `;
    listArea.appendChild(div);
  });
}

/******** 경과시간 갱신 + 응급환자 10분 초과 알림 + 카드 깜빡임 ********/
setInterval(()=>{
  document.querySelectorAll(".card").forEach(card=>{
    const elapsedEl = card.querySelector(".time.elapsed");
    const timeAttr = card.getAttribute("data-time");
    const finishTimeAttr = card.getAttribute("data-finish-time");
    const typeAttr = card.getAttribute("data-type");
    if(!elapsedEl || !timeAttr) return;

    // 경과시간 갱신
    elapsedEl.innerText = "⏱ " + getElapsedTime(timeAttr, finishTimeAttr);

    // 응급환자 10분 초과 체크
    if(typeAttr === "응급환자" && !finishTimeAttr){
      const diffSec = Math.floor((new Date() - new Date(timeAttr))/1000);
      if(diffSec >= 600 && !alertedOverdueIds.has(card)){
        alertedOverdueIds.add(card);
        card.classList.add("blink"); // 카드 깜빡임

        const interval = setInterval(()=>{
          if(card.classList.contains("done")){
            clearInterval(interval);
            alertedOverdueIds.delete(card);
            card.classList.remove("blink");
            return;
          }
          document.getElementById("alertSound").play();
        },30000); // 30초마다 알림
      }
    }
  });
},1000);

loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

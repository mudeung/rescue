<script>

/* =====================================================
   API
===================================================== */

const API_URL =
    "https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


/* =====================================================
   지도 변수
===================================================== */

let map = null;

let markerLayer = null;

let markerSource = null;

let markers = [];

let openedInfoWindow = null;


/* =====================================================
   DOM
===================================================== */

const listArea =
    document.getElementById("listArea");


/* =====================================================
   신고 관리
===================================================== */

let knownIds =
    new Set();

let alertedOverdueIds =
    new Set();

let overdueIntervals =
    new Map();

let firstLoad =
    true;


/* =====================================================
   지도 초기화
===================================================== */

function initMap() {

    if (
        typeof vw === "undefined" ||
        typeof ol === "undefined" ||
        typeof vw.ol3 === "undefined"
    ) {

        throw new Error(
            "VWorld 지도 라이브러리가 로딩되지 않았습니다."
        );
    }


    vw.ol3.MapOptions = {

        basemapType:
            vw.ol3.BasemapType.GRAPHIC,

        controlDensity:
            vw.ol3.DensityType.FULL,

        interactionDensity:
            vw.ol3.DensityType.BASIC,

        controlsAutoArrange:
            true,

        homePosition:
            vw.ol3.CameraPosition,

        initPosition:
            vw.ol3.CameraPosition
    };


    map =
        new vw.ol3.Map(
            "map",
            vw.ol3.MapOptions
        );


    if (!map) {

        throw new Error(
            "VWorld 지도 객체 생성 실패"
        );
    }


    /*
     * 무등산
     */

    const center =
        ol.proj.transform(

            [
                126.9902,
                35.1345
            ],

            "EPSG:4326",

            "EPSG:3857"
        );


    map.getView()
        .setCenter(center);


    /*
     * 처음에는 넓게 표시
     */

    map.getView()
        .setZoom(13);


    /*
     * 마커 전용 레이어
     */

    markerSource =
        new ol.source.Vector();


    markerLayer =
        new ol.layer.Vector({

            source:
                markerSource
        });


    markerLayer.set(
        "rescueMarkerLayer",
        true
    );


    map.addLayer(
        markerLayer
    );


    console.log(
        "VWorld 지도 초기화 완료"
    );
}


/* =====================================================
   상태 통일
===================================================== */

function normalizeStatus(status) {

    const value =
        String(status || "")
            .trim()
            .toUpperCase();


    if (

        value === "DONE" ||

        value === "완료" ||

        value === "처리완료" ||

        value === "사고처리완료"

    ) {

        return "사고처리완료";
    }


    if (

        value === "ARRIVED" ||

        value === "도착" ||

        value === "현장도착"

    ) {

        return "현장도착";
    }


    return "사고접수";
}


/* =====================================================
   경과시간
===================================================== */

function getElapsedTime(
    startTime,
    endTime = null
) {

    if (!startTime) {

        return "시간 정보 없음";
    }


    const start =
        new Date(startTime);


    const end =
        endTime
            ? new Date(endTime)
            : new Date();


    if (
        Number.isNaN(
            start.getTime()
        )
    ) {

        return "시간 정보 오류";
    }


    const diff =
        Math.max(

            0,

            Math.floor(

                (end - start) / 1000
            )
        );


    const h =
        Math.floor(
            diff / 3600
        );


    const m =
        Math.floor(
            (diff % 3600) / 60
        );


    const s =
        diff % 60;


    if (h > 0) {

        return (
            `${h}시간 ` +
            `${m}분 ` +
            `${s}초 경과`
        );
    }


    return (
        `${m}분 ` +
        `${s}초 경과`
    );
}


/* =====================================================
   마커 색상
===================================================== */

function getMarkerColor(status) {

    const normalized =
        normalizeStatus(status);


    if (
        normalized ===
        "사고처리완료"
    ) {

        return "#777";
    }


    if (
        normalized ===
        "현장도착"
    ) {

        return "#fb8c00";
    }


    return "#e53935";
}


/* =====================================================
   마커 스타일
===================================================== */

function createMarkerStyle(
    status
) {

    const color =
        getMarkerColor(status);


    return new ol.style.Style({

        image:
            new ol.style.Circle({

                radius: 12,

                fill:
                    new ol.style.Fill({

                        color:
                            color
                    }),

                stroke:
                    new ol.style.Stroke({

                        color:
                            "#fff",

                        width: 3
                    })
            })
    });
}


/* =====================================================
   좌표 변환
===================================================== */

function toMapCoordinate(
    lat,
    lng
) {

    return ol.proj.transform(

        [
            Number(lng),
            Number(lat)
        ],

        "EPSG:4326",

        "EPSG:3857"
    );
}


/* =====================================================
   팝업
===================================================== */

function createInfoWindow(
    item,
    lat,
    lng
) {

    const status =
        normalizeStatus(
            item.status
        );


    let statusColor =
        "#e53935";


    let statusText =
        "🔴 사고 접수";


    if (
        status ===
        "현장도착"
    ) {

        statusColor =
            "#fb8c00";

        statusText =
            "🟠 현장도착";
    }


    if (
        status ===
        "사고처리완료"
    ) {

        statusColor =
            "#777";

        statusText =
            "⚪ 사고처리완료";
    }


    const popup =
        document.createElement(
            "div"
        );


    popup.className =
        "vworld-popup";


    popup.innerHTML = `

        <button
            class="vworld-popup-close"
            type="button"
        >
            ×
        </button>


        <div
            style="
                font-size:16px;
                font-weight:bold;
                margin-bottom:8px;
            "
        >

            🆘 산악사고 신고

        </div>


        <div
            style="
                display:inline-block;
                padding:5px 10px;
                background:${statusColor};
                color:#fff;
                border-radius:5px;
                font-weight:bold;
                margin-bottom:8px;
            "
        >

            ${statusText}

        </div>


        <br>


        🚨 <b>신고유형</b>

        <br>

        ${item.type || "미입력"}


        <br><br>


        🕒 <b>접수시간</b>

        <br>

        ${
            item.time
                ? new Date(
                    item.time
                  ).toLocaleString()
                : "시간없음"
        }


        <br><br>


        ⏱ <b>경과시간</b>

        <br>

        ${
            getElapsedTime(
                item.time,
                item.finishTime
            )
        }


        <br><br>


        📝 <b>상황</b>

        <br>

        ${item.symptom || "내용없음"}


        <br><br>


        🏠 <b>주소</b>

        <br>

        ${item.address || "주소없음"}


        <br><br>


        📞 <b>연락처</b>

        <br>

        ${item.phone || "번호없음"}


        <br><br>


        📍 <b>좌표</b>

        <br>

        ${lat.toFixed(6)},
        ${lng.toFixed(6)}


        ${
            item.completeTime
                ? `

                    <br><br>

                    🚑 <b>현장도착</b>

                    <br>

                    ${
                        new Date(
                            item.completeTime
                        ).toLocaleString()
                    }

                `
                : ""
        }


        ${
            item.finishTime
                ? `

                    <br><br>

                    ⚪ <b>사고처리 완료</b>

                    <br>

                    ${
                        new Date(
                            item.finishTime
                        ).toLocaleString()
                    }

                `
                : ""
        }


        <br>


        <button
            type="button"
            class="vworld-map-btn"
        >
            📍 이 위치로 이동
        </button>

    `;


    popup
        .querySelector(
            ".vworld-popup-close"
        )
        .addEventListener(
            "click",
            function() {

                closeInfoWindow();
            }
        );


    popup
        .querySelector(
            ".vworld-map-btn"
        )
        .addEventListener(
            "click",
            function() {

                moveToLocation(
                    lat,
                    lng
                );
            }
        );


    return popup;
}


/* =====================================================
   팝업 닫기
===================================================== */

function closeInfoWindow() {

    if (
        openedInfoWindow &&
        map
    ) {

        map.removeOverlay(
            openedInfoWindow
        );
    }


    openedInfoWindow =
        null;
}


/* =====================================================
   위치 이동
===================================================== */

function moveToLocation(
    lat,
    lng
) {

    if (!map) {
        return;
    }


    const coordinate =
        toMapCoordinate(
            lat,
            lng
        );


    map.getView()
        .setCenter(
            coordinate
        );


    /*
     * 50m 근접 신고 확인이
     * 가능하도록 충분히 확대
     */

    map.getView()
        .setZoom(17);
}


/* =====================================================
   마커 생성
===================================================== */

function createMarker(
    item,
    lat,
    lng
) {

    const coordinate =
        toMapCoordinate(
            lat,
            lng
        );


    const feature =
        new ol.Feature({

            geometry:
                new ol.geom.Point(
                    coordinate
                ),

            rescueId:
                String(item.id),

            rescueItem:
                item
        });


    feature.setStyle(
        createMarkerStyle(
            item.status
        )
    );


    markerSource.addFeature(
        feature
    );


    markers.push({

        feature:
            feature,

        item:
            item
    });
}


/* =====================================================
   마커 전체 삭제
===================================================== */

function clearMarkers() {

    if (!markerSource) {
        return;
    }


    markerSource.clear();


    markers = [];


    closeInfoWindow();
}


/* =====================================================
   지도 클릭
===================================================== */

function registerMapClick() {

    map.on(
        "singleclick",
        function(evt) {

            let clickedFeature =
                null;


            map.forEachFeatureAtPixel(

                evt.pixel,

                function(feature) {

                    clickedFeature =
                        feature;

                    return true;
                },

                {
                    hitTolerance: 8
                }
            );


            if (!clickedFeature) {

                closeInfoWindow();

                return;
            }


            const item =
                clickedFeature.get(
                    "rescueItem"
                );


            if (!item) {
                return;
            }


            const coordinate =
                clickedFeature
                    .getGeometry()
                    .getCoordinates();


            closeInfoWindow();


            const lat =
                Number(item.lat);


            const lng =
                Number(item.lng);


            const popupElement =
                createInfoWindow(
                    item,
                    lat,
                    lng
                );


            const overlay =
                new ol.Overlay({

                    element:
                        popupElement,

                    positioning:
                        "bottom-center",

                    stopEvent:
                        true,

                    offset:
                        [0, -12]
                });


            overlay.setPosition(
                coordinate
            );


            map.addOverlay(
                overlay
            );


            openedInfoWindow =
                overlay;
        }
    );


    map.on(
        "pointermove",
        function(evt) {

            const hit =
                map.hasFeatureAtPixel(
                    evt.pixel,
                    {
                        hitTolerance: 8
                    }
                );


            map.getTargetElement()
                .style.cursor =
                    hit
                        ? "pointer"
                        : "";
        }
    );
}


/* =====================================================
   마커 전체가 보이도록 지도 자동맞춤
===================================================== */

function fitAllMarkers() {

    if (
        !map ||
        !markers.length
    ) {
        return;
    }


    const extent =
        ol.extent.createEmpty();


    markers.forEach(
        function(marker) {

            const geometry =
                marker.feature
                    .getGeometry();


            ol.extent.extend(

                extent,

                geometry.getExtent()
            );
        }
    );


    if (
        ol.extent.isEmpty(
            extent
        )
    ) {

        return;
    }


    /*
     * 마커 주변에 여유 공간 추가
     *
     * 이렇게 하면 서로 가까운
     * 신고 위치도 화면 안에 들어온다.
     */

    const bufferedExtent =
        ol.extent.buffer(
            extent,
            50
        );


    map.getView()
        .fit(

            bufferedExtent,

            {

                padding: [
                    100,
                    100,
                    100,
                    100
                ],

                /*
                 * 너무 멀리 축소되지 않도록 제한
                 */

                maxZoom: 17,

                duration: 500
            }
        );
}


/* =====================================================
   3분 초과 응급환자
===================================================== */

function clearOverdueTimer(id) {

    if (
        overdueIntervals.has(
            id
        )
    ) {

        clearInterval(
            overdueIntervals.get(id)
        );


        overdueIntervals.delete(
            id
        );
    }
}


function checkOverdue(
    item,
    div
) {

    const status =
        normalizeStatus(
            item.status
        );


    if (
        item.type !==
        "응급환자"
    ) {

        return;
    }


    if (
        status ===
        "사고처리완료"
    ) {

        div.classList.remove(
            "blink"
        );


        clearOverdueTimer(
            item.id
        );


        alertedOverdueIds.delete(
            item.id
        );


        return;
    }


    const start =
        new Date(
            item.time
        );


    if (
        Number.isNaN(
            start.getTime()
        )
    ) {

        return;
    }


    const diffSeconds =
        Math.floor(

            (
                new Date() -
                start
            ) / 1000
        );


    if (
        diffSeconds < 180
    ) {

        return;
    }


    div.classList.add(
        "blink"
    );


    if (
        alertedOverdueIds.has(
            item.id
        )
    ) {

        return;
    }


    alertedOverdueIds.add(
        item.id
    );


    const playAlert =
        function() {

            const sound =
                document.getElementById(
                    "alertSound"
                );


            if (!sound) {
                return;
            }


            sound.currentTime =
                0;


            sound.play()
                .catch(
                    function() {}
                );
        };


    playAlert();


    const interval =
        setInterval(
            playAlert,
            30000
        );


    overdueIntervals.set(
        item.id,
        interval
    );
}

/* =====================================================
   신고 목록 로딩
===================================================== */

async function loadData() {

    try {

        const response =
            await fetch(

                API_URL +
                "?action=list&_=" +
                Date.now(),

                {
                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !Array.isArray(data)
        ) {

            throw new Error(
                "서버 응답 형식 오류"
            );
        }


        /*
         * 기존 마커 삭제
         */

        clearMarkers();


        listArea.innerHTML =
            "";


        /*
         * 신고 없음
         */

        if (
            data.length === 0
        ) {

            listArea.innerHTML = `

                <div class="card">

                    현재 접수된 신고가 없습니다.

                </div>

            `;

            return;
        }


        /*
         * 신규 신고
         */

        if (firstLoad) {

            data.forEach(
                function(item) {

                    knownIds.add(
                        String(item.id)
                    );
                }
            );


            firstLoad =
                false;

        }
        else {

            data.forEach(
                function(item) {

                    const id =
                        String(item.id);


                    if (
                        !knownIds.has(
                            id
                        )
                    ) {

                        knownIds.add(
                            id
                        );


                        alert(
                            "🚨 새로운 신고 접수!"
                        );


                        const sound =
                            document.getElementById(
                                "alertSound"
                            );


                        if (sound) {

                            sound.currentTime =
                                0;


                            sound.play()
                                .catch(
                                    function() {}
                                );
                        }
                    }
                }
            );
        }


        /*
         * 최신순
         */

        data.sort(
            function(a,b) {

                return (

                    new Date(b.time) -
                    new Date(a.time)

                );
            }
        );


        /*
         * 목록 생성
         */

        data.forEach(
            function(item) {

                const status =
                    normalizeStatus(
                        item.status
                    );


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "card";


                if (
                    status ===
                    "사고처리완료"
                ) {

                    div.classList.add(
                        "done"
                    );
                }


                div.setAttribute(
                    "data-time",
                    item.time || ""
                );


                div.setAttribute(
                    "data-id",
                    item.id
                );


                if (
                    item.finishTime
                ) {

                    div.setAttribute(

                        "data-finish-time",

                        item.finishTime
                    );
                }


                /*
                 * 상태
                 */

                let statusHTML =
                    "";


                if (
                    status ===
                    "사고처리완료"
                ) {

                    statusHTML = `

                        <div class="status done">

                            ⚪ 사고처리완료

                        </div>

                    `;

                }
                else if (
                    status ===
                    "현장도착"
                ) {

                    statusHTML = `

                        <div class="status arrived">

                            🟠 현장도착

                        </div>

                    `;

                }
                else {

                    statusHTML = `

                        <div class="status received">

                            🔴 사고 접수

                        </div>

                    `;
                }


                /*
                 * 현장도착
                 */

                let completeHTML =
                    "";


                if (
                    item.completeTime
                ) {

                    completeHTML = `

                        <div class="time">

                            🚑 현장도착:

                            ${
                                new Date(
                                    item.completeTime
                                ).toLocaleString()
                            }

                        </div>

                    `;
                }


                /*
                 * 완료
                 */

                let finishHTML =
                    "";


                if (
                    item.finishTime
                ) {

                    finishHTML = `

                        <div class="time">

                            ✅ 사고처리 완료:

                            ${
                                new Date(
                                    item.finishTime
                                ).toLocaleString()
                            }

                        </div>

                    `;
                }


                /*
                 * 처리 버튼
                 */

                let actionHTML =
                    "";


                if (
                    status ===
                    "사고처리완료"
                ) {

                    actionHTML = `

                        <span
                            style="
                                display:inline-block;
                                margin-top:8px;
                                color:#aaa;
                                font-weight:bold;
                            "
                        >

                            ✔ 처리완료

                        </span>

                    `;

                }
                else if (
                    status ===
                    "현장도착"
                ) {

                    actionHTML = `

                        <button
                            class="complete-btn"
                            onclick="
                                finishCase('${item.id}')
                            "
                        >

                            ✅ 사고처리 완료

                        </button>

                    `;

                }
                else {

                    actionHTML = `

                        <button
                            class="complete-btn"
                            onclick="
                                completeCase('${item.id}')
                            "
                        >

                            🚑 구조대원 현장도착

                        </button>

                    `;
                }


                /*
                 * 카드
                 */

                div.innerHTML = `

                    <div class="time">

                        🕒 접수:

                        ${
                            item.time
                                ? new Date(
                                    item.time
                                  ).toLocaleString()
                                : ""
                        }

                    </div>


                    <div class="time elapsed">

                        ⏱

                        ${
                            getElapsedTime(
                                item.time,
                                item.finishTime
                            )
                        }

                    </div>


                    ${statusHTML}


                    ${completeHTML}


                    ${finishHTML}


                    <div
                        style="
                            margin-top:5px;
                            font-size:15px;
                            font-weight:bold;
                            color:#ff5252;
                        "
                    >

                        🚨
                        ${item.type || "미입력"}

                    </div>


                    <br>


                    🏠
                    ${item.address || "주소없음"}


                    <br><br>


                    📞
                    ${item.phone || "번호없음"}


                    <br><br>


                    📝
                    ${item.symptom || "내용없음"}


                    <div class="coord">

                        위도:
                        ${item.lat}

                        /

                        경도:
                        ${item.lng}

                    </div>


                    <a
                        class="maplink"
                        onclick="
                            moveToLocation(
                                ${Number(item.lat)},
                                ${Number(item.lng)}
                            )
                        "
                    >

                        📍 지도에서 위치 보기

                    </a>


                    <br>


                    ${actionHTML}


                    <br>


                    <button
                        class="edit-btn"
                        onclick='editCase(${JSON.stringify(item)})'
                    >

                        ✏️ 수정

                    </button>


                    <button
                        class="delete-btn"
                        onclick="
                            deleteCase('${item.id}')
                        "
                    >

                        🗑 삭제

                    </button>

                `;


                listArea.appendChild(
                    div
                );


                /*
                 * 응급환자
                 */

                checkOverdue(
                    item,
                    div
                );


                /*
                 * 좌표
                 */

                const lat =
                    Number(item.lat);


                const lng =
                    Number(item.lng);


                if (

                    Number.isFinite(lat) &&

                    Number.isFinite(lng) &&

                    lat >= -90 &&

                    lat <= 90 &&

                    lng >= -180 &&

                    lng <= 180

                ) {

                    createMarker(
                        item,
                        lat,
                        lng
                    );
                }

            }
        );


        /*
         * 마커 전체 보기
         */

        fitAllMarkers();

    }
    catch (err) {

        console.error(
            "신고 데이터 로딩 오류:",
            err
        );


        listArea.innerHTML = `

            <div class="card">

                <span
                    style="
                        color:#ff5252;
                        font-weight:bold;
                    "
                >

                    ❌ 구글시트 로딩 실패

                </span>


                <br><br>


                잠시 후 다시 시도해주세요.


                <br><br>


                ${err.message || ""}

            </div>

        `;
    }
}

/* =====================================================

===================================================== */

setInterval(
    function() {

        document
            .querySelectorAll(
                ".card"
            )
            .forEach(
                function(card) {

                    const elapsed =
                        card.querySelector(
                            ".elapsed"
                        );


                    const time =
                        card.getAttribute(
                            "data-time"
                        );


                    const finishTime =
                        card.getAttribute(
                            "data-finish-time"
                        );


                    if (
                        !elapsed ||
                        !time
                    ) {

                        return;
                    }


                    elapsed.innerText =
                        "⏱ " +
                        getElapsedTime(
                            time,
                            finishTime
                        );
                }
            );

    },
    1000
);


/* =====================================================
   우클릭 방지
===================================================== */

document.addEventListener(
    "contextmenu",
    function(e) {

        e.preventDefault();

    }
);


/* =====================================================
   단축키 방지
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "F12"
        ) {

            e.preventDefault();

            return;
        }


        if (
            e.ctrlKey &&
            e.key.toLowerCase() === "u"
        ) {

            e.preventDefault();

            return;
        }


        if (
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "i"
        ) {

            e.preventDefault();

            return;
        }


        if (
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "j"
        ) {

            e.preventDefault();

            return;
        }


        if (
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "c"
        ) {

            e.preventDefault();

            return;
        }


        if (
            e.ctrlKey &&
            e.key.toLowerCase() === "s"
        ) {

            e.preventDefault();

            return;
        }

    }
);

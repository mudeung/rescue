<script>

/* =====================================================
   API 설정
====================================================== */

const API_URL =
    "https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


/* =====================================================
   지도 변수
====================================================== */

let map = null;

let markers = [];

let openedInfoWindow = null;

let openedMarker = null;


/* =====================================================
   DOM
====================================================== */

const listArea =
    document.getElementById(
        "listArea"
    );


/* =====================================================
   신고 관리
====================================================== */

let knownIds =
    new Set();

let alertedOverdueIds =
    new Set();

let overdueIntervals =
    new Map();

let firstLoad =
    true;


/* =====================================================
   지도 초기화
====================================================== */

function initMap() {

    if (

        typeof vw === "undefined" ||

        typeof ol === "undefined" ||

        typeof vw.ol3 === "undefined"

    ) {

        throw new Error(
            "VWorld 지도 라이브러리가 로딩되지 않았습니다."
        );
    }


    /* =================================================
       VWorld 지도 옵션
    ================================================= */

    vw.ol3.MapOptions = {

        basemapType:
            vw.ol3.BasemapType.GRAPHIC,

        controlDensity:
            vw.ol3.DensityType.FULL,

        interactionDensity:
            vw.ol3.DensityType.BASIC,

        controlsAutoArrange:
            true,

        homePosition:
            vw.ol3.CameraPosition,

        initPosition:
            vw.ol3.CameraPosition
    };


    /* =================================================
       지도 생성
    ================================================= */

    map =
        new vw.ol3.Map(
            "map",
            vw.ol3.MapOptions
        );


    if (!map) {

        throw new Error(
            "VWorld 지도 객체 생성에 실패했습니다."
        );
    }


    /* =================================================
       무등산 초기 위치
       
       경도:
       126.9902

       위도:
       35.1345
    ================================================= */

    const initialCenter =
        ol.proj.transform(

            [
                126.9902,
                35.1345
            ],

            "EPSG:4326",

            "EPSG:3857"
        );


    map.getView()
        .setCenter(
            initialCenter
        );


    /* =================================================
       ★ 최초 확대
       
       Zoom 18
       
       약 50m 수준의
       상세 지도 화면
    ================================================= */

    map.getView()
        .setZoom(18);


    console.log(
        "VWorld 지도 초기화 완료"
    );
}


/* =====================================================
   상태 통일
====================================================== */

function normalizeStatus(status) {

    const value =
        String(status || "")
            .trim()
            .toUpperCase();


    if (

        value === "DONE" ||

        value === "완료" ||

        value === "처리완료" ||

        value === "사고처리완료"

    ) {

        return "사고처리완료";
    }


    if (

        value === "ARRIVED" ||

        value === "도착" ||

        value === "현장도착"

    ) {

        return "현장도착";
    }


    return "사고접수";
}


/* =====================================================
   경과시간
====================================================== */

function getElapsedTime(
    startTime,
    endTime = null
) {

    if (!startTime) {

        return "시간 정보 없음";
    }


    const start =
        new Date(startTime);


    const end =
        endTime
            ? new Date(endTime)
            : new Date();


    if (
        Number.isNaN(
            start.getTime()
        )
    ) {

        return "시간 정보 오류";
    }


    const diff =
        Math.max(

            0,

            Math.floor(

                (
                    end - start
                ) / 1000
            )
        );


    const h =
        Math.floor(
            diff / 3600
        );


    const m =
        Math.floor(
            (diff % 3600) / 60
        );


    const s =
        diff % 60;


    if (h > 0) {

        return (

            `${h}시간 ` +

            `${m}분 ` +

            `${s}초 경과`

        );
    }


    return (

        `${m}분 ` +

        `${s}초 경과`

    );
}


/* =====================================================
   마커 색상
====================================================== */

function getMarkerColor(status) {

    const normalized =
        normalizeStatus(
            status
        );


    if (
        normalized ===
        "사고처리완료"
    ) {

        return "#777777";
    }


    if (
        normalized ===
        "현장도착"
    ) {

        return "#fb8c00";
    }


    return "#e53935";
}


/* =====================================================
   마커 스타일
====================================================== */

function createMarkerStyle(status) {

    const color =
        getMarkerColor(
            status
        );


    return new ol.style.Style({

        image:
            new ol.style.Circle({

                radius: 11,

                fill:
                    new ol.style.Fill({

                        color:
                            color
                    }),

                stroke:
                    new ol.style.Stroke({

                        color:
                            "#ffffff",

                        width: 3
                    })
            })
    });
}


/* =====================================================
   좌표 변환
====================================================== */

function toMapCoordinate(
    lat,
    lng
) {

    return ol.proj.transform(

        [
            Number(lng),
            Number(lat)
        ],

        "EPSG:4326",

        "EPSG:3857"
    );
}


/* =====================================================
   팝업 생성
====================================================== */

function createInfoWindow(
    item,
    lat,
    lng
) {

    const status =
        normalizeStatus(
            item.status
        );


    let statusColor =
        "#e53935";


    let statusText =
        "🔴 사고 접수";


    if (
        status ===
        "현장도착"
    ) {

        statusColor =
            "#fb8c00";

        statusText =
            "🟠 현장도착";
    }


    if (
        status ===
        "사고처리완료"
    ) {

        statusColor =
            "#777777";

        statusText =
            "⚪ 사고처리완료";
    }


    const popup =
        document.createElement(
            "div"
        );


    popup.className =
        "vworld-popup";


    popup.innerHTML = `

        <button
            class="vworld-popup-close"
            type="button"
            title="닫기"
        >
            ×
        </button>


        <div
            style="
                font-size:16px;
                font-weight:bold;
                margin-bottom:8px;
            "
        >

            🆘 산악사고 신고

        </div>


        <div
            style="
                display:inline-block;
                padding:5px 10px;
                background:${statusColor};
                color:#fff;
                border-radius:5px;
                font-weight:bold;
                margin-bottom:8px;
            "
        >

            ${statusText}

        </div>


        <br>


        🚨 <b>신고유형</b>

        <br>

        ${item.type || "미입력"}


        <br><br>


        🕒 <b>접수시간</b>

        <br>

        ${
            item.time
                ? new Date(
                    item.time
                ).toLocaleString()
                : ""
        }


        <br><br>


        ⏱ <b>경과시간</b>

        <br>

        ${
            getElapsedTime(
                item.time,
                item.finishTime
            )
        }


        <br><br>


        📝 <b>상황</b>

        <br>

        ${item.symptom || "내용없음"}


        <br><br>


        🏠 <b>주소</b>

        <br>

        ${item.address || "주소없음"}


        <br><br>


        📞 <b>연락처</b>

        <br>

        ${item.phone || "번호없음"}


        <br><br>


        📍 <b>좌표</b>

        <br>

        ${lat.toFixed(6)},
        ${lng.toFixed(6)}


        ${
            item.completeTime
                ? `

                    <br><br>

                    🚑 <b>현장도착</b>

                    <br>

                    ${
                        new Date(
                            item.completeTime
                        ).toLocaleString()
                    }

                `
                : ""
        }


        ${
            item.finishTime
                ? `

                    <br><br>

                    ⚪ <b>사고처리 완료</b>

                    <br>

                    ${
                        new Date(
                            item.finishTime
                        ).toLocaleString()
                    }

                `
                : ""
        }


        <div>

            <button
                type="button"
                class="vworld-map-btn"
            >
                📍 이 위치로 지도 이동
            </button>

        </div>

    `;


    /* =================================================
       닫기
    ================================================= */

    popup
        .querySelector(
            ".vworld-popup-close"
        )
        .addEventListener(
            "click",
            function(e) {

                e.stopPropagation();

                closeInfoWindow();
            }
        );


    /* =================================================
       지도 이동
    ================================================= */

    popup
        .querySelector(
            ".vworld-map-btn"
        )
        .addEventListener(
            "click",
            function(e) {

                e.stopPropagation();

                moveToLocation(
                    lat,
                    lng
                );
            }
        );


    return popup;
}


/* =====================================================
   팝업 닫기
====================================================== */

function closeInfoWindow() {

    if (

        openedInfoWindow &&

        map

    ) {

        map.removeOverlay(
            openedInfoWindow
        );
    }


    openedInfoWindow =
        null;


    openedMarker =
        null;
}


/* =====================================================
   특정 위치 이동
====================================================== */

function moveToLocation(
    lat,
    lng
) {

    if (!map) {

        return;
    }


    const coordinate =
        toMapCoordinate(
            lat,
            lng
        );


    map.getView()
        .setCenter(
            coordinate
        );


    /* =================================================
       위치보기는 50m 수준으로 확대
    ================================================= */

    map.getView()
        .setZoom(18);
}


/* =====================================================
   마커 생성
====================================================== */

function createMarker(
    item,
    lat,
    lng
) {

    const coordinate =
        toMapCoordinate(
            lat,
            lng
        );


    const feature =
        new ol.Feature({

            geometry:
                new ol.geom.Point(
                    coordinate
                ),

            rescueId:
                item.id,

            rescueItem:
                item
        });


    feature.setStyle(
        createMarkerStyle(
            item.status
        )
    );


    const source =
        new ol.source.Vector({

            features: [
                feature
            ]
        });


    const layer =
        new ol.layer.Vector({

            source:
                source
        });


    layer.set(
        "rescueMarkerLayer",
        true
    );


    map.addLayer(
        layer
    );


    markers.push({

        feature:
            feature,

        layer:
            layer,

        item:
            item
    });


    return feature;
}


/* =====================================================
   지도 클릭 이벤트
====================================================== */

function registerMapClick() {

    map.on(

        "singleclick",

        function(evt) {

            let clickedFeature =
                null;


            map.forEachFeatureAtPixel(

                evt.pixel,

                function(feature) {

                    clickedFeature =
                        feature;

                    return true;
                }
            );


            if (!clickedFeature) {

                closeInfoWindow();

                return;
            }


            const item =
                clickedFeature.get(
                    "rescueItem"
                );


            if (!item) {

                return;
            }


            const coordinate =
                clickedFeature
                    .getGeometry()
                    .getCoordinates();


            if (openedInfoWindow) {

                closeInfoWindow();
            }


            const lat =
                Number(
                    item.lat
                );


            const lng =
                Number(
                    item.lng
                );


            const popupElement =
                createInfoWindow(

                    item,

                    lat,

                    lng

                );


            const overlay =
                new ol.Overlay({

                    element:
                        popupElement,

                    positioning:
                        "bottom-center",

                    stopEvent:
                        true,

                    offset:
                        [0, -12]
                });


            overlay.setPosition(
                coordinate
            );


            map.addOverlay(
                overlay
            );


            openedInfoWindow =
                overlay;


            openedMarker =
                clickedFeature;
        }
    );


    /* =================================================
       마우스 포인터
    ================================================= */

    map.on(

        "pointermove",

        function(evt) {

            const hit =
                map.hasFeatureAtPixel(
                    evt.pixel
                );


            map.getTargetElement()
                .style.cursor =
                    hit
                        ? "pointer"
                        : "";
        }
    );
}


/* =====================================================
   기존 마커 제거
====================================================== */

function clearMarkers() {

    if (!map) {

        return;
    }


    markers.forEach(

        function(marker) {

            if (marker.layer) {

                map.removeLayer(
                    marker.layer
                );
            }
        }
    );


    markers = [];


    closeInfoWindow();
}


/* =====================================================
   마커 전체 표시
====================================================== */

function fitAllMarkers() {

    if (

        !map ||

        !markers.length

    ) {

        return;
    }


    /* =================================================
       마커가 1개면
       ★ 50m 수준 유지
    ================================================= */

    if (
        markers.length === 1
    ) {

        const coordinate =
            markers[0]
                .feature
                .getGeometry()
                .getCoordinates();


        map.getView()
            .setCenter(
                coordinate
            );


        map.getView()
            .setZoom(18);


        return;
    }


    /* =================================================
       마커가 2개 이상이면
       전체 마커가 보이도록 조정
    ================================================= */

    const extent =
        ol.extent.createEmpty();


    markers.forEach(

        function(marker) {

            const geometry =
                marker.feature
                    .getGeometry();


            ol.extent.extend(

                extent,

                geometry.getExtent()
            );
        }
    );


    if (
        !ol.extent.isEmpty(
            extent
        )
    ) {

        map.getView()
            .fit(

                extent,

                {

                    padding: [

                        80,
                        80,
                        80,
                        80

                    ],

                    /* =================================
                       너무 멀리 축소되지 않도록
                       최대 축소 정도 제한
                    ================================= */

                    maxZoom: 18,

                    duration: 500

                }
            );
    }
}


/* =====================================================
   응급환자 타이머 정리
====================================================== */

function clearOverdueTimer(id) {

    if (
        overdueIntervals.has(id)
    ) {

        clearInterval(

            overdueIntervals.get(
                id
            )

        );


        overdueIntervals.delete(
            id
        );
    }
}


/* =====================================================
   응급환자 3분 초과 확인
====================================================== */

function checkOverdue(
    item,
    div
) {

    const status =
        normalizeStatus(
            item.status
        );


    if (
        item.type !==
        "응급환자"
    ) {

        return;
    }


    if (
        status ===
        "사고처리완료"
    ) {

        div.classList.remove(
            "blink"
        );


        clearOverdueTimer(
            item.id
        );


        alertedOverdueIds.delete(
            item.id
        );


        return;
    }


    const start =
        new Date(
            item.time
        );


    if (
        Number.isNaN(
            start.getTime()
        )
    ) {

        return;
    }


    const diffSeconds =
        Math.floor(

            (

                new Date() -
                start

            ) / 1000

        );


    if (
        diffSeconds < 180
    ) {

        return;
    }


    div.classList.add(
        "blink"
    );


    if (
        alertedOverdueIds.has(
            item.id
        )
    ) {

        return;
    }


    alertedOverdueIds.add(
        item.id
    );


    const playAlert =
        function() {

            const alertSound =
                document.getElementById(
                    "alertSound"
                );


            if (!alertSound) {

                return;
            }


            alertSound.currentTime =
                0;


            alertSound
                .play()
                .catch(
                    function() {}
                );
        };


    playAlert();


    const interval =
        setInterval(

            playAlert,

            30000

        );


    overdueIntervals.set(

        item.id,

        interval

    );
}


/* =====================================================
   현장도착
====================================================== */

async function completeCase(id) {

    if (
        !confirm(
            "구조대원이 현장에 도착했습니까?"
        )
    ) {

        return;
    }


    try {

        const response =
            await fetch(

                API_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "complete",

                            id:
                                id

                        })
                }
            );


        const result =
            await response.json();


        if (
            result.result !==
            "success"
        ) {

            alert(

                result.message ||

                "현장도착 처리에 실패했습니다."

            );


            return;
        }


        clearOverdueTimer(
            id
        );


        await loadData();

    }

    catch (err) {

        console.error(err);


        alert(
            "현장도착 처리 중 오류가 발생했습니다."
        );
    }
}

/* =====================================================
   신고 목록 로딩
====================================================== */

async function loadData() {

    try {

        const res =
            await fetch(

                API_URL +
                "?action=list",

                {

                    cache:
                        "no-store"
                }
            );


        const data =
            await res.json();


        if (
            !Array.isArray(data)
        ) {

            throw new Error(
                "서버 응답 형식이 올바르지 않습니다."
            );
        }


        listArea.innerHTML =
            "";


        /* =================================================
           기존 마커 제거
        ================================================= */

        clearMarkers();


        /* =================================================
           신고 없음
        ================================================= */

        if (!data.length) {

            listArea.innerHTML = `

                <div class="card">

                    현재 접수된 신고가 없습니다.

                </div>

            `;


            /* ===============================
               지도 기본 위치 유지
            ================================ */

            if (map) {

                const initialCenter =
                    ol.proj.transform(

                        [
                            126.9902,
                            35.1345
                        ],

                        "EPSG:4326",

                        "EPSG:3857"
                    );


                map.getView()
                    .setCenter(
                        initialCenter
                    );


                map.getView()
                    .setZoom(18);
            }


            return;
        }


        /* =================================================
           신규 신고 확인
        ================================================= */

        if (firstLoad) {

            data.forEach(

                function(item) {

                    knownIds.add(
                        item.id
                    );
                }
            );


            firstLoad =
                false;

        }

        else {

            data.forEach(

                function(item) {

                    if (
                        !knownIds.has(
                            item.id
                        )
                    ) {

                        knownIds.add(
                            item.id
                        );


                        alert(
                            "🚨 새로운 신고 접수!"
                        );


                        const alertSound =
                            document.getElementById(
                                "alertSound"
                            );


                        if (alertSound) {

                            alertSound.currentTime =
                                0;


                            alertSound
                                .play()
                                .catch(
                                    function() {}
                                );
                        }
                    }
                }
            );
        }


        /* =================================================
           최신순 정렬
        ================================================= */

        data.sort(

            function(a, b) {

                return (

                    new Date(b.time) -

                    new Date(a.time)

                );
            }
        );


        /* =================================================
           신고 출력
        ================================================= */

        data.forEach(

            function(item) {

                const status =
                    normalizeStatus(
                        item.status
                    );


                /* =========================================
                   카드
                ========================================== */

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "card" +

                    (

                        status ===
                        "사고처리완료"

                            ? " done"

                            : ""

                    );


                div.setAttribute(
                    "data-time",
                    item.time || ""
                );


                if (
                    item.finishTime
                ) {

                    div.setAttribute(

                        "data-finish-time",

                        item.finishTime

                    );
                }


                /* =========================================
                   상태
                ========================================== */

                let statusHTML =
                    "";


                if (
                    status ===
                    "사고처리완료"
                ) {

                    statusHTML = `

                        <div class="status done">

                            ⚪ 사고처리완료

                        </div>

                    `;

                }

                else if (
                    status ===
                    "현장도착"
                ) {

                    statusHTML = `

                        <div class="status arrived">

                            🟠 현장도착

                        </div>

                    `;

                }

                else {

                    statusHTML = `

                        <div class="status received">

                            🔴 사고 접수

                        </div>

                    `;
                }


                /* =========================================
                   현장도착 시간
                ========================================== */

                let completeHTML =
                    "";


                if (
                    item.completeTime
                ) {

                    completeHTML = `

                        <div class="time">

                            🚑 현장도착:

                            ${
                                new Date(
                                    item.completeTime
                                ).toLocaleString()
                            }

                        </div>

                    `;
                }


                /* =========================================
                   사고처리 완료 시간
                ========================================== */

                let finishHTML =
                    "";


                if (
                    item.finishTime
                ) {

                    finishHTML = `

                        <div class="time">

                            ✅ 사고처리 완료:

                            ${
                                new Date(
                                    item.finishTime
                                ).toLocaleString()
                            }

                        </div>

                    `;
                }


                /* =========================================
                   버튼
                ========================================== */

                let buttonHTML =
                    "";


                if (
                    status ===
                    "사고처리완료"
                ) {

                    buttonHTML = `

                        <span
                            style="
                                display:inline-block;
                                margin-top:8px;
                                color:#aaa;
                                font-weight:bold;
                            "
                        >

                            ✔ 처리완료

                        </span>

                    `;

                }

                else if (
                    status ===
                    "현장도착"
                ) {

                    buttonHTML = `

                        <button

                            class="complete-btn"

                            onclick="
                                finishCase('${item.id}')
                            "

                        >

                            ✅ 사고처리 완료

                        </button>

                    `;

                }

                else {

                    buttonHTML = `

                        <button

                            class="complete-btn"

                            onclick="
                                completeCase('${item.id}')
                            "

                        >

                            🚑 구조대원 현장도착

                        </button>

                    `;
                }


                /* =========================================
                   카드 내용
                ========================================== */

                div.innerHTML = `

                    <div class="time">

                        🕒 접수:

                        ${
                            item.time
                                ? new Date(
                                    item.time
                                ).toLocaleString()
                                : ""
                        }

                    </div>


                    <div class="time elapsed">

                        ⏱

                        ${
                            getElapsedTime(
                                item.time,
                                item.finishTime
                            )
                        }

                    </div>


                    ${statusHTML}


                    ${completeHTML}


                    ${finishHTML}


                    <div
                        style="
                            margin-top:5px;
                            font-size:15px;
                            font-weight:bold;
                            color:#ff5252;
                        "
                    >

                        🚨

                        ${item.type || "미입력"}

                    </div>


                    <br>


                    🏠

                    ${item.address || "주소없음"}


                    <br><br>


                    📞

                    ${item.phone || "번호없음"}


                    <br><br>


                    📝

                    ${item.symptom || "내용없음"}


                    <div class="coord">

                        위도:

                        ${item.lat}

                        /

                        경도:

                        ${item.lng}

                    </div>


                    <a

                        class="maplink"

                        onclick="
                            moveToLocation(
                                ${Number(item.lat)},
                                ${Number(item.lng)}
                            )
                        "

                    >

                        📍 지도에서 위치 보기

                    </a>


                    <br>


                    ${buttonHTML}

                `;


                listArea.appendChild(
                    div
                );


                /* =========================================
                   응급환자
                ========================================== */

                checkOverdue(

                    item,

                    div

                );


                /* =========================================
                   지도 마커
                ========================================== */

                if (

                    item.lat !==
                    undefined &&

                    item.lat !==
                    null &&

                    item.lng !==
                    undefined &&

                    item.lng !==
                    null

                ) {

                    const lat =
                        Number(
                            item.lat
                        );


                    const lng =
                        Number(
                            item.lng
                        );


                    if (

                        Number.isFinite(
                            lat
                        ) &&

                        Number.isFinite(
                            lng
                        ) &&

                        lat >= -90 &&

                        lat <= 90 &&

                        lng >= -180 &&

                        lng <= 180

                    ) {

                        createMarker(

                            item,

                            lat,

                            lng

                        );
                    }
                }

            }
        );


        /* =================================================
           마커 전체 표시
        ================================================= */

        fitAllMarkers();

    }

    catch (err) {

        console.error(

            "신고 데이터 로딩 오류:",

            err

        );


        listArea.innerHTML = `

            <div class="card">

                <span
                    style="
                        color:#ff5252;
                        font-weight:bold;
                    "
                >

                    구글시트 로딩 실패

                </span>


                <br><br>


                잠시 후 다시 시도해주세요.


                <br><br>


                오류:

                ${err.message || err}

            </div>

        `;
    }
}


/* =====================================================
   애플리케이션 시작
====================================================== */

async function startApplication() {

    try {

        /* =============================================
           VWorld 확인
        ============================================== */

        if (

            typeof vw === "undefined" ||

            typeof ol === "undefined" ||

            typeof vw.ol3 === "undefined"

        ) {

            throw new Error(
                "VWorld API가 로딩되지 않았습니다."
            );
        }


        /* =============================================
           지도 초기화
        ============================================== */

        initMap();


        /* =============================================
           지도 클릭
        ============================================== */

        registerMapClick();


        /* =============================================
           신고 데이터
        ============================================== */

        await loadData();

    }

    catch (err) {

        console.error(

            "VWorld 지도 초기화 오류:",

            err

        );


        document.getElementById(
            "map"
        ).innerHTML = `

            <div class="map-error">

                <div>

                    <div
                        style="
                            font-size:18px;
                            font-weight:bold;
                            margin-bottom:12px;
                        "
                    >

                        ❌ VWorld 지도 로딩 실패

                    </div>


                    <div>

                        ${err.message || err}

                    </div>


                    <br>


                    <div
                        style="
                            color:#ccc;
                            font-size:13px;
                        "
                    >

                        다음 항목을 확인해주세요.

                        <br><br>

                        ① VWorld API 키의
                        허용 도메인

                        <br>

                        ② 현재 홈페이지가 HTTPS인지

                        <br>

                        ③ VWorld API 키가 유효한지

                        <br>

                        ④ 브라우저 Console 오류

                    </div>

                </div>

            </div>

        `;


        listArea.innerHTML = `

            <div class="card">

                <div
                    style="
                        color:#ff5252;
                        font-weight:bold;
                    "
                >

                    ❌ 지도 초기화에 실패했습니다.

                </div>


                <br>


                오류:

                <br><br>

                ${err.message || err}

            </div>

        `;
    }
}


/* =====================================================
   최초 실행
====================================================== */

window.addEventListener(

    "DOMContentLoaded",

    function() {

        startApplication();

    }

);


/* =====================================================
   ★ 5초마다 신고 데이터 자동 갱신
====================================================== */

setInterval(

    function() {

        if (map) {

            loadData();

        }

    },

    5000

);


/* =====================================================
   경과시간 1초 갱신
====================================================== */

setInterval(

    function() {

        document
            .querySelectorAll(".card")
            .forEach(

                function(card) {

                    const elapsedEl =
                        card.querySelector(
                            ".time.elapsed"
                        );


                    const timeAttr =
                        card.getAttribute(
                            "data-time"
                        );


                    const finishTimeAttr =
                        card.getAttribute(
                            "data-finish-time"
                        );


                    if (

                        !elapsedEl ||

                        !timeAttr

                    ) {

                        return;
                    }


                    elapsedEl.innerText =

                        "⏱ " +

                        getElapsedTime(

                            timeAttr,

                            finishTimeAttr

                        );
                }
            );

    },

    1000

);

</script>


<script>

/* =====================================================
   우클릭 방지
====================================================== */

document.addEventListener(

    "contextmenu",

    function(e) {

        e.preventDefault();

        return false;

    }

);


/* =====================================================
   단축키 방지
====================================================== */

document.addEventListener(

    "keydown",

    function(e) {

        /* F12 */

        if (
            e.key === "F12"
        ) {

            e.preventDefault();

            return false;
        }


        /* Ctrl + U */

        if (

            e.ctrlKey &&

            e.key.toLowerCase() === "u"

        ) {

            e.preventDefault();

            return false;
        }


        /* Ctrl + Shift + I */

        if (

            e.ctrlKey &&

            e.shiftKey &&

            e.key.toLowerCase() === "i"

        ) {

            e.preventDefault();

            return false;
        }


        /* Ctrl + Shift + J */

        if (

            e.ctrlKey &&

            e.shiftKey &&

            e.key.toLowerCase() === "j"

        ) {

            e.preventDefault();

            return false;
        }


        /* Ctrl + Shift + C */

        if (

            e.ctrlKey &&

            e.shiftKey &&

            e.key.toLowerCase() === "c"

        ) {

            e.preventDefault();

            return false;
        }


        /* Ctrl + S */

        if (

            e.ctrlKey &&

            e.key.toLowerCase() === "s"

        ) {

            e.preventDefault();

            return false;
        }

    }

);

</script>

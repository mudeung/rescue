<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산 특수구조팀 실시간 산악사고 신고접수</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.form-box{background:#222;padding:12px;margin-bottom:15px;border-radius:6px;}
input,textarea{width:100%;padding:8px;margin-bottom:8px;border-radius:6px;border:none;}
button{padding:8px 12px;background:#e53935;color:#fff;border:none;border-radius:4px;cursor:pointer;}
.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;}
.card.done{opacity:0.5;}
.card.emergency{border-left:6px solid #ff1744;background:#2a0f14;}
.card.help{border-left:6px solid #00e5ff;background:#0f2025;}
.card.lost{border-left:6px solid #ffea00;background:#2a2a0f;}
.card.other{border-left:6px solid #9e9e9e;}
.card.overdue{border-left:6px solid #ff0000 !important;background:#3a0000 !important;}
@keyframes blink{0%{box-shadow:0 0 5px #ff1744;}50%{box-shadow:0 0 20px #ff1744;}100%{box-shadow:0 0 5px #ff1744;}}
.card.emergency.active-blink{animation:blink 1s infinite;}
.time{color:#ffcc00;font-size:13px;}
</style>
</head>

<body>

<header>🆘 무등산 특수구조팀 실시간 산악사고 신고접수</header>

<audio id="alertSound">
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<div class="container">

<div class="form-box">
<h3>📌 신고 등록</h3>

<select id="type">
<option value="">사고유형 선택</option>
<option value="응급환자">🚑 응급환자</option>
<option value="구조출동">🚓 구조출동</option>
<option value="조난">🆘 조난</option>
<option value="기타">✏ 기타</option>
</select>

<textarea id="condition" placeholder="증상"></textarea>
<input type="text" id="phone" placeholder="연락처">
<input type="text" id="address" placeholder="주소">
<input type="number" id="lat" placeholder="위도">
<input type="number" id="lng" placeholder="경도">
<button onclick="submitData()">등록</button>
</div>

<div id="listArea">로딩중...</div>

</div>

<script>
const API_URL="YOUR_GOOGLE_SCRIPT_URL";
let alertedOverdueIds=new Set();
let previousEmergencyCount=0;

async function submitData(){
const type=document.getElementById("type").value;
if(!type){alert("유형 선택 필수");return;}

await fetch(API_URL,{
method:"POST",
headers:{ "Content-Type":"text/plain;charset=utf-8" },
body:JSON.stringify({
type:type,
lat:lat.value,
lng:lng.value,
address:address.value,
symptom:condition.value,
phone:phone.value
})
});

loadData();
}

function getElapsed(time){
const diff=Math.floor((new Date()-new Date(time))/1000);
return Math.floor(diff/60)+"분 "+(diff%60)+"초";
}

function checkOverdue(item,div){
if(item.type!=="응급환자") return;
if(item.status==="사고처리완료") return;

const diff=Math.floor((new Date()-new Date(item.time))/1000);
if(diff>=180){
div.classList.add("overdue");

if(!alertedOverdueIds.has(item.id)){
alertedOverdueIds.add(item.id);
setInterval(()=>{
if(div.classList.contains("done")) return;
document.getElementById("alertSound").play();
},30000);
}
}
}

async function loadData(){
const res=await fetch(API_URL);
let data=await res.json();
document.getElementById("listArea").innerHTML="";

data.sort((a,b)=>{
if(a.type==="응급환자"&&b.type!=="응급환자")return -1;
if(a.type!=="응급환자"&&b.type==="응급환자")return 1;
return new Date(b.time)-new Date(a.time);
});

const emergencyCount=data.filter(i=>i.type==="응급환자"&&i.status!=="사고처리완료").length;
if(emergencyCount>previousEmergencyCount)
document.getElementById("alertSound").play();
previousEmergencyCount=emergencyCount;

data.forEach(item=>{
const div=document.createElement("div");

let typeClass="other";
if(item.type==="응급환자") typeClass="emergency";
else if(item.type==="구조출동") typeClass="help";
else if(item.type==="조난") typeClass="lost";

div.className="card "+typeClass+(item.status==="사고처리완료"?" done":"");

if(item.type==="응급환자"&&item.status!=="사고처리완료")
div.classList.add("active-blink");

checkOverdue(item,div);

div.innerHTML=`
<div class="time">🕒 ${new Date(item.time).toLocaleString()}</div>
<div class="time">⏱ ${getElapsed(item.time)}</div>
📂 ${item.type}<br>
🏠 ${item.address||""}<br>
📞 ${item.phone||""}<br>
📝 ${item.symptom||""}
`;

document.getElementById("listArea").appendChild(div);
});
}

loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

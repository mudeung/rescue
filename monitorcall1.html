<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🆘 무등산 특수구조팀 실시간 산악사고 신고접수</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.form-box{background:#222;padding:12px;margin-bottom:15px;border-radius:6px;}
input,textarea{width:100%;padding:8px;margin-bottom:8px;border-radius:6px;border:none;}
button{padding:8px 12px;background:#e53935;color:#fff;border:none;border-radius:4px;cursor:pointer;}
#map{width:100%;height:320px;margin-bottom:15px;border-radius:6px;}
.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;transition:0.2s;}
.card.done{opacity:0.6;background:#2b2b2b;}
.time{color:#ffcc00;font-size:14px; margin-bottom: 4px; display:block;}

/* ===== 유형 버튼 ===== */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.type-btn{padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;color:#fff;transition:0.2s;}
.type-btn.emergency{background:#4a1c1c;}
.type-btn.dispatch{background:#1c2f4a;}
.type-btn.lost{background:#4a461c;}
.type-btn.other{background:#3a3a3a;}
.type-btn.active{outline:3px solid #fff;transform:scale(1.05);}

/* ===== 카드 색상 ===== */
.card.emergency{border-left:6px solid #ff1744;background:#2a0f14;}
.card.help{border-left:6px solid #00e5ff;background:#0f2025;}
.card.lost{border-left:6px solid #ffea00;background:#2a2a0f;}
.card.other{border-left:6px solid #9e9e9e;}

/* ===== 필터 ===== */
.filter-bar{display:flex;overflow-x:auto;gap:6px;margin-bottom:10px;}
.filter-btn{flex:0 0 auto;padding:6px 10px;border:none;border-radius:20px;background:#333;color:#fff;cursor:pointer;font-size:13px;}
.filter-btn.active{background:#e53935;}

/* ===== 응급환자 깜빡임 ===== */
@keyframes blinkEmergency{
0%{box-shadow:0 0 5px #ff1744;}
50%{box-shadow:0 0 20px #ff1744;}
100%{box-shadow:0 0 5px #ff1744;}
}
.card.emergency.active-blink{animation:blinkEmergency 1s infinite;}

/* ===== 3분 초과 ===== */
.card.overdue{
border-left:6px solid #ff0000 !important;
background:#3a0000 !important;
}

/* ===== 카드 버튼 ===== */
.card button.card-btn{
  margin-top:6px;
  margin-right:6px;
  padding:4px 8px;
  font-size:13px;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
button.complete-btn{background:#00c853;}
button.finish-btn{background:#2962ff;}
</style>
</head>

<body>

<header>🆘 무등산 특수구조팀 실시간 산악사고 신고접수</header>

<audio id="alertSound">
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<div class="container">

<div id="map"></div>

<div class="form-box">
<h3>📌 위치구조 신고요청 등록</h3>

<div class="type-grid">
<button type="button" class="type-btn emergency" data-type="응급환자">🚑 응급환자</button>
<button type="button" class="type-btn dispatch" data-type="구조출동">🚓 구조출동</button>
<button type="button" class="type-btn lost" data-type="조난">🆘 조난</button>
<button type="button" class="type-btn other" data-type="기타">✏ 기타</button>
</div>

<textarea id="condition" placeholder="증상 입력"></textarea>
<input type="text" id="phone" placeholder="연락처 입력">
<input type="text" id="address" placeholder="신고 주소 입력">
<input type="number" step="any" id="lat" placeholder="위도">
<input type="number" step="any" id="lng" placeholder="경도">
<button onclick="submitData()">구조 요청 등록</button>
</div>

<div class="filter-bar">
<button class="filter-btn active" onclick="setFilter('전체',this)">전체</button>
<button class="filter-btn" onclick="setFilter('응급환자',this)">🚑 응급환자</button>
<button class="filter-btn" onclick="setFilter('구조출동',this)">🚓 구조출동</button>
<button class="filter-btn" onclick="setFilter('조난',this)">🆘 조난</button>
<button class="filter-btn" onclick="setFilter('기타',this)">✏ 기타</button>
</div>

<div id="listArea">로딩중...</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

let map, geocoder, previewMarker=null;
let selectedType="";
let currentFilter="전체";
let alertedOverdueIds=new Set();

const conditionEl=document.getElementById("condition");
const phoneEl=document.getElementById("phone");
const addressEl=document.getElementById("address");
const latEl=document.getElementById("lat");
const lngEl=document.getElementById("lng");
const listArea=document.getElementById("listArea");

/* ===== 지도 초기화 ===== */
function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });
  geocoder=new kakao.maps.services.Geocoder();
}

/* ===== 유형 선택 ===== */
document.querySelectorAll(".type-btn").forEach(btn=>{
  btn.addEventListener("click",function(){
    document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
    this.classList.add("active");
    selectedType=this.dataset.type;
  });
});

/* ===== 등록 ===== */
async function submitData(){
  if(!selectedType){alert("사고 유형 선택 필수"); return;}
  if(!conditionEl.value.trim()){alert("증상 입력 필수"); return;}

  let lat=parseFloat(latEl.value), lng=parseFloat(lngEl.value);
  if(!lat || !lng){
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(pos=>sendData(pos.coords.latitude,pos.coords.longitude));
      return;
    } else {
      alert("위치 정보가 필요합니다.");
      return;
    }
  }
  sendData(lat,lng);
}

async function sendData(lat,lng){
  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body:JSON.stringify({
      lat,lng,
      type:selectedType,
      address:addressEl.value,
      symptom:conditionEl.value,
      phone:phoneEl.value,
      kakaoMapURL:`https://map.kakao.com/link/map/구조요청 위치,${lat},${lng}`
    })
  });

  selectedType="";
  document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
  conditionEl.value=phoneEl.value=addressEl.value=latEl.value=lngEl.value="";
  if(previewMarker) previewMarker.setMap(null);

  loadData();
}

/* ===== 주소 → 좌표 자동 입력 ===== */
addressEl.addEventListener("change",function(){
  const address=this.value.trim();
  if(!address) return;
  geocoder.addressSearch(address,function(result,status){
    if(status===kakao.maps.services.Status.OK){
      const lat=parseFloat(result[0].y);
      const lng=parseFloat(result[0].x);
      latEl.value=lat;
      lngEl.value=lng;

      const pos=new kakao.maps.LatLng(lat,lng);
      map.setCenter(pos);
      map.setLevel(3);

      if(previewMarker) previewMarker.setMap(null);
      previewMarker=new kakao.maps.Marker({ map, position:pos });
    } else alert("주소를 찾을 수 없습니다.");
  });
});

/* ===== 경과시간 계산 ===== */
function getElapsedTime(time){
  const diff=Math.floor((new Date()-new Date(time))/1000);
  const m=Math.floor(diff/60);
  const s=diff%60;
  return `${m}분 ${s}초 경과`;
}

/* ===== 3분 초과 체크 ===== */
function checkOverdue(item,div){
  if(item.type!=="응급환자") return;
  if(!item.status || item.status==="사고처리완료") return;

  const diffSeconds=Math.floor((new Date()-new Date(item.time))/1000);
  if(diffSeconds>=180){
    div.classList.add("overdue");
    if(!alertedOverdueIds.has(item.id)){
      alertedOverdueIds.add(item.id);
      const interval=setInterval(()=>{
        if(div.classList.contains("done")){
          clearInterval(interval);
          alertedOverdueIds.delete(item.id);
          return;
        }
        document.getElementById("alertSound").play();
      },30000);
    }
  }
}

/* ===== 필터 ===== */
function setFilter(type,btn){
  currentFilter=type;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  loadData();
}

/* ===== 🚑 현장도착 ===== */
async function completeCase(id){
  if(!confirm("구조대원이 현장에 도착했습니까?")) return;
  try{
    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify({action:"complete",id:id,completeTime:new Date().toISOString()})
    });
    loadData();
  }catch(err){alert("처리 실패"); console.error(err);}
}

/* ===== ✅ 사고처리 완료 ===== */
async function finishCase(id){
  if(!confirm("사고처리를 완료하시겠습니까?")) return;
  try{
    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify({action:"finish",id:id,finishTime:new Date().toISOString()})
    });
    loadData();
  }catch(err){alert("처리 실패"); console.error(err);}
}

/******** 목록 불러오기 ********/
async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();
  listArea.innerHTML="";
  if(!data.length){
    listArea.innerHTML="현재 접수된 신고가 없습니다.";
    return;
  }

  data.sort((a,b)=>new Date(b.time)-new Date(a.time));

  data.forEach(item=>{
    // 필터 적용
    if(currentFilter!=="전체" && item.type!==currentFilter) return;

    const div=document.createElement("div");
    div.className="card"+(item.status==="사고처리완료"?" done":"");
    div.setAttribute("data-time", item.time); // ★ 필수

    div.innerHTML=`
      <div class="time">🕒 접수: ${new Date(item.time).toLocaleString()}</div>
      <div class="time elapsed">⏱ ${getElapsedTime(item.time)}</div>
      ${item.status==="현장도착"? `<div class="time">🚑 현장도착: ${item.completeTime ? new Date(item.completeTime).toLocaleString() : ""}</div>` : ""}
      ${item.status==="사고처리완료"? `<div class="time">🚑 현장도착: ${item.completeTime ? new Date(item.completeTime).toLocaleString() : ""}</div><div class="time">✅ 사고처리 완료: ${item.finishTime ? new Date(item.finishTime).toLocaleString() : ""}</div>` : ""}
      🏠 ${item.address||"주소없음"}<br>
      📞 ${item.phone||"번호없음"}<br>
      📝 ${item.symptom||"내용없음"}<br>
      <div class="coord">위도: ${item.lat} / 경도: ${item.lng}</div>
      <a class="maplink" href="https://map.kakao.com/link/map/구조요청 위치,${item.lat},${item.lng}" target="_blank">📍 지도보기</a><br>
      ${item.status==="사고처리완료" ? "" : item.status==="현장도착" ? `<button class="complete-btn" onclick="finishCase('${item.id}')">✅ 사고처리 완료</button>` : `<button class="complete-btn" onclick="completeCase('${item.id}')">🚑 구조대원 현장도착</button>`}
    `;
    listArea.appendChild(div);

    checkOverdue(item,div); // 3분 초과 체크
  });
}

/* ===== 경과시간 갱신 ===== */
setInterval(()=>{
  document.querySelectorAll(".card").forEach(card=>{
    const elapsedEl = card.querySelector(".time.elapsed");
    const timeAttr = card.getAttribute("data-time");
    if(elapsedEl && timeAttr){
      elapsedEl.innerText = "⏱ " + getElapsedTime(timeAttr);
    }
  });
},1000);

/* ===== 초기 실행 ===== */
initMap();
loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body { margin:0; font-family:Arial; background:#111; color:#fff; }
header { background:#b71c1c; padding:15px; text-align:center; font-size:20px; }
.container { padding:15px; }

.form-box {
  background:#222;
  padding:12px;
  margin-bottom:15px;
  border-radius:6px;
}

input, textarea {
  width:100%;
  padding:8px;
  margin-bottom:8px;
  border-radius:4px;
  border:none;
}

button {
  width:100%;
  padding:10px;
  background:#e53935;
  color:#fff;
  border:none;
  border-radius:4px;
  font-size:16px;
  cursor:pointer;
}

#map {
  width:100%;
  height:300px;
  margin-bottom:15px;
  border-radius:6px;
}

.card {
  background:#1e1e1e;
  padding:12px;
  margin-bottom:10px;
  border-radius:6px;
}

.card.done {
  background:#2b2b2b;
  opacity:0.6;
}

.time { color:#ffcc00; font-size:14px; }
.coord { color:#90caf9; cursor:pointer; }
.maplink { color:#81c784; text-decoration:none; }
</style>
</head>

<body>

<header>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</header>

<div class="container">

  <div id="map"></div>

  <div class="form-box">
    <h3>📌 구조 요청 등록</h3>

    <textarea id="condition" placeholder="증상 입력"></textarea>
    <input type="text" id="phone" placeholder="연락처 입력">

    <!-- ✅ 주소 입력 (선택사항) -->
    <input type="text" id="address" placeholder="주소 입력 (선택사항)">

    <input type="number" step="any" id="lat" placeholder="위도 직접 입력 (선택)">
    <input type="number" step="any" id="lng" placeholder="경도 직접 입력 (선택)">

    <button onclick="submitData()">구조 요청 등록</button>
  </div>

  <div id="listArea">로딩중...</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbybwt7-vC5W8NUmve94LLsdlIRFHoiw3wcIrWk9GZFRHnmZJ_0TEsihhz7oX8al_BYR_A/exec";

let map;
let marker;
let geocoder;

/**************** 지도 초기화 ****************/
function initMap() {
  const container = document.getElementById("map");
  const options = {
    center: new kakao.maps.LatLng(35.1345, 126.9902),
    level: 5
  };
  map = new kakao.maps.Map(container, options);

  marker = new kakao.maps.Marker({
    position: map.getCenter()
  });
  marker.setMap(map);

  geocoder = new kakao.maps.services.Geocoder();
}

function moveMap(lat, lng) {
  const moveLatLng = new kakao.maps.LatLng(lat, lng);
  map.setCenter(moveLatLng);
  marker.setPosition(moveLatLng);
}

/**************** 등록 ****************/
async function submitData() {

  const condition = document.getElementById("condition").value;
  const phone = document.getElementById("phone").value;
  const address = document.getElementById("address").value;
  let lat = document.getElementById("lat").value;
  let lng = document.getElementById("lng").value;

  if (!condition) {
    alert("증상 입력 필수");
    return;
  }

  /* 1️⃣ 주소 입력했을 경우 */
  if (address) {
    geocoder.addressSearch(address, function(result, status) {
      if (status === kakao.maps.services.Status.OK) {
        const lat = result[0].y;
        const lng = result[0].x;
        sendData(lat, lng, condition, phone);
      } else {
        alert("주소 변환 실패");
      }
    });
    return;
  }

  /* 2️⃣ 좌표 직접 입력 */
  if (lat && lng) {
    sendData(parseFloat(lat), parseFloat(lng), condition, phone);
    return;
  }

  /* 3️⃣ GPS 자동 */
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(position => {
      sendData(position.coords.latitude,
               position.coords.longitude,
               condition,
               phone);
    });
  } else {
    alert("위치 정보 사용 불가");
  }
}

async function sendData(lat, lng, condition, phone) {

  const kakaoMapURL =
  `https://map.kakao.com/link/map/구조위치,${lat},${lng}`;

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ kakaoMapURL, lat, lng, condition, phone })
    });

    const result = await res.json();

    if (result.result === "success") {
      alert("등록 완료");
      moveMap(lat, lng);
      document.getElementById("condition").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("address").value = "";
      document.getElementById("lat").value = "";
      document.getElementById("lng").value = "";
      loadData();
    } else {
      alert("등록 실패");
    }

  } catch {
    alert("네트워크 오류");
  }
}

/**************** 목록 ****************/
async function loadData() {

  const res = await fetch(API_URL);
  const data = await res.json();
  const area = document.getElementById("listArea");

  area.innerHTML = "";

  data.reverse().forEach(item => {

    const div = document.createElement("div");
    div.className = "card";

    if (item.status === "조치완료") {
      div.classList.add("done");
    }

    div.innerHTML = `
      <div class="time">
        🕒 ${new Date(item.time).toLocaleString()}
      </div>

      <div class="coord"
        onclick="moveMap(${item.lat}, ${item.lng})">
        📍 ${item.lat}, ${item.lng}
      </div>

      🩺 ${item.condition || "미입력"}<br>
      📞 ${item.phone || "번호없음"}<br>
      🗺 <a class="maplink"
        href="${item.mapURL}" target="_blank">지도보기</a>
    `;

    area.appendChild(div);
  });
}

initMap();
loadData();
setInterval(loadData, 10000);

</script>
</body>
</html>

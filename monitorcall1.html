<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.form-box{background:#222;padding:12px;margin-bottom:15px;border-radius:6px;}
input,textarea{width:100%;padding:8px;margin-bottom:8px;border-radius:4px;border:none;}
button{padding:8px 12px;background:#e53935;color:#fff;border:none;border-radius:4px;cursor:pointer;}
#map{width:100%;height:320px;margin-bottom:15px;border-radius:6px;}
.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;transition:0.2s;cursor:pointer;}
.card.done{opacity:0.6;background:#2b2b2b;}
.time{color:#ffcc00;font-size:14px;}
.coord{font-size:12px;color:#aaa;}
.maplink{color:#4fc3f7;font-size:12px;text-decoration:none;}
.maplink:hover{text-decoration:underline;}
.complete-btn{background:#2e7d32;margin-top:6px;color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;}
.complete-btn:hover{opacity:0.8;}
</style>
</head>

<body>

<header>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</header>

<div class="container">

<div id="map"></div>

<div class="form-box">
  <h3>📌 위치구조 신고요청 등록</h3>
  <textarea id="condition" placeholder="증상 입력"></textarea>
  <input type="text" id="phone" placeholder="연락처 입력">
  <input type="text" id="address" placeholder="신고 주소 입력 (주소 입력 시 좌표 자동 입력)">
  <input type="number" step="any" id="lat" placeholder="위도">
  <input type="number" step="any" id="lng" placeholder="경도">
  <button onclick="submitData()">구조 요청 등록</button>
</div>

<div id="listArea">로딩중...</div>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbybwt7-vC5W8NUmve94LLsdlIRFHoiw3wcIrWk9GZFRHnmZJ_0TEsihhz7oX8al_BYR_A/exec";

let map, geocoder, previewMarker=null, selectedMarker=null, selectedCard=null;

const conditionEl=document.getElementById("condition");
const phoneEl=document.getElementById("phone");
const addressEl=document.getElementById("address");
const latEl=document.getElementById("lat");
const lngEl=document.getElementById("lng");
const listArea=document.getElementById("listArea");

/******** 지도 초기화 ********/
function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });
  geocoder=new kakao.maps.services.Geocoder();
}

/******** 주소 → 좌표 자동 입력 ********/
addressEl.addEventListener("change",function(){
  const address=this.value.trim();
  if(!address) return;
  geocoder.addressSearch(address,function(result,status){
    if(status===kakao.maps.services.Status.OK){
      const lat=parseFloat(result[0].y);
      const lng=parseFloat(result[0].x);
      latEl.value=lat;
      lngEl.value=lng;

      const pos=new kakao.maps.LatLng(lat,lng);
      map.setCenter(pos);
      map.setLevel(3);

      if(previewMarker) previewMarker.setMap(null);
      previewMarker=new kakao.maps.Marker({ map, position:pos });
    } else alert("주소를 찾을 수 없습니다.");
  });
});

/******** 등록 ********/
async function submitData(){
  if(!conditionEl.value.trim()){ alert("증상 입력 필수"); return; }
  let lat=latEl.value, lng=lngEl.value;
  if(lat && lng){ sendData(parseFloat(lat),parseFloat(lng)); return; }
  if(navigator.geolocation) navigator.geolocation.getCurrentPosition(pos=>sendData(pos.coords.latitude,pos.coords.longitude));
}

async function sendData(lat,lng){
  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body:JSON.stringify({
      lat,lng,
      address:addressEl.value,
      symptom:conditionEl.value,
      phone:phoneEl.value,
      kakaoMapURL:`https://map.kakao.com/link/map/구조요청 위치,${lat},${lng}`
    })
  });
  conditionEl.value=phoneEl.value=addressEl.value=latEl.value=lngEl.value="";
  if(previewMarker) previewMarker.setMap(null);
  loadData();
}

/******** 조치완료 처리 ********/
async function completeCase(id){
  if(!confirm("조치완료 처리하시겠습니까?")) return;
  try{
    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify({ action:"complete", id:id, completeTime: new Date().toISOString() })
    });
    loadData();
  }catch(err){ alert("처리 실패"); console.error(err); }
}

/******** 목록 불러오기 ********/
async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();
  listArea.innerHTML="";
  if(!data.length){ listArea.innerHTML="현재 접수된 신고가 없습니다."; return; }

  data.sort((a,b)=>new Date(b.time)-new Date(a.time));

  data.forEach(item=>{
    const div=document.createElement("div");
    div.className="card"+(item.status==="조치완료"?" done":"");

    div.innerHTML=`
      <div class="time">🕒 접수: ${new Date(item.time).toLocaleString()}</div>
      ${item.status==="조치완료"?`<div class="time">✅ 완료: ${item.completeTime ? new Date(item.completeTime).toLocaleString() : "시간기록없음"}</div>`:""}
      🏠 ${item.address||"주소없음"}<br>
      📞 ${item.phone||"번호없음"}<br>
      📝 ${item.symptom||"내용없음"}<br>
      <div class="coord">위도: ${item.lat} / 경도: ${item.lng}</div>
      <a class="maplink" href="https://map.kakao.com/link/map/구조요청 위치,${item.lat},${item.lng}" target="_blank">📍 지도보기</a><br>
      ${item.status==="조치완료"?"":`<button class="complete-btn" onclick="completeCase('${item.id}')">조치완료 처리</button>`}
    `;

    // 카드 클릭 시 선택 강조 + 지도 마커 표시
    div.addEventListener("click", ()=>{
      if(selectedCard) selectedCard.style.border = "none";
      if(selectedMarker) selectedMarker.setMap(null);

      div.style.border = "2px solid #ffeb3b"; // 노란 테두리
      selectedCard = div;

      const pos = new kakao.maps.LatLng(item.lat, item.lng);
      selectedMarker = new kakao.maps.Marker({ map, position: pos });
      map.setCenter(pos);
      map.setLevel(3);
    });

    listArea.appendChild(div);
  });
}

initMap();
loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

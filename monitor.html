<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;transition:0.2s;}
.card.done{background:#2b2b2b;opacity:0.6;}
.time{color:#ffcc00;font-size:14px;}
</style>
</head>

<body>

<header>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</header>

<div class="container">
  <div id="listArea">로딩중...</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbybwt7-vC5W8NUmve94LLsdlIRFHoiw3wcIrWk9GZFRHnmZJ_0TEsihhz7oX8al_BYR_A/exec";

async function loadData(){
  try{
    const res=await fetch(API_URL);
    const data=await res.json();
    const area=document.getElementById("listArea");
    area.innerHTML="";

    if(!data.length){
      area.innerHTML="현재 접수된 신고가 없습니다.";
      return;
    }

    data.sort((a,b)=>new Date(b.time)-new Date(a.time));

    data.forEach(item=>{

      const div=document.createElement("div");
      div.className="card";

      if(item.status==="조치완료"){
        div.classList.add("done");
      }

      div.innerHTML=`
        <div class="time">🕒 ${new Date(item.time).toLocaleString()}</div>
        🏠 ${item.address||"주소없음"}<br>
        📞 ${item.phone||"번호없음"}<br>
        📝 ${item.symptom||"내용없음"}<br>
        ${item.status==="조치완료" ? "✅ 조치완료" : "🚑 진행중"}
      `;

      area.appendChild(div);
    });

  }catch(err){
    document.getElementById("listArea").innerHTML="데이터 불러오기 실패";
  }
}

loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

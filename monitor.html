<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body { margin:0; font-family:Arial; background:#111; color:#fff; }
header { background:#b71c1c; padding:15px; text-align:center; font-size:20px; }
.container { padding:15px; }

button {
  padding:8px 12px;
  background:#e53935;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
}

#map {
  width:100%;
  height:350px;
  margin-bottom:15px;
  border-radius:6px;
}

.card {
  background:#1e1e1e;
  padding:12px;
  margin-bottom:10px;
  border-radius:6px;
  transition:0.2s;
}

.card.done { background:#2b2b2b; opacity:0.6; }

.card.active {
  border:2px solid #ffeb3b;
  box-shadow:0 0 10px #ffeb3b;
}

.progress-label {
  margin-top:6px;
  color:#ffeb3b;
  font-weight:bold;
}

.filter-box { margin-bottom:10px; }
</style>
</head>

<body>

<header>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</header>

<div class="container">

<div id="map"></div>

<div class="filter-box">
  <button onclick="toggleFilter()">🔎 접수중만 보기</button>
</div>

<div id="listArea">로딩중...</div>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbybwt7-vC5W8NUmve94LLsdlIRFHoiw3wcIrWk9GZFRHnmZJ_0TEsihhz7oX8al_BYR_A/exec";

let map;
let marker;
let geocoder;

function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:5
  });

  marker=new kakao.maps.Marker({ position: map.getCenter() });
  marker.setMap(map);

  geocoder=new kakao.maps.services.Geocoder();
}

function moveMap(lat,lng){
  const loc=new kakao.maps.LatLng(lat,lng);
  map.setCenter(loc);
  marker.setPosition(loc);
}

/******** 주소 → 좌표 ********/
document.getElementById("address").addEventListener("input",function(){
  const address=this.value.trim();
  if(!address) return;

  geocoder.addressSearch(address,function(result,status){
    if(status===kakao.maps.services.Status.OK){
      const lat=parseFloat(result[0].y);
      const lng=parseFloat(result[0].x);

      document.getElementById("lat").value=lat;
      document.getElementById("lng").value=lng;
      moveMap(lat,lng);
    }
  });
});

/******** 등록 ********/
async function submitData(){

  const condition=document.getElementById("condition").value;
  const phone=document.getElementById("phone").value;
  const address=document.getElementById("address").value;
  let lat=document.getElementById("lat").value;
  let lng=document.getElementById("lng").value;

  if(!condition){
    alert("증상 입력 필수");
    return;
  }

  if(lat && lng){
    sendData(parseFloat(lat),parseFloat(lng),condition,phone,address);
    return;
  }

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      sendData(
        pos.coords.latitude,
        pos.coords.longitude,
        condition,
        phone,
        address
      );
    });
  }
}

async function sendData(lat,lng,condition,phone,address){

  const kakaoMapURL=`https://map.kakao.com/link/map/구조위치,${lat},${lng}`;

  try{
    const res=await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify({
        kakaoMapURL,
        lat,
        lng,
        address,
        symptom:condition,
        phone
      })
    });

    const result=await res.json();

    if(result.result==="success"){
      alert("등록 완료");
      moveMap(lat,lng);
      document.getElementById("condition").value="";
      document.getElementById("phone").value="";
      document.getElementById("address").value="";
      document.getElementById("lat").value="";
      document.getElementById("lng").value="";
      loadData();
    }

  }catch{
    alert("네트워크 오류");
  }
}

/******** 조치완료 ********/
async function completeCase(id){

  if(!confirm("조치완료 처리하시겠습니까?")) return;

  const res=await fetch(API_URL+"?action=complete&id="+id);
  const result=await res.json();

  if(result.result==="success"){
    alert("조치완료 처리되었습니다.");
    loadData();
  }
}

/******** 목록 ********/
async function loadData(){

  try{
    const res=await fetch(API_URL);
    const data=await res.json();
    const area=document.getElementById("listArea");

    if(!data.length){
      area.innerHTML="현재 접수된 신고가 없습니다.";
      return;
    }

    area.innerHTML="";

    data.reverse().forEach(item=>{

      const div=document.createElement("div");
      div.className="card";

      if(item.status==="조치완료"){
        div.classList.add("done");
      }

      div.innerHTML=`
        <div class="time">
          🕒 접수시간: ${new Date(item.time).toLocaleString()}
        </div>

        🏠 신고주소: ${item.address || "주소없음"}<br>
        📍 위도: ${item.lat || "-"}<br>
        📍 경도: ${item.lng || "-"}<br>
        📞 ${item.phone || "번호없음"}<br>
        📝 증상: ${item.symptom || "내용없음"}<br>

        ${
          item.completedTime
          ? `<div class="time" style="color:#4caf50; margin-top:6px;">
               ✅ 처리완료시간: ${new Date(item.completedTime).toLocaleString()}
             </div>`
          : ""
        }

        <div class="status">
          ${
            item.status==="조치완료"
            ? "✅ 조치완료"
            : `<button class="complete-btn"
                 onclick="completeCase('${item.id}')">
                 조치완료
               </button>`
          }
        </div>
      `;

      area.appendChild(div);
    });

  }catch{
    document.getElementById("listArea").innerHTML="데이터 불러오기 실패";
  }
}

initMap();
loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 위치구조 등록현황</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { 
  margin:0; 
  font-family:Arial; 
  background:#111; 
  color:#fff; 
}

header { 
  background:#b71c1c; 
  padding:15px; 
  text-align:center; 
  font-size:20px; 
}

.container { 
  padding:15px; 
}

.card {
  background:#1e1e1e;
  padding:12px;
  margin-bottom:10px;
  border-radius:6px;
  transition:0.3s;
}

.card.done {
  background:#2b2b2b;
  opacity:0.6;
}

.time { 
  color:#ffcc00; 
  font-size:14px; 
}

.phone { 
  color:#4fc3f7; 
}

.maplink { 
  color:#81c784; 
  text-decoration:none; 
}

.status {
  margin-top:8px;
  font-weight:bold;
}

.symptom {
  margin-top:6px;
  color:#ff8a65;
  white-space:pre-line;
}

.address {
  margin-top:6px;
  color:#90caf9;
}
</style>
</head>

<body>

<header>🚨 무등산 특수구조팀 실시간 위치구조 등록현황</header>

<div class="container" id="listArea">
로딩중...
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbybwt7-vC5W8NUmve94LLsdlIRFHoiw3wcIrWk9GZFRHnmZJ_0TEsihhz7oX8al_BYR_A/exec";

/**************** 목록 ****************/
async function loadData() {

  try {

    const res = await fetch(API_URL);
    const data = await res.json();
    const area = document.getElementById("listArea");

    if (!data.length) {
      area.innerHTML = "현재 접수된 신고가 없습니다.";
      return;
    }

    area.innerHTML = "";

    data.reverse().forEach(item => {

      const div = document.createElement("div");
      div.className = "card";

      if (item.status === "조치완료") {
        div.classList.add("done");
      }

      div.innerHTML = `
        <div class="time">
          🕒 접수시간: ${new Date(item.time).toLocaleString()}
        </div>

        🏠 신고주소: ${item.address || "주소없음"}<br>
        📍 위도: ${item.lat || "-"}<br>
        📍 경도: ${item.lng || "-"}<br>
        📞 ${item.phone || "번호없음"}<br>
        📝 증상: ${item.symptom || "내용없음"}<br>

        ${item.completedTime ? `
          <div class="time" style="color:#4caf50; margin-top:6px;">
            ✅ 처리완료시간: ${new Date(item.completedTime).toLocaleString()}
          </div>
        ` : ""}

        <div class="status">
          ${
            item.status === "조치완료"
              ? "✅ 조치완료"
              : `<button class="complete-btn"
                   onclick="completeCase('${item.id}')">
                   조치완료
                 </button>`
          }
        </div>
      `;

      area.appendChild(div);
    });

  } catch {
    document.getElementById("listArea").innerHTML = "데이터 불러오기 실패";
  }
}

initMap();
loadData();
setInterval(loadData, 10000);
</script>
</body>
</html>

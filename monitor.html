<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 산악사고 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
button{padding:8px 12px;background:#e53935;color:#fff;border:none;border-radius:4px;cursor:pointer;}  
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;}
.card.done{background:#2b2b2b;opacity:0.6;}
.time{color:#ffcc00;font-size:14px;}
.coord{font-size:12px;color:#aaa;}
.maplink{color:#4fc3f7;font-size:13px;text-decoration:none;}
.maplink:hover{text-decoration:underline;}
.complete-btn{
  background:#2e7d32;
  margin-top:8px;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:4px;
  cursor:pointer;
}
.complete-btn:hover{opacity:0.8;}
</style>
</head>
<body>

<!-- 🔐 비밀번호 잠금 화면 -->
<div id="loginOverlay" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
flex-direction:column;
">
  <h2 style="margin-bottom:20px;">🔐 무등산 특수구조팀 접속 인증</h2>
  <input type="password" id="passwordInput" placeholder="비밀번호 입력"
    style="width:250px;padding:10px;border-radius:6px;border:none;margin-bottom:10px;">
  <button onclick="checkPassword()">접속하기</button>
  <p id="loginError" style="color:red;margin-top:10px;"></p>
</div>  

<header>🚨 무등산 특수구조팀 실시간 산악사고 신고공유</header>

<div class="container" style="display: flex; justify-content: flex-end;">
  <div>
    <button onclick="window.open('https://mudeung.github.io/rescue/ems.html', '_blank', 'noopener')">
      무등산 산악사고 기록지 바로가기
    </button>
  </div>
</div> 
  
<div class="container">
  <div id="listArea">로딩중...</div>
</div> 
  
<script>

/* ===== 🔐 비밀번호 설정 ===== */
const ACCESS_PASSWORD = "knps";  // ← 원하는 비밀번호로 변경하세요

function checkPassword(){
  const input = document.getElementById("passwordInput").value;
  const error = document.getElementById("loginError");

  if(input === ACCESS_PASSWORD){
    document.getElementById("loginOverlay").style.display="none";
    sessionStorage.setItem("authorized","true");
  } else {
    error.innerText = "❌ 비밀번호가 올바르지 않습니다.";
  }
}

/* 세션 유지 */
window.addEventListener("load",function(){
  if(sessionStorage.getItem("authorized")==="true"){
    document.getElementById("loginOverlay").style.display="none";
  }
});
  
const API_URL="https://script.google.com/macros/s/AKfycbybwt7-vC5W8NUmve94LLsdlIRFHoiw3wcIrWk9GZFRHnmZJ_0TEsihhz7oX8al_BYR_A/exec";
const listArea=document.getElementById("listArea");

/******** 🚑 현장도착 ********/
async function completeCase(id){
  if(!confirm("구조대원이 현장에 도착했습니까?")) return;
  try{
    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify({
        action:"complete",
        id:id,
        completeTime:new Date().toISOString()
      })
    });
    loadData();
  }catch(err){
    alert("처리 실패");
    console.error(err);
  }
}

/******** ✅ 사고처리 완료 ********/
async function finishCase(id){
  if(!confirm("사고처리를 완료하시겠습니까?")) return;
  try{
    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify({
        action:"finish",
        id:id,
        finishTime:new Date().toISOString()
      })
    });
    loadData();
  }catch(err){
    alert("처리 실패");
    console.error(err);
  }
}

/******** 목록 불러오기 ********/
async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();
  listArea.innerHTML="";
  if(!data.length){
    listArea.innerHTML="현재 접수된 신고가 없습니다.";
    return;
  }

  data.sort((a,b)=>new Date(b.time)-new Date(a.time));

  data.forEach(item=>{
    const div=document.createElement("div");

    // 사고처리 완료만 흐림 처리
    div.className="card"+(item.status==="사고처리완료"?" done":"");

    div.innerHTML=`
      <div class="time">🕒 접수: ${new Date(item.time).toLocaleString()}</div>

      ${item.status==="현장도착"?
        `<div class="time">🚑 현장도착: ${item.completeTime ? new Date(item.completeTime).toLocaleString() : ""}</div>`
        : ""}

      ${item.status==="사고처리완료"?
        `<div class="time">🚑 현장도착: ${item.completeTime ? new Date(item.completeTime).toLocaleString() : ""}</div>
         <div class="time">✅ 사고처리 완료: ${item.finishTime ? new Date(item.finishTime).toLocaleString() : ""}</div>`
        : ""}

      🏠 ${item.address||"주소없음"}<br>
      📞 ${item.phone||"번호없음"}<br>
      📝 ${item.symptom||"내용없음"}<br>
      <div class="coord">위도: ${item.lat} / 경도: ${item.lng}</div>
      <a class="maplink" href="https://map.kakao.com/link/map/구조요청 위치,${item.lat},${item.lng}" target="_blank">📍 지도보기</a><br>

      ${
        item.status==="사고처리완료"
        ? ""
        : item.status==="현장도착"
          ? `<button class="complete-btn" onclick="finishCase('${item.id}')">✅ 사고처리 완료</button>`
          : `<button class="complete-btn" onclick="completeCase('${item.id}')">🚑 구조대원 현장도착</button>`
      }
    `;

    listArea.appendChild(div);
  });
}

loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

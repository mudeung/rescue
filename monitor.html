<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;}
.card.done{background:#2b2b2b;opacity:0.6;}
.time{color:#ffcc00;font-size:14px;}
.coord{font-size:12px;color:#aaa;}
.maplink{color:#4fc3f7;font-size:13px;text-decoration:none;}
.maplink:hover{text-decoration:underline;}
.complete-btn{
  background:#2e7d32;
  margin-top:8px;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:4px;
  cursor:pointer;
}
.complete-btn:hover{opacity:0.8;}
</style>
</head>

<body>

<header>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</header>

<div class="container">
  <div id="listArea">로딩중...</div>
</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbybwt7-vC5W8NUmve94LLsdlIRFHoiw3wcIrWk9GZFRHnmZJ_0TEsihhz7oX8al_BYR_A/exec";

const listArea=document.getElementById("listArea");

/******** 조치완료 처리 ********/
async function completeCase(id) {

  if (!confirm("조치완료 처리하시겠습니까?")) return;

  try {
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "complete",
        id: id,
        completeTime: new Date().toISOString()
      })
    });

    alert("조치완료 처리되었습니다.");

    loadData();   // 🔥 다시 불러오기

  } catch (err) {
    alert("처리 실패");
    console.error(err);
  }
}

async/******** 조치완료 처리 ********/
async function completeCase(id){
  if(!confirm("조치완료 처리하시겠습니까?")) return;

  try{
    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify({
        action:"complete",
        id:id,
        completeTime: new Date().toISOString()
      })
    });

    loadData();
  }catch(err){
    alert("처리 실패");
    console.error(err);
  }
}

/******** 목록 불러오기 ********/
async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();
  listArea.innerHTML="";

  if(!data.length){
    listArea.innerHTML="현재 접수된 신고가 없습니다.";
    return;
  }

  data.sort((a,b)=>new Date(b.time)-new Date(a.time));

  data.forEach(item=>{
    const div=document.createElement("div");
    div.className="card"+(item.status==="조치완료"?" done":"");

    div.innerHTML=`
      <div class="time">🕒 접수: ${new Date(item.time).toLocaleString()}</div>
      ${
        item.status==="조치완료"
        ? `<div class="time">✅ 완료: ${item.completeTime ? new Date(item.completeTime).toLocaleString() : "시간기록없음"}</div>`
        : ""
      }
      🏠 ${item.address||"주소없음"}<br>
      📞 ${item.phone||"번호없음"}<br>
      📝 ${item.symptom||"내용없음"}<br>
      <div class="coord">위도: ${item.lat} / 경도: ${item.lng}</div>
      <a class="maplink" href="https://map.kakao.com/link/map/구조위치,${item.lat},${item.lng}" target="_blank">📍 지도보기</a><br>
      ${
        item.status==="조치완료"
        ? "✅ 조치완료"
        : `<button class="complete-btn" onclick="completeCase('${item.id}')">조치완료 처리</button>`
      }
    `;
    listArea.appendChild(div);
  });
}

initMap();
loadData();
setInterval(loadData,10000);

</script>

</script>

</body>
</html>

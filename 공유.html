/* =====================================================

const ACCIDENT_API_URL =

function playAlert(){

/* =====================================================
   POST
===================================================== */

async function postAccident(
    payload
){

    const response =
        await fetch(

            ACCIDENT_API_URL,

            {

                method:"POST",

                headers:{

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify(
                        payload
                    )

            }

        );


    const text =
        await response.text();


    let data;


    try{

        data =
            JSON.parse(text);

    }
    catch(e){

        data = {

            result:
                response.ok
                ? "success"
                : "error",

            message:text

        };

    }


    if(!response.ok){

        throw new Error(

            data.message ||
            "HTTP " +
            response.status

        );

    }


    return data;

}


/* =====================================================
   GET
===================================================== */

async function getAccidents(){

    const response =
        await fetch(

            ACCIDENT_API_URL +
            "?action=list&t=" +
            Date.now(),

            {

                method:"GET",

                cache:"no-store"

            }

        );


    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    if(Array.isArray(data)){

        return data;

    }


    if(
        data &&
        Array.isArray(data.data)
    ){

        return data.data;

    }


    if(
        data &&
        Array.isArray(data.items)
    ){

        return data.items;

    }


    if(
        data &&
        Array.isArray(data.rows)
    ){

        return data.rows;

    }


    return [];

}


/* =====================================================
   FIELD
===================================================== */

function getField(
    item,
    names
){

    for(
        const name of names
    ){

        if(

            item &&
            item[name] !== undefined &&
            item[name] !== null &&
            String(
                item[name]
            ).trim() !== ""

        ){

            return item[name];

        }

    }


    return "";

}


/* =====================================================
   ID
===================================================== */

function getAccidentId(
    item,
    index
){

    const value =
        getField(

            item,

            [

                "id",
                "ID",
                "caseId",
                "caseID",
                "사고ID"

            ]

        );


    if(value !== ""){

        return String(value);

    }


    const createdAt =
        getField(

            item,

            [

                "createdAt",
                "timestamp",
                "접수시간"

            ]

        );


    const address =
        getField(

            item,

            [

                "address",
                "주소"

            ]

        );


    return (

        String(createdAt) +
        "|" +
        String(address) +
        "|" +
        String(index)

    );

}


/* =====================================================
   START TIME
===================================================== */

function getStartTime(item){

    return getField(

        item,

        [

            "startTime",
            "createdAt",
            "timestamp",
            "time",
            "date",
            "접수시간"

        ]

    );

}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(
    value
){

    const status =
        String(value || "")
        .trim()
        .toUpperCase();


    if(

        status === "DONE" ||
        status === "완료" ||
        status === "처리완료" ||
        status === "사고처리완료"

    ){

        return "DONE";

    }


    if(

        status === "ARRIVED" ||
        status === "도착" ||
        status === "현장도착"

    ){

        return "ARRIVED";

    }


    return "RECEIVED";

}


/* =====================================================
   ELAPSED
===================================================== */

function getElapsedTime(
    startTime,
    endTime
){

    if(!startTime){

        return "-";

    }


    const start =
        new Date(startTime);


    if(
        Number.isNaN(
            start.getTime()
        )
    ){

        return "-";

    }


    const end =
        endTime
        ? new Date(endTime)
        : new Date();


    if(
        Number.isNaN(
            end.getTime()
        )
    ){

        return "-";

    }


    let diff =
        Math.floor(

            (
                end.getTime() -
                start.getTime()

            ) / 1000

        );


    if(diff < 0){

        diff = 0;

    }


    const hour =
        Math.floor(
            diff / 3600
        );


    diff %= 3600;


    const minute =
        Math.floor(
            diff / 60
        );


    const second =
        diff % 60;


    return (

        String(hour)
        .padStart(2,"0") +

        ":" +

        String(minute)
        .padStart(2,"0") +

        ":" +

        String(second)
        .padStart(2,"0")

    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    );

}


/* =====================================================
   ESCAPE JAVASCRIPT
===================================================== */

function escapeJS(value){

    return String(
        value ?? ""
    )

    .replace(
        /\\/g,
        "\\\\"
    )

    .replace(
        /'/g,
        "\\'"
    )

    .replace(
        /"/g,
        '\\"'
    )

    .replace(
        /\r/g,
        "\\r"
    )

    .replace(
        /\n/g,
        "\\n"
    )

    .replace(
        /<\/script/gi,
        "<\\/script"
    );

}


/* =====================================================
   카카오맵 URL
===================================================== */

function getKakaoMapURL(
    lat,
    lng,
    originalURL
){

    if(originalURL){

        return String(
            originalURL
        );

    }


    if(

        Number.isFinite(lat) &&
        Number.isFinite(lng)

    ){

        return (

            "https://map.kakao.com/link/map/" +
            encodeURIComponent("무등산 산악사고 위치") +
            "," +
            lat +
            "," +
            lng

        );

    }


    return "";

}


/* =====================================================
   ★ 카카오맵 위치 공유
===================================================== */

async function shareAccident(
    caseId,
    type,
    address,
    lat,
    lng
){

    lat =
        Number(lat);

    lng =
        Number(lng);


    const title =
        "🆘 무등산특수산악구조팀";


    /*
     * 카카오맵 위치 URL
     */

    const kakaoMapURL =

        Number.isFinite(lat) &&
        Number.isFinite(lng)

        ?

        "https://map.kakao.com/link/map/" +
        encodeURIComponent(title) +
        "," +
        lat +
        "," +
        lng

        :

        location.href;


    /*
     * 카카오톡으로 전달할 내용
     */

    const text =

        title +
        "\n" +

        "사고번호: " +
        caseId +
        "\n" +

        "유형: " +
        type +
        "\n" +

        "주소: " +
        address +
        "\n" +

        (
            Number.isFinite(lat) &&
            Number.isFinite(lng)

            ?

            "위치: " +
            lat.toFixed(6) +
            ", " +
            lng.toFixed(6)

            :

            ""
        );


    try{

        /*
         * 모바일 공유 기능
         *
         * 카카오톡이 설치되어 있으면
         * OS 공유 메뉴에서 카카오톡 선택 가능
         */

        if(
            navigator.share
        ){

            await navigator.share({

                title:title,

                text:text,

                url:kakaoMapURL

            });

            return;

        }


        /*
         * navigator.share 미지원 브라우저
         */

        const shareText =
            text +
            "\n" +
            kakaoMapURL;


        if(
            navigator.clipboard
        ){

            await navigator.clipboard.writeText(
                shareText
            );

            alert(
                "📍 카카오맵 사고 위치 정보가 복사되었습니다.\n\n카카오톡에 붙여넣어 공유하세요."
            );

        }
        else{

            prompt(

                "📍 아래 카카오맵 위치를 복사하세요.",

                shareText

            );

        }

    }
    catch(err){

        /*
         * 사용자가 공유창을 닫은 경우
         */

        if(
            err &&
            err.name === "AbortError"
        ){

            return;

        }


        console.error(
            "카카오맵 공유 오류:",
            err
        );


        alert(
            "❌ 위치 공유에 실패했습니다."
        );

    }

}


/* =====================================================

                사고번호:
            </span>

                ${escapeHTML(id)}
            </span>

        </div>


        <div class="popup-row">

            <span class="popup-label">
                신고유형:
            </span>

            <span class="popup-value">
                ${escapeHTML(type || "-")}
            </span>

        </div>


        <div class="popup-row">

            <span class="popup-label">
                사고상황:
            </span>

            <span class="popup-value">
                ${escapeHTML(symptom || "-")}
            </span>

        </div>


        <div class="popup-row">

            <span class="popup-label">
                주소:
            </span>

            <span class="popup-value">
                ${escapeHTML(address || "-")}
            </span>

        </div>


        <div class="popup-row">

            <span class="popup-label">
                연락처:
            </span>

            <span class="popup-value">
                ${escapeHTML(phone || "-")}
            </span>

        </div>


        <div class="popup-row">

            <span class="popup-label">
                접수시간:
            </span>

            <span class="popup-value">
                ${escapeHTML(startTime || "-")}
            </span>

        </div>


        <div class="popup-row">

            <span class="popup-label">
                경과시간:
            </span>

            <span class="popup-value">
                ${escapeHTML(elapsed)}
            </span>

        </div>


        ${
            endTime

            ?

            `

            <div class="popup-row">

                <span class="popup-label">
                    완료시간:
                </span>

                <span class="popup-value">
                    ${escapeHTML(endTime)}
                </span>

            </div>

            `

            :

            ""

        }


        ${
            Number.isFinite(lat) &&
            Number.isFinite(lng)

            ?

            `

            <div class="popup-row">

                <span class="popup-label">
                    위치:
                </span>

                <span class="popup-value">

                    ${lat.toFixed(6)},
                    ${lng.toFixed(6)}

                </span>

            </div>

            `

            :

            ""

        }


        <div class="popup-buttons">

            ${callHTML}

            ${mapHTML}

            ${shareHTML}

            ${actionHTML}

        </div>


        <div class="status-message">

            ${
                status === "RECEIVED"

                ?

                "🔴 구조대 출동 및 현장도착 처리가 필요합니다."

                :

                status === "ARRIVED"

                ?

                "🟠 현장도착 상태입니다. 구조 완료 후 처리하세요."

                :

                "⚫ 처리 완료된 신고입니다."

            }

        </div>

    </div>

    `;

}


/* =====================================================
   상태 변경
===================================================== */

async function updateAccidentStatus(
    caseId,
    newStatus
){

    const status =
        normalizeStatus(
            newStatus
        );


    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    let message = "";

    let action = "";


    if(
        status === "ARRIVED"
    ){

        message =
            "🚓 현장 도착으로 변경하시겠습니까?";

        action =
            "complete";

    }

    else if(
        status === "DONE"
    ){

        message =
            "✅ 구조 완료로 변경하시겠습니까?";

        action =
            "finish";

    }

    else{

        return;

    }


    if(
        !confirm(message)
    ){

        return;

    }


    try{

        const result =
            await postAccident({

                action:action,

                id:String(caseId)

            });


        if(

            !result ||
            result.result !== "success"

        ){

            throw new Error(

                result &&
                result.message

                ?

                result.message

                :

                "상태 변경 실패"

            );

        }


        await loadAccidents();


        alert(

            status === "ARRIVED"

            ?

            "🚓 현장 도착 처리 완료"

            :

            "✅ 구조 완료 처리 완료"

        );

    }
    catch(err){

        console.error(
            "상태 변경 오류:",
            err
        );


        alert(

            "❌ 상태 변경 실패\n\n" +
            err.message

        );

    }

}


/* =====================================================
   RENDER
===================================================== */

function renderAccidents(
    data
){

    let receivedCount = 0;

    let arrivedCount = 0;

    let doneCount = 0;


    data.forEach(
        function(item){

            const status =
                normalizeStatus(

                    getField(

                        item,

                        [
                            "status",
                            "state",
                            "상태",
                            "처리상태"
                        ]

                    )

                );


            if(
                status === "RECEIVED"
            ){

                receivedCount++;

            }
            else if(
                status === "ARRIVED"
            ){

                arrivedCount++;

            }
            else if(
                status === "DONE"
            ){

                doneCount++;

            }

        }
    );


    accidentCount.innerHTML =

        "🆘 사고정보 " +
        data.length +
        "건" +

        "　<span style='color:#ff3333'>" +
        "🔴 " +
        receivedCount +
        "</span>" +

        "　<span style='color:#ff9800'>" +
        "🟠 " +
        arrivedCount +
        "</span>" +

        "　<span style='color:#aaa'>" +
        "⚫ " +
        doneCount +
        "</span>";


    accidentLayer.clearLayers();


    const rows =
        [...data].sort(

            function(a,b){

                const ta =
                    new Date(
                        getStartTime(a)
                    ).getTime();


                const tb =
                    new Date(
                        getStartTime(b)
                    ).getTime();


                if(
                    Number.isNaN(ta)
                ){

                    return 1;

                }


                if(
                    Number.isNaN(tb)
                ){

                    return -1;

                }


                return tb - ta;

            }

        );


    const currentIds =
        new Set();


    rows.forEach(

        function(item,index){

            const id =
                getAccidentId(
                    item,
                    index
                );


            currentIds.add(
                String(id)
            );


            const status =
                normalizeStatus(

                    getField(

                        item,

                        [
                            "status",
                            "state",
                            "상태",
                            "처리상태"
                        ]

                    )

                );


            const startTime =
                getStartTime(item);


            const endTime =
                getField(

                    item,

                    [
                        "finishTime",
                        "endTime",
                        "completedAt",
                        "doneAt",
                        "완료시간"
                    ]

                );


            const lat =
                Number(

                    getField(

                        item,

                        [
                            "lat",
                            "latitude",
                            "위도"
                        ]

                    )

                );


            const lng =
                Number(

                    getField(

                        item,

                        [
                            "lng",
                            "longitude",
                            "경도"
                        ]

                    )

                );


            const address =
                getField(

                    item,

                    [
                        "address",
                        "주소",
                        "location",
                        "장소"
                    ]

                );


            const type =
                getField(

                    item,

                    [
                        "type",
                        "accidentType",
                        "신고유형",
                        "유형"
                    ]

                ) ||
                "기타";


            const symptom =
                getField(

                    item,

                    [
                        "symptom",
                        "condition",
                        "description",
                        "상황",
                        "내용"
                    ]

                );


            const phone =
                getField(

                    item,

                    [
                        "phone",
                        "tel",
                        "telephone",
                        "연락처"
                    ]

                );


            const kakaoOriginal =
                getField(

                    item,

                    [
                        "kakaoMapURL",
                        "kakaoUrl",
                        "mapUrl",
                        "지도URL"
                    ]

                );


            const kakaoMapURL =
                getKakaoMapURL(

                    lat,
                    lng,
                    kakaoOriginal

                );


            const elapsed =
                getElapsedTime(

                    startTime,

                    endTime || null

                );


            let statusText =
                "접수";


            let statusClass =
                "popup-received";


            if(
                status === "ARRIVED"
            ){

                statusText =
                    "현장도착";

                statusClass =
                    "popup-arrived";

            }


            if(
                status === "DONE"
            ){

                statusText =
                    "처리완료";

                statusClass =
                    "popup-done";

            }


            if(

                Number.isFinite(lat) &&
                Number.isFinite(lng)

            ){

                let markerColor =
                    "#ff0000";


                if(
                    status === "ARRIVED"
                ){

                    markerColor =
                        "#ff9800";

                }


                if(
                    status === "DONE"
                ){

                    markerColor =
                        "#777777";

                }


                const marker =
                    L.circleMarker(

                        [lat,lng],

                        {

                            radius:
                                status === "DONE"
                                ? 8
                                : 11,

                            color:
                                markerColor,

                            fillColor:
                                markerColor,

                            fillOpacity:.9,

                            weight:3

                        }

                    );


                /*
                 * 신규 사고 판단
                 */

                const isNew =
                    !firstLoad &&
                    !knownIds.has(
                        String(id)
                    );


                if(isNew){

                    playAlert();


                    setTimeout(

                        function(){

                            map.flyTo(

                                [lat,lng],

                                17,

                                {

                                    animate:true,

                                    duration:.8

                                }

                            );


                            marker.openPopup();

                        },

                        100

                    );

                }


                const popupHTML =
                    createAccidentPopup(

                        item,

                        id,

                        status,

                        statusText,

                        statusClass,

                        type,

                        symptom,

                        address,

                        phone,

                        startTime,

                        endTime,

                        elapsed,

                        lat,

                        lng,

                        kakaoMapURL

                    );


                marker.bindPopup(

                    popupHTML,

                    {

                        maxWidth:350,

                        minWidth:270,

                        className:
                            "accident-leaflet-popup"

                    }

                );


                /*
                 * 사고 핀 클릭
                 */

                marker.on(

                    "click",

                    function(){

                        map.flyTo(

                            [lat,lng],

                            Math.max(
                                map.getZoom(),
                                17
                            ),

                            {

                                animate:true,

                                duration:.8

                            }

                        );


                        marker.openPopup();

                    }

                );


                marker.addTo(
                    accidentLayer
                );

            }


            /*
             * 10분 이상 미처리
             */

            let overdue = false;


            if(

                status === "RECEIVED" &&
                startTime

            ){

                const start =
                    new Date(
                        startTime
                    ).getTime();


                if(
                    Number.isFinite(start)
                ){

                    overdue =

                        (
                            Date.now() -
                            start
                        ) / 60000 >= 10;

                }

            }


            if(

                overdue &&
                !alertedOverdueIds.has(
                    String(id)
                )

            ){

                alertedOverdueIds.add(
                    String(id)
                );


                if(!firstLoad){

                    playAlert();

                }

            }


            knownIds.add(
                String(id)
            );

        }

    );


    /*
     * 삭제된 사고 ID 정리
     */

    for(
        const oldId of knownIds
    ){

        if(
            !currentIds.has(
                String(oldId)
            )
        ){

            knownIds.delete(
                oldId
            );

        }

    }


    firstLoad = false;

}


/* =====================================================
   LOAD
===================================================== */

async function loadAccidents(){

    if(accidentLoading){

        return;

    }


    accidentLoading = true;


    try{

        const rows =
            await getAccidents();


        renderAccidents(
            rows
        );

    }
    catch(err){

        console.error(
            "사고 목록 조회 오류:",
            err
        );


        accidentCount.innerHTML =

            "⚠ 사고정보 조회 오류";

    }
    finally{

        accidentLoading = false;

    }

}


/* =====================================================
   AUTO REFRESH
===================================================== */

function startAccidentAutoRefresh(){

    if(accidentTimer){

        clearInterval(
            accidentTimer
        );

    }


    loadAccidents();


    accidentTimer =

        setInterval(

            function(){

                if(
                    !document.hidden
                ){

                    loadAccidents();

                }

            },

            5000

        );

}


/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(

    "visibilitychange",

    function(){

        if(
            !document.hidden
        ){

            loadAccidents();

        }

    }

);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

    "resize",

    function(){

        setTimeout(

            function(){

                map.invalidateSize();

            },

            100

        );

    }

);


/* =====================================================
   KEYBOARD REFRESH
===================================================== */

document.addEventListener(

    "keydown",

    function(e){

        if(

            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "r"

        ){

            e.preventDefault();

            loadAccidents();

        }

    }

);


/* =====================================================
   RIGHT CLICK
===================================================== */

document.addEventListener(

    "contextmenu",

    function(e){

        e.preventDefault();

    }

);


/* =====================================================
   INITIALIZE
===================================================== */

window.addEventListener(

    "load",

    function(){

        startAccidentAutoRefresh();


        setTimeout(

            function(){

                map.invalidateSize();

            },

            500

        );

    }

);

</script>

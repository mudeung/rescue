<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>무등산 근무현황</title>

<style>
html, body{
    height:100vh;
    margin:0;
    overflow:hidden;
    font-family:'맑은 고딕',sans-serif;
    background:#dfe4ec;
    font-size:13px;
}

body{
    padding:10px;
}

/* 제목 */
h1{
    text-align:center;
    font-size:30px;
    margin:5px 0 10px;
}

/* 🔥 상단 바 */
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    gap:10px;
}

/* 통계 */
.summary table{
    border-collapse:collapse;
    background:white;
    border:1px solid #ccc;
    font-size:12px;
}

.summary th,
.summary td{
    border:1px solid #ddd;
    padding:4px 6px;
    text-align:center;
}

/* 버튼 */
button{
    padding:8px 12px;
    font-size:12px;
    cursor:pointer;
    border:none;
    border-radius:6px;
    background:#1da1f2;
    color:white;
    box-shadow:0 3px 8px rgba(0,0,0,0.2);
}

/* 그리드 */
.container{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:6px;
}

/* 카드 */
.dept{
    background:white;
    border:1px solid #ccc;
}

/* 헤더 */
.dept-header{
    color:white;
    text-align:center;
    font-weight:bold;
    padding:6px;
    font-size:14px;
}

.blue{background:#1da1f2;}
.green{background:#8bc34a;}
.navy{background:#3f51b5;}
.red{background:#d32f2f;}

/* 테이블 */
table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:3px;
    font-size:11px;
    text-align:center;
}

input,select{
    width:100%;
    border:none;
    padding:2px;
    font-size:11px;
    text-align:center;
}

/* 상태 */
.status-work{background:#4CAF50;color:white;font-weight:bold;}
.status-holiday{background:#9E9E9E;color:white;}
.status-leave{background:#FF9800;color:white;}
.status-trip{background:#9C27B0;color:white;}
.status-edu{background:#2196F3;color:white;}
.status-child{background:#E91E63;color:white;}
.status-flex{background:#607D8B;color:white;}
</style>
</head>

<body>
    <button onclick="downloadExcel()">엑셀 다운로드</button>

<!-- 🔥 상단 대시보드 -->

            <tr><th>근무 인원</th><td id="workTotal">0명</td></tr>

</div>

<div class="container" id="wrapTop"></div>
<div class="container" id="wrapBottom"></div>

/* 상태 */
function getStatusClass(v){
switch(v){
case "근무": return "status-work";
case "휴일": return "status-holiday";
case "연가": return "status-leave";
case "출장": return "status-trip";
case "교육": return "status-edu";
case "육아": return "status-child";
case "유연": return "status-flex";
default: return "";
}
}

/* 날짜 */
function setToday(){
const now=new Date();
const week=["일","월","화","수","목","금","토"];

document.getElementById("today").innerText =
`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} (${week[now.getDay()]})`;
}

/* 업데이트 */
function departmentsUpdate(deptName,index,field,value){
const dept=departments.find(d=>d.name===deptName);
dept.employees[index][field]=value;
render();
}

function updateStatus(deptName,index,value){
const dept=departments.find(d=>d.name===deptName);
dept.employees[index].status=value;
render();
}

/* 렌더 */
function render(){
let top=document.getElementById("wrapTop");
let bottom=document.getElementById("wrapBottom");

top.innerHTML="";
bottom.innerHTML="";

const topGroups=["사무소장","행정과","자원보전과"];

departments.forEach(dept=>{
let html=`
<div class="dept">
<div class="dept-header ${dept.color}">
${dept.name} (${dept.employees.filter(e=>e.status==="근무").length})
</div>
<table>
<tr><th>직급</th><th>이름</th><th>업무</th><th>근무형태</th></tr>
`;

dept.employees.forEach((e,i)=>{
let cls=getStatusClass(e.status);

html+=`
<tr>
<td><input value="${e.grade}" onchange="departmentsUpdate('${dept.name}',${i},'grade',this.value)"></td>
<td><input value="${e.name}" onchange="departmentsUpdate('${dept.name}',${i},'name',this.value)"></td>
<td><input value="${e.work}" onchange="departmentsUpdate('${dept.name}',${i},'work',this.value)"></td>
<td>
<select class="${cls}" onchange="updateStatus('${dept.name}',${i},this.value)">
<option ${e.status==="근무"?"selected":""}>근무</option>
<option ${e.status==="휴일"?"selected":""}>휴일</option>
<option ${e.status==="연가"?"selected":""}>연가</option>
<option ${e.status==="출장"?"selected":""}>출장</option>
<option ${e.status==="교육"?"selected":""}>교육</option>
<option ${e.status==="육아"?"selected":""}>육아</option>
<option ${e.status==="유연"?"selected":""}>유연</option>
</select>
</td>
</tr>
`;
});

html+=`</table></div>`;

if(topGroups.includes(dept.name)) top.innerHTML+=html;
else bottom.innerHTML+=html;
});

calc();
}

/* 통계 */
function calc(){
let total=0,hq=0,work=0;

const hqGroup=["사무소장","행정과","자원보전과","탐방시설과","재난안전과","증심지구 현장관리"];

departments.forEach(d=>{
d.employees.forEach(e=>{
total++;
if(hqGroup.includes(d.name)) hq++;
if(e.status==="근무") work++;
});
});

document.getElementById("total").innerText=total+"명";
document.getElementById("hqTotal").innerText=hq+"명";
document.getElementById("workTotal").innerText=work+"명";
}

/* 엑셀 */
function downloadExcel(){
let now=new Date();
let dateStr=
now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,'0')+"-"+String(now.getDate()).padStart(2,'0');

let data=[];

departments.forEach(d=>{
d.employees.forEach(e=>{
data.push({
부서:d.name,
직급:e.grade,
이름:e.name,
업무:e.work,
상태:e.status
});
});
});

let ws=XLSX.utils.json_to_sheet(data);
let wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"근무현황");

XLSX.writeFile(wb,`무등산_근무현황_${dateStr}.xlsx`);
}

/* init */
setToday();
render();
</script>

<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>

}

/* ================= 상단 3분할 ================= */
.top-bar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:999;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:8px 10px;
    background:#dfe4ec;
    border-bottom:1px solid #ccc;
}

.left, .center, .right{
    flex:1;
}

.center{
    text-align:center;
}

.right{
    display:flex;
    justify-content:flex-end;
}

.title{
    font-size:26px;
    margin:0;
    font-weight:bold;
}

/* ================= 날짜 + 파일 ================= */
#fileList{
    margin-top:6px;
    font-size:11px;
}

#fileList a{
    color:#1a73e8;
    text-decoration:none;
}

/* ================= 통계 표 ================= */
.top-bar table{
    font-size:12px;
    border-collapse:collapse;
}

.top-bar th, .top-bar td{
    border:1px solid #ccc;
    padding:2px 6px;
}

/* ================= 본문 ================= */
.main{
    position:absolute;
    top:140px;
    left:0;
    right:0;
    bottom:0;
    overflow:auto;
    padding:15px;
}

/* ================= 카드 ================= */
.container{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap:6px;
}

.dept{
    background:white;
    border:1px solid #ccc;
}

.dept-header{
    color:white;
    text-align:center;

.blue{background:#1da1f2;}
.green{background:#8bc34a;}
.navy{background:#3f51b5;}

/* ================= 테이블 ================= */
table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    border:1px solid #ddd;
    font-size:11px;
    text-align:center;
}

input, select{
    width:100%;
    border:none;
    padding:4px;
    font-size:11px;
    text-align:center;
    box-sizing:border-box;

/* 상태 컬럼 넓히기 */

/* ================= LocalStorage 제어 ================= */
function saveData(){
    localStorage.setItem("mudeungsan_departments", JSON.stringify(departments));
}

function loadData(){
    const saved = localStorage.getItem("mudeungsan_departments");
    if(saved){
        departments = JSON.parse(saved);
    }
}

/* ================= 일반 첨부파일 관리 ================= */
function saveTopFile(file){
    const reader = new FileReader();
    reader.onload = function(){
        let files = JSON.parse(localStorage.getItem("top_files") || "[]");
        files.push({
            name: file.name,
            data: reader.result
        });
        localStorage.setItem("top_files", JSON.stringify(files));
        renderTopFiles();
    };
    reader.readAsDataURL(file);
}

function renderTopFiles(){
    let files = JSON.parse(localStorage.getItem("top_files") || "[]");
    document.getElementById("fileList").innerHTML =
    files.map((f, i) =>
        `📎 <a href="${f.data}" download="${f.name}">${f.name}</a>
         <button onclick="deleteTopFile(${i})" style="margin-left:5px; font-size:10px; cursor:pointer;">삭제</button><br>`
    ).join("");
}

function deleteTopFile(index){
    let files = JSON.parse(localStorage.getItem("top_files") || "[]");
    files.splice(index, 1);

    if(files.length === 0){
        localStorage.removeItem("top_files");
    } else {
        localStorage.setItem("top_files", JSON.stringify(files));
    }
    renderTopFiles();
}  

/* ================= 스타일 매칭 ================= */
function getStatusClass(v){
    switch(v){
        case "근무": return "status-work";
        case "휴일": return "status-holiday";
        case "연가":
        case "병가": return "status-leave";
        case "출장":
        case "공가": return "status-trip";
        case "교육": return "status-edu";
        case "육아": return "status-child";
        case "유연":
        case "재택": return "status-flex";
        default: return "";
    }
}

/* ================= 근무 여부 판단 ================= */
function isWorking(status){
    return ["근무","유연","재택"].includes(status);
}
    
/* ================= 상단 날짜 출력 ================= */
function setToday(){
    const now = new Date();
    const week = ["일","월","화","수","목","금","토"];
    document.getElementById("today").innerText =
    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} (${week[now.getDay()]})`;
}

/* ================= UI 생성 렌더러 ================= */
function render(){
    const wrap = document.getElementById("wrap");
    wrap.innerHTML = "";

    departments.forEach((dept, di) => {
        let html = `
        <div class="dept">
        <div class="dept-header ${dept.color}">
        ${dept.name} (${dept.employees.filter(e => isWorking(e.status)).length})
        </div>
        <table>
        <tr><th>직급</th><th>이름</th><th>업무</th><th>근무형태</th></tr>
        `;

        dept.employees.forEach((e, i) => {
            html += `
            <tr>
            <td><input value="${e.grade}" onchange="updateField(${di},${i},'grade',this.value)"></td>
            <td><input value="${e.name}" onchange="updateField(${di},${i},'name',this.value)"></td>
            <td><input value="${e.work}" onchange="updateField(${di},${i},'work',this.value)"></td>
            <td>
            <select class="${getStatusClass(e.status)}" onchange="updateStatus(${di},${i},this.value)">
            <option ${e.status==="근무"?"selected":""}>근무</option>
            <option ${e.status==="휴일"?"selected":""}>휴일</option>
            <option ${e.status==="연가"?"selected":""}>연가</option>
            <option ${e.status==="출장"?"selected":""}>출장</option>
            <option ${e.status==="교육"?"selected":""}>교육</option>
            <option ${e.status==="육아"?"selected":""}>육아</option>
            <option ${e.status==="유연"?"selected":""}>유연</option>
            <option ${e.status==="재택"?"selected":""}>재택</option>
            <option ${e.status==="병가"?"selected":""}>병가</option>
            <option ${e.status==="공가"?"selected":""}>공가</option>
            </select>
            </td>
            </tr>
            `;
        });

        html += `</table></div>`;
        wrap.innerHTML += html;
    });

    calc();
}

/* ================= 엑셀 데이터를 화면에 매칭 ================= */
function applyTodayStatus(rows){
    const today = new Date().getDate(); 
    let dateCol = -1;

    for(let r=0; r<10; r++){
        if(!rows[r]) continue;
        for(let c=0; c<rows[r].length; c++){
            const cell = String(rows[r][c] || "").trim();

if(
    Number(cell) === today ||
    cell === `${today}일`
){
                dateCol = c;
                break;
            }
        }
        if(dateCol > -1) break;
    }

    if(dateCol === -1){
        alert("엑셀 시트에서 오늘 날짜("+today+"일)에 해당하는 열을 찾지 못했습니다.");
        return;
    }
        
    departments.forEach(dept => {
        dept.employees.forEach(emp => {
            for(let r=0; r<rows.length; r++){
                if(!rows[r]) continue;
                const name = String(rows[r][2] || "").trim(); 

                if(name === emp.name){
                    const val = String(rows[r][dateCol] || "").trim();
                    emp.status = convertStatus(val); // 새로 정의된 기준 적용
                    break;
                }
            }
        });
    });

    saveData();
    render();
}  
  
/* ================= 데이터 수동 수정 관리 ================= */
function updateField(di,i,key,val){
    departments[di].employees[i][key] = val;
    saveData();
    render();
}

function updateStatus(di,i,val){
    departments[di].employees[i].status = val;
    saveData();
    render();
}

/* ================= 통계 계산기 ================= */
function calc(){
    let total=0, work=0, hq=0, wr=0;

    departments.forEach(d => {
        d.employees.forEach(e => {
            total++;
            if(isWorking(e.status)) work++;
            if(d.name === "원효분소") wr++; else hq++;
        });
    });

    document.getElementById("total").innerText = total + "명";
    document.getElementById("hqTotal").innerText = hq + "명";
    document.getElementById("wrTotal").innerText = wr + "명";
    document.getElementById("workTotal").innerText = work + "명";
}

/* ================= [수정] 기호 -> 상태 텍스트 변환 기준 변경 ================= */
function convertStatus(v){
    switch(v){
        case "○": return "휴일"; // "○" 면 휴무(휴일) 처리
        case "연": return "연가";
        case "병": return "병가";
        case "공": return "공가";
        case "교": return "교육";
        case "출": return "출장";
        case "육": return "육아";
        case "유": return "유연";
        case "재": return "재택";
        default: return "근무"; // 그 외 빈칸이나 알 수 없는 기호는 모두 "근무"로 지정
    }
}  
  
/* ================= 엑셀 파일 로드 ================= */
async function loadExcelFile(file){
    uploadedFileName = file.name;
    const data = await file.arrayBuffer();

    originalWorkbook = XLSX.read(data, {
        type: "array",
        cellStyles: true
    });

    const sheetName = originalWorkbook.SheetNames[0];
    originalSheet = originalWorkbook.Sheets[sheetName];

    const rows = XLSX.utils.sheet_to_json(originalSheet, {header:1});

    applyTodayStatus(rows);

    // ✅ 🔥 핵심 추가 (완전 강제 갱신)
    render();
    calc();
}
  
/* ================= 데이터 수정 후 다시 엑셀로 내보내기 ================= */

        return;
    }

    const rows = XLSX.utils.sheet_to_json(originalSheet, {header:1});
    const today = new Date().getDate();
    let dateCol = -1;

    for(let r=0; r<10; r++){
    if(!rows[r]) continue;

    for(let c=0; c<rows[r].length; c++){

        const cell = String(rows[r][c] || "").trim();

        if(
            Number(cell) === today ||
            cell === `${today}일`
        ){
            dateCol = c;
            break;
        }
    }

    if(dateCol > -1) break;
}
    
    if(dateCol === -1){
        alert("오늘 날짜의 열 위치를 찾을 수 없어 저장이 불가합니다.");
        return;
    }
        
    departments.forEach(dept => {
        dept.employees.forEach(emp => {
            for(let r=0; r<rows.length; r++){
                if(!rows[r]) continue;
                if(String(rows[r][2] || "").trim() === emp.name){
                    rows[r][dateCol] = excelCode(emp.status); // 변경 기준 적용
                    break;
                }
            }
        });
    });
        
    /* ================= [수정] 내보낼 때 반대로 기호 매칭 ================= */
    function excelCode(status){
        switch(status){
            case "휴일": return "○"; // 휴일(휴무) 상태일 때 엑셀에 "○" 기록
            case "연가": return "연";
            case "병가": return "병";
            case "공가": return "공";
            case "출장": return "출";
            case "교육": return "교";
            case "육아": return "육";
            case "유연": return "유";
            case "재택": return "재";
            default: return "";    // 기본값인 "근무" 상태는 빈칸(공백) 처리
        }
    }
        
    const newSheet = XLSX.utils.aoa_to_sheet(rows);

    /* 원본 구조 복사 */
    newSheet["!merges"] = originalSheet["!merges"];
    newSheet["!cols"] = originalSheet["!cols"];
    newSheet["!rows"] = originalSheet["!rows"];

    Object.keys(originalSheet).forEach(addr => {
        if(addr.startsWith("!")) return;
        if(newSheet[addr] && originalSheet[addr].s){
            newSheet[addr].s = JSON.parse(JSON.stringify(originalSheet[addr].s));
        }
    });

    originalWorkbook.Sheets[originalWorkbook.SheetNames[0]] = newSheet;
    XLSX.writeFile(originalWorkbook, "수정_" + uploadedFileName);
}

/* ================= 브라우저 초기 구동 로직 ================= */
window.onload = async function(){

    setToday();

    loadData();

    renderTopFiles();

    const fileInput = document.getElementById("topFileInput");

    if(fileInput){
        fileInput.addEventListener("change", (e) => {

            const file = e.target.files[0];
            if(!file) return;

            if(
                file.type.includes("sheet") ||
                file.name.endsWith(".xlsx") ||
                file.name.endsWith(".xls")
            ){
                uploadedFile = file;   // 🔥 저장
                loadExcelFile(file);
            }else{
                saveTopFile(file);
            }
        });
    }

    render();

    refreshAtMidnight();

    // ✅ 🔥 여기 추가 (자동 갱신 시작)
    autoReloadUploadedExcel(10000);
};

/* ================= 자동 재갱신 함수 추가 ================= */
async function autoReloadUploadedExcel(intervalMs = 10000){

    setInterval(async () => {

        if(!uploadedFile) return;

        await loadExcelFile(uploadedFile);

    }, intervalMs);
}

/* ================= 자동 로드 함수 추가 ================= */
function refreshAtMidnight(){

    const now = new Date();

    const tomorrow = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()+1,
        0,0,1
    );

    const delay = tomorrow - now;

    setTimeout(()=>{
        location.reload();
    }, delay);
}

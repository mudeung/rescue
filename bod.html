}

h1{
    text-align:center;
    font-size:60px;

}

.summary{
    position:absolute;
    right:20px;
    top:20px;

}

    width:100%;
    border-collapse:collapse;
    background:white;

.dept{

    font-weight:bold;

    font-size:20px;

.green{background:#8bc34a;}
.navy{background:#3f51b5;}
.red{background:#d32f2f;}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    font-size:15px;
    text-align:center;
}

input,select{
    width:100%;
    border:none;
    padding:6px;
    font-size:14px;
    text-align:center;

/* 상태 */

/* 버튼 */
button{
    position:fixed;
    right:20px;
    bottom:20px;
    padding:14px 18px;
    font-size:15px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    background:#1da1f2;
    color:white;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}
    /* 4번째 컬럼(근무형태)만 넓게 */
table th:nth-child(4),
table td:nth-child(4) {
    width: 180px;
    min-width: 180px;
}
</style>
</head>

/* =========================
   상태
========================= */
function getStatusClass(v){
switch(v){
case "근무": return "status-work";
case "휴일": return "status-holiday";
case "연가": return "status-leave";
case "출장": return "status-trip";
case "교육": return "status-edu";
case "육아": return "status-child";
case "유연": return "status-flex";
default: return "";
}
}

/* =========================
   날짜
========================= */
function setToday(){
const now=new Date();
const week=["일","월","화","수","목","금","토"];

document.getElementById("today").innerText =
`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} (${week[now.getDay()]})`;
}

/* =========================
   상태 변경
========================= */
function updateStatus(deptName, index, value){
const dept = departments.find(d => d.name === deptName);
dept.employees[index].status = value;
render();
}

/* =========================
   렌더
========================= */
function render(){

let top=document.getElementById("wrapTop");
let bottom=document.getElementById("wrapBottom");

top.innerHTML="";
bottom.innerHTML="";

const topGroups=["사무소장","행정과","자원보전과"];

departments.forEach(dept=>{

let html=`
<div class="dept">
<div class="dept-header ${dept.color}">
${dept.name} (${dept.employees.filter(e=>e.status==="근무").length})
</div>

<table>
<tr>
<th>직급</th>
<th>이름</th>
<th>업무</th>
<th>근무형태</th>
</tr>
`;

dept.employees.forEach((emp,i)=>{
let cls=getStatusClass(emp.status);

html+=`
<tr>
<td><input value="${emp.grade||""}" onchange="departmentsUpdate('${dept.name}',${i},'grade',this.value)"></td>
<td><input value="${emp.name||""}"></td>
<td><input value="${emp.work||""}"></td>
<td>
<select class="${cls}" onchange="updateStatus('${dept.name}',${i},this.value)">
<option ${emp.status==="근무"?"selected":""}>근무</option>
<option ${emp.status==="휴일"?"selected":""}>휴일</option>
<option ${emp.status==="연가"?"selected":""}>연가</option>
<option ${emp.status==="출장"?"selected":""}>출장</option>
<option ${emp.status==="교육"?"selected":""}>교육</option>
<option ${emp.status==="육아"?"selected":""}>육아</option>
<option ${emp.status==="유연"?"selected":""}>유연</option>
</select>
</td>
</tr>
`;
});

html+=`</table></div>`;

if(topGroups.includes(dept.name)){
top.innerHTML+=html;
}else{
bottom.innerHTML+=html;
}

});

calc();
}

/* =========================
   통계
========================= */
function calc(){

let total=0,hq=0,wonhyo=0,work=0;

const hqGroup=[
"사무소장",
"행정과",
"자원보전과",
"탐방시설과",
"재난안전과",
"증심지구 현장관리"
];

departments.forEach(d=>{
d.employees.forEach(e=>{
total++;
if(hqGroup.includes(d.name)) hq++;
if(e.status==="근무") work++;
});
});

document.getElementById("total").innerText=total+"명";
document.getElementById("hqTotal").innerText=hq+"명";
document.getElementById("workTotal").innerText=work+"명";
}

    function departmentsUpdate(deptName, index, field, value){
    const dept = departments.find(d => d.name === deptName);
    dept.employees[index][field] = value;
    render();
}

  /* =========================
   엑셀 다운로드 (오늘 날짜 포함)
========================= */
function downloadExcel(){

let now = new Date();
let dateStr =
now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,'0')+"-"+String(now.getDate()).padStart(2,'0');

let data = [];

departments.forEach(dept=>{
dept.employees.forEach(emp=>{
data.push({
  부서: dept.name,
  직급: emp.grade || "",
  이름: emp.name || "",
  업무: emp.work || "",
  상태: emp.status || ""
});
});
});

let ws = XLSX.utils.json_to_sheet(data);
let wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb, ws, "근무현황");

XLSX.writeFile(wb, `무등산_근무현황_${dateStr}.xlsx`);
}
    
/* 실행 */
setToday();
render();

</script>

<style>
html, body{
    height:100%;
    margin:0;
    font-family:'맑은 고딕',sans-serif;
    background:#dfe4ec;
    font-size:13px;
}

/* ================= 상단 3분할 ================= */
.top-bar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:999;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:8px 10px;
    background:#dfe4ec;
    border-bottom:1px solid #ccc;
}

.left, .center, .right{
    flex:1;
}

.center{
    text-align:center;
}

.right{
    display:flex;
    justify-content:flex-end;
}

.title{
    font-size:26px;
    margin:0;
    font-weight:bold;
}

/* ================= 날짜 + 파일 ================= */
#fileList{
    margin-top:6px;
    font-size:11px;
}

#fileList a{
    color:#1a73e8;
    text-decoration:none;
}

/* ================= 통계 표 ================= */
.top-bar table{
    font-size:12px;
    border-collapse:collapse;
}

.top-bar th, .top-bar td{
    border:1px solid #ccc;
    padding:2px 6px;
}

/* ================= 본문 ================= */
.main{
    position:absolute;
    top:140px;
    left:0;
    right:0;
    bottom:0;
    overflow:auto;
    padding:15px;
}

/* ================= 카드 ================= */
.container{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap:6px;
}

.dept{
    background:white;
    border:1px solid #ccc;
}

.dept-header{
    color:white;
    text-align:center;
    font-weight:bold;
    padding:6px;
}

.red{background:#d32f2f;}
.blue{background:#1da1f2;}
.green{background:#8bc34a;}
.navy{background:#3f51b5;}

/* ================= 테이블 ================= */
table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    border:1px solid #ddd;
    font-size:11px;
    text-align:center;
}

input, select{
    width:100%;
    border:none;
    padding:4px;
    font-size:11px;
    text-align:center;
    box-sizing:border-box;
}

/* 상태 컬럼 넓히기 */
td:last-child, th:last-child{
    min-width:120px;
}    
    
/* 상태 색 */
.status-work{background:#4CAF50;color:white;}
.status-holiday{background:#9E9E9E;color:white;}
.status-leave{background:#FF9800;color:white;}
.status-trip{background:#9C27B0;color:white;}
.status-edu{background:#2196F3;color:white;}
.status-child{background:#E91E63;color:white;}
.status-flex{background:#607D8B;color:white;}
</style>
</head>

/* ================= 저장 ================= */
function saveData(){
localStorage.setItem("mudeungsan_departments", JSON.stringify(departments));
}

function loadData(){
const saved = localStorage.getItem("mudeungsan_departments");
if(saved){
departments = JSON.parse(saved);
}
}

/* ================= 파일 (상단) ================= */
function saveTopFile(file){
const reader = new FileReader();

reader.onload = function(){
let files = JSON.parse(localStorage.getItem("top_files") || "[]");

files.push({
name: file.name,
data: reader.result
});

localStorage.setItem("top_files", JSON.stringify(files));

renderTopFiles();
};

reader.readAsDataURL(file);
}

function renderTopFiles(){
    let files = JSON.parse(localStorage.getItem("top_files") || "[]");

    document.getElementById("fileList").innerHTML =
    files.map((f, i) =>
        `📎 <a href="${f.data}" download="${f.name}">${f.name}</a>
         <button onclick="deleteTopFile(${i})" style="margin-left:5px;font-size:10px;">
            삭제
         </button><br>`
    ).join("");
}
/* ================= 삭제함수 ================= */
function deleteTopFile(index){
    let files = JSON.parse(localStorage.getItem("top_files") || "[]");

    files.splice(index, 1); // 해당 파일 삭제

    if(files.length === 0){
        localStorage.removeItem("top_files"); // 완전히 초기화
    } else {
        localStorage.setItem("top_files", JSON.stringify(files));
    }

    renderTopFiles();
}  
  

/* ================= 상태 ================= */
function getStatusClass(v){
switch(v){
case "근무": return "status-work";
case "휴일": return "status-holiday";
case "연가":
case "병가": return "status-leave";
case "출장":
case "공가": return "status-trip";
case "교육": return "status-edu";
case "육아": return "status-child";
case "유연":
case "재택": return "status-flex";
default: return "";
}
}

/* ================= 날짜 ================= */
function setToday(){
const now=new Date();
const week=["일","월","화","수","목","금","토"];

document.getElementById("today").innerText =
`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} (${week[now.getDay()]})`;
}

/* ================= 렌더 ================= */
function render(){
const wrap=document.getElementById("wrap");
wrap.innerHTML="";

departments.forEach((dept,di)=>{
let html=`
<div class="dept">
<div class="dept-header ${dept.color}">
${dept.name} (${dept.employees.filter(e=>e.status==="근무").length})
</div>
<table>
<tr><th>직급</th><th>이름</th><th>업무</th><th>근무형태</th></tr>
`;

dept.employees.forEach((e,i)=>{
html+=`
<tr>
<td><input value="${e.grade}" onchange="updateField(${di},${i},'grade',this.value)"></td>
<td><input value="${e.name}" onchange="updateField(${di},${i},'name',this.value)"></td>
<td><input value="${e.work}" onchange="updateField(${di},${i},'work',this.value)"></td>
<td>
<select class="${getStatusClass(e.status)}"
onchange="updateStatus(${di},${i},this.value)">
<option ${e.status==="근무"?"selected":""}>근무</option>
<option ${e.status==="휴일"?"selected":""}>휴일</option>
<option ${e.status==="연가"?"selected":""}>연가</option>
<option ${e.status==="출장"?"selected":""}>출장</option>
<option ${e.status==="교육"?"selected":""}>교육</option>
<option ${e.status==="육아"?"selected":""}>육아</option>
<option ${e.status==="유연"?"selected":""}>유연</option>
<option ${e.status==="재택"?"selected":""}>재택</option>
<option ${e.status==="병가"?"selected":""}>병가</option>
<option ${e.status==="공가"?"selected":""}>공가</option>
</select>
</td>
</tr>
`;
});

html+=`</table></div>`;
wrap.innerHTML+=html;
});

calc();
}

/* ================= 수정 ================= */
function updateField(di,i,key,val){
departments[di].employees[i][key]=val;
saveData();
render();
}

function updateStatus(di,i,val){
departments[di].employees[i].status=val;
saveData();
render();
}

/* ================= 통계 ================= */
function calc(){
let total=0, work=0, hq=0, wr=0;

departments.forEach(d=>{
d.employees.forEach(e=>{
total++;
if(e.status==="근무") work++;
if(d.name==="원효분소") wr++; else hq++;
});
});

document.getElementById("total").innerText=total+"명";
document.getElementById("hqTotal").innerText=hq+"명";
document.getElementById("wrTotal").innerText=wr+"명";
document.getElementById("workTotal").innerText=work+"명";
}

/* ================= 이벤트 ================= */
document.getElementById("topFileInput").addEventListener("change",(e)=>{
const file=e.target.files[0];
if(file) saveTopFile(file);
});

/* ================= 초기 ================= */
loadData();
setToday();
render();
renderTopFiles();

</script>

<!-- ✅ XLSX 라이브러리 추가 (필수 수정) -->

<style>
body{
    margin:0;
    padding:20px;
    background:#dfe4ec;
    font-family:'맑은 고딕',sans-serif;
}

h1{
    text-align:center;
    font-size:50px;
    margin-bottom:20px;
}

.summary{
    position:absolute;
    right:20px;
    top:20px;
    width:240px;
}

.summary table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border:1px solid #ccc;
}

.summary th,
.summary td{
    border:1px solid #ddd;
    padding:6px;
    font-size:14px;
    text-align:center;
}

.container{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.dept{
    min-width:320px;
    flex:1;
    background:white;
    border:1px solid #ccc;
}

.dept-header{
    color:white;
    text-align:center;
    font-weight:bold;
    padding:10px;
    font-size:18px;
}

.blue{background:#1da1f2;}
.green{background:#8bc34a;}
.navy{background:#3f51b5;}
.red{background:#d32f2f;}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:5px;
    font-size:13px;
    text-align:center;
}

input,select{
    width:100%;
    border:none;
    padding:4px;
    font-size:11px;
    text-align:center;
}

.status-work{background:#4CAF50;color:white;font-weight:bold;}
.status-holiday{background:#9E9E9E;color:white;}
.status-leave{background:#FF9800;color:white;}
.status-trip{background:#9C27B0;color:white;}
.status-edu{background:#2196F3;color:white;}
.status-child{background:#E91E63;color:white;}
.status-flex{background:#607D8B;color:white;}

button{
    position:fixed;
    right:20px;
    bottom:20px;
    padding:12px 16px;
    font-size:14px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    background:#1da1f2;
    color:white;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}
</style>
</head>

<!-- ✅ 엑셀 다운로드 버튼 추가 -->

/* 상태 클래스 */
function getStatusClass(v){
switch(v){
case "근무": return "status-work";
case "휴일": return "status-holiday";
case "연가": return "status-leave";
case "출장": return "status-trip";
case "교육": return "status-edu";
case "육아": return "status-child";
case "유연": return "status-flex";
default: return "";
}
}

/* 날짜 */
function setToday(){
const now=new Date();
const week=["일","월","화","수","목","금","토"];

document.getElementById("today").innerText =
`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} (${week[now.getDay()]})`;
}

/* 상태 변경 */
function updateStatus(deptName,index,value){
const dept = departments.find(d=>d.name===deptName);
dept.employees[index].status=value;
render();
}

/* 렌더 */
function render(){

let top=document.getElementById("wrapTop");
let bottom=document.getElementById("wrapBottom");

top.innerHTML="";
bottom.innerHTML="";

const topGroups=["행정과","자원보전과","탐방시설과"];
const bottomGroups=["재난안전과","증심지구 현장관리","원효분소"];

departments.forEach(dept=>{

let html=`
<div class="dept">
<div class="dept-header ${dept.color}">
${dept.name}
</div>

<table>
<tr>
<th>직급</th>
<th>이름</th>
<th>업무</th>
<th>근무형태</th>
</tr>
`;

dept.employees.forEach((emp,i)=>{

html+=`
<tr>
<td><input value="${emp.grade}"></td>
<td><input value="${emp.name}"></td>
<td><input value="${emp.work}"></td>
<td>
<select class="${getStatusClass(emp.status)}"
onchange="updateStatus('${dept.name}',${i},this.value)">
<option ${emp.status==="근무"?"selected":""}>근무</option>
<option ${emp.status==="휴일"?"selected":""}>휴일</option>
<option ${emp.status==="연가"?"selected":""}>연가</option>
<option ${emp.status==="출장"?"selected":""}>출장</option>
<option ${emp.status==="교육"?"selected":""}>교육</option>
<option ${emp.status==="육아"?"selected":""}>육아</option>
<option ${emp.status==="유연"?"selected":""}>유연</option>
</select>
</td>
</tr>
`;
});

html+=`</table></div>`;

if(topGroups.includes(dept.name)){
top.innerHTML+=html;
}else{
bottom.innerHTML+=html;
}

});

calc();
}

/* 통계 */
function calc(){

let total=0,hq=0,wonhyo=0,work=0;

const hqGroup=["행정과","자원보전과","탐방시설과","재난안전과","증심지구 현장관리"];

departments.forEach(d=>{
d.employees.forEach(e=>{
if([...hqGroup,"원효분소"].includes(d.name)) total++;
if(hqGroup.includes(d.name)) hq++;
if(d.name==="원효분소") wonhyo++;
if(e.status==="근무") work++;
});
});

document.getElementById("total").innerText=total+"명";
document.getElementById("hqTotal").innerText=hq+"명";
document.getElementById("wonhyoTotal").innerText=wonhyo+"명";
document.getElementById("workTotal").innerText=work+"명";
}

/* 엑셀 다운로드 */
function downloadExcel(){

let data=[["부서","직급","이름","업무","근무형태"]];

departments.forEach(d=>{
d.employees.forEach(e=>{
data.push([d.name,e.grade,e.name,e.work,e.status]);
});
});

let ws=XLSX.utils.aoa_to_sheet(data);
let wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"근무현황");

XLSX.writeFile(
wb,
`무등산_근무현황_${document.getElementById("today").innerText}.xlsx`
);
}

/* 실행 */
setToday();
render();

<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
🛰 SEARCH AND RESCUE AI MAP
</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<link rel="stylesheet"
href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css">


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>



<style>


body{

margin:0;

background:#050b18;

color:#00ff9d;

font-family:monospace;

overflow:hidden;

}



header{

background:#071a2f;

padding:10px;

text-align:center;

font-weight:bold;

font-size:18px;

}




#container{

display:flex;

height:calc(100vh - 50px);

}





#panel{

width:300px;

background:#07101f;

padding:10px;

display:flex;

flex-direction:column;

gap:6px;

overflow-y:auto;

}




#map{

flex:1;

}





input,button{


padding:10px;

border:1px solid #00ff9d;

background:#001a14;

color:#00ff9d;

font-family:monospace;


}



button:disabled{

opacity:0.5;

}




@media(max-width:768px){


#container{

flex-direction:column;

}



#panel{

width:100%;

max-height:35vh;

}



#map{

height:65vh;

}


}




.name-label{


background:#001a14;

color:#00ff9d;

border:1px solid #00ff9d;

border-radius:5px;

padding:3px 8px;

font-size:12px;

font-weight:bold;

box-shadow:0 0 8px #00ff9d;


}





/* =========================
   EMS 신고 펄스
========================= */


.ems-pulse{


width:24px;

height:24px;

border-radius:50%;

background:red;

border:3px solid white;

box-shadow:0 0 15px red;

animation:emsPulse 1.5s infinite;


}



@keyframes emsPulse{


0%{

transform:scale(.6);

opacity:1;

}


70%{

transform:scale(1.5);

opacity:.3;

box-shadow:
0 0 0 30px rgba(255,0,0,0);


}



100%{

transform:scale(.6);

opacity:1;

}


}




</style>


</head>



<body>



<header>

🛰 SEARCH AND RESCUE AI MAP

</header>



<div id="container">



<div id="panel">


<input id="name"
placeholder="RESCUE ID">



<button id="startBtn"
onclick="start()"
disabled>

START

</button>



<button onclick="goMyLocation()">

📍 MY LOCATION

</button>



<button onclick="shareLocation()">

📡 위치 공유

</button>



<button onclick="sendSOS()">

🚨 SOS

</button>



<button onclick="stopTracking()">

⛔ STOP

</button>



<button onclick="loadAllHistory()">

📦 전체 기록

</button>



</div>



<div id="map"></div>



</div>





<script>


// ================= API =================



const API_URL =

"https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";




// EMS API


const EMS_API =

"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";






// ================= DEVICE =================


let DEVICE_ID =
localStorage.getItem("DEVICE_ID");



if(!DEVICE_ID){


DEVICE_ID =
crypto.randomUUID();


localStorage.setItem(
"DEVICE_ID",
DEVICE_ID
);


}






// ================= MAP =================



const map =

L.map("map")

.setView(

[35.1239,126.9883],

13

);





// ================= TILE =================



const osm =

L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"

);



const topo =

L.tileLayer(

"https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png"

);



const satellite =

L.tileLayer(

"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"

);





osm.addTo(map);





L.control.layers({

"🗺 일반지도":osm,

"⛰ 지형지도":topo,

"🛰 위성지도":satellite


}).addTo(map);







// ================= DRAW =================



const drawnItems =

new L.FeatureGroup();



map.addLayer(
drawnItems
);




const drawControl =

new L.Control.Draw({


position:"topright",


draw:{


polygon:true,

rectangle:true,

circle:true,

marker:true,

polyline:true,

circlemarker:false


},


edit:{


featureGroup:drawnItems,

remove:true


}



});



map.addControl(drawControl);





map.on(

L.Draw.Event.CREATED,

function(e){


drawnItems.addLayer(
e.layer
);


});








// ================= LAYERS =================



// 구조대 위치

const rescueLayer =

L.layerGroup().addTo(map);



// EMS 신고

const emsLayer =

L.layerGroup().addTo(map);



// 최단 구조 경로

const rescueRouteLayer =

L.layerGroup().addTo(map);



// SOS

const sosLayer =

L.layerGroup().addTo(map);



// 기록

const historyMarkers =

L.layerGroup().addTo(map);


const historyLines =

L.layerGroup().addTo(map);

// ================= STATE =================


let myName="";

let lastPos=null;

let watchId=null;


let intervalSend=null;

let intervalLoad=null;

let intervalEMS=null;



let startTime="";

let endTime="";





// 구조대 마커

const markers={};



// EMS 마커

const emsMarkers={};

const emsPulseMarkers={};




// 구조대 색상

const rescueColors={};


const colors=[

"#00ff9d",

"#00aaff",

"#ffcc00",

"#ff00ff",

"#ff6600",

"#ffffff"

];





function getColor(name){


if(!rescueColors[name]){


rescueColors[name]=

colors[

Object.keys(rescueColors).length

%

colors.length

];


}


return rescueColors[name];


}






// ================= INPUT =================



const nameInput =

document.getElementById("name");



const startBtn =

document.getElementById("startBtn");




nameInput.addEventListener(

"input",

()=>{


startBtn.disabled =

nameInput.value.trim().length===0;


}

);








// ================= TIME =================



function getNowTime(){


const now=new Date();



const y=now.getFullYear();


const m=

String(now.getMonth()+1)

.padStart(2,"0");



const d=

String(now.getDate())

.padStart(2,"0");



const h=

String(now.getHours())

.padStart(2,"0");



const min=

String(now.getMinutes())

.padStart(2,"0");



const s=

String(now.getSeconds())

.padStart(2,"0");



return `${y}-${m}-${d} ${h}:${min}:${s}`;


}








// ================= START =================



function start(){



myName=

nameInput.value.trim();



if(!myName){


alert("UNIT ID required");


return;


}




startTime=getNowTime();

endTime="";



nameInput.disabled=true;

startBtn.disabled=true;






watchId =

navigator.geolocation.watchPosition(



(pos)=>{



lastPos={


name:myName,


device:DEVICE_ID,


lat:pos.coords.latitude,


lng:pos.coords.longitude,


status:"normal"


};




},



(err)=>{


console.log(err);


alert(
"GPS 오류 / 권한 확인"
);



},



{


enableHighAccuracy:true,


maximumAge:1000,


timeout:10000


}



);








intervalSend=

setInterval(

sendData,

5000

);




intervalLoad=

setInterval(

loadLive,

3000

);



}





// ================= SEND LIVE =================



function sendData(){



if(!lastPos)

return;





fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain"


},



body:JSON.stringify({


...lastPos,


startTime:startTime,


endTime:endTime


})



}

);



}







// ================= LIVE LOAD =================



function loadLive(){



fetch(

API_URL

+

"?live=1&t="

+

Date.now()


)



.then(

r=>r.json()

)



.then(

renderLive

);



}









// ================= LIVE RENDER =================



function renderLive(data){



sosLayer.clearLayers();




data.forEach(p=>{



const lat=

Number(p.lat);



const lng=

Number(p.lng);




if(

!Number.isFinite(lat)

||

!Number.isFinite(lng)

)

return;






const key=p.name;



const pos=[lat,lng];







// 처음 생성



if(!markers[key]){



markers[key]=


L.circleMarker(

pos,

{


radius:10,


color:getColor(key),


fillColor:getColor(key),


fillOpacity:1,


weight:3


}


)



.bindTooltip(

p.name,

{


permanent:true,


direction:"top",


className:"name-label"


}

)



.addTo(rescueLayer);





}





else{



markers[key]

.setLatLng(pos);



}






// 상태 표시



if(p.status==="SOS"){



markers[key]

.setStyle({


color:"red",


fillColor:"red",


radius:14


});



L.circle(

pos,

{


radius:50,


color:"red",


fillColor:"red",


fillOpacity:.3


}

)


.addTo(sosLayer);



}



else{


markers[key]

.setStyle({


color:getColor(key),


fillColor:getColor(key)


});


}




});



}







// ================= MY LOCATION =================



function goMyLocation(){



if(!lastPos)

return;



map.setView(


[

lastPos.lat,

lastPos.lng

],


16


);



}






// ================= SOS =================



function sendSOS(){



if(!lastPos){


alert(
"현재 위치가 없습니다."
);


return;


}





fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain"


},



body:JSON.stringify({


...lastPos,


startTime:startTime,


endTime:endTime,


status:"SOS"


})


}



);





alert(
"🚨 SOS 전송 완료"
);



}

// ================= EMS ICON =================


function getEMSIcon(status){


let color="red";


if(status==="출동")
color="orange";


if(status==="완료")
color="green";


if(status==="취소")
color="gray";




return L.divIcon({


className:"",



html:

`

<div style="

font-size:32px;

filter:drop-shadow(0 0 8px ${color});

">

🚑

</div>

`,


iconSize:[35,35]


});



}







// ================= EMS LOAD =================



function loadEMS(){



fetch(

EMS_API

+

"?t="

+

Date.now()

)



.then(

r=>r.json()

)



.then(

renderEMS

);



}








// ================= EMS RENDER =================



function renderEMS(data){



const active={};




data.forEach(item=>{



const lat=

Number(item.lat);



const lng=

Number(item.lng);





if(

!Number.isFinite(lat)

||

!Number.isFinite(lng)

)

return;





const key=item.id;



active[key]=true;



const pos=[lat,lng];








// ================= 🚑 신고 아이콘 =================




if(!emsMarkers[key]){



emsMarkers[key]=


L.marker(

pos,

{


icon:getEMSIcon(item.status)


}

)




.bindPopup(

`

<b>🚑 119 신고</b><br><br>

📌 사고유형 :

${item.type}

<br>

<br>

📍 주소 :

${item.address}

<br><br>

📡 상태 :

${item.status}

<br><br>

⏰ 접수 :

${item.time}

<br><br>

<a href="${item.mapURL}"

target="_blank">

카카오 지도 열기

</a>


`

)



.addTo(emsLayer);





}

else{



emsMarkers[key]

.setLatLng(pos);



emsMarkers[key]

.setIcon(

getEMSIcon(item.status)

);



}








// ================= 🔴 펄스 =================





if(item.status!=="완료"){





if(!emsPulseMarkers[key]){



emsPulseMarkers[key]=


L.marker(

pos,

{


icon:L.divIcon({


className:"",


html:

`

<div class="ems-pulse"></div>

`,


iconSize:[30,30]



}),



interactive:false



}

)



.addTo(emsLayer);




}

else{



emsPulseMarkers[key]

.setLatLng(pos);



}





}



else{



if(emsPulseMarkers[key]){


emsLayer.removeLayer(

emsPulseMarkers[key]

);



delete emsPulseMarkers[key];



}



}







});









// 삭제된 신고 제거



Object.keys(emsMarkers)

.forEach(key=>{


if(!active[key]){


emsLayer.removeLayer(

emsMarkers[key]

);



delete emsMarkers[key];



}



});





}








// ================= EMS 자동 실행 =================



loadEMS();



intervalEMS=

setInterval(

loadEMS,

3000

);

// ================= 거리 계산 =================


function getDistance(

lat1,

lng1,

lat2,

lng2

){


const R=6371000;


const dLat=

(lat2-lat1)

*

Math.PI/180;


const dLng=

(lng2-lng1)

*

Math.PI/180;



const a=

Math.sin(dLat/2)**2

+

Math.cos(lat1*Math.PI/180)

*

Math.cos(lat2*Math.PI/180)

*

Math.sin(dLng/2)**2;



return R *

2 *

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);



}







// ================= 가까운 구조대 검색 =================



function findNearestRescue(ems){



let nearest=null;


let min=Infinity;




Object.keys(markers)

.forEach(name=>{



const pos=

markers[name].getLatLng();



const distance=

getDistance(

ems.lat,

ems.lng,

pos.lat,

pos.lng

);





if(distance<min){


min=distance;



nearest={


name:name,


lat:pos.lat,


lng:pos.lng,


distance:distance


};



}



});




return nearest;



}








// ================= ETA 계산 =================



function calcETA(distance){



// 평균 이동속도 40km/h


const speed=40;



const km=

distance/1000;



return Math.max(

1,

Math.ceil(

(km/speed)*60

)

);



}








// ================= 구조대 연결선 =================



function drawRescueRoute(ems){



rescueRouteLayer.clearLayers();



const rescue=

findNearestRescue(ems);



if(!rescue)

return;







L.polyline(



[


[

ems.lat,

ems.lng

],


[

rescue.lat,

rescue.lng

]


],



{


color:"red",


weight:5,


dashArray:"10,10"



}



)

.addTo(rescueRouteLayer);







const eta=

calcETA(

rescue.distance

);







L.marker(



[


(ems.lat+rescue.lat)/2,


(ems.lng+rescue.lng)/2


],



{


icon:L.divIcon({



className:"",


html:


`

<div style="

background:#000;

color:#fff;

border:1px solid red;

padding:6px;

border-radius:5px;

font-size:12px;

white-space:nowrap;

">

🚑 ${rescue.name}<br>

📏 ${(rescue.distance/1000).toFixed(2)} km<br>

⏱ 약 ${eta}분

</div>

`



})



}



)

.addTo(rescueRouteLayer);




}







// ================= EMS 연결 추가 =================


// 기존 renderEMS 아래에 실행

const oldRenderEMS = renderEMS;



renderEMS=function(data){



oldRenderEMS(data);



data.forEach(item=>{


if(item.status!=="완료"){



drawRescueRoute({


lat:Number(item.lat),


lng:Number(item.lng)


});



}



});



}









// ================= 위치 공유 =================



function shareLocation(){



if(!lastPos){


alert(
"현재 위치가 없습니다."
);


return;


}





const url=

`https://www.google.com/maps?q=${lastPos.lat},${lastPos.lng}`;





const text=

`

📡 구조대 위치공유


UNIT :

${lastPos.name}



위치:

${url}

`;





fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain"


},



body:JSON.stringify({


...lastPos,


status:"SHARE"


})



}

);






if(navigator.share){



navigator.share({


title:"구조대 위치",


text:text,


url:url



});



}

else{


location.href=

"sms:?body="

+

encodeURIComponent(text);



}




}









// ================= STOP =================



function stopTracking(){



endTime=

getNowTime();





if(lastPos){



fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":

"text/plain"


},



body:JSON.stringify({


...lastPos,


startTime:startTime,


endTime:endTime,


status:"STOP"


})



}

);



}






if(watchId){



navigator.geolocation.clearWatch(

watchId

);



watchId=null;


}





clearInterval(intervalSend);


clearInterval(intervalLoad);



intervalSend=null;

intervalLoad=null;



lastPos=null;


myName="";



startTime="";

endTime="";




nameInput.disabled=false;


nameInput.value="";


startBtn.disabled=true;




alert(
"⛔ STOP 완료"
);



}








// ================= 전체 기록 =================



function loadAllHistory(){



fetch(

API_URL

+

"?history=1&t="

+

Date.now()

)



.then(r=>r.json())

.then(showHistoryMap);



}








function showHistoryMap(data){



historyMarkers.clearLayers();


historyLines.clearLayers();




const grouped={};




data.sort(

(a,b)=>

new Date(a.time)

-

new Date(b.time)

);





data.forEach(d=>{



if(!grouped[d.name])

grouped[d.name]=[];



grouped[d.name].push([


Number(d.lat),


Number(d.lng)


]);



});






const all=[];





for(const name in grouped){



const path=

grouped[name];



all.push(...path);





L.polyline(

path,

{


color:getColor(name),


weight:5


}

)

.addTo(historyLines);




}




if(all.length){



map.fitBounds(

all,

{


padding:[50,50]


}

);



}




}







// ================= 초기 실행 =================



loadLive();

loadEMS();

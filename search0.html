<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>
🛰 SEARCH AND RESCUE AI MAP
</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<link rel="stylesheet"
href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css">


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>


<style>

body{

margin:0;

background:#050b18;

color:#00ff9d;

font-family:monospace;

overflow:hidden;

}


header{

background:#071a2f;

padding:10px;

text-align:center;

font-size:18px;

font-weight:bold;

}



#container{

display:flex;

height:calc(100vh - 50px);

}



#panel{

width:300px;

background:#07101f;

padding:10px;

display:flex;

flex-direction:column;

gap:8px;

overflow-y:auto;

}



#map{

flex:1;

}



input,
button,
select{

padding:10px;

border:1px solid #00ff9d;

background:#001a14;

color:#00ff9d;

font-family:monospace;

}



button:disabled{

opacity:.5;

}



.name-label{

background:#001a14;

color:#00ff9d;

border:1px solid #00ff9d;

border-radius:5px;

padding:3px 8px;

font-size:12px;

font-weight:bold;

box-shadow:0 0 8px #00ff9d;

}



.ems-pulse{

width:24px;

height:24px;

border-radius:50%;

background:red;

border:3px solid white;

box-shadow:0 0 15px red;

animation:pulse 1.5s infinite;

}



@keyframes pulse{

0%{

transform:scale(.6);

opacity:1;

}

70%{

transform:scale(1.6);

opacity:.2;

}

100%{

transform:scale(.6);

opacity:1;

}

}



@media(max-width:768px){

#container{

flex-direction:column;

}


#panel{

width:100%;

max-height:35vh;

}


#map{

height:65vh;

}

}


</style>

</head>


<body>


<header>

🛰 SEARCH AND RESCUE AI MAP

</header>



<div id="container">


<div id="panel">


<input id="name"
placeholder="RESCUE ID">



<select id="routeMode">

<option value="car">

🚗 차량 AI

</option>


<option value="foot">

🚶 도보 AI

</option>


</select>





<button id="startBtn"
onclick="start()"
disabled>

START

</button>



<button onclick="goMyLocation()">

📍 MY LOCATION

</button>



<button onclick="shareLocation()">

📡 위치 공유

</button>



<button onclick="sendSOS()">

🚨 SOS

</button>



<button onclick="stopTracking()">

⛔ STOP

</button>



<button onclick="loadAllHistory()">

📦 전체 기록

</button>




<button id="carBtn"
onclick="toggleCarRoute()">

🚑 차량 경로 ON

</button>




<button id="footBtn"
onclick="toggleFootRoute()">

🚶 도보 경로 ON

</button>



</div>



<div id="map"></div>



</div>



<script>


// ================= API =================


const API_URL =
"https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";



const EMS_API =
"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";



const GRAPHHOPPER_KEY =
"6f1dbbf6-0546-4b11-a9c8-8d8134dff43c";



// ================= DEVICE =================


let DEVICE_ID =
localStorage.getItem("DEVICE_ID");


if(!DEVICE_ID){

DEVICE_ID=crypto.randomUUID();

localStorage.setItem(
"DEVICE_ID",
DEVICE_ID
);

}





// ================= MAP =================


const map =
L.map("map")
.setView(
[35.1239,126.9883],
13
);




const osm =
L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
);



const topo =
L.tileLayer(
"https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png"
);



const satellite =
L.tileLayer(
"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
);



osm.addTo(map);



L.control.layers({

"🗺 일반지도":osm,

"⛰ 지형지도":topo,

"🛰 위성지도":satellite


}).addTo(map);





// ================= DRAW =================


const drawnItems =
new L.FeatureGroup();


map.addLayer(drawnItems);



map.addControl(

new L.Control.Draw({

draw:{

polygon:true,

rectangle:true,

circle:true,

marker:true,

polyline:true

},

edit:{

featureGroup:drawnItems

}

})

);




map.on(
L.Draw.Event.CREATED,

e=>{

drawnItems.addLayer(e.layer);

});


// ================= LAYER =================


const rescueLayer =
L.layerGroup()
.addTo(map);


const emsLayer =
L.layerGroup()
.addTo(map);



const rescueRouteLayer =
L.layerGroup()
.addTo(map);



const carRouteLayer =
L.layerGroup()
.addTo(map);



const footRouteLayer =
L.layerGroup()
.addTo(map);



const sosLayer =
L.layerGroup()
.addTo(map);



const historyMarkers =
L.layerGroup()
.addTo(map);



const historyLines =
L.layerGroup()
.addTo(map);




// ================= ROUTE STATE =================


let showCarRoute=true;

let showFootRoute=true;


let routeMode="car";



const carRoutes={};

const footRoutes={};


const routeInfoMarkers={};


const selectedRouteCache={};




// ================= ROUTE BUTTON =================


function toggleCarRoute(){


showCarRoute=!showCarRoute;


document.getElementById("carBtn").innerHTML =

showCarRoute

?

"🚑 차량 경로 ON"

:

"🚑 차량 경로 OFF";




if(showCarRoute){

map.addLayer(carRouteLayer);

}

else{

map.removeLayer(carRouteLayer);

}



}




function toggleFootRoute(){


showFootRoute=!showFootRoute;


document.getElementById("footBtn").innerHTML =

showFootRoute

?

"🚶 도보 경로 ON"

:

"🚶 도보 경로 OFF";





if(showFootRoute){

map.addLayer(footRouteLayer);

}

else{

map.removeLayer(footRouteLayer);

}



}







// ================= MARKER =================


const markers={};


const rescueColors={};



const colors=[

"#00ff9d",

"#00aaff",

"#ffcc00",

"#ff00ff",

"#ff6600",

"#ffffff"

];





function getColor(name){


if(!rescueColors[name]){


rescueColors[name]=

colors[

Object.keys(rescueColors).length

%

colors.length

];


}


return rescueColors[name];


}







// ================= INPUT =================


const nameInput =
document.getElementById("name");


const startBtn =
document.getElementById("startBtn");



nameInput.addEventListener(

"input",

()=>{


startBtn.disabled =

nameInput.value.trim()==="";


}

);






document
.getElementById("routeMode")
.addEventListener(

"change",

e=>{


routeMode=e.target.value;



carRouteLayer.clearLayers();

footRouteLayer.clearLayers();

rescueRouteLayer.clearLayers();



Object.keys(emsMarkers)

.forEach(id=>{


const marker =
emsMarkers[id];


const pos =
marker.getLatLng();



drawRescueRoute({

id:id,

lat:pos.lat,

lng:pos.lng

});


});



}

);







// ================= STATE =================


let myName="";


let lastPos=null;


let watchId=null;


let intervalSend=null;


let intervalLoad=null;


let intervalEMS=null;



let startTime="";


let endTime="";







// ================= TIME =================


function getNowTime(){


const now=new Date();


return (

now.getFullYear()

+"-"

+String(now.getMonth()+1).padStart(2,"0")

+"-"

+String(now.getDate()).padStart(2,"0")

+" "

+String(now.getHours()).padStart(2,"0")

+":"

+String(now.getMinutes()).padStart(2,"0")

+":"

+String(now.getSeconds()).padStart(2,"0")

);


}







// ================= START =================


function start(){


myName=nameInput.value.trim();



if(!myName){

alert("UNIT ID required");

return;

}



startTime=getNowTime();

endTime="";


nameInput.disabled=true;

startBtn.disabled=true;




watchId=navigator.geolocation.watchPosition(


pos=>{


lastPos={


name:myName,


device:DEVICE_ID,


lat:pos.coords.latitude,


lng:pos.coords.longitude,


status:"normal"


};


},


err=>{


alert("GPS 권한 확인 필요");


},


{


enableHighAccuracy:true,


maximumAge:1000,


timeout:10000


}



);





intervalSend=setInterval(

sendData,

5000

);



intervalLoad=setInterval(

loadLive,

3000

);



}







// ================= SEND =================


function sendData(){


if(!lastPos)

return;



fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":"text/plain"

},

body:JSON.stringify({

...lastPos,

startTime:startTime,

endTime:endTime

})

}

)

.catch(console.log);



}







// ================= LIVE =================


function loadLive(){


fetch(

API_URL

+"?live=1&t="

+Date.now()

)


.then(r=>r.json())

.then(renderLive)

.catch(console.log);



}







function renderLive(data){


sosLayer.clearLayers();



data.forEach(p=>{


const lat=Number(p.lat);

const lng=Number(p.lng);



if(!Number.isFinite(lat)||!Number.isFinite(lng))

return;



const key=p.name;


const pos=[lat,lng];




if(!markers[key]){


markers[key]=


L.circleMarker(

pos,

{

radius:10,

color:getColor(key),

fillColor:getColor(key),

fillOpacity:1,

weight:3

}

)



.bindTooltip(

p.name,

{

permanent:true,

direction:"top",

className:"name-label"

}

)



.addTo(rescueLayer);



}

else{


markers[key].setLatLng(pos);


}





if(p.status==="SOS"){


markers[key].setStyle({

radius:15,

color:"red",

fillColor:"red"

});



L.circle(

pos,

{

radius:60,

color:"red",

fillColor:"red",

fillOpacity:.25

}

)

.addTo(sosLayer);



}


else if(p.status==="SHARE"){


markers[key].setStyle({

color:"#0088ff",

fillColor:"#0088ff"

});



}

else{


markers[key].setStyle({

color:getColor(key),

fillColor:getColor(key)

});


}



});


}






// ================= EMS =================


const emsMarkers={};


const emsPulseMarkers={};





function getEMSIcon(status){


let color="red";


if(status==="출동")

color="orange";


if(status==="완료")

color="green";


if(status==="취소")

color="gray";



return L.divIcon({

className:"",

html:

`

<div style="
font-size:32px;
filter:drop-shadow(0 0 8px ${color});
">

🚑

</div>

`,

iconSize:[35,35]

});


}







function loadEMS(){


fetch(

EMS_API+"?t="+Date.now()

)

.then(r=>r.json())

.then(renderEMS)

.catch(console.log);



}







function renderEMS(data){


data.forEach(item=>{


const lat=Number(item.lat);

const lng=Number(item.lng);



if(!Number.isFinite(lat)||!Number.isFinite(lng))

return;



const key=item.id;


const pos=[lat,lng];




if(!emsMarkers[key]){


emsMarkers[key]=


L.marker(

pos,

{

icon:getEMSIcon(item.status)

}

)



.bindPopup(

`

<b>🚑 119 신고</b>

<br><br>

📌 ${item.type}

<br>

📍 ${item.address}

<br>

📡 ${item.status}

<br>

⏰ ${item.time}

`

)



.addTo(emsLayer);



}

else{


emsMarkers[key].setLatLng(pos);

emsMarkers[key].setIcon(

getEMSIcon(item.status)

);


}






drawRescueRoute({

id:key,

lat:lat,

lng:lng

});



});


}

// ================= GRAPHHOPPER ROUTE =================


function getGHRoute(

startLat,

startLng,

endLat,

endLng,

vehicle

){


const url=

"https://graphhopper.com/api/1/route?"

+

`point=${startLat},${startLng}`

+

`point=${endLat},${endLng}`

+

`&vehicle=${vehicle}`

+

"&points_encoded=false"

+

"&instructions=false"

+

`&key=${GRAPHHOPPER_KEY}`;



return fetch(url)

.then(r=>r.json())

.then(data=>{


if(!data.paths || !data.paths.length)

return null;



const path=data.paths[0];



return {


distance:path.distance,

duration:path.time,

geometry:path.points.coordinates


};


})


.catch(()=>null);


}








// ================= ETA =================



function getRescueETA(ems,rescue){


return Promise.all([


getGHRoute(

ems.lat,

ems.lng,

rescue.lat,

rescue.lng,

"car"

),


getGHRoute(

ems.lat,

ems.lng,

rescue.lat,

rescue.lng,

"foot"

)



])

.then(r=>{


return {

car:r[0],

walk:r[1]

};


});


}









// ================= AI RESCUE SELECT =================



function findFastestRescue(ems){



const candidates=[];



Object.keys(markers)

.forEach(name=>{


const pos=

markers[name].getLatLng();



candidates.push({

name:name,

lat:pos.lat,

lng:pos.lng

});


});





if(!candidates.length)

return Promise.resolve(null);





const jobs=candidates.map(async rescue=>{


const eta=

await getRescueETA(

ems,

rescue

);



if(!eta.car)

return null;




const score=

(eta.car.duration/60000)*0.5

+

(eta.walk?

eta.walk.duration/60000:

999)*0.2;




return {

name:rescue.name,

lat:rescue.lat,

lng:rescue.lng,

eta:eta,

score:score

};



});





return Promise.all(jobs)

.then(result=>{


const valid=

result.filter(x=>x);



valid.sort(

(a,b)=>a.score-b.score

);



return valid[0]||null;



});


}









// ================= DRAW AI ROUTE =================



function drawRescueRoute(ems){



findFastestRescue(ems)

.then(rescue=>{


if(!rescue)

return;





// 기존 삭제


if(carRoutes[ems.id]){

carRouteLayer.removeLayer(

carRoutes[ems.id]

);

}



if(footRoutes[ems.id]){

footRouteLayer.removeLayer(

footRoutes[ems.id]

);

}





// 차량


if(showCarRoute && rescue.eta.car){



const coords=[];



rescue.eta.car.geometry.forEach(p=>{


coords.push([

p[1],

p[0]

]);


});



const line=

L.polyline(

coords,

{

color:"red",

weight:6,

dashArray:"15,10"

}

)

.addTo(carRouteLayer);



carRoutes[ems.id]=line;



}





// 도보


if(showFootRoute && rescue.eta.walk){



const coords=[];



rescue.eta.walk.geometry.forEach(p=>{


coords.push([

p[1],

p[0]

]);


});



const line=

L.polyline(

coords,

{

color:"#00aaff",

weight:5,

dashArray:"5,10"

}

)

.addTo(footRouteLayer);



footRoutes[ems.id]=line;


}







// ETA 정보



const selected=

routeMode==="foot"

?

rescue.eta.walk

:

rescue.eta.car;



if(!selected)

return;



const min=

Math.ceil(

selected.duration/60000

);



const km=

(

selected.distance/1000

)

.toFixed(2);





if(routeInfoMarkers[ems.id]){

rescueRouteLayer.removeLayer(

routeInfoMarkers[ems.id]

);

}





const info=

L.marker(

[

(ems.lat+rescue.lat)/2,

(ems.lng+rescue.lng)/2

],

{


icon:L.divIcon({

className:"",

html:

`

<div style="

background:#050b18;

color:#00ff9d;

border:2px solid red;

padding:10px;

border-radius:10px;

font-size:13px;

box-shadow:0 0 10px red;

white-space:nowrap;

">


🤖 AI 출동팀

<br><br>

🚑 ${rescue.name}

<br>

📏 ${km} km

<br>

⏱ ETA ${min}분

<br>

🧠 ${rescue.score.toFixed(1)}


</div>

`

})


}

);


info.addTo(rescueRouteLayer);


routeInfoMarkers[ems.id]=info;



});


}









// ================= SHARE =================



function shareLocation(){


if(!lastPos){

alert("현재 위치가 없습니다.");

return;

}



const url=

`https://www.google.com/maps?q=${lastPos.lat},${lastPos.lng}`;



fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":"text/plain"

},

body:JSON.stringify({

...lastPos,

status:"SHARE"

})

}

);




if(navigator.share){


navigator.share({

title:"구조대 위치",

text:url,

url:url

});


}

else{


alert(url);


}


}









// ================= SOS =================



function sendSOS(){


if(!lastPos){

alert("현재 위치가 없습니다.");

return;

}



fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":"text/plain"

},

body:JSON.stringify({

...lastPos,

status:"SOS",

startTime:startTime,

endTime:endTime

})

}

);



alert(

"🚨 SOS 전송 완료"

);


}









// ================= STOP =================



function stopTracking(){



endTime=getNowTime();



if(lastPos){


fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":"text/plain"

},

body:JSON.stringify({

...lastPos,

status:"STOP",

startTime:startTime,

endTime:endTime

})

}

);


}





if(watchId){

navigator.geolocation.clearWatch(

watchId

);

watchId=null;

}





clearInterval(intervalSend);

clearInterval(intervalLoad);

clearInterval(intervalEMS);



lastPos=null;


myName="";


nameInput.disabled=false;

nameInput.value="";


startBtn.disabled=true;



alert(

"⛔ STOP 완료"

);



}









// ================= MY LOCATION =================



function goMyLocation(){


if(!lastPos)

return;



map.setView(

[

lastPos.lat,

lastPos.lng

],

16

);


}









// ================= HISTORY =================



function loadAllHistory(){


fetch(

API_URL+"?history=1&t="+Date.now()

)

.then(r=>r.json())

.then(showHistoryMap)

.catch(console.log);


}







function showHistoryMap(data){



historyMarkers.clearLayers();

historyLines.clearLayers();



const group={};



data.forEach(d=>{


if(!group[d.name])

group[d.name]=[];



group[d.name].push([

Number(d.lat),

Number(d.lng)

]);


});





for(let name in group){


const path=group[name];



L.polyline(

path,

{

color:getColor(name),

weight:5

}

)

.addTo(historyLines);



L.marker(path[0])

.bindPopup(

"START "+name

)

.addTo(historyMarkers);



L.marker(path[path.length-1])

.bindPopup(

"END "+name

)

.addTo(historyMarkers);



}


}









// ================= START PAGE =================



loadLive();


loadEMS();



intervalEMS=setInterval(

loadEMS,

3000

);



</script>


</body>

</html>

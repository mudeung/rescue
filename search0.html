<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
🛰 SEARCH AND RESCUE AI MAP
</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<link rel="stylesheet"
href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css">


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>



<style>


body{

margin:0;

background:#050b18;

color:#00ff9d;

font-family:monospace;

overflow:hidden;

}



header{

background:#071a2f;

padding:10px;

text-align:center;

font-size:18px;

font-weight:bold;

}



#container{

display:flex;

height:calc(100vh - 50px);

}



#panel{

width:300px;

background:#07101f;

padding:10px;

display:flex;

flex-direction:column;

gap:6px;

overflow-y:auto;

}



#map{

flex:1;

}



input,button{

padding:10px;

border:1px solid #00ff9d;

background:#001a14;

color:#00ff9d;

font-family:monospace;

}



button:disabled{

opacity:0.5;

}



.name-label{

background:#001a14;

color:#00ff9d;

border:1px solid #00ff9d;

border-radius:5px;

padding:3px 8px;

font-size:12px;

font-weight:bold;

box-shadow:0 0 8px #00ff9d;

}



/* EMS 펄스 */

.ems-pulse{

width:24px;

height:24px;

border-radius:50%;

background:red;

border:3px solid white;

box-shadow:0 0 15px red;

animation:pulse 1.5s infinite;

}



@keyframes pulse{


0%{

transform:scale(.6);

opacity:1;

}


70%{

transform:scale(1.6);

opacity:.2;

}


100%{

transform:scale(.6);

opacity:1;

}


}



@media(max-width:768px){


#container{

flex-direction:column;

}


#panel{

width:100%;

max-height:35vh;

}


#map{

height:65vh;

}


}


</style>

</head>



<body>


<header>

🛰 SEARCH AND RESCUE AI MAP

</header>




<div id="container">


<div id="panel">


<input id="name"
placeholder="RESCUE ID">



<button id="startBtn"
onclick="start()"
disabled>

START

</button>



<button onclick="goMyLocation()">

📍 MY LOCATION

</button>



<button onclick="shareLocation()">

📡 위치 공유

</button>



<button onclick="sendSOS()">

🚨 SOS

</button>



<button onclick="stopTracking()">

⛔ STOP

</button>



<button onclick="loadAllHistory()">

📦 전체 기록

</button>



</div>



<div id="map"></div>



</div>





<script>


// ================= API =================


const API_URL =

"YOUR_RESCUE_API_URL";



const EMS_API =

"YOUR_EMS_API_URL";



const GRAPHHOPPER_KEY =

"YOUR_GRAPH_HOPPER_KEY";





// ================= DEVICE =================


let DEVICE_ID =

localStorage.getItem("DEVICE_ID");



if(!DEVICE_ID){


DEVICE_ID=

crypto.randomUUID();



localStorage.setItem(

"DEVICE_ID",

DEVICE_ID

);


}





// ================= MAP =================


const map =

L.map("map")

.setView(

[35.1239,126.9883],

13

);





// ================= TILE =================


const osm =

L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"

);



const topo =

L.tileLayer(

"https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png"

);



const satellite =

L.tileLayer(

"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"

);



osm.addTo(map);




L.control.layers({


"🗺 일반지도":osm,


"⛰ 지형지도":topo,


"🛰 위성지도":satellite


})

.addTo(map);





// ================= DRAW =================


const drawnItems =

new L.FeatureGroup();



map.addLayer(

drawnItems

);



const drawControl =

new L.Control.Draw({


position:"topright",



draw:{


polygon:true,


rectangle:true,


circle:true,


marker:true,


polyline:true,


circlemarker:false


},



edit:{


featureGroup:drawnItems,


remove:true


}



});



map.addControl(drawControl);





map.on(

L.Draw.Event.CREATED,

e=>{


drawnItems.addLayer(

e.layer

);


});

// ================= LAYER =================


const rescueLayer =

L.layerGroup()

.addTo(map);



const emsLayer =

L.layerGroup()

.addTo(map);



const rescueRouteLayer =

L.layerGroup()

.addTo(map);



const sosLayer =

L.layerGroup()

.addTo(map);



const historyMarkers =

L.layerGroup()

.addTo(map);



const historyLines =

L.layerGroup()

.addTo(map);




// 신고별 경로 저장

const rescueRoutes = {};


// 신고별 ETA 표시

const routeInfoMarkers = {};




// ================= STATE =================


let myName="";

let lastPos=null;

let watchId=null;

let intervalSend=null;

let intervalLoad=null;

let intervalEMS=null;


let startTime="";

let endTime="";




// ================= MARKER =================


const markers={};


const rescueColors={};



const colors=[


"#00ff9d",

"#00aaff",

"#ffcc00",

"#ff00ff",

"#ff6600",

"#ffffff"


];




function getColor(name){


if(!rescueColors[name]){


rescueColors[name]=

colors[

Object.keys(rescueColors).length

%

colors.length

];


}


return rescueColors[name];


}





// ================= INPUT =================


const nameInput =

document.getElementById("name");



const startBtn =

document.getElementById("startBtn");





nameInput.addEventListener(

"input",

()=>{


startBtn.disabled =

nameInput.value.trim().length===0;



}

);





// ================= TIME =================


function getNowTime(){


const now=new Date();



return (

now.getFullYear()

+"-"

+String(now.getMonth()+1).padStart(2,"0")

+"-"

+String(now.getDate()).padStart(2,"0")

+" "

+String(now.getHours()).padStart(2,"0")

+":"

+String(now.getMinutes()).padStart(2,"0")

+":"

+String(now.getSeconds()).padStart(2,"0")

);


}





// ================= START =================


function start(){


myName =

nameInput.value.trim();



if(!myName){


alert("UNIT ID required");

return;


}



startTime=

getNowTime();


endTime="";


nameInput.disabled=true;

startBtn.disabled=true;





watchId =

navigator.geolocation.watchPosition(



pos=>{


lastPos={


name:myName,


device:DEVICE_ID,


lat:pos.coords.latitude,


lng:pos.coords.longitude,


status:"normal"


};



},



err=>{


alert(

"GPS 권한 확인 필요"

);



},



{


enableHighAccuracy:true,


maximumAge:1000,


timeout:10000


}



);





intervalSend =

setInterval(

sendData,

5000

);



intervalLoad =

setInterval(

loadLive,

3000

);



}






// ================= SEND =================


function sendData(){



if(!lastPos)

return;




fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":"text/plain"


},



body:JSON.stringify({


...lastPos,


startTime:startTime,


endTime:endTime


})


}


);



}








// ================= LIVE LOAD =================


function loadLive(){



fetch(

API_URL

+"?live=1&t="

+Date.now()

)



.then(r=>r.json())

.then(renderLive)

.catch(console.log);



}






// ================= LIVE RENDER =================


function renderLive(data){


sosLayer.clearLayers();



data.forEach(p=>{



const lat=

Number(p.lat);



const lng=

Number(p.lng);




if(

!Number.isFinite(lat)

||

!Number.isFinite(lng)

)

return;




const key=p.name;


const pos=[lat,lng];






// 구조대 마커 생성


if(!markers[key]){


markers[key]=


L.circleMarker(

pos,

{


radius:10,


color:getColor(key),


fillColor:getColor(key),


fillOpacity:1,


weight:3



}

)



.bindTooltip(

p.name,

{


permanent:true,


direction:"top",


className:"name-label"


}


)



.addTo(rescueLayer);



}

else{


markers[key]

.setLatLng(pos);



}







// SOS 표시


if(p.status==="SOS"){



markers[key]

.setStyle({


radius:15,


color:"red",


fillColor:"red"



});





L.circle(

pos,

{


radius:60,


color:"red",


fillColor:"red",


fillOpacity:0.25


}


)

.addTo(sosLayer);



}



else if(p.status==="SHARE"){



markers[key]

.setStyle({


color:"#0088ff",


fillColor:"#0088ff"


});



}



else{



markers[key]

.setStyle({


color:getColor(key),


fillColor:getColor(key)


});



}



});


}


// ================= EMS =================


const emsMarkers={};

const emsPulseMarkers={};





// ================= EMS ICON =================


function getEMSIcon(status){


let color="red";


if(status==="출동")

color="orange";


if(status==="완료")

color="green";


if(status==="취소")

color="gray";




return L.divIcon({


className:"",



html:

`

<div style="

font-size:32px;

filter:drop-shadow(0 0 8px ${color});

">

🚑

</div>

`,



iconSize:[35,35]



});


}







// ================= EMS LOAD =================


function loadEMS(){


fetch(

EMS_API

+"?t="

+Date.now()

)



.then(r=>r.json())

.then(renderEMS)

.catch(console.log);



}








// ================= EMS RENDER =================


function renderEMS(data){



const active={};



data.forEach(item=>{



const lat=

Number(item.lat);



const lng=

Number(item.lng);




if(

!Number.isFinite(lat)

||

!Number.isFinite(lng)

)

return;





const key=item.id;


active[key]=true;



const pos=[lat,lng];







// 🚑 신고 위치 표시


if(!emsMarkers[key]){


emsMarkers[key]=


L.marker(

pos,

{


icon:getEMSIcon(item.status)

}


)



.bindPopup(

`

<div style="font-family:monospace">


<b>🚑 119 신고</b>

<br><br>


📌 사고유형 :

${item.type}


<br><br>


📍 주소 :

${item.address}


<br><br>


📡 상태 :

${item.status}


<br><br>


⏰ 접수 :

${item.time}



</div>

`

)



.addTo(emsLayer);



}

else{


emsMarkers[key]

.setLatLng(pos);



emsMarkers[key]

.setIcon(

getEMSIcon(item.status)

);



}








// 🔴 EMS 펄스


if(

item.status!=="완료"

&&

item.status!=="취소"

){



if(!emsPulseMarkers[key]){



emsPulseMarkers[key]=


L.marker(

pos,

{


icon:L.divIcon({


className:"",


html:

`

<div class="ems-pulse"></div>

`,


iconSize:[30,30]


}),



interactive:false



}



)



.addTo(emsLayer);



}

else{


emsPulseMarkers[key]

.setLatLng(pos);



}



}

else{



if(emsPulseMarkers[key]){


emsLayer.removeLayer(

emsPulseMarkers[key]

);



delete emsPulseMarkers[key];


}


}





// 신고별 AI 경로 계산

drawRescueRoute({


id:key,


lat:lat,


lng:lng



});




});







// 삭제 신고 제거


Object.keys(emsMarkers)

.forEach(key=>{


if(!active[key]){


emsLayer.removeLayer(

emsMarkers[key]

);


delete emsMarkers[key];



if(emsPulseMarkers[key]){


emsLayer.removeLayer(

emsPulseMarkers[key]

);


delete emsPulseMarkers[key];


}


}



});



}







// ================= EMS 자동 실행 =================


loadEMS();


intervalEMS =

setInterval(

loadEMS,

3000

);








// ================= GRAPH HOPPER ETA =================


function getGHRoute(

startLat,

startLng,

endLat,

endLng,

vehicle

){



const url =

"https://graphhopper.com/api/1/route?"

+

`point=${startLat},${startLng}`

+

`&point=${endLat},${endLng}`

+

`&vehicle=${vehicle}`

+

"&points_encoded=false"

+

"&instructions=false"

+

`&key=${GRAPHHOPPER_KEY}`;





return fetch(url)

.then(r=>r.json())

.then(data=>{



if(

!data.paths

||

!data.paths.length

)

return null;



const path=data.paths[0];



return {


distance:path.distance,


duration:path.time,


geometry:path.points.coordinates



};



})

.catch(e=>{


console.log(e);


return null;



});



}







// ================= 차량 + 도보 ETA =================


function getRescueETA(ems,rescue){



return Promise.all([



getGHRoute(

ems.lat,

ems.lng,

rescue.lat,

rescue.lng,

"car"

),



getGHRoute(

ems.lat,

ems.lng,

rescue.lat,

rescue.lng,

"foot"

)



])

.then(result=>{


return {


car:result[0],


walk:result[1]



};



});



}








// ================= 산악/재난 지역 체크 =================


function checkTerrain(lat,lng){



return fetch(

`https://api.open-elevation.com/api/v1/lookup?locations=${lat},${lng}`

)



.then(r=>r.json())

.then(data=>{



const elevation =

data.results[0].elevation;



if(elevation > 300){


return "MOUNTAIN";


}



return "NORMAL";



})

.catch(()=>{


return "UNKNOWN";


});



}

// ================= AI 구조대 배정 =================
// 차량 + 도보 + 산악 점수 기반


function findFastestRescue(ems){



const candidates=[];




// 현재 접속 구조대 목록

Object.keys(markers)

.forEach(name=>{



const pos =

markers[name].getLatLng();



candidates.push({


name:name,


lat:pos.lat,


lng:pos.lng



});



});






if(!candidates.length)

return Promise.resolve(null);







// 후보별 ETA 계산

const jobs = candidates.map(async rescue=>{



// 차량/도보 ETA

const eta =

await getRescueETA(

ems,

rescue

);






if(!eta.car)

return null;







// 산악 여부

const terrain =

await checkTerrain(

rescue.lat,

rescue.lng

);







// 차량 시간(분)

const carMin =

eta.car.duration / 60000;





// 도보 시간(분)

const walkMin =

eta.walk

?

eta.walk.duration / 60000

:

999;






// 산악 패널티

let mountainPenalty = 0;



if(terrain==="MOUNTAIN"){


mountainPenalty = 30;


}





// AI 점수

// 낮을수록 우선


const score =



(carMin * 0.5)

+

(walkMin * 0.2)

+

(mountainPenalty * 0.3);








return {


name:rescue.name,


lat:rescue.lat,


lng:rescue.lng,



terrain:terrain,


eta:eta,


score:score



};




});









return Promise.all(jobs)

.then(results=>{



const valid =

results.filter(r=>r);



if(!valid.length)

return null;







// AI 점수 낮은 순 정렬


valid.sort(

(a,b)=>

a.score-b.score

);






return valid[0];



});



}  


// ================= 신고별 AI 경로 표시 =================


function drawRescueRoute(ems){



if(!ems.id)

return;





// 기존 경로 삭제


if(rescueRoutes[ems.id]){


rescueRouteLayer.removeLayer(

rescueRoutes[ems.id]

);


delete rescueRoutes[ems.id];

}




if(routeInfoMarkers[ems.id]){


rescueRouteLayer.removeLayer(

routeInfoMarkers[ems.id]

);


delete routeInfoMarkers[ems.id];


}







// AI 구조대 선택


findFastestRescue(ems)

.then(rescue=>{



if(!rescue)

return;







// ================= 경로 표시 =================


if(

!rescue.eta.car.geometry

)

return;






const coords=[];



rescue.eta.car.geometry.forEach(p=>{



coords.push([


p[1],


p[0]


]);



});







// 🚑 차량 도로 경로


const line =

L.polyline(

coords,

{


color:"red",


weight:6,


opacity:0.9,


dashArray:"15,10"



}

);



line.addTo(

rescueRouteLayer

);



rescueRoutes[ems.id]=line;









// ================= ETA 정보 =================


const carMin =

Math.ceil(

rescue.eta.car.duration / 60000

);




let walkText="없음";



if(rescue.eta.walk){


walkText =

Math.ceil(

rescue.eta.walk.duration / 60000

)

+

"분";



}








const km =

(

rescue.eta.car.distance

/

1000

)

.toFixed(2);









// ================= AI 정보 표시 =================


const info =

L.marker(



[



(

ems.lat

+

rescue.lat

)

/

2,



(

ems.lng

+

rescue.lng

)

/

2



],



{


icon:L.divIcon({



className:"",



html:

`

<div style="

background:#050b18;

color:#00ff9d;

border:2px solid red;

padding:10px;

border-radius:10px;

font-size:13px;

box-shadow:0 0 12px red;

white-space:nowrap;

">



🤖 AI 출동팀

<br><br>


🚑 ${rescue.name}


<br>


📍 지역 :

${rescue.terrain}


<br>


📏 거리 :

${km} km


<br>


🚗 차량 :

${carMin}분


<br>


🚶 도보 :

${walkText}


<br>


🧠 점수 :

${rescue.score.toFixed(1)}



</div>

`



})



}



);







info.addTo(

rescueRouteLayer

);



routeInfoMarkers[ems.id]=info;







console.log(

"AI 출동 배정",

rescue

);



});



}

// ================= 위치 공유 =================


function shareLocation(){



if(!lastPos){


alert(

"현재 위치가 없습니다."

);


return;


}





const url =

`https://www.google.com/maps?q=${lastPos.lat},${lastPos.lng}`;





const text =

`

📡 구조대 위치공유


UNIT :

${lastPos.name}



위치:

${url}

`;







fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":"text/plain"


},



body:JSON.stringify({


...lastPos,


status:"SHARE"



})



}



);






if(navigator.share){



navigator.share({


title:"구조대 위치",


text:text,


url:url



})

.catch(console.log);



}

else{


location.href=

"sms:?body="

+

encodeURIComponent(text);



}



}









// ================= SOS =================


function sendSOS(){



if(!lastPos){


alert(

"현재 위치가 없습니다."

);


return;


}







fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":"text/plain"


},



body:JSON.stringify({


...lastPos,


startTime:startTime,


endTime:endTime,


status:"SOS"


})



}



);







alert(

"🚨 SOS 전송 완료"

);



}









// ================= STOP =================


function stopTracking(){



endTime=

getNowTime();






if(lastPos){



fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":"text/plain"


},



body:JSON.stringify({


...lastPos,


startTime:startTime,


endTime:endTime,


status:"STOP"



})



}



);



}








if(watchId){


navigator.geolocation.clearWatch(

watchId

);


watchId=null;



}







clearInterval(

intervalSend

);



clearInterval(

intervalLoad

);



clearInterval(

intervalEMS

);







intervalSend=null;

intervalLoad=null;

intervalEMS=null;






lastPos=null;


myName="";


startTime="";


endTime="";







nameInput.disabled=false;


nameInput.value="";


startBtn.disabled=true;







alert(

"⛔ STOP 완료"

);



}











// ================= MY LOCATION =================


function goMyLocation(){



if(!lastPos)

return;





map.setView(

[

lastPos.lat,

lastPos.lng

],

16

);



}












// ================= 전체 기록 =================


function loadAllHistory(){



fetch(

API_URL

+

"?history=1&t="

+

Date.now()

)



.then(r=>r.json())

.then(showHistoryMap);



}











// ================= HISTORY MAP =================


function showHistoryMap(data){



historyMarkers.clearLayers();


historyLines.clearLayers();





const grouped={};





data.sort(

(a,b)=>

new Date(a.time)

-

new Date(b.time)

);








data.forEach(d=>{



if(!grouped[d.name])

grouped[d.name]=[];





grouped[d.name].push([


Number(d.lat),


Number(d.lng)



]);



});









const allPoints=[];







for(const name in grouped){



const path=

grouped[name];



if(!path.length)

continue;







allPoints.push(...path);






// 이동 경로


L.polyline(

path,

{


color:getColor(name),


weight:5,


opacity:0.8



}

)

.addTo(historyLines);









// 시작 위치


L.marker(

path[0]

)

.bindPopup(

"🟢 START : "

+

name

)

.addTo(historyMarkers);







// 종료 위치


L.marker(

path[path.length-1]

)

.bindPopup(

"🔴 END : "

+

name

)

.addTo(historyMarkers);



}








if(allPoints.length){



map.fitBounds(


allPoints,


{


padding:[50,50]


}



);



}



}









// ================= 페이지 시작 =================



loadLive();


loadEMS();

  
</script>

</body>

</html>

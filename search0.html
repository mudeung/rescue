<head>

<style>


body{

margin:0;

color:#00ff9d;

select{

<body>


<header>

🛰 SEARCH AND RESCUE AI MAP

</header>



<div id="container">


<div id="panel">


<input id="name"
placeholder="RESCUE ID">



<button id="startBtn"
onclick="start()"

START

</button>

📍 MY LOCATION

</button>

<script>


// ================= API =================


const API_URL =

"https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";



const EMS_API =

"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";



const GRAPHHOPPER_KEY =

"6f1dbbf6-0546-4b11-a9c8-8d8134dff43c";





// ================= DEVICE =================


let DEVICE_ID =

localStorage.getItem("DEVICE_ID");



if(!DEVICE_ID){


DEVICE_ID=crypto.randomUUID();


localStorage.setItem(
"DEVICE_ID",
DEVICE_ID
);


}





// ================= MAP =================


const map =

L.map("map")

.setView(

[35.1239,126.9883],

13

);






// ================= TILE =================


const osm =

L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"

);



const topo =

L.tileLayer(

"https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png"

);



const satellite =

L.tileLayer(

"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"

);



osm.addTo(map);




L.control.layers({


"🗺 일반지도":osm,


"⛰ 지형지도":topo,


"🛰 위성지도":satellite


})

.addTo(map);






// ================= DRAW =================


const drawnItems =

new L.FeatureGroup();


map.addLayer(drawnItems);



const drawControl =

new L.Control.Draw({


position:"topright",


draw:{


polygon:true,

rectangle:true,

circle:true,

marker:true,

polyline:true,

circlemarker:false


},


edit:{


featureGroup:drawnItems,

remove:true


}


});



map.addControl(drawControl);





map.on(

L.Draw.Event.CREATED,

e=>{


drawnItems.addLayer(e.layer);


});






// ================= LAYER =================



const rescueLayer =

L.layerGroup()

.addTo(map);



const emsLayer =

L.layerGroup()

.addTo(map);



const carRouteLayer =
L.layerGroup()
.addTo(map);


const footRouteLayer =
L.layerGroup()
.addTo(map);


const infoRouteLayer =
L.layerGroup()
.addTo(map);

const carRoutes={};
const footRoutes={};

const sosLayer =

L.layerGroup()

.addTo(map);



const historyMarkers =

L.layerGroup()

.addTo(map);



const historyLines =

L.layerGroup()

.addTo(map);




function toggleCarRoute(){

showCarRoute=!showCarRoute;


document.getElementById("carBtn").innerHTML =
showCarRoute
?
"🚑 차량 경로 ON"
:
"🚑 차량 경로 OFF";



if(showCarRoute){

map.addLayer(carRouteLayer);

}else{

map.removeLayer(carRouteLayer);

}

}




function toggleFootRoute(){

showFootRoute=!showFootRoute;


document.getElementById("footBtn").innerHTML =
showFootRoute
?
"🚶 도보 경로 ON"
:
"🚶 도보 경로 OFF";



if(showFootRoute){

map.addLayer(footRouteLayer);

}else{

map.removeLayer(footRouteLayer);

}

}

  
// ================= ROUTE =================


let showCarRoute=true;

let showFootRoute=true;


// 차량/도보 경로 저장
const carRoutes={};

const footRoutes={};


// AI 선택 결과 저장
let selectedRouteCache={};


// 기존 선택 경로 저장
const rescueRoutes={};


// ETA 정보 표시
const routeInfoMarkers={};





// ================= MARKER =================


const markers={};


const rescueColors={};



const colors=[

"#00ff9d",

"#00aaff",

"#ffcc00",

"#ff00ff",

"#ff6600",

"#ffffff"

];




function getColor(name){


if(!rescueColors[name]){


rescueColors[name]=

colors[

Object.keys(rescueColors).length

%

colors.length

];


}


return rescueColors[name];


}






// ================= INPUT =================


const nameInput =

document.getElementById("name");



const startBtn =

document.getElementById("startBtn");



nameInput.addEventListener(

"input",

()=>{


startBtn.disabled =

nameInput.value.trim().length===0;


}

);





document
.getElementById("routeMode")
.addEventListener(
"change",
function(){


routeMode=this.value;



// 기존 경로 삭제

carRouteLayer.clearLayers();

footRouteLayer.clearLayers();

infoRouteLayer.clearLayers();


Object.keys(emsMarkers).forEach(id=>{


const marker=emsMarkers[id];

const pos=marker.getLatLng();



if(

!selectedRouteCache[key]

||

selectedRouteCache[key].mode!==routeMode

){

drawRescueRoute({

id:key,

lat:lat,

lng:lng

});

}


});



});



// ================= STATE =================


let myName="";

let lastPos=null;

let watchId=null;

let intervalSend=null;

let intervalLoad=null;

let intervalEMS=null;


let startTime="";

let endTime="";




// ================= TIME =================


function getNowTime(){


const now=new Date();


return (

now.getFullYear()

+"-"

+String(now.getMonth()+1).padStart(2,"0")

+"-"

+String(now.getDate()).padStart(2,"0")

+" "

+String(now.getHours()).padStart(2,"0")

+":"

+String(now.getMinutes()).padStart(2,"0")

+":"

+String(now.getSeconds()).padStart(2,"0")

);


}






// ================= START =================


function start(){


myName=nameInput.value.trim();



if(!myName){

alert("UNIT ID required");

return;

}



startTime=getNowTime();

endTime="";


nameInput.disabled=true;

startBtn.disabled=true;





watchId=navigator.geolocation.watchPosition(



pos=>{


lastPos={


name:myName,

device:DEVICE_ID,

lat:pos.coords.latitude,

lng:pos.coords.longitude,

status:"normal"


};



},



err=>{


alert("GPS 권한 확인 필요");


},



{


enableHighAccuracy:true,

maximumAge:1000,

timeout:10000


}



);





intervalSend=setInterval(

sendData,

5000

);



intervalLoad=setInterval(

loadLive,

3000

);



}






// ================= SEND =================


function sendData(){


if(!lastPos)

return;



fetch(

API_URL,

{


method:"POST",


headers:{


"Content-Type":"text/plain"

},



body:JSON.stringify({


...lastPos,


startTime:startTime,


endTime:endTime


})


}


);



}








// ================= LIVE LOAD =================


function loadLive(){


fetch(

API_URL

+"?live=1&t="

+Date.now()

)



.then(r=>r.json())

.then(renderLive)

.catch(console.log);



}






// ================= LIVE RENDER =================


function renderLive(data){


sosLayer.clearLayers();



data.forEach(p=>{



const lat=Number(p.lat);

const lng=Number(p.lng);



if(

!Number.isFinite(lat)

||

!Number.isFinite(lng)

)

return;



const key=p.name;


const pos=[lat,lng];





if(!markers[key]){


markers[key]=


L.circleMarker(

pos,

{


radius:10,


color:getColor(key),


fillColor:getColor(key),


fillOpacity:1,


weight:3


}


)



.bindTooltip(

p.name,

{


permanent:true,

direction:"top",

className:"name-label"


}

)



.addTo(rescueLayer);



}

else{


markers[key].setLatLng(pos);


}






if(p.status==="SOS"){


markers[key].setStyle({


radius:15,

color:"red",

fillColor:"red"


});



L.circle(

pos,

{


radius:60,

color:"red",

fillColor:"red",

fillOpacity:.25


}

)

.addTo(sosLayer);



}

else if(p.status==="SHARE"){


markers[key].setStyle({


color:"#0088ff",

fillColor:"#0088ff"


});


}

else{


markers[key].setStyle({


color:getColor(key),

fillColor:getColor(key)


});


}



});



}









// ================= EMS =================


const emsMarkers={};

const emsPulseMarkers={};





function getEMSIcon(status){


let color="red";


if(status==="출동")

color="orange";


if(status==="완료")

color="green";


if(status==="취소")

color="gray";



return L.divIcon({


className:"",


html:

`

<div style="

font-size:32px;

filter:drop-shadow(0 0 8px ${color});

">

🚑

</div>

`,


iconSize:[35,35]


});


}







function loadEMS(){


fetch(

EMS_API

+"?t="

+Date.now()

)



.then(r=>r.json())

.then(renderEMS)

.catch(console.log);



}






function renderEMS(data){



const active={};



data.forEach(item=>{



const lat=Number(item.lat);

const lng=Number(item.lng);



if(

!Number.isFinite(lat)

||

!Number.isFinite(lng)

)

return;




const key=item.id;


active[key]=true;



const pos=[lat,lng];





if(!emsMarkers[key]){


emsMarkers[key]=


L.marker(

pos,

{


icon:getEMSIcon(item.status)


}

)



.bindPopup(

`

<div style="font-family:monospace">


<b>🚑 119 신고</b>

<br><br>


📌 ${item.type}

<br><br>


📍 ${item.address}

<br><br>


📡 ${item.status}


<br><br>


⏰ ${item.time}


</div>

`

)



.addTo(emsLayer);



}

else{


emsMarkers[key].setLatLng(pos);


emsMarkers[key].setIcon(

getEMSIcon(item.status)

);


}





if(

item.status!=="완료"

&&

item.status!=="취소"

){



if(!emsPulseMarkers[key]){


emsPulseMarkers[key]=


L.marker(

pos,

{


icon:L.divIcon({


className:"",


html:

`

<div class="ems-pulse"></div>

`,

iconSize:[30,30]


}),


interactive:false


}

)


.addTo(emsLayer);



}

else{


emsPulseMarkers[key].setLatLng(pos);


}



}



drawRescueRoute({

id:key,

lat:lat,

lng:lng


});



});



}









// ================= GRAPHHOPPER =================


function getGHRoute(

startLat,

startLng,

endLat,

endLng,

vehicle

){


const url=

"https://graphhopper.com/api/1/route?"

+

`point=${startLat},${startLng}`

+

`&point=${endLat},${endLng}`

+

`&vehicle=${vehicle}`

+

"&points_encoded=false"

+

"&instructions=false"

+

`&key=${GRAPHHOPPER_KEY}`;





return fetch(url)

.then(r=>r.json())

.then(data=>{


if(

!data.paths

||

!data.paths.length

)

return null;



const path=data.paths[0];



return {


distance:path.distance,


duration:path.time,


geometry:path.points.coordinates


};



})


.catch(()=>null);



}







function getRescueETA(ems,rescue){


return Promise.all([



getGHRoute(

ems.lat,

ems.lng,

rescue.lat,

rescue.lng,

"car"

),



getGHRoute(

ems.lat,

ems.lng,

rescue.lat,

rescue.lng,

"foot"

)



])


.then(r=>{


return {


car:r[0],


walk:r[1]


};


});



}






// ================= AI 구조대 선택 =================


function findFastestRescue(ems){



const candidates=[];



Object.keys(markers)

.forEach(name=>{


const pos=markers[name].getLatLng();



candidates.push({


name:name,

lat:pos.lat,

lng:pos.lng


});



});




if(!candidates.length)

return Promise.resolve(null);




const jobs=candidates.map(async rescue=>{


const eta=

await getRescueETA(

ems,

rescue

);



if(!eta.car)

return null;



const carMin=

eta.car.duration/60000;



const walkMin=

eta.walk

?

eta.walk.duration/60000

:

999;



const score=

(carMin*0.5)

+

(walkMin*0.2);



return {


name:rescue.name,

lat:rescue.lat,

lng:rescue.lng,

eta:eta,

score:score


};



});





return Promise.all(jobs)

.then(result=>{


const valid=result.filter(x=>x);


valid.sort(

(a,b)=>a.score-b.score

);



return valid[0] || null;



});



}




// ================= AI 경로 표시 =================


function drawRescueRoute(ems){


if(!ems.id)

return;



if(rescueRoutes[ems.id]){


rescueRouteLayer.removeLayer(

rescueRoutes[ems.id]

);


delete rescueRoutes[ems.id];

}



if(routeInfoMarkers[ems.id]){


rescueRouteLayer.removeLayer(

routeInfoMarkers[ems.id]

);


delete routeInfoMarkers[ems.id];

}




findFastestRescue(ems)

.then(rescue=>{


if(!rescue)

return;



// 현재 선택 방식 저장

selectedRouteCache[ems.id]={

mode:routeMode,

rescue:rescue

};


if(!rescue)

return;




// 차량 경로

if(showCarRoute && rescue.eta.car){


const carCoords=[];



rescue.eta.car.geometry.forEach(p=>{


carCoords.push([

p[1],

p[0]

]);


});



L.polyline(

carCoords,

{

color:"red",

weight:6,

dashArray:"15,10"

}

)

.addTo(carRouteLayer);



}






// 도보 경로

if(showFootRoute && rescue.eta.walk){



const footCoords=[];



rescue.eta.walk.geometry.forEach(p=>{


footCoords.push([

p[1],

p[0]

]);


});




L.polyline(

footCoords,

{


color:"#00aaff",

weight:5,


dashArray:"5,10"


}

)

.addTo(footRouteLayer);



}




if(

!selectedRoute

||

!selectedRoute.geometry

)

return;





const coords=[];



selectedRoute.geometry.forEach(p=>{


coords.push([

p[1],

p[0]

]);


});






const line=L.polyline(

coords,

{


color:

routeMode==="car"

?

"red"

:

"#00aaff",


weight:6,


opacity:.9,


dashArray:"15,10"


}

);



line.addTo(rescueRouteLayer);



rescueRoutes[ems.id]=line;






const selectedMin=Math.ceil(

selectedRoute.duration/60000

);



const km=(

selectedRoute.distance/1000

).toFixed(2);






const info=L.marker(

[

(ems.lat+rescue.lat)/2,

(ems.lng+rescue.lng)/2

],

{


icon:L.divIcon({


className:"",


html:

`

<div style="

background:#050b18;

color:#00ff9d;

border:2px solid ${routeMode==="car"?"red":"#00aaff"};

padding:10px;

border-radius:10px;

font-size:13px;

box-shadow:0 0 12px ${routeMode==="car"?"red":"#00aaff"};

white-space:nowrap;

">


🤖 AI 출동팀


<br><br>


🚑 ${rescue.name}


<br>


📡 방식 :

${routeMode==="car"?"🚗 차량":"🚶 도보"}


<br>


📏 거리 :

${km} km


<br>


⏱ ETA :

${selectedMin}분


<br>


🧠 점수 :

${rescue.score.toFixed(1)}


</div>

`

})

}



);



info.addTo(rescueRouteLayer);


routeInfoMarkers[ems.id]=info;



});



}







// ================= 위치 공유 =================


function shareLocation(){



if(!lastPos){

alert("현재 위치가 없습니다.");

return;

}



const url=

`https://www.google.com/maps?q=${lastPos.lat},${lastPos.lng}`;



const text=

`

📡 구조대 위치공유


UNIT :

${lastPos.name}



위치:

${url}

`;





fetch(

API_URL,

{


method:"POST",

headers:{


"Content-Type":"text/plain"

},


body:JSON.stringify({


...lastPos,


status:"SHARE"


})


}

);





if(navigator.share){


navigator.share({


title:"구조대 위치",

text:text,

url:url


})

.catch(console.log);



}

else{


location.href=

"sms:?body="

+

encodeURIComponent(text);


}



}

// ================= STOP =================


function stopTracking(){



endTime=getNowTime();





if(lastPos){



fetch(

API_URL,

{


method:"POST",

headers:{


"Content-Type":"text/plain"

},


body:JSON.stringify({


...lastPos,


startTime:startTime,


endTime:endTime,


status:"STOP"


})


}


);


}





if(watchId){


navigator.geolocation.clearWatch(

watchId

);


watchId=null;


}





clearInterval(intervalSend);

clearInterval(intervalLoad);

clearInterval(intervalEMS);



intervalSend=null;

intervalLoad=null;

intervalEMS=null;




lastPos=null;


myName="";


startTime="";


endTime="";



nameInput.disabled=false;


nameInput.value="";


startBtn.disabled=true;



alert(

"⛔ STOP 완료"

);



}

map.setView(

// ================= HISTORY =================


function loadAllHistory(){



fetch(

API_URL

+

"?history=1&t="

+

Date.now()

)



.then(r=>r.json())

.then(showHistoryMap);



}






function showHistoryMap(data){



historyMarkers.clearLayers();


historyLines.clearLayers();



const grouped={};



data.sort(

(a,b)=>

new Date(a.time)-new Date(b.time)

);




data.forEach(d=>{


if(!grouped[d.name])

grouped[d.name]=[];



grouped[d.name].push([


Number(d.lat),


Number(d.lng)


]);



});





const allPoints=[];




for(const name in grouped){



const path=grouped[name];


if(!path.length)

continue;



allPoints.push(...path);





L.polyline(

path,

{


color:getColor(name),


weight:5,


opacity:.8


}

)

.addTo(historyLines);







L.marker(path[0])

.bindPopup(

"🟢 START : "

+

name

)

.addTo(historyMarkers);






L.marker(path[path.length-1])

.bindPopup(

"🔴 END : "

+

name

)

.addTo(historyMarkers);



}





if(allPoints.length){



map.fitBounds(

allPoints,

{


padding:[50,50]


}

);



}



}








// ================= PAGE START =================



loadLive();


loadEMS();



intervalEMS=setInterval(

loadEMS,

3000

);


</script>

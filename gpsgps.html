<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📍 실시간 위치공유</title>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424"></script>

<style>
body, html { margin:0; padding:0; height:100%; font-family: Arial; }
#map { width:100%; height:100%; }

#onlineCount {
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  background:#000;
  color:#fff;
  padding:8px 14px;
  border-radius:20px;
  font-size:14px;
  z-index:30;
}

#shareBtn {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#007aff;
  color:#fff;
  font-weight:bold;
  z-index:20;
}

#userList {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  width: 92%;
  max-height: 45vh;
  overflow-y: auto;
  z-index: 15;
}

.user-card {
  background: #fff;
  margin-bottom: 10px;
  padding: 16px;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  font-size: 15px;
  cursor: pointer;
}

.top1 { border:2px solid gold; }
.top2 { border:2px solid silver; }
.top3 { border:2px solid #cd7f32; }

.user-name { font-weight:bold; }
.user-coord { font-size:12px; color:#555; }
.user-distance { margin-top:6px; color:#007aff; font-weight:bold; }
</style>
</head>

<body>

<div id="onlineCount">접속자 0명</div>
<button id="shareBtn">내위치 공유</button>
<div id="userList"></div>
<div id="map"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzpNNxNK7Zcj6ZbKlPDNr0Lz7hG_o0IPlCIEtvWnQe8uJyPIQPluGe8wcnox_2pAcSE/exec";

const ALERT_DISTANCE = 0.3;
const TIMEOUT = 30000;

let myId;
let map, myMarker, markers = {};
let myLat, myLng;

let lastSent = 0;
let lastLat, lastLng;

let fetchInterval = 5000;
let fetchTimer;

let alertedUsers = {};

/* 이름 */
async function getName(){
  let name = localStorage.getItem("myId");
  if(!name){
    name = prompt("이름 입력");
    localStorage.setItem("myId", name);
  }
  myId = name;
}

/* 지도 */
function initMap(lat,lng){
  const center = new kakao.maps.LatLng(lat,lng);
  map = new kakao.maps.Map(document.getElementById('map'), {center, level:4});
  myMarker = new kakao.maps.Marker({map, position:center});
}

/* 거리 계산 */
function getDistance(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*(2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

/* 이동 거리 */
function getMoveDistance(lat,lng){
  if(!lastLat) return 999;
  return getDistance(lat,lng,lastLat,lastLng);
}

/* 🔔 근접 알림 */
function checkDistanceAlert(user){
  if(user.dist > ALERT_DISTANCE){
    alertedUsers[user.id] = false;
    return;
  }

  if(alertedUsers[user.id]) return;
  alertedUsers[user.id] = true;

  if(Notification.permission === "granted"){
    new Notification("📍 근처!", {
      body: `${user.id} ${Math.round(user.dist*1000)}m`
    });
  }

  navigator.vibrate?.([200,100,200]);
}

/* 전송 */
function sendLocation(){
  fetch(GAS_URL,{
    method:"POST",
    body:JSON.stringify({
      id:myId,
      lat:myLat,
      lng:myLng,
      time:Date.now()
    }),
    keepalive:true
  }).catch(()=>{});
}

/* 스마트 전송 */
function smartSend(){
  const now = Date.now();
  const dist = getMoveDistance(myLat,myLng);

  if(dist < 0.01 && now - lastSent < 15000) return;

  if(dist > 0.1){
    lastSent = now;
    sendLocation();
  }
  else if(now - lastSent > 5000){
    lastSent = now;
    sendLocation();
  }

  lastLat = myLat;
  lastLng = myLng;
}

/* 사용자 조회 */
function fetchUsers(){
  fetch(GAS_URL)
  .then(res=>res.json())
  .then(users=>{

    let html = "";
    let arr = [];
    let onlineCount = 0;

    for(let id in users){
      if(id===myId) continue;

      const u = users[id];
      const diff = Date.now() - u.time;

      if(diff > TIMEOUT) continue;

      if(diff < 10000) onlineCount++;

      const dist = getDistance(myLat,myLng,u.lat,u.lng);
      arr.push({id, ...u, dist, diff});
    }

    arr.sort((a,b)=>a.dist-b.dist);

    arr.forEach((u,idx)=>{

      checkDistanceAlert(u);

      const pos = new kakao.maps.LatLng(u.lat,u.lng);

      if(!markers[u.id]){
        markers[u.id] = new kakao.maps.Marker({map, position:pos});
      }

      markers[u.id].setPosition(pos);

      let rank="";
      if(idx===0) rank="top1";
      else if(idx===1) rank="top2";
      else if(idx===2) rank="top3";

      let status="";
      if(u.diff < 10000){
        status="🟢 실시간";
      }else if(u.diff < 20000){
        status="🟡 지연";
      }else{
        status="🔴 끊김";
      }

      html += `
        <div class="user-card ${rank}" onclick="focusUser('${u.id}')">
          <div class="user-name">${status} ${u.id}</div>
          <div class="user-coord">${u.lat.toFixed(5)}, ${u.lng.toFixed(5)}</div>
          <div class="user-distance">${u.dist.toFixed(2)} km</div>
        </div>
      `;
    });

    document.getElementById("userList").innerHTML = html;
    document.getElementById("onlineCount").innerText = `접속자 ${onlineCount}명`;
  })
  .catch(()=>{});
}

/* 클릭 */
function focusUser(id){
  const marker = markers[id];
  if(marker){
    map.setCenter(marker.getPosition());
  }
}

/* fetch 루프 */
function startFetchLoop(){
  clearInterval(fetchTimer);
  fetchTimer = setInterval(fetchUsers, fetchInterval);
}

/* 위치 추적 */
function startTracking(){
  navigator.geolocation.watchPosition(pos=>{
    myLat = pos.coords.latitude;
    myLng = pos.coords.longitude;

    const myPos = new kakao.maps.LatLng(myLat,myLng);

    if(!map) initMap(myLat,myLng);

    myMarker?.setPosition(myPos);

    smartSend();

  }, err=>{
    console.log(err);
  },{
    enableHighAccuracy:false,
    maximumAge:10000,
    timeout:15000
  });
}

/* 화면 상태 */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden"){
    fetchInterval = 15000;
  }else{
    fetchInterval = 4000;
    fetchUsers();
  }
  startFetchLoop();
});

/* 종료 */
window.addEventListener("pagehide", () => {
  navigator.sendBeacon(GAS_URL, JSON.stringify({
    id: myId,
    offline: true
  }));
});

/* 공유 */
document.getElementById("shareBtn").addEventListener("click", async () => {

  const url = location.href.split("?")[0] +
    "?user=" + encodeURIComponent(myId);

  if(navigator.share){
    await navigator.share({
      title:"실시간 위치",
      text: myId,
      url:url
    });
  }else{
    await navigator.clipboard.writeText(url);
    alert("복사됨");
  }
});

/* 실행 */
if ("Notification" in window) {
  Notification.requestPermission();
}

getName().then(()=>{
  startTracking();
  startFetchLoop();
});
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>📍 실시간 위치 공유</title>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424"></script>
<style>
#map { width:100%; height:80vh; }
#topbar {
  padding:10px;
  background:#eee;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
button {
  padding:6px 10px;
}
.online { color:green; font-weight:bold; }
.offline { color:gray; }
</style>
</head>
<body>

<div id="topbar">
  <div>
    <button onclick="moveToMyLocation()">📍 내 위치</button>
    <button onclick="toggleFollow()">🎯 따라가기: <span id="followStatus">ON</span></button>
  </div>
  <div id="status"></div>
</div>

<div id="map"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzpNNxNK7Zcj6ZbKlPDNr0Lz7hG_o0IPlCIEtvWnQe8uJyPIQPluGe8wcnox_2pAcSE/exec";
const myId = prompt("이름 입력");

let map;
let markers = {};
let infoWindows = {};
let myMarker;

let myLat, myLng;
let followMode = true;

// 지도 초기화
function initMap(lat, lng) {
  const center = new kakao.maps.LatLng(lat, lng);

  map = new kakao.maps.Map(document.getElementById('map'), {
    center: center,
    level: 4
  });

  myMarker = new kakao.maps.Marker({
    map: map,
    position: center
  });
}

// 따라가기 ON/OFF
function toggleFollow() {
  followMode = !followMode;
  document.getElementById("followStatus").innerText = followMode ? "ON" : "OFF";
}

// 내 위치 이동
function moveToMyLocation() {
  if (!myMarker) return;
  map.panTo(myMarker.getPosition());
}

// 위치 전송
function sendLocation(lat, lng) {
  fetch(GAS_URL, {
    method: "POST",
    body: JSON.stringify({ id: myId, lat, lng })
  });
}

// 사용자 표시
function fetchUsers() {
  fetch(GAS_URL)
    .then(res => res.json())
    .then(users => {

      let statusText = "";

      for (let id in users) {
        const u = users[id];
        const pos = new kakao.maps.LatLng(u.lat, u.lng);

        const now = Date.now();
        const isOnline = (now - u.time) < 10000; // 10초 기준

        const statusClass = isOnline ? "online" : "offline";

        // 내 마커
        if (id === myId) {
          if (myMarker) myMarker.setPosition(pos);
          continue;
        }

        // 마커 생성
        if (!markers[id]) {
          const marker = new kakao.maps.Marker({
            map: map,
            position: pos
          });

          markers[id] = marker;

          const infowindow = new kakao.maps.InfoWindow({
            content: `<div>${id}</div>`
          });

          kakao.maps.event.addListener(marker, 'click', function() {
            infowindow.open(map, marker);
          });
        }

        markers[id].setPosition(pos);

        // 상태 표시
        statusText += `<span class="${statusClass}">${id} (${isOnline ? "온라인" : "오프라인"})</span> / `;
      }

      document.getElementById("status").innerHTML = statusText;
    });
}

// 업데이트
function update() {
  navigator.geolocation.getCurrentPosition(pos => {
    myLat = pos.coords.latitude;
    myLng = pos.coords.longitude;

    const myPos = new kakao.maps.LatLng(myLat, myLng);

    if (!map) initMap(myLat, myLng);

    myMarker.setPosition(myPos);

    // 🔥 따라가기 ON이면 자동 이동
    if (followMode) {
      map.panTo(myPos);
    }

    sendLocation(myLat, myLng);
    fetchUsers();
  });
}

setInterval(update, 3000);
update();

</script>

</body>
</html>

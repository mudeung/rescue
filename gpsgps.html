<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>🚑 구조 위치 공유 시스템 (최종)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body { font-family: sans-serif; text-align:center; }
button { padding:12px; margin:5px; font-size:16px; }
input { padding:10px; font-size:16px; }
</style>
</head>

<body>

<!-- 역할 선택 -->
<div id="roleSelect" style="margin-top:50px;">
    <h2>🚑 역할 선택</h2>

    <button onclick="selectVictim()" style="background:red;color:white;">
        🟥 조난자 (바로 입장)
    </button>

    <div style="margin-top:20px;">
        <input type="password" id="rescuerPw" placeholder="구조대 비밀번호">
        <br>
        <button onclick="loginRescuer()" style="background:blue;color:white;">
            🟦 구조대 입장
        </button>
    </div>
</div>

<!-- 메인 UI -->
<div id="mainUI" style="display:none;">
    <button onclick="sendSOS()">🚨 SOS</button>
    <button onclick="changeRole()">🔄 역할 변경</button>
    <p id="status"></p>
    <div id="map" style="width:100%;height:400px;"></div>
</div>

<script>
const SERVER_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_URL/exec";
const RESCUER_PASSWORD = "119rescue";

let map;
let role = null;
let myId = localStorage.getItem("userId") || generateUUID();
localStorage.setItem("userId", myId);

let markers = {};
let paths = {};
let arrowMarker;

// UUID 생성
function generateUUID(){
    return 'xxxx-xxxx-4xxx-yxxx'.replace(/[xy]/g,function(c){
        let r=Math.random()*16|0,v=c=='x'?r:(r&0x3|0x8);
        return v.toString(16);
    });
}

// 초기 실행
window.onload = ()=>{
    const savedRole = localStorage.getItem("role");
    const auth = localStorage.getItem("auth");

    if(savedRole === "rescuer" && auth === "ok"){
        role = "rescuer";
        startApp();
    }
    else if(savedRole === "victim"){
        role = "victim";
        startApp();
    }
    else {
        document.getElementById("roleSelect").style.display="block";
    }
};

// 조난자 입장
function selectVictim(){
    localStorage.setItem("role","victim");
    role = "victim";
    startApp();
}

// 구조대 로그인
function loginRescuer(){
    const pw = document.getElementById("rescuerPw").value;

    if(pw === RESCUER_PASSWORD){
        localStorage.setItem("role","rescuer");
        localStorage.setItem("auth","ok");
        role = "rescuer";
        startApp();
    } else {
        alert("❌ 비밀번호 틀림");
    }
}

// 역할 변경
function changeRole(){
    localStorage.clear();
    location.reload();
}

// 앱 시작
function startApp(){
    document.getElementById("roleSelect").style.display="none";
    document.getElementById("mainUI").style.display="block";

    navigator.geolocation.getCurrentPosition(pos=>{
        map = new kakao.maps.Map(document.getElementById('map'), {
            center: new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude),
            level: 3
        });

        startTracking();
    });
}

// 위치 전송 루프
function startTracking(){
    setInterval(()=>{
        navigator.geolocation.getCurrentPosition(pos=>{
            const data = {
                id: myId,
                role: role,
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                accuracy: pos.coords.accuracy,
                time: Date.now()
            };

            document.getElementById("status").innerText =
                `${role} / 정확도 ${data.accuracy.toFixed(1)}m`;

            fetch(SERVER_URL,{
                method:"POST",
                body: JSON.stringify(data)
            });

            updateUsers(data);

        }, null, {enableHighAccuracy:true});
    },3000);
}

// SOS
function sendSOS(){
    fetch(SERVER_URL,{
        method:"POST",
        body: JSON.stringify({
            id: myId,
            sos:true,
            time:Date.now()
        })
    });
    alert("🚨 SOS 전송됨");
}

// 사용자 업데이트
async function updateUsers(myData){
    const res = await fetch(SERVER_URL);
    const users = await res.json();

    users.forEach(user=>{
        const pos = new kakao.maps.LatLng(user.lat, user.lng);

        if(!markers[user.id]){
            markers[user.id] = new kakao.maps.Marker({
                position: pos,
                map: map
            });
            paths[user.id] = [];
        } else {
            markers[user.id].setPosition(pos);
        }

        // 경로
        paths[user.id].push(pos);

        if(!markers[user.id].polyline){
            markers[user.id].polyline = new kakao.maps.Polyline({
                path: paths[user.id],
                strokeWeight: 4
            });
            markers[user.id].polyline.setMap(map);
        } else {
            markers[user.id].polyline.setPath(paths[user.id]);
        }

        // 방향 화살표
        if(role === "rescuer" && user.role === "victim"){
            showDirection(myData, user);
        }

        // 정보창
        let info = `
        ID:${user.id.substring(0,6)}<br>
        역할:${user.role}<br>
        정확도:${user.accuracy?.toFixed(1)}m
        `;

        if(user.sos){
            info += "<br><b style='color:red'>🚨 SOS</b>";
        }

        const infowindow = new kakao.maps.InfoWindow({
            content:`<div style="padding:5px">${info}</div>`
        });

        infowindow.open(map, markers[user.id]);
    });
}

// 방향 계산
function getBearing(lat1, lon1, lat2, lon2){
    const toRad = x => x * Math.PI / 180;
    const toDeg = x => x * 180 / Math.PI;

    const dLon = toRad(lon2 - lon1);

    const y = Math.sin(dLon) * Math.cos(toRad(lat2));
    const x =
        Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
        Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);

    return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

// 방향 표시
function showDirection(my, target){
    const angle = getBearing(my.lat, my.lng, target.lat, target.lng);

    const pos = new kakao.maps.LatLng(my.lat, my.lng);

    if(!arrowMarker){
        arrowMarker = new kakao.maps.Marker({
            position: pos,
            map: map
        });
    } else {
        arrowMarker.setPosition(pos);
    }

    const el = arrowMarker.getElement();
    if(el){
        el.style.transform = `rotate(${angle}deg)`;
    }
}
</script>

</body>
</html>

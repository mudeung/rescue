<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📍 실시간 위치공유</title>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424"></script>

<style>
body, html {
  margin:0;
  padding:0;
  height:100%;
  font-family: Arial, sans-serif;
}

#map {
  width:100%;
  height:100%;
}

/* 공유 버튼 */
#shareBtn {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  padding:14px;
  width:90%;
  border:none;
  border-radius:12px;
  background:#007aff;
  color:#fff;
  font-weight:bold;
}

/* 리스트 */
#userList {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 90px;
  width: 92%;
  max-height: 45vh;
  overflow-y: auto;
  z-index: 15;
}

/* 카드 */
.user-card {
  background: #fff;
  margin-bottom: 10px;
  padding: 16px;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  font-size: 15px;
  cursor: pointer;

  /* 핵심: 절대 넘침 방지 + 줄바꿈 */
  overflow: hidden;
  word-break: break-word;
}

/* TOP3 강조 */
.user-card.top1 { border:2px solid gold; }
.user-card.top2 { border:2px solid silver; }
.user-card.top3 { border:2px solid #cd7f32; }

/* 텍스트 */
.user-name {
  font-weight:bold;
  margin-bottom:4px;
  word-break: break-word;
}

.user-coord {
  font-size:12px;
  color:#555;
  line-height:1.4;
  word-break: break-all;
}

.user-distance {
  margin-top:6px;
  color:#007aff;
  font-weight:bold;
}

/* 데스크탑 */
@media (min-width:1024px){
  #userList {
    right:10px;
    left:auto;
    top:60px;
    bottom:auto;
    width:260px;
    transform:none;
  }

  #shareBtn {
    top:10px;
    bottom:auto;
    right:10px;
    left:auto;
    transform:none;
    width:auto;
  }
}
</style>
</head>

<body>

<button id="shareBtn">내위치 공유</button>
<div id="userList"></div>
<div id="map"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzpNNxNK7Zcj6ZbKlPDNr0Lz7hG_o0IPlCIEtvWnQe8uJyPIQPluGe8wcnox_2pAcSE/exec";

let myId;
let map, markers={}, infoWindows={}, myMarker;
let myLat, myLng;
let openInfoWindow = null;

/* 이름 */
const params = new URLSearchParams(location.search);
if(params.get("user")){
  localStorage.setItem("myId", params.get("user"));
}

async function getName(){
  let name = localStorage.getItem("myId");
  if(!name){
    name = prompt("이름 입력");
    localStorage.setItem("myId", name);
  }
  myId = name;
}

/* 지도 */
function initMap(lat,lng){
  const center = new kakao.maps.LatLng(lat,lng);
  map = new kakao.maps.Map(document.getElementById('map'), {center, level:4});
  myMarker = new kakao.maps.Marker({map, position:center});
}

/* 거리 */
function getDistance(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*(2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

/* 전송 */
function sendLocation(lat,lng){
  fetch(GAS_URL,{method:"POST", body:JSON.stringify({id:myId, lat,lng})});
}

/* 사용자 */
function fetchUsers(){
  fetch(GAS_URL).then(res=>res.json()).then(users=>{

    let arr=[];

    for(let id in users){
      if(id===myId) continue;

      const u = users[id];
      const dist = getDistance(myLat,myLng,u.lat,u.lng);

      arr.push({id, ...u, dist});
    }

    // ✅ 거리순 정렬
    arr.sort((a,b)=>a.dist-b.dist);

    let html="";

    arr.forEach((u,idx)=>{

      const pos = new kakao.maps.LatLng(u.lat,u.lng);

      if(!markers[u.id]){
        markers[u.id]=new kakao.maps.Marker({map, position:pos});
      }

      markers[u.id].setPosition(pos);

      // TOP3 강조
      let rankClass="";
      if(idx===0) rankClass="top1";
      else if(idx===1) rankClass="top2";
      else if(idx===2) rankClass="top3";

      html += `
        <div class="user-card ${rankClass}" onclick="focusUser('${u.id}')">
          <div class="user-name">👤 ${u.id}</div>
          <div class="user-coord">📍 ${u.lat.toFixed(5)}, ${u.lng.toFixed(5)}</div>
          <div class="user-distance">📏 ${u.dist.toFixed(2)} km</div>
        </div>
      `;
    });

    document.getElementById("userList").innerHTML = html;
  });
}

/* 클릭 */
function focusUser(id){
  const marker = markers[id];
  if(!marker) return;
  map.setCenter(marker.getPosition());
}

/* 업데이트 */
function update(){
  navigator.geolocation.getCurrentPosition(pos=>{
    myLat=pos.coords.latitude;
    myLng=pos.coords.longitude;

    const myPos=new kakao.maps.LatLng(myLat,myLng);

    if(!map) initMap(myLat,myLng);

    // ✅ 내 위치 자동 따라가기 (부드럽게)
    map.panTo(myPos);

    if(myMarker) myMarker.setPosition(myPos);

    sendLocation(myLat,myLng);
    fetchUsers();
  });
}

/* 공유 */
document.getElementById("shareBtn").addEventListener("click", async () => {
  const url = location.href + "?user=" + encodeURIComponent(myId);

  if(navigator.share){
    await navigator.share({
      title:"실시간 위치",
      text:`${myId} 위치`,
      url:url
    });
  }else{
    await navigator.clipboard.writeText(url);
    alert("링크 복사됨");
  }
});

setInterval(update,5000);
getName().then(update);
</script>

</body>
</html>

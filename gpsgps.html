<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📍 실시간 위치 공유</title>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424"></script>

<style>
body, html { margin:0; padding:0; height:100%; font-family: Arial, sans-serif; }
#map { width:100%; height:100%; }

/* 버튼 */
#shareBtn, #batteryBtn {
  position:fixed;
  right:10px;
  z-index:20;
  padding:10px 14px;
  border:none;
  border-radius:8px;
  color:#fff;
  font-weight:bold;
}
#shareBtn { top:10px; background:#007aff; }
#batteryBtn { top:50px; background:#34c759; }

/* 카드 UI */
#userList {
  position: fixed;
  right: 10px;
  top: 100px;
  width: 260px;
  max-height: 70vh;
  overflow-y: auto;
  z-index: 15;
}

.user-card {
  background: #fff;
  margin-bottom: 10px;
  padding: 12px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  font-size: 13px;
  cursor: pointer;
}

.user-name { font-weight: bold; }
.user-distance { color:#007aff; font-weight:bold; }

@media (max-width:1023px){
  #userList {
    width: 90%;
    left: 50%;
    transform: translateX(-50%);
    bottom: 80px;
    top: auto;
  }
}
</style>
</head>

<body>

<button id="shareBtn">공유</button>
<button id="batteryBtn">절약 OFF</button>

<div id="userList"></div>
<div id="map"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzpNNxNK7Zcj6ZbKlPDNr0Lz7hG_o0IPlCIEtvWnQe8uJyPIQPluGe8wcnox_2pAcSE/exec";

let myId;
let map, markers={}, infoWindows={}, myMarker;
let myLat, myLng;
let openInfoWindow = null;

// 🔋 배터리 모드
let updateInterval = 5000;
let intervalId;
let isSaving = false;

// URL 이름 자동 적용
const params = new URLSearchParams(location.search);
if(params.get("user")){
  localStorage.setItem("myId", params.get("user"));
}

// 이름 설정
async function getName(){
  let name = localStorage.getItem("myId");
  if(!name){
    name = prompt("이름 입력");
    localStorage.setItem("myId", name);
  }
  myId = name;
}

// 지도 초기화
function initMap(lat,lng){
  const center = new kakao.maps.LatLng(lat,lng);
  map = new kakao.maps.Map(document.getElementById('map'), {center, level:4});
  myMarker = new kakao.maps.Marker({map, position:center});

  kakao.maps.event.addListener(map, 'click', function () {
    if(openInfoWindow){
      openInfoWindow.close();
      openInfoWindow = null;
    }
  });
}

// 거리 계산
function getDistance(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*(2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// 위치 전송
function sendLocation(lat,lng){
  fetch(GAS_URL,{method:"POST", body:JSON.stringify({id:myId, lat,lng})});
}

// 사용자 불러오기 + 정렬 + UI
function fetchUsers(){
  fetch(GAS_URL).then(res=>res.json()).then(users=>{

    const userArray = Object.entries(users)
      .filter(([id]) => id !== myId)
      .map(([id, u]) => ({
        id,
        lat: u.lat,
        lng: u.lng,
        dist: getDistance(myLat,myLng,u.lat,u.lng)
      }))
      .sort((a,b)=> a.dist - b.dist);

    let html="";

    for(let user of userArray){
      const {id, lat, lng, dist} = user;
      const pos = new kakao.maps.LatLng(lat,lng);

      if(!markers[id]){
        const marker=new kakao.maps.Marker({map, position:pos});
        markers[id]=marker;

        const infowindow=new kakao.maps.InfoWindow({
          content:`<div style="padding:10px;font-weight:bold;">
          ${id}<br>${lat.toFixed(5)}, ${lng.toFixed(5)}
          </div>`
        });

        infoWindows[id]=infowindow;

        kakao.maps.event.addListener(marker,'click',function(){
          if(openInfoWindow === infowindow){
            infowindow.close();
            openInfoWindow = null;
            return;
          }
          if(openInfoWindow){
            openInfoWindow.close();
          }
          infowindow.open(map, marker);
          openInfoWindow = infowindow;
        });
      }

      markers[id].setPosition(pos);

      html += `
        <div class="user-card" onclick="focusUser('${id}')">
          <div class="user-name">👤 ${id}</div>
          <div>📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}</div>
          <div class="user-distance">📏 ${dist.toFixed(2)} km</div>
        </div>
      `;
    }

    document.getElementById("userList").innerHTML = html;
  });
}

// 카드 클릭 → 지도 이동
function focusUser(id){
  const marker = markers[id];
  const infowindow = infoWindows[id];
  if(!marker) return;

  map.setCenter(marker.getPosition());

  if(openInfoWindow){
    openInfoWindow.close();
  }

  infowindow.open(map, marker);
  openInfoWindow = infowindow;
}

// 위치 업데이트
function update(){
  navigator.geolocation.getCurrentPosition(pos=>{
    myLat=pos.coords.latitude;
    myLng=pos.coords.longitude;

    const myPos=new kakao.maps.LatLng(myLat,myLng);

    if(!map) initMap(myLat,myLng);
    if(myMarker) myMarker.setPosition(myPos);

    sendLocation(myLat,myLng);
    fetchUsers();
  });
}

// 🔋 배터리 모드 토글
document.getElementById("batteryBtn").addEventListener("click", () => {
  isSaving = !isSaving;
  updateInterval = isSaving ? 15000 : 5000;

  document.getElementById("batteryBtn").innerText = isSaving ? "절약 ON" : "절약 OFF";

  clearInterval(intervalId);
  intervalId = setInterval(update, updateInterval);
});

// 공유 기능
document.getElementById("shareBtn").addEventListener("click", async () => {
  const url = location.href + "?user=" + encodeURIComponent(myId);

  if(navigator.share){
    await navigator.share({
      title:"실시간 위치",
      text:`${myId} 위치 확인`,
      url:url
    });
  }else{
    await navigator.clipboard.writeText(url);
    alert("링크 복사됨");
  }
});

// 실행
intervalId = setInterval(update, updateInterval);
getName().then(update);
</script>

</body>
</html>

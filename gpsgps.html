<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>🚑 구조 위치 공유 시스템</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>
</head>

<body>

<h3>🚑 구조 시스템</h3>

<select id="role">
  <option value="rescuer">🟦 구조대</option>
  <option value="victim">🟥 조난자</option>
</select>

<button onclick="sendSOS()">🚨 긴급 요청</button>

<p id="status"></p>

<div id="map" style="width:100%;height:400px;"></div>

<script>
let map;
let myId = localStorage.getItem("userId") || generateUUID();
localStorage.setItem("userId", myId);

let markers = {};

// UUID
function generateUUID() {
    return 'xxxx-xxxx-4xxx-yxxx'.replace(/[xy]/g, function(c) {
        let r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
        return v.toString(16);
    });
}

// 지도 초기화
navigator.geolocation.getCurrentPosition(pos=>{
    map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude),
        level: 3
    });
    start();
});

// 긴급 버튼
function sendSOS(){
    fetch(SERVER_URL, {
        method:"POST",
        body: JSON.stringify({
            id: myId,
            sos: true
        })
    });
    alert("🚨 긴급 요청 전송됨!");
}

// 메인 루프
function start(){
    setInterval(()=>{
        navigator.geolocation.getCurrentPosition(pos=>{
            const role = document.getElementById("role").value;

            const data = {
                id: myId,
                role: role,
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                accuracy: pos.coords.accuracy,
                time: Date.now()
            };

            document.getElementById("status").innerText =
                `${role} / 정확도 ${data.accuracy.toFixed(1)}m`;

            fetch(SERVER_URL,{
                method:"POST",
                body: JSON.stringify(data)
            });

            updateUsers();

        }, null, {enableHighAccuracy:true});
    },3000);
}

// 사용자 업데이트
async function updateUsers(){
    const res = await fetch(SERVER_URL);
    const users = await res.json();

    users.forEach(user=>{
        const pos = new kakao.maps.LatLng(user.lat, user.lng);

        // 아이콘 설정
        let color = "blue";
        if(user.role === "victim") color = "red";
        if(user.sos) color = "yellow";

        const markerImage = new kakao.maps.MarkerImage(
            `https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png`,
            new kakao.maps.Size(24,35)
        );

        // 마커 생성
        if(!markers[user.id]){
            markers[user.id] = new kakao.maps.Marker({
                position: pos,
                map: map,
                image: markerImage
            });
        } else {
            markers[user.id].setPosition(pos);
        }

        // SOS 표시
        let infoText = `
            ID: ${user.id.substring(0,6)}<br>
            역할: ${user.role}<br>
            정확도: ${user.accuracy?.toFixed(1)}m
        `;

        if(user.sos){
            infoText += "<br><b style='color:red'>🚨 SOS 요청중</b>";
        }

        const infowindow = new kakao.maps.InfoWindow({
            content:`<div style="padding:5px">${infoText}</div>`
        });

        infowindow.open(map, markers[user.id]);
    });
}

const SERVER_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_URL/exec";
</script>

</body>
</html>

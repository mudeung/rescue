<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📍 실시간 위치공유</title>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424"></script>

<style>
body, html { margin:0; padding:0; height:100%; font-family: Arial; }
#map { width:100%; height:100%; }

#shareBtn {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#007aff;
  color:#fff;
  font-weight:bold;
  z-index:20;
}

#userList {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  width: 92%;
  max-height: 45vh;
  overflow-y: auto;
  z-index: 15;
}

.user-card {
  background: #fff;
  margin-bottom: 10px;
  padding: 16px;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  font-size: 15px;
  cursor: pointer;
}

.top1 { border:2px solid gold; }
.top2 { border:2px solid silver; }
.top3 { border:2px solid #cd7f32; }

.user-name { font-weight:bold; }
.user-coord { font-size:12px; color:#555; }
.user-distance { margin-top:6px; color:#007aff; font-weight:bold; }
</style>
</head>

<body>

<button id="shareBtn">내위치 공유</button>
<div id="userList"></div>
<div id="map"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzpNNxNK7Zcj6ZbKlPDNr0Lz7hG_o0IPlCIEtvWnQe8uJyPIQPluGe8wcnox_2pAcSE/exec";

const ALERT_DISTANCE = 0.3;
const ZOOM_DISTANCE = 0.3;
const TIMEOUT = 30000;

let alertedUsers = {};
let zoomedTarget = false;

let myId;
let map, markers={}, myMarker;
let myLat, myLng;
let targetUser = null;

let lastSent = 0;
let lastLat, lastLng;

/* 알림 */
if ("Notification" in window) {
  Notification.requestPermission();
}

/* URL */
const params = new URLSearchParams(location.search);

if(params.get("user")){
  localStorage.setItem("myId", params.get("user"));
}

if(params.get("target")){
  targetUser = params.get("target");
}

/* 이름 */
async function getName(){
  let name = localStorage.getItem("myId");
  if(!name){
    name = prompt("이름 입력");
    localStorage.setItem("myId", name);
  }
  myId = name;
}

/* 지도 */
function initMap(lat,lng){
  const center = new kakao.maps.LatLng(lat,lng);
  map = new kakao.maps.Map(document.getElementById('map'), {center, level:4});
  myMarker = new kakao.maps.Marker({map, position:center});
}

/* 거리 계산 */
function getDistance(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*(2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

/* 이동 체크 */
function hasMoved(lat,lng){
  if(!lastLat) return true;
  const dist = getDistance(lat,lng,lastLat,lastLng);
  return dist > 0.01; // 10m
}

/* 🔔 근접 알림 */
function checkDistanceAlert(user){
  if(user.dist > ALERT_DISTANCE){
    alertedUsers[user.id] = false;
    return;
  }

  if(alertedUsers[user.id]) return;

  alertedUsers[user.id] = true;

  if(Notification.permission === "granted"){
    new Notification("📍 근처!", {
      body: `${user.id} ${Math.round(user.dist*1000)}m`
    });
  } else {
    alert(`${user.id} 가까움 (${user.dist.toFixed(2)}km)`);
  }

  navigator.vibrate?.([200,100,200]);
}

/* 🔥 자동 확대 */
function checkZoomTarget(user){
  if(!targetUser || user.id !== targetUser) return;

  if(user.dist > ZOOM_DISTANCE){
    zoomedTarget = false;
    return;
  }

  const pos = new kakao.maps.LatLng(user.lat, user.lng);

  if(!zoomedTarget){
    zoomedTarget = true;
    map.setLevel(2);
  }

  map.panTo(pos);
}

/* timeout fetch */
function fetchWithTimeout(url, options={}, timeout=5000){
  return Promise.race([
    fetch(url, options),
    new Promise((_, reject)=>setTimeout(()=>reject("timeout"), timeout))
  ]);
}

/* 전송 */
function sendLocation(lat,lng){
  fetchWithTimeout(GAS_URL,{
    method:"POST",
    body:JSON.stringify({
      id:myId,
      lat,lng,
      time:Date.now()
    }),
    keepalive:true
  }).catch(()=>{});
}

/* 쓰로틀 */
function sendLocationThrottled(){
  const now = Date.now();

  if(now - lastSent < 3000) return;
  if(!hasMoved(myLat,myLng)) return;

  lastSent = now;
  lastLat = myLat;
  lastLng = myLng;

  sendLocation(myLat,myLng);
}

/* 사용자 가져오기 */
function fetchUsers(){
  fetchWithTimeout(GAS_URL)
  .then(res=>res.json())
  .then(users=>{

    let arr=[];

    for(let id in users){
      if(id===myId) continue;

      const u = users[id];
      if(Date.now() - u.time > TIMEOUT) continue;

      const dist = getDistance(myLat,myLng,u.lat,u.lng);
      arr.push({id, ...u, dist});
    }

    arr.sort((a,b)=>a.dist-b.dist);

    let html="";

    arr.forEach((u,idx)=>{

      checkDistanceAlert(u);
      checkZoomTarget(u);

      const pos = new kakao.maps.LatLng(u.lat,u.lng);

      if(!markers[u.id]){
        markers[u.id]=new kakao.maps.Marker({map, position:pos});
      }

      markers[u.id].setPosition(pos);

      let rank="";
      if(idx===0) rank="top1";
      else if(idx===1) rank="top2";
      else if(idx===2) rank="top3";

      const status = (Date.now() - u.time < 10000) ? "🟢" : "🔴";

      html += `
        <div class="user-card ${rank}" onclick="focusUser('${u.id}')">
          <div class="user-name">${status} ${u.id}</div>
          <div class="user-coord">${u.lat.toFixed(5)}, ${u.lng.toFixed(5)}</div>
          <div class="user-distance">${u.dist.toFixed(2)} km</div>
        </div>
      `;
    });

    document.getElementById("userList").innerHTML = html;
  })
  .catch(()=>{});
}

/* 클릭 */
function focusUser(id){
  const marker = markers[id];
  if(marker){
    map.setCenter(marker.getPosition());
  }
}

/* 📍 위치 추적 (핵심 개선) */
function startTracking(){
  navigator.geolocation.watchPosition(pos=>{
    myLat = pos.coords.latitude;
    myLng = pos.coords.longitude;

    const myPos = new kakao.maps.LatLng(myLat,myLng);

    if(!map) initMap(myLat,myLng);

    map.panTo(myPos);
    myMarker?.setPosition(myPos);

    sendLocationThrottled();

  }, err=>{
    console.log(err);
  },{
    enableHighAccuracy:true,
    maximumAge:3000,
    timeout:10000
  });
}

/* 페이지 복귀 */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible"){
    fetchUsers();
  }
});

/* 종료 */
window.addEventListener("pagehide", () => {
  navigator.sendBeacon(GAS_URL, JSON.stringify({
    id: myId,
    offline: true
  }));
});

/* 공유 */
document.getElementById("shareBtn").addEventListener("click", async () => {

  const url = location.href.split("?")[0] +
    "?user=" + encodeURIComponent(myId) +
    (targetUser ? "&target=" + encodeURIComponent(targetUser) : "");

  if(navigator.share){
    await navigator.share({
      title:"실시간 위치",
      text: myId,
      url:url
    });
  }else{
    await navigator.clipboard.writeText(url);
    alert("복사됨");
  }
});

/* 실행 */
getName().then(()=>{
  startTracking();
  setInterval(fetchUsers, 4000);
});
</script>

</body>
</html>

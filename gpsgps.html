<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>실시간 위치 공유</title>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424"></script>
<style>
#map { width:100%; height:90vh; }
#info { padding:10px; background:#eee; }
</style>
</head>
<body>

<div id="info">거리 정보: <span id="distance"></span></div>
<div id="map"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzpNNxNK7Zcj6ZbKlPDNr0Lz7hG_o0IPlCIEtvWnQe8uJyPIQPluGe8wcnox_2pAcSE/exec";
const myId = prompt("사용자 ID 입력 (예: A, B, C)");

let map;
let markers = {}; // 여러 사용자 마커 저장

// 지도 초기화
function initMap(lat, lng) {
  map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(lat, lng),
    level: 4
  });
}

// 거리 계산 (Haversine)
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);

  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// 내 위치 전송
function sendLocation(lat, lng) {
  fetch(GAS_URL, {
    method: "POST",
    body: JSON.stringify({
      id: myId,
      lat,
      lng
    })
  });
}

// 모든 사용자 위치 가져오기
function fetchUsers(myLat, myLng) {
  fetch(GAS_URL)
    .then(res => res.json())
    .then(users => {

      let distanceText = "";

      for (let id in users) {
        const u = users[id];
        const pos = new kakao.maps.LatLng(u.lat, u.lng);

        if (!markers[id]) {
          markers[id] = new kakao.maps.Marker({
            map: map
          });
        }

        markers[id].setPosition(pos);

        // 내 위치와 거리 계산
        if (id !== myId) {
          const d = getDistance(myLat, myLng, u.lat, u.lng);
          distanceText += `${id}: ${d.toFixed(2)}km / `;
        }
      }

      document.getElementById("distance").innerText = distanceText;
    });
}

// 업데이트 루프
function update() {
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    if (!map) initMap(lat, lng);

    sendLocation(lat, lng);
    fetchUsers(lat, lng);
  });
}

setInterval(update, 5000);
update();

</script>

</body>
</html>

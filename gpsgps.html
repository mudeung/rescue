<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>🚑 구조위치 공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424"></script>

<style>
body { margin:0; font-family:sans-serif; text-align:center; }
.top { background:#111; color:white; padding:10px; }
button { padding:10px; margin:5px; border:none; border-radius:6px; }
.btn-blue { background:#007bff; color:white; }
.btn-red { background:#dc3545; color:white; }
.btn-gray { background:#666; color:white; }
#map { width:100%; height:80vh; }

#loginModal {
display:none; position:fixed; top:0; left:0;
width:100%; height:100%; background:rgba(0,0,0,0.6);
justify-content:center; align-items:center;
}
.modal-box { background:white; padding:20px; border-radius:10px; width:250px; }
</style>
</head>

<body>

<div id="roleUI" class="top">
<h3>🚑 구조위치 공유</h3>
<button class="btn-red" onclick="enterVictim()">🟥 조난자</button>
<button class="btn-blue" onclick="openLogin()">🟦 구조대</button>
</div>

<div id="loginModal">
<div class="modal-box">
<h3>🔐 구조대 인증</h3>
<input type="password" id="pw" placeholder="비밀번호">
<br><br>
<button onclick="loginRescuer()">확인</button>
<button onclick="closeLogin()">취소</button>
</div>
</div>

<div id="mainUI" style="display:none;">
<div class="top">
<span id="status">연결중...</span><br>
<button class="btn-red" onclick="sendSOS()">🚨 SOS</button>
<button class="btn-gray" onclick="reset()">🔄</button>
</div>
<div id="map"></div>
</div>

<script>
const SERVER ="https://script.google.com/macros/s/AKfycby7T5WSAiSwniAhEhw9R6VXxx5cxqqlc8ZWVKJ7SafRHJo7DdVk49fr-O0Hy7xZHMUeUw/exec";
const PW = "119rescue";

let map, role, myId;
let markers = {};
let paths = {};
let infowindows = {};

// ID 생성
function makeId(){
const now=new Date();
return `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${now.getHours()}${now.getMinutes()}${now.getSeconds()}_${now.getMilliseconds()}`;
}

// 정확도
function getAccuracyLevel(acc){
if(acc<=3) return "🟢 매우 정확";
if(acc<=10) return "🟡 일반";
if(acc<=30) return "🟠 오차";
return "🔴 낮음";
}

window.onload=()=>{
role=localStorage.role;
myId=localStorage.id||makeId();
localStorage.id=myId;

if(role==="rescuer"&&localStorage.auth==="1") start();
else if(role==="victim") start();
};

function enterVictim(){
localStorage.role="victim";
start();
}

function openLogin(){
document.getElementById("loginModal").style.display="flex";
}

function closeLogin(){
document.getElementById("loginModal").style.display="none";
}

function loginRescuer(){
if(document.getElementById("pw").value===PW){
localStorage.role="rescuer";
localStorage.auth="1";
start();
}else alert("❌ 비밀번호 틀림");
}

function reset(){
localStorage.clear();
location.reload();
}

function start(){
document.getElementById("roleUI").style.display="none";
document.getElementById("mainUI").style.display="block";

navigator.geolocation.getCurrentPosition(pos=>{
map=new kakao.maps.Map(document.getElementById('map'),{
center:new kakao.maps.LatLng(pos.coords.latitude,pos.coords.longitude),
level:3
});
startLoops();
},()=>alert("위치 권한 필요"));
}

// 위치 전송
function sendLocation(){
navigator.geolocation.getCurrentPosition(pos=>{
let data={
id:myId,
role:role,
lat:pos.coords.latitude,
lng:pos.coords.longitude,
acc:pos.coords.accuracy,
time:Date.now()
};

document.getElementById("status").innerText=
`${role} | ${data.acc.toFixed(1)}m | ${getAccuracyLevel(data.acc)}`;

fetch(SERVER,{
method:"POST",
body:JSON.stringify(data),
headers:{"Content-Type":"application/json"}
});

});
}

// 반복 실행
function startLoops(){
setInterval(sendLocation,3000);
setInterval(update,3000);
}

// SOS
function sendSOS(){
let msg=prompt("🚨 상황 입력");
if(!msg) return;

fetch(SERVER,{
method:"POST",
body:JSON.stringify({
id:myId,
sos:true,
msg:msg,
time:Date.now()
}),
headers:{"Content-Type":"application/json"}
});

update();
}

// 업데이트
async function update(){
try{
let res=await fetch(SERVER);
if(!res.ok) return;
let users=await res.json();

users.forEach(u=>{
let pos=new kakao.maps.LatLng(u.lat,u.lng);

let icon=ICONS.rescuer;
if(u.role==="victim") icon=ICONS.victim;
if(u.sos) icon=ICONS.sos;
if(u.id===myId) icon=ICONS.me;

let markerImg=new kakao.maps.MarkerImage(icon,new kakao.maps.Size(32,32));

if(!markers[u.id]){
markers[u.id]=new kakao.maps.Marker({position:pos,map:map,image:markerImg});
paths[u.id]=[];
}else{
markers[u.id].setPosition(pos);
markers[u.id].setImage(markerImg);
}

paths[u.id].push(pos);

if(!markers[u.id].line){
markers[u.id].line=new kakao.maps.Polyline({
path:paths[u.id],
strokeWeight:4,
strokeColor:u.role==="victim"?"#ff0000":"#007bff"
});
markers[u.id].line.setMap(map);
}else{
markers[u.id].line.setPath(paths[u.id]);
}

let txt=`
${u.role==="victim"?"🟥 조난자":"🟦 구조대"}<br>
${u.acc?.toFixed(1)}m<br>
${getAccuracyLevel(u.acc)}
`;

if(u.sos) txt+=`<br><b style="color:red">🚨 SOS</b>`;
if(u.msg) txt+=`<br>📢 ${u.msg}`;

if(!infowindows[u.id]){
infowindows[u.id]=new kakao.maps.InfoWindow({
content:`<div style="padding:5px">${txt}</div>`
});
infowindows[u.id].open(map,markers[u.id]);
}else{
infowindows[u.id].setContent(`<div style="padding:5px">${txt}</div>`);
}

});

}catch(e){
console.log("서버 오류",e);
}
}
</script>

</body>
</html>

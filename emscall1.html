/* =====================================================
   상태 정규화
====================================================== */

function normalizeStatus(status){

    const value =
        String(
            status || ""
        )
        .trim()
        .toUpperCase();


    if(

        value === "DONE" ||

        value === "완료" ||

        value === "처리완료" ||

        value === "사고처리완료"

    ){

        return "DONE";

    }


    if(

        value === "ARRIVED" ||

        value === "도착" ||

        value === "현장도착"

    ){

        return "ARRIVED";

    }


    return "RECEIVED";

}


/* =====================================================
   경과시간
====================================================== */

function getElapsedTime(

    startTime,

    endTime = null

){

    if(!startTime){

        return "0분 0초 경과";

    }


    const start =
        new Date(startTime);


    const end =
        endTime
        ?
        new Date(endTime)
        :
        new Date();


    if(
        Number.isNaN(
            start.getTime()
        )
    ){

        return "시간 확인 불가";

    }


    const diff =
        Math.max(

            0,

            Math.floor(

                (
                    end - start
                ) / 1000

            )

        );


    const h =
        Math.floor(
            diff / 3600
        );


    const m =
        Math.floor(

            (
                diff % 3600
            ) / 60

        );


    const s =
        diff % 60;


    if(
        h > 0
    ){

        return `${h}시간 ${m}분 ${s}초 경과`;

    }


    return `${m}분 ${s}초 경과`;

}


/* =====================================================

    if(

    }


    return "#e53935";

}

/* =====================================================
   3분 초과 응급환자
====================================================== */

function checkOverdue(

    item,

    div

){

    if(
        item.type !==
        "응급환자"
    ){

        return;

    }


    const normalized =
        normalizeStatus(
            item.status
        );


    if(
        normalized ===
        "DONE"
    ){

        return;

    }


    if(!item.time){

        return;

    }


    const diffSeconds =
        Math.floor(

            (
                new Date() -
                new Date(item.time)
            ) / 1000

        );


    if(
        diffSeconds >= 180
    ){

        div.classList.add(
            "blink"
        );


        if(
            alertedOverdueIds.has(
                item.id
            )
        ){

            return;

        }


        alertedOverdueIds.add(
            item.id
        );


        const interval =
            setInterval(

                () => {

                    if(
                        div.classList.contains(
                            "done"
                        )
                    ){

                        clearInterval(
                            interval
                        );


                        overdueIntervals.delete(
                            item.id
                        );


                        return;

                    }


                    const alertSound =
                        document.getElementById(
                            "alertSound"
                        );


                    alertSound.currentTime =
                        0;


                    alertSound.play()
                    .catch(
                        () => {}
                    );

                },

                30000

            );


        overdueIntervals.set(
            item.id,
            interval
        );


        const alertSound =
            document.getElementById(
                "alertSound"
            );


        alertSound.currentTime =
            0;


        alertSound.play()
        .catch(
            () => {}
        );

    }

}

                            id

                    })

            }

        );


        loadData();

    }

    catch(err){

        console.error(
            err
        );


        alert(
            "현장도착 처리 중 오류가 발생했습니다."
        );

    }

}


/* =====================================================
   사고처리 완료
====================================================== */

async function finishCase(id){

    if(
        !confirm(
            "사고처리를 완료하시겠습니까?"
        )
    ){

        return;

    }


    try{

        await fetch(

            API_URL,

            {

                method:"POST",

                headers:{

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify({

                        action:
                            "finish",

                        id:
                            id

                    })

            }

        );


        loadData();

    }

    catch(err){

        console.error(
            err
        );


        alert(
            "사고처리 완료 중 오류가 발생했습니다."
        );

    }

}


/* =====================================================
   신고 목록
====================================================== */

async function loadData(){

    try{

        const res =
            await fetch(

                API_URL +
                "?action=list"

            );


        const data =
            await res.json();


        listArea.innerHTML =
            "";


        /* =================================================
           기존 마커 제거
        ================================================== */

        markers.forEach(

            marker => {

                marker.setMap(
                    null
                );

            }

        );


        markers = [];


        /* =================================================
           신고 없음
        ================================================== */

        if(
            !data.length
        ){

            listArea.innerHTML =
                "현재 접수된 신고가 없습니다.";

            return;

        }


        /* =================================================
           신규 신고 확인
        ================================================== */

        if(
            firstLoad
        ){

            data.forEach(

                item => {

                    knownIds.add(
                        String(item.id)
                    );

                }

            );


            firstLoad =
                false;

        }

        else{

            data.forEach(

                item => {

                    const itemId =
                        String(
                            item.id
                        );


                    if(
                        !knownIds.has(
                            itemId
                        )
                    ){

                        knownIds.add(
                            itemId
                        );


                        alert(
                            "🚨 새로운 신고 접수!"
                        );


                        const alertSound =
                            document.getElementById(
                                "alertSound"
                            );


                        alertSound.currentTime =
                            0;


                        alertSound.play()
                        .catch(
                            () => {}
                        );

                    }

                }

            );

        }


        /* =================================================
           최신 신고순
        ================================================== */

        data.sort(

            (a,b) =>

                new Date(
                    b.time
                ) -

                new Date(
                    a.time
                )

        );


        /* =================================================
           신고 데이터
        ================================================== */

        data.forEach(

            item => {

                const normalizedStatus =
                    normalizeStatus(
                        item.status
                    );


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "card" +

                    (

                        normalizedStatus ===
                        "DONE"

                        ?

                        " done"

                        :

                        ""

                    );


                div.setAttribute(
                    "data-time",
                    item.time || ""
                );


                if(
                    item.finishTime
                ){

                    div.setAttribute(
                        "data-finish-time",
                        item.finishTime
                    );

                }


                /* =========================================
                   상태
                ========================================= */

                let statusHTML =
                    "";


                if(
                    normalizedStatus ===
                    "DONE"
                ){

                    statusHTML = `

                        <div class="status done">

                            ⚪ 사고처리완료

                        </div>

                    `;

                }

                else if(
                    normalizedStatus ===
                    "ARRIVED"
                ){

                    statusHTML = `

                        <div class="status arrived">

                            🟠 현장도착

                        </div>

                    `;

                }

                else{

                    statusHTML = `

                        <div class="status received">

                            🔴 사고 접수

                        </div>

                    `;

                }


                /* =========================================
                   현장도착 시간
                ========================================= */

                let completeHTML =
                    "";


                if(
                    item.completeTime
                ){

                    completeHTML = `

                        <div class="time">

                            🚑 현장도착:

                            ${
                                new Date(
                                    item.completeTime
                                ).toLocaleString()
                            }

                        </div>

                    `;

                }


                /* =========================================
                   완료 시간
                ========================================= */

                let finishHTML =
                    "";


                if(
                    item.finishTime
                ){

                    finishHTML = `

                        <div class="time">

                            ✅ 사고처리 완료:

                            ${
                                new Date(
                                    item.finishTime
                                ).toLocaleString()
                            }

                        </div>

                    `;

                }


                /* =========================================
                   버튼
                ========================================= */

                let buttonHTML =
                    "";


                /* =========================================
                   완료 → 삭제
                ========================================= */

                if(
                    normalizedStatus ===
                    "DONE"
                ){

                    buttonHTML = `

                        <span style="
                            display:inline-block;
                            margin-top:8px;
                            color:#aaa;
                            font-weight:bold;
                        ">

                            ✔ 처리완료

                        </span>


                        <br>


                        <button

                            class="delete-btn"

                            type="button"

                        >

                            🗑 신고 삭제

                        </button>

                    `;

                }


                /* =========================================
                   현장도착 → 사고처리 완료
                ========================================= */

                else if(
                    normalizedStatus ===
                    "ARRIVED"
                ){

                    buttonHTML = `

                        <button

                            class="complete-btn"

                            type="button"

                        >

                            ✅ 사고처리 완료

                        </button>

                    `;

                }


                /* =========================================
                   접수 → 현장도착
                ========================================= */

                else{

                    buttonHTML = `

                        <button

                            class="complete-btn"

                            type="button"

                        >

                            🚑 구조대원 현장도착

                        </button>

                    `;

                }


                /* =========================================
                   카드
                ========================================= */

                div.innerHTML = `

                    <div class="time">

                        🕒 접수:

                        ${
                            item.time
                            ?
                            new Date(
                                item.time
                            ).toLocaleString()
                            :
                            ""
                        }

                    </div>


                    <div class="time elapsed">

                        ⏱
                        ${
                            getElapsedTime(
                                item.time,
                                item.finishTime
                            )
                        }

                    </div>


                    ${statusHTML}


                    ${completeHTML}


                    ${finishHTML}


                    <div style="
                        margin-top:5px;
                        font-size:15px;
                        font-weight:bold;
                        color:#ff5252;
                    ">

                        🚨
                        ${
                            item.type ||
                            "미입력"
                        }

                    </div>


                    <br>


                    🏠
                    ${item.address || "주소없음"}

                    <br><br>


                    📞
                    ${item.phone || "번호없음"}

                    <br><br>


                    📝
                    ${item.symptom || "내용없음"}


                    <div class="coord">

                        위도:
                        ${item.lat}

                        /

                        경도:
                        ${item.lng}

                    </div>


                    <a

                        class="maplink"

                        href="https://map.kakao.com/link/map/구조요청 위치,${item.lat},${item.lng}"

                        target="_blank"

                    >

                        📍 지도보기

                    </a>


                    <br>


                    ${buttonHTML}

                `;


                listArea.appendChild(
                    div
                );


                /* =========================================
                   버튼 이벤트 직접 연결
                   ※ inline onclick 사용하지 않음
                ========================================= */

                const deleteButton =
                    div.querySelector(
                        ".delete-btn"
                    );


                if(
                    deleteButton
                ){

                    deleteButton.addEventListener(

                        "click",

                        function(){

                            openPasswordModal(
                                item.id
                            );

                        }

                    );

                }


                const completeButton =
                    div.querySelector(
                        ".complete-btn"
                    );


                if(
                    completeButton
                ){

                    completeButton.addEventListener(

                        "click",

                        function(){

                            if(
                                normalizedStatus ===
                                "ARRIVED"
                            ){

                                finishCase(
                                    item.id
                                );

                            }

                            else{

                                completeCase(
                                    item.id
                                );

                            }

                        }

                    );

                }


                /* =========================================
                   3분 초과
                ========================================= */

                checkOverdue(
                    item,
                    div
                );


                /* =========================================
                   지도 마커
                ========================================= */

                if(
                    item.lat &&
                    item.lng
                ){

                    const lat =
                        Number(
                            item.lat
                        );


                    const lng =
                        Number(
                            item.lng
                        );


                    if(

                        Number.isFinite(lat) &&
                        Number.isFinite(lng)

                    ){

                        const position =
                            new kakao.maps.LatLng(
                                lat,
                                lng
                            );


                        const markerImage =
                            createMarkerImage(
                                item.status
                            );


                        const marker =
                            new kakao.maps.Marker({

                                map:
                                    map,

                                position:
                                    position,

                                title:
                                    item.type ||
                                    "산악사고 신고",

                                image:
                                    markerImage

                            });


                        markers.push(
                            marker
                        );


                        const infoWindow =
                            createInfoWindow(

                                item,

                                lat,

                                lng

                            );


                        kakao.maps.event.addListener(

                            marker,

                            "click",

                            function(){

                                infoWindow.open(
                                    map,
                                    marker
                                );

                            }

                        );

                    }

                }

            }

        );


        /* =================================================
           지도 범위
        ================================================== */

        if(
            markers.length > 0
        ){

            const bounds =
                new kakao.maps.LatLngBounds();


            markers.forEach(

                marker => {

                    bounds.extend(
                        marker.getPosition()
                    );

                }

            );


            map.setBounds(
                bounds
            );

        }

    }

    catch(err){

        console.error(
            "데이터 로딩 오류:",
            err
        );


        listArea.innerHTML =
            "구글시트 로딩 실패. 콘솔 확인";

    }

}


/* =====================================================
   최초 로딩
====================================================== */

loadData();

setInterval(

setInterval(

    function(){

        document
        .querySelectorAll(
            ".card"
        )
        .forEach(

            function(card){

                const elapsedEl =
                    card.querySelector(
                        ".time.elapsed"
                    );


                const timeAttr =
                    card.getAttribute(
                        "data-time"
                    );


                const finishTimeAttr =
                    card.getAttribute(
                        "data-finish-time"
                    );


                if(
                    !elapsedEl ||
                    !timeAttr
                ){

                    return;

                }


                elapsedEl.innerText =

                    "⏱ " +

                    getElapsedTime(

                        timeAttr,

                        finishTimeAttr

                    );

            }

        );

    },

    1000

);

document.addEventListener(

/* =====================================================
   개발자도구 단축키 방지
====================================================== */

document.addEventListener(

    "keydown",

    function(e){

        /* F12 */

        if(
            e.key === "F12"
        ){

            e.preventDefault();

            return false;

        }


        /* Ctrl + U */

        if(

            e.ctrlKey &&

            e.key.toLowerCase() === "u"

        ){

            e.preventDefault();

            return false;

        }


        /* Ctrl + Shift + I */

        if(

            e.ctrlKey &&

            e.shiftKey &&

            e.key.toLowerCase() === "i"

        ){

            e.preventDefault();

            return false;

        }


        /* Ctrl + Shift + J */

        if(

            e.ctrlKey &&

            e.shiftKey &&

            e.key.toLowerCase() === "j"

        ){

            e.preventDefault();

            return false;

        }


        /* Ctrl + Shift + C */

        if(

            e.ctrlKey &&

            e.shiftKey &&

            e.key.toLowerCase() === "c"

        ){

            e.preventDefault();

            return false;

        }


        /* Ctrl + S */

        if(

            e.ctrlKey &&

            e.key.toLowerCase() === "s"

        ){

            e.preventDefault();

            return false;

        }

    }

);

</script>

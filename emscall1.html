<img

<script>


/* =====================================================
   지도 초기화
====================================================== */

let map;

let markers = [];


function initMap(){

    map =
        new kakao.maps.Map(

            document.getElementById(
                "map"
            ),

            {

                center:
                    new kakao.maps.LatLng(
                        35.1345,
                        126.9902
                    ),

                level:6

            }

        );

}


initMap();


/* =====================================================
   구글 Apps Script API
====================================================== */

const API_URL =
    "https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


const listArea =
    document.getElementById(
        "listArea"
    );


/* =====================================================
   신규 신고 관리
====================================================== */

let knownIds =
    new Set();

let alertedOverdueIds =
    new Set();

let overdueIntervals =
    new Map();

let firstLoad =
    true;


/* =====================================================
   경과시간 계산
====================================================== */

function getElapsedTime(
    startTime,
    endTime = null
){

    const start =
        new Date(
            startTime
        );

    const end =
        endTime
        ?
        new Date(
            endTime
        )
        :
        new Date();


    const diff =
        Math.max(
            0,
            Math.floor(
                (
                    end - start
                ) / 1000
            )
        );


    const h =
        Math.floor(
            diff / 3600
        );


    const m =
        Math.floor(
            (
                diff % 3600
            ) / 60
        );


    const s =
        diff % 60;


    if(h > 0){

        return `${h}시간 ${m}분 ${s}초 경과`;

    }


    return `${m}분 ${s}초 경과`;

}


/* =====================================================
   상태별 마커 색상
====================================================== */

function getMarkerColor(
    status
){

    /* 사고처리 완료 */

    if(
        status ===
        "사고처리완료"
    ){

        return "#777777";

    }


    /* 현장도착 */

    if(
        status ===
        "현장도착"
    ){

        return "#fb8c00";

    }


    /* 접수 */

    return "#e53935";

}


/* =====================================================
   원형 마커 이미지
====================================================== */

function createMarkerImage(
    status
){

    const color =
        getMarkerColor(
            status
        );


    const svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="44"
            height="44"
            viewBox="0 0 44 44"
        >

            <!-- 외곽 흰색 테두리 -->

            <circle
                cx="22"
                cy="22"
                r="19"
                fill="${color}"
                stroke="#ffffff"
                stroke-width="3"
            />


            <!-- 중앙 흰색 원 -->

            <circle
                cx="22"
                cy="22"
                r="7"
                fill="#ffffff"
            />

        </svg>

    `;


    return new kakao.maps.MarkerImage(

        "data:image/svg+xml;charset=utf-8," +

        encodeURIComponent(
            svg
        ),

        new kakao.maps.Size(
            44,
            44
        ),

        {

            offset:
                new kakao.maps.Point(
                    22,
                    22
                )

        }

    );

}


/* =====================================================
   지도 팝업
====================================================== */

function createInfoWindow(
    item,
    lat,
    lng
){

    let statusColor =
        "#e53935";

    let statusText =
        "🔴 사고 접수";


    if(
        item.status ===
        "현장도착"
    ){

        statusColor =
            "#fb8c00";

        statusText =
            "🟠 현장도착";

    }


    if(
        item.status ===
        "사고처리완료"
    ){

        statusColor =
            "#777777";

        statusText =
            "⚪ 사고처리완료";

    }


    const infoContent = `

        <div style="
            padding:12px;
            color:#222;
            font-family:Arial,sans-serif;
            font-size:13px;
            min-width:250px;
            max-width:300px;
            line-height:1.5;
        ">


            <div style="
                font-size:16px;
                font-weight:bold;
                margin-bottom:8px;
            ">

                🆘 산악사고 신고

            </div>


            <div style="
                display:inline-block;
                padding:5px 10px;
                background:${statusColor};
                color:#fff;
                border-radius:5px;
                font-weight:bold;
                margin-bottom:8px;
            ">

                ${statusText}

            </div>


            <br>


            🚨 <b>신고유형</b><br>

            ${item.type || "미입력"}


            <br><br>


            🕒 <b>접수시간</b><br>

            ${
                item.time
                ?
                new Date(
                    item.time
                ).toLocaleString()
                :
                ""
            }


            <br><br>


            ⏱ <b>경과시간</b><br>

            ${
                getElapsedTime(
                    item.time,
                    item.finishTime
                )
            }


            <br><br>


            📝 <b>상황</b><br>

            ${item.symptom || "내용없음"}


            <br><br>


            🏠 <b>주소</b><br>

            ${item.address || "주소없음"}


            <br><br>


            📞 <b>연락처</b><br>

            ${item.phone || "번호없음"}


            <br><br>


            📍 <b>좌표</b><br>

            ${lat.toFixed(6)},
            ${lng.toFixed(6)}


            ${
                item.completeTime
                ?

                `

                <br><br>

                🚑 <b>현장도착</b><br>

                ${
                    new Date(
                        item.completeTime
                    ).toLocaleString()
                }

                `

                :

                ""

            }


            ${
                item.finishTime
                ?

                `

                <br><br>

                ⚪ <b>사고처리 완료</b><br>

                ${
                    new Date(
                        item.finishTime
                    ).toLocaleString()
                }

                `

                :

                ""

            }


            <div style="
                margin-top:12px;
            ">

                <a

                    href="
                    https://map.kakao.com/link/map/구조요청 위치,${lat},${lng}
                    "

                    target="_blank"

                    style="
                        color:#1976d2;
                        text-decoration:none;
                        font-weight:bold;
                    "
                >

                    📍 카카오맵에서 보기

                </a>

            </div>


        </div>

    `;


    return new kakao.maps.InfoWindow({

        content:
            infoContent,

        removable:
            true

    });

}


/* =====================================================
   3분 초과 응급환자 체크
====================================================== */

function checkOverdue(
    item,
    div
){

    /* 응급환자만 */

    if(
        item.type !==
        "응급환자"
    ){

        return;

    }


    /* 사고처리 완료 */

    if(
        !item.status ||
        item.status ===
        "사고처리완료"
    ){

        return;

    }


    const diffSeconds =
        Math.floor(

            (
                new Date() -
                new Date(
                    item.time
                )
            ) / 1000

        );


    if(
        diffSeconds >= 180
    ){

        div.classList.add(
            "blink"
        );


        /* 이미 알림 시작 */

        if(
            alertedOverdueIds.has(
                item.id
            )
        ){

            return;

        }


        alertedOverdueIds.add(
            item.id
        );


        /* 30초마다 알림 */

        const interval =
            setInterval(

                () => {

                    if(
                        div.classList.contains(
                            "done"
                        )
                    ){

                        clearInterval(
                            interval
                        );

                        overdueIntervals.delete(
                            item.id
                        );

                        return;

                    }


                    const alertSound =
                        document.getElementById(
                            "alertSound"
                        );


                    alertSound.currentTime =
                        0;


                    alertSound.play()
                    .catch(
                        () => {}
                    );

                },

                30000

            );


        overdueIntervals.set(
            item.id,
            interval
        );


        /* 즉시 1회 알림 */

        const alertSound =
            document.getElementById(
                "alertSound"
            );


        alertSound.currentTime =
            0;


        alertSound.play()
        .catch(
            () => {}
        );

    }

}


/* =====================================================
   현장도착
====================================================== */

async function completeCase(
    id
){

    if(
        !confirm(
            "구조대원이 현장에 도착했습니까?"
        )
    ){

        return;

    }


    try{

        await fetch(

            API_URL,

            {

                method:
                    "POST",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify({

                        action:
                            "complete",

                        id:
                            id,

                        completeTime:
                            new Date()
                            .toISOString()

                    })

            }

        );


        loadData();

    }

    catch(err){

        console.error(
            err
        );

        alert(
            "현장도착 처리 중 오류가 발생했습니다."
        );

    }

}


/* =====================================================
   사고처리 완료
====================================================== */

async function finishCase(
    id
){

    if(
        !confirm(
            "사고처리를 완료하시겠습니까?"
        )
    ){

        return;

    }


    try{

        await fetch(

            API_URL,

            {

                method:
                    "POST",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify({

                        action:
                            "finish",

                        id:
                            id,

                        finishTime:
                            new Date()
                            .toISOString()

                    })

            }

        );


        loadData();

    }

    catch(err){

        console.error(
            err
        );

        alert(
            "사고처리 완료 중 오류가 발생했습니다."
        );

    }

}


/* =====================================================
   신고 목록 불러오기
====================================================== */

async function loadData(){

    try{

        const res =
            await fetch(

                API_URL +
                "?action=list"

            );


        const data =
            await res.json();


        listArea.innerHTML =
            "";


        /* =================================================
           기존 마커 제거
        ================================================== */

        markers.forEach(

            marker => {

                marker.setMap(
                    null
                );

            }

        );


        markers = [];


        /* =================================================
           신고 없음
        ================================================== */

        if(
            !data.length
        ){

            listArea.innerHTML =
                "현재 접수된 신고가 없습니다.";

            return;

        }


        /* =================================================
           신규 신고 확인
        ================================================== */

        if(
            firstLoad
        ){

            data.forEach(

                item => {

                    knownIds.add(
                        item.id
                    );

                }

            );


            firstLoad =
                false;

        }

        else{

            data.forEach(

                item => {

                    if(
                        !knownIds.has(
                            item.id
                        )
                    ){

                        knownIds.add(
                            item.id
                        );


                        alert(
                            "🚨 새로운 신고 접수!"
                        );


                        const alertSound =
                            document.getElementById(
                                "alertSound"
                            );


                        alertSound.currentTime =
                            0;


                        alertSound.play()
                        .catch(
                            () => {}
                        );

                    }

                }

            );

        }


        /* =================================================
           최신 신고순 정렬
        ================================================== */

        data.sort(

            (a,b) =>

                new Date(
                    b.time
                ) -

                new Date(
                    a.time
                )

        );


        /* =================================================
           신고 데이터 처리
        ================================================== */

        data.forEach(

            item => {


                /* =========================================
                   신고 카드
                ========================================= */

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "card" +

                    (

                        item.status ===
                        "사고처리완료"

                        ?

                        " done"

                        :

                        ""

                    );


                div.setAttribute(
                    "data-time",
                    item.time
                );


                if(
                    item.finishTime
                ){

                    div.setAttribute(
                        "data-finish-time",
                        item.finishTime
                    );

                }


                /* =========================================
                   상태 HTML
                ========================================= */

                let statusHTML =
                    "";


                if(
                    item.status ===
                    "사고처리완료"
                ){

                    statusHTML = `

                        <div class="status done">

                            ⚪ 사고처리완료

                        </div>

                    `;

                }

                else if(
                    item.status ===
                    "현장도착"
                ){

                    statusHTML = `

                        <div class="status arrived">

                            🟠 현장도착

                        </div>

                    `;

                }

                else{

                    statusHTML = `

                        <div class="status received">

                            🔴 사고 접수

                        </div>

                    `;

                }


                /* =========================================
                   현장도착 시간
                ========================================= */

                let completeHTML =
                    "";


                if(
                    item.completeTime
                ){

                    completeHTML = `

                        <div class="time">

                            🚑 현장도착:

                            ${
                                new Date(
                                    item.completeTime
                                ).toLocaleString()
                            }

                        </div>

                    `;

                }


                /* =========================================
                   사고처리 완료 시간
                ========================================= */

                let finishHTML =
                    "";


                if(
                    item.finishTime
                ){

                    finishHTML = `

                        <div class="time">

                            ✅ 사고처리 완료:

                            ${
                                new Date(
                                    item.finishTime
                                ).toLocaleString()
                            }

                        </div>

                    `;

                }


                /* =========================================
                   처리 버튼
                ========================================= */

                let buttonHTML =
                    "";


                if(
                    item.status ===
                    "사고처리완료"
                ){

                    buttonHTML = `

                        <span style="
                            display:inline-block;
                            margin-top:8px;
                            color:#aaa;
                            font-weight:bold;
                        ">

                            ✔ 처리완료

                        </span>

                    `;

                }

                else if(
                    item.status ===
                    "현장도착"
                ){

                    buttonHTML = `

                        <button

                            class="complete-btn"

                            onclick="
                                finishCase('${item.id}')
                            "
                        >

                            ✅ 사고처리 완료

                        </button>

                    `;

                }

                else{

                    buttonHTML = `

                        <button

                            class="complete-btn"

                            onclick="
                                completeCase('${item.id}')
                            "
                        >

                            🚑 구조대원 현장도착

                        </button>

                    `;

                }


                /* =========================================
                   카드 내용
                ========================================= */

                div.innerHTML = `

                    <div class="time">

                        🕒 접수:

                        ${
                            item.time
                            ?
                            new Date(
                                item.time
                            ).toLocaleString()
                            :
                            ""
                        }

                    </div>


                    <div class="time elapsed">

                        ⏱
                        ${
                            getElapsedTime(
                                item.time,
                                item.finishTime
                            )
                        }

                    </div>


                    ${statusHTML}


                    ${completeHTML}


                    ${finishHTML}


                    <div style="
                        margin-top:5px;
                        font-size:15px;
                        font-weight:bold;
                        color:#ff5252;
                    ">

                        🚨
                        ${
                            item.type ||
                            "미입력"
                        }

                    </div>


                    <br>


                    🏠
                    ${item.address || "주소없음"}

                    <br><br>


                    📞
                    ${item.phone || "번호없음"}

                    <br><br>


                    📝
                    ${item.symptom || "내용없음"}


                    <div class="coord">

                        위도:
                        ${item.lat}

                        /

                        경도:
                        ${item.lng}

                    </div>


                    <a

                        class="maplink"

                        href="
                        https://map.kakao.com/link/map/구조요청 위치,${item.lat},${item.lng}
                        "

                        target="_blank"
                    >

                        📍 지도보기

                    </a>


                    <br>


                    ${buttonHTML}

                `;


                listArea.appendChild(
                    div
                );


                /* =========================================
                   3분 초과 확인
                ========================================= */

                checkOverdue(
                    item,
                    div
                );


                /* =========================================
                   지도 마커
                ========================================= */

                if(
                    item.lat &&
                    item.lng
                ){

                    const lat =
                        Number(
                            item.lat
                        );


                    const lng =
                        Number(
                            item.lng
                        );


                    if(
                        Number.isFinite(lat) &&
                        Number.isFinite(lng)
                    ){

                        const position =
                            new kakao.maps.LatLng(
                                lat,
                                lng
                            );


                        /* 상태에 따른 원형 마커 */

                        const markerImage =
                            createMarkerImage(
                                item.status
                            );


                        const marker =
                            new kakao.maps.Marker({

                                map:
                                    map,

                                position:
                                    position,

                                title:
                                    item.type ||
                                    "산악사고 신고",

                                image:
                                    markerImage

                            });


                        markers.push(
                            marker
                        );


                        /* =================================
                           마커 클릭 팝업
                        ================================= */

                        const infoWindow =
                            createInfoWindow(
                                item,
                                lat,
                                lng
                            );


                        kakao.maps.event.addListener(

                            marker,

                            "click",

                            function(){

                                infoWindow.open(
                                    map,
                                    marker
                                );

                            }

                        );

                    }

                }

            }

        );


        /* =================================================
           마커 전체가 보이도록 지도 범위 조정
        ================================================== */

        if(
            markers.length > 0
        ){

            const bounds =
                new kakao.maps.LatLngBounds();


            markers.forEach(

                marker => {

                    bounds.extend(
                        marker.getPosition()
                    );

                }

            );


            map.setBounds(
                bounds
            );

        }

    }

    catch(err){

        console.error(
            err
        );


        listArea.innerHTML =
            "구글시트 로딩 실패. 콘솔 확인";

    }

}


/* =====================================================
   최초 데이터 로딩
====================================================== */

loadData();


/* =====================================================
   10초마다 신고 목록 갱신
====================================================== */

setInterval(

    loadData,

    10000

);


/* =====================================================
   경과시간 1초마다 갱신
====================================================== */

setInterval(

    () => {

        document
        .querySelectorAll(
            ".card"
        )
        .forEach(

            card => {

                const elapsedEl =
                    card.querySelector(
                        ".time.elapsed"
                    );


                const timeAttr =
                    card.getAttribute(
                        "data-time"
                    );


                const finishTimeAttr =
                    card.getAttribute(
                        "data-finish-time"
                    );


                if(
                    !elapsedEl ||
                    !timeAttr
                ){

                    return;

                }


                elapsedEl.innerText =

                    "⏱ " +

                    getElapsedTime(

                        timeAttr,

                        finishTimeAttr

                    );

            }

        );

    },

    1000

);


</script>


<script>

/* =====================================================
   우클릭 및 개발자도구 단축키 방지
====================================================== */

document.addEventListener(

    "contextmenu",

    function(e){

        e.preventDefault();

        return false;

    }

);


document.addEventListener(

    "keydown",

    function(e){


        /* F12 */

        if(
            e.key === "F12"
        ){

            e.preventDefault();

            return false;

        }


        /* Ctrl + U */

        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "u"
        ){

            e.preventDefault();

            return false;

        }


        /* Ctrl + Shift + I */

        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "i"
        ){

            e.preventDefault();

            return false;

        }


        /* Ctrl + Shift + J */

        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "j"
        ){

            e.preventDefault();

            return false;

        }


        /* Ctrl + Shift + C */

        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "c"
        ){

            e.preventDefault();

            return false;

        }


        /* Ctrl + S */

        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "s"
        ){

            e.preventDefault();

            return false;

        }

    }

);

</script>

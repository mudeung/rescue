<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>119 신고 시뮬레이션</title>
<meta name="theme-color" content="#CE2029">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head>


<style>

/* =========================================
   119 신고 시뮬레이션
   STYLE CSS - PART 1/2
   기본 설정 / 메인 / 상황 카드 / 장면
========================================= */

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');

:root {
  --red: #ce2029;
  --red-dark: #a91620;
  --red-light: #fff0f0;
  --navy: #18263b;
  --text: #263445;
  --muted: #718096;
  --line: #e5eaf0;
  --bg: #f5f7fa;
  --white: #ffffff;
  --green: #15976b;
  --blue: #2867c7;
  --shadow: 0 8px 28px rgba(26, 42, 65, .07);
  --radius: 18px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 24px;
}

body {
  margin: 0;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 3px solid rgba(206, 32, 41, .3);
  outline-offset: 3px;
}

[hidden] {
  display: none !important;
}

/* 기본 레이아웃 */

.wrap {
  width: min(1160px, calc(100% - 40px));
  margin: 0 auto;
  padding: 36px 0 70px;
}

/* 메인 인트로 */

.intro {
  animation: fadeUp .5s ease both;
}

.lead {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 290px;
  padding: 48px 58px;
  overflow: hidden;
  border-radius: 26px;
  background: linear-gradient(120deg, #fff 0%, #fff5f5 100%);
  box-shadow: var(--shadow);
}

.lead-copy {
  position: relative;
  z-index: 2;
  max-width: 570px;
}

.lead h1 {
  margin: 0;
  color: var(--navy);
  font-size: clamp(34px, 5vw, 52px);
  line-height: 1.3;
  font-weight: 900;
  letter-spacing: -2px;
}

.lead h1 span {
  color: var(--red);
}

.note {
  margin: 18px 0 0;
  color: var(--muted);
  font-size: 15px;
  font-weight: 500;
}

.lead-art {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38%;
  max-width: 400px;
}

.lead-art img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}

/* 상황 선택 */

.scenario-section {
  margin-top: 48px;
}

.scenario-section h2 {
  margin: 0 0 22px;
  color: var(--navy);
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -.7px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
}

.card {
  display: flex;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--white);
  box-shadow: 0 3px 14px rgba(26, 42, 65, .035);
  transition: transform .2s ease, box-shadow .2s ease;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow);
}

.card-thumb {
  flex: 0 0 39%;
  min-width: 0;
  overflow: hidden;
  background: #edf1f5;
}

.card-thumb img {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 190px;
  object-fit: cover;
  transition: transform .3s ease;
}

.card:hover .card-thumb img {
  transform: scale(1.04);
}

.card-copy {
  flex: 1;
  min-width: 0;
  padding: 22px 20px;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 10px;
}

.card-meta .num {
  color: var(--red);
  font-size: 12px;
  font-weight: 800;
}

.card-meta .level {
  padding: 3px 9px;
  border-radius: 30px;
  background: #f0f3f7;
  color: #66758a;
  font-size: 11px;
  font-weight: 700;
}

.card h3 {
  margin: 0;
  line-height: 1.45;
}

.card-link {
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--navy);
  text-align: left;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -.4px;
}

.card-link:hover {
  color: var(--red);
}

.card-clue {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin: 13px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.card-clue svg {
  flex: 0 0 16px;
  width: 16px;
  height: 16px;
  margin-top: 3px;
  color: var(--red);
}

/* 운영자 설정 */

.ops {
  margin-top: 30px;
  padding: 20px 24px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--white);
}

.ops summary {
  color: var(--navy);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.ops-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 15px;
  margin-top: 20px;
}

.ops-grid label {
  display: grid;
  gap: 7px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.ops-grid input {
  width: 100%;
  min-height: 44px;
  padding: 10px 13px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fafbfd;
  color: var(--text);
}

.ops .note {
  margin-top: 12px;
  font-size: 12px;
}

/* 시뮬레이션 화면 */

.sim {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  align-items: start;
  gap: 32px;
  animation: fadeUp .35s ease both;
}

.back {
  grid-column: 1 / -1;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  justify-self: start;
  padding: 9px 15px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: white;
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
}

.back:hover {
  background: var(--red-light);
  color: var(--red);
}

.back svg {
  width: 17px;
  height: 17px;
}

.scene-col {
  min-width: 0;
}

.mission {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 16px;
  padding: 17px 20px;
  border: 1px solid #f4d4d6;
  border-radius: 13px;
  background: #fff7f7;
}

.mission .tag {
  flex: 0 0 auto;
  padding: 4px 10px;
  border-radius: 6px;
  background: var(--red);
  color: white;
  font-size: 11px;
  font-weight: 800;
}

.mission .text {
  color: #63363a;
  font-size: 14px;
  font-weight: 600;
}

.scene {
  position: relative;
  overflow: hidden;
  min-height: 300px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: #e9edf2;
  box-shadow: var(--shadow);
}

.scene > img {
  display: block;
  width: 100%;
  height: auto;
  min-height: 300px;
  object-fit: contain;
}

/* 그림 속 위치 선택 버튼 */

#hots {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.hot {
  position: absolute;
  z-index: 3;
  padding: 0;
  border: 2px solid transparent;
  border-radius: 8px;
  background: transparent;
  pointer-events: auto;
  transition: .2s;
}

.hot:hover,
.hot:focus-visible,
.hot.pulse {
  border-color: var(--red);
  background: rgba(206, 32, 41, .12);
}

.hot.found {
  border-color: var(--green);
  background: rgba(21, 151, 107, .12);
}

.pulse {
  animation: pulse 1.2s infinite;
}

/* 확대 화면 */

.zoom {
  position: absolute;
  z-index: 5;
  top: 12px;
  right: 12px;
  max-width: 75%;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: white;
  box-shadow: 0 8px 30px rgba(0, 0, 0, .2);
}

.crop {
  position: relative;
  overflow: hidden;
  max-width: 100%;
  border-radius: 7px;
  background-repeat: no-repeat;
}

.crop .mark {
  position: absolute;
  border: 3px solid #ffcf33;
  border-radius: 4px;
  background: rgba(255, 207, 51, .2);
}

.zbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-top: 8px;
  color: var(--navy);
  font-size: 12px;
  font-weight: 800;
}

.zbar button {
  padding: 5px 10px;
  border: 0;
  border-radius: 6px;
  background: #f0f2f5;
  color: var(--text);
  font-size: 11px;
  font-weight: 700;
}

/* 안내 영역 */

.guide {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-top: 17px;
  padding: 16px 19px;
  border: 1px solid #dce7f4;
  border-radius: 12px;
  background: #f1f6fc;
  color: #344d6c;
  font-size: 13px;
  font-weight: 600;
}

.guide .k {
  flex: 0 0 auto;
  color: var(--blue);
  font-weight: 900;
}

.guide.hint {
  border-color: #f4dfaa;
  background: #fff9e9;
  color: #72551c;
}

.guide.hint .k {
  color: #a87300;
}

.scene-jump {
  display: inline-block;
  margin-left: 5px;
  color: var(--red);
  font-size: 12px;
  font-weight: 800;
  text-decoration: underline;
}

/* 진행 단계 */

.progress {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 20px;
}

.progress .p {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 45px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  color: #9aa5b3;
  font-size: 12px;
  font-weight: 700;
}

.progress .p b {
  display: grid;
  place-items: center;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  background: #edf0f4;
  color: #8490a0;
  font-size: 11px;
}

.progress .p.on {
  border-color: var(--red);
  background: var(--red-light);
  color: var(--red);
}

.progress .p.on b {
  background: var(--red);
  color: white;
}

.progress .p.past {
  border-color: #cce9dd;
  color: var(--green);
}

.progress .p.past b {
  background: #dff4ea;
  color: var(--green);
}

/* 애니메이션 */

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulse {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(206, 32, 41, .35);
  }
  50% {
    box-shadow: 0 0 0 9px rgba(206, 32, 41, 0);
  }
}

/* =========================================
   119 신고 시뮬레이션
   STYLE CSS - PART 2/2
   휴대전화 / 통화 / 답변 / 결과 / 반응형
========================================= */

/* 휴대전화 전체 */

.phone {
  position: sticky;
  top: 20px;
  width: 100%;
  padding: 9px;
  border: 1px solid #d7dce3;
  border-radius: 35px;
  background: #20242c;
  box-shadow: 0 18px 45px rgba(20, 30, 45, .2);
}

.screen {
  position: relative;
  min-height: 650px;
  overflow: hidden;
  border-radius: 27px;
  background: #f8fafc;
}

/* 상태 표시줄 */

.status {
  position: absolute;
  z-index: 2;
  top: 0;
  left: 0;
  display: flex;
  justify-content: space-between;
  width: 100%;
  padding: 13px 19px;
  color: white;
  font-size: 11px;
  font-weight: 800;
}

/* 잠금 화면 */

.lock {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 650px;
  padding: 90px 20px 25px;
  background:
    linear-gradient(160deg, rgba(25, 42, 67, .45), rgba(12, 24, 43, .9)),
    linear-gradient(135deg, #59728d, #182c48);
  color: white;
}

.clock {
  margin-top: 35px;
  font-size: 66px;
  font-weight: 300;
  letter-spacing: -3px;
  line-height: 1.2;
}

.date {
  margin-top: 9px;
  color: rgba(255, 255, 255, .85);
  font-size: 14px;
}

.lock .spacer {
  flex: 1;
  min-height: 170px;
}

.lk-msg {
  width: 100%;
  margin-bottom: 18px;
  padding: 14px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 12px;
  background: rgba(255,255,255,.15);
  color: white;
  font-size: 12px;
}

.lock .row {
  display: flex;
  flex-direction: column;
  width: 100%;
  gap: 13px;
}

.sos,
.unlock {
  width: 100%;
  min-height: 51px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 800;
}

.sos {
  border: 0;
  background: var(--red);
  color: white;
  box-shadow: 0 5px 18px rgba(206,32,41,.35);
}

.sos:hover {
  background: var(--red-dark);
}

.unlock {
  border: 1px solid rgba(255,255,255,.35);
  background: rgba(255,255,255,.12);
  color: white;
}

.unlock:hover {
  background: rgba(255,255,255,.22);
}

/* 다이얼 화면 */

.dial {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 650px;
  padding: 65px 24px 25px;
  background: #f8fafc;
}

.dial .t {
  margin: 20px 0 25px;
  color: var(--navy);
  font-size: 18px;
  font-weight: 800;
}

.dial .num {
  width: 100%;
  min-height: 48px;
  border-bottom: 1px solid var(--line);
  color: var(--navy);
  font-size: 35px;
  font-weight: 700;
  text-align: center;
  letter-spacing: 7px;
}

.dial .msg {
  min-height: 48px;
  padding-top: 12px;
  color: var(--red);
  font-size: 11px;
  text-align: center;
}

.keys {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  width: 100%;
  gap: 13px;
  margin-top: 8px;
}

.keys button {
  aspect-ratio: 1;
  max-height: 62px;
  border: 1px solid #e5e9ef;
  border-radius: 50%;
  background: white;
  color: var(--navy);
  font-size: 23px;
  font-weight: 600;
  box-shadow: 0 3px 7px rgba(0,0,0,.04);
  transition: .15s;
}

.keys button:hover {
  background: #edf2f8;
  transform: scale(.96);
}

.keys button.pulse {
  border: 2px solid var(--red);
  color: var(--red);
}

.call-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  align-items: center;
  width: 100%;
  margin-top: auto;
  padding-top: 22px;
}

.callbtn {
  display: grid;
  place-items: center;
  justify-self: center;
  width: 60px;
  height: 60px;
  border: 0;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 6px 16px rgba(21,151,107,.3);
}

.callbtn:hover {
  background: #087b55;
  transform: scale(1.05);
}

.callbtn svg {
  width: 27px;
  height: 27px;
}

.bksp {
  justify-self: end;
  padding: 9px 12px;
  border: 0;
  border-radius: 8px;
  background: #e9edf2;
  color: var(--text);
  font-size: 11px;
  font-weight: 700;
}

/* 통화 화면 */

.call {
  display: flex;
  flex-direction: column;
  min-height: 650px;
  background: #f5f7fa;
}

.call-head {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 55px 15px 19px;
  background: white;
  border-bottom: 1px solid var(--line);
}

.call-head .who {
  color: var(--navy);
  font-size: 16px;
  font-weight: 900;
}

.call-head .time {
  margin-top: 5px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.log {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 150px;
  max-height: 285px;
  overflow-y: auto;
  gap: 12px;
  padding: 17px 13px;
  scroll-behavior: smooth;
}

/* 대화 말풍선 */

.b {
  max-width: 88%;
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 12px;
  line-height: 1.65;
  overflow-wrap: anywhere;
  animation: fadeUp .2s ease both;
}

.b .lbl {
  display: block;
  margin-bottom: 5px;
  font-size: 10px;
  font-weight: 900;
}

.b.op {
  align-self: flex-start;
  border: 1px solid #e5eaf0;
  border-top-left-radius: 4px;
  background: white;
  color: var(--text);
}

.b.op .lbl {
  color: var(--blue);
}

.b.me {
  align-self: flex-end;
  border-top-right-radius: 4px;
  background: #dff3e9;
  color: #145c42;
}

.b.sys {
  align-self: center;
  max-width: 95%;
  padding: 7px 12px;
  border-radius: 20px;
  background: #e9edf2;
  color: #66758a;
  font-size: 10px;
  text-align: center;
}

/* 답변 선택 */

.answers {
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 13px;
  border-top: 1px solid var(--line);
  background: white;
}

.ask {
  padding: 11px 12px;
  border-radius: 9px;
  background: #f1f5fa;
  color: #44566d;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.6;
}

.choice-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--navy);
}

.ans {
  width: 100%;
  min-height: 43px;
  padding: 10px 13px;
  border: 1px solid #dfe5ed;
  border-radius: 10px;
  background: white;
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.55;
  text-align: left;
  transition: .15s;
}

.ans:hover:not(:disabled) {
  border-color: var(--red);
  background: var(--red-light);
  color: var(--red);
}

.ans.glow {
  border-color: #e9b73b;
  background: #fff9e8;
}

.ans.sent {
  border-color: var(--green);
  background: #eaf7f1;
  color: #14734f;
}

.ans:disabled {
  cursor: default;
  opacity: .7;
}

/* 통화 조작 버튼 */

.ctls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 13px 10px 18px;
  border-top: 1px solid var(--line);
  background: white;
}

.ctl {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 60px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #f8fafc;
  color: #5e6b7c;
  font-size: 10px;
  font-weight: 700;
}

.ctl .ic {
  display: grid;
  place-items: center;
}

.ctl svg {
  width: 21px;
  height: 21px;
}

.ctl:hover:not(:disabled) {
  background: #edf2f8;
}

.ctl[aria-pressed="true"] {
  border-color: var(--green);
  background: #e9f7f0;
  color: var(--green);
}

.ctl.end {
  border-color: var(--red);
  background: var(--red);
  color: white;
}

.ctl.end:hover {
  background: var(--red-dark);
}

.ctl:disabled {
  cursor: not-allowed;
  opacity: .45;
}

/* 통화 종료 대기 */

.holdbar {
  height: 5px;
  overflow: hidden;
  border-radius: 10px;
  background: #e9edf2;
}

.holdbar i {
  display: block;
  width: 0;
  height: 100%;
  border-radius: 10px;
  background: var(--green);
  transition: width 5s linear;
}

/* 결과 화면 */

#resultV {
  animation: fadeUp .4s ease both;
}

.result {
  max-width: 850px;
  margin: 25px auto;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: white;
  box-shadow: var(--shadow);
}

.r-head {
  padding: 38px 40px;
  background: linear-gradient(120deg, #fff5f5, #fff);
  border-bottom: 1px solid #f3e1e2;
}

.r-head .no {
  margin: 0 0 9px;
  color: var(--red);
  font-size: 13px;
  font-weight: 800;
}

.r-head h2 {
  margin: 0;
  color: var(--navy);
  font-size: clamp(25px, 4vw, 34px);
  font-weight: 900;
  letter-spacing: -1px;
}

.r-head h2 span {
  color: var(--red);
}

.r-body {
  padding: 30px 40px 38px;
}

.recap-steps {
  display: flex;
  flex-direction: column;
  gap: 17px;
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: recap;
}

.recap-step {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 13px;
  counter-increment: recap;
}

.recap-step h3 {
  position: relative;
  margin: 0;
  padding-left: 31px;
  color: var(--navy);
  font-size: 15px;
  font-weight: 800;
}

.recap-step h3::before {
  content: counter(recap);
  position: absolute;
  top: 0;
  left: 0;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--red);
  color: white;
  font-size: 11px;
}

.step-tip {
  margin: 5px 0 0 31px;
  color: var(--muted);
  font-size: 12px;
}

.step-example {
  margin: 0;
  padding: 14px 16px;
  border-left: 3px solid var(--green);
  border-radius: 0 8px 8px 0;
  background: #f0f8f4;
  color: #245c43;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.8;
}

.call-reminder {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 23px 0 0;
  padding: 19px;
  border: 1px solid #f1dfb5;
  border-radius: 12px;
  background: #fff9eb;
  color: #76591d;
  font-size: 13px;
}

.call-reminder strong {
  font-size: 14px;
}

.call-reminder span {
  font-size: 12px;
}

/* 결과 화면 버튼 */

.r-actions {
  display: flex;
  gap: 12px;
  margin-top: 28px;
}

.btn {
  flex: 1;
  min-height: 50px;
  padding: 12px 18px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  color: var(--navy);
  font-size: 13px;
  font-weight: 800;
  transition: .2s;
}

.btn:hover {
  background: #f3f5f8;
}

.btn.primary {
  border-color: var(--red);
  background: var(--red);
  color: white;
}

.btn.primary:hover {
  background: var(--red-dark);
}

/* 스크롤바 */

.log::-webkit-scrollbar {
  width: 5px;
}

.log::-webkit-scrollbar-thumb {
  border-radius: 10px;
  background: #cbd3de;
}

/* 태블릿 */

@media (max-width: 900px) {
  .sim {
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 20px;
  }

  .lead {
    padding: 38px;
  }

  .card-copy {
    padding: 17px 14px;
  }

  .phone {
    top: 12px;
  }
}

/* 모바일 */

@media (max-width: 680px) {

  .wrap {
    width: min(100% - 24px, 520px);
    padding: 14px 0 40px;
  }

  .lead {
    min-height: auto;
    padding: 30px 23px;
    border-radius: 19px;
  }

  .lead h1 {
    font-size: 35px;
    letter-spacing: -1.5px;
  }

  .lead .note {
    font-size: 13px;
  }

  .lead-art {
    width: 35%;
    min-width: 100px;
  }

  .scenario-section {
    margin-top: 32px;
  }

  .scenario-section h2 {
    font-size: 21px;
  }

  .cards {
    grid-template-columns: 1fr;
    gap: 13px;
  }

  .card {
    border-radius: 13px;
  }

  .card-thumb {
    flex-basis: 35%;
  }

  .card-thumb img {
    min-height: 145px;
  }

  .card-copy {
    padding: 15px 12px;
  }

  .card-link {
    font-size: 14px;
  }

  .card-clue {
    font-size: 11px;
  }

  .ops {
    padding: 16px;
  }

  .ops-grid {
    grid-template-columns: 1fr;
  }

  .sim {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .back {
    order: 0;
  }

  .scene-col {
    order: 1;
    width: 100%;
  }

  .phone {
    position: relative;
    top: auto;
    order: 2;
    width: min(100%, 360px);
    align-self: center;
  }

  .mission {
    padding: 13px;
  }

  .mission .text {
    font-size: 12px;
  }

  .scene {
    min-height: 190px;
    border-radius: 12px;
  }

  .scene > img {
    min-height: 190px;
  }

  .guide {
    padding: 13px;
    font-size: 12px;
  }

  .progress {
    gap: 5px;
  }

  .progress .p {
    gap: 5px;
    min-height: 40px;
    font-size: 10px;
  }

  .progress .p b {
    width: 19px;
    height: 19px;
    font-size: 10px;
  }

  .screen,
  .lock,
  .dial,
  .call {
    min-height: 600px;
  }

  .log {
    max-height: 240px;
  }

  .r-head {
    padding: 27px 22px;
  }

  .r-body {
    padding: 22px 17px 26px;
  }

  .recap-step {
    padding: 15px;
  }

  .r-actions {
    flex-direction: column;
  }

  .btn {
    flex: auto;
  }
}

/* 작은 스마트폰 */

@media (max-width: 380px) {

  .lead {
    padding: 25px 17px;
  }

  .lead h1 {
    font-size: 29px;
  }

  .lead-art {
    min-width: 85px;
  }

  .card-thumb {
    flex-basis: 32%;
  }

  .card-thumb img {
    min-height: 130px;
  }

  .card-copy {
    padding: 12px 10px;
  }

  .card-link {
    font-size: 13px;
  }

  .clock {
    font-size: 56px;
  }

  .keys {
    gap: 9px;
  }

  .keys button {
    max-height: 55px;
  }
}

/* 접근성: 움직임 최소화 */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* 모든 상황 카드 왼쪽 그림 제거 */
.card-thumb {
  display: none;
}

.card-copy {
  width: 100%;
  flex: 1;

/* 첫 화면 오른쪽 그림 제거 */

}

/* 그림 영역의 불필요한 높이 제거 */
.scene {
  min-height: 0 !important;
  height: auto !important;
}

.scene > img {
  min-height: 0 !important;
  height: auto !important;
  display: block;
}

/* ---------- 음성 안내 ---------- */

const synth = window.speechSynthesis;

let currentVoice = null;

function stopVoice() {
  if (currentVoice) {
    currentVoice.stop();
    currentVoice = null;
  }

  if (synth) {
    synth.cancel();
  }
}

function speak(text, done) {
  stopVoice();

  const session = S;

  const voice = {
    stop() {
      if (synth) synth.cancel();
    }
  };

  currentVoice = voice;

  let finished = false;

  function finish() {
    if (finished) return;
    finished = true;

    if (
      currentVoice !== voice ||
      !S ||
      S !== session ||
      S.phase !== 'call'
    ) return;

    currentVoice = null;
    done();
  }

  if (
    !synth ||
    typeof SpeechSynthesisUtterance === 'undefined'
  ) {
    setTimeout(finish, 1500);
    return;
  }

  try {
    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = 'ko-KR';
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;

    const voices = synth.getVoices();

    const koreanVoice = voices.find(
      v => /^ko(-|_)?KR/i.test(v.lang)
    );

    if (koreanVoice) {
      utterance.voice = koreanVoice;
    }

    utterance.onend = finish;

    utterance.onerror = () => {
      finish();
    };

    currentVoice = voice;

    synth.speak(utterance);

    setTimeout(() => {
      if (!finished) finish();
    }, Math.max(10000, text.length * 250));

  } catch (error) {
    finish();
  }
}

/* ---------- 기본 실행 함수 ---------- */

let S = null;
let timers = [];

function clearTimers() {
  timers.forEach(id => {
    clearTimeout(id);
    clearInterval(id);
  });
  timers = [];
}

function later(fn, ms) {
  const id = setTimeout(fn, ms);
  timers.push(id);
  return id;
}

function show(id) {
  ['home', 'sim', 'resultV'].forEach(name => {
    $(name).hidden = name !== id;
  });

  window.scrollTo(0, 0);
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[c]);
}

    const btn = document.createElement('button');

    btn.type = 'button';
    btn.className = 'hot';
    btn.title = item.label;
    btn.setAttribute('aria-label', item.label);

    btn.style.left = item.x + '%';
    btn.style.top = item.y + '%';
    btn.style.width = item.w + '%';
    btn.style.height = item.h + '%';

    if (S.found.has(item.id)) {
      btn.classList.add('found');
    }

    btn.onclick = () => {
      S.found.add(item.id);
      btn.classList.add('found');

      openZoom(item);

      updateGuide();

      if (S.phase === 'call') {
        renderAnswers();
      }
    };

    container.appendChild(btn);
  });
}

/* ---------- 위치 단서 확대 ---------- */

function openZoom(item, markName) {
  const zoom = $('zoom');
  const crop = $('zoomCrop');

  zoom.hidden = false;
  $('zoomLbl').textContent = item.label;

  const image = $('sceneImg');

  crop.innerHTML = '';

  const img = document.createElement('img');
  img.src = image.src;
  img.alt = item.label;

  img.style.position = 'absolute';
  img.style.maxWidth = 'none';

  crop.style.width = '280px';
  crop.style.height = '180px';

  crop.appendChild(img);

  const naturalW = image.naturalWidth || 1600;
  const naturalH = image.naturalHeight || 900;

  const scale = Math.min(
    280 / (naturalW * item.w / 100),
    180 / (naturalH * item.h / 100)
  );

  const renderedW = naturalW * scale;
  const renderedH = naturalH * scale;

  img.style.width = renderedW + 'px';
  img.style.height = renderedH + 'px';
  img.style.left = -(item.x / 100 * renderedW) + 'px';
  img.style.top = -(item.y / 100 * renderedH) + 'px';

  const mark = markName && item.marks
    ? item.marks[markName]
    : null;

  if (mark) {
    const box = document.createElement('div');
    box.className = 'mark';

    box.style.left = mark.x + '%';
    box.style.top = mark.y + '%';
    box.style.width = mark.w + '%';
    box.style.height = mark.h + '%';

    crop.appendChild(box);
  }
}

/* ---------- 통화 시작 ---------- */

function startCall() {
  if (!S) return;

  S.phase = 'call';

  $('lockV').hidden = true;
  $('dialV').hidden = true;
  $('callV').hidden = false;

  $('log').innerHTML = '';
  $('answers').innerHTML = '';

  callStartedAt = Date.now();

  updateCallTime();

  const timer = setInterval(updateCallTime, 1000);
  timers.push(timer);

  addLog('sys', '119 종합상황실 연결 중...');

  later(() => {
    if (!S || S.phase !== 'call') return;

    addLog('sys', '119 종합상황실과 연결되었습니다.');

    runStep();
  }, 900);
}

/* ---------- 통화 시간 ---------- */

function updateCallTime() {
  if (!S || S.phase !== 'call') return;

  const sec = Math.floor(
    (Date.now() - callStartedAt) / 1000
  );

  const mm = String(Math.floor(sec / 60)).padStart(2, '0');
  const ss = String(sec % 60).padStart(2, '0');

  $('callTime').textContent = mm + ':' + ss;
}

/* ---------- 대화 기록 ---------- */

function addLog(type, message) {
  const div = document.createElement('div');
  div.className = 'b ' + type;

  if (type === 'op') {
    const label = document.createElement('span');
    label.className = 'lbl';
    label.textContent = '119 상황실';

    div.appendChild(label);
  }

  const content = document.createElement('span');
  content.textContent = message;

  div.appendChild(content);

  $('log').appendChild(div);
  $('log').scrollTop = $('log').scrollHeight;
}

/* ---------- 단계별 질문 진행 ---------- */


function runStep() {
  if (!S || S.phase !== 'call') return;

  const step = S.steps[S.index];

  if (!step) {
    finishScenario();
    return;
  }

  updateProgress(step.st);

  addLog('op', step.say);

  // 질문이 표시되면 답변을 즉시 보여줌
  if (!step.auto && !step.speaker && !step.hold) {
    renderAnswers();
  }

  speak(step.say, () => {
    if (!S || S.phase !== 'call') return;

    if (step.auto) {
      S.history.push({
        question: step.say,
        answer: '상황실에서 위치 확인 및 출동 요청'
      });

      S.index++;
      later(runStep, 700);
      return;
    }

    if (step.speaker) {
      renderContinue('스피커폰으로 전환한 뒤 계속하기');
      return;
    }

    if (step.hold) {
      renderContinue('통화 종료 및 신고 결과 확인');
    }
  });
}


/* ---------- 답변 선택 버튼 ---------- */

function renderAnswers() {
  if (!S || S.phase !== 'call') return;

  const step = S.steps[S.index];
  const box = $('answers');

  box.innerHTML = '';

  if (!step) return;


  const ask = document.createElement('div');
  ask.className = 'ask';
  ask.textContent = '상황실 질문에 알맞게 대답하세요.';

  box.appendChild(ask);

  const heading = document.createElement('div');
  heading.className = 'choice-heading';

  const label = document.createElement('strong');
  label.textContent = '신고자 답변';

  heading.appendChild(label);
  box.appendChild(heading);

  step.opts.forEach((option, index) => {
    const btn = document.createElement('button');

    btn.type = 'button';
    btn.className = 'ans';
    btn.textContent = option.t;

    if (index === 0) {
      btn.classList.add('glow');
    }

    btn.onclick = () => {
      selectAnswer(option, btn);
    };

    box.appendChild(btn);
  });

  $('toAnswers').hidden = false;
  updateGuide();
}

/* ---------- 답변 처리 ---------- */

function selectAnswer(option, btn) {
  if (!S || S.phase !== 'call') return;

  const step = S.steps[S.index];

  if (!step) return;

  $('answers').querySelectorAll('.ans')
    .forEach(el => {
      el.disabled = true;
    });

  btn.classList.add('sent');

  addLog('me', option.t);

  if (option.ok) {
    S.history.push({
      question: step.say,
      answer: option.t
    });

    S.index++;

    later(runStep, 650);

  } else {
    // 오답이면 다음 단계로 넘어가지 않고 재질문
    const retry = option.retry ||
      '다시 한번 말씀해 주세요.';

    later(() => {
      if (!S || S.phase !== 'call') return;

      addLog('op', retry);

      speak(retry, () => {
        renderAnswers();
      });

    }, 600);
  }
}

/* ---------- 다음 단계 안내 버튼 ---------- */

function renderContinue(label) {
  if (!S || S.phase !== 'call') return;

  const box = $('answers');
  box.innerHTML = '';

  const step = S.steps[S.index];

  const info = document.createElement('div');
  info.className = 'ask';

  info.textContent = step.hold
    ? '구급대가 도착할 때까지 통화를 유지하세요. 실제 상황에서는 상황실의 안내를 따르세요.'
    : '안내에 따라 휴대전화 설정을 확인하고 계속 진행하세요.';

  box.appendChild(info);

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'ans sent';
  btn.textContent = label;

  btn.onclick = () => {
    if (!S || S.phase !== 'call') return;

    if (step.hold) {
      finishScenario();
      return;
    }

    if (step.speaker) {
      S.speaker = true;

      $('spkBtn').setAttribute(
        'aria-pressed',
        'true'
      );

      S.history.push({
        question: step.say,
        answer: '스피커폰으로 전환'
      });

      S.index++;
      runStep();
    }
  };

  box.appendChild(btn);
}

/* ---------- 스피커폰 버튼 ---------- */

$('spkBtn').onclick = () => {
  if (!S || S.phase !== 'call') return;

  S.speaker = !S.speaker;

  $('spkBtn').setAttribute(
    'aria-pressed',
    String(S.speaker)
  );

  addLog(
    'sys',
    S.speaker
      ? '스피커폰이 켜졌습니다.'
      : '스피커폰이 꺼졌습니다.'
  );
};

/* ---------- 통화 종료 ---------- */

$('endBtn').onclick = () => {
  if (!S || S.phase !== 'call') return;

  finishScenario();
};

/* ---------- 신고 결과 ---------- */

function finishScenario() {
  if (!S || S.finished) return;

  S.finished = true;
  S.phase = 'done';

  clearTimers();
  stopVoice();

  $('zoom').hidden = true;

  const recap = S.sc.recap();

  const titles = [
    '무슨 일이 생겼나요?',
    '어디에 있나요?',
    '지금 어떤 상태인가요?'
  ];

  const tips = [
    '사고 종류와 아픈 사람을 정확하게 전달합니다.',
    '주소, 건물명, 주변 표지판 등 위치 단서를 전달합니다.',
    '의식, 호흡, 부상 상태와 추가 위험을 전달합니다.'
  ];

  $('resultV').innerHTML = `
    <div class="result">

      <div class="r-head">
        <p class="no">119 신고 연습 완료</p>

        <h2 id="recapTitle">
          신고 내용을 <span>확인해 볼까요?</span>
        </h2>

        <p>${escapeHTML(S.sc.title)}</p>
      </div>

      <div class="r-body">

        <h3>신고할 때 전달할 내용</h3>

        <ol class="recap-steps">
          ${recap.map((item, i) => `
            <li class="recap-step">
              <h3>${titles[i]}</h3>
              <p class="step-tip">${tips[i]}</p>
              <p class="step-example">
                ${escapeHTML(item)}
              </p>
            </li>
          `).join('')}
        </ol>

        <div class="call-reminder">
          <strong>꼭 기억하세요!</strong>
          <span>
            실제 응급상황에서는 119에 신고하고
            상황실의 안내에 따라 행동하세요.
          </span>
          <span>
            통화 중에는 임의로 전화를 끊지 말고
            구조대가 도착할 때까지 안내를 따르세요.
          </span>
        </div>

        <div class="r-actions">
          <button class="btn" id="retryBtn">
            같은 상황 다시 연습하기
          </button>

          <button class="btn primary" id="homeBtn">
            다른 상황 선택하기
          </button>
        </div>

      </div>
    </div>
  `;

  show('resultV');

  $('retryBtn').onclick = () => {
    const index = SC.indexOf(S.sc);
    startScenario(index);
  };

  $('homeBtn').onclick = goHome;
}

/* ---------- 초기 실행 ---------- */

renderHome();
show('home');


})();



</script>

</body>
</html>

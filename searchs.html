<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛰 SEARCH AND RESCUE AI MAP</title>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{
    margin:0;
    background:#050b18;
    color:#00ff9d;
    font-family:monospace;
    overflow:hidden;
}

header{
    background:#071a2f;
    padding:10px;
    text-align:center;
    font-weight:bold;
}

#container{
    display:flex;
    height:calc(100vh - 50px);
}

#panel{
    width:300px;
    background:#07101f;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow-y:auto;
}

#map{ flex:1; }

input,button{
    padding:10px;
    border:1px solid #00ff9d;
    background:#001a14;
    color:#00ff9d;
}

button:disabled{ opacity:0.5; }

@media (max-width:768px){
    #container{flex-direction:column;}
    #panel{width:100%;flex-wrap:wrap;max-height:35vh;}
    #map{height:65vh;}
}
</style>
</head>

<body>

<header>🛰 SEARCH AND RESCUE AI MAP</header>

<div id="container">

<div id="panel">
<input id="name" placeholder="RESCUE ID">
<button id="startBtn" onclick="start()" disabled>START</button>

<button onclick="goMyLocation()">📍 MY LOCATION</button>
<button onclick="shareLocation()">📡 위치 공유</button>
<button onclick="sendSOS()">🚨 SOS</button>    
<button onclick="stopTracking()">⛔ STOP</button>
<button onclick="loadAllHistory()">📦 전체 기록</button>
</div>

<div id="map"></div>

</div>

<script>

// ================= NATIONAL PARK BORDER =================

function loadNationalParks(){

    fetch("national_parks.geojson")
    .then(r=>r.json())
    .then(data=>{

        data.features.forEach(feature=>{

            const type = feature.geometry.type;


            function drawPolygon(coords){

                const path = coords.map(c =>
                    new kakao.maps.LatLng(c[1],c[0])
                );


                const polygon = new kakao.maps.Polygon({

                    map:map,
                    path:path,

                    strokeWeight:2,
                    strokeColor:"#00ffff",
                    strokeOpacity:0.8,

                    fillColor:"#00ffff",
                    fillOpacity:0.08
                });


                kakao.maps.event.addListener(
                    polygon,
                    "click",
                    function(e){


                    const name =
                    feature.properties.name ||
                    feature.properties.PARK_NAME ||
                    "국립공원";


                    const info = `

                    <div style="
                    padding:12px;
                    background:#07101f;
                    color:#00ff9d;
                    border:1px solid #00ff9d;
                    font-family:monospace">

                    🏔 <b>${name}</b><br><br>

                    📍 ${e.latLng.getLat().toFixed(6)}
                    ,
                    ${e.latLng.getLng().toFixed(6)}

                    <br><br>

                    🛰 SEARCH AREA

                    </div>

                    `;


                    const iw =
                    new kakao.maps.InfoWindow({
                        content:info
                    });


                    iw.setPosition(e.latLng);
                    iw.open(map);

                    });

            }



            if(type==="Polygon"){

                drawPolygon(
                    feature.geometry.coordinates[0]
                );

            }



            if(type==="MultiPolygon"){

                feature.geometry.coordinates.forEach(poly=>{

                    drawPolygon(poly[0]);

                });

            }


        });

    })

    .catch(err=>{
        console.log(
        "국립공원 데이터 오류",
        err
        );
    });

}



// ================= API =================

const API_URL =
"https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";



// ================= DEVICE =================

const DEVICE_ID =
localStorage.getItem("device_id")
||
crypto.randomUUID();


localStorage.setItem(
"device_id",
DEVICE_ID
);



const isMobile =
/Android|iPhone|iPad|iPod/i
.test(navigator.userAgent);



// ================= MAP =================

const map =
new kakao.maps.Map(
document.getElementById('map'),
{

center:
new kakao.maps.LatLng(
35.1239,
126.9883
),

level:5

});


loadNationalParks();



// ================= STATE =================

let myName="";

let lastPos=null;

let watchId=null;

let intervalSend=null;

let intervalLoad=null;

let centerInterval=null;

let previousPos=null;

let directionMarker=null;



const markers={};



// ================= INPUT =================

const nameInput =
document.getElementById("name");


const startBtn =
document.getElementById("startBtn");



nameInput.addEventListener(
"input",
()=>{

startBtn.disabled =
nameInput.value.trim().length===0;

});



nameInput.addEventListener(
"keydown",
(e)=>{

if(e.key==="Enter"){

e.preventDefault();

if(!startBtn.disabled)
start();

}

});



// ================= BEARING =================

function getBearing(
lat1,lng1,
lat2,lng2
){

const y =
Math.sin(
(lng2-lng1)
*Math.PI/180
)
*
Math.cos(
lat2*Math.PI/180
);


const x =

Math.cos(lat1*Math.PI/180)
*
Math.sin(lat2*Math.PI/180)

-

Math.sin(lat1*Math.PI/180)
*
Math.cos(lat2*Math.PI/180)
*
Math.cos(
(lng2-lng1)
*Math.PI/180
);



return (
Math.atan2(y,x)
*180/Math.PI
+360
)%360;

}



// ================= START =================

function start(){


myName =
nameInput.value.trim();



if(!myName){

alert(
"❌ RESCUE ID 입력"
);

return;

}



nameInput.disabled=true;

startBtn.disabled=true;



watchId =
navigator.geolocation.watchPosition(

(pos)=>{


const current={

name:myName,

device:DEVICE_ID,

lat:pos.coords.latitude,

lng:pos.coords.longitude,

accuracy:pos.coords.accuracy,

speed:pos.coords.speed,

status:"normal"

};



if(previousPos){


const angle =
getBearing(

previousPos.lat,
previousPos.lng,

current.lat,
current.lng

);



if(!directionMarker){


directionMarker =
new kakao.maps.Marker({

map:map,

position:
new kakao.maps.LatLng(
current.lat,
current.lng
)

});


}



directionMarker.setPosition(

new kakao.maps.LatLng(
current.lat,
current.lng
)

);


directionMarker.setImage(
createArrowImage(angle)
);


}



previousPos=current;

lastPos=current;


},

()=>{

alert(
"GPS 오류"
);

},

{

enableHighAccuracy:true,

maximumAge:3000,

timeout:10000

}

);



intervalSend =
setInterval(
sendData,
5000
);



intervalLoad =
setInterval(
loadLive,
3000
);



if(isMobile && !centerInterval){

centerInterval =
setInterval(()=>{

if(lastPos){

map.setCenter(

new kakao.maps.LatLng(
lastPos.lat,
lastPos.lng
)

);

}

},5000);

}


}

// ================= SEND =================

function sendData(){

    if(!lastPos) return;


    fetch(API_URL,{
        method:"POST",

        headers:{
            "Content-Type":"text/plain"
        },

        body:JSON.stringify(lastPos)

    });

}



// ================= LIVE LOAD =================

function loadLive(){

    fetch(
        API_URL+
        "?t="+Date.now()
    )

    .then(r=>r.json())

    .then(renderLive)

    .catch(err=>{
        console.log(
        "LIVE ERROR",
        err
        );
    });

}



// ================= LIVE RENDER =================

function renderLive(data){


    const latest={};


    data.forEach(p=>{

        latest[p.name]=p;

    });



    Object.values(latest)
    .forEach(p=>{


        const key=p.name;


        const pos =
        new kakao.maps.LatLng(
            p.lat,
            p.lng
        );



        if(!markers[key]){


            markers[key] =
            new kakao.maps.Marker({

                map:map,

                position:pos

            });


        }

        else{


            markers[key]
            .setPosition(pos);


        }



        // ===== STATUS =====


        if(p.status==="SOS"){


            markers[key]
            .setImage(

            new kakao.maps.MarkerImage(

            "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png",

            new kakao.maps.Size(
                24,
                35
            )

            )

            );


        }



        else if(p.status==="SHARE"){


            markers[key]
            .setImage(

            new kakao.maps.MarkerImage(

            "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png",

            new kakao.maps.Size(
                24,
                35
            )

            )

            );


        }


    });


}



// ================= MY LOCATION =================

function goMyLocation(){


    if(!lastPos)
    return;


    map.setCenter(

    new kakao.maps.LatLng(
        lastPos.lat,
        lastPos.lng
    )

    );


}



// ================= SOS =================

function sendSOS(){


    if(!lastPos)
    return;



    const sosData={

        ...lastPos,

        status:"SOS"

    };



    fetch(API_URL,{

        method:"POST",

        headers:{
            "Content-Type":"text/plain"
        },

        body:
        JSON.stringify(sosData)

    });



    alert(
    "🚨 SOS 구조 요청 전송"
    );


}



// ================= STOP =================

function stopTracking(){


    if(watchId){

        navigator.geolocation
        .clearWatch(watchId);

    }



    clearInterval(intervalSend);

    clearInterval(intervalLoad);

    clearInterval(centerInterval);



    watchId=null;

    intervalSend=null;

    intervalLoad=null;

    centerInterval=null;



    lastPos=null;

    previousPos=null;

    myName="";



    if(directionMarker){

        directionMarker
        .setMap(null);

        directionMarker=null;

    }



    Object.values(markers)
    .forEach(m=>{

        m.setMap(null);

    });



    Object.keys(markers)
    .forEach(k=>{

        delete markers[k];

    });



    nameInput.disabled=false;

    nameInput.value="";

    startBtn.disabled=true;



    alert(
    "⛔ STOP 완료"
    );


}



// ================= SHARE =================

function shareLocation(){


    if(!lastPos)
    return;



    const text =

`📡 위치 공유

UNIT: ${lastPos.name}

LAT:
${lastPos.lat}

LNG:
${lastPos.lng}


https://map.kakao.com/link/map/${lastPos.lat},${lastPos.lng}`;



    fetch(API_URL,{

        method:"POST",

        headers:{
            "Content-Type":"text/plain"
        },

        body:

        JSON.stringify({

            ...lastPos,

            status:"SHARE"

        })

    });



    if(navigator.share){


        navigator.share({

            title:"위치 공유",

            text:text

        });


    }

    else{


        prompt(
        "복사:",
        text
        );


    }


}



// ================= HISTORY =================

function loadAllHistory(){


    fetch(

    API_URL+
    "?history=all&t="+Date.now()

    )

    .then(r=>r.json())

    .then(showHistory);


}




function showHistory(data){


    const grouped={};



    data.forEach(d=>{


        if(!grouped[d.name])
        grouped[d.name]=[];



        grouped[d.name]
        .push(

        new kakao.maps.LatLng(
            d.lat,
            d.lng
        )

        );


    });




    for(const name in grouped){


        const path =
        grouped[name];



        new kakao.maps.Polyline({

            map:map,

            path:path,

            strokeWeight:3,

            strokeColor:"#ffcc00"

        });



        new kakao.maps.Marker({

            map:map,

            position:path[0]

        });



        new kakao.maps.Marker({

            map:map,

            position:
            path[path.length-1]

        });


    }


}



// ================= ARROW IMAGE =================

function createArrowImage(angle){


    const canvas =
    document.createElement("canvas");


    canvas.width=40;

    canvas.height=40;



    const ctx =
    canvas.getContext("2d");



    ctx.translate(
        20,
        20
    );


    ctx.rotate(
        angle*Math.PI/180
    );



    ctx.fillStyle="#00ff00";



    ctx.beginPath();



    ctx.moveTo(
        0,
        -18
    );


    ctx.lineTo(
        10,
        10
    );


    ctx.lineTo(
        0,
        5
    );


    ctx.lineTo(
        -10,
        10
    );


    ctx.closePath();


    ctx.fill();



    return new kakao.maps.MarkerImage(

        canvas.toDataURL(),

        new kakao.maps.Size(
            40,
            40
        )

    );


}

</script>
</body>
</html>

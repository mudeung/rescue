<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛰 RESCUE FIELD SYSTEM (INTEGRATED)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
    margin:0;
    font-family:monospace;
    background:#050b18;
    color:#00ff9d;
    overflow:hidden;
}

header{
    background:#071a2f;
    padding:10px;
    text-align:center;
    font-weight:bold;
}

#container{
    display:flex;
    height:calc(100vh - 50px);
}

#panel{
    width:320px;
    background:#07101f;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
    overflow-y:auto;
}

#map{ flex:1; }

input, textarea, button, select{
    padding:10px;
    border:1px solid #00ff9d;
    background:#001a14;
    color:#00ff9d;
    font-size:13px;
}

button{ cursor:pointer; }
button:disabled{ opacity:0.4; }

textarea{ height:70px; resize:none; }
</style>
</head>

<body>

<header>🛰 RESCUE FIELD SYSTEM (INTEGRATED)</header>

<div id="container">

<div id="panel">

<input id="name" placeholder="UNIT ID">
<button id="startBtn" onclick="start()" disabled>START TRACK</button>

<button onclick="stopAll()">⛔ STOP</button>
<button onclick="sendSOS()">🚨 SOS</button>

<hr>

<textarea id="memo" placeholder="FIELD LOG"></textarea>
<button onclick="saveLog()">💾 SAVE LOG</button>
<button onclick="loadLogs()">📂 LOAD LOGS</button>

<hr>

<select id="filter" onchange="filterUnit()">
<option value="ALL">👥 ALL UNITS</option>
</select>

<hr>

<button onclick="loadHistory()">📦 HISTORY VIEW</button>

</div>

<div id="map"></div>

</div>

<script>

// ================= API =================
const API_URL = "https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";
const LOG_API = "https://script.google.com/macros/s/AKfycbyQSj47r-l2fSmBePIC11bAGtICM4eoQ7_WXXH3DuEkytDfyf524ROm0PLIQJSJmgikow/exec";

// ================= MAP =================
const map = L.map('map').setView([35.1239, 126.9883], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'OSM'
}).addTo(map);

// ================= STATE =================
let myName="";
let lastPos=null;
let watchId=null;
let sendInt=null;
let loadInt=null;

let allData=[];

const markers={};
const paths={};
const polylines={};

const logMarkers=[];

const historyLayer = L.layerGroup().addTo(map);

// ================= UI =================
const nameInput=document.getElementById("name");
const startBtn=document.getElementById("startBtn");

nameInput.addEventListener("input",()=>{
    startBtn.disabled = nameInput.value.trim()==="";
});

// ================= START =================
function start(){

    myName = nameInput.value.trim();
    if(!myName) return;

    nameInput.disabled=true;
    startBtn.disabled=true;

    watchId = navigator.geolocation.watchPosition(pos=>{

        lastPos = {
            name: myName,
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            speed: pos.coords.speed || 0,
            status: "normal"
        };

    });

    sendInt = setInterval(sendData,4000);
    loadInt = setInterval(loadData,4000);
}

// ================= STOP =================
function stopAll(){

    if(watchId) navigator.geolocation.clearWatch(watchId);
    clearInterval(sendInt);
    clearInterval(loadInt);

    watchId=null;
    sendInt=null;
    loadInt=null;

    lastPos=null;
    myName="";

    nameInput.value="";
    nameInput.disabled=false;
    startBtn.disabled=true;

    Object.values(markers).forEach(m=>map.removeLayer(m));
    Object.values(polylines).forEach(p=>map.removeLayer(p));
}

// ================= SEND =================
function sendData(){
    if(!lastPos) return;

    fetch(API_URL,{
        method:"POST",
        headers:{ "Content-Type":"text/plain" },
        body:JSON.stringify(lastPos)
    });
}

// ================= LOAD LIVE =================
function loadData(){
    fetch(API_URL + "?t=" + Date.now())
    .then(r=>r.json())
    .then(data=>{
        allData=data;
        updateFilter(data);
        renderLive(data);
    });
}

// ================= FILTER =================
function updateFilter(data){
    const sel=document.getElementById("filter");
    const names=[...new Set(data.map(x=>x.name))];

    sel.innerHTML=`<option value="ALL">👥 ALL UNITS</option>`;
    names.forEach(n=>{
        const o=document.createElement("option");
        o.value=n;
        o.textContent=n;
        sel.appendChild(o);
    });
}

function filterUnit(){
    const v=document.getElementById("filter").value;
    if(v==="ALL") renderLive(allData);
    else renderLive(allData.filter(x=>x.name===v));
}

// ================= LIVE RENDER =================
function renderLive(data){

    Object.values(markers).forEach(m=>map.removeLayer(m));
    Object.values(polylines).forEach(p=>map.removeLayer(p));

    for(const p of data){

        const key=p.name;
        const pos=[p.lat,p.lng];

        if(!paths[key]) paths[key]=[];
        paths[key].push(pos);

        if(!markers[key]){
            markers[key]=L.marker(pos).addTo(map);
        }else{
            markers[key].setLatLng(pos);
        }

        if(paths[key].length>1){
            polylines[key]=L.polyline(paths[key],{
                color:"#00ff9d",
                weight:3
            }).addTo(map);
        }

        if(p.status==="SOS"){
            markers[key].setIcon(
                L.icon({
                    iconUrl:"https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",
                    shadowUrl:"https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png",
                    iconSize:[25,41],
                    iconAnchor:[12,41]
                })
            );
        }
    }
}

// ================= SOS =================
function sendSOS(){

    if(!lastPos) return;

    lastPos.status="SOS";

    fetch(API_URL,{
        method:"POST",
        headers:{ "Content-Type":"text/plain" },
        body:JSON.stringify(lastPos)
    });

    alert("🚨 SOS SENT");
}

// ================= LOG =================
function saveLog(){

    if(!navigator.geolocation) return;

    navigator.geolocation.getCurrentPosition(pos=>{

        fetch(LOG_API,{
            method:"POST",
            body:JSON.stringify({
                lat:pos.coords.latitude,
                lng:pos.coords.longitude,
                memo:document.getElementById("memo").value
            })
        });

        alert("LOG SAVED");
        document.getElementById("memo").value="";
    });
}

function loadLogs(){

    fetch(LOG_API)
    .then(r=>r.json())
    .then(data=>{

        logMarkers.forEach(m=>map.removeLayer(m));
        logMarkers.length=0;

        data.forEach(item=>{

            const m=L.marker([item.lat,item.lng]).addTo(map);

            m.bindPopup(item.memo || "LOG");
            logMarkers.push(m);
        });
    });
}

// ================= HISTORY =================
function loadHistory(){

    fetch(API_URL + "?history=all&t=" + Date.now())
    .then(r=>r.json())
    .then(data=>{

        historyLayer.clearLayers();

        const grouped={};

        data.forEach(d=>{
            if(!grouped[d.name]) grouped[d.name]=[];
            grouped[d.name].push([d.lat,d.lng]);
        });

        for(const name in grouped){

            const path=grouped[name];

            L.polyline(path,{color:"#ffcc00"}).addTo(historyLayer);

            L.marker(path[0]).bindPopup("START "+name).addTo(historyLayer);
            L.marker(path[path.length-1]).bindPopup("END "+name).addTo(historyLayer);
        }

        alert("HISTORY LOADED");
    });
}

// ================= INIT =================
loadData();

</script>

</body>
</html>

<script>


// =========================================================
// API
// =========================================================

const API_URL =

"https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";


// =========================================================
// DEVICE
// =========================================================

let DEVICE_ID =
    localStorage.getItem(
        "DEVICE_ID"
    );


if(!DEVICE_ID){

    DEVICE_ID =
        crypto.randomUUID();

    localStorage.setItem(
        "DEVICE_ID",
        DEVICE_ID
    );

}


// =========================================================
// STATE
// =========================================================

let myName = "";

let lastPos = null;

let watchId = null;

let intervalSend = null;

let intervalLoad = null;

let startTime = "";

let endTime = "";

let centerInterval = null;

let wakeLock = null;

let wakeLockRetryTimer = null;

let isTracking = false;

let isSendingQueue = false;


// =========================================================
// MAP OBJECTS
// =========================================================

const markers = {};

const labels = {};

const historyMarkers = [];

const historyLines = [];

const historyLabels = [];

let savedMapMarker = null;

let savedMapOverlay = null;

let clickMarker = null;

let clickOverlay = null;


// =========================================================
// DOM
// =========================================================

const nameInput =
    document.getElementById(
        "name"
    );


const memoInput =
    document.getElementById(
        "memo"
    );


const startBtn =
    document.getElementById(
        "startBtn"
    );


const gpsStatus =
    document.getElementById(
        "gpsStatus"
    );


const wakeStatus =
    document.getElementById(
        "wakeStatus"
    );


const saveStatus =
    document.getElementById(
        "saveStatus"
    );


const savedPanel =
    document.getElementById(
        "savedPanel"
    );


const savedList =
    document.getElementById(
        "savedList"
    );


// =========================================================
// NAME
// =========================================================

nameInput.addEventListener(

    "input",

    () => {

        startBtn.disabled =
            nameInput.value.trim() === "";

    }

);


// =========================================================
// TIME
// =========================================================

function getNowTime(){

    const d =
        new Date();

    return (

        d.getFullYear()
        + "-"
        +
        String(
            d.getMonth() + 1
        ).padStart(2,"0")
        + "-"
        +
        String(
            d.getDate()
        ).padStart(2,"0")
        + " "
        +
        String(
            d.getHours()
        ).padStart(2,"0")
        + ":"
        +
        String(
            d.getMinutes()
        ).padStart(2,"0")
        + ":"
        +
        String(
            d.getSeconds()
        ).padStart(2,"0")

    );

}


// =========================================================
// HTML ESCAPE
// =========================================================

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


// =========================================================
// STATUS
// =========================================================

function setStatus(
    element,
    text,
    mode
){

    element.textContent =
        text;

    element.classList.remove(
        "on",
        "off",
        "warn"
    );

    element.classList.add(
        mode
    );

}


// =========================================================
// INDEXED DB
// =========================================================

const DB_NAME =
    "SEARCH_RESCUE_GPS_DB";

const DB_VERSION =
    2;

const STORE_NAME =
    "gps_records";

let db = null;


// =========================================================
// OPEN DB
// =========================================================

function openDatabase(){

    return new Promise(
        (resolve,reject) => {

            if(db){

                resolve(db);

                return;

            }


            if(!window.indexedDB){

                reject(
                    new Error(
                        "IndexedDB not supported"
                    )
                );

                return;

            }


            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );


            request.onupgradeneeded =
                function(event){

                    const database =
                        event.target.result;


                    let store;


                    if(
                        !database.objectStoreNames
                        .contains(STORE_NAME)
                    ){

                        store =
                            database.createObjectStore(

                                STORE_NAME,

                                {
                                    keyPath:
                                        "id",

                                    autoIncrement:
                                        true
                                }

                            );

                    }

                    else{

                        store =
                            event.target
                                .transaction
                                .objectStore(
                                    STORE_NAME
                                );

                    }


                    if(
                        !store.indexNames
                        .contains("sent")
                    ){

                        store.createIndex(
                            "sent",
                            "sent",
                            {
                                unique:
                                    false
                            }
                        );

                    }

                };


            request.onsuccess =
                function(event){

                    db =
                        event.target.result;

                    resolve(db);

                };


            request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

        }
    );

}


// =========================================================
// ADD LOCAL RECORD
// =========================================================

async function addLocalRecord(record){

    const database =
        await openDatabase();


    return new Promise(
        (resolve,reject) => {

            const tx =
                database.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            const store =
                tx.objectStore(
                    STORE_NAME
                );


            const request =
                store.add(record);


            request.onsuccess =
                function(){

                    resolve(
                        request.result
                    );

                };


            request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

        }
    );

}


// =========================================================
// GET ALL LOCAL
// =========================================================

async function getAllLocalRecords(){

    const database =
        await openDatabase();


    return new Promise(
        (resolve,reject) => {

            const tx =
                database.transaction(
                    STORE_NAME,
                    "readonly"
                );


            const store =
                tx.objectStore(
                    STORE_NAME
                );


            const request =
                store.getAll();


            request.onsuccess =
                function(){

                    resolve(
                        request.result
                    );

                };


            request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

        }
    );

}


// =========================================================
// GET PENDING
// =========================================================

async function getPendingRecords(){

    const all =
        await getAllLocalRecords();


    return all.filter(
        record =>
            record.sent !== true
    );

}


// =========================================================
// UPDATE RECORD
// =========================================================

async function updateLocalRecord(record){

    const database =
        await openDatabase();


    return new Promise(
        (resolve,reject) => {

            const tx =
                database.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            tx.objectStore(
                STORE_NAME
            ).put(record);


            tx.oncomplete =
                resolve;


            tx.onerror =
                () =>
                    reject(
                        tx.error
                    );

        }
    );

}


// =========================================================
// DELETE RECORD
// =========================================================

async function deleteLocalRecord(id){

    const database =
        await openDatabase();


    return new Promise(
        (resolve,reject) => {

            const tx =
                database.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            tx.objectStore(
                STORE_NAME
            ).delete(id);


            tx.oncomplete =
                resolve;


            tx.onerror =
                () =>
                    reject(
                        tx.error
                    );

        }
    );

}


// =========================================================
// DELETE ALL
// =========================================================

async function deleteAllLocalRecords(){

    const database =
        await openDatabase();


    return new Promise(
        (resolve,reject) => {

            const tx =
                database.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            tx.objectStore(
                STORE_NAME
            ).clear();


            tx.oncomplete =
                resolve;


            tx.onerror =
                () =>
                    reject(
                        tx.error
                    );

        }
    );

}

async function sendRecordToServer(record){

            record.name || "",

        lat:
            record.lat,

        lng:
            record.lng,

            record.startTime || "",

        endTime:

            record.recordedAt || "",

        localSavedAt:
            record.savedAt || ""

    };


    const response =
        await fetch(

            API_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain"

                },

                body:
                    JSON.stringify(
                        payload
                    )

            }

        );


    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }

}


// =========================================================
// SEND PENDING
// =========================================================

async function sendPendingQueue(){

    if(isSendingQueue)
        return;


    if(!navigator.onLine)
        return;


    isSendingQueue =
        true;


    try{

        const records =
            await getPendingRecords();


        for(
            const record
            of records
        ){

            try{

                await sendRecordToServer(
                    record
                );


                record.sent =
                    true;


                record.sentAt =
                    Date.now();


                await updateLocalRecord(
                    record
                );

            }

            catch(error){

                console.log(
                    "QUEUE ERROR",
                    error
                );

                break;

            }

        }

    }

    catch(error){

        console.log(
            "QUEUE LOAD ERROR",
            error
        );

    }

    finally{

        isSendingQueue =
            false;

        await updatePendingCount();

    }

}

async function saveGPSRecord(data){

    const id =
        await addLocalRecord({

            ...data,

            savedAt:
                Date.now(),

            sent:
                false

        });


    await updatePendingCount();


    if(navigator.onLine){

        await sendPendingQueue();

    }


    return id;

}

// =========================================================
// WAKE LOCK
// =========================================================

async function requestWakeLock(){

    if(!isTracking)
        return;


    if(
        !("wakeLock" in navigator)
    ){

        setStatus(
            wakeStatus,
            "🔒 미지원",
            "warn"
        );

        return;

    }


    if(
        document.visibilityState !==
        "visible"
    ){

        return;

    }


    if(wakeLock){

        setStatus(
            wakeStatus,
            "🔒 화면방지 ON",
            "on"
        );

        return;

    }


    try{

        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );


        setStatus(
            wakeStatus,
            "🔒 화면방지 ON",
            "on"
        );


        wakeLock.addEventListener(

            "release",

            () => {

                wakeLock =
                    null;


                if(isTracking){

                    setStatus(
                        wakeStatus,
                        "🔒 재연결",
                        "warn"
                    );


                    scheduleWakeLockRetry();

                }

            }

        );

    }

    catch(error){

        console.log(
            "WAKE ERROR",
            error
        );


        setStatus(
            wakeStatus,
            "🔒 OFF",
            "warn"
        );


        scheduleWakeLockRetry();

    }

}


// =========================================================
// WAKE RETRY
// =========================================================

function scheduleWakeLockRetry(){

    if(wakeLockRetryTimer)
        return;


    wakeLockRetryTimer =

        setTimeout(

            async () => {

                wakeLockRetryTimer =
                    null;


                if(isTracking){

                    await requestWakeLock();

                }

            },

            3000

        );

}


// =========================================================
// RELEASE WAKE
// =========================================================

async function releaseWakeLock(){

    if(wakeLock){

        try{

            await wakeLock.release();

        }

        catch(error){}

        wakeLock =
            null;

    }


    if(wakeLockRetryTimer){

        clearTimeout(
            wakeLockRetryTimer
        );

        wakeLockRetryTimer =
            null;

    }


    setStatus(
        wakeStatus,
        "🔒 화면방지 OFF",
        "off"
    );

}

// =========================================================
// START WATCH
// =========================================================

function startGPSWatch(){

    if(!navigator.geolocation){

        alert(
            "GPS를 사용할 수 없습니다."
        );

        return false;

    }


    if(watchId !== null){

        navigator.geolocation
        .clearWatch(
            watchId
        );

    }


    watchId =

        navigator.geolocation.watchPosition(

            handleGPSPosition,

            handleGPSError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    1000,

                timeout:
                    15000

            }

        );


    return true;

}


// =========================================================
// START
// =========================================================

async function start(){

    myName =
        nameInput.value.trim();


    if(!myName){

        alert(
            "RESCUE ID를 입력하세요."
        );

        return;

    }


    isTracking =
        true;


    startTime =
        getNowTime();


    nameInput.disabled =
        true;


    await requestWakeLock();


    if(!startGPSWatch()){

        isTracking =
            false;

        nameInput.disabled =
            false;

        return;

    }


    intervalSend =

        setInterval(

            sendData,

            5000

        );


    intervalLoad =

        setInterval(

            loadLive,

            3000

        );


    centerInterval =

        setInterval(

            () => {

                if(lastPos){

                    map.setCenter(

                        new kakao.maps.LatLng(

                            lastPos.lat,

                            lastPos.lng

                        )

                    );

                }

            },

            5000

        );


    // 기존 대기 데이터 전송

    await sendPendingQueue();


    // 즉시 GPS

    navigator.geolocation
    .getCurrentPosition(

        handleGPSPosition,

        handleGPSError,

        {

            enableHighAccuracy:
                true,

            maximumAge:
                0,

            timeout:
                15000

        }

    );


    loadLive();

}

// SEND DATA
// =========================================================

async function sendData(){

    if(!lastPos)
        return;


    await saveGPSRecord({

        ...lastPos,

        recordedAt:
            getNowTime()

    });

}


// =========================================================
// RESUME
// =========================================================

async function resumeTracking(){

    if(!isTracking)
        return;


    await requestWakeLock();


    if(navigator.geolocation){

        navigator.geolocation
        .getCurrentPosition(

            handleGPSPosition,

            handleGPSError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    0,

                timeout:
                    15000

            }

        );

    }


    await sendPendingQueue();


    loadLive();

}

            .filter(
                r =>
                    r.status === "MEMO"
            )
            .sort(
                (a,b) =>
                    Number(b.savedAt || 0)
                    -
                    Number(a.savedAt || 0)
            );


        if(saved.length === 0){

            savedList.innerHTML = `

                <div style="
                    padding:30px;
                    text-align:center;
                    color:#6aa99b;
                    font-size:11px;
                ">

                    💾 저장된 위치가 없습니다.

                </div>

            `;

            return;

        }


        savedList.innerHTML =
            "";


        saved.forEach(

            record => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "saved-item";


                item.innerHTML = `

                    <div class="saved-memo">

                        📝
                        ${escapeHTML(
                            record.memo ||
                            "NO MEMO"
                        )}

                    </div>

                    <div class="saved-info">

                        📍 LAT :
                        ${Number(
                            record.lat
                        ).toFixed(6)}

                        <br>

                        📍 LNG :
                        ${Number(
                            record.lng
                        ).toFixed(6)}

                        <br>

                        🕒
                        ${escapeHTML(
                            record.recordedAt ||
                            ""
                        )}

                        <br>

                        📡
                        ${record.sent === true
                            ? "SERVER SYNC"
                            : "LOCAL WAITING"}

                    </div>

                    <button
                        class="delete-saved"
                        data-id="${record.id}"
                    >
                        🗑
                    </button>

                `;


                // 항목 클릭

                item.addEventListener(

                    "click",

                    function(event){

                        if(
                            event.target
                            .closest(
                                ".delete-saved"
                            )
                        ){

                            return;

                        }


                        showSavedOnMap(
                            record
                        );

                    }

                );


                // 삭제

                item
                    .querySelector(
                        ".delete-saved"
                    )
                    .addEventListener(

                        "click",

                        async function(event){

                            event.stopPropagation();


                            const ok =
                                confirm(
                                    "이 저장 위치를 삭제하시겠습니까?"
                                );


                            if(!ok)
                                return;


                            await deleteLocalRecord(
                                record.id
                            );


                            if(
                                savedMapMarker &&
                                savedMapOverlay
                            ){

                                clearSavedMapMarker();

                            }


                            await renderSavedList();

                            await updatePendingCount();

                        }

                    );


                savedList.appendChild(
                    item
                );

            }

        );

    }

    catch(error){

        console.log(
            "LIST ERROR",
            error
        );

    }

}

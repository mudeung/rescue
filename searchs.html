<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUDEUNGSAN RESCUE + FIELD SYSTEM</title>

<style>
body{
    margin:0;
    font-family:monospace;
    background:#050b18;
    color:#00ff9d;
    overflow:hidden;
}

header{
    background:#071a2f;
    padding:10px;
    text-align:center;
    font-weight:bold;
}

#container{
    display:flex;
    height:calc(100vh - 50px);
}

#panel{
    width:340px;
    background:#07101f;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
    overflow-y:auto;
}

#map{ flex:1; }

input, textarea, button, select{
    padding:10px;
    border:1px solid #00ff9d;
    background:#001a14;
    color:#00ff9d;
    font-size:13px;
}

button{ cursor:pointer; }

button:disabled{
    opacity:0.4;
}

/* FIELD LOG */
textarea{
    height:70px;
    resize:none;
}
</style>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>
</head>

<body>

<header>🛰 MUDEUNGSAN RESCUE + FIELD SYSTEM</header>

<div id="container">

<div id="panel">

<!-- UNIT -->
<input id="name" placeholder="UNIT ID">
<button id="startBtn" onclick="start()" disabled>START TRACK</button>
<button onclick="stopAll()">⛔ STOP ALL</button>

<hr>

<!-- SOS -->
<button onclick="sendSOS()">🚨 SOS</button>

<hr>

<!-- FIELD LOG -->
<textarea id="memo" placeholder="현장 기록 입력"></textarea>
<button onclick="saveLog()">💾 LOG SAVE</button>
<button onclick="loadLogs()">📂 LOG LOAD</button>

<hr>

<select id="filter" onchange="filterUnit()">
<option value="ALL">👥 ALL UNITS</option>
</select>

</div>

<div id="map"></div>

</div>

<script>

// ================= API =================
const API_URL = "https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";
const LOG_API = "https://script.google.com/macros/s/AKfycbyQSj47r-l2fSmBePIC11bAGtICM4eoQ7_WXXH3DuEkytDfyf524ROm0PLIQJSJmgikow/exec";

// ================= MAP =================
const map = new kakao.maps.Map(document.getElementById('map'),{
    center:new kakao.maps.LatLng(35.12,126.98),
    level:4
});

// ================= STATE =================
let myName="";
let lastPos=null;
let watchId=null;
let sendInt=null;
let loadInt=null;

let allData=[];

let markers={};
let paths={};
let poly={};

let logMarkers=[];

// ================= INPUT =================
const nameInput=document.getElementById("name");
const startBtn=document.getElementById("startBtn");

nameInput.addEventListener("input",()=>{
    startBtn.disabled = nameInput.value.trim()==="";
});

// ================= START TRACK =================
function start(){

    myName=nameInput.value.trim();
    if(!myName) return;

    nameInput.disabled=true;
    startBtn.disabled=true;

    watchId=navigator.geolocation.watchPosition(pos=>{

        lastPos={
            name:myName,
            lat:pos.coords.latitude,
            lng:pos.coords.longitude,
            speed:pos.coords.speed||0,
            status:"normal"
        };

    });

    sendInt=setInterval(sendData,4000);
    loadInt=setInterval(loadData,4000);
}

// ================= STOP ALL =================
function stopAll(){

    if(watchId) navigator.geolocation.clearWatch(watchId);

    clearInterval(sendInt);
    clearInterval(loadInt);

    watchId=null;
    sendInt=null;
    loadInt=null;

    lastPos=null;
    myName="";

    nameInput.value="";
    nameInput.disabled=false;
    startBtn.disabled=true;

    Object.values(markers).forEach(m=>m.setMap(null));
    Object.values(poly).forEach(p=>p.setMap(null));

    markers={};
    paths={};
    poly={};
}

// ================= SEND =================
function sendData(){
    if(!lastPos) return;

    fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(lastPos)
    });
}

// ================= LOAD =================
function loadData(){

    fetch(API_URL)
    .then(r=>r.json())
    .then(data=>{
        allData=data;
        updateFilter(data);
        render(data);
    });
}

// ================= FILTER =================
function updateFilter(data){

    let sel=document.getElementById("filter");
    let names=[...new Set(data.map(x=>x.name))];

    sel.innerHTML=`<option value="ALL">👥 ALL UNITS</option>`;

    names.forEach(n=>{
        let o=document.createElement("option");
        o.value=n;
        o.textContent=n;
        sel.appendChild(o);
    });
}

function filterUnit(){
    let v=document.getElementById("filter").value;
    if(v==="ALL") render(allData);
    else render(allData.filter(x=>x.name===v));
}

// ================= MAP RENDER =================
function render(data){

    Object.values(markers).forEach(m=>m.setMap(null));
    Object.values(poly).forEach(p=>p.setMap(null));

    markers={};
    paths={};
    poly={};

    data.forEach(p=>{

        let key=p.name;
        let pos=new kakao.maps.LatLng(p.lat,p.lng);

        if(!paths[key]) paths[key]=[];
        paths[key].push(pos);

        if(!markers[key]){
            markers[key]=new kakao.maps.Marker({
                map:map,
                position:pos
            });
        }else{
            markers[key].setPosition(pos);
        }

        if(paths[key].length>1){
            poly[key]=new kakao.maps.Polyline({
                map:map,
                path:paths[key],
                strokeColor:"#00ff9d",
                strokeWeight:3
            });
        }
    });
}

// ================= SOS =================
function sendSOS(){
    if(!lastPos) return;

    lastPos.status="SOS";

    fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(lastPos)
    });

    alert("SOS SENT");
}

// ================= FIELD LOG =================
function saveLog(){

    if(!navigator.geolocation) return;

    navigator.geolocation.getCurrentPosition(pos=>{

        fetch(LOG_API,{
            method:"POST",
            body:JSON.stringify({
                lat:pos.coords.latitude,
                lng:pos.coords.longitude,
                memo:document.getElementById("memo").value
            })
        });

        alert("LOG SAVED");
        document.getElementById("memo").value="";

    });
}

function loadLogs(){

    fetch(LOG_API)
    .then(r=>r.json())
    .then(data=>{

        logMarkers.forEach(m=>m.setMap(null));
        logMarkers=[];

        data.forEach(item=>{

            let pos=new kakao.maps.LatLng(item.lat,item.lng);

            let m=new kakao.maps.Marker({
                map:map,
                position:pos
            });

            let iw=new kakao.maps.InfoWindow({
                content:`<div style="color:black;padding:5px;">${item.memo}</div>`
            });

            kakao.maps.event.addListener(m,"click",()=>{
                iw.open(map,m);
            });

            logMarkers.push(m);
        });
    });
}

// ================= INIT =================
loadData();

</script>

</body>
</html>

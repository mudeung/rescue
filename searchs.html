<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛰 SEARCH AND RESCUE AI MAP</title>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{
    margin:0;
    background:#050b18;
    color:#00ff9d;
    font-family:monospace;
    overflow:hidden;
}

header{
    background:#071a2f;
    padding:10px;
    text-align:center;
    font-weight:bold;
}

#container{
    display:flex;
    height:calc(100vh - 50px);
}

#panel{
    width:300px;
    background:#07101f;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:6px;
}

#map{ flex:1; }

input,button{
    padding:10px;
    border:1px solid #00ff9d;
    background:#001a14;
    color:#00ff9d;
}

button:disabled{
    opacity:0.5;
}
</style>
</head>

<body>

<header>🛰 SEARCH AND RESCUE AI MAP</header>

<div id="container">

<div id="panel">
<input id="name" placeholder="RESCUE ID">
<button id="startBtn" onclick="start()" disabled>START</button>

<button onclick="goMyLocation()">📍 MY LOCATION</button>
<button onclick="shareLocation()">📡 위치 공유</button>
<button onclick="stopTracking()">⛔ STOP</button>
<button onclick="loadAllHistory()">📦 전체 기록</button>
</div>

<div id="map"></div>

</div>

<script>

// ================= API =================
const API_URL = "https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";

// ================= DEVICE ID (PC/MOBILE 자동 연동 핵심) =================
const DEVICE_ID = localStorage.getItem("device_id") || crypto.randomUUID();
localStorage.setItem("device_id", DEVICE_ID);

// ================= DEVICE TYPE =================
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

// ================= MAP =================
const map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(35.1239, 126.9883),
    level: 5
});

// ================= STATE =================
let myName = "";
let lastPos = null;
let watchId = null;
let intervalSend = null;
let intervalLoad = null;

const markers = {};

// ================= INPUT =================
const nameInput = document.getElementById("name");
const startBtn = document.getElementById("startBtn");

// 버튼 활성화 (빈칸 방지)
nameInput.addEventListener("input", () => {
    const valid = nameInput.value.trim().length > 0;
    startBtn.disabled = !valid;
});

// ENTER 방지 + 실행
nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        if (!startBtn.disabled) start();
    }
});

// ================= START =================
function start(){

    myName = nameInput.value.trim();

    // 🚨 최종 검증
    if (!myName) {
        alert("❌ RESCUE ID를 입력하세요");
        return;
    }

    nameInput.disabled = true;
    startBtn.disabled = true;

    watchId = navigator.geolocation.watchPosition((pos)=>{

        lastPos = {
            name: myName,
            device: DEVICE_ID,
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            status: "normal"
        };

    }, ()=>alert("GPS 오류"), {
        enableHighAccuracy: true
    });

    intervalSend = setInterval(sendData, 5000);
    intervalLoad = setInterval(loadLive, 3000);

    // 📱 모바일 자동 중심 고정
    if(isMobile){
        setInterval(() => {
            if(lastPos){
                map.setCenter(new kakao.maps.LatLng(lastPos.lat, lastPos.lng));
            }
        }, 5000);
    }
}

// ================= SEND =================
function sendData(){
    if(!lastPos) return;

    fetch(API_URL,{
        method:"POST",
        headers:{ "Content-Type":"text/plain" },
        body: JSON.stringify(lastPos)
    });
}

// ================= LIVE =================
function loadLive(){
    fetch(API_URL + "?t=" + Date.now())
    .then(r => r.json())
    .then(renderLive);
}

// ================= RENDER (PC/MOBILE SYNC 핵심) =================
function renderLive(data){

    const latest = {};

    // 🔥 name 기준 최신 데이터만 유지
    data.forEach(p => {
        latest[p.name] = p;
    });

    Object.values(latest).forEach(p => {

        const key = p.name;
        const pos = new kakao.maps.LatLng(p.lat, p.lng);

        if(!markers[key]){

            markers[key] = new kakao.maps.Marker({
                map: map,
                position: pos
            });

        } else {
            markers[key].setPosition(pos);
        }

        // ================= STATUS =================
        if(p.status === "SOS"){
            markers[key].setImage(
                new kakao.maps.MarkerImage(
                    "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png",
                    new kakao.maps.Size(24,35)
                )
            );
        }

        if(p.status === "SHARE"){
            markers[key].setImage(
                new kakao.maps.MarkerImage(
                    "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png",
                    new kakao.maps.Size(24,35)
                )
            );
        }
    });
}

// ================= CENTER =================
function goMyLocation(){
    if(!lastPos) return;
    map.setCenter(new kakao.maps.LatLng(lastPos.lat, lastPos.lng));
}

// ================= STOP =================
function stopTracking(){

    if(watchId) navigator.geolocation.clearWatch(watchId);

    clearInterval(intervalSend);
    clearInterval(intervalLoad);

    watchId = null;
    intervalSend = null;
    intervalLoad = null;

    lastPos = null;
    myName = "";

    nameInput.disabled = false;
    nameInput.value = "";
    startBtn.disabled = true;

    alert("⛔ STOP 완료");
}

// ================= SHARE =================
function shareLocation(){

    if(!lastPos) return;

    const text =
`📡 위치 공유
UNIT: ${lastPos.name}
LAT: ${lastPos.lat}
LNG: ${lastPos.lng}
https://map.kakao.com/link/map/${lastPos.lat},${lastPos.lng}`;

    fetch(API_URL,{
        method:"POST",
        headers:{ "Content-Type":"text/plain" },
        body: JSON.stringify({...lastPos, status:"SHARE"})
    });

    if(navigator.share){
        navigator.share({
            title:"위치 공유",
            text:text
        });
    } else {
        prompt("복사:", text);
    }
}

// ================= HISTORY =================
function loadAllHistory(){

    fetch(API_URL + "?history=all&t=" + Date.now())
    .then(r => r.json())
    .then(showHistory);
}

function showHistory(data){

    const grouped = {};

    data.forEach(d => {
        if(!grouped[d.name]) grouped[d.name] = [];
        grouped[d.name].push(new kakao.maps.LatLng(d.lat, d.lng));
    });

    for(const name in grouped){

        const path = grouped[name];

        new kakao.maps.Polyline({
            map: map,
            path: path,
            strokeWeight: 3,
            strokeColor: "#ffcc00"
        });

        new kakao.maps.Marker({
            map: map,
            position: path[0]
        });

        new kakao.maps.Marker({
            map: map,
            position: path[path.length - 1]
        });
    }
}

</script>
</body>
</html>

<header>

📦 전체 기록

<script>


// =========================================================
// GOOGLE APPS SCRIPT API
// =========================================================

const API_URL =

"https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";


// =========================================================
// DEVICE ID
// =========================================================

let DEVICE_ID =

localStorage.getItem(
    "DEVICE_ID"
);


if(!DEVICE_ID){

    DEVICE_ID =
        crypto.randomUUID();

    localStorage.setItem(
        "DEVICE_ID",
        DEVICE_ID
    );

}


// =========================================================
// STATE
// =========================================================

let myName = "";

let lastPos = null;

let watchId = null;

let intervalSend = null;

let intervalLoad = null;

let startTime = "";

let endTime = "";

let centerInterval = null;

let wakeLock = null;

let wakeLockRetryTimer = null;

let isTracking = false;

let gpsLastUpdate = 0;

let isSendingQueue = false;


// =========================================================
// GPS AUTO SAVE INTERVAL
// =========================================================

const GPS_SAVE_INTERVAL = 20000;


// =========================================================
// MAP OBJECTS
// =========================================================

const markers = {};

const labels = {};

const historyMarkers = [];

const historyLines = [];

const historyLabels = [];


// =========================================================
// CLICK OBJECTS
// =========================================================

let clickMarker = null;

let clickOverlay = null;


// =========================================================
// DOM
// =========================================================

const nameInput =

    document.getElementById(
        "name"
    );


const startBtn =

    document.getElementById(
        "startBtn"
    );


const gpsStatus =

    document.getElementById(
        "gpsStatus"
    );


const wakeStatus =

    document.getElementById(
        "wakeStatus"
    );


const saveStatus =

    document.getElementById(
        "saveStatus"
    );


// =========================================================
// NAME INPUT
// =========================================================

nameInput.addEventListener(

    "input",

    () => {

        startBtn.disabled =
            nameInput.value.trim() === "";

    }

);


// =========================================================
// TIME
// =========================================================

function getNowTime(){

    const d =
        new Date();

    return (

        d.getFullYear()

        + "-"

        +

        String(
            d.getMonth() + 1
        ).padStart(2,"0")

        + "-"

        +

        String(
            d.getDate()
        ).padStart(2,"0")

        + " "

        +

        String(
            d.getHours()
        ).padStart(2,"0")

        + ":"

        +

        String(
            d.getMinutes()
        ).padStart(2,"0")

        + ":"

        +

        String(
            d.getSeconds()
        ).padStart(2,"0")

    );

}


// =========================================================
// STATUS
// =========================================================

function setStatus(
    element,
    text,
    mode
){

    element.textContent =
        text;

    element.classList.remove(
        "on",
        "off",
        "warn"
    );

    element.classList.add(
        mode
    );

}


// =========================================================
// INDEXED DB
// =========================================================

const DB_NAME =
    "SEARCH_RESCUE_GPS_DB";

const DB_VERSION =
    1;

const STORE_NAME =
    "gps_records";

let db = null;


// =========================================================
// OPEN DATABASE
// =========================================================

function openDatabase(){

    return new Promise(
        (resolve,reject) => {

            if(db){

                resolve(db);

                return;

            }


            if(!window.indexedDB){

                reject(
                    new Error(
                        "IndexedDB not supported"
                    )
                );

                return;

            }


            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );


            request.onupgradeneeded =
                function(event){

                    const database =
                        event.target.result;


                    if(
                        !database.objectStoreNames
                        .contains(STORE_NAME)
                    ){

                        const store =
                            database.createObjectStore(
                                STORE_NAME,
                                {
                                    keyPath:
                                        "id",
                                    autoIncrement:
                                        true
                                }
                            );


                        store.createIndex(
                            "sent",
                            "sent",
                            {
                                unique:
                                    false
                            }
                        );


                        store.createIndex(
                            "recordedAt",
                            "recordedAt",
                            {
                                unique:
                                    false
                            }
                        );


                        store.createIndex(
                            "device",
                            "device",
                            {
                                unique:
                                    false
                            }
                        );

                    }

                };


            request.onsuccess =
                function(event){

                    db =
                        event.target.result;


                    db.onversionchange =
                        function(){

                            db.close();

                            db = null;

                        };


                    resolve(db);

                };


            request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

        }
    );

}


// =========================================================
// SAVE GPS LOCALLY
// =========================================================

async function saveGPSLocal(data){

    try{

        const database =
            await openDatabase();


        return new Promise(
            (resolve,reject) => {

                const tx =
                    database.transaction(
                        STORE_NAME,
                        "readwrite"
                    );


                const store =
                    tx.objectStore(
                        STORE_NAME
                    );


                const record = {

                    name:
                        data.name || "",

                    device:
                        data.device || DEVICE_ID,

                    lat:
                        Number(data.lat),

                    lng:
                        Number(data.lng),

                    accuracy:
                        data.accuracy ?? null,

                    speed:
                        data.speed ?? null,

                    heading:
                        data.heading ?? null,

                    status:
                        data.status || "normal",

                    startTime:
                        data.startTime || "",

                    endTime:
                        data.endTime || "",

                    recordedAt:
                        data.recordedAt ||
                        getNowTime(),

                    savedAt:
                        Date.now(),

                    sent:
                        false,

                    sentAt:
                        null

                };


                const request =
                    store.add(record);


                request.onsuccess =
                    function(){

                        resolve(
                            request.result
                        );

                    };


                request.onerror =
                    function(){

                        reject(
                            request.error
                        );

                    };


                tx.onerror =
                    function(){

                        reject(
                            tx.error
                        );

                    };

            }
        );

    }

    catch(error){

        console.log(
            "LOCAL SAVE ERROR",
            error
        );

        throw error;

    }

}


// =========================================================
// GET PENDING
// =========================================================

async function getPendingRecords(){

    try{

        const database =
            await openDatabase();


        return new Promise(
            (resolve,reject) => {

                const tx =
                    database.transaction(
                        STORE_NAME,
                        "readonly"
                    );


                const store =
                    tx.objectStore(
                        STORE_NAME
                    );


                const request =
                    store.getAll();


                request.onsuccess =
                    function(){

                        const result =
                            request.result
                            .filter(
                                x =>
                                    x.sent === false
                            )
                            .sort(
                                (a,b) =>
                                    a.savedAt -
                                    b.savedAt
                            );


                        resolve(result);

                    };


                request.onerror =
                    function(){

                        reject(
                            request.error
                        );

                    };

            }
        );

    }

    catch(error){

        console.log(
            "GET PENDING ERROR",
            error
        );

        return [];

    }

}


// =========================================================
// MARK RECORD SENT
// =========================================================

async function markRecordSent(id){

    try{

        const database =
            await openDatabase();


        return new Promise(
            (resolve,reject) => {

                const tx =
                    database.transaction(
                        STORE_NAME,
                        "readwrite"
                    );


                const store =
                    tx.objectStore(
                        STORE_NAME
                    );


                const request =
                    store.get(id);


                request.onsuccess =
                    function(){

                        const record =
                            request.result;


                        if(record){

                            record.sent =
                                true;


                            record.sentAt =
                                Date.now();


                            store.put(
                                record
                            );

                        }

                    };


                tx.oncomplete =
                    function(){

                        resolve();

                    };


                tx.onerror =
                    function(){

                        reject(
                            tx.error
                        );

                    };

            }
        );

    }

    catch(error){

        console.log(
            "MARK SENT ERROR",
            error
        );

    }

}


// =========================================================
// PENDING COUNT
// =========================================================

async function getPendingCount(){

    const records =
        await getPendingRecords();

    return records.length;

}


// =========================================================
// UPDATE SAVE STATUS
// =========================================================

async function updatePendingCount(){

    const count =
        await getPendingCount();


    if(count === 0){

        setStatus(
            saveStatus,
            "💾 저장 0",
            "on"
        );

    }

    else{

        setStatus(
            saveStatus,
            "💾 전송대기 " + count,
            "warn"
        );

    }

}


// =========================================================
// SEND ONE RECORD
// =========================================================

async function sendRecord(record){

    const payload = {

        name:
            record.name,

        device:
            record.device,

        lat:
            record.lat,

        lng:
            record.lng,

        accuracy:
            record.accuracy,

        speed:
            record.speed,

        heading:
            record.heading,

        status:
            record.status,

        startTime:
            record.startTime || "",

        endTime:
            record.endTime || "",

        recordedAt:
            record.recordedAt || "",

        localSavedAt:
            record.savedAt || ""

    };


    const response =
        await fetch(

            API_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify(
                        payload
                    )

            }

        );


    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    return true;

}


// =========================================================
// SEND PENDING QUEUE
// =========================================================

async function sendPendingQueue(){

    if(isSendingQueue)
        return;


    if(!navigator.onLine)
        return;


    isSendingQueue =
        true;


    try{

        const records =
            await getPendingRecords();


        if(
            records.length === 0
        ){

            await updatePendingCount();

            return;

        }


        for(
            const record of records
        ){

            try{

                await sendRecord(
                    record
                );


                await markRecordSent(
                    record.id
                );


                await updatePendingCount();

            }

            catch(error){

                console.log(
                    "QUEUE SEND ERROR",
                    error
                );

                break;

            }

        }

    }

    finally{

        isSendingQueue =
            false;

        await updatePendingCount();

    }

}


// =========================================================
// SAVE + SEND
// =========================================================

async function saveAndSend(data){

    let localId = null;


    try{

        localId =
            await saveGPSLocal(
                data
            );

    }

    catch(error){

        alert(
            "⚠️ 휴대폰 저장에 실패했습니다."
        );

        console.log(
            error
        );

        return false;

    }


    await updatePendingCount();


    if(
        navigator.onLine
    ){

        await sendPendingQueue();

    }


    return localId;

}

// =========================================================
// WAKE LOCK
// =========================================================

async function requestWakeLock(){

    if(!isTracking)
        return;


    try{

        if(
            !("wakeLock" in navigator)
        ){

            setStatus(
                wakeStatus,
                "🔒 미지원",
                "warn"
            );

            return;

        }


        if(
            document.visibilityState !==
            "visible"
        ){

            return;

        }


        if(wakeLock){

            setStatus(
                wakeStatus,
                "🔒 화면방지 ON",
                "on"
            );

            return;

        }


        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );


        setStatus(
            wakeStatus,
            "🔒 화면방지 ON",
            "on"
        );


        wakeLock.addEventListener(

            "release",

            () => {

                wakeLock =
                    null;


                if(isTracking){

                    setStatus(
                        wakeStatus,
                        "🔒 재연결 중",
                        "warn"
                    );


                    scheduleWakeLockRetry();

                }

            }

        );

    }

    catch(error){

        console.log(
            "Wake Lock ERROR",
            error
        );


        setStatus(
            wakeStatus,
            "🔒 OFF",
            "warn"
        );


        scheduleWakeLockRetry();

    }

}


// =========================================================
// WAKE LOCK RETRY
// =========================================================

function scheduleWakeLockRetry(){

    if(wakeLockRetryTimer)
        return;


    wakeLockRetryTimer =

        setTimeout(

            async () => {

                wakeLockRetryTimer =
                    null;


                if(isTracking){

                    await requestWakeLock();

                }

            },

            3000

        );

}


// =========================================================
// RELEASE WAKE LOCK
// =========================================================

async function releaseWakeLock(){

    try{

        if(wakeLock){

            await wakeLock.release();

            wakeLock =
                null;

        }

    }

    catch(error){

        console.log(
            "WAKE RELEASE ERROR",
            error
        );

    }


    if(wakeLockRetryTimer){

        clearTimeout(
            wakeLockRetryTimer
        );

        wakeLockRetryTimer =
            null;

    }


    setStatus(
        wakeStatus,
        "🔒 화면방지 OFF",
        "off"
    );

}

// =========================================================
// START GPS WATCH
// =========================================================

function startGPSWatch(){

    if(
        !navigator.geolocation
    ){

        alert(
            "이 기기는 GPS 위치 기능을 지원하지 않습니다."
        );

        return false;

    }


    /*
       기존 watch가 있으면 제거
    */

    if(
        watchId !== null
    ){

        navigator.geolocation
        .clearWatch(
            watchId
        );

        watchId =
            null;

    }


    /*
       GPS 위치 추적 시작
    */

    watchId =

        navigator.geolocation.watchPosition(

            handleGPSPosition,

            handleGPSError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    1000,

                timeout:
                    15000

            }

        );


    return true;

}


// =========================================================
// START
// =========================================================

async function start(){

    myName =
        nameInput.value.trim();


    if(!myName){

        alert(
            "RESCUE ID 입력"
        );

        return;

    }


    if(
        !navigator.geolocation
    ){

        alert(
            "이 기기는 GPS 위치 기능을 지원하지 않습니다."
        );

        return;

    }


    /*
       ★ 새로운 기록 세션 시작
    */

    isTracking =
        true;


    startTime =
        getNowTime();


    endTime =
        "";


    /*
       새로운 START에서는
       이전 세션의 이름/상태를 사용한다.
    */

    nameInput.disabled =
        true;


    startBtn.disabled =
        true;


    setStatus(
        gpsStatus,
        "📍 GPS 시작",
        "warn"
    );


    await requestWakeLock();


    /*
       GPS watch 시작
    */

    const gpsStarted =
        startGPSWatch();


    if(!gpsStarted){

        isTracking =
            false;

        nameInput.disabled =
            false;

        startBtn.disabled =
            false;

        return;

    }


    /*
       기존 자동 저장 타이머 제거
    */

    if(intervalSend){

        clearInterval(
            intervalSend
        );

    }


    /*
       20초마다 GPS 기록
    */

    intervalSend =

        setInterval(

            async () => {

                /*
                   ★ STOP 이후 절대 저장하지 않음
                */

                if(!isTracking)
                    return;


                if(!lastPos)
                    return;


                const record = {

                    ...lastPos,

                    name:
                        myName,

                    status:
                        "normal",

                    startTime:
                        startTime,

                    endTime:
                        "",

                    recordedAt:
                        getNowTime()

                };


                await saveAndSend(
                    record
                );

            },

            GPS_SAVE_INTERVAL

        );


    /*
       기존 실시간 조회 타이머 제거
    */

    if(intervalLoad){

        clearInterval(
            intervalLoad
        );

    }


    /*
       다른 구조대 위치
       3초마다 조회
    */

    intervalLoad =

        setInterval(

            loadLive,

            3000

        );


    startMobileCenter();


    /*
       기존 IndexedDB 미전송 기록 전송
    */

    await sendPendingQueue();


    /*
       즉시 GPS 위치 요청
    */

    navigator.geolocation
    .getCurrentPosition(

        handleGPSPosition,

        handleGPSError,

        {

            enableHighAccuracy:
                true,

            maximumAge:
                0,

            timeout:
                15000

        }

    );


    loadLive();

}

// =========================================================

// =========================================================

function loadLive(){

    if(!navigator.onLine)
        return;


    fetch(

        API_URL +
        "?live=1&t=" +
        Date.now(),

        {
            cache:
                "no-store"
        }

    )

    .then(
        r => {

            if(!r.ok)
                throw new Error(
                    "HTTP " + r.status
                );

            return r.json();

        }
    )

    .then(

        data => {

            if(Array.isArray(data)){

                renderLive(
                    data
                );

            }

        }

    )

    .catch(

        err => {

            console.log(
                "LIVE ERROR",
                err
            );

        }

    );

}


// =========================================================
// LIVE RENDER
// =========================================================

function renderLive(data){

    const latest = {};


    data.forEach(

        p => {

            latest[p.name] =
                p;

        }

    );


    Object.values(latest)
    .forEach(

        p => {

            const lat =
                Number(p.lat);

            const lng =
                Number(p.lng);


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            )
                return;


            const key =
                p.name;


            const position =

                new kakao.maps.LatLng(
                    lat,
                    lng
                );


            if(!markers[key]){

                markers[key] =

                    new kakao.maps.Marker({

                        map:
                            map,

                        position:
                            position

                    });


                labels[key] =

                    new kakao.maps.CustomOverlay({

                        map:
                            map,

                        position:
                            position,

                        content:

                            `<div class="name-label">

                                🛰 ${p.name}

                            </div>`,

                        yAnchor:
                            1.5

                    });

            }

            else{

                markers[key]
                    .setPosition(
                        position
                    );


                labels[key]
                    .setPosition(
                        position
                    );

            }


            if(
                p.status === "SOS"
            ){

                markers[key]
                .setImage(

                    new kakao.maps.MarkerImage(

                        "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png",

                        new kakao.maps.Size(
                            32,
                            45
                        )

                    )

                );

            }

        }

    );

}

async function sendSOS(){

    /*
       SOS는 자동 20초 기록과 무관하게
       누르는 즉시 별도 저장
    */

    let position =
        lastPos;


    /*
       현재 위치가 없으면 GPS 즉시 요청
    */

    if(!position){

        if(
            !navigator.geolocation
        ){

            alert(
                "현재 위치 없음"
            );

            return;

        }


        setStatus(
            gpsStatus,
            "📍 SOS 위치 확인 중",
            "warn"
        );


        try{

            const pos =
                await new Promise(
                    (resolve,reject) => {

                        navigator.geolocation
                        .getCurrentPosition(

                            resolve,

                            reject,

                            {

                                enableHighAccuracy:
                                    true,

                                maximumAge:
                                    0,

                                timeout:
                                    15000

                            }

                        );

                    }
                );


            position = {

                name:
                    myName ||
                    nameInput.value.trim(),

                device:
                    DEVICE_ID,

                lat:
                    pos.coords.latitude,

                lng:
                    pos.coords.longitude,

                accuracy:
                    pos.coords.accuracy,

                speed:
                    pos.coords.speed,

                heading:
                    pos.coords.heading

            };


            lastPos =
                position;

        }

        catch(error){

            console.log(
                "SOS GPS ERROR",
                error
            );


            alert(
                "🚨 현재 위치를 확인할 수 없습니다."
            );

            return;

        }

    }


    /*
       SOS 별도 기록
    */

    const data = {

        ...position,

        name:
            myName ||
            position.name ||
            nameInput.value.trim(),

        device:
            DEVICE_ID,

        status:
            "SOS",

        startTime:
            startTime,

        endTime:
            "",

        recordedAt:
            getNowTime()

    };


    await saveAndSend(
        data
    );


    setStatus(
        gpsStatus,
        "📍 GPS ON",
        "on"
    );


    alert(
        "🚨 SOS 기록 저장 및 전송 완료"
    );

}

// =========================================================
// STOP
// =========================================================

async function stopTracking(){

    if(!isTracking){

        alert(
            "현재 기록 중이 아닙니다."
        );

        return;

    }


    /*
       =====================================================
       ★★★★★ STOP 핵심 ★★★★★
       =====================================================

       반드시 가장 먼저 false로 변경한다.

       GPS callback이나 20초 timer가 동시에 실행되더라도
       STOP 이후 자동 GPS 기록이 생성되지 않는다.
    */

    isTracking =
        false;


    /*
       ★ STOP 버튼을 누른 정확한 시간을 종료시간으로 확정
    */

    endTime =
        getNowTime();


    /*
       =====================================================
       ★ STOP 종료 기록 저장
       =====================================================

       마지막 GPS 위치가 있는 경우
       status = END 로 별도 1회 저장한다.

       Google Sheet에는:

       startTime = START 시간
       endTime   = STOP 시간
       
       이 함께 들어간다.
    */

    if(lastPos){

        const endRecord = {

            ...lastPos,

            name:
                myName ||
                lastPos.name ||
                nameInput.value.trim(),

            device:
                DEVICE_ID,

            lat:
                Number(lastPos.lat),

            lng:
                Number(lastPos.lng),

            accuracy:
                lastPos.accuracy,

            speed:
                lastPos.speed,

            heading:
                lastPos.heading,

            status:
                "END",

            startTime:
                startTime,

            endTime:
                endTime,

            recordedAt:
                endTime

        };


        try{

            await saveAndSend(
                endRecord
            );


            console.log(
                "✅ STOP END RECORD SAVED",
                endRecord
            );

        }

        catch(error){

            console.log(
                "STOP END RECORD ERROR",
                error
            );

        }

    }


    /*
       =====================================================
       자동 20초 기록 타이머 중지
       =====================================================
    */

    if(intervalSend){

        clearInterval(
            intervalSend
        );

        intervalSend =
            null;

    }


    /*
       =====================================================
       실시간 구조대 조회 중지
       =====================================================
    */

    if(intervalLoad){

        clearInterval(
            intervalLoad
        );

        intervalLoad =
            null;

    }


    /*
       =====================================================
       지도 자동 중앙 이동 중지
       =====================================================
    */

    if(centerInterval){

        clearInterval(
            centerInterval
        );

        centerInterval =
            null;

    }


    /*
       =====================================================
       Wake Lock 해제
       =====================================================
    */

    await releaseWakeLock();


    /*
       =====================================================
       기존 IndexedDB 미전송 기록 전송
       =====================================================
    */

    await sendPendingQueue();


    /*
       =====================================================
       ★ GPS watchPosition은 제거하지 않는다 ★

       GPS 추적 자체는 계속 유지한다.

       단, handleGPSPosition()에서:

           if(!isTracking){
               return;
           }

       하기 때문에 STOP 이후 GPS 자동 기록은 없다.
       =====================================================
    */


    /*
       GPS 상태 표시
    */

    setStatus(
        gpsStatus,
        "📍 GPS 추적 / 기록 OFF",
        "warn"
    );


    /*
       실시간 구조대 마커 제거
    */

    Object.values(markers)
    .forEach(

        marker => {

            marker.setMap(
                null
            );

        }

    );


    Object.keys(markers)
    .forEach(

        key => {

            delete markers[key];

        }

    );


    Object.values(labels)
    .forEach(

        label => {

            label.setMap(
                null
            );

        }

    );


    Object.keys(labels)
    .forEach(

        key => {

            delete labels[key];

        }

    );


    /*
       다음 START를 위해 입력창 활성화
    */

    nameInput.disabled =
        false;


    nameInput.value =
        "";


    startBtn.disabled =
        true;


    /*
       마지막 위치는 삭제하지 않는다.
       GPS watch는 계속 살아있기 때문에
       STOP 이후에도 현재 위치 자체는 갱신된다.

       하지만 자동 기록은 하지 않는다.
    */


    await updatePendingCount();


    /*
       ★ 종료 시간 표시
    */

    alert(

        "⛔ STOP 완료\n\n" +

        "GPS 자동 기록이 중지되었습니다.\n\n" +

        "START TIME\n" +

        startTime +

        "\n\n" +

        "END TIME\n" +

        endTime +

        "\n\n" +

        "마지막 위치에 END 기록이 저장되었습니다."

    );

}


// =========================================================
// BACKGROUND / RETURN
// =========================================================

async function resumeTracking(){

    /*
       STOP 상태에서는 아무 작업도 하지 않는다.
    */

    if(!isTracking){

        return;

    }


    console.log(
        "🔄 GPS 추적 복귀"
    );


    /*
       화면 복귀 즉시 Wake Lock 재요청
    */

    await requestWakeLock();


    /*
       현재 위치 즉시 요청
    */

    if(
        navigator.geolocation
    ){

        navigator.geolocation
        .getCurrentPosition(

            handleGPSPosition,

            handleGPSError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    0,

                timeout:
                    15000

            }

        );

    }


    /*
       IndexedDB 미전송 기록 전송
    */

    await sendPendingQueue();


    /*
       다른 구조대 위치 갱신
    */

    loadLive();

}

// =========================================================
// NATIONAL PARK
// =========================================================

function loadNationalParks(){

    fetch(
        "national_parks.geojson"
    )

    .then(
        r => r.json()
    )

    .then(

        data => {

            data.features.forEach(

                feature => {

                    const geometry =
                        feature.geometry;


                    if(
                        geometry.type ===
                        "Polygon"
                    ){

                        drawPark(
                            geometry.coordinates[0],
                            feature
                        );

                    }


                    if(
                        geometry.type ===
                        "MultiPolygon"
                    ){

                        geometry.coordinates
                        .forEach(

                            poly => {

                                drawPark(
                                    poly[0],
                                    feature
                                );

                            }

                        );

                    }

                }

            );

        }

    )

    .catch(

        e => {

            console.log(
                "국립공원 로딩 오류",
                e
            );

        }

    );

}


// =========================================================
// DRAW PARK
// =========================================================

function drawPark(
    coords,
    feature
){

    const path =

        coords.map(

            c =>

                new kakao.maps.LatLng(
                    c[1],
                    c[0]
                )

        );


    const polygon =

        new kakao.maps.Polygon({

            map:
                map,

            path:
                path,

            strokeWeight:
                2,

            strokeColor:
                "#00ffff",

            strokeOpacity:
                .8,

            fillColor:
                "#00ffff",

            fillOpacity:
                .08

        });


    kakao.maps.event.addListener(

        polygon,

        "click",

        function(e){

            const name =

                feature.properties.name ||

                "국립공원";


            const info =

                `<div style="
                    background:#07101f;
                    color:#00ff9d;
                    padding:10px;
                    border:1px solid #00ff9d;
                    border-radius:8px;
                    font-family:monospace">

                    🏔 ${name}

                    <br><br>

                    📍 LAT :
                    ${e.latLng
                        .getLat()
                        .toFixed(6)}

                    <br>

                    📍 LNG :
                    ${e.latLng
                        .getLng()
                        .toFixed(6)}

                </div>`;


            const iw =

                new kakao.maps.InfoWindow({

                    content:
                        info

                });


            iw.setPosition(
                e.latLng
            );


            iw.open(
                map
            );

        }

    );

}


// =========================================================
// HISTORY LOAD
// =========================================================

function loadAllHistory(){

    clearHistory();


    if(!navigator.onLine){

        alert(
            "📴 현재 오프라인입니다.\n전체 기록은 Google Sheet에서 조회합니다."
        );

        return;

    }


    fetch(

        API_URL +
        "?history=all&t=" +
        Date.now(),

        {
            cache:
                "no-store"
        }

    )

    .then(

        r => {

            if(!r.ok){

                throw new Error(
                    "HTTP " +
                    r.status
                );

            }

            return r.json();

        }

    )

    .then(

        data => {

            showHistory(
                data
            );

        }

    )

    .catch(

        err => {

            console.log(
                "HISTORY ERROR",
                err
            );


            alert(
                "전체 기록을 불러오지 못했습니다."
            );

        }

    );

}


// =========================================================
// HISTORY CLEAR
// =========================================================

function clearHistory(){

    historyMarkers
    .forEach(

        m => {

            m.setMap(
                null
            );

        }

    );


    historyMarkers.length =
        0;


    historyLines
    .forEach(

        line => {

            line.setMap(
                null
            );

        }

    );


    historyLines.length =
        0;


    historyLabels
    .forEach(

        label => {

            label.setMap(
                null
            );

        }

    );


    historyLabels.length =
        0;

}


// =========================================================
// HISTORY VIEW
// =========================================================

function showHistory(data){

    if(
        !Array.isArray(data)
    ){

        alert(
            "기록 데이터 형식이 올바르지 않습니다."
        );

        return;

    }


    const grouped = {};


    data.sort(

        (a,b) => {

            return new Date(a.time)
                -
                new Date(b.time);

        }

    );


    data.forEach(

        d => {

            const lat =
                Number(d.lat);

            const lng =
                Number(d.lng);


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            )
                return;


            const name =
                d.name ||
                "UNKNOWN";


            if(
                !grouped[name]
            ){

                grouped[name] =
                    [];

            }


            grouped[name].push(

                new kakao.maps.LatLng(

                    lat,
                    lng

                )

            );

        }

    );


    let bounds =
        new kakao.maps.LatLngBounds();


    for(
        const name in grouped
    ){

        const path =
            grouped[name];


        if(
            path.length === 0
        )
            continue;


        path.forEach(

            p => {

                bounds.extend(
                    p
                );

            }

        );


        const line =

            new kakao.maps.Polyline({

                map:
                    map,

                path:
                    path,

                strokeWeight:
                    4,

                strokeColor:
                    "#ffcc00",

                strokeOpacity:
                    .8

            });


        historyLines.push(
            line
        );


        const startMarker =

            new kakao.maps.Marker({

                map:
                    map,

                position:
                    path[0]

            });


        historyMarkers.push(
            startMarker
        );


        const endMarker =

            new kakao.maps.Marker({

                map:
                    map,

                position:
                    path[path.length - 1]

            });


        historyMarkers.push(
            endMarker
        );


        const startLabel =

            new kakao.maps.CustomOverlay({

                map:
                    map,

                position:
                    path[0],

                content:

                    `<div class="name-label">

                        🟢 START ${name}

                    </div>`,

                yAnchor:
                    1.5

            });


        historyLabels.push(
            startLabel
        );


        const endLabel =

            new kakao.maps.CustomOverlay({

                map:
                    map,

                position:
                    path[path.length - 1],

                content:

                    `<div class="name-label">

                        🔴 END ${name}

                    </div>`,

                yAnchor:
                    1.5

            });


        historyLabels.push(
            endLabel
        );

    }


    if(
        data.length > 0 &&
        grouped
    ){

        map.setBounds(
            bounds
        );

    }

}

// INITIALIZE
// =========================================================

(async function init(){

    try{

        await openDatabase();

        await updatePendingCount();

    }

    catch(error){

        console.log(
            "DB INIT ERROR",
            error
        );

        setStatus(
            saveStatus,
            "💾 저장 오류",
            "off"
        );

    }


    loadNationalParks();

    loadLive();


    /*
       앱 시작 시 IndexedDB에 남아 있는
       미전송 GPS 기록 자동 전송
    */

    if(navigator.onLine){

        await sendPendingQueue();

    }

})();

// =========================================================
// KEYBOARD PROTECTION
// =========================================================

document.addEventListener(

    "keydown",

    function(e){

        if(e.key === "F12"){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "u"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "i"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "j"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "c"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "s"
        ){

            e.preventDefault();

            return false;

        }

    }

);

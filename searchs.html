<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛰 MUDEUNGSAN RESCUE AI MAP v8+</title>

<style>
body {
    margin:0;
    background:#050b18;
    color:#00ff9d;
    font-family:monospace;
    overflow:hidden;
}

header {
    background:#071a2f;
    padding:10px;
    text-align:center;
    font-weight:bold;
    font-size:14px;
}

#container {
    display:flex;
    height:calc(100vh - 50px);
}

#panel {
    width:300px;
    background:#07101f;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow-y:auto;
}

#map { flex:1; }

input, button, select {
    padding:10px;
    border:1px solid #00ff9d;
    background:#001a14;
    color:#00ff9d;
    font-size:13px;
}

button { cursor:pointer; }

button:disabled {
    opacity:0.4;
    cursor:not-allowed;
}

@media (max-width:768px){
    #container { flex-direction:column; }
    #panel { width:100%; flex-direction:row; flex-wrap:wrap; max-height:35vh; }
    #map { height:65vh; }
}
</style>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>
</head>

<body>

<header>🛰 MUDEUNGSAN RESCUE AI MAP v8+</header>

<div id="container">

<div id="panel">
    <input id="name" placeholder="UNIT ID">

    <button id="startBtn" onclick="start()" disabled>START</button>
    <button onclick="goMyLocation()">📍 MY LOCATION</button>
    <button onclick="stopTracking()">⛔ STOP</button>
    <button onclick="sendSOS()">🚨 SOS</button>
    <button onclick="loadAllRecords()">📦 전체 기록</button>

    <select id="nameFilter" onchange="filterByName()">
        <option value="ALL">👥 전체 보기</option>
    </select>
</div>

<div id="map"></div>

</div>

<script>

// ================= API =================
const API_URL = "https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";

// ================= MAP =================
const BASE = new kakao.maps.LatLng(35.1239, 126.9883);

const map = new kakao.maps.Map(document.getElementById('map'), {
    center: BASE,
    level: 4
});

// ================= STATE =================
let myName = "";
let lastPos = null;

let watchId = null;
let intervalSend = null;
let intervalLoad = null;

let allData = [];

let markers = {};
let historyMarkers = {};
let polyline = {};
let paths = {};

// ================= INPUT CONTROL =================
const nameInput = document.getElementById("name");
const startBtn = document.getElementById("startBtn");

nameInput.addEventListener("input", function () {
    startBtn.disabled = this.value.trim() === "";
});

// ================= START =================
function start(){

    myName = nameInput.value.trim();

    if(!myName){
        alert("UNIT ID required");
        return;
    }

    startBtn.disabled = true;
    nameInput.disabled = true;

    watchId = navigator.geolocation.watchPosition(pos=>{

        lastPos = {
            name: myName,
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            behavior: detectBehavior(pos),
            status: "normal"
        };

    }, err=>alert("GPS ERROR"), {
        enableHighAccuracy:true
    });

    intervalSend = setInterval(sendData, 5000);
    intervalLoad = setInterval(loadData, 5000);
}

// ================= STOP (FULL RESET) =================
function stopTracking(){

    if(watchId) navigator.geolocation.clearWatch(watchId);
    watchId = null;

    clearInterval(intervalSend);
    clearInterval(intervalLoad);

    intervalSend = null;
    intervalLoad = null;

    lastPos = null;
    myName = "";

    nameInput.value = "";
    nameInput.disabled = false;

    startBtn.disabled = true;

    // 지도 초기화
    Object.values(markers).forEach(m=>m.setMap(null));
    Object.values(historyMarkers).forEach(m=>m.setMap(null));
    Object.values(polyline).forEach(p=>p.setMap(null));

    markers = {};
    historyMarkers = {};
    polyline = {};
    paths = {};

    alert("TRACKING STOPPED & RESET COMPLETE");
}

// ================= CENTER =================
function goMyLocation(){
    if(!lastPos) return alert("No GPS data");
    map.setCenter(new kakao.maps.LatLng(lastPos.lat, lastPos.lng));
}

// ================= SEND =================
function sendData(){
    if(!lastPos) return;
    fetch(API_URL,{
        method:"POST",
        body: JSON.stringify(lastPos)
    });
}

// ================= LOAD =================
function loadData(){
    fetch(API_URL)
    .then(res=>res.json())
    .then(data=>{
        allData = data;
        updateNameFilter(data);
        renderMap(data);
    });
}

// ================= FILTER =================
function updateNameFilter(data){

    const select = document.getElementById("nameFilter");
    const names = [...new Set(data.map(p=>p.name))];

    select.innerHTML = `<option value="ALL">👥 전체 보기</option>`;

    names.forEach(n=>{
        const opt = document.createElement("option");
        opt.value = n;
        opt.textContent = "📍 " + n;
        select.appendChild(opt);
    });
}

function filterByName(){
    const value = document.getElementById("nameFilter").value;
    if(value === "ALL") renderMap(allData);
    else renderMap(allData.filter(p=>p.name === value));
}

// ================= MAP =================
function renderMap(data){

    Object.values(markers).forEach(m=>m.setMap(null));
    Object.values(historyMarkers).forEach(m=>m.setMap(null));
    Object.values(polyline).forEach(p=>p.setMap(null));

    markers = {};
    historyMarkers = {};
    polyline = {};
    paths = {};

    data.forEach(p=>{

        const key = p.name;
        const pos = new kakao.maps.LatLng(p.lat, p.lng);

        if(!paths[key]) paths[key] = [];
        paths[key].push(pos);

        if(!markers[key]){
            markers[key] = new kakao.maps.Marker({
                position: pos,
                map: map
            });
        } else {
            markers[key].setPosition(pos);
        }

        const histKey = key + "_" + paths[key].length;

        historyMarkers[histKey] = new kakao.maps.Marker({
            position: pos,
            map: map
        });

        drawPath(key);
    });
}

// ================= PATH =================
function drawPath(key){

    if(paths[key].length < 2) return;

    if(polyline[key]) polyline[key].setMap(null);

    polyline[key] = new kakao.maps.Polyline({
        path: paths[key],
        strokeWeight: 3,
        strokeColor: "#00ff9d",
        strokeOpacity: 0.8
    });

    polyline[key].setMap(map);
}

// ================= SOS =================
function sendSOS(){

    if(!lastPos) return;

    lastPos.status = "SOS";

    fetch(API_URL,{
        method:"POST",
        body: JSON.stringify(lastPos)
    });

    alert("🚨 SOS SENT");
}

// ================= BEHAVIOR =================
function detectBehavior(pos){

    const speed = pos.coords.speed || 0;

    if(speed < 0.2) return "immobile";
    if(speed < 1) return "injured";
    if(speed < 3) return "confused";
    return "normal";
}

</script>

</body>
</html>

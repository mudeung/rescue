<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
🛰 SEARCH AND RESCUE AI MAP
</title>


<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>


<style>

body{

margin:0;

background:#050b18;

color:#00ff9d;

font-family:monospace;

overflow:hidden;

}



header{

background:#071a2f;

padding:10px;

text-align:center;

font-weight:bold;

}



#container{

display:flex;

height:calc(100vh - 50px);

}



#panel{

width:300px;

background:#07101f;

padding:10px;

display:flex;

flex-direction:column;

gap:6px;

overflow-y:auto;

}



#map{

flex:1;

}



input,button{

padding:10px;

border:

1px solid #00ff9d;

background:#001a14;

color:#00ff9d;

}



button:disabled{

opacity:.5;

}



@media(max-width:768px){

#container{

flex-direction:column;

}


#panel{

width:100%;

max-height:35vh;

}


#map{

height:65vh;

}

}



.name-label{

background:#001a14;

color:#00ff9d;

border:

1px solid #00ff9d;

padding:4px 8px;

border-radius:6px;

font-size:12px;

font-weight:bold;

}



</style>

</head>


<body>


<header>
🛰 SEARCH AND RESCUE AI MAP
</header>



<div id="container">


<div id="panel">


<input id="name"
placeholder="RESCUE ID">


<button id="startBtn"
onclick="start()"
disabled>

START

</button>



<button onclick="goMyLocation()">

📍 MY LOCATION

</button>



<button onclick="shareLocation()">

📡 위치 공유

</button>



<button onclick="sendSOS()">

🚨 SOS

</button>



<button onclick="stopTracking()">

⛔ STOP

</button>



<button onclick="loadAllHistory()">

📦 전체 기록

</button>


</div>



<div id="map"></div>


</div>



<script>


// ================= API =================


const API_URL =

"https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";




// ================= DEVICE =================


let DEVICE_ID =

localStorage.getItem(
"DEVICE_ID"
);



if(!DEVICE_ID){


DEVICE_ID =
crypto.randomUUID();


localStorage.setItem(
"DEVICE_ID",
DEVICE_ID
);


}




// ================= MAP =================


const map =

new kakao.maps.Map(

document.getElementById("map"),

{

center:

new kakao.maps.LatLng(

35.1239,

126.9883

),

level:5


}

);






// ================= NATIONAL PARK =================


function loadNationalParks(){


fetch(
"national_parks.geojson"
)

.then(r=>r.json())

.then(data=>{


data.features.forEach(feature=>{


const geometry =
feature.geometry;



if(
geometry.type==="Polygon"
){


drawPark(
geometry.coordinates[0],
feature
);


}



if(
geometry.type==="MultiPolygon"
){


geometry.coordinates.forEach(poly=>{


drawPark(
poly[0],
feature
);


});


}



});


})

.catch(e=>{

console.log(
"국립공원 로딩 오류",
e
);

});


}




function drawPark(coords,feature){



const path =

coords.map(c=>

new kakao.maps.LatLng(
c[1],
c[0]
)

);



const polygon =

new kakao.maps.Polygon({

map:map,

path:path,


strokeWeight:2,

strokeColor:"#00ffff",

strokeOpacity:.8,


fillColor:"#00ffff",

fillOpacity:.08


});




kakao.maps.event.addListener(

polygon,

"click",

function(e){


const name =

feature.properties.name ||

"국립공원";



const info =

`

<div style="

background:#07101f;

color:#00ff9d;

padding:10px;

border:1px solid #00ff9d;

font-family:monospace">

🏔 ${name}<br><br>

📍 ${e.latLng.getLat().toFixed(6)}

,

${e.latLng.getLng().toFixed(6)}

</div>

`;



const iw =

new kakao.maps.InfoWindow({

content:info

});


iw.setPosition(
e.latLng
);


iw.open(
map
);



}

);



}



loadNationalParks();





// ================= STATE =================



let myName="";

let lastPos=null;

let watchId=null;


let intervalSend=null;

let intervalLoad=null;


let startTime="";

let endTime="";



let previousPos=null;



let directionMarker=null;




const markers={};


const labels={};



const historyMarkers=[];

const historyLines=[];



const nameInput =

document.getElementById(
"name"
);



const startBtn =

document.getElementById(
"startBtn"
);




nameInput.addEventListener(

"input",

()=>{


startBtn.disabled =

nameInput.value.trim()==="";


}

);





// ================= TIME =================


function getNowTime(){


const d=new Date();


return (

d.getFullYear()+"-"

+

String(
d.getMonth()+1
)
.padStart(2,"0")

+

"-"

+

String(
d.getDate()
)
.padStart(2,"0")

+

" "

+

String(
d.getHours()
)
.padStart(2,"0")

+

":"

+

String(
d.getMinutes()
)
.padStart(2,"0")

+

":"

+

String(
d.getSeconds()
)
.padStart(2,"0")

);


}





// ================= START =================


function start(){


myName =

nameInput.value.trim();



if(!myName){

alert(
"RESCUE ID 입력"
);

return;

}



startTime =
getNowTime();



nameInput.disabled=true;

startBtn.disabled=true;



watchId =

navigator.geolocation.watchPosition(


pos=>{


lastPos={


name:myName,


device:DEVICE_ID,


lat:pos.coords.latitude,


lng:pos.coords.longitude,


accuracy:pos.coords.accuracy,


speed:pos.coords.speed,


status:"normal"


};



},


err=>{


console.log(err);


alert(
"GPS 오류"
);


},


{


enableHighAccuracy:true,


maximumAge:1000,


timeout:10000


}


);



intervalSend =

setInterval(

sendData,

5000

);



intervalLoad =

setInterval(

loadLive,

3000

);



}


// ================= SEND LIVE DATA =================

function sendData(){

    if(!lastPos) return;


    fetch(API_URL,{
        method:"POST",

        headers:{
            "Content-Type":"text/plain"
        },

        body:JSON.stringify({

            ...lastPos,

            startTime:startTime,

            endTime:endTime

        })

    })

    .catch(err=>{

        console.log(
            "SEND ERROR",
            err
        );

    });

}



// ================= LOAD LIVE =================


function loadLive(){


    fetch(

        API_URL +

        "?live=1&t="

        +

        Date.now()

    )


    .then(r=>r.json())


    .then(data=>{


        renderLive(data);


    })


    .catch(err=>{


        console.log(
            "LIVE ERROR",
            err
        );


    });


}




// ================= LIVE RENDER =================


function renderLive(data){


    const latest={};



    // 같은 구조대는 마지막 데이터만 사용

    data.forEach(p=>{


        latest[p.name]=p;


    });




    Object.values(latest)

    .forEach(p=>{



        const lat =
        Number(p.lat);



        const lng =
        Number(p.lng);



        if(

            !Number.isFinite(lat)

            ||

            !Number.isFinite(lng)

        )

        return;



        const key =
        p.name;



        const position =

        new kakao.maps.LatLng(

            lat,

            lng

        );




        // ================= NEW MARKER =================


        if(!markers[key]){



            markers[key] =

            new kakao.maps.Marker({


                map:map,


                position:position


            });



            labels[key] =

            new kakao.maps.CustomOverlay({


                map:map,


                position:position,


                content:


                `

                <div class="name-label">

                🛰 ${p.name}

                </div>


                `,


                yAnchor:1.5


            });



        }



        else{


            markers[key]

            .setPosition(position);



            labels[key]

            .setPosition(position);



        }





        // ================= STATUS =================



        if(p.status==="SOS"){



            markers[key]

            .setImage(


                new kakao.maps.MarkerImage(


                "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png",


                new kakao.maps.Size(
                    32,
                    45
                )


                )


            );




        }



        else if(p.status==="SHARE"){



            markers[key]

            .setImage(


                new kakao.maps.MarkerImage(


                "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png",


                new kakao.maps.Size(
                    32,
                    45
                )


                )


            );



        }



    });



}








// ================= MY LOCATION =================



function goMyLocation(){


    if(!lastPos)

    return;



    map.setCenter(


        new kakao.maps.LatLng(


            lastPos.lat,


            lastPos.lng


        )


    );


}






// ================= SOS =================


function sendSOS(){


    if(!lastPos){


        alert(
            "현재 위치 없음"
        );


        return;

    }





    const data={


        ...lastPos,


        status:"SOS",


        startTime:startTime,


        endTime:endTime


    };




    fetch(API_URL,{

        method:"POST",


        headers:{


            "Content-Type":

            "text/plain"


        },


        body:

        JSON.stringify(data)


    });



    alert(
        "🚨 SOS 전송 완료"
    );


}







// ================= SHARE =================


function shareLocation(){



    if(!lastPos){


        alert(
            "현재 위치 없음"
        );


        return;

    }




    const mapURL =


    `https://map.kakao.com/link/map/${lastPos.lat},${lastPos.lng}`;





    const message =


`📡 구조대 위치 공유


UNIT :

${lastPos.name}


LAT :

${lastPos.lat}


LNG :

${lastPos.lng}


지도 :

${mapURL}`;




    fetch(API_URL,{

        method:"POST",


        headers:{


            "Content-Type":

            "text/plain"


        },


        body:

        JSON.stringify({


            ...lastPos,


            status:"SHARE"


        })


    });







    if(
        navigator.share
    ){



        navigator.share({


            title:
            "구조대 위치",


            text:
            message



        })

        .catch(
            console.log
        );



    }


    else{


        prompt(

            "복사하세요",

            message

        );


    }


}






// ================= AUTO CENTER MOBILE =================



let centerInterval=null;



function startMobileCenter(){


    if(centerInterval)

    return;



    centerInterval =

    setInterval(()=>{


        if(lastPos){


            map.setCenter(

                new kakao.maps.LatLng(

                    lastPos.lat,

                    lastPos.lng

                )

            );


        }


    },5000);


}

// ================= STOP =================


function stopTracking(){


    endTime =
    getNowTime();



    // 종료 기록 저장

    if(lastPos){


        fetch(API_URL,{

            method:"POST",

            headers:{

                "Content-Type":
                "text/plain"

            },


            body:JSON.stringify({


                ...lastPos,


                status:"STOP",


                startTime:startTime,


                endTime:endTime


            })


        });


    }





    // GPS 종료


    if(watchId){


        navigator.geolocation
        .clearWatch(watchId);


        watchId=null;


    }




    clearInterval(intervalSend);

    clearInterval(intervalLoad);

    clearInterval(centerInterval);



    intervalSend=null;

    intervalLoad=null;

    centerInterval=null;




    lastPos=null;

    previousPos=null;


    myName="";


    startTime="";

    endTime="";





    // 실시간 마커 제거


    Object.values(markers)

    .forEach(marker=>{


        marker.setMap(null);


    });



    Object.keys(markers)

    .forEach(k=>{


        delete markers[k];


    });





    Object.values(labels)

    .forEach(label=>{


        label.setMap(null);


    });



    Object.keys(labels)

    .forEach(k=>{


        delete labels[k];


    });






    nameInput.disabled=false;

    nameInput.value="";


    startBtn.disabled=true;



    alert(

        "⛔ STOP 완료"

    );



}







// ================= HISTORY LOAD =================



function loadAllHistory(){



    clearHistory();



    fetch(

        API_URL

        +

        "?history=all&t="

        +

        Date.now()

    )


    .then(r=>r.json())


    .then(data=>{


        showHistory(data);


    })


    .catch(err=>{


        console.log(

            "HISTORY ERROR",

            err

        );


    });



}








// ================= HISTORY CLEAR =================



function clearHistory(){



    historyMarkers

    .forEach(m=>{


        m.setMap(null);


    });



    historyMarkers.length=0;





    historyLines

    .forEach(line=>{


        line.setMap(null);


    });



    historyLines.length=0;



}








// ================= HISTORY VIEW =================



function showHistory(data){



    const grouped={};




    // 시간순 정렬


    data.sort((a,b)=>{


        return new Date(a.time)

        -

        new Date(b.time);


    });





    data.forEach(d=>{



        if(!grouped[d.name]){


            grouped[d.name]=[];


        }




        grouped[d.name].push(


            new kakao.maps.LatLng(

                Number(d.lat),

                Number(d.lng)

            )


        );



    });







    let bounds =

    new kakao.maps.LatLngBounds();






    for(const name in grouped){



        const path =

        grouped[name];





        path.forEach(p=>{


            bounds.extend(p);


        });







        // 이동 경로


        const line =

        new kakao.maps.Polyline({


            map:map,


            path:path,


            strokeWeight:4,


            strokeColor:"#ffcc00",


            strokeOpacity:0.8


        });



        historyLines.push(line);






        // 시작 위치


        const startMarker =

        new kakao.maps.Marker({


            map:map,


            position:path[0]


        });



        historyMarkers.push(

            startMarker

        );






        // 종료 위치


        const endMarker =

        new kakao.maps.Marker({


            map:map,


            position:

            path[path.length-1]


        });



        historyMarkers.push(

            endMarker

        );








        // 시작 라벨


        const startLabel =

        new kakao.maps.CustomOverlay({



            map:map,


            position:path[0],


            content:


            `

            <div class="name-label">

            🟢 START ${name}

            </div>

            `,


            yAnchor:1.5


        });








        // 종료 라벨


        const endLabel =

        new kakao.maps.CustomOverlay({



            map:map,


            position:

            path[path.length-1],


            content:


            `

            <div class="name-label">

            🔴 END ${name}

            </div>

            `,


            yAnchor:1.5


        });





    }






    if(

        data.length>0

    ){


        map.setBounds(

            bounds

        );


    }



}








// ================= INIT =================


// 최초 LIVE 확인


loadLive();


// 모바일 자동 추적 준비

startMobileCenter();


</script>


</body>

</html>

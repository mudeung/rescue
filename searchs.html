<body>


<header>
🛰 SEARCH AND RESCUE AI MAP

<!-- =======================================================
     STATUS
     ======================================================= -->

<div id="statusBar">

    <div
        id="gpsStatus"
        class="status-item off"
    >
        📍 GPS OFF
    </div>

    <div
        id="wakeStatus"

    >

    </div>

    <div
        id="saveStatus"
        class="status-item on"
    >
        💾 저장 0
    </div>

    id="name"
    placeholder="RESCUE ID"
>

    id="startBtn"

>
START
</button>

    onclick="goMyLocation()"
>
📍 MY LOCATION
</button>

    onclick="shareLocation()"
>
📡 위치 공유
</button>

    onclick="sendSOS()"
>
🚨 SOS
</button>

    onclick="stopTracking()"
>
⛔ STOP
</button>

    onclick="loadAllHistory()"
>
📦 전체 기록
</button>


</div>


<div id="map"></div>


</div>


<script>


// =========================================================
// API
// =========================================================

const API_URL =

"https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";


// =========================================================
// DEVICE ID
// =========================================================

let DEVICE_ID =

localStorage.getItem(
    "DEVICE_ID"
);


if(!DEVICE_ID){

    DEVICE_ID =
        crypto.randomUUID();

    localStorage.setItem(
        "DEVICE_ID",
        DEVICE_ID
    );

}


// =========================================================
// STATE
// =========================================================

let myName = "";

let lastPos = null;

let watchId = null;

let intervalSend = null;

let intervalLoad = null;

let startTime = "";

let endTime = "";

let previousPos = null;

let centerInterval = null;

let wakeLock = null;

let wakeLockRetryTimer = null;

let isTracking = false;

let gpsLastUpdate = 0;

let isSendingQueue = false;


// =========================================================
// MAP OBJECTS
// =========================================================

const markers = {};

const labels = {};

const historyMarkers = [];

const historyLines = [];

const historyLabels = [];


// =========================================================
// CLICK OBJECTS
// =========================================================

let clickMarker = null;

let clickOverlay = null;


// =========================================================
// DOM
// =========================================================

const nameInput =

    document.getElementById(
        "name"
    );


const startBtn =

    document.getElementById(
        "startBtn"
    );


const gpsStatus =

    document.getElementById(
        "gpsStatus"
    );


const wakeStatus =

    document.getElementById(
        "wakeStatus"
    );


const saveStatus =

    document.getElementById(
        "saveStatus"
    );


// =========================================================
// NAME INPUT
// =========================================================

nameInput.addEventListener(

    "input",

    () => {

        startBtn.disabled =
            nameInput.value.trim() === "";

    }

);


// =========================================================
// TIME
// =========================================================

function getNowTime(){

    const d =
        new Date();

    return (

        d.getFullYear()

        + "-"

        +

        String(
            d.getMonth() + 1
        ).padStart(2,"0")

        + "-"

        +

        String(
            d.getDate()
        ).padStart(2,"0")

        + " "

        +

        String(
            d.getHours()
        ).padStart(2,"0")

        + ":"

        +

        String(
            d.getMinutes()
        ).padStart(2,"0")

        + ":"

        +

        String(
            d.getSeconds()
        ).padStart(2,"0")

    );

}


// =========================================================
// STATUS
// =========================================================

function setStatus(
    element,
    text,
    mode
){

    element.textContent =
        text;

    element.classList.remove(
        "on",
        "off",
        "warn"
    );

    element.classList.add(
        mode
    );

}


// =========================================================
// INDEXED DB
// =========================================================

const DB_NAME =
    "SEARCH_RESCUE_GPS_DB";

const DB_VERSION =
    1;

const STORE_NAME =
    "gps_records";

let db = null;


// =========================================================
// OPEN DB
// =========================================================

function openDatabase(){

    return new Promise(
        (resolve,reject) => {

            if(db){

                resolve(db);

                return;

            }


            if(!window.indexedDB){

                reject(
                    new Error(
                        "IndexedDB not supported"
                    )
                );

                return;

            }


            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );


            request.onupgradeneeded =
                function(event){

                    const database =
                        event.target.result;


                    if(
                        !database.objectStoreNames
                        .contains(STORE_NAME)
                    ){

                        const store =
                            database.createObjectStore(
                                STORE_NAME,
                                {
                                    keyPath:
                                        "id",
                                    autoIncrement:
                                        true
                                }
                            );


                        store.createIndex(
                            "sent",
                            "sent",
                            {
                                unique:
                                    false
                            }
                        );

                    }

                };


            request.onsuccess =
                function(event){

                    db =
                        event.target.result;

                    resolve(db);

                };


            request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

        }
    );

}


// =========================================================
// SAVE GPS LOCALLY
// =========================================================

async function saveGPSLocal(data){

    try{

        const database =
            await openDatabase();


        return new Promise(
            (resolve,reject) => {

                const tx =
                    database.transaction(
                        STORE_NAME,
                        "readwrite"
                    );


                const store =
                    tx.objectStore(
                        STORE_NAME
                    );


                store.add({

                    ...data,

                    savedAt:
                        Date.now(),

                    sent:
                        false

                });


                tx.oncomplete =
                    function(){

                        updatePendingCount();

                        resolve();

                    };


                tx.onerror =
                    function(){

                        reject(
                            tx.error
                        );

                    };

            }
        );

    }

    catch(error){

        console.log(
            "LOCAL SAVE ERROR",
            error
        );

    }

}


// =========================================================
// GET PENDING
// =========================================================

async function getPendingRecords(){

    try{

        const database =
            await openDatabase();


        return new Promise(
            (resolve,reject) => {

                const tx =
                    database.transaction(
                        STORE_NAME,
                        "readonly"
                    );


                const store =
                    tx.objectStore(
                        STORE_NAME
                    );


                const request =
                    store.getAll();


                request.onsuccess =
                    function(){

                        const result =
                            request.result
                            .filter(
                                x =>
                                    x.sent === false
                            );

                        resolve(result);

                    };


                request.onerror =
                    function(){

                        reject(
                            request.error
                        );

                    };

            }
        );

    }

    catch(error){

        console.log(
            "GET PENDING ERROR",
            error
        );

        return [];

    }

}


// =========================================================
// MARK SENT
// =========================================================

async function markRecordSent(id){

    try{

        const database =
            await openDatabase();


        return new Promise(
            (resolve,reject) => {

                const tx =
                    database.transaction(
                        STORE_NAME,
                        "readwrite"
                    );


                const store =
                    tx.objectStore(
                        STORE_NAME
                    );


                const request =
                    store.get(id);


                request.onsuccess =
                    function(){

                        const record =
                            request.result;


                        if(record){

                            record.sent =
                                true;


                            record.sentAt =
                                Date.now();


                            store.put(
                                record
                            );

                        }

                    };


                tx.oncomplete =
                    function(){

                        resolve();

                    };


                tx.onerror =
                    function(){

                        reject(
                            tx.error
                        );

                    };

            }
        );

    }

    catch(error){

        console.log(
            "MARK SENT ERROR",
            error
        );

    }

}


// =========================================================
// PENDING COUNT
// =========================================================

async function getPendingCount(){

    const records =
        await getPendingRecords();

    return records.length;

}


// =========================================================
// UPDATE SAVE STATUS
// =========================================================

async function updatePendingCount(){

    const count =
        await getPendingCount();


    if(count === 0){

        setStatus(
            saveStatus,
            "💾 저장 0",
            "on"
        );

    }

    else{

        setStatus(
            saveStatus,
            "💾 저장대기 " + count,
            "warn"
        );

    }

}


// =========================================================
// SEND ONE RECORD
// =========================================================

async function sendRecord(record){

    const payload = {

        name:
            record.name,

        device:
            record.device,

        lat:
            record.lat,

        lng:
            record.lng,

        accuracy:
            record.accuracy,

        speed:
            record.speed,

        status:
            record.status,

        startTime:
            record.startTime || "",

        endTime:
            record.endTime || "",

        recordedAt:
            record.recordedAt || "",

        localSavedAt:
            record.savedAt || ""

    };


    const response =
        await fetch(

            API_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain"

                },

                body:
                    JSON.stringify(
                        payload
                    )

            }

        );


    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }

}


// =========================================================
// SEND PENDING QUEUE
// =========================================================

async function sendPendingQueue(){

    if(isSendingQueue)
        return;


    if(!navigator.onLine)
        return;


    isSendingQueue =
        true;


    try{

        const records =
            await getPendingRecords();


        if(
            records.length === 0
        ){

            await updatePendingCount();

            return;

        }


        for(
            const record of records
        ){

            try{

                await sendRecord(
                    record
                );


                await markRecordSent(
                    record.id
                );

            }

            catch(error){

                console.log(
                    "QUEUE SEND ERROR",
                    error
                );

                break;

            }

        }

    }

    finally{

        isSendingQueue =
            false;

        await updatePendingCount();

    }

}


// =========================================================
// SAVE + SEND
// =========================================================

async function saveAndSend(data){

    // 항상 휴대폰 IndexedDB에 먼저 저장

    await saveGPSLocal(
        data
    );


    // 인터넷이 없으면 여기서 종료

    if(!navigator.onLine){

        return;

    }


    // 저장된 큐를 전송

    await sendPendingQueue();

}

// =========================================================
// WAKE LOCK
// =========================================================

async function requestWakeLock(){

    if(!isTracking)
        return;


    try{

        if(
            !("wakeLock" in navigator)
        ){

            setStatus(
                wakeStatus,
                "🔒 미지원",
                "warn"
            );

            return;

        }


        if(
            document.visibilityState !==
            "visible"
        ){

            return;

        }


        if(wakeLock){

            setStatus(
                wakeStatus,
                "🔒 화면방지 ON",
                "on"
            );

            return;

        }


        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );


        setStatus(
            wakeStatus,
            "🔒 화면방지 ON",
            "on"
        );


        console.log(
            "🔒 Wake Lock ON"
        );


        wakeLock.addEventListener(

            "release",

            () => {

                console.log(
                    "Wake Lock released"
                );


                wakeLock =
                    null;


                if(isTracking){

                    setStatus(
                        wakeStatus,
                        "🔒 재연결 중",
                        "warn"
                    );


                    scheduleWakeLockRetry();

                }

            }

        );

    }

    catch(error){

        console.log(
            "Wake Lock ERROR",
            error
        );


        setStatus(
            wakeStatus,
            "🔒 OFF",
            "warn"
        );


        scheduleWakeLockRetry();

    }

}


// =========================================================
// WAKE LOCK RETRY
// =========================================================

function scheduleWakeLockRetry(){

    if(wakeLockRetryTimer)
        return;


    wakeLockRetryTimer =

        setTimeout(

            async () => {

                wakeLockRetryTimer =
                    null;


                if(isTracking){

                    await requestWakeLock();

                }

            },

            3000

        );

}


// =========================================================
// RELEASE WAKE LOCK
// =========================================================

async function releaseWakeLock(){

    try{

        if(wakeLock){

            await wakeLock.release();

            wakeLock =
                null;

        }

    }

    catch(error){

        console.log(
            "WAKE RELEASE ERROR",
            error
        );

    }


    if(wakeLockRetryTimer){

        clearTimeout(
            wakeLockRetryTimer
        );

        wakeLockRetryTimer =
            null;

    }


    setStatus(
        wakeStatus,
        "🔒 화면방지 OFF",
        "off"
    );

}

async function handleGPSPosition(pos){

    gpsLastUpdate =
        Date.now();


    setStatus(
        gpsStatus,
        "📍 GPS ON",
        "on"
    );


    const newPosition = {

        name:
            myName,

        device:
            DEVICE_ID,

        lat:
            pos.coords.latitude,

        lng:
            pos.coords.longitude,

        accuracy:
            pos.coords.accuracy,

        speed:
            pos.coords.speed,

        heading:
            pos.coords.heading,

        status:
            "normal",

        startTime:
            startTime,

        endTime:
            endTime,

        recordedAt:
            getNowTime()

    };


    lastPos =
        newPosition;


    map.setCenter(

        new kakao.maps.LatLng(

            lastPos.lat,

            lastPos.lng

        )

    );


    // GPS 데이터를 휴대폰에 먼저 저장

    await saveAndSend(
        newPosition
    );

}

// =========================================================
// START GPS WATCH
// =========================================================

function startGPSWatch(){

    if(
        !navigator.geolocation
    ){

        alert(
            "이 기기는 GPS 위치 기능을 지원하지 않습니다."
        );

        return false;

    }


    if(
        watchId !== null
    ){

        navigator.geolocation
        .clearWatch(
            watchId
        );

        watchId =
            null;

    }


    watchId =

        navigator.geolocation.watchPosition(

            handleGPSPosition,

            handleGPSError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    1000,

                timeout:
                    15000

            }

        );


    return true;

}


// =========================================================
// START
// =========================================================

async function start(){

    myName =
        nameInput.value.trim();


    if(!myName){

        alert(
            "RESCUE ID 입력"
        );

        return;

    }


    if(
        !navigator.geolocation
    ){

        alert(
            "이 기기는 GPS 위치 기능을 지원하지 않습니다."
        );

        return;

    }


    isTracking =
        true;


    startTime =
        getNowTime();


    nameInput.disabled =
        true;


    startBtn.disabled =
        true;


    setStatus(
        gpsStatus,
        "📍 GPS 시작",
        "warn"
    );


    await requestWakeLock();


    const gpsStarted =
        startGPSWatch();


    if(!gpsStarted){

        isTracking =
            false;

        nameInput.disabled =
            false;

        return;

    }


    // 5초마다 현재 위치 전송

    intervalSend =

        setInterval(

            async () => {

                if(lastPos){

                    const record = {

                        ...lastPos,

                        status:
                            "normal",

                        recordedAt:
                            getNowTime()

                    };


                    await saveAndSend(
                        record
                    );

                }

            },

            5000

        );


    // 실시간 다른 구조대 위치

    intervalLoad =

        setInterval(

            loadLive,

            3000

        );


    startMobileCenter();


    // 기존 대기 데이터가 있다면 전송

    await sendPendingQueue();


    // 즉시 GPS 요청

    navigator.geolocation
    .getCurrentPosition(

        handleGPSPosition,

        handleGPSError,

        {

            enableHighAccuracy:
                true,

            maximumAge:
                0,

            timeout:
                15000

        }

    );


    loadLive();

}

// =========================================================
// LIVE RENDER
// =========================================================

function renderLive(data){

    const latest = {};


    data.forEach(

        p => {

            latest[p.name] =
                p;

        }

    );


    Object.values(latest)
    .forEach(

        p => {

            const lat =
                Number(p.lat);

            const lng =
                Number(p.lng);


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            )
                return;


            const key =
                p.name;


            const position =

                new kakao.maps.LatLng(
                    lat,
                    lng
                );


            if(!markers[key]){

                markers[key] =

                    new kakao.maps.Marker({

                        map:
                            map,

                        position:
                            position

                    });


                labels[key] =

                    new kakao.maps.CustomOverlay({

                        map:
                            map,

                        position:
                            position,

                        content:

                            `<div class="name-label">

                                🛰 ${p.name}

                            </div>`,

                        yAnchor:
                            1.5

                    });

            }

            else{

                markers[key]
                    .setPosition(
                        position
                    );


                labels[key]
                    .setPosition(
                        position
                    );

            }


            if(
                p.status === "SOS"
            ){

                markers[key]
                .setImage(

                    new kakao.maps.MarkerImage(

                        "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png",

                        new kakao.maps.Size(
                            32,
                            45
                        )

                    )

                );

            }

            else if(
                p.status === "SHARE"
            ){

                markers[key]
                .setImage(

                    new kakao.maps.MarkerImage(

                        "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png",

                        new kakao.maps.Size(
                            32,
                            45
                        )

                    )

                );

            }

        }

    );

}

// =========================================================
// STOP
// =========================================================

async function stopTracking(){

    if(!isTracking){

        alert(
            "현재 추적 중이 아닙니다."
        );

        return;

    }


    endTime =
        getNowTime();


    if(lastPos){

        await saveAndSend({

            ...lastPos,

            status:
                "STOP",

            startTime:
                startTime,

            endTime:
                endTime,

            recordedAt:
                endTime

        });

    }


    isTracking =
        false;


    if(
        watchId !== null
    ){

        navigator.geolocation
        .clearWatch(
            watchId
        );

        watchId =
            null;

    }


    if(intervalSend){

        clearInterval(
            intervalSend
        );

        intervalSend =
            null;

    }


    if(intervalLoad){

        clearInterval(
            intervalLoad
        );

        intervalLoad =
            null;

    }


    if(centerInterval){

        clearInterval(
            centerInterval
        );

        centerInterval =
            null;

    }


    await sendPendingQueue();


    await releaseWakeLock();


    lastPos =
        null;

    previousPos =
        null;

    myName =
        "";

    startTime =
        "";

    endTime =
        "";


    setStatus(
        gpsStatus,
        "📍 GPS OFF",
        "off"
    );


    // 마커 삭제

    Object.values(markers)
    .forEach(

        marker => {

            marker.setMap(
                null
            );

        }

    );


    Object.keys(markers)
    .forEach(

        k => {

            delete markers[k];

        }

    );


    Object.values(labels)
    .forEach(

        label => {

            label.setMap(
                null
            );

        }

    );


    Object.keys(labels)
    .forEach(

        k => {

            delete labels[k];

        }

    );


    nameInput.disabled =
        false;


    nameInput.value =
        "";


    startBtn.disabled =
        true;


    await updatePendingCount();


    alert(
        "⛔ STOP 완료"
    );

}

// =========================================================
// NATIONAL PARK
// =========================================================

function loadNationalParks(){

    fetch(
        "national_parks.geojson"
    )

    .then(
        r => r.json()
    )

    .then(

        data => {

            data.features.forEach(

                feature => {

                    const geometry =
                        feature.geometry;


                    if(
                        geometry.type ===
                        "Polygon"
                    ){

                        drawPark(
                            geometry.coordinates[0],
                            feature
                        );

                    }


                    if(
                        geometry.type ===
                        "MultiPolygon"
                    ){

                        geometry.coordinates
                        .forEach(

                            poly => {

                                drawPark(
                                    poly[0],
                                    feature
                                );

                            }

                        );

                    }

                }

            );

        }

    )

    .catch(

        e => {

            console.log(
                "국립공원 로딩 오류",
                e
            );

        }

    );

}


// =========================================================
// DRAW PARK
// =========================================================

function drawPark(
    coords,
    feature
){

    const path =

        coords.map(

            c =>

                new kakao.maps.LatLng(
                    c[1],
                    c[0]
                )

        );


    const polygon =

        new kakao.maps.Polygon({

            map:
                map,

            path:
                path,

            strokeWeight:
                2,

            strokeColor:
                "#00ffff",

            strokeOpacity:
                .8,

            fillColor:
                "#00ffff",

            fillOpacity:
                .08

        });


    kakao.maps.event.addListener(

        polygon,

        "click",

        function(e){

            const name =

                feature.properties.name ||

                "국립공원";


            const info =

                `<div style="
                    background:#07101f;
                    color:#00ff9d;
                    padding:10px;
                    border:1px solid #00ff9d;
                    border-radius:8px;
                    font-family:monospace">

                    🏔 ${name}

                    <br><br>

                    📍 LAT :
                    ${e.latLng
                        .getLat()
                        .toFixed(6)}

                    <br>

                    📍 LNG :
                    ${e.latLng
                        .getLng()
                        .toFixed(6)}

                </div>`;


            const iw =

                new kakao.maps.InfoWindow({

                    content:
                        info

                });


            iw.setPosition(
                e.latLng
            );


            iw.open(
                map
            );

        }

    );

}

// =========================================================

function clearHistory(){

    historyMarkers
    .forEach(

        m => {

            m.setMap(
                null
            );

        }

    );


    historyMarkers.length =
        0;


    historyLines
    .forEach(

        line => {

            line.setMap(
                null
            );

        }

    );


    historyLines.length =
        0;


    historyLabels
    .forEach(

        label => {

            label.setMap(
                null
            );

        }

    );


    historyLabels.length =
        0;

}


// =========================================================
// HISTORY VIEW
// =========================================================

function showHistory(data){

    const grouped = {};


    data.sort(

        (a,b) => {

            return new Date(a.time)
                -
                new Date(b.time);

        }

    );


    data.forEach(

        d => {

            const lat =
                Number(d.lat);

            const lng =
                Number(d.lng);


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            )
                return;


            if(
                !grouped[d.name]
            ){

                grouped[d.name] =
                    [];

            }


            grouped[d.name].push(

                new kakao.maps.LatLng(

                    lat,
                    lng

                )

            );

        }

    );


    let bounds =
        new kakao.maps.LatLngBounds();


    for(
        const name in grouped
    ){

        const path =
            grouped[name];


        if(
            path.length === 0
        )
            continue;


        path.forEach(

            p => {

                bounds.extend(
                    p
                );

            }

        );


        const line =

            new kakao.maps.Polyline({

                map:
                    map,

                path:
                    path,

                strokeWeight:
                    4,

                strokeColor:
                    "#ffcc00",

                strokeOpacity:
                    .8

            });


        historyLines.push(
            line
        );


        const startMarker =

            new kakao.maps.Marker({

                map:
                    map,

                position:
                    path[0]

            });


        historyMarkers.push(
            startMarker
        );


        const endMarker =

            new kakao.maps.Marker({

                map:
                    map,

                position:
                    path[path.length - 1]

            });


        historyMarkers.push(
            endMarker
        );


        const startLabel =

            new kakao.maps.CustomOverlay({

                map:
                    map,

                position:
                    path[0],

                content:

                    `<div class="name-label">

                        🟢 START ${name}

                    </div>`,

                yAnchor:
                    1.5

            });


        historyLabels.push(
            startLabel
        );


        const endLabel =

            new kakao.maps.CustomOverlay({

                map:
                    map,

                position:
                    path[path.length - 1],

                content:

                    `<div class="name-label">

                        🔴 END ${name}

                    </div>`,

                yAnchor:
                    1.5

            });


        historyLabels.push(
            endLabel
        );

    }


    if(
        data.length > 0
    ){

        map.setBounds(
            bounds
        );

    }

}


// =========================================================
// INITIALIZE
// =========================================================

(async function init(){

    try{

        await openDatabase();

        await updatePendingCount();

    }

    catch(error){

        console.log(
            "DB INIT ERROR",
            error
        );

    }


    loadNationalParks();

    loadLive();

    // 온라인 상태라면 기존 기록 전송

    if(navigator.onLine){

        sendPendingQueue();

    }

})();


// =========================================================
// RIGHT CLICK / DEV TOOLS
// =========================================================

document.addEventListener(

    "contextmenu",

    function(e){

        e.preventDefault();

        return false;

    }

);


document.addEventListener(

    "keydown",

    function(e){

        if(e.key === "F12"){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "u"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "i"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "j"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "c"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "s"
        ){

            e.preventDefault();

            return false;

        }

    }

);

</script>

<style>

* {

    -webkit-tap-highlight-color: transparent;
}

html,
body {

    overflow: hidden;
}

body {
    background: #020812;

}

header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    align-items: center;

header::after {

#name::placeholder {

button[onclick="sendSOS()"]:active {

}

button[onclick="stopTracking()"] {

}

button[onclick="loadAllHistory()"] {

}

.name-label {

        rgba(0,20,16,.94);

   ========================================================= */

.coordinate-window {

}


/* =========================================================
   CLICK MARKER

.coordinate-marker {

    height: 26px;

    border-radius: 50%;

    background:

<header>

</header>

<input
    id="name"

>


<button
    id="startBtn"
    onclick="start()"
    disabled
>

START

</button>


<button
    onclick="goMyLocation()"
>

📍 MY LOCATION

</button>


<button
    onclick="shareLocation()"
>

📡 위치 공유

</button>

    onclick="sendSOS()"
>

🚨 SOS

</button>


<button
    onclick="stopTracking()"
>

⛔ STOP

</button>

    onclick="loadAllHistory()"
>

📦 전체 기록

</button>


</div>


<div id="map"></div>


</div>


<script>


// =========================================================
// API
// =========================================================

const API_URL =

"https://script.google.com/macros/s/AKfycbyem5fAs2XGxNy6wrHO3s68CmJyHy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";



// =========================================================
// DEVICE
// =========================================================

let DEVICE_ID =

localStorage.getItem(
    "DEVICE_ID"
);


if(!DEVICE_ID){

    DEVICE_ID =
        crypto.randomUUID();

    localStorage.setItem(
        "DEVICE_ID",
        DEVICE_ID
    );

}



// =========================================================
// STATE
// =========================================================

let myName = "";

let lastPos = null;

let watchId = null;

let intervalSend = null;

let intervalLoad = null;

let startTime = "";

let endTime = "";

let previousPos = null;

let directionMarker = null;

let centerInterval = null;

let wakeLock = null;


// =========================================================
// MAP OBJECTS
// =========================================================

const markers = {};

const labels = {};

const historyMarkers = [];

const historyLines = [];

const historyLabels = [];


// =========================================================
// CLICK COORDINATE OBJECTS
// =========================================================

let clickMarker = null;

let clickOverlay = null;


// =========================================================
// INPUT
// =========================================================

const nameInput =

    document.getElementById(
        "name"
    );


const startBtn =

    document.getElementById(
        "startBtn"
    );



// =========================================================
// NAME INPUT
// =========================================================

nameInput.addEventListener(

    "input",

    () => {

        startBtn.disabled =

            nameInput.value.trim() === "";

    }

);



// =========================================================
// TIME
// =========================================================

function getNowTime(){

    const d = new Date();

    return (

        d.getFullYear()

        + "-"

        +

        String(
            d.getMonth() + 1
        ).padStart(2,"0")

        + "-"

        +

        String(
            d.getDate()
        ).padStart(2,"0")

        + " "

        +

        String(
            d.getHours()
        ).padStart(2,"0")

        + ":"

        +

        String(
            d.getMinutes()
        ).padStart(2,"0")

        + ":"

        +

        String(
            d.getSeconds()
        ).padStart(2,"0")

    );

}



// =========================================================
// MAP
// =========================================================

const map =

new kakao.maps.Map(

    document.getElementById("map"),

    {

        center:

            new kakao.maps.LatLng(
                35.1239,
                126.9883
            ),

        level: 5

    }

);


// =========================================================
// MAP CLICK → COORDINATE
// =========================================================

kakao.maps.event.addListener(

    map,

    "click",

    function(mouseEvent){

        const lat =

            mouseEvent.latLng.getLat();


        const lng =

            mouseEvent.latLng.getLng();


        const latText =
            lat.toFixed(6);


        const lngText =
            lng.toFixed(6);


        // -------------------------------------------------
        // 기존 좌표 마커 제거
        // -------------------------------------------------

        if(clickMarker){

            clickMarker.setMap(null);

            clickMarker = null;

        }


        // -------------------------------------------------
        // 기존 좌표창 제거
        // -------------------------------------------------

        if(clickOverlay){

            clickOverlay.setMap(null);

            clickOverlay = null;

        }


        // -------------------------------------------------
        // 좌표 마커
        // -------------------------------------------------

        const markerContent =

            `<div class="coordinate-marker"></div>`;


        clickMarker =

            new kakao.maps.CustomOverlay({

                map:
                    map,

                position:
                    mouseEvent.latLng,

                content:
                    markerContent,

                yAnchor:
                    0.5,

                xAnchor:
                    0.5,

                zIndex:
                    999

            });


        // -------------------------------------------------
        // 좌표 정보
        // -------------------------------------------------

        const coordinateText =

            `${latText}, ${lngText}`;


        const infoContent =

            `<div class="coordinate-window">

                <div class="coordinate-title">

                    📍 SELECTED LOCATION

                </div>

                <div class="coordinate-value">

                    LAT :
                    ${latText}

                    <br>

                    LNG :
                    ${lngText}

                </div>

                <button
                    class="coordinate-copy"
                    onclick="
                        copyCoordinate(
                            '${latText}',
                            '${lngText}'
                        )
                    "
                >

                    📋 클릭위치 좌표확인

                </button>

            </div>`;


        clickOverlay =

            new kakao.maps.CustomOverlay({

                map:
                    map,

                position:
                    mouseEvent.latLng,

                content:
                    infoContent,

                yAnchor:
                    1.2,

                xAnchor:
                    0.5,

                zIndex:
                    1000

            });

    }

);


// =========================================================
// COPY COORDINATE
// =========================================================

async function copyCoordinate(lat, lng){

    const text = `${lat}, ${lng}`;

    let success = false;

    // -------------------------------------------------
    // 1. Clipboard API 시도
    // -------------------------------------------------

    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(text);

            success = true;

        }

    }
    catch(error){

        console.log(
            "Clipboard API 실패:",
            error
        );

    }


    // -------------------------------------------------
    // 2. 구형 모바일 브라우저 fallback
    // -------------------------------------------------

    if(!success){

        try {

            const textarea =
                document.createElement("textarea");

            textarea.value = text;

            textarea.style.position = "fixed";
            textarea.style.left = "-9999px";
            textarea.style.top = "0";

            textarea.setAttribute(
                "readonly",
                ""
            );

            document.body.appendChild(
                textarea
            );

            textarea.focus();
            textarea.select();

            textarea.setSelectionRange(
                0,
                textarea.value.length
            );

            success =
                document.execCommand("copy");

            document.body.removeChild(
                textarea
            );

        }
        catch(error){

            console.log(
                "Fallback 복사 실패:",
                error
            );

        }

    }


    // -------------------------------------------------
    // 3. 복사 성공
    // -------------------------------------------------

    if(success){

        console.log(
            "📋 좌표 복사 완료:",
            text
        );


        // 좌표 팝업 닫기
        if(clickOverlay){

            clickOverlay.setMap(null);

            clickOverlay = null;

        }


        // 좌표 마커 제거
        if(clickMarker){

            clickMarker.setMap(null);

            clickMarker = null;

        }


        // 성공 메시지는 alert 대신
        // 잠깐만 표시
        showCopyMessage();

        return;

    }


    // -------------------------------------------------
    // 4. 모든 복사 방법 실패
    // -------------------------------------------------

    alert(
        "좌표 복사에 실패했습니다.\n\n" +
        "좌표:\n" +
        text
    );

}



// =========================================================
// COPY SUCCESS MESSAGE
// =========================================================

function showCopyMessage(){

    const message =
        document.createElement("div");

    message.textContent =
        "📋 좌표 복사 완료";

    message.style.position =
        "fixed";

    message.style.left =
        "50%";

    message.style.bottom =
        "120px";

    message.style.transform =
        "translateX(-50%)";

    message.style.zIndex =
        "99999";

    message.style.padding =
        "10px 18px";

    message.style.border =
        "1px solid #00ff9d";

    message.style.borderRadius =
        "10px";

    message.style.background =
        "rgba(4,14,27,.95)";

    message.style.color =
        "#00ff9d";

    message.style.fontFamily =
        "monospace";

    message.style.fontSize =
        "13px";

    message.style.fontWeight =
        "bold";

    message.style.boxShadow =
        "0 0 20px rgba(0,255,157,.25)";

    document.body.appendChild(
        message
    );


    setTimeout(

        () => {

            message.remove();

        },

        1200

    );

}




// =========================================================
// WAKE LOCK
// =========================================================

async function requestWakeLock(){

    try{

        if(
            !("wakeLock" in navigator)
        ){

            console.log(
                "Wake Lock API 미지원"
            );

            return;

        }


        if(wakeLock){

            return;

        }


        wakeLock =

            await navigator.wakeLock.request(
                "screen"
            );


        console.log(
            "🔒 화면 꺼짐 방지 ON"
        );


        wakeLock.addEventListener(

            "release",

            () => {

                console.log(
                    "🔓 Wake Lock 해제"
                );

                wakeLock = null;

            }

        );

    }

    catch(error){

        console.log(
            "Wake Lock 오류:",
            error
        );

    }

}


// =========================================================
// RELEASE WAKE LOCK
// =========================================================

async function releaseWakeLock(){

    try{

        if(wakeLock){

            await wakeLock.release();

            wakeLock = null;

            console.log(
                "🔓 화면 꺼짐 방지 OFF"
            );

        }

    }

    catch(error){

        console.log(
            "Wake Lock 해제 오류:",
            error
        );

    }

}


// =========================================================
// SCREEN RETURN
// =========================================================

document.addEventListener(

    "visibilitychange",

    async () => {

        if(
            document.visibilityState ===
            "visible"
        ){

            if(myName){

                await requestWakeLock();


                if(lastPos){

                    map.setCenter(

                        new kakao.maps.LatLng(

                            lastPos.lat,

                            lastPos.lng

                        )

                    );

                }

            }

        }

    }

);



// =========================================================
// NATIONAL PARK
// =========================================================

function loadNationalParks(){

    fetch(
        "national_parks.geojson"
    )

    .then(
        r => r.json()
    )

    .then(
        data => {

            data.features.forEach(

                feature => {

                    const geometry =
                        feature.geometry;


                    if(
                        geometry.type ===
                        "Polygon"
                    ){

                        drawPark(
                            geometry.coordinates[0],
                            feature
                        );

                    }


                    if(
                        geometry.type ===
                        "MultiPolygon"
                    ){

                        geometry.coordinates
                        .forEach(

                            poly => {

                                drawPark(
                                    poly[0],
                                    feature
                                );

                            }

                        );

                    }

                }

            );

        }

    )

    .catch(

        e => {

            console.log(
                "국립공원 로딩 오류",
                e
            );

        }

    );

}



// =========================================================
// DRAW PARK
// =========================================================

function drawPark(
    coords,
    feature
){

    const path =

        coords.map(

            c =>

                new kakao.maps.LatLng(
                    c[1],
                    c[0]
                )

        );


    const polygon =

        new kakao.maps.Polygon({

            map:
                map,

            path:
                path,

            strokeWeight:
                2,

            strokeColor:
                "#00ffff",

            strokeOpacity:
                .8,

            fillColor:
                "#00ffff",

            fillOpacity:
                .08

        });


    kakao.maps.event.addListener(

        polygon,

        "click",

        function(e){

            const name =

                feature.properties.name ||

                "국립공원";


            const info =

                `<div style="
                    background:#07101f;
                    color:#00ff9d;
                    padding:10px;
                    border:1px solid #00ff9d;
                    border-radius:8px;
                    font-family:monospace">

                    🏔 ${name}

                    <br><br>

                    📍 LAT :
                    ${e.latLng
                        .getLat()
                        .toFixed(6)}

                    <br>

                    📍 LNG :
                    ${e.latLng
                        .getLng()
                        .toFixed(6)}

                </div>`;


            const iw =

                new kakao.maps.InfoWindow({

                    content:
                        info

                });


            iw.setPosition(
                e.latLng
            );


            iw.open(
                map
            );

        }

    );

}


loadNationalParks();



// =========================================================
// START
// =========================================================

async function start(){

    myName =
        nameInput.value.trim();


    if(!myName){

        alert(
            "RESCUE ID 입력"
        );

        return;

    }


    if(
        !navigator.geolocation
    ){

        alert(
            "이 기기는 GPS 위치 기능을 지원하지 않습니다."
        );

        return;

    }


    startTime =
        getNowTime();


    nameInput.disabled =
        true;


    startBtn.disabled =
        true;


    // 화면 꺼짐 방지

    await requestWakeLock();


    // GPS

    watchId =

        navigator.geolocation.watchPosition(

            pos => {

                lastPos = {

                    name:
                        myName,

                    device:
                        DEVICE_ID,

                    lat:
                        pos.coords.latitude,

                    lng:
                        pos.coords.longitude,

                    accuracy:
                        pos.coords.accuracy,

                    speed:
                        pos.coords.speed,

                    status:
                        "normal"

                };


                map.setCenter(

                    new kakao.maps.LatLng(

                        lastPos.lat,

                        lastPos.lng

                    )

                );

            },


            err => {

                console.log(
                    "GPS ERROR",
                    err
                );


                alert(
                    "GPS 오류: " +
                    err.message
                );

            },


            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    1000,

                timeout:
                    10000

            }

        );


    intervalSend =

        setInterval(

            sendData,

            5000

        );


    intervalLoad =

        setInterval(

            loadLive,

            3000

        );


    startMobileCenter();


    sendData();

    loadLive();

}



// =========================================================
// SEND DATA
// =========================================================

function sendData(){

    if(!lastPos)
        return;


    fetch(

        API_URL,

        {

            method:
                "POST",

            headers: {

                "Content-Type":
                    "text/plain"

            },

            body:

                JSON.stringify({

                    ...lastPos,

                    startTime:
                        startTime,

                    endTime:
                        endTime

                })

        }

    )

    .then(

        () => {

            console.log(
                "📡 위치 전송",
                getNowTime()
            );

        }

    )

    .catch(

        err => {

            console.log(
                "SEND ERROR",
                err
            );

        }

    );

}



// =========================================================
// LOAD LIVE
// =========================================================

function loadLive(){

    fetch(

        API_URL +

        "?live=1&t=" +

        Date.now()

    )

    .then(
        r => r.json()
    )

    .then(

        data => {

            renderLive(data);

        }

    )

    .catch(

        err => {

            console.log(
                "LIVE ERROR",
                err
            );

        }

    );

}



// =========================================================
// LIVE RENDER
// =========================================================

function renderLive(data){

    const latest = {};


    data.forEach(

        p => {

            latest[p.name] =
                p;

        }

    );


    Object.values(latest)
    .forEach(

        p => {

            const lat =
                Number(p.lat);


            const lng =
                Number(p.lng);


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            )
                return;


            const key =
                p.name;


            const position =

                new kakao.maps.LatLng(
                    lat,
                    lng
                );


            if(!markers[key]){

                markers[key] =

                    new kakao.maps.Marker({

                        map:
                            map,

                        position:
                            position

                    });


                labels[key] =

                    new kakao.maps.CustomOverlay({

                        map:
                            map,

                        position:
                            position,

                        content:

                            `<div class="name-label">

                                🛰 ${p.name}

                            </div>`,

                        yAnchor:
                            1.5

                    });

            }

            else{

                markers[key]
                    .setPosition(
                        position
                    );


                labels[key]
                    .setPosition(
                        position
                    );

            }


            if(
                p.status === "SOS"
            ){

                markers[key]
                .setImage(

                    new kakao.maps.MarkerImage(

                        "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png",

                        new kakao.maps.Size(
                            32,
                            45
                        )

                    )

                );

            }

            else if(
                p.status === "SHARE"
            ){

                markers[key]
                .setImage(

                    new kakao.maps.MarkerImage(

                        "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png",

                        new kakao.maps.Size(
                            32,
                            45
                        )

                    )

                );

            }

        }

    );

}

// =========================================================
// SHARE
// =========================================================

function shareLocation(){

    if(!lastPos){

        alert(
            "현재 위치 없음"
        );

        return;

    }


    const mapURL =

        `https://map.kakao.com/link/map/${lastPos.lat},${lastPos.lng}`;


    const message =

`📡 구조대 위치 공유

UNIT :
${lastPos.name}

LAT :
${lastPos.lat}

LNG :
${lastPos.lng}

지도 :
${mapURL}`;


    fetch(

        API_URL,

        {

            method:
                "POST",

            headers: {

                "Content-Type":
                    "text/plain"

            },

            body:

                JSON.stringify({

                    ...lastPos,

                    status:
                        "SHARE"

                })

        }

    );


    if(
        navigator.share
    ){

        navigator.share({

            title:
                "구조대 위치",

            text:
                message

        })

        .catch(
            console.log
        );

    }

    else{

        prompt(
            "복사하세요",
            message
        );

    }

}



// =========================================================
// MOBILE AUTO CENTER
// =========================================================

function startMobileCenter(){

    if(centerInterval)
        return;


    centerInterval =

        setInterval(

            () => {

                if(lastPos){

                    map.setCenter(

                        new kakao.maps.LatLng(

                            lastPos.lat,

                            lastPos.lng

                        )

                    );

                }

            },

            5000

        );

}



// =========================================================
// STOP
// =========================================================

async function stopTracking(){

    endTime =
        getNowTime();


    if(lastPos){

        fetch(

            API_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain"

                },

                body:

                    JSON.stringify({

                        ...lastPos,

                        status:
                            "STOP",

                        startTime:
                            startTime,

                        endTime:
                            endTime

                    })

            }

        );

    }


    if(
        watchId !== null
    ){

        navigator.geolocation
        .clearWatch(
            watchId
        );

        watchId = null;

    }


    clearInterval(
        intervalSend
    );

    clearInterval(
        intervalLoad
    );

    clearInterval(
        centerInterval
    );


    intervalSend = null;

    intervalLoad = null;

    centerInterval = null;


    await releaseWakeLock();


    lastPos = null;

    previousPos = null;

    myName = "";

    startTime = "";

    endTime = "";


    Object.values(markers)
    .forEach(

        marker => {

            marker.setMap(null);

        }

    );


    Object.keys(markers)
    .forEach(

        k => {

            delete markers[k];

        }

    );


    Object.values(labels)
    .forEach(

        label => {

            label.setMap(null);

        }

    );


    Object.keys(labels)
    .forEach(

        k => {

            delete labels[k];

        }

    );


    nameInput.disabled =
        false;


    nameInput.value =
        "";


    startBtn.disabled =
        true;


    alert(
        "⛔ STOP 완료"
    );

}



// =========================================================
// HISTORY LOAD
// =========================================================

function loadAllHistory(){

    clearHistory();


    fetch(

        API_URL +

        "?history=all&t=" +

        Date.now()

    )

    .then(
        r => r.json()
    )

    .then(

        data => {

            showHistory(data);

        }

    )

    .catch(

        err => {

            console.log(
                "HISTORY ERROR",
                err
            );

        }

    );

}



// =========================================================
// HISTORY CLEAR
// =========================================================

function clearHistory(){

    historyMarkers
    .forEach(

        m => {

            m.setMap(null);

        }

    );


    historyMarkers.length = 0;


    historyLines
    .forEach(

        line => {

            line.setMap(null);

        }

    );


    historyLines.length = 0;


    historyLabels
    .forEach(

        label => {

            label.setMap(null);

        }

    );


    historyLabels.length = 0;

}



// =========================================================
// HISTORY VIEW
// =========================================================

function showHistory(data){

    const grouped = {};


    data.sort(

        (a,b) => {

            return new Date(a.time)
                -
                new Date(b.time);

        }

    );


    data.forEach(

        d => {

            const lat =
                Number(d.lat);


            const lng =
                Number(d.lng);


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            )
                return;


            if(!grouped[d.name]){

                grouped[d.name] = [];

            }


            grouped[d.name].push(

                new kakao.maps.LatLng(

                    lat,

                    lng

                )

            );

        }

    );


    let bounds =

        new kakao.maps.LatLngBounds();


    for(
        const name in grouped
    ){

        const path =
            grouped[name];


        if(
            path.length === 0
        )
            continue;


        path.forEach(

            p => {

                bounds.extend(p);

            }

        );


        const line =

            new kakao.maps.Polyline({

                map:
                    map,

                path:
                    path,

                strokeWeight:
                    4,

                strokeColor:
                    "#ffcc00",

                strokeOpacity:
                    .8

            });


        historyLines.push(
            line
        );


        const startMarker =

            new kakao.maps.Marker({

                map:
                    map,

                position:
                    path[0]

            });


        historyMarkers.push(
            startMarker
        );


        const endMarker =

            new kakao.maps.Marker({

                map:
                    map,

                position:
                    path[path.length - 1]

            });


        historyMarkers.push(
            endMarker
        );


        const startLabel =

            new kakao.maps.CustomOverlay({

                map:
                    map,

                position:
                    path[0],

                content:

                    `<div class="name-label">

                        🟢 START ${name}

                    </div>`,

                yAnchor:
                    1.5

            });


        historyLabels.push(
            startLabel
        );


        const endLabel =

            new kakao.maps.CustomOverlay({

                map:
                    map,

                position:
                    path[path.length - 1],

                content:

                    `<div class="name-label">

                        🔴 END ${name}

                    </div>`,

                yAnchor:
                    1.5

            });


        historyLabels.push(
            endLabel
        );

    }


    if(
        data.length > 0
    ){

        map.setBounds(
            bounds
        );

    }

}

// INITIAL LIVE LOAD
// =========================================================

loadLive();

startMobileCenter();

<script>

/* =====================================================
   API
===================================================== */

const ACCIDENT_API_URL =
"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


/* =====================================================
   MAP
===================================================== */

const map =
    L.map("map")
    .setView(
        [35.1345,126.9902],
        13
    );


const osm =
L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:"&copy; OpenStreetMap contributors"
    }
).addTo(map);


const topo =
L.tileLayer(
    "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    {
        maxZoom:17,
        attribution:"&copy; OpenTopoMap contributors"
    }
).addTo(map);


const satellite =
L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
        maxZoom:19,
        attribution:"Tiles &copy; Esri"
    }
);


L.control.layers({

    "🗺 일반지도":osm,
    "⛰ 지형지도":topo,
    "🛰 위성지도":satellite

}).addTo(map);


/* =====================================================
   COORDINATE DISPLAY
===================================================== */

const coordControl =
    L.control({
        position:"bottomleft"
    });


coordControl.onAdd = function(){

    this._div =
        L.DomUtil.create(
            "div",
            "mouse-coords"
        );

    this._div.innerHTML =
        "Lat : --<br>Lng : --";

    return this._div;

};


coordControl.addTo(map);


map.on(
    "mousemove",
    function(e){

        coordControl._div.innerHTML =
            "Lat : " +
            e.latlng.lat.toFixed(6) +
            "<br>Lng : " +
            e.latlng.lng.toFixed(6);

    }
);


map.on(
    "mouseout",
    function(){

        coordControl._div.innerHTML =
            "Lat : --<br>Lng : --";

    }
);


/* =====================================================
   DRAW
===================================================== */

const drawnItems =
    new L.FeatureGroup();


map.addLayer(drawnItems);


map.addControl(
    new L.Control.Draw({
        draw:{
            polygon:true,
            rectangle:true,
            marker:true,
            polyline:true,
            circle:true
        },
        edit:{
            featureGroup:drawnItems
        }
    })
);


map.on(
    L.Draw.Event.CREATED,
    function(e){

        drawnItems.addLayer(e.layer);

    }
);


/* =====================================================
   LAYERS
===================================================== */

const sosLayer =
    L.layerGroup().addTo(map);


const accidentLayer =
    L.layerGroup().addTo(map);


/* =====================================================
   STATE
===================================================== */

let reportPreviewMarker = null;

let selectedType = "";

let accidentTimer = null;

let knownIds = new Set();

let alertedOverdueIds = new Set();

let firstLoad = true;

let accidentLoading = false;

let addressSearchTimer = null;


/* =====================================================
   DOM
===================================================== */

const conditionEl =
    document.getElementById("condition");


const phoneEl =
    document.getElementById("phone");


const addressEl =
    document.getElementById("address");


const latEl =
    document.getElementById("lat");


const lngEl =
    document.getElementById("lng");


const caseList =
    document.getElementById("caseList");


/* =====================================================
   DEVICE ID
===================================================== */

let DEVICE_ID =
    localStorage.getItem("DEVICE_ID");


if(!DEVICE_ID){

    DEVICE_ID =
        window.crypto &&
        typeof crypto.randomUUID === "function"
        ? crypto.randomUUID()
        : "DEVICE-" +
          Date.now() +
          "-" +
          Math.random()
          .toString(36)
          .slice(2);

    localStorage.setItem(
        "DEVICE_ID",
        DEVICE_ID
    );

}


/* =====================================================
   DEVICE CODE
===================================================== */

function makeDeviceCode(deviceId){

    let hash = 2166136261;


    for(
        let i=0;
        i<deviceId.length;
        i++
    ){

        hash ^= deviceId.charCodeAt(i);

        hash =
            Math.imul(
                hash,
                16777619
            );

    }


    hash >>>= 0;


    return (
        hash % 1296
    )
    .toString(36)
    .toUpperCase()
    .padStart(2,"0");

}


let DEVICE_CODE =
    localStorage.getItem("DEVICE_CODE");


if(
    !DEVICE_CODE ||
    !/^[0-9A-Z]{2}$/.test(DEVICE_CODE)
){

    DEVICE_CODE =
        makeDeviceCode(DEVICE_ID);

    localStorage.setItem(
        "DEVICE_CODE",
        DEVICE_CODE
    );

}


/* =====================================================
   TRANSMISSION NUMBER
===================================================== */

function getTransmissionNumber(
    date = new Date()
){

    const year =
        String(
            date.getFullYear()
        ).slice(-2);


    const month =
        String(
            date.getMonth()+1
        ).padStart(2,"0");


    const day =
        String(
            date.getDate()
        ).padStart(2,"0");


    const hour =
        String(
            date.getHours()
        ).padStart(2,"0");


    const minute =
        String(
            date.getMinutes()
        ).padStart(2,"0");


    return (
        year +
        month +
        day +
        hour +
        minute +
        "-" +
        DEVICE_CODE
    );

}


/* =====================================================
   TIME
===================================================== */

function getNowTime(){

    const d =
        new Date();


    return (
        d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0") + "-" +
        String(d.getDate()).padStart(2,"0") + " " +
        String(d.getHours()).padStart(2,"0") + ":" +
        String(d.getMinutes()).padStart(2,"0") + ":" +
        String(d.getSeconds()).padStart(2,"0")
    );

}


/* =====================================================
   COORDINATE VALIDATION
===================================================== */

function validateCoordinates(
    lat,
    lng
){

    lat = Number(lat);
    lng = Number(lng);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return {
            valid:false,
            message:
                "위도와 경도를 정확하게 입력하세요."
        };

    }


    if(
        lat < -90 ||
        lat > 90
    ){

        return {
            valid:false,
            message:
                "위도는 -90 ~ 90 범위로 입력하세요."
        };

    }


    if(
        lng < -180 ||
        lng > 180
    ){

        return {
            valid:false,
            message:
                "경도는 -180 ~ 180 범위로 입력하세요."
        };

    }


    return {
        valid:true,
        lat:lat,
        lng:lng
    };

}


/* =====================================================
   GPS
===================================================== */

function getCurrentGPS(){

    return new Promise(
        function(resolve,reject){

            if(!navigator.geolocation){

                reject(
                    new Error(
                        "GPS_NOT_SUPPORTED"
                    )
                );

                return;

            }


            navigator.geolocation.getCurrentPosition(

                function(position){

                    resolve({

                        lat:
                            position.coords.latitude,

                        lng:
                            position.coords.longitude,

                        accuracy:
                            position.coords.accuracy

                    });

                },

                function(error){

                    reject(error);

                },

                {
                    enableHighAccuracy:true,
                    timeout:15000,
                    maximumAge:5000
                }

            );

        }
    );

}


/* =====================================================
   CURRENT LOCATION
===================================================== */

async function useCurrentLocationForReport(){

    const button =
        document.getElementById(
            "currentReportLocationBtn"
        );


    button.disabled = true;


    try{

        const position =
            await getCurrentGPS();


        const checked =
            validateCoordinates(
                position.lat,
                position.lng
            );


        if(!checked.valid){

            throw new Error(
                checked.message
            );

        }


        latEl.value =
            checked.lat.toFixed(6);


        lngEl.value =
            checked.lng.toFixed(6);


        map.setView(
            [
                checked.lat,
                checked.lng
            ],
            17
        );


        setReportPreview(
            checked.lat,
            checked.lng
        );

    }
    catch(err){

        alert(
            "현재 위치를 가져오지 못했습니다.\n" +
            "GPS 권한을 확인하세요.\n\n" +
            err.message
        );

    }
    finally{

        button.disabled = false;

    }

}


document
.getElementById(
    "currentReportLocationBtn"
)
.addEventListener(
    "click",
    useCurrentLocationForReport
);


/* =====================================================
   MANUAL COORDINATE
===================================================== */

function applyManualCoordinates(){

    const checked =
        validateCoordinates(
            latEl.value.trim(),
            lngEl.value.trim()
        );


    if(!checked.valid){

        alert(
            checked.message
        );

        return;

    }


    latEl.value =
        checked.lat.toFixed(6);


    lngEl.value =
        checked.lng.toFixed(6);


    setReportPreview(
        checked.lat,
        checked.lng
    );


    map.setView(
        [
            checked.lat,
            checked.lng
        ],
        17
    );

}


document
.getElementById(
    "applyCoordinateBtn"
)
.addEventListener(
    "click",
    applyManualCoordinates
);


/* =====================================================
   PREVIEW
===================================================== */

function setReportPreview(
    lat,
    lng
){

    if(reportPreviewMarker){

        map.removeLayer(
            reportPreviewMarker
        );

    }


    reportPreviewMarker =
        L.marker(
            [lat,lng]
        )
        .addTo(map)
        .bindPopup(
            `
            <div style="
                font-family:Arial,sans-serif;
                color:#111;
            ">
                <b>📍 신고 위치</b>
                <br><br>
                위도: ${lat.toFixed(6)}
                <br>
                경도: ${lng.toFixed(6)}
            </div>
            `
        )
        .openPopup();

}


/* =====================================================
   MAP CLICK → COORDINATE
===================================================== */

/* =====================================================
   MAP CLICK → COORDINATE + ADDRESS
===================================================== */

map.on(
    "click",
    function(e){

        const lat =
            e.latlng.lat;

        const lng =
            e.latlng.lng;


        // 입력창에 좌표 자동 입력
        latEl.value =
            lat.toFixed(6);

        lngEl.value =
            lng.toFixed(6);


        // 신고 위치 미리보기
        setReportPreview(
            lat,
            lng
        );


        // Kakao 좌표 → 주소 변환
        if(
            typeof kakao === "undefined" ||
            !kakao.maps ||
            !kakao.maps.services
        ){

            L.popup()
            .setLatLng([lat,lng])
            .setContent(`
                <div style="
                    font-family:Arial,sans-serif;
                    color:#111;
                    min-width:220px;
                ">
                    <b>📍 선택 위치</b>
                    <hr>
                    위도: ${lat.toFixed(6)}
                    <br>
                    경도: ${lng.toFixed(6)}
                    <br><br>
                    ⚠ 주소 변환 서비스를 사용할 수 없습니다.
                </div>
            `)
            .openOn(map);

            return;
        }


        const geocoder =
            new kakao.maps.services.Geocoder();


        geocoder.coord2Address(
            lng,
            lat,
            function(result,status){

                let address =
                    "주소를 찾을 수 없습니다.";


                if(
                    status ===
                    kakao.maps.services.Status.OK &&
                    result &&
                    result.length > 0
                ){

                    const roadAddress =
                        result[0].road_address;

                    const jibunAddress =
                        result[0].address;


                    if(
                        roadAddress &&
                        roadAddress.address_name
                    ){

                        address =
                            roadAddress.address_name;

                    }
                    else if(
                        jibunAddress &&
                        jibunAddress.address_name
                    ){

===================================================== */

function searchAddress(){

    const address =
        addressEl.value.trim();

    if(!address){
        return;
    }

    if(
        typeof kakao === "undefined" ||
        !kakao.maps ||
        !kakao.maps.services
    ){
        console.warn("Kakao Maps API를 사용할 수 없습니다.");
        return;
    }

    const geocoder =
        new kakao.maps.services.Geocoder();

    geocoder.addressSearch(
        address,
        function(result,status){

            if(
                status ===
                kakao.maps.services.Status.OK
            ){

                const lat =
                    parseFloat(result[0].y);

                const lng =
                    parseFloat(result[0].x);

                latEl.value =
                    lat.toFixed(6);

                lngEl.value =
                    lng.toFixed(6);

                map.setView(
                    [lat,lng],
                    17
                );

                setReportPreview(
                    lat,
                    lng
                );
            }
        }
    );
}

/* =====================================================
   좌표 → 주소 자동변환
===================================================== */      

function searchAddressFromCoordinates(){

    const lat =
        Number(latEl.value.trim());

    const lng =
        Number(lngEl.value.trim());

    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){
        return;
    }

    if(
        lat < -90 ||
        lat > 90 ||
        lng < -180 ||
        lng > 180
    ){
        return;
    }

    if(
        typeof kakao === "undefined" ||
        !kakao.maps ||
        !kakao.maps.services
    ){
        console.warn("Kakao Maps API를 사용할 수 없습니다.");
        return;
    }

    const geocoder =
        new kakao.maps.services.Geocoder();

    geocoder.coord2Address(
        lng,
        lat,
        function(result,status){

            if(
                status !==
                kakao.maps.services.Status.OK
            ){
                return;
            }

            if(
                result &&
                result.length > 0
            ){

                const roadAddress =
                    result[0].road_address;

                const jibunAddress =
                    result[0].address;

                let address = "";

                if(
                    roadAddress &&
                    roadAddress.address_name
                ){

                    address =
                        roadAddress.address_name;

                }
                else if(
                    jibunAddress &&
                    jibunAddress.address_name
                ){

                    address =
                        jibunAddress.address_name;

                }

                if(address){

                    addressEl.value =
                        address;
                }
            }
        }
    );
}

/* =====================================================
   POST API
===================================================== */

async function postAccident(payload){

    const response =
        await fetch(
            ACCIDENT_API_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },
                body:
                    JSON.stringify(payload)
            }
        );


    const text =
        await response.text();


    let data;


    try{

        data =
            JSON.parse(text);

    }
    catch(e){

        data = {

            result:"error",

            message:text

        };

    }


    if(!response.ok){

        throw new Error(
            data.message ||
            "HTTP " + response.status
        );

    }


    return data;

}

/* =====================================================
   FIELD
===================================================== */

function getAccidentField(
    item,
    names
){

    if(!item){

        return "";

    }


    for(
        const name of names
    ){

        if(
            item[name] !== undefined &&
            item[name] !== null &&
            String(item[name]).trim() !== ""
        ){

            return item[name];

        }

    }


    return "";

}


/* =====================================================
   NORMALIZE FIELD
===================================================== */

function normalizeFieldName(value){

    return String(value ?? "")
        .trim()
        .replace(/\s+/g,"")
        .replace(/_/g,"")
        .replace(/-/g,"")
        .replace(/\./g,"")
        .replace(/\(/g,"")
        .replace(/\)/g,"")
        .toLowerCase();

}


/* =====================================================
   TRANSMISSION NUMBER
===================================================== */

function getTransmissionNumberFromItem(item){

    if(!item){

        return "";

    }


    if(Array.isArray(item)){

        for(
            const value of item
        ){

            if(
                value === undefined ||
                value === null
            ){

                continue;

            }


            const text =
                String(value).trim();


            if(!text){

                continue;

            }


            if(
                /^\d{10}-[A-Z0-9]{2}$/i
                .test(text)
            ){

                return text;

            }


            if(
                /^\d{6,14}-[A-Z0-9]{2,}$/i
                .test(text)
            ){

                return text;

            }

        }

    }


    const directNames = [

        "transmissionNumber",
        "TransmissionNumber",

        "transmission_number",
        "Transmission_Number",

        "transmissionNo",
        "TransmissionNo",

        "transmissionNO",
        "TransmissionNO",

        "transmission",

        "전송번호",
        "전송 번호",
        "전송번호ID",
        "전송번호 Id",

        "번호"

    ];


    for(
        const name of directNames
    ){

        if(
            Object.prototype.hasOwnProperty.call(
                item,
                name
            )
        ){

            const value =
                item[name];


            if(
                value !== undefined &&
                value !== null &&
                String(value).trim() !== ""
            ){

                return String(
                    value
                ).trim();

            }

        }

    }


    const normalizedNames = [

        "transmissionnumber",
        "transmissionno",
        "transmission",

        "전송번호",
        "전송번호id",

        "번호"

    ];


    const keys =
        Object.keys(item);


    for(
        const key of keys
    ){

        const normalizedKey =
            normalizeFieldName(
                key
            );


        if(
            normalizedNames.includes(
                normalizedKey
            )
        ){

            const value =
                item[key];


            if(
                value !== undefined &&
                value !== null &&
                String(value).trim() !== ""
            ){

                return String(
                    value
                ).trim();

            }

        }

    }


    for(
        const key of keys
    ){

        const normalizedKey =
            normalizeFieldName(
                key
            );


        if(
            normalizedKey.includes(
                "전송번호"
            ) ||
            normalizedKey.includes(
                "transmissionnumber"
            )
        ){

            const value =
                item[key];


            if(
                value !== undefined &&
                value !== null &&
                String(value).trim() !== ""
            ){

                return String(
                    value
                ).trim();

            }

        }

    }


    for(
        const key of keys
    ){

        const value =
            item[key];


        if(
            value &&
            typeof value === "object" &&
            !Array.isArray(value)
        ){

            const nested =
                getTransmissionNumberFromItem(
                    value
                );


            if(nested){

                return nested;

            }

        }

    }


    for(
        const key of keys
    ){

        const value =
            item[key];


        if(
            value === undefined ||
            value === null
        ){

            continue;

        }


        const text =
            String(value).trim();


        if(!text){

            continue;

        }


        if(
            /^\d{10}-[A-Z0-9]{2}$/i
            .test(text)
        ){

            return text;

        }


        if(
            /^\d{6,14}-[A-Z0-9]{2,}$/i
            .test(text)
        ){

            return text;

        }

    }


    return "";

}

function getAccidentId(
    item,
    index
){

    const value =
        getAccidentField(
            item,
            [
                "id",

/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(value){

    const status =
        String(value || "")
        .trim()
        .toUpperCase();


    if(
        status === "DONE" ||
        status === "완료" ||
        status === "처리완료" ||
        status === "사고처리완료"
    ){

        return "DONE";

    }


    if(
        status === "ARRIVED" ||
        status === "도착" ||
        status === "현장도착"
    ){

        return "ARRIVED";

    }


    return "RECEIVED";

}


/* =====================================================
   ELAPSED
===================================================== */

function getElapsedTime(
    startTime,
    endTime=null
){

    if(!startTime){

        return "-";

    }


    const start =
        new Date(startTime);


    if(
        Number.isNaN(
            start.getTime()
        )
    ){

        return "-";

    }


    const end =
        endTime
        ? new Date(endTime)
        : new Date();


    if(
        Number.isNaN(
            end.getTime()
        )
    ){

        return "-";

    }


    let diff =
        Math.floor(
            (end-start)/1000
        );


    if(diff<0){

        diff=0;

    }


    const hour =
        Math.floor(
            diff/3600
        );


    diff%=3600;


    const minute =
        Math.floor(
            diff/60
        );


    const second =
        diff%60;


    return (
        String(hour).padStart(2,"0") +
        ":" +
        String(minute).padStart(2,"0") +
        ":" +
        String(second).padStart(2,"0")
    );

}

        return data.data;

    if(

        return data.items;

        [...data].sort(

                const ta =
                    new Date(
                        getAccidentStartTime(a)
                    ).getTime();


                const tb =
                    new Date(
                        getAccidentStartTime(b)
                    ).getTime();


                if(
                    Number.isNaN(ta)
                ){

                    return 1;

                }


                if(
                    Number.isNaN(tb)
                ){

                    return -1;

                }


                return tb-ta;

            }
        );


    let html="";


    rows.forEach(
        function(item,index){

            const id =
                getAccidentId(
                    item,
                    index
                );


            const transmissionNumber =
                getTransmissionNumberFromItem(
                    item
                );


            const displayTransmissionNumber =
                transmissionNumber ||
                "-";


            const status =
                normalizeStatus(
                    getAccidentField(
                        item,
                        [
                            "status",
                            "state",
                            "상태",

/* =====================================================
   SHARE BY ID
===================================================== */

async function shareAccidentById(
    caseId
){

    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    try{

        const response =
            await fetch(
                ACCIDENT_API_URL +
                "?action=list&t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        const rows =
            extractAccidentRows(
                data
            );


        let target =
            null;


        rows.forEach(
            function(row,index){

                if(
                    String(
                        getAccidentId(
                            row,
                            index
                        )
                    ) ===
                    String(caseId)
                ){

                    target =
                        row;

                }

            }
        );


        if(!target){

            alert(
                "공유할 신고 내용을 찾을 수 없습니다."
            );

            return;

        }


        await shareAccident(
            target
        );

    }
    catch(err){

        console.error(
            "공유용 신고 조회 오류:",
            err
        );


        alert(
            "공유할 신고 정보를 가져오지 못했습니다.\n\n" +
            err.message
        );

    }

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return String(value ?? "")
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );

}


function escapeJS(value){

    return String(value ?? "")
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /\r/g,
            "\\r"
        )
        .replace(
            /\n/g,
            "\\n"
        );

}

function focusAccident(
    lat,
    lng
){

    lat =
        Number(lat);


    lng =
        Number(lng);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return;

    }


    map.setView(
        [lat,lng],
        17
    );


    L.popup()
    .setLatLng(
        [lat,lng]
    )
    .setContent(
        `
        <div style="
            font-family:Arial,sans-serif;
            color:#111;
        ">
            <b>🆘 사고 신고 위치</b>
            <br><br>
            위도: ${lat.toFixed(6)}
            <br>
            경도: ${lng.toFixed(6)}
        </div>
        `
    )
    .openOn(map);

}

/* =====================================================
   UPDATE
===================================================== */

async function updateAccident(
    caseId
){

    const coordinateResult =
        validateCoordinates(
            latEl.value,
            lngEl.value
        );


    if(
        !caseId ||
        !selectedType ||
        !conditionEl.value.trim() ||
        !phoneEl.value.trim() ||
        !coordinateResult.valid
    ){

        alert(
            "수정할 신고 정보를 모두 확인하세요."
        );

        return;

    }


    const lat =
        coordinateResult.lat;


    const lng =
        coordinateResult.lng;


    const address =
        addressEl.value.trim() ||
        `위도 ${lat.toFixed(6)}, 경도 ${lng.toFixed(6)}`;


    try{

        const result =
            await postAccident({

                action:
                    "update",

                id:
                    String(caseId),

                type:
                    selectedType,

                symptom:
                    conditionEl.value.trim(),

                phone:
                    phoneEl.value.trim(),

                address:
                    address,

                lat:
                    lat,

                lng:
                    lng,

                kakaoMapURL:
                    "https://map.kakao.com/link/map/" +
                    lat + "," + lng

            });


        if(
            !result ||
            result.result !== "success"
        ){

            throw new Error(
                result &&
                result.message
                ?
                result.message
                :
                "수정 실패"
            );

        }


        alert(
            "✏ 신고 내용이 수정되었습니다."
        );


        resetReportForm();


        await loadAccidents();

    }
    catch(err){

        console.error(err);


        alert(
            "신고 수정 실패\n\n" +
            err.message
        );

    }

}

async function deleteAccident(
    caseId
){

    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    const password =
        prompt(
            "🔐 신고 삭제 비밀번호를 입력하세요."
        );


    if(password===null){

        return;

    }


    if(password.trim()===""){

        alert(
            "❌ 삭제 비밀번호를 입력하세요."
        );

        return;

    }


    if(
        !confirm(
            "⚠ 신고 내용을 삭제하시겠습니까?\n\n" +
            "삭제하면 Google Sheets에서도 해당 신고가 삭제됩니다."
        )
    ){

        return;

    }


    try{

        const cards =
            document.querySelectorAll(
                `[data-case-id="${CSS.escape(String(caseId))}"]`
            );


        cards.forEach(
            function(card){

                card.style.opacity =
                    ".5";

                card.style.pointerEvents =
                    "none";

            }
        );


        const result =
            await postAccident({

                action:
                    "delete",

                id:
                    String(caseId),

                password:
                    password

            });


        if(
            !result ||
            result.result !== "success"
        ){

            throw new Error(
                result &&
                result.message
                ?
                result.message
                :
                "삭제 실패"
            );

        }


        alert(
            "🗑 신고가 삭제되었습니다."
        );


        await loadAccidents();

    }
    catch(err){

        console.error(
            "삭제 오류:",
            err
        );


        alert(
            "❌ 신고 삭제 실패\n\n" +
            err.message
        );


        await loadAccidents();

    }

}

async function updateAccidentStatus(

){

    const status =
        normalizeStatus(
            newStatus
        );


    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    let message =
        "처리하시겠습니까?";


    let action =
        "";


    if(status==="ARRIVED"){

        message =
            "🚓 현장 도착으로 변경하시겠습니까?";

        action =
            "complete";

    }


    if(status==="DONE"){

        message =
            "✅ 구조 완료로 변경하시겠습니까?";

        action =
            "finish";

    }


    if(!action){

        return;

    }


    if(!confirm(message)){

        return;

    }


    try{

        const result =
            await postAccident({

                action:
                    action,

                id:
                    String(caseId)

            });


        if(
            !result ||
            result.result !== "success"
        ){

            throw new Error(
                result &&
                result.message
                ?
                result.message
                :
                "상태 변경 실패"
            );

        }


        alert(
            status==="ARRIVED"
            ?
            "🚓 현장 도착 처리 완료"
            :
            "✅ 구조 완료 처리 완료"
        );


        await loadAccidents();

    }
    catch(err){

        console.error(err);


        alert(
            "상태 변경 실패\n\n" +
            err.message
        );

    }

}


/* =====================================================
   ALERT
===================================================== */

function playAlert(){

    const audio =
        document.getElementById(
            "alertSound"
        );


    if(!audio){

        return;

    }


    audio.currentTime =
        0;


    const promise =
        audio.play();


    if(
        promise &&
        typeof promise.catch ===
        "function"
    ){

        promise.catch(
            function(err){

                console.log(
                    "알림음 재생 제한:",
                    err
                );

            }
        );

    }

}


/* =====================================================
   AUTO REFRESH
===================================================== */

function startAccidentAutoRefresh(){

    if(accidentTimer){

        clearInterval(
            accidentTimer
        );

    }


    loadAccidents();


    accidentTimer =
        setInterval(
            loadAccidents,
            60000
        );

}

/* =========================
   우클릭 및 개발자도구 단축키 방지
   ========================= */

document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
});

document.addEventListener('keydown', function(e) {

    // F12
    if (e.key === 'F12') {
        e.preventDefault();
        return false;
    }

    // Ctrl + U (페이지 소스 보기)
    if (e.ctrlKey && e.key.toLowerCase() === 'u') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + I (개발자 도구)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + J (콘솔)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + C (요소 선택)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
        e.preventDefault();
        return false;
    }

    // Ctrl + S (페이지 저장)
    if (e.ctrlKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        return false;
    }
});

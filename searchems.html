<script>

/* =====================================================
   API
===================================================== */

const GPS_API_URL =
"https://script.google.com/macros/s/AKfcybyem5fAs2XGxNy6wrHO3s68CmJy7GI31IBKdiz49KtN3sfikYdfmpP07-3dWqna2R/exec";

const ACCIDENT_API_URL =
"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


/* =====================================================
   DELETE PASSWORD
===================================================== */



/* =====================================================
   MAP
===================================================== */

const map =
    L.map("map")
    .setView(
        [35.1345,126.9902],
        13
    );

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:"&copy; OpenStreetMap contributors"
    }
).addTo(map);


/* =====================================================
   COORDINATE
===================================================== */

const coordControl =
    L.control({
        position:"bottomleft"
    });

coordControl.onAdd = function(){

    this._div =
        L.DomUtil.create(
            "div",
            "mouse-coords"
        );

    this._div.innerHTML =
        "Lat : --<br>Lng : --";

    return this._div;
};

coordControl.addTo(map);

map.on("mousemove",function(e){

    coordControl._div.innerHTML =
        "Lat : " +
        e.latlng.lat.toFixed(6) +
        "<br>Lng : " +
        e.latlng.lng.toFixed(6);

});

map.on("mouseout",function(){

    coordControl._div.innerHTML =
        "Lat : --<br>Lng : --";

});


/* =====================================================
   DRAW
===================================================== */

const drawnItems =
    new L.FeatureGroup();

map.addLayer(drawnItems);

map.addControl(
    new L.Control.Draw({
        draw:{
            polygon:true,
            rectangle:true,
            marker:true,
            polyline:true,
            circle:true
        },
        edit:{
            featureGroup:drawnItems
        }
    })
);

map.on(
    L.Draw.Event.CREATED,
    function(e){
        drawnItems.addLayer(e.layer);
    }
);


/* =====================================================
   LAYERS
===================================================== */

const sosLayer =
    L.layerGroup().addTo(map);

const accidentLayer =
    L.layerGroup().addTo(map);


/* =====================================================
   STATE
===================================================== */

let reportPreviewMarker = null;

let selectedType = "";

let accidentTimer = null;

let knownIds = new Set();

let alertedOverdueIds = new Set();

let firstLoad = true;

let accidentLoading = false;


/* =====================================================
   DOM
===================================================== */

const conditionEl =
    document.getElementById("condition");

const phoneEl =
    document.getElementById("phone");

const addressEl =
    document.getElementById("address");

const latEl =
    document.getElementById("lat");

const lngEl =
    document.getElementById("lng");

const caseList =
    document.getElementById("caseList");


/* =====================================================
   DEVICE ID
===================================================== */

let DEVICE_ID =
    localStorage.getItem("DEVICE_ID");

if(!DEVICE_ID){

    DEVICE_ID =
        window.crypto &&
        typeof crypto.randomUUID === "function"
        ? crypto.randomUUID()
        : "DEVICE-" +
          Date.now() +
          "-" +
          Math.random()
          .toString(36)
          .slice(2);

    localStorage.setItem(
        "DEVICE_ID",
        DEVICE_ID
    );
}


/* =====================================================
   TIME
===================================================== */

function getNowTime(){

    const d = new Date();

    return (
        d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0") + "-" +
        String(d.getDate()).padStart(2,"0") + " " +
        String(d.getHours()).padStart(2,"0") + ":" +
        String(d.getMinutes()).padStart(2,"0") + ":" +
        String(d.getSeconds()).padStart(2,"0")
    );
}


/* =====================================================
   GPS
===================================================== */

function getCurrentGPS(){

    return new Promise(function(resolve,reject){

        if(!navigator.geolocation){

            reject(
                new Error("GPS_NOT_SUPPORTED")
            );

            return;
        }

        navigator.geolocation.getCurrentPosition(

            function(position){

                resolve({
                    lat:position.coords.latitude,
                    lng:position.coords.longitude,
                    accuracy:position.coords.accuracy
                });

            },

            function(error){
                reject(error);
            },

            {
                enableHighAccuracy:true,
                timeout:15000,
                maximumAge:5000
            }

        );

    });
}


/* =====================================================
   SOS
===================================================== */

async function sendSOS(){

    const button =
        document.getElementById("sosBtn");

    button.disabled = true;

    try{

        const position =
            await getCurrentGPS();

        const lat =
            Number(position.lat);

        const lng =
            Number(position.lng);

        sosLayer.clearLayers();

        const marker =
            L.circleMarker(
                [lat,lng],
                {
                    radius:16,
                    color:"#ff0000",
                    fillColor:"#ff0000",
                    fillOpacity:1,
                    weight:4
                }
            );

        marker.bindPopup(`
            <div style="
                font-family:Arial;
                color:#111;
                text-align:center;
            ">
                <b style="color:red;font-size:17px">
                    🚨 SOS 긴급 위치
                </b>
                <hr>
                위도<br>
                ${lat.toFixed(6)}
                <br><br>
                경도<br>
                ${lng.toFixed(6)}
                <br><br>
                GPS 정확도<br>
                약 ${Math.round(position.accuracy)}m
            </div>
        `);

        marker.addTo(sosLayer);

        L.circle(
            [lat,lng],
            {
                radius:100,
                color:"red",
                fillColor:"red",
                fillOpacity:.25,
                weight:3
            }
        ).addTo(sosLayer);

        map.setView(
            [lat,lng],
            17
        );

        marker.openPopup();

        const response =
            await fetch(
                GPS_API_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"text/plain"
                    },
                    body:JSON.stringify({
                        device:DEVICE_ID,
                        lat:lat,
                        lng:lng,
                        status:"SOS",
                        sosTime:getNowTime(),
                        accuracy:position.accuracy
                    })
                }
            );

        if(!response.ok){
            throw new Error(
                "HTTP " + response.status
            );
        }

        alert(
            "🚨 SOS 긴급전송 완료"
        );

    }
    catch(err){

        console.error(err);

        alert(
            "🚨 SOS 전송 실패\nGPS 권한을 확인하세요."
        );

    }
    finally{

        button.disabled = false;

    }

}

document
.getElementById("sosBtn")
.addEventListener(
    "click",
    sendSOS
);


/* =====================================================
   CURRENT LOCATION
===================================================== */

async function useCurrentLocationForReport(){

    const button =
        document.getElementById(
            "currentReportLocationBtn"
        );

    button.disabled = true;

    try{

        const position =
            await getCurrentGPS();

        const lat =
            Number(position.lat);

        const lng =
            Number(position.lng);

        latEl.value =
            lat.toFixed(6);

        lngEl.value =
            lng.toFixed(6);

        map.setView(
            [lat,lng],
            17
        );

        setReportPreview(
            lat,
            lng
        );

    }
    catch(err){

        alert(
            "현재 위치를 가져오지 못했습니다.\nGPS 권한을 확인하세요."
        );

    }
    finally{

        button.disabled = false;

    }

}

document
.getElementById("currentReportLocationBtn")
.addEventListener(
    "click",
    useCurrentLocationForReport
);


/* =====================================================
   PREVIEW
===================================================== */

function setReportPreview(lat,lng){

    if(reportPreviewMarker){
        map.removeLayer(reportPreviewMarker);
    }

    reportPreviewMarker =
        L.marker([lat,lng])
        .addTo(map)
        .bindPopup("📍 신고 위치")
        .openPopup();
}


/* =====================================================
   KAKAO
===================================================== */

let addressSearchTimer = null;

function searchAddress(){

    const address =
        addressEl.value.trim();

    if(!address){

        latEl.value="";
        lngEl.value="";

        return;
    }

    if(
        typeof kakao === "undefined" ||
        !kakao.maps ||
        !kakao.maps.services
    ){

        return;
    }

    const geocoder =
        new kakao.maps.services.Geocoder();

    geocoder.addressSearch(
        address,
        function(result,status){

            if(
                status ===
                kakao.maps.services.Status.OK
            ){

                const lat =
                    parseFloat(result[0].y);

                const lng =
                    parseFloat(result[0].x);

                latEl.value =
                    lat.toFixed(6);

                lngEl.value =
                    lng.toFixed(6);

                map.setView(
                    [lat,lng],
                    17
                );

                setReportPreview(
                    lat,
                    lng
                );

            }

        }
    );
}

addressEl.addEventListener(
    "input",
    function(){

        clearTimeout(
            addressSearchTimer
        );

        latEl.value="";
        lngEl.value="";

        if(
            addressEl.value.trim().length < 2
        ){
            return;
        }

        addressSearchTimer =
            setTimeout(
                searchAddress,
                500
            );

    }
);


/* =====================================================
   TYPE
===================================================== */

document
.querySelectorAll(".type-btn")
.forEach(function(btn){

    btn.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".type-btn")
            .forEach(function(b){
                b.classList.remove("active");
            });

            btn.classList.add("active");

            selectedType =
                btn.dataset.type;

        }
    );

});


/* =====================================================
   SUBMIT
===================================================== */


async function submitData(){

    const condition =
        conditionEl.value.trim();

    const phone =
        phoneEl.value.trim();

    const address =
        addressEl.value.trim();

    const lat =
        Number(latEl.value);

    const lng =
        Number(lngEl.value);


    if(!selectedType){
        alert("신고 유형을 선택하세요.");
        return;
    }

    if(!condition){
        alert("상황 입력 필수");
        return;
    }

    if(!phone){
        alert("연락처 입력 필수");
        return;
    }

    if(!address){
        alert("주소 입력 필수");
        return;
    }

    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        alert(
            "주소 좌표를 확인하세요."
        );

        return;
    }

    if(!/^[0-9\-]{9,13}$/.test(phone)){

        alert(
            "연락처 형식 오류"
        );

        return;
    }


    const button =
        document.getElementById(
            "submitReportBtn"
        );

    button.disabled = true;


    try{

        const payload = {

            action:"create",

            type:selectedType,

            symptom:condition,

            phone:phone,

            address:address,

            lat:lat,

            lng:lng,

            kakaoMapURL:
                "https://map.kakao.com/link/map/" +
                lat + "," + lng,

            createdAt:getNowTime(),

            status:"RECEIVED"

        };


        const result =
            await postAccident(
                payload
            );


        /*
         * Apps Script는
         *
         * result:"success"
         *
         * 를 반환하므로
         * success:true가 아니라
         * result를 확인해야 합니다.
         */

        if(
            !result ||
            result.result !== "success"
        ){

            throw new Error(
                result && result.message
                ? result.message
                : "신고 접수 실패"
            );

        }


        alert(
            "🆘 신고가 접수되었습니다."
        );


        resetReportForm();

        await loadAccidents();

    }
    catch(err){

        console.error(err);

        alert(
            "신고 접수 실패\n\n" +
            err.message
        );

    }
    finally{

        button.disabled = false;

    }

}


document
.getElementById("submitReportBtn")
.addEventListener(
    "click",
    submitData
);




/* =====================================================
   POST API
===================================================== */

async function postAccident(payload){

    const response =
        await fetch(
            ACCIDENT_API_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },
                body:
                    JSON.stringify(payload)
            }
        );

    const text =
        await response.text();

    let data;

    try{
        data = JSON.parse(text);
    }
    catch(e){
        data = {
            success:false,
            message:text
        };
    }

    if(!response.ok){

        throw new Error(
            data.message ||
            "HTTP " + response.status
        );

    }

    return data;
}


/* =====================================================
   RESET
===================================================== */

function resetReportForm(){

    conditionEl.value="";
    phoneEl.value="";
    addressEl.value="";
    latEl.value="";
    lngEl.value="";

    selectedType="";

    document
    .querySelectorAll(".type-btn")
    .forEach(function(btn){
        btn.classList.remove("active");
    });

    if(reportPreviewMarker){

        map.removeLayer(
            reportPreviewMarker
        );

        reportPreviewMarker=null;

    }

}


/* =====================================================
   FIELD
===================================================== */

function getAccidentField(item,names){

    for(const name of names){

        if(
            item[name] !== undefined &&
            item[name] !== null &&
            String(item[name]).trim() !== ""
        ){

            return item[name];

        }

    }

    return "";
}


/* =====================================================
   ID
===================================================== */

function getAccidentId(item,index){

    const value =
        getAccidentField(
            item,
            [
                "id",
                "ID",
                "caseId",
                "caseID",
                "사고ID"
            ]
        );

    if(value !== ""){
        return String(value);
    }

    return (
        String(
            getAccidentField(
                item,
                [
                    "createdAt",
                    "timestamp"
                ]
            )
        ) +
        "_" +
        String(index)
    );

}


/* =====================================================
   START
===================================================== */

function getAccidentStartTime(item){

    return getAccidentField(
        item,
        [
            "startTime",
            "createdAt",
            "timestamp",
            "time",
            "date",
            "접수시간"
        ]
    );
}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(value){

    const status =
        String(value || "")
        .trim()
        .toUpperCase();

    if(
        status === "DONE" ||
        status === "완료" ||
        status === "처리완료" ||
        status === "사고처리완료"
    ){
        return "DONE";
    }

    if(
        status === "ARRIVED" ||
        status === "도착" ||
        status === "현장도착"
    ){
        return "ARRIVED";
    }

    return "RECEIVED";
}


/* =====================================================
   ELAPSED
===================================================== */

function getElapsedTime(startTime,endTime=null){

    if(!startTime){
        return "-";
    }

    const start =
        new Date(startTime);

    if(Number.isNaN(start.getTime())){
        return "-";
    }

    const end =
        endTime
        ? new Date(endTime)
        : new Date();

    if(Number.isNaN(end.getTime())){
        return "-";
    }

    let diff =
        Math.floor(
            (end-start)/1000
        );

    if(diff<0){
        diff=0;
    }

    const hour =
        Math.floor(diff/3600);

    diff%=3600;

    const minute =
        Math.floor(diff/60);

    const second =
        diff%60;

    return (
        String(hour).padStart(2,"0") +
        ":" +
        String(minute).padStart(2,"0") +
        ":" +
        String(second).padStart(2,"0")
    );
}


/* =====================================================
   LOAD
===================================================== */

async function loadAccidents(){

    if(accidentLoading){
        return;
    }

    accidentLoading=true;

    try{

        const response =
            await fetch(
                ACCIDENT_API_URL +
                "?action=list&t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        let rows = [];

        if(Array.isArray(data)){
            rows=data;
        }
        else if(
            data &&
            Array.isArray(data.data)
        ){
            rows=data.data;
        }
        else if(
            data &&
            Array.isArray(data.items)
        ){
            rows=data.items;
        }
        else if(
            data &&
            Array.isArray(data.rows)
        ){
            rows=data.rows;
        }

        renderAccidents(rows);

    }
    catch(err){

        console.error(
            "사고 목록 조회 오류:",
            err
        );

        if(firstLoad){

            caseList.innerHTML =
                `
                <div class="case-card">
                    ⚠ 사고 목록을 불러오지 못했습니다.
                    <br><br>
                    ${escapeHTML(err.message)}
                </div>
                `;

        }

    }
    finally{

        accidentLoading=false;

    }

}

===================================================== */

        [...data].sort(
            function(a,b){

                const ta =
                    new Date(
                        getAccidentStartTime(a)
                    ).getTime();

                const tb =
                    new Date(
                        getAccidentStartTime(b)
                    ).getTime();

                if(Number.isNaN(ta)) return 1;
                if(Number.isNaN(tb)) return -1;

                return tb-ta;

    let html="";

                        "doneAt",

                        ]

                    [
                        "address",
                        "주소",
                        "location",
                        "장소"
                    ]
                );

            const type =
                getAccidentField(
                    item,
                    [
                        "type",
                        "accidentType",
                        "신고유형",
                        "유형"
                    ]

            const symptom =
                getAccidentField(
                    item,
                    [
                        "symptom",
                        "condition",
                        "description",
                        "상황",
                        "내용"
                    ]
                );

            const phone =
                getAccidentField(
                    item,
                    [
                        "phone",
                        "tel",
                        "telephone",
                        "연락처"
                    ]

                        "kakaoUrl",

                            ?

                                href="tel:${escapeAttribute(phone)}"

                        }

            if(

            ){

            }

            knownIds.add(id);

    caseList.innerHTML =

/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function escapeAttribute(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

function escapeJS(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\r/g,"\\r")
        .replace(/\n/g,"\\n");
}


/* =====================================================
   FOCUS
===================================================== */

function focusAccident(lat,lng){

    lat=Number(lat);
    lng=Number(lng);

    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){
        return;
    }

    map.setView(
        [lat,lng],
        17
    );

    L.popup()
    .setLatLng([lat,lng])
    .setContent("🆘 사고 신고 위치")
    .openOn(map);
}

async function updateAccident(caseId){

    const lat =
        Number(latEl.value);

    const lng =
        Number(lngEl.value);


    if(
        !caseId ||
        !selectedType ||
        !conditionEl.value.trim() ||
        !phoneEl.value.trim() ||
        !addressEl.value.trim() ||
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        alert(
            "수정할 신고 정보를 모두 확인하세요."
        );

        return;

    }


    try{

        const result =
            await postAccident({

                action:"update",

                id:String(caseId),

                type:selectedType,

                symptom:
                    conditionEl.value.trim(),

                phone:
                    phoneEl.value.trim(),

                address:
                    addressEl.value.trim(),

                lat:lat,

                lng:lng,

                kakaoMapURL:
                    "https://map.kakao.com/link/map/" +
                    lat + "," + lng

            });


        /*
         * Apps Script 응답 형식에 맞춤
         */

        if(
            !result ||
            result.result !== "success"
        ){

            throw new Error(
                result &&
                result.message
                ?
                result.message
                :
                "수정 실패"
            );

        }


        alert(
            "✏ 신고 내용이 수정되었습니다."
        );


        resetReportForm();

        await loadAccidents();

    }
    catch(err){

        console.error(err);

        alert(
            "신고 수정 실패\n\n" +
            err.message
        );

    }

}

         */

        const result =
            await postAccident({

                action:"delete",

                id:String(caseId),

                password:password

            });


        console.log(
            "삭제 결과:",
            result
        );


        /*
         * Apps Script 응답:
         *
         * {
         *   result:"success"
         * }
         */

        if(
            !result ||
            result.result !== "success"
        ){

            throw new Error(
                result &&
                result.message
                ?
                result.message
                :
                "삭제 실패"
            );

        }


        alert(
            "🗑 신고가 삭제되었습니다."

        /*

         */

        await loadAccidents();

            err
        );


        alert(
            "❌ 신고 삭제 실패\n\n" +
            err.message
        );


        await loadAccidents();

    }

}

async function updateAccidentStatus(
    caseId,
    newStatus
){

    const status =
        normalizeStatus(newStatus);


    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    let message =
        "처리하시겠습니까?";

    let action = "";


    if(status === "ARRIVED"){

        message =
            "🚓 현장 도착으로 변경하시겠습니까?";

        action = "complete";

    }


    if(status === "DONE"){

        message =
            "✅ 구조 완료로 변경하시겠습니까?";

        action = "finish";

    }


    if(!action){
        return;
    }


    if(!confirm(message)){
        return;
    }


    try{

        const result =
            await postAccident({

                action:action,

                id:String(caseId)

            });


        /*
         * Apps Script 응답:
         *
         * result:"success"
         */

        if(
            !result ||
            result.result !== "success"
        ){

            throw new Error(
                result &&
                result.message
                ?
                result.message
                :
                "상태 변경 실패"
            );

        }


        alert(
            status === "ARRIVED"
            ?
            "🚓 현장 도착 처리 완료"
            :
            "✅ 구조 완료 처리 완료"
        );


        await loadAccidents();

    }
    catch(err){

        console.error(err);

        alert(
            "상태 변경 실패\n\n" +
            err.message
        );

    }

}


/* =====================================================
   AUTO REFRESH
===================================================== */

function startAccidentAutoRefresh(){

    if(accidentTimer){
        clearInterval(accidentTimer);
    }

    loadAccidents();

    accidentTimer =
        setInterval(
            loadAccidents,
            5000
        );
}


/* =====================================================
   INIT
===================================================== */

window.addEventListener(
    "load",
    function(){

        loadAccidents();

        startAccidentAutoRefresh();

        setTimeout(
            function(){
                map.invalidateSize();
            },
            500
        );

    }
);

document.addEventListener(
    "visibilitychange",
    function(){

        if(!document.hidden){
            loadAccidents();
        }

    }
);

window.addEventListener(
    "resize",
    function(){

        setTimeout(
            function(){
                map.invalidateSize();
            },
            100
        );

    }
);

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase()==="r"
        ){

            e.preventDefault();

            loadAccidents();

        }

    }
);


/* =====================================================
   우클릭 / 단축키
===================================================== */

document.addEventListener(
    "contextmenu",
    function(e){
        e.preventDefault();
    }
);

document.addEventListener(
    "keydown",
    function(e){

        if(e.key==="F12"){
            e.preventDefault();
        }

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==="u"
        ){
            e.preventDefault();
        }

        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase()==="i"
        ){
            e.preventDefault();
        }

        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase()==="j"
        ){
            e.preventDefault();
        }

        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase()==="c"
        ){
            e.preventDefault();
        }

        if(
            e.ctrlKey &&
            e.key.toLowerCase()==="s"
        ){
            e.preventDefault();
        }

    }
);

</script>

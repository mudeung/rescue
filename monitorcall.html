<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body { margin:0; font-family:Arial; background:#111; color:#fff; }
header { background:#b71c1c; padding:15px; text-align:center; font-size:20px; }
.container { padding:15px; }
.form-box { background:#222; padding:12px; margin-bottom:15px; border-radius:6px; }
input, textarea { width:100%; padding:8px; margin-bottom:8px; border-radius:4px; border:none; }
button { width:100%; padding:10px; background:#e53935; color:#fff; border:none; border-radius:4px; font-size:16px; cursor:pointer; }
#map { width:100%; height:300px; margin-bottom:15px; border-radius:6px; }
.card { background:#1e1e1e; padding:12px; margin-bottom:10px; border-radius:6px; }
.done { opacity:0.5; }
.time { color:#ffcc00; font-size:14px; }
.phone { color:#4fc3f7; }
.maplink { color:#81c784; text-decoration:none; }
.coord { color:#90caf9; cursor:pointer; }
</style>
</head>

<body>
<header>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</header>

<div class="container">
<div id="map"></div>

<div class="form-box">
<h3>📌 구조 요청 등록</h3>
<textarea id="condition" placeholder="증상 입력"></textarea>
<input type="text" id="phone" placeholder="연락처 입력">
<input type="number" step="any" id="lat" placeholder="위도 직접 입력 (선택)">
<input type="number" step="any" id="lng" placeholder="경도 직접 입력 (선택)">
<button onclick="submitData()">구조 요청 등록</button>
</div>

<div id="listArea">로딩중...</div>
</div>

<script>

const API_URL = "여기에_exec_URL_사용";

let map;
let marker;

function initMap() {
  map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(35.1345, 126.9902),
    level: 5
  });

  marker = new kakao.maps.Marker({ position: map.getCenter() });
  marker.setMap(map);
}

function moveMap(lat, lng) {
  const pos = new kakao.maps.LatLng(lat, lng);
  map.setCenter(pos);
  marker.setPosition(pos);
}

function submitData() {

  const condition = document.getElementById("condition").value;
  const phone = document.getElementById("phone").value;
  let lat = document.getElementById("lat").value;
  let lng = document.getElementById("lng").value;

  if (!condition) return alert("증상 입력");

  if (lat && lng) {
    sendData(parseFloat(lat), parseFloat(lng), condition, phone);
    return;
  }

  navigator.geolocation.getCurrentPosition(pos => {
    sendData(pos.coords.latitude, pos.coords.longitude, condition, phone);
  }, () => alert("위치 가져오기 실패"));
}

async function sendData(lat, lng, condition, phone) {

  const payload = {
    kakaoMapURL: `https://map.kakao.com/link/map/구조위치,${lat},${lng}`,
    lat, lng, condition, phone
  };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });

    const result = await res.json();

    if (result.result === "success") {
      alert("등록 완료");
      moveMap(lat, lng);
      loadData();
    } else {
      alert("전송 실패");
    }

  } catch {
    alert("네트워크 오류");
  }
}

/********************************
 * 🔥 수정된 조치완료 (GET 방식)
 ********************************/
async function markComplete(id) {

  if (!confirm("조치완료 처리하시겠습니까?")) return;

  try {
    const res = await fetch(API_URL + "?action=complete&id=" + id);
    const result = await res.json();

    if (result.result === "success") {
      loadData();
    } else {
      alert("처리 실패");
    }

  } catch {
    alert("네트워크 오류");
  }
}

async function loadData() {

  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    const area = document.getElementById("listArea");

    if (!data.length) {
      area.innerHTML = "현재 접수 없음";
      return;
    }

    area.innerHTML = "";

    data.reverse().forEach(item => {

      const isDone = item.status === "조치완료";

      const div = document.createElement("div");
      div.className = "card";
      if (isDone) div.classList.add("done");

      div.innerHTML = `
        <div class="time">🕒 ${new Date(item.time).toLocaleString()}</div>
        <div class="coord" onclick="moveMap(${item.lat}, ${item.lng})">
          📍 ${item.lat}, ${item.lng}
        </div>
        🩺 ${item.condition || "-"}<br>
        📞 ${item.phone || "-"}<br>
        <a class="maplink" href="${item.mapURL}" target="_blank">지도보기</a>
        <br><br>
        <button onclick="markComplete('${item.id}')"
        style="background:${isDone ? '#444' : '#2e7d32'}">
        ${isDone ? '조치완료됨' : '조치완료'}
        </button>
      `;

      area.appendChild(div);
    });

  } catch (err) {
    console.error(err);
  }
}

initMap();
loadData();
setInterval(loadData, 10000);

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body { margin:0; font-family:Arial; background:#111; color:#fff; }
header { background:#b71c1c; padding:15px; text-align:center; font-size:20px; }
.container { padding:15px; }

#map { width:100%; height:300px; margin-bottom:15px; border-radius:6px; }

input {
  width:100%;
  padding:8px;
  margin-bottom:6px;
  border-radius:4px;
  border:none;
}

button {
  padding:8px 12px;
  background:#e53935;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
}

.card {
  background:#1e1e1e;
  padding:12px;
  margin-bottom:10px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</header>

<div class="container">

<div id="map"></div>

<h3>📍 위치 입력 테스트</h3>
<input type="text" id="address" placeholder="주소 입력">
<input type="text" id="lat" placeholder="위도">
<input type="text" id="lng" placeholder="경도">
<button onclick="searchAddress()">주소 → 좌표 변환</button>
<button onclick="searchCoord()">좌표 → 주소 변환</button>

<hr>

<div id="listArea">로딩중...</div>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbybwt7-vC5W8NUmve94LLsdlIRFHoiw3wcIrWk9GZFRHnmZJ_0TEsihhz7oX8al_BYR_A/exec";

let map;
let geocoder;
let currentLat=null;
let currentLng=null;

/******** 지도 초기화 ********/
function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });

  geocoder=new kakao.maps.services.Geocoder();

  // 현재 위치 가져오기
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      currentLat=pos.coords.latitude;
      currentLng=pos.coords.longitude;
    });
  }
}

/******** 주소 → 좌표 ********/
function searchAddress(){
  const addr=document.getElementById("address").value;
  geocoder.addressSearch(addr,function(result,status){
    if(status===kakao.maps.services.Status.OK){
      const lat=result[0].y;
      const lng=result[0].x;

      document.getElementById("lat").value=lat;
      document.getElementById("lng").value=lng;

      moveMap(lat,lng);
    } else {
      alert("주소 검색 실패");
    }
  });
}

/******** 좌표 → 주소 ********/
function searchCoord(){
  const lat=document.getElementById("lat").value;
  const lng=document.getElementById("lng").value;

  geocoder.coord2Address(lng,lat,function(result,status){
    if(status===kakao.maps.services.Status.OK){
      document.getElementById("address").value=result[0].address.address_name;
      moveMap(lat,lng);
    } else {
      alert("좌표 변환 실패");
    }
  });
}

/******** 지도 이동 ********/
function moveMap(lat,lng){
  const loc=new kakao.maps.LatLng(lat,lng);
  map.setLevel(3);
  map.setCenter(loc);

  new kakao.maps.Marker({
    map:map,
    position:loc
  });
}

/******** 자동 길찾기 실행 ********/
function startNavigation(destLat,destLng){
  if(!currentLat || !currentLng){
    alert("현재 위치를 가져올 수 없습니다.");
    return;
  }

  const url=`https://map.kakao.com/link/from/내위치,${currentLat},${currentLng}/to/구조위치,${destLat},${destLng}`;
  window.open(url,"_blank");
}

/******** 신고 목록 ********/
async function loadData(){
  try{
    const res=await fetch(API_URL);
    const data=await res.json();
    const area=document.getElementById("listArea");
    area.innerHTML="";

    data.forEach(item=>{

      if(item.status==="조치완료") return;

      const div=document.createElement("div");
      div.className="card";

      div.innerHTML=`
        🕒 ${new Date(item.time).toLocaleString()}<br>
        🏠 ${item.address}<br>
        📞 ${item.phone}<br>
        📝 ${item.symptom}
      `;

      div.addEventListener("click",function(){
        startNavigation(item.lat,item.lng);
      });

      area.appendChild(div);
    });

  }catch{
    document.getElementById("listArea").innerHTML="데이터 불러오기 실패";
  }
}

initMap();
loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>구조 요청 현황판</title>

<style>
body {
  font-family: Arial;
  background:#f4f6f8;
  margin:20px;
}

h2 {
  margin-bottom:20px;
}

.card {
  background:#fff;
  padding:15px;
  margin-bottom:15px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.done {
  background:#e0e0e0;
  opacity:0.7;
}

.complete-btn {
  background:#2e7d32;
  color:#fff;
  border:none;
  border-radius:4px;
  padding:8px 12px;
  cursor:pointer;
  font-size:14px;
}

.complete-btn:hover {
  background:#1b5e20;
}

.refresh-btn {
  background:#1976d2;
  color:#fff;
  border:none;
  padding:8px 12px;
  border-radius:4px;
  cursor:pointer;
  margin-bottom:15px;
}
</style>
</head>

<body>

<h2>🚑 구조 요청 현황판</h2>
<button class="refresh-btn" onclick="loadData()">새로고침</button>

<div id="list"></div>

<script>
const BASE_URL = "YOUR_DEPLOY_URL"; // 🔥 본인 URL로 교체

function loadData() {
  fetch(BASE_URL)
    .then(res => res.json())
    .then(data => {

      const list = document.getElementById("list");
      list.innerHTML = "";

      if (!data || data.length === 0) {
        list.innerHTML = "<p>접수된 요청이 없습니다.</p>";
        return;
      }

      data.reverse().forEach(item => {

        const card = document.createElement("div");
        card.className = "card";

        if (item.status === "조치완료") {
          card.classList.add("done");
        }

        card.innerHTML = `
          <strong>📍 주소:</strong> ${item.address || ""}<br>
          <strong>📝 증상:</strong> ${item.symptom || ""}<br>
          <strong>📞 연락처:</strong> ${item.phone || ""}<br>
          <strong>⏰ 접수시간:</strong> ${formatDate(item.time)}<br>
          ${item.completedTime ? 
            `<strong>✅ 완료시간:</strong> ${formatDate(item.completedTime)}<br>` 
            : ""}
          <strong>📌 상태:</strong> ${item.status}<br><br>
          ${
            item.status !== "조치완료"
            ? `<button class="complete-btn"
                onclick="completeCase('${item.id}')">
                조치완료
               </button>`
            : ""
          }
        `;

        list.appendChild(card);
      });
    });
}

function completeCase(id) {

  fetch(`${BASE_URL}?action=complete&id=${id}`)
    .then(res => res.json())
    .then(result => {
      if (result.result === "success") {
        alert("조치완료 처리되었습니다.");
        loadData();
      } else {
        alert("처리 실패: " + result.message);
      }
    });
}

function formatDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  return d.toLocaleString();
}

loadData();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body { margin:0; font-family:Arial; background:#111; color:#fff; }
header { background:#b71c1c; padding:15px; text-align:center; font-size:20px; }
.container { padding:15px; }

button {
  padding:8px 12px;
  background:#e53935;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
}

#map {
  width:100%;
  height:350px;
  margin-bottom:15px;
  border-radius:6px;
}

.card {
  background:#1e1e1e;
  padding:12px;
  margin-bottom:10px;
  border-radius:6px;
  transition:0.2s;
}

.card.done { background:#2b2b2b; opacity:0.6; }

.card.active {
  border:2px solid #ffeb3b;
  box-shadow:0 0 10px #ffeb3b;
}

.progress-label {
  margin-top:6px;
  color:#ffeb3b;
  font-weight:bold;
}

.filter-box { margin-bottom:10px; }
</style>
</head>

<body>

<header>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</header>

<div class="container">

<div id="map"></div>

<div class="filter-box">
  <button onclick="toggleFilter()">🔎 접수중만 보기</button>
</div>

<div id="listArea">로딩중...</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbybwt7-vC5W8NUmve94LLsdlIRFHoiw3wcIrWk9GZFRHnmZJ_0TEsihhz7oX8al_BYR_A/exec";

let map;
let allMarkers = [];
let activeMarker = null;
let infoWindow = null;
let filterActive = false;
let activeLat = null;
let activeLng = null;

/**************** 지도 초기화 ****************/
function initMap() {
  map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(35.1345, 126.9902),
    level: 6
  });

  // 🔥 지도 클릭 시 길찾기 실행
  kakao.maps.event.addListener(map, 'click', function() {
    if(activeLat && activeLng){
      openKakaoNavigation(activeLat, activeLng);
    }
  });
}

/**************** 카카오 길찾기 실행 ****************/
function openKakaoNavigation(lat, lng){
  const url = `https://map.kakao.com/link/to/구조위치,${lat},${lng}`;
  window.open(url, "_blank");
}

/**************** 빨간 구조 아이콘 ****************/
function getRescueIcon() {
  return new kakao.maps.MarkerImage(
    "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png",
    new kakao.maps.Size(40, 42)
  );
}

/**************** 전체 마커 표시 ****************/
function showAllMarkers(data) {

  allMarkers.forEach(m => m.setMap(null));
  allMarkers = [];

  data.forEach(item => {

    if (!item.lat || !item.lng) return;
    if (filterActive && item.status === "조치완료") return;

    const marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(item.lat, item.lng)
    });

    marker.setMap(map);
    allMarkers.push(marker);
  });
}

/**************** 진행중 마커 표시 ****************/
function showActiveMarker(lat, lng) {

  activeLat = lat;
  activeLng = lng;

  if (activeMarker) activeMarker.setMap(null);
  if (infoWindow) infoWindow.close();

  activeMarker = new kakao.maps.Marker({
    position: new kakao.maps.LatLng(lat, lng),
    image: getRescueIcon()
  });

  activeMarker.setMap(map);

  infoWindow = new kakao.maps.InfoWindow({
    content:`
      <div style="padding:8px;font-weight:bold;color:red;">
        🚨 진행중 구조위치<br><br>
        👉 지도 클릭하면 길찾기 실행
      </div>`
  });

  infoWindow.open(map, activeMarker);

  // 🔥 마커 클릭해도 길찾기 실행
  kakao.maps.event.addListener(activeMarker, 'click', function(){
    openKakaoNavigation(lat, lng);
  });

  map.setLevel(3);
  map.setCenter(new kakao.maps.LatLng(lat, lng));
}

/**************** 필터 ****************/
function toggleFilter() {
  filterActive = !filterActive;
  loadData();
}

/**************** 목록 + 마커 동기화 ****************/
async function loadData() {

  try {
    const res = await fetch(API_URL);
    let data = await res.json();
    const area = document.getElementById("listArea");

    if (!data.length) {
      area.innerHTML = "현재 접수된 신고가 없습니다.";
      return;
    }

    area.innerHTML = "";

    data.sort((a,b)=>{
      if(a.status==="조치완료" && b.status!=="조치완료") return 1;
      if(a.status!=="조치완료" && b.status==="조치완료") return -1;
      return new Date(b.time)-new Date(a.time);
    });

    showAllMarkers(data);

    data.forEach(item => {

      if (filterActive && item.status === "조치완료") return;

      const div = document.createElement("div");
      div.className = "card";

      if (item.status === "조치완료") {
        div.classList.add("done");
        div.style.cursor="default";
      } else {
        div.style.cursor="pointer";
      }

      div.innerHTML = `
        🕒 ${new Date(item.time).toLocaleString()}<br>
        🏠 ${item.address || "주소없음"}<br>
        📞 ${item.phone || "번호없음"}<br>
        📝 ${item.symptom || "내용없음"}
      `;

      div.addEventListener("click", function(){

        if(item.status==="조치완료") return;

        document.querySelectorAll(".card").forEach(c=>{
          c.classList.remove("active");
          const l=c.querySelector(".progress-label");
          if(l) l.remove();
        });

        div.classList.add("active");

        const label=document.createElement("div");
        label.className="progress-label";
        label.innerText="🚑 진행중";
        div.appendChild(label);

        showActiveMarker(item.lat,item.lng);

      });

      area.appendChild(div);
    });

  } catch {
    document.getElementById("listArea").innerHTML="데이터 불러오기 실패";
  }
}

initMap();
loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

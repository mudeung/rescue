<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body { margin:0; font-family:Arial; background:#111; color:#fff; }
header { background:#b71c1c; padding:15px; text-align:center; font-size:20px; }
.container { padding:15px; }

#map { width:100%; height:380px; margin-bottom:15px; border-radius:6px; }

.card {
  background:#1e1e1e;
  padding:12px;
  margin-bottom:10px;
  border-radius:6px;
  transition:0.2s;
}

.card.active {
  border:2px solid #ffeb3b;
  box-shadow:0 0 10px #ffeb3b;
}

.progress-label {
  margin-top:6px;
  color:#ffeb3b;
  font-weight:bold;
}
</style>
</head>

<body>

<header>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</header>

<div class="container">
<div id="map"></div>
<div id="listArea">로딩중...</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbybwt7-vC5W8NUmve94LLsdlIRFHoiw3wcIrWk9GZFRHnmZJ_0TEsihhz7oX8al_BYR_A/exec";

let map;
let activeMarker=null;
let infoWindow=null;
let polyline=null;
let currentPosition=null;

/******** 지도 초기화 ********/
function initMap(){
  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      currentPosition=new kakao.maps.LatLng(
        pos.coords.latitude,
        pos.coords.longitude
      );
    });
  }
}

/******** 거리 계산 (Haversine) ********/
function calculateDistance(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=
    Math.sin(dLat/2)*Math.sin(dLat/2)+
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
    Math.sin(dLng/2)*Math.sin(dLng/2);
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}

/******** 진행중 표시 + 거리 ********/
function showActive(lat,lng){

  const target=new kakao.maps.LatLng(lat,lng);

  if(activeMarker) activeMarker.setMap(null);
  if(infoWindow) infoWindow.close();
  if(polyline) polyline.setMap(null);

  activeMarker=new kakao.maps.Marker({
    position:target,
    image:new kakao.maps.MarkerImage(
      "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png",
      new kakao.maps.Size(40,42)
    )
  });

  activeMarker.setMap(map);

  let distanceText="거리 계산 불가";

  if(currentPosition){
    const dist=calculateDistance(
      currentPosition.getLat(),
      currentPosition.getLng(),
      lat,lng
    );

    const walkTime=Math.round((dist/4)*60);
    const carTime=Math.round((dist/40)*60);

    distanceText=`
      📏 거리: ${dist.toFixed(2)} km<br>
      🚶 도보 약 ${walkTime}분<br>
      🚗 차량 약 ${carTime}분
    `;

    polyline=new kakao.maps.Polyline({
      path:[currentPosition,target],
      strokeWeight:4,
      strokeColor:"#ff0000",
      strokeOpacity:0.7
    });

    polyline.setMap(map);
  }

  infoWindow=new kakao.maps.InfoWindow({
    content:`
      <div style="padding:10px;font-size:13px;color:#000;">
        🚨 진행중 구조위치<br><br>
        ${distanceText}
      </div>
    `
  });

  infoWindow.open(map,activeMarker);

  map.setLevel(4);
  map.setCenter(target);
}

/******** 목록 ********/
async function loadData(){

  try{
    const res=await fetch(API_URL);
    const data=await res.json();
    const area=document.getElementById("listArea");
    area.innerHTML="";

    data.forEach(item=>{

      if(item.status==="조치완료") return;

      const div=document.createElement("div");
      div.className="card";
      div.style.cursor="pointer";

      div.innerHTML=`
        🕒 ${new Date(item.time).toLocaleString()}<br>
        🏠 ${item.address || "주소없음"}<br>
        📝 ${item.symptom || "내용없음"}
      `;

      div.addEventListener("click",function(){

        document.querySelectorAll(".card").forEach(c=>{
          c.classList.remove("active");
          const l=c.querySelector(".progress-label");
          if(l) l.remove();
        });

        div.classList.add("active");

        const label=document.createElement("div");
        label.className="progress-label";
        label.innerText="🚑 진행중";
        div.appendChild(label);

        showActive(parseFloat(item.lat),parseFloat(item.lng));
      });

      area.appendChild(div);
    });

  }catch{
    document.getElementById("listArea").innerHTML="데이터 불러오기 실패";
  }
}

initMap();
loadData();
setInterval(loadData,10000);
</script>

</body>
</html>

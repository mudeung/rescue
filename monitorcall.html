<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;}
header{background:#b71c1c;padding:15px;text-align:center;font-size:20px;}
.container{padding:15px;}
.form-box{background:#222;padding:12px;margin-bottom:15px;border-radius:6px;}
input,textarea{width:100%;padding:8px;margin-bottom:8px;border-radius:4px;border:none;}
button{padding:8px 12px;background:#e53935;color:#fff;border:none;border-radius:4px;cursor:pointer;}
#map{width:100%;height:320px;margin-bottom:15px;border-radius:6px;}
.card{background:#1e1e1e;padding:12px;margin-bottom:10px;border-radius:6px;}
.time{color:#ffcc00;font-size:14px;}
.coord{font-size:12px;color:#aaa;}
.maplink{color:#4fc3f7;font-size:12px;}
</style>
</head>

<body>

<header>🚨 무등산 특수구조팀 실시간 위치구조 신고공유</header>

<div class="container">

<div id="map"></div>

<div class="form-box">
  <h3>📌 위치구조 신고요청 등록</h3>
  <textarea id="condition" placeholder="증상 입력"></textarea>
  <input type="text" id="phone" placeholder="연락처 입력">
  <input type="text" id="address" placeholder="신고 주소 입력 (주소 입력 시 좌표 자동 입력)">
  <input type="number" step="any" id="lat" placeholder="위도">
  <input type="number" step="any" id="lng" placeholder="경도">
  <button onclick="submitData()">구조 요청 등록</button>
</div>

<div id="listArea">로딩중...</div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbybwt7-vC5W8NUmve94LLsdlIRFHoiw3wcIrWk9GZFRHnmZJ_0TEsihhz7oX8al_BYR_A/exec";

let map, geocoder;
let previewMarker=null;

/******** 지도 초기화 ********/
function initMap(){

  map=new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(35.1345,126.9902),
    level:6
  });

  geocoder=new kakao.maps.services.Geocoder();
}

/******** 주소 → 좌표 자동입력 ********/
document.getElementById("address").addEventListener("change", function(){

  const address=this.value.trim();
  if(!address) return;

  geocoder.addressSearch(address,function(result,status){

    if(status===kakao.maps.services.Status.OK){

      const lat=parseFloat(result[0].y);
      const lng=parseFloat(result[0].x);

      document.getElementById("lat").value=lat;
      document.getElementById("lng").value=lng;

      const moveLatLon=new kakao.maps.LatLng(lat,lng);
      map.setCenter(moveLatLon);
      map.setLevel(3);

      if(previewMarker) previewMarker.setMap(null);

      previewMarker=new kakao.maps.Marker({
        map:map,
        position:moveLatLon
      });

    }else{
      alert("주소를 찾을 수 없습니다.");
    }

  });

});

/******** 등록 ********/
async function submitData(){

  const condition=document.getElementById("condition").value;
  const phone=document.getElementById("phone").value;
  const address=document.getElementById("address").value;
  let lat=document.getElementById("lat").value;
  let lng=document.getElementById("lng").value;

  if(!condition){
    alert("증상 입력 필수");
    return;
  }

  if(lat && lng){
    sendData(parseFloat(lat),parseFloat(lng),condition,phone,address);
    return;
  }

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      sendData(pos.coords.latitude,pos.coords.longitude,condition,phone,address);
    });
  }
}

async function sendData(lat,lng,condition,phone,address){

  const kakaoMapURL=`https://map.kakao.com/link/map/구조위치,${lat},${lng}`;

  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body:JSON.stringify({kakaoMapURL,lat,lng,address,symptom:condition,phone})
  });

  document.getElementById("condition").value="";
  document.getElementById("phone").value="";
  document.getElementById("address").value="";
  document.getElementById("lat").value="";
  document.getElementById("lng").value="";

  if(previewMarker) previewMarker.setMap(null);

  loadData();
}

/******** 목록 로드 ********/
async function loadData(){

  const res=await fetch(API_URL);
  let data=await res.json();
  const area=document.getElementById("listArea");
  area.innerHTML="";

  if(!data.length){
    area.innerHTML="현재 접수된 신고가 없습니다.";
    return;
  }

  data.sort((a,b)=> new Date(b.time)-new Date(a.time));

  data.forEach(item=>{

    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <div class="time">🕒 접수: ${new Date(item.time).toLocaleString()}</div>
      🏠 ${item.address||"주소없음"}<br>
      📞 ${item.phone||"번호없음"}<br>
      📝 ${item.symptom||"내용없음"}<br>
      <div class="coord">위도: ${item.lat} / 경도: ${item.lng}</div>
      <a class="maplink" href="${item.kakaoMapURL}" target="_blank">지도보기</a>
    `;

    area.appendChild(div);
  });
}

initMap();
loadData();
setInterval(loadData,10000);

</script>

</body>
</html>

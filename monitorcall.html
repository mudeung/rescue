<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🚨 무등산 실시간 위치구조 등록현황</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#111; color:#fff; }
header { background:#b71c1c; padding:15px; text-align:center; font-size:20px; }
.container { padding:15px; }

.form-box {
  background:#222;
  padding:12px;
  margin-bottom:15px;
  border-radius:6px;
}

input, textarea {
  width:100%;
  padding:8px;
  margin-bottom:8px;
  border-radius:4px;
  border:none;
}

button {
  width:100%;
  padding:10px;
  background:#e53935;
  color:#fff;
  border:none;
  border-radius:4px;
  font-size:16px;
}

.card {
  background:#1e1e1e;
  padding:12px;
  margin-bottom:10px;
  border-radius:6px;
}

.time { color:#ffcc00; font-size:14px; }
.phone { color:#4fc3f7; }
.maplink { color:#81c784; text-decoration:none; }
.coord { color:#90caf9; }
</style>
</head>

<body>

<header>🚨 무등산 실시간 위치구조 등록현황</header>

<div class="container">

  <!-- 🔴 입력 영역 -->
  <div class="form-box">
    <h3>📌 구조 요청 등록</h3>

    <textarea id="condition" placeholder="증상 입력 (예: 발목 골절 의심)"></textarea>
    <input type="text" id="phone" placeholder="연락처 입력">

    <!-- 좌표 직접 입력 -->
    <input type="number" step="any" id="lat" placeholder="위도 직접 입력 (선택)">
    <input type="number" step="any" id="lng" placeholder="경도 직접 입력 (선택)">

    <button onclick="submitData()">구조 요청 등록</button>
  </div>

  <!-- 🔵 목록 영역 -->
  <div id="listArea">로딩중...</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbybwt7-vC5W8NUmve94LLsdlIRFHoiw3wcIrWk9GZFRHnmZJ_0TEsihhz7oX8al_BYR_A/exec";

/********************************
 * 구조 요청 등록
 ********************************/
function submitData() {

  const condition = document.getElementById("condition").value;
  const phone = document.getElementById("phone").value;
  let lat = document.getElementById("lat").value;
  let lng = document.getElementById("lng").value;

  if (!condition) {
    alert("증상을 입력하세요.");
    return;
  }

  // ✅ 좌표 직접 입력한 경우
  if (lat && lng) {
    sendData(parseFloat(lat), parseFloat(lng), condition, phone);
    return;
  }

  // ✅ 직접 입력 없으면 GPS 사용
  if (!navigator.geolocation) {
    alert("위치 정보를 사용할 수 없습니다.");
    return;
  }

  navigator.geolocation.getCurrentPosition(position => {
    sendData(
      position.coords.latitude,
      position.coords.longitude,
      condition,
      phone
    );
  }, () => {
    alert("위치 정보를 가져올 수 없습니다.");
  });
}

/********************************
 * 실제 전송 처리
 ********************************/
async function sendData(lat, lng, condition, phone) {

  const kakaoMapURL = `https://map.kakao.com/link/map/${lat},${lng}`;

  const payload = {
    kakaoMapURL,
    lat,
    lng,
    condition,
    phone
  };

  try {

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    alert("구조 요청이 등록되었습니다.");

    document.getElementById("condition").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("lat").value = "";
    document.getElementById("lng").value = "";

    loadData();

  } catch (err) {
    alert("전송 실패");
  }
}

/********************************
 * 목록 불러오기
 ********************************/
async function loadData() {
  try {

    const res = await fetch(API_URL);
    const data = await res.json();

    const area = document.getElementById("listArea");

    if (!data.length) {
      area.innerHTML = "현재 접수된 신고가 없습니다.";
      return;
    }

    area.innerHTML = "";

    data.reverse().forEach(item => {

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <div class="time">🕒 ${new Date(item.time).toLocaleString()}</div>
        <div class="coord">📍 위도: ${item.lat}</div>
        <div class="coord">📍 경도: ${item.lng}</div>
        🩺 증상: ${item.condition || "미입력"}<br>
        📞 <span class="phone">${item.phone || "번호없음"}</span><br>
        🗺 <a class="maplink" href="${item.mapURL}" target="_blank">지도보기</a>
      `;

      area.appendChild(div);
    });

  } catch (err) {
    document.getElementById("listArea").innerHTML =
      "데이터 불러오기 실패";
  }
}

loadData();
setInterval(loadData, 10000);

</script>

</body>
</html>

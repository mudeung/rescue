<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>구조대원 GPS 전송</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_APP_KEY"></script>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial;
  text-align:center;
}

#map{
  width:100%;
  height:350px;
}

.status{
  padding:15px;
  font-size:18px;
}

button{
  background:#d32f2f;
  color:#fff;
  border:none;
  padding:15px 20px;
  border-radius:8px;
  font-size:18px;
}
</style>
</head>

<body>

<h2>🚑 구조대원 위치 공유중</h2>

<div id="map"></div>

<div class="status" id="status">
GPS 연결중...
</div>

<button onclick="stopTracking()">
위치공유 종료
</button>

<script>

const API_URL =
"https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

let map;
let marker;
let watchId;
let rescuerId =
localStorage.getItem("rescuerId") ||
"TEAM_" + Math.random().toString(36).substr(2,8);

localStorage.setItem("rescuerId", rescuerId);

function initMap(){

  map = new kakao.maps.Map(
    document.getElementById("map"),
    {
      center:new kakao.maps.LatLng(35.1345,126.9902),
      level:4
    }
  );

  marker = new kakao.maps.Marker({
    map:map,
    position:map.getCenter()
  });
}

initMap();

function startTracking(){

  if(!navigator.geolocation){
    alert("GPS 미지원");
    return;
  }

  watchId =
  navigator.geolocation.watchPosition(

    async(position)=>{

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const speed = position.coords.speed || 0;

      document.getElementById("status").innerHTML =
      `
      위도: ${lat}<br>
      경도: ${lng}<br>
      속도: ${speed}
      `;

      const pos = new kakao.maps.LatLng(lat,lng);

      marker.setPosition(pos);
      map.setCenter(pos);

      // 서버 전송
      await fetch(API_URL,{
        method:"POST",
        headers:{
          "Content-Type":"text/plain;charset=utf-8"
        },
        body:JSON.stringify({
          action:"updateRescuer",
          id:rescuerId,
          lat:lat,
          lng:lng,
          speed:speed,
          time:new Date().toISOString()
        })
      });

    },

    (err)=>{
      console.log(err);
      alert("GPS 오류");
    },

    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:5000
    }
  );
}

function stopTracking(){

  if(watchId){
    navigator.geolocation.clearWatch(watchId);
  }

  alert("위치공유 종료");
}

startTracking();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🆘 사고좌표 입력</title>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
:root{
  --primary:#16a34a;
  --primary-dark:#15803d;
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#0f172a;
  --sub:#475569;
  --border:#dbe4ee;
  --shadow:0 10px 25px rgba(0,0,0,.08);
}

/* 🌙 다크모드 */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#020617;
    --card:#0f172a;
    --text:#f8fafc;
    --sub:#94a3b8;
    --border:#1e293b;
    --shadow:0 10px 25px rgba(0,0,0,.4);
  }
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    "Pretendard",
    "Apple SD Gothic Neo",
    sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:18px;
  padding-bottom:110px;
}

/* ================= HEADER ================= */

.header{
  text-align:center;
  margin-bottom:20px;
}

.badge{
  display:inline-block;
  background:rgba(22,163,74,.12);
  color:var(--primary);
  padding:7px 13px;
  border-radius:999px;
  font-size:.85rem;
  font-weight:700;
  margin-bottom:9px;
}

.title{
  font-size:1.8rem;
  margin:0;
  font-weight:900;
}

.subtitle{
  margin-top:7px;
  color:var(--sub);
  font-size:.95rem;
}


/* ================= CARD ================= */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}


/* ================= INPUT & BUTTON ================= */

.ui-control{
  width:100%;
  height:52px;
  border-radius:16px;
  font-size:1rem;
  padding:0 16px;
  margin-top:10px;
  font-weight:700;
  outline:none;
}

input.ui-control{
  border:2px solid var(--border);
  background:transparent;
  color:var(--text);
}

input.ui-control:focus{
  border-color:var(--primary);
}

button.ui-control{
  border:none;
  background:linear-gradient(
    135deg,
    var(--primary),
    var(--primary-dark)
  );
  color:white;
  cursor:pointer;
  transition:.2s;
}

button.ui-control:active{
  transform:scale(.98);
}


/* ================= INFO BOX ================= */

.info-box{
  background:rgba(22,163,74,.08);
  border:1px solid rgba(22,163,74,.2);
  border-radius:18px;
  padding:14px;
  text-align:center;
  margin-top:12px;
}

.coord{
  font-size:1.15rem;
  font-weight:800;
  letter-spacing:.3px;
}

.distance{
  font-size:1.1rem;
  font-weight:800;
  color:var(--primary);
}


/* ================= GUIDE ================= */

.guide{
  margin-top:16px;
  line-height:1.8;
  color:var(--sub);
  font-size:.95rem;
}


/* ================= MAP ================= */

#mapComparison{
  width:100%;
  height:480px;
  border-radius:22px;
  overflow:hidden;
  margin-top:18px;
  border:1px solid var(--border);
}


/* ================= BOTTOM ================= */

.bottom-fixed{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:10px 16px 16px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
}

@media (prefers-color-scheme: dark){
  .bottom-fixed{
    background:rgba(2,6,23,.92);
  }
}


/* ================= SECTION TITLE ================= */

.section-title{
  font-size:1.05rem;
  font-weight:800;
  margin-bottom:5px;
}


/* ================= MOBILE ================= */

@media (max-width:600px){

  body{
    padding:14px;
    padding-bottom:105px;
  }

  .title{
    font-size:1.65rem;
  }

  .card{
    padding:16px;
    border-radius:20px;
  }

  /* 입력창 */
  .ui-control{
    height:50px;
    font-size:.98rem;
  }

  /* 지도는 크게 */
  #mapComparison{
    height:480px;
    border-radius:20px;
  }

  .coord{
    font-size:1.05rem;
  }

  .distance{
    font-size:1.05rem;
  }
}


/* ================= SMALL PHONE ================= */

@media (max-width:380px){

  #mapComparison{
    height:430px;
  }

  .title{
    font-size:1.5rem;
  }

}
</style>
</head>

<body>


<!-- ================= HEADER ================= -->

<div class="header">

  <div class="badge">
    무등산 특수산악구조팀
  </div>

  <h2 class="title">
    🆘 사고좌표 입력
  </h2>

  <div class="subtitle">
    현재 위치와 요구조자 위치를 확인합니다
  </div>

</div>


<!-- ================= 현재 위치 ================= -->

<div class="card">

  <button id="getLocation" class="ui-control">
    📍 내 위치 확인
  </button>

  <div class="info-box">

    <div style="margin-bottom:6px; font-weight:700;">
      현재 좌표
    </div>

    <div class="coord" id="coord">
      위치 미확인
    </div>

  </div>

</div>


<!-- ================= 대상 위치 ================= -->

<div class="card">

  <div class="section-title">
    🌐 요구조자 위치 입력
  </div>


  <input
    type="number"
    step="any"
    inputmode="decimal"
    id="otherLatitude"
    class="ui-control"
    placeholder="위도 입력"
  >


  <input
    type="number"
    step="any"
    inputmode="decimal"
    id="otherLongitude"
    class="ui-control"
    placeholder="경도 입력"
  >


  <button
    onclick="showLocations()"
    class="ui-control"
  >
    📍 지도에서 확인
  </button>


  <div class="info-box">

    <div
      class="distance"
      id="distanceInfo"
    >
      거리 정보 없음
    </div>

  </div>


  <!-- 지도 -->

  <div id="mapComparison"></div>

</div>


<!-- ================= 하단 버튼 ================= -->

<div class="bottom-fixed">

  <button
    id="kakaoRoute"
    class="ui-control"
  >
    🧭 카카오맵 길찾기
  </button>

</div>


<script>

let currentLat;
let currentLng;

let targetLat;
let targetLng;


/* ================= 현재 위치 ================= */

getLocation.onclick = () => {

  if (!navigator.geolocation) {

    alert("이 기기에서는 위치 정보를 사용할 수 없습니다.");

    return;

  }


  navigator.geolocation.getCurrentPosition(

    (pos) => {

      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;


      coord.textContent =
        `${currentLat.toFixed(6)} / ${currentLng.toFixed(6)}`;

    },


    (error) => {

      alert("위치 정보를 가져올 수 없습니다.");

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }

  );

};


/* ================= 길찾기 ================= */

kakaoRoute.onclick = () => {

  if (
    targetLat === undefined ||
    targetLng === undefined
  ){

    alert("대상 위치를 먼저 확인하세요.");

    return;

  }


  location.href =
    `kakaomap://route?ep=${targetLat},${targetLng}&by=FOOT`;

};


/* ================= 지도 표시 ================= */

function showLocations(){

  targetLat =
    parseFloat(
      document.getElementById("otherLatitude").value
    );


  targetLng =
    parseFloat(
      document.getElementById("otherLongitude").value
    );


  /* 좌표 확인 */

  if (
    currentLat === undefined ||
    currentLng === undefined ||
    isNaN(targetLat) ||
    isNaN(targetLng)
  ){

    alert("내 위치 확인 후 요구조자 좌표를 정확히 입력하세요.");

    return;

  }


  /* 위도 범위 */

  if (
    targetLat < -90 ||
    targetLat > 90
  ){

    alert("위도는 -90 ~ 90 사이로 입력하세요.");

    return;

  }


  /* 경도 범위 */

  if (
    targetLng < -180 ||
    targetLng > 180
  ){

    alert("경도는 -180 ~ 180 사이로 입력하세요.");

    return;

  }


  const mapContainer =
    document.getElementById("mapComparison");


  /* 기존 지도 영역 초기화 */

  mapContainer.innerHTML = "";


  /* 지도 생성 */

  const map =
    new kakao.maps.Map(
      mapContainer,
      {

        center:
          new kakao.maps.LatLng(
            targetLat,
            targetLng
          ),

        level:6

      }
    );


  /* 현재 위치 */

  const myPos =
    new kakao.maps.LatLng(
      currentLat,
      currentLng
    );


  /* 요구조자 위치 */

  const targetPos =
    new kakao.maps.LatLng(
      targetLat,
      targetLng
    );


  /* 현재 위치 마커 */

  new kakao.maps.Marker({

    position:myPos,
    map:map

  });


  /* 요구조자 위치 마커 */

  new kakao.maps.Marker({

    position:targetPos,
    map:map

  });


  /* 두 위치를 연결하는 선 */

  const polyline =
    new kakao.maps.Polyline({

      map:map,

      path:[
        myPos,
        targetPos
      ],

      strokeWeight:4,

      strokeColor:"#16a34a",

      strokeOpacity:0.9,

      strokeStyle:"solid"

    });


  /* 직선거리 */

  const distance =
    polyline.getLength();


  distanceInfo.textContent =
    `직선거리 ${(distance / 1000).toFixed(2)} km`;


  /* 두 지점이 모두 보이도록 지도 범위 조정 */

  const bounds =
    new kakao.maps.LatLngBounds();

  bounds.extend(myPos);
  bounds.extend(targetPos);

  map.setBounds(bounds);


  /* 너무 확대되는 것을 방지 */

  setTimeout(() => {

    if(map.getLevel() < 4){

      map.setLevel(4);

    }

  },100);

}


/* =========================
   우클릭 및 개발자도구 단축키 방지
   ========================= */

document.addEventListener(
  'contextmenu',
  function(e){

    e.preventDefault();

    return false;

  }
);


document.addEventListener(
  'keydown',
  function(e){

    /* F12 */

    if(e.key === 'F12'){

      e.preventDefault();

      return false;

    }


    /* Ctrl + U */

    if(
      e.ctrlKey &&
      e.key.toLowerCase() === 'u'
    ){

      e.preventDefault();

      return false;

    }


    /* Ctrl + Shift + I */

    if(
      e.ctrlKey &&
      e.shiftKey &&
      e.key.toLowerCase() === 'i'
    ){

      e.preventDefault();

      return false;

    }


    /* Ctrl + Shift + J */

    if(
      e.ctrlKey &&
      e.shiftKey &&
      e.key.toLowerCase() === 'j'
    ){

      e.preventDefault();

      return false;

    }


    /* Ctrl + Shift + C */

    if(
      e.ctrlKey &&
      e.shiftKey &&
      e.key.toLowerCase() === 'c'
    ){

      e.preventDefault();

      return false;

    }


    /* Ctrl + S */

    if(
      e.ctrlKey &&
      e.key.toLowerCase() === 's'
    ){

      e.preventDefault();

      return false;

    }

  }
);

</script>

</body>
</html>

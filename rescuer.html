<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🆘 GPS 위치파악</title>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
:root{
  --primary:#16a34a;
  --primary-dark:#15803d;
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#0f172a;
  --sub:#475569;
  --border:#dbe4ee;
  --shadow:0 10px 25px rgba(0,0,0,.08);
}

/* 🌙 다크모드 */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#020617;
    --card:#0f172a;
    --text:#f8fafc;
    --sub:#94a3b8;
    --border:#1e293b;
    --shadow:0 10px 25px rgba(0,0,0,.4);
  }
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    "Pretendard",
    "Apple SD Gothic Neo",
    sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:18px;
  padding-bottom:130px;
}

/* ================= HEADER ================= */
.header{
  text-align:center;
  margin-bottom:20px;
}

.badge{
  display:inline-block;
  background:rgba(22,163,74,.12);
  color:var(--primary);
  padding:8px 14px;
  border-radius:999px;
  font-size:.9rem;
  font-weight:700;
  margin-bottom:10px;
}

.title{
  font-size:2rem;
  margin:0;
  font-weight:900;
}

.subtitle{
  margin-top:8px;
  color:var(--sub);
  font-size:1rem;
}

/* ================= CARD ================= */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}

/* ================= INPUT & BUTTON ================= */
.ui-control{
  width:100%;
  height:62px;
  border-radius:18px;
  font-size:1.1rem;
  padding:0 18px;
  margin-top:12px;
  font-weight:700;
  outline:none;
}

input.ui-control{
  border:2px solid var(--border);
  background:transparent;
  color:var(--text);
}

input.ui-control:focus{
  border-color:var(--primary);
}

button.ui-control{
  border:none;
  background:linear-gradient(
    135deg,
    var(--primary),
    var(--primary-dark)
  );
  color:white;
  cursor:pointer;
  transition:.2s;
}

button.ui-control:active{
  transform:scale(.98);
}

/* ================= INFO BOX ================= */
.info-box{
  background:rgba(22,163,74,.08);
  border:1px solid rgba(22,163,74,.2);
  border-radius:20px;
  padding:18px;
  text-align:center;
  margin-top:14px;
}

.coord{
  font-size:1.3rem;
  font-weight:800;
  letter-spacing:.3px;
}

.distance{
  font-size:1.2rem;
  font-weight:800;
  color:var(--primary);
}

/* ================= GUIDE ================= */
.guide{
  margin-top:16px;
  line-height:1.8;
  color:var(--sub);
  font-size:.97rem;
}

/* ================= MAP ================= */
#mapComparison{
  width:100%;
  height:320px;
  border-radius:22px;
  overflow:hidden;
  margin-top:18px;
  border:1px solid var(--border);
}

/* ================= BOTTOM ================= */
.bottom-fixed{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:14px 16px 22px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
}

@media (prefers-color-scheme: dark){
  .bottom-fixed{
    background:rgba(2,6,23,.92);
  }
}

/* ================= SECTION TITLE ================= */
.section-title{
  font-size:1.1rem;
  font-weight:800;
  margin-bottom:6px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="badge">무등산 특수산악구조팀</div>

  <h1 class="title">🆘 GPS 위치파악</h1>

  <div class="subtitle">
    현재 위치와 요구조자 위치를 확인합니다
  </div>
</div>

<!-- 현재 위치 -->
<div class="card">

  <button id="getLocation" class="ui-control">
    📍 내 위치 확인
  </button>

  <div class="info-box">
    <div style="margin-bottom:8px; font-weight:700;">
      현재 좌표
    </div>

    <div class="coord" id="coord">
      위치 미확인
    </div>
  </div>

</div>

<!-- 대상 위치 -->
<div class="card">

  <div class="section-title">
    🌐 요구조자 위치 입력
  </div>

  <input
    type="number"
    step="any"
    inputmode="decimal"
    id="otherLatitude"
    class="ui-control"
    placeholder="위도 입력"
  >

  <input
    type="number"
    step="any"
    inputmode="decimal"
    id="otherLongitude"
    class="ui-control"
    placeholder="경도 입력"
  >

  <button onclick="showLocations()" class="ui-control">
    📍 지도에서 확인
  </button>

  <div class="info-box">
    <div class="distance" id="distanceInfo">
      거리 정보 없음
    </div>
  </div>

  <div id="mapComparison"></div>

</div>

<!-- 하단 버튼 -->
<div class="bottom-fixed">

  <button id="kakaoRoute" class="ui-control">
    🧭 카카오맵 길찾기
  </button>

</div>

<script>
let currentLat, currentLng;
let targetLat, targetLng;

/* ================= 현재 위치 ================= */
getLocation.onclick = () => {

  navigator.geolocation.getCurrentPosition(

    (pos) => {

      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;

      coord.textContent =
        `${currentLat.toFixed(6)} / ${currentLng.toFixed(6)}`;

    },

    () => {
      alert("위치 정보를 가져올 수 없습니다.");
    }

  );

};

/* ================= 길찾기 ================= */
kakaoRoute.onclick = () => {

  if (!targetLat || !targetLng) {
    alert("대상 위치를 먼저 확인하세요.");
    return;
  }

  location.href =
    `kakaomap://route?ep=${targetLat},${targetLng}&by=FOOT`;

};

/* ================= 지도 표시 ================= */
function showLocations(){

  targetLat = parseFloat(otherLatitude.value);
  targetLng = parseFloat(otherLongitude.value);

  if (
    !currentLat ||
    !currentLng ||
    isNaN(targetLat) ||
    isNaN(targetLng)
  ){
    alert("좌표를 정확히 입력하세요.");
    return;
  }

  const mapContainer =
    document.getElementById("mapComparison");

  const map = new kakao.maps.Map(mapContainer, {

    center: new kakao.maps.LatLng(
      targetLat,
      targetLng
    ),

    level:6

  });

  const myPos =
    new kakao.maps.LatLng(currentLat, currentLng);

  const targetPos =
    new kakao.maps.LatLng(targetLat, targetLng);

  /* 현재 위치 마커 */
  new kakao.maps.Marker({
    position: myPos,
    map: map
  });

  /* 대상 위치 마커 */
  new kakao.maps.Marker({
    position: targetPos,
    map: map
  });

  /* 선 */
  const polyline = new kakao.maps.Polyline({

    map: map,

    path: [myPos, targetPos],

    strokeWeight: 4,

    strokeColor: "#16a34a",

    strokeOpacity: 0.9,

    strokeStyle: "solid"

  });

  /* 거리 */
  const distance =
    polyline.getLength();

  distanceInfo.textContent =
    `직선거리 ${(distance / 1000).toFixed(2)} km`;

}
</script>

</body>
</html>
